<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedal Rally</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
  /* Layout: full-bleed landscape game box (turned sideways on upright phones). Pause, timer and level badge
     across the top; each half of the screen is a touch zone with a faint chevron; menus sit on a blurred veil. */
  :root {
    --sky-top: #5ec8ff;
    --sky-low: #c9f1ff;
    --cloud: #ffffff;
    --mount-far-light: #7cc9fa;
    --mount-far-dark: #55b2f2;
    --mount-light: #2fa3f5;
    --mount-dark: #1677d9;
    --water: #19c6f0;
    --water-top: #e9fbff;
    --grass: #5fe05a;
    --grass-dark: #36b23f;
    --block: #f8c9b6;
    --block-side: #e3a48f;
    --speck: #efb4a0;
    --plank: #b8606f;
    --plank-top: #d98a94;
    --plank-dark: #8e4352;
    --post: #b65a6a;
    --post-side: #8e4352;
    --post-light: #e9a6b0;
    --truck: #ffd21f;
    --truck-shade: #e0a800;
    --truck-dark: #c78f00;
    --cab: #d3d6dc;
    --cab-shade: #a3a7b0;
    --glass: #2b3647;
    --tire: #26262b;
    --tire-side: #3c3c43;
    --hub: #a5abb5;
    --light: #fff6c2;
    --tail: #ff5a4f;
    --dust: #d8d2ca;
    --check-dark: #1b1b22;
    --check-light: #ffffff;
    --sign: #ffffff;
    --ink: #ffffff;
    --outline: #1d3557;
    --navy: #1f2d44;
    --paper: #ffffff;
    --paper-ink: #5b6472;
    --panel: rgba(255, 255, 255, 0.94);
    --bar-grey: #8b96a4;
    --bar-grey-dark: #6c7684;
    --bar-blue: #1e8cff;
    --bar-blue-dark: #0f6fd6;
    --bar-edge: #2a3444;
    --veil: rgba(120, 200, 255, 0.18);
    --shadow: rgba(16, 40, 70, 0.35);
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky-top);
    color: var(--navy);
    font-family: var(--font-body);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--bar-blue); outline-offset: 3px; }

  /* Everything lives in one box. On an upright phone the box is turned 90° so the game plays sideways. */
  #game { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; container: game / size; }
  #game.sideways { transform-origin: 0 0; }
  #world, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { z-index: 6; pointer-events: none; }

  .outlined {
    color: var(--ink);
    text-shadow:
      0 4px 0 var(--outline), 2px 2px 0 var(--outline), -2px 2px 0 var(--outline),
      2px -2px 0 var(--outline), -2px -2px 0 var(--outline), 3px 0 0 var(--outline),
      -3px 0 0 var(--outline), 0 3px 0 var(--outline), 0 -3px 0 var(--outline);
  }

  /* Touch zones: the left half brakes and reverses, the right half drives. */
  .zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 1;
    display: flex;
    align-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    touch-action: none;
  }
  .zone--left { left: 0; justify-content: flex-start; padding-left: max(18px, env(safe-area-inset-left, 0px)); }
  .zone--right { right: 0; justify-content: flex-end; padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .zone svg {
    width: clamp(34px, 6cqw, 56px);
    height: clamp(34px, 6cqw, 56px);
    fill: none;
    stroke: currentColor;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.5;
    filter: drop-shadow(0 2px 0 var(--shadow));
    transition: opacity 0.08s, transform 0.08s;
  }
  .zone.on svg { opacity: 1; transform: scale(1.15); }

  .hud {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    pointer-events: none;
  }
  .hud-left { justify-self: start; pointer-events: auto; }
  .hud-right { justify-self: end; display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .clock { font: 400 clamp(28px, 4.6cqw, 42px)/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .icon-btn {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 3px solid var(--bar-edge);
    border-radius: 12px;
    background: var(--panel);
    color: var(--navy);
    box-shadow: 0 3px 0 var(--shadow);
    cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .vs-btn { font: 400 18px/1 var(--font-display); color: var(--tail); letter-spacing: 0.02em; }
  .badge {
    padding: 10px 12px;
    border: 3px solid var(--bar-edge);
    border-radius: 12px;
    background: var(--bar-blue);
    color: var(--ink);
    box-shadow: 0 3px 0 var(--shadow);
    font: 400 17px/1 var(--font-display);
    letter-spacing: 0.02em;
  }

  .toast {
    position: absolute;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 20cqh);
    z-index: 2;
    transform: translate(-50%, 0) scale(0.8);
    opacity: 0;
    font: 400 clamp(28px, 5cqw, 46px)/1 var(--font-display);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.25s cubic-bezier(.2, 1.6, .4, 1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3.5cqh, 24px);
    padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--veil);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
  .screen { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; min-height: 0; }
  .logo { margin: 0; font: 400 clamp(46px, 9cqw, 86px)/1 var(--font-display); text-align: center; text-wrap: balance; }
  .tagline {
    margin: 0;
    max-width: 46ch;
    padding: 10px 16px;
    border: 3px solid var(--bar-edge);
    border-radius: 14px;
    background: var(--panel);
    font: 800 clamp(14px, 1.9cqw, 17px)/1.45 var(--font-body);
    text-align: center;
  }
  .screen-title { margin: 0; font: 400 clamp(32px, 5.5cqw, 50px)/1 var(--font-display); }

  /* The result card is a tilted instant photo of the moment the run ended. */
  .polaroid {
    margin: 0;
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 10px 10px 12px;
    border-radius: 4px;
    background: var(--paper);
    box-shadow: 0 8px 0 var(--shadow), 0 18px 40px var(--shadow);
    transform: rotate(-4deg);
    animation: pop 0.45s cubic-bezier(.2, 1.5, .4, 1) both;
  }
  .polaroid img {
    display: block;
    height: clamp(110px, 42cqh, 280px);
    width: auto;
    max-width: 70cqw;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: var(--sky-low);
  }
  .polaroid figcaption { display: grid; justify-items: center; gap: 3px; }
  .photo-time { font: 400 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .photo-title { font: 400 20px/1 var(--font-display); color: var(--paper-ink); letter-spacing: 0.02em; }
  .photo-note { font: 800 13px/1.2 var(--font-body); color: var(--paper-ink); }
  @keyframes pop {
    from { transform: rotate(10deg) scale(0.4); opacity: 0; }
    to { transform: rotate(-4deg) scale(1); opacity: 1; }
  }

  .level-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .level-card {
    width: min(250px, 40cqw);
    display: grid;
    gap: 4px;
    padding: 14px 16px;
    border: 3px solid var(--bar-edge);
    border-radius: 16px;
    background: var(--panel);
    color: var(--navy);
    box-shadow: 0 5px 0 var(--shadow);
    text-align: left;
    cursor: pointer;
  }
  .level-card b { font: 400 26px/1 var(--font-display); color: var(--bar-blue); }
  .level-card span { font: 800 14px/1.3 var(--font-body); }
  .level-card small { font: 700 13px/1.2 var(--font-body); color: var(--paper-ink); }
  .level-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }

  .bar { display: flex; border: 3px solid var(--bar-edge); border-radius: 14px; overflow: hidden; box-shadow: 0 5px 0 var(--shadow); }
  .bar-btn {
    display: grid;
    justify-items: center;
    gap: 3px;
    min-width: clamp(76px, 11cqw, 108px);
    padding: 9px 12px 8px;
    border: 0;
    background: linear-gradient(var(--bar-grey), var(--bar-grey-dark));
    color: var(--ink);
    font: 400 16px/1 var(--font-display);
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .bar-btn + .bar-btn { box-shadow: inset 2px 0 0 var(--bar-edge); }
  .bar-btn--main { background: linear-gradient(var(--bar-blue), var(--bar-blue-dark)); }
  .bar-btn svg { width: 26px; height: 26px; fill: currentColor; }
  .bar-btn:active { filter: brightness(0.9); }

  @media (prefers-reduced-motion: reduce) {
    .polaroid { animation: none; }
    .zone svg, .toast { transition: none; }
  }
</style>
</head>
<body>
<div id="game">
<canvas id="world" aria-label="A yellow monster truck on a blocky island course with a plank bridge over water"></canvas>

<button class="zone zone--left" id="zone-left" type="button" tabindex="-1" aria-label="Back (brake, then reverse)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
</button>
<button class="zone zone--right" id="zone-right" type="button" tabindex="-1" aria-label="Forward">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg>
</button>

<div class="hud">
  <div class="hud-left">
    <button class="icon-btn" id="btn-pause" type="button" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    </button>
  </div>
  <div class="clock outlined" id="hud-main">0:00.00</div>
  <div class="hud-right">
    <span class="badge" id="hud-level">Level 1</span>
    <button class="icon-btn vs-btn" id="btn-vs" type="button" aria-label="Versus (coming later)" aria-disabled="true">VS</button>
    <button class="icon-btn" id="btn-sound" type="button" aria-label="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="sound-icon" d=""/></svg>
    </button>
  </div>
</div>
<div class="toast outlined" id="toast" aria-live="polite"></div>

<div class="overlay" id="overlay">
  <div class="screen" id="screen-home">
    <h1 class="logo outlined">Pedal Rally</h1>
    <p class="tagline">Two arrows, no steering. Hold → or tap the right side to drive, ← or the left side to brake and reverse. In the air they tip the truck. Land on your wheels!</p>
  </div>
  <div class="screen" id="screen-photo" hidden>
    <figure class="polaroid">
      <img id="photo-img" alt="The moment the run ended">
      <figcaption>
        <span class="photo-time outlined" id="photo-time">0:00.00</span>
        <span class="photo-title" id="photo-title">Victory</span>
        <span class="photo-note" id="photo-note"></span>
      </figcaption>
    </figure>
  </div>
  <div class="screen" id="screen-levels" hidden>
    <h2 class="screen-title outlined">Levels</h2>
    <div class="level-list">
      <button class="level-card" id="pick-1" type="button"><b>Level 1</b><span>Hill, plank bridge, finish</span><small id="pick-1-note"></small></button>
      <button class="level-card" id="pick-2" type="button"><b>Level 2+</b><span>Endless road, harder every 200 m</span><small id="pick-2-note"></small></button>
    </div>
  </div>
  <div class="screen" id="screen-pause" hidden>
    <h2 class="screen-title outlined">Paused</h2>
  </div>
  <nav class="bar" aria-label="Menu">
    <button class="bar-btn" id="bar-a" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg><span></span></button>
    <button class="bar-btn bar-btn--main" id="bar-b" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg><span></span></button>
    <button class="bar-btn" id="bar-c" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg><span></span></button>
  </nav>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
</div>

<script>
(() => {
  'use strict';

  // ---------- Palette (read from the CSS tokens) ----------
  const css = getComputedStyle(document.documentElement);
  const tok = (n) => css.getPropertyValue(n).trim();
  const COL = {};
  ['sky-top', 'sky-low', 'cloud', 'mount-far-light', 'mount-far-dark', 'mount-light', 'mount-dark', 'water', 'water-top',
   'grass', 'grass-dark', 'block', 'block-side', 'speck', 'plank', 'plank-top', 'plank-dark', 'post', 'post-side', 'post-light',
   'truck', 'truck-shade', 'truck-dark', 'cab', 'cab-shade', 'glass', 'tire', 'tire-side', 'hub', 'light', 'tail', 'dust',
   'check-dark', 'check-light', 'sign', 'outline', 'paper', 'bar-blue']
    .forEach((n) => { COL[n] = tok('--' + n); });

  // ---------- Helpers ----------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  function mulberry32(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- Physics constants (metres, seconds, kilograms) ----------
  const DT = 1 / 480;
  const GRAV = -11;
  const CAR_M = 180, CAR_I = 150, DRAG = 0.35;
  const WHEEL_R = 0.45, WHEEL_M = 18, WHEEL_I = 0.6 * WHEEL_M * WHEEL_R * WHEEL_R;
  const KX = 42000, CX = 1400;          // suspension, along the car (stiff)
  const KY = 8500, CY = 850;            // suspension, up/down (soft)
  const KB = 90000, TRAVEL = 0.24;      // bump stops
  const TORQUE = 300, SMAX = 64;        // per wheel, both wheels driven
  const BRAKE_T = 700, REV_T = 160, RMAX = 18, ROLL = 0.25;
  const REACT = 0.75;                   // share of wheel torque that tips the body (wheelies)
  const AIR_ACC = 5.5, AIR_WMAX = 4.5;  // air control
  const MU_TIRE = 1.15, MU_BODY = 0.5;
  const START_X = 8;
  // A new level starts every LEVEL_LEN metres. Difficulty d grows with distance: 0 at the start,
  // 1 at level 7 (1200 m), and keeps rising to MAX_D so the far road stays hard but jumpable.
  const LEVEL_LEN = 200, MAX_D = 1.6;
  const difficultyAt = (x) => Math.min(MAX_D, Math.max(0, x - START_X) / (LEVEL_LEN * 6));

  // Level 1 is a fixed 50 m course on islands in the sea: a start arch, a hill, flat ground, a plank bridge
  // over the water, the finish strip, then an arch at the end of the island that stops the truck.
  const L1 = { len: 50, hill0: 13, hill1: 26, hillH: 2.4, bridge0: 30, bridge1: 42, finish: START_X + 50, gate: START_X + 59, lake: START_X + 60.2, arch0: 3.2, sea: -1.6 };
  const LOG_R = 0.15, BR_N = 20, BR_M = 10;   // bridge: half the log thickness, number of rope links, mass per log
  const GATE_K = 60000, GATE_C = 6000;        // end arch padding: spring and damping

  // Body outline (local coords, x forward, y up). Third value marks the roll cage: touching ground there = crash.
  const TUB = [[-1.65, -0.30], [1.70, -0.30], [1.80, 0.10], [1.10, 0.32], [-0.75, 0.32], [-1.72, 0.26]];
  const HULL = [
    [-1.65, -0.30, 0], [1.70, -0.30, 0], [1.80, 0.10, 0], [1.10, 0.32, 0], [-1.72, 0.26, 0], [0, -0.32, 0],
    [-0.45, 1.08, 1], [0.35, 1.08, 1], [-0.05, 1.10, 1],
  ];
  const HEAD = { x: -0.12, y: 0.80, r: 0.22 };
  const ANCHORS = [[-1.2, -0.5], [1.2, -0.5]];

  // ---------- Terrain ----------
  const DX = 0.5;
  let H, feats, pits, nextFeatX, fIdx, rng, P1, P2, P3;

  function baseH(x) {
    const ramp = smooth((x - 25) / 70);
    const grow = 1 + Math.min(2, Math.max(0, x) / 1000);
    return ramp * grow * (2.4 * Math.sin(0.017 * x + P1) + 1.0 * Math.sin(0.043 * x + P2) + 0.35 * Math.sin(0.12 * x + P3));
  }
  const R = (a, b) => a + (b - a) * rng();
  const RI = (a, b) => Math.floor(R(a, b + 1));

  const MAKERS = {
    bump(x, d) {
      const L = R(3, 5), A = R(0.45, 0.9) + 0.5 * d;
      return { x0: x, x1: x + L, fn: (u, h) => h + A * Math.sin(Math.PI * u / L) ** 2 };
    },
    rock(x, d) {
      const L = R(1.6, 3.2), A = R(0.35, 0.7) + 0.45 * d, e = 0.45;
      return { x0: x, x1: x + L, fn: (u, h) => h + A * Math.min(smooth(u / e), smooth((L - u) / e)) };
    },
    logs(x, d) {
      const n = RI(3, 5) + Math.floor(2 * d), S = R(2.2, 3.0), r = R(0.28, 0.42) + 0.12 * d;
      return {
        x0: x, x1: x + n * S,
        fn: (u, h) => { const c = (Math.floor(u / S) + 0.5) * S, dd = u - c; return Math.abs(dd) < r ? h + Math.sqrt(r * r - dd * dd) : h; },
      };
    },
    hill(x, d) {
      const L = R(24, 40), A = R(2.5, 4.5) + 4 * d;
      return { x0: x, x1: x + L, fn: (u, h) => h + A * 0.5 * (1 - Math.cos(2 * Math.PI * u / L)) };
    },
    ramp(x, d) {
      const L = R(6, 9), A = R(1.2, 2.0) + 0.8 * d;
      return { x0: x, x1: x + L, fn: (u, h) => h + A * Math.pow(u / L, 1.6) };
    },
    pit(x, d) {
      const L = R(7, 9), A = R(1.4, 2.0), G = R(4, 6.5) + 3.5 * d, LL = 8;
      // A landing side much higher than the ramp lip would make the jump impossible.
      if (baseH(x + L + G) - baseH(x + L) > 0.4) return MAKERS.ramp(x, d);
      const floor = Math.min(baseH(x + L), baseH(x + L + G / 2), baseH(x + L + G)) - 2.8;
      pits.push({ x0: x + L, x1: x + L + G, floor, water: floor + 1.6 });
      return {
        x0: x, x1: x + L + G + LL,
        fn: (u, h) => {
          if (u < L) return h + A * Math.pow(u / L, 1.4);
          if (u < L + G) return floor;
          return h + 0.65 * A * (1 - (u - L - G) / LL);
        },
      };
    },
    steps(x, d) {
      const n = RI(3, 5) + Math.floor(2 * d), sH = R(0.3, 0.45) + 0.15 * d, T = R(2.2, 3.0), down = 12;
      return {
        x0: x, x1: x + n * T + down,
        fn: (u, h) => {
          if (u < n * T) { const k = Math.floor(u / T); return h + sH * (k + smooth((u - k * T) / 0.35)); }
          return h + n * sH * (1 - (u - n * T) / down);
        },
      };
    },
    // Two or three rocks close together: no room to settle between them.
    rocks(x, d) {
      const n = d > 1 && rng() < 0.5 ? 3 : 2, parts = [];
      let cx = x;
      for (let k = 0; k < n; k++) { const f = MAKERS.rock(cx, d); parts.push(f); cx = f.x1 + R(2.5, 4.5); }
      return {

  function addFeature() {
    const x = nextFeatX, d = difficultyAt(x);

    const chain = rng() < 0.35 * d;

  function level1H(x) {
    if (x < 2) return -3.5;                          // sea before the start island

  // The bridge is a chain of logs tied with rope, pinned at both banks. Each log is a point mass; the
  // rope links are kept at a fixed length by repeated position corrections, so the bridge sags and swings.
  let bridge = null;
  function makeBridge(x0, x1, y) {
    const nodes = [];

    const bvy = (a.pin ? 0 : a.vy) * (1 - ct.t) + (b.pin ? 0 : b.vy) * ct.t;

  let airT = 0, airRot = 0, tipT = 0, lastProgressX = 0, lastProgressT = 0, stuckShown = false;
  let simTime = 0, shake = 0;

    rng = mulberry32((Math.random() * 2 ** 31) | 0);

    H = []; feats = []; pits = []; nextFeatX = 45; fIdx = 0; bridge = null; gatePush = 0;

      pits.push({ x0: L1.lake + 0.3, x1: Infinity, floor: -3.5, water: L1.sea });

    if (!reduceMotion) shake = 0.5;

  // ---------- Rendering ----------

  const canvas = $('world'), ctx = canvas.getContext('2d');

  function resize() {

    W = sideways ? vh : vw; HS = sideways ? vw : vh;

  // A slight 3D look: the road has depth, and its far edge is drawn DEPTH metres up and to the right of the

  const DEPTH = { x: 0.7, y: 0.9 };
  const ARCH_H = 2.4;
  const sx = (x) => (x - cam.x) * PX + W / 2;
  const sy = (y) => HS / 2 - (y - cam.y) * PX;
  const poly = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill(); };

  function cloud(x, y, s) {
    ctx.fillStyle = COL.cloud;
    ctx.fillRect(x, y, 120 * s, 20 * s);
    ctx.fillRect(x + 22 * s, y - 16 * s, 58 * s, 17 * s);
    ctx.fillRect(x + 74 * s, y + 19 * s, 76 * s, 14 * s);
  }

  // Big faceted mountains: each one has a lit left face and a shaded right face.
  function mountains(par, baseY, maxH, light, dark, seed) {
    const span = Math.max(240, W * 0.4), off = cam.x * PX * par;
    for (let k = Math.floor((off - span) / span); k * span - off < W + span; k++) {
      const h = maxH * (0.5 + 0.5 * hash(k * 7.3 + seed));
      const cx = k * span - off + span * 0.5 * hash(k * 3.1 + seed);
      const wl = span * (0.55 + 0.4 * hash(k + seed * 2)), wr = span * (0.5 + 0.4 * hash(k * 5 + seed));
      const foot = cx + (wr - wl) * 0.2;
      ctx.fillStyle = light; poly([[cx - wl, baseY], [cx, baseY - h], [foot, baseY]]);
      ctx.fillStyle = dark; poly([[cx, baseY - h], [cx + wr, baseY], [foot, baseY]]);
    }
  }

  function drawBackdrop() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, HS);
    sky.addColorStop(0, COL['sky-top']); sky.addColorStop(1, COL['sky-low']);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HS);
    const cs = Math.max(0.6, Math.min(1.3, HS / 520)), span = W / 3 + 180, total = span * 6;
    for (let k = 0; k < 6; k++) {
      let x = k * span - ((cam.x * PX * 0.03 + simTime * 8) % total);
      if (x < -220 * cs) x += total;
      cloud(x, HS * (0.06 + 0.2 * hash(k + 1)), cs * (0.7 + 0.6 * hash(k + 5)));
    }
    mountains(0.05, HS * 0.7, HS * 0.42, COL['mount-far-light'], COL['mount-far-dark'], 2.7);
    mountains(0.12, HS * 0.76, HS * 0.5, COL['mount-light'], COL['mount-dark'], 9.1);
    // Open water reaching to the mountains
    ctx.fillStyle = COL.water; ctx.fillRect(0, HS * 0.73, W, HS);
    ctx.strokeStyle = COL['water-top']; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, HS * 0.73); ctx.lineTo(W, HS * 0.73); ctx.stroke();
  }

  // Ground as blocks: a darker copy pushed back by the road depth gives the side faces, grass covers the
  // top, and the pink front face sits in front. Steep drops break the grass so walls stay pink.
  function drawGround(i0, i1, bottom) {
    const dx = DEPTH.x, dy = DEPTH.y;
    ctx.fillStyle = COL['block-side'];
    ctx.beginPath(); ctx.moveTo(i0 * DX + dx, bottom);
    for (let i = i0; i <= i1; i++) ctx.lineTo(i * DX + dx, H[i] + dy);
    ctx.lineTo(i1 * DX + dx, bottom); ctx.closePath(); ctx.fill();

    const runs = [];
    let start = -1;
    for (let i = i0; i < i1; i++) {
      const steep = Math.abs(H[i + 1] - H[i]) > 1.2;
      if (!steep && start < 0) start = i;
      if (steep && start >= 0) { runs.push([start, i]); start = -1; }
    }
    if (start >= 0) runs.push([start, i1]);

    ctx.fillStyle = COL.grass;
    for (const [a, b] of runs) {
      if (b <= a) continue;
      ctx.beginPath();
      for (let i = a; i <= b; i++) ctx.lineTo(i * DX, H[i]);
      for (let i = b; i >= a; i--) ctx.lineTo(i * DX + dx, H[i] + dy);
      ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = COL.block;
    ctx.beginPath(); ctx.moveTo(i0 * DX, bottom);
    for (let i = i0; i <= i1; i++) ctx.lineTo(i * DX, H[i]);
    ctx.lineTo(i1 * DX, bottom); ctx.closePath(); ctx.fill();

    ctx.fillStyle = COL.speck;
    for (let i = i0; i <= i1; i++) {
      if (hash(i) < 0.2) {
        const y = H[i] - 0.5 - hash(i + 7) * 3;
        if (y > bottom) ctx.fillRect(i * DX + hash(i + 3) * 0.3, y, 0.16, 0.16);
      }
    }

    // Grass lip: a darker zigzag fringe hanging over the front edge
    ctx.fillStyle = COL['grass-dark'];
    for (const [a, b] of runs) {
      if (b <= a) continue;
      ctx.beginPath();
      for (let i = a; i <= b; i++) ctx.lineTo(i * DX, H[i] + 0.02);
      for (let i = b; i >= a; i--) ctx.lineTo(i * DX, H[i] - (i % 2 ? 0.1 : 0.2));
      ctx.closePath(); ctx.fill();
    }
  }

  // A square post standing at depth f across the road (0 = near edge, 1 = far edge).
  function drawPost(x, y0, f, h, w) {
    const px = x + DEPTH.x * f, py = y0 + DEPTH.y * f, sd = 0.2;
    ctx.fillStyle = COL['post-side'];
    poly([[px + w / 2, py], [px + w / 2 + DEPTH.x * sd, py + DEPTH.y * sd], [px + w / 2 + DEPTH.x * sd, py + h + DEPTH.y * sd], [px + w / 2, py + h]]);
    ctx.fillStyle = COL.post; ctx.fillRect(px - w / 2, py, w, h);
    ctx.fillStyle = COL['post-light'];
    poly([[px - w / 2, py + h], [px + w / 2, py + h], [px + w / 2 + DEPTH.x * sd, py + h + DEPTH.y * sd], [px - w / 2 + DEPTH.x * sd, py + h + DEPTH.y * sd]]);
    ctx.strokeStyle = COL['post-light']; ctx.lineWidth = 0.05;
    ctx.strokeRect(px - w * 0.32, py + 0.22, w * 0.64, w * 0.64);
    ctx.fillRect(px - w * 0.11, py + 0.22 + w * 0.21, w * 0.22, w * 0.22);
  }
  // An arch: two posts, one each side of the road, joined by a bar over the top.
  // The far post goes behind the truck; the bar and near post go in front of it.
  function drawArch(x, near) {
    const y0 = groundAt(x), w = 0.32;
    if (!near) { drawPost(x, y0, 1, ARCH_H, w); return; }
    const top = y0 + ARCH_H, t = 0.3, l = x - w / 2, r = x + w / 2;
    ctx.fillStyle = COL.post;
    poly([[l, top - t], [l, top], [l + DEPTH.x, top + DEPTH.y], [l + DEPTH.x, top - t + DEPTH.y]]);
    ctx.fillStyle = COL['post-light'];
    poly([[l, top], [r, top], [r + DEPTH.x, top + DEPTH.y], [l + DEPTH.x, top + DEPTH.y]]);
    drawPost(x, y0, 0, ARCH_H, w);
  }

  // Signpost with a white arrow pointing the way, on the far side of the road
  function drawSign(x) {
    const y0 = groundAt(x), px = x + DEPTH.x, py = y0 + DEPTH.y;
    ctx.fillStyle = COL.post; ctx.fillRect(px - 0.07, py, 0.14, 1.7);
    ctx.save();
    ctx.translate(px + 0.1, py + 1.75); ctx.rotate(0.55);
    ctx.fillStyle = COL.outline;
    poly([[-0.62, -0.17], [0.22, -0.17], [0.22, -0.38], [0.68, 0], [0.22, 0.38], [0.22, 0.17], [-0.62, 0.17]]);
    ctx.fillStyle = COL.sign;
    poly([[-0.55, -0.1], [0.27, -0.1], [0.27, -0.26], [0.58, 0], [0.27, 0.26], [0.27, 0.1], [-0.55, 0.1]]);
    ctx.restore();
  }

  // Checkered finish strip lying across the road surface
  function drawFinishStrip(x) {
    const y0 = groundAt(x), sq = 0.45, rows = 4, x0 = x - sq;
    for (let col = 0; col < 2; col++) {
      for (let row = 0; row < rows; row++) {
        const bx = x0 + col * sq + DEPTH.x * row / rows, by = y0 + DEPTH.y * row / rows;
        ctx.fillStyle = (col + row) % 2 ? COL['check-dark'] : COL['check-light'];
        poly([[bx, by], [bx + sq, by], [bx + sq + DEPTH.x / rows, by + DEPTH.y / rows], [bx + DEPTH.x / rows, by + DEPTH.y / rows]]);
      }
    }
  }

  // Bridge planks as blocks: a lighter top face reaching across the road, then the front face.
  function drawBridge() {
    const ns = bridge.nodes, w = bridge.seg * 0.92, h = LOG_R * 2;
    const pl = ns.map((n, i) => {
      const a = ns[Math.max(0, i - 1)], b = ns[Math.min(ns.length - 1, i + 1)];
      const ang = Math.atan2(b.y - a.y, b.x - a.x), c = Math.cos(ang), s = Math.sin(ang);
      const hw = w / 2, hh = h / 2;
      return {
        tl: [n.x - c * hw - s * hh, n.y - s * hw + c * hh], tr: [n.x + c * hw - s * hh, n.y + s * hw + c * hh],
        br: [n.x + c * hw + s * hh, n.y + s * hw - c * hh], bl: [n.x - c * hw + s * hh, n.y - s * hw - c * hh],
      };
    });
    // Posts at both banks, down into the water
    for (const x of [L1.bridge0 + 0.25, L1.bridge1 - 0.25]) drawPost(x, L1.sea - 0.5, 0.5, 0.2 - L1.sea, 0.3);
    ctx.fillStyle = COL['plank-top'];
    for (const p of pl) poly([p.tl, p.tr, [p.tr[0] + DEPTH.x, p.tr[1] + DEPTH.y], [p.tl[0] + DEPTH.x, p.tl[1] + DEPTH.y]]);
    ctx.strokeStyle = COL['plank-dark']; ctx.lineWidth = 0.04;
    for (const p of pl) {
      ctx.fillStyle = COL.plank; poly([p.tl, p.tr, p.br, p.bl]); ctx.stroke();
    }
  }

  // The truck is drawn in slices from the far side to the near side, so it looks like a solid block.
  const CAR_LAYERS = [0.74, 0.65, 0.56, 0.47, 0.38, 0.3];
  function truckShape(face) {
    const body = face ? COL.truck : COL['truck-shade'], cab = face ? COL.cab : COL['cab-shade'];
    ctx.fillStyle = COL.tire; ctx.fillRect(-1.3, -0.45, 2.6, 0.22);
    ctx.fillStyle = body;
    ctx.fillRect(-1.75, -0.25, 3.55, 0.6);
    ctx.fillRect(-0.85, 0.3, 1.35, 0.7);
    ctx.fillStyle = cab; ctx.fillRect(-1.32, 0.3, 0.62, 0.74);
    if (!face) return;
    ctx.fillStyle = COL['truck-dark']; ctx.fillRect(-1.75, -0.25, 3.55, 0.1);
    ctx.fillStyle = COL.glass; ctx.fillRect(0.02, 0.47, 0.38, 0.36);
    ctx.fillStyle = COL.light; ctx.fillRect(1.62, 0.1, 0.18, 0.14);
    ctx.fillStyle = COL.tail; ctx.fillRect(-1.75, 0.1, 0.12, 0.14);
  }
  function drawWheel(w, f, far) {
    for (const layer of [f + 0.07, f]) {
      const front = layer === f;
      ctx.save();
      ctx.translate(w.x + DEPTH.x * layer, w.y + DEPTH.y * layer);
      ctx.rotate(w.phi);
      ctx.fillStyle = front && !far ? COL.tire : COL['tire-side'];
      ctx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; ctx.lineTo(Math.cos(a) * 0.52, Math.sin(a) * 0.52); }
      ctx.closePath(); ctx.fill();
      if (front) {
        ctx.fillStyle = far ? COL.tire : COL['tire-side'];
        for (let k = 0; k < 8; k++) { ctx.save(); ctx.rotate(k * Math.PI / 4); ctx.fillRect(0.36, -0.08, 0.14, 0.16); ctx.restore(); }
        ctx.fillStyle = far ? COL['cab-shade'] : COL.hub; ctx.fillRect(-0.17, -0.17, 0.34, 0.34);
      }
      ctx.restore();
    }
  }
  function drawCar() {
    for (const w of wheels) drawWheel(w, 0.8, true);
    CAR_LAYERS.forEach((f, k) => {
      ctx.save();
      ctx.translate(car.x + DEPTH.x * f, car.y + DEPTH.y * f);
      ctx.rotate(car.a);
      truckShape(k === CAR_LAYERS.length - 1);
      ctx.restore();
    });
    for (const w of wheels) drawWheel(w, 0.16, false);
  }

  function render() {
    drawBackdrop();
    let ox = 0, oy = 0;
    if (shake > 0) { ox = (Math.random() - 0.5) * shake * 0.6; oy = (Math.random() - 0.5) * shake * 0.6; }
    ctx.setTransform(PX * dpr, 0, 0, -PX * dpr, (W / 2 - (cam.x + ox) * PX) * dpr, (HS / 2 + (cam.y + oy) * PX) * dpr);
    const halfW = W / 2 / PX, halfH = HS / 2 / PX;
    const left = cam.x - halfW - 2, right = cam.x + halfW + 2, bottom = cam.y - halfH - 2;
    const i0 = Math.max(0, Math.floor(left / DX)), i1 = Math.ceil(right / DX) + 1;
    extend(i1 + 1);

    drawGround(i0, i1, bottom);

    const posts = [];
    if (mode === 'endless') {
      for (const p of pits) {
        if (p.x1 < left || p.x0 > right) continue;
        const wx0 = Math.max(p.x0 - 0.6, left), wx1 = Math.min(p.x1 + 0.6, right);
        ctx.fillStyle = COL.water; ctx.fillRect(wx0, p.floor - 0.5, wx1 - wx0, p.water - p.floor + 0.5);
        ctx.fillStyle = COL['water-top']; ctx.fillRect(wx0, p.water - 0.06, wx1 - wx0, 0.12);
      }
      // Distance posts every 50 m (level posts every 200 m), plus a flag at your best
      for (let k = Math.max(1, Math.ceil((left - START_X) / 50)); START_X + k * 50 < right; k++) {
        const m = k * 50, isLevel = m % LEVEL_LEN === 0;
        posts.push([START_X + m, isLevel ? 'Level ' + (m / LEVEL_LEN + 2) : m + ' m']);
      }
      if (best > 0 && START_X + best > left && START_X + best < right) posts.push([START_X + best, 'Best']);
      for (const [x] of posts) {
        const g = groundAt(x);
        ctx.fillStyle = COL.post; ctx.fillRect(x + DEPTH.x - 0.06, g + DEPTH.y, 0.12, 2.0);
        ctx.fillStyle = COL.sign; poly([[x + DEPTH.x + 0.06, g + DEPTH.y + 2.0], [x + DEPTH.x + 1.0, g + DEPTH.y + 1.75], [x + DEPTH.x + 0.06, g + DEPTH.y + 1.5]]);
      }
    } else {
      drawBridge();
      drawFinishStrip(L1.finish);
      drawSign(START_X + 3);
      drawArch(L1.arch0, false);
      drawArch(L1.gate + 0.16, false);
    }

    ctx.fillStyle = COL.dust;
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.col;
      const s = p.size * (1 + p.life);
      ctx.fillRect(p.x + DEPTH.x * 0.5 - s, p.y + DEPTH.y * 0.5 - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
    drawCar();
    if (mode === 'level1') { drawArch(L1.arch0, true); drawArch(L1.gate + 0.16, true); }

    // Screen space: the sea in front of the blocks (Level 1), and post labels (endless)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'level1') {
      const y = sy(L1.sea);
      if (y < HS) {
        ctx.fillStyle = COL.water; ctx.fillRect(0, y, W, HS - y);
        ctx.strokeStyle = COL['water-top']; ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, y + 2 * Math.sin(x * 0.04 + simTime * 2.5));
        ctx.stroke();
      }
    }
    ctx.font = '400 15px "Lilita One", sans-serif';
    ctx.textBaseline = 'bottom';
    for (const [x, label] of posts) {
      const g = groundAt(x);
      ctx.fillStyle = COL.outline;
      ctx.fillText(label, sx(x + DEPTH.x) + 5, sy(g + DEPTH.y + 2.1) + 1);
      ctx.fillStyle = COL.sign;
      ctx.fillText(label, sx(x + DEPTH.x) + 4, sy(g + DEPTH.y + 2.1));
    }
  }

  // ---------- Confetti for a win ----------
  const confetti = [];
  let fxDirty = false;
  function burstConfetti() {
    if (reduceMotion) return;
    for (let i = 0; i < 150; i++) {
      confetti.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.25, y: HS * 0.4,
        vx: (Math.random() - 0.5) * 560, vy: -140 - Math.random() * 520,
        r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 14,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, col: Math.random() < 0.55 ? COL['bar-blue'] : COL.paper,
      });
    }
  }
  function drawConfetti(dt) {
    if (!confetti.length && !fxDirty) return;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.clearRect(0, 0, W, HS);
    fxDirty = confetti.length > 0;
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += 700 * dt; p.vx *= 1 - 1.2 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      if (p.y > HS + 20) { confetti.splice(i, 1); continue; }
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.fillStyle = p.col; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 1);
      fctx.restore();
    }
  }

  // ---------- HUD ----------
  const fmtClock = (t) => {
    const cs = Math.max(0, Math.floor(t * 100)), m = Math.floor(cs / 6000), s = (cs % 6000) / 100;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
  };
  let shownTime = 0, lastHud = '';
  function updateHud() {
    if (state === 'run') shownTime = simTime - runStart;
    else if (state === 'finished') shownTime = finishTime;
    else if (state === 'title') shownTime = 0;
    const main = mode === 'level1' ? fmtClock(shownTime) : Math.floor(dist) + ' m';
    const key = main + '|' + level;
    if (key === lastHud) return;
    lastHud = key;
    $('hud-main').textContent = main;
    $('hud-level').textContent = 'Level ' + level;
  }

  const toastEl = $('toast');
  let toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
  }

  // ---------- Menus ----------
  const ICONS = {
    home: 'M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z',
    play: 'M7 4v16l13-8z',
    levels: 'M4 5h16v3.2H4zm0 5.4h16v3.2H4zm0 5.4h16V19H4z',
    more: 'M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z',
    retry: 'M12 4.5V1.5L7 6l5 4.5v-3a5.5 5.5 0 1 1-5.5 5.5H4a8 8 0 1 0 8-8.5z',
  };
  const overlay = $('overlay');
  const barBtns = ['bar-a', 'bar-b', 'bar-c'].map($);
  const barActions = [null, null, null];
  let overlayOpenedAt = 0;
  // Show one menu screen and set the three bar buttons: each is [icon, label, action] or null to hide it.
  function openOverlay(screen, buttons) {
    for (const s of ['home', 'photo', 'levels', 'pause']) $('screen-' + s).hidden = s !== screen;
    if (screen !== 'photo') confetti.length = 0;
    buttons.forEach((b, i) => {
      const el = barBtns[i];
      el.hidden = !b; barActions[i] = b ? b[2] : null;
      if (b) { el.querySelector('path').setAttribute('d', ICONS[b[0]]); el.querySelector('span').textContent = b[1]; }
    });
    overlay.hidden = false; overlayOpen = true; overlayOpenedAt = performance.now();
  }
  function hideOverlay() { overlay.hidden = true; overlayOpen = false; confetti.length = 0; }
  barBtns.forEach((el, i) => el.addEventListener('click', () => { initAudio(); if (barActions[i]) barActions[i](); el.blur(); }));

  // Buttons that lead to another page (Home, Levels, More, VS) are shown but do nothing yet; they get
  // wired up later. openHome and openLevels below are ready for that.
  const notYet = () => {};
  const HOME = ['home', 'Home', notYet];
  const LEVELS = ['levels', 'Levels', notYet];
  const MORE = ['more', 'More', notYet];
  const RETRY = ['retry', 'Retry', () => startMode(mode)];

  function openHome() {
    mode = 'level1'; state = 'title';
    newWorld(); placeCar();
    openOverlay('home', [LEVELS, ['play', 'Play', () => startMode('level1')], MORE]);
  }
  function openLevels() {
    $('pick-1-note').textContent = bestTime ? 'Best time ' + fmtClock(bestTime) : 'Not finished yet';
    $('pick-2-note').textContent = best ? 'Best ' + best + ' m' : 'No runs yet';
    openOverlay('levels', [HOME, null, null]);
  }
  $('pick-1').addEventListener('click', () => { initAudio(); startMode('level1'); });
  $('pick-2').addEventListener('click', () => { initAudio(); startMode('endless'); });

  function openPhoto(time, title, note) {
    try { $('photo-img').src = canvas.toDataURL('image/jpeg', 0.8); } catch (e) { $('photo-img').removeAttribute('src'); }
    $('photo-time').textContent = time;
    $('photo-title').textContent = title;
    $('photo-note').textContent = note;
    openOverlay('photo', [HOME, RETRY, LEVELS]);
  }
  const REASONS = { roof: 'Flipped', head: 'Ouch!', water: 'Splash!', tipped: 'Tipped over' };
  function showCrash() {
    const title = REASONS[crashReason] || 'Crashed';
    if (mode === 'level1') openPhoto(fmtClock(shownTime), title, Math.min(L1.len, Math.floor(dist)) + ' of ' + L1.len + ' m');
    else openPhoto(Math.floor(dist) + ' m', title, 'Level ' + level + ' · Best ' + best + ' m');
  }
  function showFinish() {
    const record = !bestTime || finishTime < bestTime;
    if (record) { bestTime = finishTime; store.set('pedalRally.level1Time', bestTime); }
    openPhoto(fmtClock(finishTime), 'Victory', record ? 'New best time!' : 'Best time ' + fmtClock(bestTime));
    burstConfetti();
  }
  function pauseGame() {
    if (state !== 'run') return;
    state = 'paused';
    openOverlay('pause', [HOME, ['play', 'Resume', resumeGame], RETRY]);
  }
  function resumeGame() {
    if (state !== 'paused') return;
    state = 'run';
    hideOverlay();
  }

  // ---------- Sound (soft engine tone) ----------
  const SOUND_ON = 'M3 9v6h4l5 4V5L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z';
  const SOUND_OFF = 'M3 9v6h4l5 4V5L7 9zm11.3.7 1.4-1.4L18 10.6l2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3z';
  let muted = store.get('pedalRally.muted', false), audio = null;
  const soundBtn = $('btn-sound');
  const syncSoundBtn = () => {
    $('sound-icon').setAttribute('d', muted ? SOUND_OFF : SOUND_ON);
    soundBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  };
  syncSoundBtn();
  function initAudio() {
    if (audio) { if (audio.ac.state === 'suspended') audio.ac.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      // A soft engine tone: a triangle wave plus a quieter sine an octave up, rounded off by a low-pass filter.
      const o1 = ac.createOscillator(), o2 = ac.createOscillator(), mix2 = ac.createGain(), f = ac.createBiquadFilter(), g = ac.createGain();
      o1.type = 'triangle'; o2.type = 'sine'; mix2.gain.value = 0.35;
      f.type = 'lowpass'; f.frequency.value = 1600; f.Q.value = 0.5; g.gain.value = 0;
      o1.connect(f); o2.connect(mix2); mix2.connect(f); f.connect(g); g.connect(ac.destination);
      o1.start(); o2.start();
      audio = { ac, o1, o2, g };
    } catch (e) { audio = null; }
  }
  // Engine pitch follows speed through four gears, so it rises and drops back like a real car shifting up.
  const GEARS = [0, 7, 13, 19, 30];
  function engineHz() {
    const v = (Math.abs(wheels[0].s) + Math.abs(wheels[1].s)) / 2 * WHEEL_R;
    let gear = 0;
    while (gear < GEARS.length - 2 && v > GEARS[gear + 1]) gear++;
    const t = clamp((v - GEARS[gear]) / (GEARS[gear + 1] - GEARS[gear]), 0, 1);
    return 85 + gear * 12 + t * 110;
  }
  function updateAudio() {
    if (!audio) return;
    const t = audio.ac.currentTime;
    const on = state === 'run' && !muted;
    const f = engineHz();
    audio.o1.frequency.setTargetAtTime(f, t, 0.08);
    audio.o2.frequency.setTargetAtTime(f * 2, t, 0.08);
    audio.g.gain.setTargetAtTime(on ? (input.gas ? 0.09 : 0.05) : 0, t, 0.1);
  }
  soundBtn.addEventListener('click', () => { muted = !muted; store.set('pedalRally.muted', muted); syncSoundBtn(); initAudio(); soundBtn.blur(); });

  // ---------- Input ----------
  // An arrow press while a menu is open does what the middle (blue) button says.
  function onPress() {
    initAudio();
    if (overlayOpen && performance.now() - overlayOpenedAt > 300 && barActions[1]) barActions[1]();
  }

  const GAS_KEYS = ['ArrowRight', 'KeyD', 'ArrowUp', 'KeyW'], BRAKE_KEYS = ['ArrowLeft', 'KeyA', 'ArrowDown', 'KeyS'];
  window.addEventListener('keydown', (e) => {
    if (GAS_KEYS.includes(e.code)) { if (!input.gasKey) { input.gasKey = true; onPress(); } e.preventDefault(); }
    else if (BRAKE_KEYS.includes(e.code)) { if (!input.brakeKey) { input.brakeKey = true; onPress(); } e.preventDefault(); }
    else if (e.code === 'KeyR') { initAudio(); startMode(mode); e.preventDefault(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'run') pauseGame(); else resumeGame(); e.preventDefault(); }
    else if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && overlayOpen && !(document.activeElement instanceof HTMLButtonElement)) { onPress(); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (GAS_KEYS.includes(e.code)) input.gasKey = false;
    else if (BRAKE_KEYS.includes(e.code)) input.brakeKey = false;
  });
  window.addEventListener('blur', () => { input.gasKey = input.brakeKey = input.gasPad = input.brakePad = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

  const zones = { gas: $('zone-right'), brake: $('zone-left') };
  function syncZones() {
    zones.gas.classList.toggle('on', input.gas);
    zones.brake.classList.toggle('on', input.brake);
  }
  for (const name of ['gas', 'brake']) {
    const el = zones[name], prop = name + 'Pad';
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* not supported */ }
      input[prop] = true; initAudio();
    });
    const release = () => { input[prop] = false; };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  $('btn-pause').addEventListener('click', (e) => { pauseGame(); e.currentTarget.blur(); });
  $('btn-vs').addEventListener('click', (e) => { notYet(); e.currentTarget.blur(); });

  // ---------- Main loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'paused') acc = 0;
    else { acc += dt; while (acc >= DT) { step(DT); acc -= DT; } }

    if (state === 'run') {
      dist = Math.max(dist, car.x - START_X);
      if (car.x > lastProgressX + 0.5) { lastProgressX = car.x; lastProgressT = simTime; stuckShown = false; }
      else if (!stuckShown && simTime - lastProgressT > 7) { stuckShown = true; toast('Stuck? Pause, then Retry'); }
      if (mode === 'endless') {
        const lvl = 2 + Math.floor(dist / LEVEL_LEN);
        if (lvl > level) { level = lvl; toast('Level ' + level); }
      } else if (car.x > L1.finish) finish();
    }
    if (state === 'crashed' && !overlayOpen && simTime - crashT > 1.1) showCrash();
    if (state === 'finished' && !overlayOpen && ((gatePush > 0 && Math.hypot(car.vx, car.vy) < 0.3) || simTime - finishAt > 6)) showFinish();

    if (state !== 'paused') {
      // Dust from spinning or fast wheels
      for (const w of wheels) {
        if (w.contact && (Math.abs(w.slip) > 3 || (Math.abs(w.s) > 18 && Math.random() < 0.3)) && particles.length < 220) {
          particles.push({ x: w.cx, y: w.cy + 0.1, vx: -Math.sign(w.s) * (1 + Math.random() * 2), vy: 0.5 + Math.random() * 1.5, life: 0, max: 0.5 + Math.random() * 0.5, size: 0.07 + Math.random() * 0.08, col: COL.dust });
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt; p.vy += GRAV * 0.25 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.life > p.max) particles.splice(i, 1);
      }
    }

    // Camera: look ahead in the direction of travel and zoom out a little at speed. After the finish,
    // frame the truck and the arch for the photo.
    const speed = Math.hypot(car.vx, car.vy);
    cam.zoom += ((1 - 0.2 * Math.min(1, speed / 26)) - cam.zoom) * Math.min(1, dt * 2);
    PX = basePX * cam.zoom;
    const tx = state === 'finished' ? car.x + 1.2 : car.x + clamp(car.vx * 0.45, -4, 9) + (W / PX) * 0.08;
    const ty = car.y + 1.4 + (HS > W ? HS * 0.12 / PX : 0);
    cam.x += (tx - cam.x) * Math.min(1, dt * 3);
    cam.y += (ty - cam.y) * Math.min(1, dt * 4);
    shake = Math.max(0, shake - dt);

    syncZones();
    updateHud();
    updateAudio();
    render();
    drawConfetti(dt);
    requestAnimationFrame(frame);
  }

  newWorld();
  placeCar();
  openOverlay('home', [LEVELS, ['play', 'Play', () => startMode('level1')], MORE]);
  updateHud();
  requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
