<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eesti kaart – lohista nimed õigesse kohta</title>
<style>
:root{--sea:#cfe5f2;--land:#d4e8b8;--land-edge:#7d9a62;--other:#ece7da;--ink:#1f2d3a;--muted:#5b6b78;--red:#d23b2f;--ok:#1d9a4b;--water:#2f78b7}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#eef3f6}
header{padding:10px 14px 6px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:1.2rem;margin:0}
h1 small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;font-size:.9rem;border:1px solid #c3cfd8;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:#f3f7fa}.btn:active{transform:scale(.96)}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid #c3cfd8;border-radius:999px;overflow:hidden;background:#fff}
.seg .btn{border:0;border-radius:0}
.status{display:flex;gap:14px;font-size:.92rem;color:var(--muted);padding:0 14px 8px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.status b{color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;padding:0 12px 14px;max-width:1400px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr}}
.mapwrap{background:var(--sea);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(30,50,70,.12);position:relative}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
.est{fill:var(--land);stroke:var(--land-edge);stroke-width:1;stroke-linejoin:round}
.other{fill:var(--other);stroke:#b8b09c;stroke-width:.8}
.lake{fill:var(--sea);stroke:#6aa0c8;stroke-width:.8}
.river{fill:none;stroke:#5b9bd0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.country{font-weight:700;letter-spacing:.35em;fill:#a39a83;font-size:20px;pointer-events:none}
.compass text{font-weight:700;fill:var(--ink);font-size:16px}
.dot{cursor:default}
.dot .ring{fill:none;stroke:var(--red);stroke-width:2;opacity:.55;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.dot .core{fill:var(--red);stroke:#fff;stroke-width:2;transition:fill .25s}
.dot.target .core{fill:#ff9f1a}
.dot.target .ring{stroke:#ff9f1a;opacity:1;animation:none;transform:scale(1.5)}
.dot.ok .core{fill:var(--ok)}
.dot.ok .ring{stroke:var(--ok);animation:none;opacity:0}
.dot.shown .core{fill:#7b8a96}
.dot.shown .ring{opacity:0;animation:none}
.dot.wrong .core{fill:#111}
.dot.hint .ring{stroke:#ff9f1a;opacity:1;animation:pulse .7s ease-out infinite}
.dot.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.1);opacity:0}}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
.dot{transform-box:fill-box;transform-origin:center}
.burst{fill:none;stroke:var(--ok);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:burst .7s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(3.2);opacity:0}}
.lbl{font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:var(--ink);cursor:pointer;animation:fadein .4s ease both}
.lbl.water{fill:var(--water);font-style:italic}
.lbl.shown{fill:#6b7a86}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.lbl:hover{text-decoration:underline}
aside{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(30,50,70,.08);align-self:start}
@media (min-width:861px){aside{position:sticky;top:10px}}
aside h2{font-size:.95rem;margin:2px 4px 8px;color:var(--muted);font-weight:600}
.tray{display:flex;flex-wrap:wrap;gap:7px;min-height:40px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:#fff;border:1.5px solid #c9d4dc;box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600;font-size:.95rem;cursor:grab;transition:opacity .2s,transform .2s,box-shadow .2s}
.chip:hover{box-shadow:0 3px 8px rgba(0,0,0,.12);transform:translateY(-1px)}
.chip .ic{font-size:.8rem;width:1.1em;text-align:center}
.chip.src{opacity:.25}
.chip.hint{border-color:#ff9f1a;box-shadow:0 0 0 3px rgba(255,159,26,.35)}
.chip.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.ghost{position:fixed;z-index:50;pointer-events:none;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(-3deg) scale(1.06);margin:0}
.empty{color:var(--muted);font-size:.9rem;padding:6px 4px}
.legend{margin-top:10px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;padding:0 4px}
.tip{font-size:.8rem;color:var(--muted);padding:8px 4px 0}
#win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.35);backdrop-filter:blur(1px);z-index:5}
#win.show{display:flex}
#win div{background:#fff;padding:18px 24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
#win h3{margin:0 0 6px;font-size:1.5rem}
#win p{margin:0 0 12px;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<header>
  <h1>Eesti kaart <small>Lohista nimi kaardil õige punkti peale</small></h1>
  <div class="controls">
    <div class="seg" id="sets">
      <button class="btn on" data-set="all">Kõik</button>
      <button class="btn" data-set="1">1. veerg</button>
      <button class="btn" data-set="2">2. veerg</button>
    </div>
    <button class="btn" id="extra">+ Põhikohad</button>
    <button class="btn" id="hint">💡 Vihje</button>
    <button class="btn" id="show">👁 Näita vastuseid</button>
    <button class="btn" id="reset">↻ Uuesti</button>
  </div>
</header>
<div class="status">
  <span>Õigesti: <b id="sOk">0</b> / <b id="sAll">0</b></span>
  <span>Vigu: <b id="sBad">0</b></span>
  <span>Aeg: <b id="sTime">0:00</b></span>
</div>
<main>
  <div class="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="win"><div><h3>🎉 Tubli!</h3><p id="winText"></p><button class="btn on" id="again">Mängi uuesti</button></div></div>
  </div>
  <aside>
    <h2>Nimed – lohista kaardile</h2>
    <div class="tray" id="tray"></div>
    <div class="legend" id="legend"></div>
    <div class="tip">Kui nimi on kaardil, saad sellele klõpsata ja see läheb tagasi nimekirja.</div>
  </aside>
</main>

const el = (tag, attrs={}, parent) => { const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };

PLACES.forEach(p => { [p.x,p.y] = proj(p); });

// ---------- base map ----------
svg.setAttribute('viewBox', `0 0 ${MAP.W} ${MAP.H}`);
el('rect',{x:0,y:0,width:MAP.W,height:MAP.H,fill:'var(--sea)'},svg);
el('path',{d:MAP.other,class:'other'},svg);
el('path',{d:MAP.est,class:'est'},svg);
el('path',{d:MAP.rivers,class:'river'},svg);
el('path',{d:MAP.lakes,class:'lake'},svg);
[['SOOME',proj({lon:24.0,lat:59.80}),0],['VENEMAA',[MAP.W-12,proj({lon:28,lat:58.85})[1]],-90],['LÄTI',proj({lon:25.2,lat:57.55}),0]].forEach(([t,[x,y],rot])=>{
  const e=el('text',{x,y,class:'country','text-anchor':'middle',transform:`rotate(${rot} ${x} ${y})`},svg); e.textContent=t;
});
const comp = el('g',{class:'compass',transform:`translate(34,60)`},svg);
el('path',{d:'M0,-26 L9,6 L0,0 L-9,6 Z',fill:'#1f2d3a'},comp);
const ct=el('text',{x:0,y:24,'text-anchor':'middle'},comp); ct.textContent='P';
const gDots = el('g',{},svg);
const gLabels = el('g',{},svg);

// ---------- state ----------
let setSel='all', withExtra=false, placed=new Map(), mistakes=0, startT=null, timer=null, busy=false, active=[];
const dotEls={}, chipEls={};
let scale=1;

function activePlaces(){
  return PLACES.filter(p => (p.g===3 ? withExtra : (setSel==='all' || +setSel===p.g)));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function build(){
  gDots.innerHTML=''; gLabels.innerHTML=''; tray.innerHTML='';
  placed.clear(); mistakes=0; startT=null; clearInterval(timer); $('sTime').textContent='0:00';
  $('win').classList.remove('show');
  active = activePlaces();
  active.forEach((p,i) => {
    const g = el('g',{class:'dot pop','data-id':p.id},gDots);
    g.style.animationDelay = (i*45)+'ms';
    el('circle',{class:'ring',cx:p.x,cy:p.y,r:8},g);
    el('circle',{class:'core',cx:p.x,cy:p.y,r:6},g);
    dotEls[p.id]=g;
  });
  shuffle(active.slice()).forEach(p => tray.appendChild(makeChip(p)));
  // legend
  const used=[...new Set(active.map(p=>p.type))];
  $('legend').innerHTML = used.map(t=>`<span style="color:${TYPES[t].color}">${TYPES[t].ic}</span> ${TYPES[t].name}`).join(' · ');
  rescale(); updateStatus();
}

function makeChip(p){
  const c=document.createElement('div');
  c.className='chip'; c.dataset.id=p.id;
  c.innerHTML=`<span class="ic" style="color:${TYPES[p.type].color}">${TYPES[p.type].ic}</span>${p.name}`;
  c.addEventListener('pointerdown', e => startDrag(e,c,p));
  chipEls[p.id]=c;
  return c;
}

function updateStatus(){
  const ok=[...placed.values()].filter(v=>v==='ok').length;
  $('sOk').textContent=ok; $('sAll').textContent=active.length; $('sBad').textContent=mistakes;
  if(tray.querySelectorAll('.chip').length===0 && !tray.querySelector('.empty')){
    const d=document.createElement('div'); d.className='empty'; d.textContent='Kõik nimed on kaardil!'; tray.appendChild(d);
  }
}
function tick(){ const s=Math.floor((Date.now()-startT)/1000); $('sTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// sizes stay readable on small screens
function rescale(){
  scale = svg.clientWidth / MAP.W || 1;
  const fs = Math.max(15, 12/scale), r = Math.max(6, 5.5/scale);
  svg.style.setProperty('--fs', fs+'px');
  gDots.querySelectorAll('.core').forEach(c=>c.setAttribute('r',r));
  gDots.querySelectorAll('.ring').forEach(c=>c.setAttribute('r',r*1.4));
  gLabels.querySelectorAll('.lbl').forEach(t=>{ t.setAttribute('font-size',fs); positionLabel(t); });
}
window.addEventListener('resize', rescale);

function positionLabel(t){
  const p=PLACES.find(q=>q.id===t.dataset.id);
  const fs=parseFloat(t.getAttribute('font-size')), off=fs*0.75;
  let x=p.x,y=p.y,anchor='middle';
  if(p.pos==='r'){x+=off; y+=fs*0.35; anchor='start';}
  if(p.pos==='l'){x-=off; y+=fs*0.35; anchor='end';}
  if(p.pos==='t'){y-=off;}
  if(p.pos==='b'){y+=off+fs*0.7;}
  t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor',anchor);
  // keep inside the map
  requestAnimationFrame(()=>{ try{
    const b=t.getBBox();
    if(b.x<4) t.setAttribute('x', +t.getAttribute('x') + (4-b.x));
    if(b.x+b.width>MAP.W-4) t.setAttribute('x', +t.getAttribute('x') - (b.x+b.width-MAP.W+4));
  }catch(e){} });
}

function addLabel(p, kind){
  const t=el('text',{class:'lbl'+(TYPES[p.type].water?' water':'')+(kind==='shown'?' shown':''),'data-id':p.id,'font-size':Math.max(15,12/scale)},gLabels);
  t.textContent=p.name;
  positionLabel(t);
  t.addEventListener('click',()=>unplace(p));
  dotEls[p.id].classList.add(kind);
}

function unplace(p){
  if(busy) return;
  gLabels.querySelector(`.lbl[data-id="${p.id}"]`)?.remove();
  dotEls[p.id].classList.remove('ok','shown');
  placed.delete(p.id);
  tray.querySelector('.empty')?.remove();
  const c=makeChip(p); tray.prepend(c);
  c.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:300,easing:'cubic-bezier(.3,1.6,.5,1)'});
  $('win').classList.remove('show');
  updateStatus();
}

// ---------- dragging ----------
function dotScreen(p){
  const m=svg.getScreenCTM(); const pt=svg.createSVGPoint(); pt.x=p.x; pt.y=p.y; const s=pt.matrixTransform(m);
  return [s.x,s.y];
}
function nearestDot(cx,cy,touch){
  let best=null, bd=touch?46:34;
  active.forEach(p=>{ const [x,y]=dotScreen(p); const d=Math.hypot(x-cx,y-cy); if(d<bd){bd=d;best=p;} });
  return best;
}

function startDrag(e,chip,p){
  if(busy || e.button>0) return;
  e.preventDefault();
  if(!startT){ startT=Date.now(); timer=setInterval(tick,1000); }
  document.querySelectorAll('.hint').forEach(h=>h.classList.remove('hint'));
  const touch = e.pointerType!=='mouse';
  const r=chip.getBoundingClientRect();
  const ghost=chip.cloneNode(true); ghost.classList.add('ghost');
  ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px'; ghost.style.width=r.width+'px';
  document.body.appendChild(ghost);
  chip.classList.add('src');
  // the drop point is the pointer; on touch lift the label above the finger so it stays visible
  const ox = e.clientX-r.left, oy = touch ? r.height+28 : e.clientY-r.top;
  let px=e.clientX, py=e.clientY, target=null;
  const place=()=>{ ghost.style.left=(px-ox)+'px'; ghost.style.top=(py-oy)+'px'; };
  place();
  const move=ev=>{
    px=ev.clientX; py=ev.clientY; place();
    const t=nearestDot(px,py,touch);
    if(t!==target){ target&&dotEls[target.id].classList.remove('target'); target=t; target&&dotEls[target.id].classList.add('target'); }
  };
  const up=()=>{
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    target&&dotEls[target.id].classList.remove('target');
    drop(chip,ghost,p,target);
  };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}

function flyBack(chip,ghost,bad){
  const r=chip.getBoundingClientRect(), g=ghost.getBoundingClientRect();
  const a=ghost.animate([{transform:'rotate(-3deg) scale(1.06)'},{transform:`translate(${r.left-g.left}px,${r.top-g.top}px) rotate(0) scale(1)`}],{duration:320,easing:'cubic-bezier(.4,0,.2,1)'});
  a.onfinish=()=>{ ghost.remove(); chip.classList.remove('src'); if(bad){ chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); } };
}

function flyTo(ghost,p,cb){
  const [x,y]=dotScreen(p), g=ghost.getBoundingClientRect();
  const a=ghost.animate([{transform:'rotate(-3deg) scale(1.06)',opacity:1},{transform:`translate(${x-g.left-g.width/2}px,${y-g.top-g.height/2}px) scale(.2)`,opacity:.2}],{duration:300,easing:'cubic-bezier(.4,0,.2,1)'});
  a.onfinish=()=>{ ghost.remove(); cb(); };
}

function burst(p){
  const c=el('circle',{class:'burst',cx:p.x,cy:p.y,r:10},gDots);
  setTimeout(()=>c.remove(),750);
}

function drop(chip,ghost,p,target){
  if(!target || placed.has(target.id)){ flyBack(chip,ghost,false); return; }
  if(target.id===p.id){
    flyTo(ghost,p,()=>{
      chip.remove(); placed.set(p.id,'ok'); addLabel(p,'ok'); burst(p); updateStatus(); checkWin();
    });
  } else {
    mistakes++; updateStatus();
    const d=dotEls[target.id]; d.classList.add('wrong'); setTimeout(()=>d.classList.remove('wrong'),600);
    flyBack(chip,ghost,true);
  }
}

function checkWin(){
  if(placed.size!==active.length) return;
  clearInterval(timer);
  if([...placed.values()].every(v=>v==='ok')){
    $('winText').textContent = `Kõik ${active.length} nime on õiges kohas. Vigu: ${mistakes}, aeg: ${$('sTime').textContent}.`;
    setTimeout(()=>{ $('win').classList.add('show'); confetti(); }, 400);
  }
}

// ---------- buttons ----------
document.querySelectorAll('#sets .btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#sets .btn').forEach(x=>x.classList.toggle('on',x===b));
  setSel=b.dataset.set; build();
}));
$('extra').addEventListener('click',()=>{ withExtra=!withExtra; $('extra').classList.toggle('on',withExtra); build(); });
$('reset').addEventListener('click',build);
$('again').addEventListener('click',build);
$('hint').addEventListener('click',()=>{
  const chips=[...tray.querySelectorAll('.chip')]; if(!chips.length) return;
  const c=chips[Math.random()*chips.length|0];
  document.querySelectorAll('.hint').forEach(h=>h.classList.remove('hint'));
  c.classList.add('hint'); dotEls[c.dataset.id].classList.add('hint');
  setTimeout(()=>{ c.classList.remove('hint'); dotEls[c.dataset.id]?.classList.remove('hint'); },2200);
});
$('show').addEventListener('click',()=>{
  if(busy) return;
  const chips=[...tray.querySelectorAll('.chip')]; if(!chips.length) return;
  busy=true; clearInterval(timer);
  chips.forEach((chip,i)=>setTimeout(()=>{
    const p=PLACES.find(q=>q.id===chip.dataset.id);
    const r=chip.getBoundingClientRect(); const ghost=chip.cloneNode(true); ghost.classList.add('ghost');
    ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px'; ghost.style.width=r.width+'px';
    document.body.appendChild(ghost); chip.classList.add('src');
    flyTo(ghost,p,()=>{ chip.remove(); placed.set(p.id,'shown'); addLabel(p,'shown'); updateStatus(); if(i===chips.length-1) busy=false; });
  }, i*120));
});

// ---------- confetti ----------
function confetti(){
  const cv=$('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#0072ce','#000','#fff','#1d9a4b','#ff9f1a','#d23b2f'];
  const ps=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],s:5+Math.random()*6}));
  let f=0;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.04; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.strokeStyle='#bbb'; ctx.lineWidth=.5; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); if(p.c==='#fff') ctx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(++f<240) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

build();
</script>
</body>
</html>
