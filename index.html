first.":"Girar una punta nunca mueve nada más, así que siempre puedes arreglar primero las puntas.","Pyraminx · Step 2 · centres":"Pyraminx · Paso 2 · centros","Match the centres":"Junta los centros","Turn whole corners until every face has three centres of the same colour.":"Gira esquinas enteras hasta que cada cara tenga tres centros del mismo color.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Gira esquinas enteras (<b>U L R B<\/b>) hasta que en cada cara los <b>tres centros<\/b> sean del mismo color. Luego sujeta el puzle con la <b>cara amarilla abajo<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Cada esquina lleva consigo su punta y sus tres centros, así que el paso 1 sigue hecho.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"Mientras haces esto, las aristas se desordenan. No pasa nada, los pasos 3 y 4 lo arreglan.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Paso 3a · aristas de abajo","Edge on the right, yellow facing you":"Arista a la derecha, amarillo hacia ti","Puts the green-yellow edge into the front bottom.":"Coloca la arista verde-amarilla abajo delante.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Cara amarilla abajo. La arista que va <b>abajo delante<\/b> está en la arista <b>delantera derecha<\/b>, con el amarillo <b>hacia ti<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Gira el puzle entero (el amarillo sigue abajo) para que el sitio que quieres rellenar quede abajo delante.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"¿La arista ya está abajo pero en el sitio equivocado o volteada? Pon ese sitio abajo delante y haz esto una vez para subir la arista.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Paso 3b · aristas de abajo","Edge on the right, yellow facing right":"Arista a la derecha, amarillo hacia la derecha","Same edge, the other way round.":"La misma arista, al revés.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"La arista está en la arista <b>delantera derecha<\/b>, con el amarillo hacia la <b>derecha<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Paso 3c · aristas de abajo","Edge on the left, yellow facing you":"Arista a la izquierda, amarillo hacia ti","The edge is on the left side.":"La arista está en el lado izquierdo.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"La arista está en la arista <b>delantera izquierda<\/b>, con el amarillo <b>hacia ti<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Paso 3d · aristas de abajo","Edge on the left, yellow facing left":"Arista a la izquierda, amarillo hacia la izquierda","Mirror of 3b.":"El espejo del 3b.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"La arista está en la arista <b>delantera izquierda<\/b>, con el amarillo hacia la <b>izquierda<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Paso 3e · aristas de abajo","Edge at the back, yellow facing right":"Arista atrás, amarillo hacia la derecha","The edge is on the back edge.":"La arista está en la arista de atrás.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"La arista está en la arista de <b>atrás<\/b>, con el amarillo hacia la <b>derecha<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Paso 3f · aristas de abajo","Edge at the back, yellow facing left":"Arista atrás, amarillo hacia la izquierda","Mirror of 3e.":"El espejo del 3e.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"La arista está en la arista de <b>atrás<\/b>, con el amarillo hacia la <b>izquierda<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Haz esto con las tres aristas de abajo. La cara amarilla está hecha cuando cada arista de abajo coincide con los centros de ambos lados.","Pyraminx · Step 4a · last edges":"Pyraminx · Paso 4a · últimas aristas","Edges go round (one way)":"Las aristas dan la vuelta (en un sentido)","Moves the three top edges round.":"Mueve en círculo las tres aristas de arriba.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Cara amarilla hecha, abajo. <b>Ninguna<\/b> arista de arriba está en su sitio. La arista <b>delantera izquierda<\/b> va <b>delante a la derecha<\/b>.","After it, two edges may be flipped. Then do 4c.":"Después, puede que dos aristas queden volteadas. Entonces haz el 4c.","You never need more than two algorithms for the last edges.":"Nunca necesitas más de dos algoritmos para las últimas aristas.","Pyraminx · Step 4b · last edges":"Pyraminx · Paso 4b · últimas aristas","Edges go round (other way)":"Las aristas dan la vuelta (en el otro sentido)","Moves the three top edges round the other way.":"Mueve en círculo las tres aristas de arriba en el otro sentido.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Ninguna<\/b> arista de arriba está en su sitio. La arista <b>delantera izquierda<\/b> va <b>atrás<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Paso 4c · últimas aristas","Two edges flipped":"Dos aristas volteadas","All three top edges are in their place, but two are flipped.":"Las tres aristas de arriba están en su sitio, pero dos están volteadas.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Todas las aristas de arriba en su sitio, dos de ellas volteadas. Sujeta el puzle de forma que la <b>arista buena quede atrás<\/b>.","Solved!":"¡Resuelto!","4x4 · 1 · edge pairing":"4x4 · 1 · emparejar aristas","Join two halves opposite each other":"Une dos mitades enfrentadas","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"Una arista del 4x4 tiene dos mitades. Cuando las dos mitades están una enfrente de la otra, esto las une en una sola arista.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Centros hechos. Las dos mitades de una arista (aquí <b>azul-naranja<\/b>) están <b>una enfrente de la otra<\/b>: una en la <b>parte de arriba de la arista delantera izquierda<\/b>, otra en la <b>parte de arriba de la arista delantera derecha<\/b>, con el <b>naranja hacia ti<\/b> en las dos. Solo las piezas azul-naranja tienen color, para que puedas seguirlas.","Joined! The blue-orange edge is now one piece, at the front right.":"¡Unidas! La arista azul-naranja ya es una sola pieza, delante a la derecha.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = las dos capas de arriba juntas. Uw' lleva la mitad izquierda a la derecha, Uw al final devuelve los centros a su sitio.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"La parte del medio «R U R' F R' F' R» mete una arista ya terminada, para que las dos mitades puedan encontrarse. El resto del cubo se desordena: no pasa nada, después lo resuelves como un 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Empareja así las 12 aristas y luego resuelve el 4x4 como un 3x3.","Edge joined":"Arista unida","4x4 · 1b · edge pairing":"4x4 · 1b · emparejar aristas","Combine with the centre layer, then swap it out":"Únelas con la capa interior y luego sácala","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Gira solo la capa interior para unir las dos mitades, cambia la arista unida por una que aún no esté unida y luego devuelve la capa interior a su sitio.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Centros hechos. Las dos mitades de una arista (aquí <b>azul-naranja<\/b>) están <b>en diagonal<\/b>: una <b>arriba en la arista delantera izquierda<\/b> con el <b>naranja hacia ti<\/b>, otra <b>abajo en la arista delantera derecha<\/b> con el <b>azul hacia ti<\/b>. Solo las piezas azul-naranja tienen color, para que puedas seguirlas.","Joined! The blue-orange edge is now one piece, at the top front.":"¡Unidas! La arista azul-naranja ya es una sola pieza, arriba delante.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"Este giro tiene nombre: <b>giro de capa interior<\/b> (slice). Una u minúscula significa: gira <b>solo la capa interior de arriba<\/b> (la segunda capa empezando por arriba). La capa de arriba no se mueve.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = esa capa interior gira hacia la derecha (como U'). La mitad de arriba va a la derecha y se coloca encima de la mitad de abajo: la arista queda unida.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' sube la arista unida a la capa de arriba y pone en su sitio una arista que aún no está unida.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = devuelve la capa interior a su sitio, para que los centros vuelvan a estar resueltos. La arista unida se queda junta arriba.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Si la mitad de abajo está a la izquierda y la de arriba a la derecha, gira la capa interior en el otro sentido: u L' U' L u'.","Halves combined":"Mitades unidas","Swapped out":"Cambiada","4x4 · 2 · OLL parity":"4x4 · 2 · paridad de OLL","No 3x3 OLL fits":"Ningún OLL del 3x3 encaja","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Cuando <b>ningún algoritmo del 3x3<\/b> sirve para tu cara de arriba, haz esto. Solo pasa en un 4x4: hay un número impar de aristas de arriba volteadas (1 o 3), como en el dibujo. Esto voltea la arista de delante, y así un OLL normal del 3x3 vuelve a funcionar.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Amarillo arriba. Como en el dibujo: <b>3 aristas están volteadas<\/b> (la de delante, la de la derecha y la de atrás muestran su color arriba), solo la arista de la <b>izquierda<\/b> tiene el amarillo arriba. El dibujo muestra la cara de arriba vista desde arriba, con la de delante abajo. Pon una <b>arista volteada delante<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Ahora hay un número par de aristas volteadas (atrás e izquierda), y las dos esquinas de delante están giradas: otra vez un caso normal del 3x3. Termina con tu OLL y tu PLL del 3x3.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"Cómo reconocerla: cuenta las aristas de arriba que no tienen el amarillo arriba. 1 o 3 = no encaja ningún algoritmo del 3x3, haz primero este.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = las <b>dos capas de la derecha juntas<\/b> (giro doble), Lw = las dos capas de la izquierda juntas. En muchas hojas se escribe con r y l minúsculas.","U2 and F2 turn only the outer top and front layer, twice.":"U2 y F2 giran solo la capa exterior de arriba y la de delante, dos veces.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"La arista de delante se voltea. Algunas otras piezas de arriba también se mueven: no pasa nada, tu OLL y tu PLL normales del 3x3 las arreglan.","4x4 · 3 · PLL parity":"4x4 · 3 · paridad de PLL","Two edges swapped":"Dos aristas intercambiadas","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"También solo en un 4x4: justo al final, dos aristas opuestas de arriba están intercambiadas. Esto las vuelve a cambiar.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Todo está resuelto menos las aristas de arriba de <b>delante<\/b> y de <b>atrás<\/b>, que están <b>intercambiadas<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = las dos capas de arriba dos veces. Rw2 = las dos capas de la derecha dos veces. r2 = solo la segunda capa desde la derecha, dos veces.","Only these two edges change. Everything else stays where it is.":"Solo cambian estas dos aristas. Todo lo demás se queda donde está.","Mirror cube · last layer":"Mirror cube · última capa","Three corners (A-perm)":"Tres esquinas (A-perm)","Moves three top corners around. Everything else stays where it is.":"Mueve en círculo tres esquinas de arriba. Todo lo demás se queda donde está.","Beginner 3x3":"3x3 para principiantes","Beginner":"Principiante","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"El método clásico para principiantes. Sujeta el cubo con el <b>amarillo arriba<\/b> y el <b>verde hacia ti<\/b>: primero se resuelve el blanco abajo y al final el amarillo arriba. Pulsa en un paso para verlo en movimiento.","Intermediate 3x3":"3x3 intermedio","Intermediate":"Intermedio","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"El siguiente nivel: la cruz blanca como antes, luego <b>F2L<\/b> (esquina y arista juntas), <b>OLL en 2 pasos<\/b> (todo el amarillo arriba) y <b>PLL en 2 pasos<\/b> (todo en su sitio). El mismo agarre: amarillo arriba, verde hacia ti.","Advanced F2L (3x3)":"F2L avanzado (3x3)","Advanced F2L":"F2L avanzado","Advanced OLL (3x3)":"OLL avanzado (3x3)","Advanced OLL":"OLL avanzado","Advanced PLL (3x3)":"PLL avanzado (3x3)","Advanced PLL":"PLL avanzado","2x2 Beginner":"2x2 para principiantes","2x2 Intermediate":"2x2 intermedio","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"La capa blanca como en Principiante. Luego <b>3 algoritmos<\/b> ponen toda la cara de arriba amarilla y <b>2 algoritmos<\/b> colocan las esquinas en su sitio.","2x2 Advanced":"2x2 avanzado","Advanced":"Avanzado","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"El método <b>Ortega<\/b>. Primero haz la <b>cara blanca<\/b> abajo (los lados aún no tienen que coincidir). Luego uno de los <b>7 algoritmos<\/b> pone todo el amarillo arriba, y uno de los <b>6 algoritmos<\/b> arregla las dos capas a la vez.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Otros puzles y cubos grandes","push it up, away from you":"empuja hacia arriba, lejos de ti","pull it down, toward you":"tira hacia abajo, hacia ti","swing it to the left":"gira hacia la izquierda","swing it to the right":"gira hacia la derecha","turn it clockwise, like a clock":"gira en sentido horario, como las agujas del reloj","turn it anticlockwise":"gira en sentido antihorario","push them up, away from you":"empuja las dos hacia arriba, lejos de ti","pull them down, toward you":"tira de las dos hacia abajo, hacia ti","turn them clockwise, like a clock":"gira las dos en sentido horario, como las agujas del reloj","turn them anticlockwise":"gira las dos en sentido antihorario","swing them to the right":"gira las dos hacia la derecha","swing them to the left":"gira las dos hacia la izquierda","clockwise as seen from behind":"en sentido horario visto desde detrás","anticlockwise as seen from behind":"en sentido antihorario visto desde detrás","swing it to the right (like D)":"gira hacia la derecha (como D)","turn it clockwise, like F":"gira en sentido horario, como F","tip it so the front comes to the top":"vuelca el cubo para que la cara de delante pase arriba","tip it so the top comes to the front":"vuelca el cubo para que la cara de arriba pase delante","roll it to the right, like F":"rueda el cubo hacia la derecha, como F","roll it to the left":"rueda el cubo hacia la izquierda","pull it down, toward you (like L)":"tira hacia abajo, hacia ti (como L)","turn it so the right side faces you":"gira el cubo para que la cara derecha quede hacia ti","turn it so the left side faces you":"gira el cubo para que la cara izquierda quede hacia ti","Right face":"Cara derecha","Left face":"Cara izquierda","Top face":"Cara de arriba","Bottom face":"Cara de abajo","Front face":"Cara de delante","Back face":"Cara de atrás","Whole cube":"Cubo entero","Right two layers":"Dos capas de la derecha","Left two layers":"Dos capas de la izquierda","Front two layers":"Dos capas de delante","Bottom two layers":"Dos capas de abajo","Top two layers":"Dos capas de arriba","Back two layers":"Dos capas de atrás","Middle slice":"Capa del medio","Middle layer":"Capa del medio","Front-back middle slice":"Capa del medio entre delante y detrás","Only the centre layer next to the right (slice move, the right layer stays still)":"Solo la capa interior junto a la derecha (giro de capa interior, la capa derecha no se mueve)","Only the centre layer next to the left (slice move, the left layer stays still)":"Solo la capa interior junto a la izquierda (giro de capa interior, la capa izquierda no se mueve)","Only the centre layer next to the top (slice move, the top layer stays still)":"Solo la capa interior junto a la de arriba (giro de capa interior, la capa de arriba no se mueve)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Solo la capa interior junto a la de abajo (giro de capa interior, la capa de abajo no se mueve)","Only the centre layer next to the front (slice move, the front layer stays still)":"Solo la capa interior junto a la de delante (giro de capa interior, la capa de delante no se mueve)","Only the centre layer next to the back (slice move, the back layer stays still)":"Solo la capa interior junto a la de atrás (giro de capa interior, la capa de atrás no se mueve)","Top corner with its layer":"Esquina de arriba con su capa","Top tip only":"Solo la punta de arriba","Left corner with its layer":"Esquina izquierda con su capa","Left tip only":"Solo la punta izquierda","Right corner with its layer":"Esquina derecha con su capa","Right tip only":"Solo la punta derecha","Back corner with its layer":"Esquina de atrás con su capa","Back tip only":"Solo la punta de atrás","turn it clockwise, as you look at that corner":"gira en sentido horario, mirando a esa esquina","turn it anticlockwise, as you look at that corner":"gira en sentido antihorario, mirando a esa esquina","{what}: half a turn (turn it twice)":"{what}: media vuelta (gira dos veces)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: tres giros, acaba igual que {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"Inglés (Reino Unido)","English (US)":"Inglés (EE. UU.)","Arabic":"Árabe","Chinese":"Chino","French":"Francés","German":"Alemán","Hindi":"Hindi","Korean":"Coreano","Portuguese":"Portugués","Russian":"Ruso","Spanish":"Español"},"fr":{"Cube Algorithms":"Algorithmes du cube","Settings":"Paramètres","Grip: yellow on top, green facing you":"Prise : jaune en haut, vert vers toi","Light":"Clair","Dark":"Sombre","Switch to light mode":"Passer en mode clair","Switch to dark mode":"Passer en mode sombre","Top layer at the start":"Couronne du haut au départ","Algorithms":"Algorithmes","Turn the cube back":"Remettre le cube en place","All {name} steps":"Toutes les étapes {name}","Step back":"Reculer","Play":"Lecture","Step":"Avancer","Reset":"Réinitialiser","Reset view":"Réinitialiser la vue","Play {n}× (back to start!)":"Lecture {n}× (retour au départ !)","Speed":"Vitesse","Drag or swipe the cube to turn it around.":"Fais glisser le cube pour le faire pivoter.","Start":"Début","solved":"résolu","before":"avant","End":"Fin","Step {n}":"Étape {n}","after {label}":"après {label}","Round {r} of {n}: {mv}":"Tour {r} sur {n} : {mv}","{n} rounds later... back exactly where we started!":"{n} tours plus tard... retour exactement au point de départ !","Undo {mv}":"Annuler {mv}","Press Play, or Step through one turn at a time.":"Appuie sur Lecture, ou sur Avancer pour voir un mouvement à la fois.","Done! Try Play 6x: the cube comes back to the start.":"Fini ! Essaie Lecture 6x : le cube revient au départ.","Done! That is what this step fixes.":"Fini ! Voilà ce que cette étape répare.","{i} of {n} turns done. Next: {mv}.":"{i} mouvements sur {n} faits. Suivant : {mv}.","Languages":"Langues","Estonian":"Estonien","<b>r<\/b> right two layers":"<b>r<\/b> les deux couronnes de droite","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> tranche du milieu, tournée comme L","<b>d<\/b> bottom two layers":"<b>d<\/b> les deux couronnes du bas","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = fais la parenthèse 3 fois","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> les deux couronnes de droite ensemble","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> les deux couronnes du haut ensemble","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> seulement la deuxième couronne en partant de la droite / de la gauche / du haut (tranche intérieure, la couronne centrale)","<b>M<\/b> middle slice, like L":"<b>M<\/b> tranche du milieu, comme L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> bascule / roule tout le cube","<b>y<\/b> turn the whole cube":"<b>y<\/b> tourne tout le cube","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> les deux couronnes du bas / du haut","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> deux couronnes à la fois","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> tranche du milieu entre l'avant et l'arrière, comme F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> bascule tout le cube, comme R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = fais la parenthèse 2 fois","<b>U<\/b> top corner":"<b>U<\/b> coin du haut","<b>L<\/b> front-left corner":"<b>L<\/b> coin avant gauche","<b>R<\/b> front-right corner":"<b>R<\/b> coin avant droit","<b>B<\/b> back corner":"<b>B<\/b> coin arrière","capital = the corner with its whole layer":"majuscule = le coin avec toute sa couronne","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = seulement la pointe","<b>'<\/b> = the other way":"<b>'<\/b> = dans l'autre sens","plain letter = clockwise as you look at that corner":"lettre seule = sens horaire quand tu regardes ce coin","<b>R<\/b> right":"<b>R<\/b> droite","<b>L<\/b> left":"<b>L<\/b> gauche","<b>U<\/b> top":"<b>U<\/b> haut","<b>D<\/b> bottom":"<b>D<\/b> bas","<b>F<\/b> front":"<b>F<\/b> avant","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> tourne tout le cube, la face droite vient devant","<b>2<\/b> = twice":"<b>2<\/b> = deux fois","<b>3<\/b> = three times":"<b>3<\/b> = trois fois","plain letter = clockwise as you look at that face":"lettre seule = sens horaire quand tu regardes cette face","Step 0 · the basic move":"Étape 0 · le mouvement de base","The Righty Move":"Le mouvement Righty","Learn this first. Steps 2 and 3 are built from it.":"Apprends-le en premier. Les étapes 2 et 3 sont construites avec.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Tiens le cube comme tu veux. Fais-le <b>6 fois<\/b> et le cube revient au départ.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Dis-le à voix haute en tournant : « droite en haut, haut à gauche, droite en bas, haut à droite ».","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"Ta main droite fait les quatre mouvements. Le pouce devant, l'index pousse le haut.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Six répétitions s'annulent. Super tour à montrer à tes amis, et ça prouve que les formules ne sont pas magiques.","Step 0 · the mirror move":"Étape 0 · le mouvement miroir","The Lefty Move":"Le mouvement Lefty","Righty in a mirror, for the left hand. Same job on the left side.":"Le Righty en miroir, pour la main gauche. Même travail du côté gauche.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Tiens le cube comme tu veux. La main gauche fait les quatre mouvements. Six fois et il revient au départ.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Chaque lettre est inversée comme dans un miroir : R devient L, et chaque mouvement va dans l'autre sens.","Use it in step 2 when the white corner sits above the front-left slot.":"Utilise-le à l'étape 2 quand le coin blanc est au-dessus de l'emplacement avant gauche.","Kids often find this one easier: the left index finger flicks the top toward you.":"Beaucoup d'enfants le trouvent plus facile : l'index gauche pousse le haut vers toi.","Step 1a · white cross":"Étape 1a · croix blanche","Edge on top, white facing up":"Arête en haut, blanc vers le haut","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"Le cas de croix le plus facile. Tourne le haut jusqu'à ce que l'arête soit au-dessus de son emplacement, puis tourne cette face deux fois.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Blanc en bas<\/b>. Une arête blanche est dans la couronne du haut avec l'autocollant blanc <b>vers le haut<\/b>. Tourne le haut jusqu'à ce que son autre couleur soit au-dessus du centre de la même couleur, ici vert sur vert, puis tourne cette face deux fois.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Regarde la couleur sur le côté de l'arête, pas le blanc. Elle te dit quelle face tourner.","Grey pieces do not matter yet. Corners come in step 2.":"Les pièces grises ne comptent pas encore. Les coins viennent à l'étape 2.","Do this for all four edges. Most of the cross is just this move.":"Fais-le pour les quatre arêtes. La croix, c'est surtout ce mouvement.","Step 1b · white cross":"Étape 1b · croix blanche","Edge on top, white facing sideways":"Arête en haut, blanc sur le côté","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Une arête blanche dans la couronne du haut, le blanc tourné vers toi. La fait descendre en bas dans le bon sens.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Blanc en bas. L'arête est <b>en haut à l'avant<\/b> avec l'autocollant blanc <b>vers toi<\/b>. Son autre couleur (en haut) est <b>la même que celle du centre avant<\/b>, ici vert. Sinon, tourne le haut jusqu'à ce que ce soit le cas.","The other cross edges are not disturbed.":"Les autres arêtes de la croix ne bougent pas.","Same ending as 1c: the last three turns tuck the edge in from the left.":"Même fin que 1c : les trois derniers mouvements rentrent l'arête par la gauche.","Step 1c · white cross":"Étape 1c · croix blanche","Edge in the bottom, flipped":"Arête en bas, retournée","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Une arête blanche déjà en bas, mais dans le mauvais sens. La retourne sur place.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Blanc en bas<\/b>, jaune en haut. L'arête à l'envers est <b>en bas à l'avant<\/b>, autocollant blanc vers toi. Les autres arêtes de la croix restent à leur place.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"But de l'étape 1 : un plus blanc en bas, et la couleur sur le côté de chaque arête correspond au centre à côté.","Grey pieces do not matter yet. Only look at the white ones.":"Les pièces grises ne comptent pas encore. Regarde seulement les blanches.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"Arête dans la couronne du haut ? Tourne le haut jusqu'à ce qu'elle soit au-dessus de son emplacement, puis tourne cette face deux fois.","Step 2a · white corners":"Étape 2a · coins blancs","Corner above its slot, white facing right":"Coin au-dessus de son emplacement, blanc vers la droite","The quick case. Three turns and the corner drops in.":"Le cas rapide. Trois mouvements et le coin descend à sa place.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Blanc en bas. Le coin blanc est dans la <b>couronne du haut, juste au-dessus<\/b> de son emplacement <b>avant droit<\/b>, autocollant blanc <b>vers la droite<\/b>. Ses deux autres couleurs correspondent aux centres avant et droit.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"C'est le Righty sans le dernier mouvement. Un Righty complet marche aussi, le mouvement du haut en plus ne change rien ici.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"Pas encore au-dessus de son emplacement ? Tourne la couronne du haut jusqu'à ce qu'il le soit. Un coin va là où ses deux couleurs de côté rencontrent les centres de la même couleur.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"Coin déjà dans l'emplacement mais mal orienté ? Fais un Righty pour le sortir, puis recommence.","Step 2b · white corners":"Étape 2b · coins blancs","Corner above its slot, white facing you":"Coin au-dessus de son emplacement, blanc vers toi","Same corner, white pointing at you. Use the front face instead of the right.":"Même coin, le blanc tourné vers toi. Utilise la face avant au lieu de la droite.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Blanc en bas. Le coin blanc est dans la <b>couronne du haut, au-dessus<\/b> de son emplacement <b>avant droit<\/b>, autocollant blanc <b>vers toi<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Pense miroir : blanc à droite, utilise R. Blanc devant, utilise F.","Righty five times also does it, but this is three turns instead of twenty.":"Cinq Righty marchent aussi, mais ici c'est trois mouvements au lieu de vingt.","Step 2c · white corners":"Étape 2c · coins blancs","Corner above its slot, white facing up":"Coin au-dessus de son emplacement, blanc vers le haut","The slow case: white points at the ceiling. Righty three times.":"Le cas lent : le blanc regarde le plafond. Trois fois Righty.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Blanc en bas. Le coin blanc est dans la <b>couronne du haut, au-dessus<\/b> de son emplacement <b>avant droit<\/b>, autocollant blanc <b>vers le haut<\/b>. Fais des Righty jusqu'à ce que le blanc regarde vers le bas. Ici, il en faut trois.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Regarde le coin après chaque Righty : après un, il est dans l'emplacement mais mal orienté ; après deux, il est revenu en haut avec le blanc vers la droite ; après trois, il est en place.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Tous les cas de coin marchent avec le Righty seul : 1, 3 ou 5 fois. Les cartes 2a et 2b sont juste des raccourcis.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"Ses deux couleurs de côté doivent correspondre aux centres à côté. Sinon, tourne d'abord la couronne du haut.","Step 3a · middle layer":"Étape 3a · couronne du milieu","Edge goes right":"L'arête va à droite","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Fait descendre une arête de la couronne du haut dans l'emplacement avant droit. U R U R' U', tourne tout le cube pour que la face droite soit vers toi, puis L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Blanc fini, en bas. Trouve une arête du haut <b>sans jaune<\/b>. Tourne le haut pour que sa couleur avant corresponde au centre avant. Si sa couleur du haut correspond au centre de <b>droite<\/b>, utilise cette formule.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Deux morceaux : « U R U R' U' », puis tourne tout le cube (y) pour que la face droite soit vers toi, puis « L' U' L ».","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Tourne le cube dans le bon sens : l'ancienne face droite doit finir vers toi. Dans l'autre sens, tu casses la couronne blanche.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Tu regardes maintenant une nouvelle face avant. C'est normal, cherche simplement l'arête suivante à partir de là.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"Une mauvaise arête dans l'emplacement ? Insère n'importe quelle autre arête avec cette formule pour la faire sortir.","Grey pieces are the yellow ones. They do not matter until step 4.":"Les pièces grises sont les jaunes. Elles ne comptent pas avant l'étape 4.","Step 3b · middle layer":"Étape 3b · couronne du milieu","Edge goes left":"L'arête va à gauche","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"Image miroir de 3a : fait descendre l'arête dans l'emplacement avant gauche. U' L' U' L U, tourne tout le cube pour que la face gauche soit vers toi, puis R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Comme 3a, mais la couleur du haut de l'arête correspond au centre de <b>gauche<\/b>.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Deux morceaux : « U' L' U' L U », puis tourne tout le cube (y') pour que la face gauche soit vers toi, puis « R U R' ».","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"C'est 3a en miroir : R devient L, chaque mouvement va dans l'autre sens, et le cube tourne vers la gauche au lieu de la droite.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Tourne le cube dans le bon sens : l'ancienne face gauche doit finir vers toi. Dans l'autre sens, tu casses la couronne blanche.","Once all four middle edges are in, the bottom two layers are done.":"Quand les quatre arêtes du milieu sont en place, les deux couronnes du bas sont finies.","Step 4a · yellow cross":"Étape 4a · croix jaune","Yellow cross from a line":"Croix jaune à partir d'une ligne","Turns a yellow line on top into a yellow plus.":"Transforme une ligne jaune en haut en un plus jaune.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"Les deux couronnes du bas sont finies. Ligne jaune en haut, tenue <b>de gauche à droite<\/b>. Seulement un point jaune ? Fais-le une fois, tu obtiens un L, puis utilise 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"C'est le Righty entouré de F et F'. Tu connais déjà la partie du milieu.","Ignore the yellow corners for now. Only the plus matters.":"Ignore les coins jaunes pour l'instant. Seul le plus compte.","Step 4b · yellow cross":"Étape 4b · croix jaune","Yellow cross from an L":"Croix jaune à partir d'un L","Turns a yellow L shape on top into a yellow plus.":"Transforme un L jaune en haut en un plus jaune.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"L jaune en haut, ses deux bras pointent <b>vers l'arrière et vers la gauche<\/b> (comme 9 h et 12 h sur une horloge).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Presque comme 4a, seul le milieu est « U R U' R' » au lieu de « R U R' U' ».","If the L points the wrong way, turn only the top layer until it fits.":"Si le L est dans le mauvais sens, tourne seulement la couronne du haut jusqu'à ce qu'il soit bien placé.","Step 5 · yellow edges":"Étape 5 · arêtes jaunes","Yellow edges into place (Sune)":"Placer les arêtes jaunes (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Tiens les deux arêtes bien placées <b>à l'arrière et à droite<\/b>, fais le Sune, puis un mouvement U. Les quatre arêtes jaunes correspondent maintenant à leurs centres.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Tourne le haut jusqu'à ce que <b>deux arêtes<\/b> correspondent à leurs centres. Deux côte à côte : tiens-les <b>à l'arrière et à droite<\/b>, fais le Sune, puis <b>U<\/b> une fois. Deux opposées : tiens-les <b>à l'avant et à l'arrière<\/b> et fais le Sune une fois. Maintenant, deux arêtes côte à côte correspondent : fais le premier cas.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"Le dernier mouvement est U (le haut jaune), pas D. Tourner le bas casserait les couronnes blanches.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Cas opposé : après un Sune, la paire bien placée est à l'avant et à droite. Tourne tout le cube pour qu'elle soit à l'arrière et à droite, puis Sune et U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Les coins jaunes vont se mélanger. C'est normal, les étapes 6 et 7 les réparent.","Step 6 · yellow corners":"Étape 6 · coins jaunes","Yellow corners into place (Niklas)":"Placer les coins jaunes (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Le Niklas. Fait tourner trois coins pour que chaque coin soit entre ses propres couleurs. L'orientation ne compte pas encore.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Trouve un coin déjà <b>entre les bonnes couleurs<\/b> (même mal orienté) et tiens-le <b>à l'avant à gauche<\/b>. Aucun n'est bon ? Fais-le une fois depuis n'importe où, puis regarde à nouveau.","The front-left corner stays put, the other three cycle around.":"Le coin avant gauche ne bouge pas, les trois autres tournent.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"N'oublie pas le dernier U. Sans lui, le haut est décalé d'un mouvement et les arêtes jaunes de l'étape 5 ne correspondent plus.","Might need two rounds. Keep the same corner at front left.":"Il faut parfois le faire deux fois. Garde le même coin à l'avant à gauche.","Step 7 · finish":"Étape 7 · fin","Twist the yellow corners":"Orienter les coins jaunes","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Juste le mouvement Righty. Jaune en bas, coin mal orienté en bas à l'avant à droite. Jaune sur le côté : Righty 2 fois. Jaune vers toi : Righty 4 fois. Puis tourne le bas (D) jusqu'au coin suivant.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Retourne le cube : jaune en bas<\/b>, vert toujours vers toi. Place un coin mal orienté <b>en bas à l'avant à droite<\/b> et regarde où pointe son autocollant jaune :<ul class=\"rule\"><li>Jaune <b>sur le côté<\/b> (à droite) &rarr; Righty <b>2 fois<\/b><\/li><li>Jaune <b>vers toi<\/b> &rarr; Righty <b>4 fois<\/b><\/li><li>Jaune <b>vers le bas<\/b> &rarr; ce coin est fini<\/li><\/ul>Puis tourne <b>seulement la couronne du bas (D)<\/b> pour amener le coin mal orienté suivant en bas à l'avant à droite. Ne tourne jamais tout le cube.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"Cet exemple oriente deux coins : le premier a le jaune sur le côté (Righty 2 fois), le second a le jaune vers toi (Righty 4 fois).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"Pas sûr ? Continue simplement les Righty et vérifie le coin tous les 2. Il n'en faut jamais plus de 4.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"À mi-chemin, les deux couronnes du haut ont l'air mélangées. Pas de panique, ne les répare pas. Elles reviennent quand le dernier coin est fini.","Finish with a bottom turn to line up the yellow layer. Solved!":"Termine par un mouvement du bas pour aligner la couronne jaune. Résolu !","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · insertion de base 1","Corner white right, edge at the back":"Coin blanc à droite, arête à l'arrière","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"Le coin et l'arête entrent ensemble dans l'emplacement en une seule fois, au lieu du coin d'abord et de l'arête ensuite.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Coin au-dessus de l'emplacement <b>avant droit<\/b>, blanc <b>vers la droite<\/b>. Son arête est <b>en haut à l'arrière<\/b>, vert en haut.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = les deux premières couronnes (First Two Layers). Tu assembles un coin blanc et son arête du milieu, puis tu les insères ensemble comme une paire.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"D'abord, place-les toi-même : tourne le haut jusqu'à ce que le coin et l'arête soient comme sur l'image.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Commence par la croix blanche comme avant, puis utilise le F2L au lieu des étapes 2 et 3 débutant.","F2L · basic insert 2":"F2L · insertion de base 2","Corner white facing you, edge on the left":"Coin blanc vers toi, arête à gauche","Mirror of insert 1, using the front face.":"Miroir de l'insertion 1, avec la face avant.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Coin au-dessus de l'emplacement <b>avant droit<\/b>, blanc <b>vers toi<\/b>. Son arête est <b>en haut à gauche<\/b>, orange en haut.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Comme l'insertion 1 en miroir : le blanc est vers toi au lieu d'être à droite, donc utilise F au lieu de R.","F2L · basic insert 3":"F2L · insertion de base 3","Corner and edge side by side (right)":"Coin et arête côte à côte (droite)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"Le coin et l'arête sont côte à côte dans la couronne du haut. U les aligne, puis ils descendent ensemble.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Coin au-dessus de l'emplacement <b>avant droit<\/b>, blanc <b>vers toi<\/b> et vert en haut. Son arête est <b>en haut à droite<\/b>, vert en haut.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"Le premier U assemble le coin et l'arête en un bloc. Puis R U' R' insère le bloc.","F2L · basic insert 4":"F2L · insertion de base 4","Corner and edge side by side (front)":"Coin et arête côte à côte (avant)","Mirror of insert 3, using the front face.":"Miroir de l'insertion 3, avec la face avant.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Coin au-dessus de l'emplacement <b>avant droit<\/b>, blanc <b>vers la droite<\/b> et vert vers toi. Son arête est <b>en haut à l'avant<\/b>, vert vers toi.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"Miroir de l'insertion 3 : R devient F', R' devient F, et chaque U tourne dans l'autre sens.","F2L · make a block":"F2L · faire un bloc","Join corner and edge into a block":"Assembler le coin et l'arête en un bloc","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Avec le blanc vers le haut, le coin ne peut pas entrer directement. Assemble d'abord le coin et son arête en un bloc, puis insère le bloc.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Coin au-dessus de l'emplacement <b>avant droit<\/b>, blanc <b>vers le haut<\/b>. Son arête est <b>en haut à l'arrière<\/b>, vert en haut. <b>U R U2 R'<\/b> les assemble en un bloc, <b>U R U' R'<\/b> insère le bloc.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Regarde la bande en dessous : après la première moitié, le coin et l'arête sont côte à côte avec les mêmes couleurs. C'est le bloc.","The second half is basic insert 3. You already know it.":"La seconde moitié est l'insertion de base 3. Tu la connais déjà.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"C'est l'idée principale du F2L : fais un bloc dans la couronne du haut, puis insère-le. La plupart des cas F2L marchent comme ça.","Block made":"Bloc fait","Block in":"Bloc inséré","OLL 1 · yellow cross":"OLL 1 · croix jaune","Dot: make a line or an L":"Point : faire une ligne ou un L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Seuls le centre et les deux coins arrière sont jaunes. Aucune arête jaune. Fais la formule de la ligne ou du L, et une ligne ou un L apparaît.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Jaune en haut : seuls le <b>centre<\/b>, le coin <b>en haut à gauche<\/b> et le coin <b>en haut à droite<\/b> sont jaunes, aucune arête.<ul class=\"rule\"><li>Formule de la ligne <b>F R U R' U' F'<\/b> &rarr; un <b>L<\/b> apparaît<\/li><li>Formule du L <b>F U R U' R' F'<\/b> &rarr; une <b>ligne<\/b> apparaît<\/li><\/ul>Puis finis la croix avec la carte <b>Ligne<\/b> ou <b>Forme en L<\/b> ci-dessous.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"Fini ! Un L est apparu. Tourne le haut pour que ses bras pointent vers l'arrière et vers la gauche, puis fais la formule du L.","The animation does the line formula. The L appears with its arms at the front and right.":"L'animation fait la formule de la ligne. Le L apparaît avec ses bras vers l'avant et vers la droite.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Pour la formule du L, les bras doivent pointer vers l'arrière et vers la gauche : tourne d'abord le haut deux fois (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"Tu as une ligne à la place ? Tiens-la de gauche à droite et refais la formule de la ligne.","Corners do not matter yet. They get fixed in OLL 2.":"Les coins ne comptent pas encore. Ils sont réglés dans l'OLL 2.","Line":"Ligne","Yellow line on top becomes a yellow cross.":"La ligne jaune en haut devient une croix jaune.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Ligne jaune en haut, tenue <b>de gauche à droite<\/b>. La ligne va de l'avant vers l'arrière ? Tourne d'abord le haut une fois (U).","L shape":"Forme en L","Yellow L on top becomes a yellow cross.":"Le L jaune en haut devient une croix jaune.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"L jaune en haut, ses bras pointent <b>vers l'arrière et vers la gauche<\/b> (comme 9 h et 12 h sur une horloge). Ils pointent ailleurs ? Tourne seulement le haut jusqu'à ce que ça corresponde.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Presque comme la formule de la ligne, seul le milieu est « U R U' R' » au lieu de « R U R' U' ».","OLL 2 · yellow corners":"OLL 2 · coins jaunes","Sune":"Sune","One yellow corner up. Looks like a fish.":"Un coin jaune vers le haut. On dirait un poisson.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Croix jaune finie. Le seul coin avec le jaune vers le haut est <b>à l'avant à gauche<\/b>. Le coin avant droit montre son jaune <b>vers toi<\/b>.","You already know this one from beginner step 5.":"Tu le connais déjà : c'est l'étape 5 débutant.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Un coin jaune vers le haut, le poisson dans l'autre sens. Le Sune joué à l'envers.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Le seul coin avec le jaune vers le haut est <b>à l'arrière à droite<\/b>. Le coin avant gauche montre son jaune <b>vers toi<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"C'est le Sune à l'envers : lis le Sune depuis la fin, chaque mouvement dans l'autre sens.","H (double headlights)":"H (double phares)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Aucun coin jaune vers le haut. Deux paires de jaune vers l'extérieur, sur des côtés opposés.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Paires jaunes sur les côtés <b>gauche<\/b> et <b>droit<\/b>.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Commence comme le Sune, avec un « R U' R' U » en plus au milieu.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Aucun coin jaune vers le haut. Une paire jaune sur un côté, les deux autres coins regardent dans des directions opposées.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"La paire jaune (les phares) <b>à gauche<\/b>. À droite, un jaune est vers toi et un vers l'arrière.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = tourne la face droite deux fois. Garde le rythme : R2 U' R2 U' R2.","Headlights":"Phares","Two yellow corners up next to each other, the other two look at you like headlights.":"Deux coins jaunes vers le haut côte à côte, les deux autres te regardent comme des phares.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Les deux coins avec le jaune vers le haut <b>à l'arrière<\/b>. Les phares <b>vers toi<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"Le mouvement D déplace la couronne blanche un instant. D' la remet en place.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Deux coins jaunes vers le haut côte à côte, les deux autres regardent dans des directions opposées.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Les deux coins avec le jaune vers le haut <b>à droite<\/b>. À gauche, un jaune est vers toi et un vers l'arrière.","Small r = turn the right face together with the middle slice.":"Petit r = tourne la face droite avec la tranche du milieu.","Bowtie":"Nœud papillon","Two yellow corners up, diagonal from each other.":"Deux coins jaunes vers le haut, en diagonale.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Coins avec le jaune vers le haut <b>à l'avant à gauche<\/b> et <b>à l'arrière à droite<\/b>. Le coin avant droit montre son jaune <b>vers toi<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"La partie du milieu « r U R' U' r' » est la même que dans le T.","PLL 1 · corners":"PLL 1 · coins","Headlights: T-perm":"Phares : T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Échange deux coins voisins. Utilise-le quand un côté a déjà deux coins de la même couleur (des phares).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Tourne le haut jusqu'à ce qu'un côté ait des <b>phares<\/b> (les deux coins de la même couleur). Tiens ce côté <b>à gauche<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"PLL 2-look : d'abord place les coins (2 cas), puis les arêtes (4 cas).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"Il échange aussi les arêtes gauche et droite. C'est normal, l'étape des arêtes répare ça.","Headlights on every side? Corners are done, go to the edges.":"Des phares sur chaque côté ? Les coins sont finis, passe aux arêtes.","No headlights: Y-perm":"Pas de phares : Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Échange deux coins en diagonale. Utilise-le quand aucun côté n'a de phares.","No headlights on any side. Hold it any way round.":"Aucun côté n'a de phares. Tiens le cube dans n'importe quel sens.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Ce sont deux morceaux de style OLL à la suite. Apprends-le en deux moitiés : « F R U' R' U' R U R' F' » et « R U R' U' R' F R F' ».","PLL 2 · edges":"PLL 2 · arêtes","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Bloc résolu devant toi. L'arête de <b>gauche<\/b> doit aller <b>à droite<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Coins finis. La face résolue (un bloc complet) <b>devant toi<\/b>. L'arête de <b>gauche<\/b> doit aller <b>à droite<\/b> : elle va à droite, l'arête de droite va à l'arrière, l'arête arrière va à gauche.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"Après la formule, tout le haut est décalé d'un demi-tour. Le dernier U2 l'aligne avec les centres.","The front block never changes. Only the left, right and back edges go round.":"Le bloc avant ne change jamais. Seules les arêtes gauche, droite et arrière tournent.","Right edge needs to go left instead? That is the Ub-perm.":"L'arête de droite doit plutôt aller à gauche ? C'est le Ub-perm.","Lined up":"Aligné","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Bloc résolu devant toi. L'arête de <b>droite<\/b> doit aller <b>à gauche<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Coins finis. Le bloc résolu <b>devant toi<\/b>. L'arête de <b>droite<\/b> doit aller <b>à gauche<\/b> : elle va à gauche, l'arête de gauche va à l'arrière, l'arête arrière va à droite.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = tourne la face droite trois fois. Le résultat est le même que R', mais les trois mouvements rapides gardent ton rythme.","The front block never moves. Only the left, right and back edges go round.":"Le bloc avant ne bouge jamais. Seules les arêtes gauche, droite et arrière tournent.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Échange les arêtes opposées : l'avant avec l'arrière, la gauche avec la droite.","Corners done, every edge is opposite its centre. Any way round.":"Coins finis, chaque arête est en face de son centre. Dans n'importe quel sens.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = la tranche du milieu entre L et R, tournée comme L. M2 = deux fois.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Échange des arêtes voisines : l'avant avec la droite, l'arrière avec la gauche.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Coins finis. Les paires échangées <b>à l'avant à droite<\/b> et <b>à l'arrière à gauche<\/b>.","The last U lines the top back up with the centres.":"Le dernier U réaligne le haut avec les centres.","F2L 1":"F2L 1","Case 1":"Cas 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Coin dans l'emplacement, blanc vers le bas. L'arête dans l'emplacement, retournée.","F2L 2":"F2L 2","Case 2":"Cas 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"Coin dans l'emplacement, blanc vers le bas. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 3":"F2L 3","Case 3":"Cas 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"Coin dans l'emplacement, blanc vers le bas. L'arête en haut à droite, vert en haut.","F2L 4":"F2L 4","Case 4":"Cas 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"Coin dans l'emplacement, blanc vers toi. L'arête dans l'emplacement, dans le bon sens.","F2L 5":"F2L 5","Case 5":"Cas 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"Coin dans l'emplacement, blanc vers toi. L'arête dans l'emplacement, retournée.","F2L 6":"F2L 6","Case 6":"Cas 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"Coin dans l'emplacement, blanc vers toi. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 7":"F2L 7","Case 7":"Cas 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"Coin dans l'emplacement, blanc vers toi. L'arête en haut à droite, vert en haut.","F2L 8":"F2L 8","Case 8":"Cas 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"Coin dans l'emplacement, blanc vers la droite. L'arête dans l'emplacement, dans le bon sens.","F2L 9":"F2L 9","Case 9":"Cas 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"Coin dans l'emplacement, blanc vers la droite. L'arête dans l'emplacement, retournée.","F2L 10":"F2L 10","Case 10":"Cas 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"Coin dans l'emplacement, blanc vers la droite. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 11":"F2L 11","Case 11":"Cas 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"Coin dans l'emplacement, blanc vers la droite. L'arête en haut à droite, vert en haut.","F2L 12":"F2L 12","Case 12":"Cas 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête dans l'emplacement, dans le bon sens.","F2L 13":"F2L 13","Case 13":"Cas 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête dans l'emplacement, retournée.","F2L 14":"F2L 14","Case 14":"Cas 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 15":"F2L 15","Case 15":"Cas 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à gauche, vert vers l'extérieur.","F2L 16":"F2L 16","Case 16":"Cas 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à l'arrière, vert vers l'extérieur.","F2L 17":"F2L 17","Case 17":"Cas 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à droite, vert vers l'extérieur.","F2L 18":"F2L 18","Case 18":"Cas 18","Corner on top above the slot, white facing up. The edge on top at the front, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à l'avant, vert en haut.","F2L 19":"F2L 19","Case 19":"Cas 19","Corner on top above the slot, white facing up. The edge on top at the left, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à gauche, vert en haut.","F2L 20":"F2L 20","Case 20":"Cas 20","Corner on top above the slot, white facing up. The edge on top at the back, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à l'arrière, vert en haut.","F2L 21":"F2L 21","Case 21":"Cas 21","Corner on top above the slot, white facing up. The edge on top at the right, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers le haut. L'arête en haut à droite, vert en haut.","F2L 22":"F2L 22","Case 22":"Cas 22","Corner on top above the slot, white facing you. The edge in the slot, the right way round.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête dans l'emplacement, dans le bon sens.","F2L 23":"F2L 23","Case 23":"Cas 23","Corner on top above the slot, white facing you. The edge in the slot, flipped.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête dans l'emplacement, retournée.","F2L 24":"F2L 24","Case 24":"Cas 24","Corner on top above the slot, white facing you. The edge on top at the front, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 25":"F2L 25","Case 25":"Cas 25","Corner on top above the slot, white facing you. The edge on top at the left, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à gauche, vert vers l'extérieur.","F2L 26":"F2L 26","Case 26":"Cas 26","Corner on top above the slot, white facing you. The edge on top at the back, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à l'arrière, vert vers l'extérieur.","F2L 27":"F2L 27","Case 27":"Cas 27","Corner on top above the slot, white facing you. The edge on top at the right, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à droite, vert vers l'extérieur.","F2L 28":"F2L 28","Case 28":"Cas 28","Corner on top above the slot, white facing you. The edge on top at the front, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à l'avant, vert en haut.","F2L 29":"F2L 29","Case 29":"Cas 29","Corner on top above the slot, white facing you. The edge on top at the left, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à gauche, vert en haut.","F2L 30":"F2L 30","Case 30":"Cas 30","Corner on top above the slot, white facing you. The edge on top at the back, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à l'arrière, vert en haut.","F2L 31":"F2L 31","Case 31":"Cas 31","Corner on top above the slot, white facing you. The edge on top at the right, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers toi. L'arête en haut à droite, vert en haut.","F2L 32":"F2L 32","Case 32":"Cas 32","Corner on top above the slot, white facing right. The edge in the slot, the right way round.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête dans l'emplacement, dans le bon sens.","F2L 33":"F2L 33","Case 33":"Cas 33","Corner on top above the slot, white facing right. The edge in the slot, flipped.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête dans l'emplacement, retournée.","F2L 34":"F2L 34","Case 34":"Cas 34","Corner on top above the slot, white facing right. The edge on top at the front, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à l'avant, vert vers l'extérieur.","F2L 35":"F2L 35","Case 35":"Cas 35","Corner on top above the slot, white facing right. The edge on top at the left, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à gauche, vert vers l'extérieur.","F2L 36":"F2L 36","Case 36":"Cas 36","Corner on top above the slot, white facing right. The edge on top at the back, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à l'arrière, vert vers l'extérieur.","F2L 37":"F2L 37","Case 37":"Cas 37","Corner on top above the slot, white facing right. The edge on top at the right, green facing out.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à droite, vert vers l'extérieur.","F2L 38":"F2L 38","Case 38":"Cas 38","Corner on top above the slot, white facing right. The edge on top at the front, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à l'avant, vert en haut.","F2L 39":"F2L 39","Case 39":"Cas 39","Corner on top above the slot, white facing right. The edge on top at the left, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à gauche, vert en haut.","F2L 40":"F2L 40","Case 40":"Cas 40","Corner on top above the slot, white facing right. The edge on top at the back, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à l'arrière, vert en haut.","F2L 41":"F2L 41","Case 41":"Cas 41","Corner on top above the slot, white facing right. The edge on top at the right, green on top.":"Coin en haut, au-dessus de l'emplacement, blanc vers la droite. L'arête en haut à droite, vert en haut.","OLL 1":"OLL 1","No yellow edges and no yellow corners on top.":"Aucune arête jaune et aucun coin jaune en haut.","OLL 2":"OLL 2","OLL 3":"OLL 3","No yellow edges and 1 yellow corner on top.":"Aucune arête jaune et 1 coin jaune en haut.","OLL 4":"OLL 4","OLL 5":"OLL 5","2 yellow edges and 1 yellow corner on top.":"2 arêtes jaunes et 1 coin jaune en haut.","OLL 6":"OLL 6","OLL 7":"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"Aucune arête jaune et 2 coins jaunes en haut.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"Aucune arête jaune et 4 coins jaunes en haut.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"4 arêtes jaunes et aucun coin jaune en haut.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"4 arêtes jaunes et 2 coins jaunes en haut.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"4 arêtes jaunes et 1 coin jaune en haut.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"2 arêtes jaunes et 4 coins jaunes en haut.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"2 arêtes jaunes et 2 coins jaunes en haut.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Cas 42","OLL 43":"OLL 43","Case 43":"Cas 43","OLL 44":"OLL 44","Case 44":"Cas 44","OLL 45":"OLL 45","Case 45":"Cas 45","OLL 46":"OLL 46","Case 46":"Cas 46","OLL 47":"OLL 47","Case 47":"Cas 47","2 yellow edges and no yellow corners on top.":"2 arêtes jaunes et aucun coin jaune en haut.","OLL 48":"OLL 48","Case 48":"Cas 48","OLL 49":"OLL 49","Case 49":"Cas 49","OLL 50":"OLL 50","Case 50":"Cas 50","OLL 51":"OLL 51","Case 51":"Cas 51","OLL 52":"OLL 52","Case 52":"Cas 52","OLL 53":"OLL 53","Case 53":"Cas 53","OLL 54":"OLL 54","Case 54":"Cas 54","OLL 55":"OLL 55","Case 55":"Cas 55","OLL 56":"OLL 56","Case 56":"Cas 56","OLL 57":"OLL 57","Case 57":"Cas 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Étape 1a · couronne blanche","Corner above its spot, white facing right":"Coin au-dessus de sa place, blanc vers la droite","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Comme l'étape 2a du 3x3. Trois mouvements et le coin blanc descend à sa place.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Blanc en bas<\/b>. Un 2x2 n'a pas de centres : le <b>premier<\/b> coin blanc peut aller n'importe où. Chaque coin suivant va là où ses couleurs de côté <b>correspondent aux coins blancs à côté<\/b>. Ici, le coin est <b>au-dessus de sa place<\/b> à l'avant à droite, blanc <b>vers la droite<\/b>.","Not above its spot yet? Turn the top until it is.":"Pas encore au-dessus de sa place ? Tourne le haut jusqu'à ce qu'il le soit.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"Coin déjà en bas mais à la mauvaise place ou mal orienté ? Tiens-le à l'avant à droite et fais un Righty pour le sortir.","Righty once works here too.":"Un Righty marche aussi ici.","2x2 · Step 1b · white layer":"2x2 · Étape 1b · couronne blanche","Corner above its spot, white facing you":"Coin au-dessus de sa place, blanc vers toi","Same as 3x3 step 2b: white facing you, so use the front face.":"Comme l'étape 2b du 3x3 : blanc vers toi, donc utilise la face avant.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Blanc en bas. Le coin blanc est <b>au-dessus de sa place<\/b> à l'avant à droite, blanc <b>vers toi<\/b>.","Righty five times also does it.":"Cinq Righty marchent aussi.","2x2 · Step 1c · white layer":"2x2 · Étape 1c · couronne blanche","Corner above its spot, white facing up":"Coin au-dessus de sa place, blanc vers le haut","Same as 3x3 step 2c: Righty three times.":"Comme l'étape 2c du 3x3 : trois fois Righty.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Blanc en bas. Le coin blanc est <b>au-dessus de sa place<\/b> à l'avant à droite, blanc <b>vers le haut<\/b>. Fais des Righty jusqu'à ce que le blanc regarde vers le bas.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Chaque coin blanc se place avec le Righty seul : 1, 3 ou 5 fois.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Fais-le pour les quatre coins blancs. La couronne blanche est finie quand les couleurs de côté de chaque coin blanc correspondent à celles d'à côté.","2x2 · Step 2 · yellow corners":"2x2 · Étape 2 · coins jaunes","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Comme l'étape 6 du 3x3. Fait tourner trois coins du haut pour que chaque coin soit au-dessus du coin blanc qui lui correspond. L'orientation ne compte pas encore.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Couronne blanche finie, en bas. Un coin du haut est <b>à sa place<\/b> quand ses couleurs de côté correspondent aux coins blancs en dessous (même mal orienté). Tourne le haut jusqu'à ce qu'<b>exactement un<\/b> coin soit à sa place et tiens-le <b>à l'avant à gauche<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"Le coin avant gauche ne bouge pas, les trois autres tournent. Il faut parfois le faire deux fois.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"Aucune position du haut ne donne exactement un coin à sa place ? Fais-le une fois depuis n'importe où, puis regarde à nouveau. Ça peut arriver sur un 2x2, jamais sur un 3x3.","All four in place? Go to step 3.":"Les quatre sont à leur place ? Passe à l'étape 3.","2x2 · Step 3 · finish":"2x2 · Étape 3 · fin","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Comme l'étape 7 du 3x3. Jaune en bas, coin mal orienté en bas à l'avant à droite. Jaune sur le côté : Righty 2 fois. Jaune vers toi : Righty 4 fois. Puis tourne le bas (D) jusqu'au coin suivant.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Retourne le cube : jaune en bas.<\/b> Place un coin mal orienté <b>en bas à l'avant à droite<\/b> et regarde où pointe son autocollant jaune :<ul class=\"rule\"><li>Jaune <b>sur le côté<\/b> (à droite) &rarr; Righty <b>2 fois<\/b><\/li><li>Jaune <b>vers toi<\/b> &rarr; Righty <b>4 fois<\/b><\/li><li>Jaune <b>vers le bas<\/b> &rarr; ce coin est fini<\/li><\/ul>Puis tourne <b>seulement la couronne du bas (D)<\/b> pour amener le coin mal orienté suivant à cet endroit. Ne tourne jamais tout le cube.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"À mi-chemin, la couronne blanche a l'air mélangée. Continue, elle revient quand le dernier coin est fini.","At the end, turn one layer until the two layers line up. Solved!":"À la fin, tourne une couronne jusqu'à ce que les deux couronnes soient alignées. Résolu !","2x2 · Orientation 1 of 3":"2x2 · Orientation 1 sur 3","Sune: one yellow corner up":"Sune : un coin jaune vers le haut","One yellow corner up. Makes the top yellow, or another case you then fix.":"Un coin jaune vers le haut. Rend le haut jaune, ou donne un autre cas que tu règles ensuite.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Couronne blanche finie, en bas. Tiens le coin avec le jaune vers le haut <b>à l'avant à gauche<\/b>. Le coin avant droit montre son jaune <b>vers toi<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"Deux coins jaunes vers le haut ? Tiens le cube pour que le coin avant gauche montre son jaune vers toi, fais le Sune, puis regarde à nouveau.","It never takes more than three orientation algorithms in a row.":"Il ne faut jamais plus de trois algorithmes d'orientat
