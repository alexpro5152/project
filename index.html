\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Белый снизу<\/b>. У 2x2 нет центров: <b>первый<\/b> белый угол может стоять где угодно. Каждый следующий угол встаёт туда, где его боковые цвета <b>совпадают с белыми углами рядом<\/b>. Здесь угол <b>над своим местом<\/b> спереди справа, белым <b>вправо<\/b>.","Not above its spot yet? Turn the top until it is.":"Ещё не над своим местом? Крути верх, пока не окажется.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"Угол уже внизу, но не на своём месте или повёрнут? Держи его спереди справа и сделай один Righty, чтобы вытащить его.","Righty once works here too.":"Один Righty здесь тоже подойдёт.","2x2 · Step 1b · white layer":"2x2 · Шаг 1b · белый слой","Corner above its spot, white facing you":"Угол над своим местом, белым к тебе","Same as 3x3 step 2b: white facing you, so use the front face.":"Как шаг 2b на 3x3: белый смотрит на тебя, поэтому используй переднюю грань.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Белый снизу. Белый угол <b>над своим местом<\/b> спереди справа, белым <b>к тебе<\/b>.","Righty five times also does it.":"Righty пять раз тоже сработает.","2x2 · Step 1c · white layer":"2x2 · Шаг 1c · белый слой","Corner above its spot, white facing up":"Угол над своим местом, белым вверх","Same as 3x3 step 2c: Righty three times.":"Как шаг 2c на 3x3: Righty три раза.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Белый снизу. Белый угол <b>над своим местом<\/b> спереди справа, белым <b>вверх<\/b>. Делай Righty, пока белый не посмотрит вниз.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Любой белый угол решается одним Righty: 1, 3 или 5 раз.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Сделай так со всеми четырьмя белыми углами. Белый слой готов, когда боковые цвета каждого белого угла совпадают с соседними.","2x2 · Step 2 · yellow corners":"2x2 · Шаг 2 · жёлтые углы","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Как шаг 6 на 3x3. Переставляет три верхних угла по кругу, чтобы каждый угол встал над своим белым углом. Как он повёрнут, пока не важно.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Белый слой готов, внизу. Верхний угол <b>на месте<\/b>, когда его боковые цвета совпадают с белыми углами под ним (повёрнутый — тоже годится). Крути верх, пока на месте не окажется <b>ровно один<\/b> угол, и держи его <b>спереди слева<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"Передний левый угол остаётся на месте, остальные три ходят по кругу. Может понадобиться два раза.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"Ни при каком повороте верха на месте не оказывается ровно один угол? Сделай формулу один раз с любого места, затем посмотри снова. На 2x2 так бывает, на 3x3 — никогда.","All four in place? Go to step 3.":"Все четыре на месте? Переходи к шагу 3.","2x2 · Step 3 · finish":"2x2 · Шаг 3 · финиш","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Как шаг 7 на 3x3. Жёлтый вниз, повёрнутый угол снизу спереди справа. Жёлтый смотрит вбок: Righty 2 раза. Жёлтый смотрит на тебя: Righty 4 раза. Затем поверни низ (D) к следующему углу.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Переверни кубик: жёлтый снизу.<\/b> Поставь повёрнутый угол <b>снизу спереди справа<\/b> и посмотри, куда смотрит его жёлтая наклейка:<ul class=\"rule\"><li>Жёлтый смотрит <b>вбок<\/b> (вправо) &rarr; Righty <b>2 раза<\/b><\/li><li>Жёлтый смотрит <b>на тебя<\/b> &rarr; Righty <b>4 раза<\/b><\/li><li>Жёлтый смотрит <b>вниз<\/b> &rarr; этот угол готов<\/li><\/ul>Затем поворачивай <b>только нижний слой (D)<\/b>, чтобы привести туда следующий повёрнутый угол. Никогда не поворачивай весь кубик.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"По ходу белый слой выглядит перемешанным. Продолжай, он вернётся, когда последний угол будет готов.","At the end, turn one layer until the two layers line up. Solved!":"В конце крути один слой, пока два слоя не выровняются. Собрано!","2x2 · Orientation 1 of 3":"2x2 · Ориентация 1/3","Sune: one yellow corner up":"Sune: один жёлтый угол вверх","One yellow corner up. Makes the top yellow, or another case you then fix.":"Один жёлтый угол вверх. Делает весь верх жёлтым или даёт другой случай, который ты потом решишь.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Белый слой готов, внизу. Держи угол жёлтым вверх <b>спереди слева<\/b>. У переднего правого угла жёлтый <b>смотрит на тебя<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"Два жёлтых угла вверх? Держи кубик так, чтобы у переднего левого угла жёлтый смотрел на тебя, сделай Sune, затем посмотри снова.","It never takes more than three orientation algorithms in a row.":"Больше трёх алгоритмов ориентации подряд никогда не нужно.","2x2 · Orientation 2 of 3":"2x2 · Ориентация 2/3","Antisune: one yellow corner up, other way":"Antisune: один жёлтый угол вверх, в другую сторону","One yellow corner up, the other way round from the Sune.":"Один жёлтый угол вверх, но наоборот по сравнению с Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Держи угол жёлтым вверх <b>сзади справа<\/b>. У переднего левого угла жёлтый <b>смотрит на тебя<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Если не подходит ни картинка Sune, ни Antisune, поверни верх и посмотри снова.","2x2 · Orientation 3 of 3":"2x2 · Ориентация 3/3","Pi: no yellow corner up":"Pi: ни одного жёлтого угла вверх","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Ни одного жёлтого угла вверх. После него весь жёлтый наверху, или получается случай Sune или Antisune.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Сверху нет жёлтого. Держи кубик так, чтобы у обоих <b>левых<\/b> углов жёлтый смотрел <b>влево<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"Жёлтые пары слева и справа? Держи любую из пар слева.","R2 = turn the right side twice.":"R2 = поверни правую грань дважды.","2x2 · Permutation 1 of 2":"2x2 · Перестановка 1/2","T-perm: headlights on one side":"T-perm: фары на одной грани","All yellow is up. Swaps two corners next to each other.":"Весь жёлтый наверху. Меняет местами два соседних угла.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Найди <b>фары<\/b>: грань, где обе верхние наклейки одного цвета. Держи эту грань <b>слева<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"Фары на каждой грани? Менять нечего: просто поверни верх, чтобы всё совпало.","After the T-perm, turn the top until the cube is solved.":"После T-perm крути верх, пока кубик не соберётся.","2x2 · Permutation 2 of 2":"2x2 · Перестановка 2/2","Y-perm: no headlights":"Y-perm: нет фар","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Весь жёлтый наверху, но фар нет ни на одной грани. Меняет местами два угла по диагонали.","No headlights anywhere. Hold it any way round.":"Фар нигде нет. Держи кубик как угодно.","After the Y-perm, turn the top until the cube is solved.":"После Y-perm крути верх, пока кубик не соберётся.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Учи по половинкам: «F R U' R' U' R U R' F'» и «R U R' U' R' F R F'».","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"Делает весь жёлтый вверх. Белая грань остаётся снизу.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Один жёлтый угол вверх <b>спереди слева<\/b>. У переднего правого угла жёлтый <b>смотрит на тебя<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"Сначала белая грань снизу: вниз должен смотреть только белый, бока могут быть перемешаны.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Один жёлтый угол вверх <b>сзади справа<\/b>. У переднего левого угла жёлтый <b>смотрит на тебя<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Ни одного жёлтого угла вверх. Жёлтые пары на <b>левой<\/b> и <b>правой<\/b> гранях.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Ни одного жёлтого угла вверх. Жёлтая пара <b>слева<\/b>; справа один жёлтый смотрит на тебя, а другой назад.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Два жёлтых угла вверх <b>сзади<\/b>. У двух других жёлтый <b>смотрит на тебя<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Два жёлтых угла вверх <b>справа<\/b>. Слева один жёлтый смотрит на тебя, а другой назад.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Жёлтые углы вверх <b>спереди слева<\/b> и <b>сзади справа<\/b>. У переднего правого угла жёлтый <b>смотрит на тебя<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"Верх: фары, низ: готов","All yellow up, all white down. Fixes both layers at once.":"Весь жёлтый вверху, весь белый внизу. Исправляет оба слоя сразу.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Верхний слой: фары <b>слева<\/b>. Нижний слой: уже правильный.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Фары<\/b> = грань, где обе наклейки этого слоя одного цвета.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"Верх правильный, а низ нет? Переверни весь кубик, чтобы плохой слой оказался сверху, затем используй карточку 1 или 2.","After the algorithm, turn the top and bottom until the cube is solved.":"После алгоритма крути верх и низ, пока кубик не соберётся.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"Верх: нет фар, низ: готов","Top layer: no headlights. Bottom layer: already right.":"Верхний слой: нет фар. Нижний слой: уже правильный.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"Оба слоя: фары","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Фары в <b>обоих<\/b> слоях. Поверни верх и низ так, чтобы обе пары фар были <b>спереди<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"Оба слоя: нет фар","No headlights in either layer. Hold it any way round.":"Ни в одном слое нет фар. Держи кубик как угодно.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"Верх: фары, низ: нет","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Верхний слой: фары <b>спереди<\/b>. Нижний слой: нет фар.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"Верх: нет, низ: фары","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Верхний слой: нет фар. Нижний слой: фары <b>сзади<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Шаг 1 · вершинки","Turn the tips":"Поверни вершинки","The easiest step: each tip turns on its own.":"Самый простой шаг: каждая вершинка крутится сама по себе.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Поворачивай каждую вершинку (<b>u l r b<\/b>), пока её три цвета не совпадут с <b>тремя центрами<\/b> прямо рядом с ней.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"У вершинки три цвета. Каждый должен совпасть с центральным треугольником прямо под ним на той же грани.","Turning a tip never moves anything else, so you can always fix the tips first.":"Поворот вершинки больше ничего не сдвигает, поэтому вершинки всегда можно поправить первыми.","Pyraminx · Step 2 · centres":"Pyraminx · Шаг 2 · центры","Match the centres":"Совмести центры","Turn whole corners until every face has three centres of the same colour.":"Поворачивай целые углы, пока на каждой грани три центра не станут одного цвета.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Поворачивай целые углы (<b>U L R B<\/b>), пока на каждой грани <b>три центра<\/b> не станут одного цвета. Затем держи головоломку <b>жёлтой гранью вниз<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Каждый угол крутится вместе со своей вершинкой и тремя центрами, поэтому шаг 1 не сбивается.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"Рёбра при этом перемешиваются. Это нормально, шаги 3 и 4 их исправят.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Шаг 3a · нижние рёбра","Edge on the right, yellow facing you":"Ребро справа, жёлтым к тебе","Puts the green-yellow edge into the front bottom.":"Ставит зелёно-жёлтое ребро вниз спереди.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Жёлтая грань снизу. Ребро, которое должно стоять <b>спереди снизу<\/b>, находится на <b>переднем правом<\/b> ребре, жёлтым <b>к тебе<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Поверни всю головоломку (жёлтый остаётся внизу), чтобы место, которое нужно заполнить, оказалось спереди снизу.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"Ребро уже внизу, но не на своём месте или перевёрнуто? Держи это место спереди снизу и сделай это один раз, чтобы поднять ребро наверх.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Шаг 3b · нижние рёбра","Edge on the right, yellow facing right":"Ребро справа, жёлтым вправо","Same edge, the other way round.":"То же ребро, но наоборот.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"Ребро находится на <b>переднем правом<\/b> ребре, жёлтым <b>вправо<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Шаг 3c · нижние рёбра","Edge on the left, yellow facing you":"Ребро слева, жёлтым к тебе","The edge is on the left side.":"Ребро на левой стороне.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"Ребро находится на <b>переднем левом<\/b> ребре, жёлтым <b>к тебе<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Шаг 3d · нижние рёбра","Edge on the left, yellow facing left":"Ребро слева, жёлтым влево","Mirror of 3b.":"Зеркало 3b.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"Ребро находится на <b>переднем левом<\/b> ребре, жёлтым <b>влево<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Шаг 3e · нижние рёбра","Edge at the back, yellow facing right":"Ребро сзади, жёлтым вправо","The edge is on the back edge.":"Ребро на заднем ребре.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"Ребро находится на <b>заднем<\/b> ребре, жёлтым <b>вправо<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Шаг 3f · нижние рёбра","Edge at the back, yellow facing left":"Ребро сзади, жёлтым влево","Mirror of 3e.":"Зеркало 3e.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"Ребро находится на <b>заднем<\/b> ребре, жёлтым <b>влево<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Сделай так со всеми тремя нижними рёбрами. Жёлтая грань готова, когда каждое нижнее ребро совпадает с центрами с обеих сторон.","Pyraminx · Step 4a · last edges":"Pyraminx · Шаг 4a · последние рёбра","Edges go round (one way)":"Рёбра по кругу (в одну сторону)","Moves the three top edges round.":"Переставляет три верхних ребра по кругу.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Жёлтая грань готова, внизу. <b>Ни одно<\/b> верхнее ребро не на своём месте. <b>Переднее левое<\/b> ребро должно стоять <b>спереди справа<\/b>.","After it, two edges may be flipped. Then do 4c.":"После этого два ребра могут оказаться перевёрнутыми. Тогда сделай 4c.","You never need more than two algorithms for the last edges.":"Для последних рёбер никогда не нужно больше двух алгоритмов.","Pyraminx · Step 4b · last edges":"Pyraminx · Шаг 4b · последние рёбра","Edges go round (other way)":"Рёбра по кругу (в другую сторону)","Moves the three top edges round the other way.":"Переставляет три верхних ребра по кругу в другую сторону.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Ни одно<\/b> верхнее ребро не на своём месте. <b>Переднее левое<\/b> ребро должно стоять <b>сзади<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Шаг 4c · последние рёбра","Two edges flipped":"Два ребра перевёрнуты","All three top edges are in their place, but two are flipped.":"Все три верхних ребра на своих местах, но два перевёрнуты.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Все верхние рёбра на своих местах, два из них перевёрнуты. Держи головоломку так, чтобы <b>правильное ребро было сзади<\/b>.","Solved!":"Собрано!","4x4 · 1 · edge pairing":"4x4 · 1 · сборка рёбер","Join two halves opposite each other":"Соедини две половинки напротив друг друга","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"Ребро 4x4 состоит из двух половинок. Когда половинки стоят напротив друг друга, это соединяет их в одно ребро.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Центры готовы. Две половинки одного ребра (здесь <b>сине-оранжевого<\/b>) стоят <b>напротив друг друга<\/b>: одна <b>вверху переднего левого<\/b> ребра, другая <b>вверху переднего правого<\/b> ребра, у обеих <b>оранжевый к тебе<\/b>. Цветные только сине-оранжевые элементы, чтобы за ними было легко следить.","Joined! The blue-orange edge is now one piece, at the front right.":"Соединено! Сине-оранжевое ребро теперь одно целое, спереди справа.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = два верхних слоя вместе. Uw' переносит левую половинку направо, Uw в конце возвращает центры на место.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"Средняя часть «R U R' F R' F' R» подставляет готовое ребро, чтобы две половинки могли встретиться. Остальной кубик перемешивается: это нормально, потом ты соберёшь его как 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Собери так все 12 рёбер, затем собирай 4x4 как 3x3.","Edge joined":"Ребро соединено","4x4 · 1b · edge pairing":"4x4 · 1b · сборка рёбер","Combine with the centre layer, then swap it out":"Соедини внутренним слоем, затем убери ребро","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Поверни только внутренний слой, чтобы соединить две половинки, замени собранное ребро на ещё не собранное, затем верни внутренний слой назад.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Центры готовы. Две половинки одного ребра (здесь <b>сине-оранжевого<\/b>) стоят <b>по диагонали<\/b>: одна <b>вверху переднего левого<\/b> ребра, <b>оранжевым к тебе<\/b>, другая <b>внизу переднего правого<\/b> ребра, <b>синим к тебе<\/b>. Цветные только сине-оранжевые элементы, чтобы за ними было легко следить.","Joined! The blue-orange edge is now one piece, at the top front.":"Соединено! Сине-оранжевое ребро теперь одно целое, сверху спереди.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"У этого поворота есть название: <b>поворот внутреннего слоя<\/b>. Маленькая u значит: поверни <b>только верхний внутренний слой<\/b> (второй слой сверху). Верхний слой не двигается.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = этот внутренний слой поворачивается вправо (как U'). Верхняя половинка уходит вправо и встаёт над нижней: ребро собрано.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' поднимает собранное ребро наверх и ставит на его место ещё не собранное ребро.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = поверни внутренний слой обратно, и центры снова собраны. Собранное ребро остаётся целым наверху.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Если нижняя половинка слева, а верхняя справа, поверни внутренний слой в другую сторону: u L' U' L u'.","Halves combined":"Половинки соединены","Swapped out":"Ребро заменено","4x4 · 2 · OLL parity":"4x4 · 2 · паритет OLL","No 3x3 OLL fits":"Ни одна OLL для 3x3 не подходит","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Когда для твоего верха <b>нет алгоритма 3x3<\/b>, сделай это. Такое бывает только на 4x4: перевёрнуто нечётное число верхних рёбер (1 или 3), как на картинке. Это переворачивает переднее ребро, и обычная OLL для 3x3 снова работает.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Жёлтый сверху. Как на картинке: <b>перевёрнуты 3 ребра<\/b> (переднее, правое и заднее показывают сверху свой цвет), только у <b>левого<\/b> ребра сверху жёлтый. На картинке верх виден сверху, передняя сторона внизу. Держи <b>перевёрнутое ребро спереди<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Теперь перевёрнуто чётное число рёбер (заднее и левое), а два передних угла повёрнуты: снова обычный случай 3x3. Закончи своими OLL и PLL для 3x3.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"Как заметить: посчитай верхние рёбра, у которых сверху не жёлтый. 1 или 3 = ни один алгоритм 3x3 не подходит, сначала сделай этот.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>два правых слоя вместе<\/b> (широкий поворот), Lw = два левых слоя вместе. Во многих шпаргалках это пишут маленькими r и l.","U2 and F2 turn only the outer top and front layer, twice.":"U2 и F2 поворачивают только внешний верхний и передний слой, дважды.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"Переднее ребро переворачивается. Некоторые другие верхние элементы тоже сдвигаются: это нормально, твои обычные OLL и PLL для 3x3 их исправят.","4x4 · 3 · PLL parity":"4x4 · 3 · паритет PLL","Two edges swapped":"Два ребра поменялись местами","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"Тоже только на 4x4: в самом конце два противоположных верхних ребра поменялись местами. Это меняет их обратно.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Всё собрано, кроме <b>переднего<\/b> и <b>заднего<\/b> верхних рёбер, которые <b>поменялись местами<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = два верхних слоя дважды. Rw2 = два правых слоя дважды. r2 = только второй слой справа, дважды.","Only these two edges change. Everything else stays where it is.":"Меняются только эти два ребра. Всё остальное остаётся на месте.","Mirror cube · last layer":"Mirror cube · последний слой","Three corners (A-perm)":"Три угла (A-perm)","Moves three top corners around. Everything else stays where it is.":"Переставляет три верхних угла по кругу. Всё остальное остаётся на месте.","Beginner 3x3":"3x3 для новичков","Beginner":"Новичок","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"Классический метод для новичков. Держи кубик <b>жёлтым вверх<\/b> и <b>зелёным к себе<\/b>:\n       сначала собирается белый внизу, в конце жёлтый сверху. Нажми на шаг, чтобы увидеть, как он работает.","Intermediate 3x3":"3x3: средний уровень","Intermediate":"Средний уровень","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"Следующая ступень: белый крест как раньше, затем <b>F2L<\/b> (угол и ребро вместе),\n       <b>OLL в 2 этапа<\/b> (весь жёлтый сверху) и <b>PLL в 2 этапа<\/b> (всё на своих местах). Хват тот же: жёлтый сверху, зелёный к тебе.","Advanced F2L (3x3)":"Продвинутый F2L (3x3)","Advanced F2L":"Продвинутый F2L","Advanced OLL (3x3)":"Продвинутый OLL (3x3)","Advanced OLL":"Продвинутый OLL","Advanced PLL (3x3)":"Продвинутый PLL (3x3)","Advanced PLL":"Продвинутый PLL","2x2 Beginner":"2x2 для новичков","2x2 Intermediate":"2x2: средний уровень","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"Белый слой как у новичков. Затем <b>3 алгоритма<\/b> делают весь верх жёлтым, а <b>2 алгоритма<\/b> ставят углы на места.","2x2 Advanced":"2x2: продвинутый","Advanced":"Продвинутый","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"Метод <b>Ortega<\/b>. Сначала собери <b>белую грань<\/b> снизу (бока пока могут не совпадать). Затем один из <b>7 алгоритмов<\/b> поворачивает весь жёлтый вверх, а один из <b>6 алгоритмов<\/b> исправляет оба слоя сразу.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Головоломки и большие кубики","push it up, away from you":"толкни вверх, от себя","pull it down, toward you":"потяни вниз, к себе","swing it to the left":"поверни влево","swing it to the right":"поверни вправо","turn it clockwise, like a clock":"поверни по часовой стрелке","turn it anticlockwise":"поверни против часовой стрелки","push them up, away from you":"толкни вверх, от себя","pull them down, toward you":"потяни вниз, к себе","turn them clockwise, like a clock":"поверни по часовой стрелке","turn them anticlockwise":"поверни против часовой стрелки","swing them to the right":"поверни вправо","swing them to the left":"поверни влево","clockwise as seen from behind":"по часовой стрелке, если смотреть сзади","anticlockwise as seen from behind":"против часовой стрелки, если смотреть сзади","swing it to the right (like D)":"поверни вправо (как D)","turn it clockwise, like F":"поверни по часовой стрелке, как F","tip it so the front comes to the top":"наклони так, чтобы передняя грань ушла наверх","tip it so the top comes to the front":"наклони так, чтобы верхняя грань ушла вперёд","roll it to the right, like F":"перекати вправо, как F","roll it to the left":"перекати влево","pull it down, toward you (like L)":"потяни вниз, к себе (как L)","turn it so the right side faces you":"поверни так, чтобы правая грань смотрела на тебя","turn it so the left side faces you":"поверни так, чтобы левая грань смотрела на тебя","Right face":"Правая грань","Left face":"Левая грань","Top face":"Верхняя грань","Bottom face":"Нижняя грань","Front face":"Передняя грань","Back face":"Задняя грань","Whole cube":"Весь кубик","Right two layers":"Два правых слоя","Left two layers":"Два левых слоя","Front two layers":"Два передних слоя","Bottom two layers":"Два нижних слоя","Top two layers":"Два верхних слоя","Back two layers":"Два задних слоя","Middle slice":"Средний слой","Middle layer":"Средний слой","Front-back middle slice":"Средний слой между передней и задней гранью","Only the centre layer next to the right (slice move, the right layer stays still)":"Только внутренний слой рядом с правой гранью (поворот внутреннего слоя, правый слой стоит на месте)","Only the centre layer next to the left (slice move, the left layer stays still)":"Только внутренний слой рядом с левой гранью (поворот внутреннего слоя, левый слой стоит на месте)","Only the centre layer next to the top (slice move, the top layer stays still)":"Только внутренний слой рядом с верхней гранью (поворот внутреннего слоя, верхний слой стоит на месте)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Только внутренний слой рядом с нижней гранью (поворот внутреннего слоя, нижний слой стоит на месте)","Only the centre layer next to the front (slice move, the front layer stays still)":"Только внутренний слой рядом с передней гранью (поворот внутреннего слоя, передний слой стоит на месте)","Only the centre layer next to the back (slice move, the back layer stays still)":"Только внутренний слой рядом с задней гранью (поворот внутреннего слоя, задний слой стоит на месте)","Top corner with its layer":"Верхний угол со своим слоем","Top tip only":"Только верхняя вершинка","Left corner with its layer":"Левый угол со своим слоем","Left tip only":"Только левая вершинка","Right corner with its layer":"Правый угол со своим слоем","Right tip only":"Только правая вершинка","Back corner with its layer":"Задний угол со своим слоем","Back tip only":"Только задняя вершинка","turn it clockwise, as you look at that corner":"поверни по часовой стрелке, если смотреть на этот угол","turn it anticlockwise, as you look at that corner":"поверни против часовой стрелки, если смотреть на этот угол","{what}: half a turn (turn it twice)":"{what}: пол-оборота (поверни дважды)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: три поворота, итог как у {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"Английский (Великобритания)","English (US)":"Английский (США)","Arabic":"Арабский","Chinese":"Китайский","French":"Французский","German":"Немецкий","Hindi":"Хинди","Korean":"Корейский","Portuguese":"Португальский","Russian":"Русский","Spanish":"Испанский"},"zh":{"Cube Algorithms":"魔方公式","Settings":"设置","Grip: yellow on top, green facing you":"握法：黄色朝上，绿色朝向你","Light":"浅色","Dark":"深色","Switch to light mode":"切换到浅色模式","Switch to dark mode":"切换到深色模式","Top layer at the start":"开始时的顶层","Algorithms":"公式","Turn the cube back":"把魔方转回来","All {name} steps":"{name} 的全部步骤","Step back":"后退一步","Play":"播放","Step":"单步","Reset":"重置","Reset view":"重置视角","Play {n}× (back to start!)":"播放 {n} 次（回到起点！）","Speed":"速度","Drag or swipe the cube to turn it around.":"拖动或滑动魔方，可以转着看。","Start":"开始","solved":"已还原","before":"之前","End":"结束","Step {n}":"第 {n} 步","after {label}":"{label} 之后","Round {r} of {n}: {mv}":"第 {r}/{n} 轮：{mv}","{n} rounds later... back exactly where we started!":"{n} 轮之后……正好回到了起点！","Undo {mv}":"撤销 {mv}","Press Play, or Step through one turn at a time.":"按“播放”，或者按“单步”一次转一下。","Done! Try Play 6x: the cube comes back to the start.":"完成！试试播放 6 次：魔方会回到起点。","Done! That is what this step fixes.":"完成！这就是这一步要解决的问题。","{i} of {n} turns done. Next: {mv}.":"已转 {i}/{n} 下。下一步：{mv}。","Languages":"语言","Estonian":"爱沙尼亚语","<b>r<\/b> right two layers":"<b>r<\/b> 右边两层","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> 中间层，转法同 L","<b>d<\/b> bottom two layers":"<b>d<\/b> 底部两层","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = 括号里的做 3 次","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> 右边两层一起转","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> 顶部两层一起转","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> 只转从右 / 左 / 上数第二层（内层，中间那层）","<b>M<\/b> middle slice, like L":"<b>M<\/b> 中间层，方向同 L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> 翻转 / 侧滚整个魔方","<b>y<\/b> turn the whole cube":"<b>y<\/b> 水平转动整个魔方","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> 底部 / 顶部两层","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> 两层一起转","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> 前后之间的中间层，方向同 F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> 翻转整个魔方，方向同 R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = 括号里的做两次","<b>U<\/b> top corner":"<b>U<\/b> 顶角","<b>L<\/b> front-left corner":"<b>L<\/b> 左前角","<b>R<\/b> front-right corner":"<b>R<\/b> 右前角","<b>B<\/b> back corner":"<b>B<\/b> 后角","capital = the corner with its whole layer":"大写 = 角连同它的整层一起转","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = 只转小角","<b>'<\/b> = the other way":"<b>'<\/b> = 反方向","plain letter = clockwise as you look at that corner":"普通字母 = 看着那个角时顺时针转","<b>R<\/b> right":"<b>R<\/b> 右","<b>L<\/b> left":"<b>L<\/b> 左","<b>U<\/b> top":"<b>U<\/b> 上","<b>D<\/b> bottom":"<b>D<\/b> 下","<b>F<\/b> front":"<b>F<\/b> 前","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> 转动整个魔方，把右面转到前面","<b>2<\/b> = twice":"<b>2<\/b> = 两次","<b>3<\/b> = three times":"<b>3<\/b> = 三次","plain letter = clockwise as you look at that face":"普通字母 = 看着那个面时顺时针转","Step 0 · the basic move":"第 0 步 · 基本动作","The Righty Move":"Righty 动作（右手公式）","Learn this first. Steps 2 and 3 are built from it.":"先学这个。第 2 步和第 3 步都由它组成。","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"魔方怎么拿都行。做 <b>6 次<\/b>，魔方就会回到起点。","Say it out loud while you turn: \"right up, top left, right down, top right\".":"边转边大声说：“右上，顶左，右下，顶右”。","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"四下全由右手完成。拇指放在前面，食指拨动顶层。","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"重复六次就会自己复原。这是很好玩的小把戏，也证明了公式不是魔法。","Step 0 · the mirror move":"第 0 步 · 镜像动作","The Lefty Move":"Lefty 动作（左手公式）","Righty in a mirror, for the left hand. Same job on the left side.":"镜子里的 Righty，给左手用。在左边做同样的事。","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"魔方怎么拿都行。四下全由左手完成。做六次就回到起点。","Every letter is mirrored: R becomes L, and each turn goes the other way.":"每个字母都镜像：R 变成 L，每一下都反方向转。","Use it in step 2 when the white corner sits above the front-left slot.":"在第 2 步中，白色角块在左前槽位上方时用它。","Kids often find this one easier: the left index finger flicks the top toward you.":"很多小朋友觉得这个更容易：用左手食指把顶层往你这边拨。","Step 1a · white cross":"第 1a 步 · 白色十字","Edge on top, white facing up":"棱块在顶层，白色朝上","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"最简单的十字情况。转动顶层，直到棱块位于它的槽位上方，然后把那个面转两次。","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>白色在底面<\/b>。一个白色棱块在顶层，白色色片<b>朝上<\/b>。转动顶层，直到它的另一种颜色对准相同颜色的中心块（这里是绿对绿），然后把那个面转两次。","Look at the side colour of the edge, not the white. It tells you which face to turn.":"看棱块侧面的颜色，不是白色。它告诉你该转哪个面。","Grey pieces do not matter yet. Corners come in step 2.":"灰色的块现在不重要。角块在第 2 步处理。","Do this for all four edges. Most of the cross is just this move.":"四个棱块都这样做。十字大部分就靠这一招。","Step 1b · white cross":"第 1b 步 · 白色十字","Edge on top, white facing sideways":"棱块在顶层，白色朝侧面","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"顶层的白色棱块，白色朝向你。这个公式把它正确地放进底层。","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"白色在底面。棱块在<b>顶层前面<\/b>，白色色片<b>朝向你<\/b>。它的另一种颜色（在顶面）和<b>前面中心块颜色相同<\/b>，这里是绿色。如果不同，就转动顶层直到相同。","The other cross edges are not disturbed.":"其他十字棱块不会被打乱。","Same ending as 1c: the last three turns tuck the edge in from the left.":"和 1c 的结尾一样：最后三下从左边把棱块塞进去。","Step 1c · white cross":"第 1c 步 · 白色十字","Edge in the bottom, flipped":"棱块在底层，但翻转了","A white edge already in the bottom, but the wrong way round. Flips it in place.":"白色棱块已经在底层，但方向反了。这个公式把它原地翻过来。","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>白色在底面<\/b>，黄色在顶面。方向反了的棱块在<b>前面底部<\/b>，白色色片朝向你。其他十字棱块保持不动。","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"第 1 步的目标：底面有一个白色十字，每个棱块的侧面颜色都和旁边的中心块一致。","Grey pieces do not matter yet. Only look at the white ones.":"灰色的块现在不重要。只看白色的块。","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"棱块在顶层？转动顶层直到它在槽位上方，然后把那个面转两次。","Step 2a · white corners":"第 2a 步 · 白色角块","Corner above its slot, white facing right":"角块在槽位上方，白色朝右","The quick case. Three turns and the corner drops in.":"快速情况。三下，角块就落进去了。","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"白色在底面。白色角块在<b>顶层<\/b>，就在它的<b>右前<\/b>槽位正上方，白色色片<b>朝右<\/b>。它另外两种颜色和前面、右面的中心块一致。","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"这就是少了最后一下的 Righty。做一次完整的 Righty 也可以，这里多转一下顶层没有影响。","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"还没在槽位上方？转动顶层直到对准。角块的位置，就是它两种侧面颜色和对应中心块相遇的地方。","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"角块已经在槽位里，但扭转了？做一次 Righty 把它弹出来，再重新开始。","Step 2b · white corners":"第 2b 步 · 白色角块","Corner above its slot, white facing you":"角块在槽位上方，白色朝向你","Same corner, white pointing at you. Use the front face instead of the right.":"同一个角块，白色朝向你。用前面代替右面。","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"白色在底面。白色角块在<b>顶层<\/b>，位于<b>右前<\/b>槽位上方，白色色片<b>朝向你<\/b>。","Mirror thinking: white on the right, use R. White on the front, use F.":"镜像思考：白色在右，用 R。白色在前，用 F。","Righty five times also does it, but this is three turns instead of twenty.":"做五次 Righty 也行，但这个只要三下，而不是二十下。","Step 2c · white corners":"第 2c 步 · 白色角块","Corner above its slot, white facing up":"角块在槽位上方，白色朝上","The slow case: white points at the ceiling. Righty three times.":"慢的情况：白色朝着天花板。做三次 Righty。","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"白色在底面。白色角块在<b>顶层<\/b>，位于<b>右前<\/b>槽位上方，白色色片<b>朝上<\/b>。一直做 Righty，直到白色朝下。这里要做三轮。","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"每做一次 Righty 就看看角块：一次后它在槽位里但扭转了，两次后它回到顶层、白色朝右，三次后就进去了。","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"任何角块情况只用 Righty 都能解决：1、3 或 5 轮。2a 和 2b 只是捷径。","Its two side colours must match the centres next to it. If not, turn the top layer first.":"它的两种侧面颜色必须和旁边的中心块一致。不一致的话，先转动顶层。","Step 3a · middle layer":"第 3a 步 · 中层","Edge goes right":"棱块往右","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"把顶层的一个棱块放进右前槽位。U R U R' U'，转动整个魔方让右面朝向你，然后 L' U' L。","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"白色已完成，在底面。找一个<b>没有黄色<\/b>的顶层棱块。转动顶层，让它前面的颜色和前面中心块一致。如果它顶面的颜色和<b>右面<\/b>中心块一致，就用这个。","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"分两段：“U R U R' U'”，然后转动整个魔方（y），让右面朝向你，再做“L' U' L”。","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"整个魔方要往正确的方向转：原来的右面要转到朝向你。转反了会打乱白色层。","You end up looking at a new front side. That is fine, just find the next edge from there.":"你会看着一个新的前面。没关系，从那里找下一个棱块就行。","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"槽位里有个错的棱块？用这个公式把任意别的棱块放进去，就能把它弹出来。","Grey pieces are the yellow ones. They do not matter until step 4.":"灰色的块就是黄色的那些。第 4 步之前都不用管。","Step 3b · middle layer":"第 3b 步 · 中层","Edge goes left":"棱块往左","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"3a 的镜像：把棱块放进左前槽位。U' L' U' L U，转动整个魔方让左面朝向你，然后 R U R'。","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"和 3a 一样，但棱块顶面的颜色和<b>左面<\/b>中心块一致。","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"分两段：“U' L' U' L U”，然后转动整个魔方（y'），让左面朝向你，再做“R U R'”。","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"它就是镜子里的 3a：R 变成 L，每一下都反方向，整个魔方往左转而不是往右转。","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"整个魔方要往正确的方向转：原来的左面要转到朝向你。转反了会打乱白色层。","Once all four middle edges are in, the bottom two layers are done.":"四个中层棱块都放好后，下面两层就完成了。","Step 4a · yellow cross":"第 4a 步 · 黄色十字","Yellow cross from a line":"从一字到黄色十字","Turns a yellow line on top into a yellow plus.":"把顶面的黄色一字变成黄色十字。","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"下面两层已完成。顶面有黄色一字，<b>左右横放<\/b>。只有一个黄点？先做一次，会得到 L 形，然后用 4b。","This is Righty wrapped in F and F'. You already know the middle part.":"这就是用 F 和 F' 包起来的 Righty。中间部分你已经会了。","Ignore the yellow corners for now. Only the plus matters.":"先别管黄色角块。只看十字。","Step 4b · yellow cross":"第 4b 步 · 黄色十字","Yellow cross from an L":"从 L 形到黄色十字","Turns a yellow L shape on top into a yellow plus.":"把顶面的黄色 L 形变成黄色十字。","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"顶面有黄色 L 形，两条边指向<b>后面和左面<\/b>（像钟面上的 9 点和 12 点）。","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"和 4a 几乎一样，只是中间是“U R U' R'”而不是“R U R' U'”。","If the L points the wrong way, turn only the top layer until it fits.":"如果 L 形方向不对，只转顶层直到对上。","Step 5 · yellow edges":"第 5 步 · 黄色棱块","Yellow edges into place (Sune)":"黄色棱块归位（Sune / 小鱼）","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"把两个已对好的棱块放在<b>后面和右面<\/b>，做 Sune，再转一下 U。四个黄色棱块就都和中心块对上了。","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"转动顶层，直到有<b>两个棱块<\/b>和中心块对上。两个相邻：把它们放在<b>后面和右面<\/b>，做 Sune，然后做一次 <b>U<\/b>。两个相对：把它们放在<b>前面和后面<\/b>，做一次 Sune。这时会有两个相邻的对上，再按第一种情况做。","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"最后一下是 U（黄色顶层），不是 D。转底层会打乱白色层。","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"相对的情况：做一次 Sune 后，对好的两个在前面和右面。转动整个魔方让它们到后面和右面，再做 Sune 和 U。","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"黄色角块会被扭来扭去。没关系，第 6 步和第 7 步会处理。","Step 6 · yellow corners":"第 6 步 · 黄色角块","Yellow corners into place (Niklas)":"黄色角块归位（Niklas）","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Niklas 公式。让三个角块轮换位置，使每个角块都位于自己的颜色之间。朝向现在还不重要。","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"找一个已经<b>位于正确颜色之间<\/b>的角块（扭转了也没关系），把它放在<b>左前<\/b>。一个都没有？随便从哪里做一次，然后再看。","The front-left corner stays put, the other three cycle around.":"左前角块不动，其他三个轮换。","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"别忘了最后的 U。没有它，顶层会差一下，第 5 步的黄色棱块就对不上了。","Might need two rounds. Keep the same corner at front left.":"可能要做两轮。保持同一个角块在左前。","Step 7 · finish":"第 7 步 · 完成","Twist the yellow corners":"扭转黄色角块","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"只用 Righty 动作。黄色朝下，扭转的角块放在底层右前。黄色朝侧面：Righty 2 次。黄色朝向你：Righty 4 次。然后转动底层（D）换到下一个角块。","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>把魔方翻过来：黄色在底面<\/b>，绿色仍朝向你。把一个扭转的角块放在<b>底层右前<\/b>，看它的黄色色片朝哪里：<ul class=\"rule\"><li>黄色朝<b>侧面<\/b>（右）&rarr; Righty <b>2 次<\/b><\/li><li>黄色<b>朝向你<\/b> &rarr; Righty <b>4 次<\/b><\/li><li>黄色<b>朝下<\/b> &rarr; 这个角块已经好了<\/li><\/ul>然后<b>只转底层（D）<\/b>，把下一个扭转的角块转到底层右前。千万不要转整个魔方。","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"这个例子扭转两个角块：第一个黄色朝侧面（Righty 2 次），第二个黄色朝向你（Righty 4 次）。","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"不确定？就一直做 Righty，每做 2 次检查一下角块。最多不超过 4 次。","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"做到一半时，上面两层看起来是乱的。别慌，也别去修。最后一个角块完成时，它们会自己恢复。","Finish with a bottom turn to line up the yellow layer. Solved!":"最后转一下底层，把黄色层对齐。还原了！","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · 基础插入 1","Corner white right, edge at the back":"角块白色朝右，棱块在后面","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"角块和棱块一次一起放进槽位，而不是先放角块、再放棱块。","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"角块在<b>右前<\/b>槽位上方，白色<b>朝右<\/b>。它的棱块在<b>顶层后面<\/b>，绿色朝上。","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = 前两层（First Two Layers）。你把一个白色角块和它对应的中层棱块配在一起，然后作为一对放进去。","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"先自己配对：转动顶层，直到角块和棱块的位置和图里一样。","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"照常先做白色十字，然后用 F2L 代替入门法的第 2 步和第 3 步。","F2L · basic insert 2":"F2L · 基础插入 2","Corner white facing you, edge on the left":"角块白色朝向你，棱块在左边","Mirror of insert 1, using the front face.":"插入 1 的镜像，用前面来做。","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"角块在<b>右前<\/b>槽位上方，白色<b>朝向你<\/b>。它的棱块在<b>顶层左边<\/b>，橙色朝上。","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"和插入 1 镜像：白色朝向你而不是朝右，所以用 F 代替 R。","F2L · basic insert 3":"F2L · 基础插入 3","Corner and edge side by side (right)":"角块和棱块挨在一起（右边）","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"角块和棱块在顶层挨在一起。U 把它们对齐，然后一起落进去。","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"角块在<b>右前<\/b>槽位上方，白色<b>朝向你<\/b>，绿色朝上。它的棱块在<b>顶层右边<\/b>，绿色朝上。","The first U joins corner and edge into a block. R U' R' then puts the block in.":"第一下 U 把角块和棱块连成一个块组。然后 R U' R' 把块组放进去。","F2L · basic insert 4":"F2L · 基础插入 4","Corner and edge side by side (front)":"角块和棱块挨在一起（前面）","Mirror of insert 3, using the front face.":"插入 3 的镜像，用前面来做。","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"角块在<b>右前<\/b>槽位上方，白色<b>朝右<\/b>，绿色朝向你。它的棱块在<b>顶层前面<\/b>，绿色朝向你。","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"插入 3 的镜像：R 变成 F'，R' 变成 F，每个 U 都反方向转。","F2L · make a block":"F2L · 组成块组","Join corner and edge into a block":"把角块和棱块连成块组","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"白色朝上的角块不能直接放进去。先把角块和它的棱块连成一个块组，再把块组放进去。","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"角块在<b>右前<\/b>槽位上方，白色<b>朝上<\/b>。它的棱块在<b>顶层后面<\/b>，绿色朝上。<b>U R U2 R'<\/b> 把它们连成块组，<b>U R U' R'<\/b> 把块组放进去。","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"看下面的步骤条：做完前半段后，角块和棱块并排在一起，颜色对上了。这就是块组。","The second half is basic insert 3. You already know it.":"后半段就是基础插入 3。你已经会了。","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"这就是 F2L 的核心思路：先在顶层组成块组，再把它放进去。大多数 F2L 情况都是这样做的。","Block made":"块组完成","Block in":"块组放入","OLL 1 · yellow cross":"OLL 1 · 黄色十字","Dot: make a line or an L":"点：做出一字或 L 形","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"只有黄色中心块和后面两个角块是黄色的，没有黄色棱块。做一字公式或 L 形公式，就会出现一字或 L 形。","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"黄色在顶面：只有<b>中心块<\/b>、<b>左上<\/b>和<b>右上<\/b>角块是黄色，没有棱块。<ul class=\"rule\"><li>一字公式 <b>F R U R' U' F'<\/b> &rarr; 出现 <b>L 形<\/b><\/li><li>L 形公式 <b>F U R U' R' F'<\/b> &rarr; 出现<b>一字<\/b><\/li><\/ul>然后用下面的<b>一字<\/b>或<b>L 形<\/b>卡片完成十字。","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"完成！出现了 L 形。转动顶层，让两条边指向后面和左面，然后做 L 形公式。","The animation does the line formula. The L appears with its arms at the front and right.":"动画做的是一字公式。出现的 L 形两条边在前面和右面。","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"做 L 形公式时，两条边必须指向后面和左面，所以先把顶层转两次（U2）。","Got a line instead? Hold it left to right and do the line formula once more.":"得到的是一字？把它左右横放，再做一次一字公式。","Corners do not matter yet. They get fixed in OLL 2.":"角块现在还不重要。它们在 OLL 2 中处理。","Line":"一字","Yellow line on top becomes a yellow cross.":"顶面的黄色一字变成黄色十字。","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"顶面有黄色一字，<b>左右横放<\/b>。一字是前后方向的？先转一下顶层（U）。","L shape":"L 形","Yellow L on top becomes a yellow cross.":"顶面的黄色 L 形变成黄色十字。","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"顶面有黄色 L 形，两条边指向<b>后面和左面<\/b>（像钟面上的 9 点和 12 点）。指向别处？只转顶层直到对上。","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"和一字公式几乎一样，只是中间是“U R U' R'”而不是“R U R' U'”。","OLL 2 · yellow corners":"OLL 2 · 黄色角块","Sune":"Sune（小鱼）","One yellow corner up. Looks like a fish.":"一个黄色角块朝上。看起来像一条鱼。","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"黄色十字已完成。唯一黄色朝上的角块在<b>左前<\/b>。右前角块的黄色<b>朝向你<\/b>。","You already know this one from beginner step 5.":"这个你在入门法第 5 步已经学过了。","Antisune":"Antisune（反小鱼）","One yellow corner up, the fish the other way. Sune played backwards.":"一个黄色角块朝上，鱼的方向相反。就是倒着做的 Sune。","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"唯一黄色朝上的角块在<b>右后<\/b>。左前角块的黄色<b>朝向你<\/b>。","It is the Sune backwards: read the Sune from the end, every turn the other way.":"它就是倒过来的 Sune：从最后往前读 Sune，每一下都反方向。","H (double headlights)":"H（双车灯）","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"没有黄色角块朝上。两对黄色在相对的两侧朝外。","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"两对黄色在<b>左面<\/b>和<b>右面<\/b>。","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"开头和 Sune 一样，中间多了一段“R U' R' U”。","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"没有黄色角块朝上。一侧有一对黄色，另外两个角块的黄色朝向相反。","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"一对黄色（车灯）在<b>左面<\/b>。右边一个黄色朝向你，一个朝后。","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = 右面转两次。保持节奏：R2 U' R2 U' R2。","Headlights":"车灯","Two yellow corners up next to each other, the other two look at you like headlights.":"两个相邻的黄色角块朝上，另外两个像车灯一样看着你。","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"两个黄色朝上的角块在<b>后面<\/b>。车灯<b>朝向你<\/b>。","The D turn moves the white layer for a moment. D' puts it back.":"D 会暂时移动白色层。D' 再把它放回去。","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"两个相邻的黄色角块朝上，另外两个的黄色朝向相反。","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"两个黄色朝上的角块在<b>右边<\/b>。左边一个黄色朝向你，一个朝后。","Small r = turn the right face together with the middle slice.":"小写 r = 右面和中间层一起转。","Bowtie":"领结","Two yellow corners up, diagonal from each other.":"两个黄色角块朝上，在对角位置。","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"黄色朝上的角块在<b>左前<\/b>和<b>右后<\/b>。右前角块的黄色<b>朝向你<\/b>。","The middle part \"r U R' U' r'\" is the same as in the T.":"中间部分“r U R' U' r'”和 T 里的一样。","PLL 1 · corners":"PLL 1 · 角块","Headlights: T-perm":"有车灯：T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"交换两个相邻的角块。当某一侧的两个角块颜色已经相同（车灯）时用它。","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"转动顶层，直到某一侧有<b>车灯<\/b>（两个角块颜色相同）。把这一侧放在<b>左边<\/b>。","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"2-look PLL（两步 PLL）：先让角块归位（2 种情况），再处理棱块（4 种情况）。","It also swaps the left and right edges. That is fine, the edge step fixes it.":"它也会交换左右两个棱块。没关系，棱块那一步会处理。","Headlights on every side? Corners are done, go to the edges.":"每一侧都有车灯？角块已经好了，去做棱块。","No headlights: Y-perm":"没有车灯：Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"沿对角线交换两个角块。任何一侧都没有车灯时用它。","No headlights on any side. Hold it any way round.":"任何一侧都没有车灯。怎么拿都行。","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"它是连着的两段 OLL 风格公式。分两半学：“F R U' R' U' R U R' F'”和“R U R' U' R' F R F'”。","PLL 2 · edges":"PLL 2 · 棱块","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"已还原的块组在你面前。<b>左边<\/b>的棱块需要去<b>右边<\/b>。","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"角块已完成。已还原的一面（完整的块组）<b>在你面前<\/b>。<b>左边<\/b>的棱块属于<b>右边<\/b>：它去右边，右边的棱块去后面，后面的棱块去左边。","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"做完公式后，整个顶层差半圈。最后的 U2 把它和中心块对齐。","The front block never changes. Only the left, right and back edges go round.":"前面的块组一直不变。只有左、右、后三个棱块在轮换。","Right edge needs to go left instead? That is the Ub-perm.":"右边的棱块要去左边？那就是 Ub-perm。","Lined up":"已对齐","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"已还原的块组在你面前。<b>右边<\/b>的棱块需要去<b>左边<\/b>。","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"角块已完成。已还原的块组<b>在你面前<\/b>。<b>右边<\/b>的棱块属于<b>左边<\/b>：它去左边，左边的棱块去后面，后面的棱块去右边。","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = 右面转三次。结果和 R' 一样，但连转三下能保持节奏。","The front block never moves. Only the left, right and back edges go round.":"前面的块组一直不动。只有左、右、后三个棱块在轮换。","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"交换相对的棱块：前和后，左和右。","Corners done, every edge is opposite its centre. Any way round.":"角块已完成，每个棱块都在它的中心块对面。怎么拿都行。","M = the middle slice between L and R, turned like
