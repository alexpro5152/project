<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Algorithms</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1c2233; --muted:#6b7280;
    --accent:#2563eb; --hi:#fde047; --line:#e3e7f0;
    --W:#ffffff; --Y:#ffd500; --R:#e53935; --O:#ff8c00; --G:#2ecc40; --B:#1e63d4; --dim:#c3c8d4;
    --panel:#ffffff; --edge:#d7dbe6; --faint:#9aa3b5; --body:#3b4254; --on-accent:#ffffff; --on-hi:#1c2233;
    --track:#e3e7f0; --thumb:#9aa3b5;
    color-scheme:light;
  }
  /* dark theme: picked with the header button, or the system setting when nothing is picked */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420; --card:#1a2130; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --line:#2a3346; --edge:#364055;
      --faint:#6c768c; --body:#c9cfdc; --accent:#4f8cff; --dim:#4a5368; color-scheme:dark;
      --track:#1a2130; --thumb:#4f5a72;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --card:#1a2130; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --line:#2a3346; --edge:#364055;
    --faint:#6c768c; --body:#c9cfdc; --accent:#4f8cff; --dim:#4a5368; color-scheme:dark;
    --track:#1a2130; --thumb:#4f5a72;
  }
  *{box-sizing:border-box}
  /* big, easy-to-grab page scroll bar */
  ::-webkit-scrollbar{width:22px;height:22px}
  ::-webkit-scrollbar-track{background:var(--track)}
  ::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:11px;border:4px solid var(--track);min-height:80px}
  ::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background:var(--accent)}
  @supports not selector(::-webkit-scrollbar){ html{scrollbar-width:auto;scrollbar-color:var(--thumb) var(--track)} }
  body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit;text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  .settings-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--ink)}
  .settings-btn:hover{color:var(--accent)}
  .lang-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;border:2px solid var(--edge);background:var(--panel);font-size:19px;font-weight:700}
  button.lang-row{width:100%;text-align:left;font:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer}
  .lang-row .lang-name{flex:1;display:flex;flex-direction:column}
  .lang-row .lang-name small{font-size:14px;font-weight:500;color:var(--muted)}
  [dir=rtl] button.lang-row{text-align:right}
  /* right-to-left languages: the moves, buttons and the before/after strip still read left to right */
  [dir=rtl] .formula,[dir=rtl] .f,[dir=rtl] .controls,[dir=rtl] .strip,[dir=rtl] .turn-badge{direction:ltr}
  .lang-row.on{border-color:var(--accent)}
  .lang-row .check{color:var(--accent);font-size:24px;line-height:1}
  .flag{width:40px;height:26px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .settings-list{width:min(520px,100%);display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:14px;border:2px solid var(--edge);background:var(--panel);font-size:19px;font-weight:700}
  .set-row .chev{color:var(--muted);font-size:24px;line-height:1}
  .set-row:hover{border-color:var(--accent)}
  header .grip{color:var(--muted);font-size:15px}
  header .right{display:flex;align-items:center;gap:14px}
  .theme{font-size:15px;padding:6px 12px;border-radius:10px}
  main{max-width:1100px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;align-items:center}
  /* very long words (German, Russian…) break with a hyphen instead of making the page wider; moves never break */
  main{overflow-wrap:break-word;hyphens:auto}
  main>*{max-width:100%}
  .formula,.f,.tok,.turn-badge{hyphens:none}
  h1{font-size:34px;margin:0 0 6px;text-align:center}
  h2{font-size:30px;margin:0 0 4px;text-align:center}
  .sub{color:var(--muted);margin:0 0 18px;font-size:18px;text-align:center;max-width:720px;line-height:1.45}
  .sub b{color:var(--ink)}

  /* --- cube --- */
  .scene{perspective:1100px;perspective-origin:50% 45%}
  .cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
  .cube, .cube *{pointer-events:none}   /* the scene around the puzzle handles dragging; the puzzle never covers buttons */
  .cubie{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .face{position:absolute;background:#111}
  .cube.mirror .face::after{inset:3%;border-radius:6%}
  .pyra-st{position:absolute;left:50%;top:50%;transform-origin:0 0;transform-style:preserve-3d}
  .pyra-st i{position:absolute;left:0;top:0}
  .pyra-back{background:#111;transform:translateZ(-.6px);backface-visibility:hidden}
  .pyra-front{backface-visibility:hidden}
  .face::after{content:'';position:absolute;inset:4%;border-radius:12%;background:var(--c,#1b1b1b)}
  .cubie.dim .face::after{background:var(--dim)}
  .cubie.dim .face.inner::after{background:#1b1b1b}
  .big{position:relative}
  .turn-badge{position:absolute;left:10px;top:8px;z-index:2;pointer-events:none;font:800 34px/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;background:var(--accent);border-radius:12px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s}
  .turn-badge.on{opacity:1;transform:none}

  /* --- overview --- */
  .levels{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 16px}
  .lvl{font-size:15px;font-weight:700;padding:7px 14px;border-radius:10px;border:2px solid var(--edge);background:var(--panel);color:var(--ink)}
  .lvl:hover{border-color:var(--accent)}
  .lvl.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .puzzles{margin-bottom:10px}
  .lvl.pz{display:inline-flex;align-items:center;gap:7px}
  .pz-icon{width:20px;height:20px;flex:none}
  .caret{font-size:11px;opacity:.8}
  .sublevels{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:0}
  .sublevels .lvl{font-size:14px;padding:6px 12px}
  .sublevels.third{margin-top:-8px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--muted);font-size:15px;margin:0 0 22px;
          background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;max-width:760px}
  .legend b{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;width:100%}
  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px 16px;display:flex;flex-direction:column;
        gap:6px;transition:border-color .2s,transform .2s;cursor:pointer}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .step{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .card .scene{width:100%;height:150px;perspective:600px;margin:2px 0;cursor:grab;touch-action:pan-y;user-select:none}
  .card .scene.dragging{cursor:grabbing}
  .scene-wrap{position:relative}
  .card-reset{position:absolute;top:2px;right:0;font-size:18px;line-height:1;padding:6px 9px;border-radius:10px}
  .net{display:flex;justify-content:center;align-items:center;height:150px;margin:2px 0}
  .net svg{height:100%;width:auto}
  .net rect{stroke:#111;stroke-width:2}
  .big-net{height:170px;margin:4px 0 12px}
  .card h3{margin:0;font-size:19px}
  .card .f{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:18px;color:var(--ink);word-break:break-word}
  .card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}

  /* --- detail --- */
  .back{align-self:flex-start;color:var(--accent);font-weight:600;font-size:16px;margin-bottom:10px}
  .hold{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:17px;max-width:720px;text-align:center;
        margin:0 0 14px;line-height:1.45}
  .hold b{color:var(--accent)}
  .hold .rule{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center}
  .hold .rule li{background:var(--bg);border-radius:10px;padding:4px 12px}
  .formula{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;font-size:42px;font-weight:800;font-family:ui-monospace,Consolas,monospace;margin:4px 0;max-width:100%}
  .formula.long{font-size:26px;gap:8px}
  .tok{padding:4px 18px;border-radius:14px;background:var(--card);border:3px solid transparent;color:var(--faint);transition:all .25s;max-width:100%;text-align:center}
  .formula.long .tok{padding:2px 12px}
  .tok.done{color:var(--ink)}
  .tok.active{border-color:var(--accent);background:var(--hi);color:var(--on-hi);transform:scale(1.1)}
  .desc{min-height:32px;font-size:21px;color:var(--muted);margin:8px 0 4px;text-align:center;max-width:700px}
  .big{width:min(520px,100%);height:520px;margin:4px 0 0;touch-action:none;cursor:grab;user-select:none}
  .big.dragging{cursor:grabbing}
  .cube.settle{transition:transform .45s ease}
  .drag-hint{color:var(--muted);font-size:14px;margin:0 0 6px;text-align:center}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:8px 0 4px}
  button{font:inherit;font-size:18px;font-weight:600;padding:10px 18px;border-radius:12px;border:2px solid var(--edge);background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .speed{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:16px;margin-left:8px}
  .strip{display:flex;gap:6px;align-items:center;margin-top:20px;flex-wrap:wrap;justify-content:center}
  .snap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px 6px;border-radius:14px;background:var(--card);
        border:3px solid transparent;transition:border-color .25s}
  .snap.active{border-color:var(--accent)}
  .snap .scene{width:130px;height:145px;perspective:520px}
  .snap .lbl{font-weight:700;font-size:15px;text-align:center}
  .snap .lbl small{display:block;color:var(--muted);font-weight:500;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  .arrow{font-size:28px;color:var(--faint)}
  .tips{max-width:720px;margin:24px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 22px 14px 36px;font-size:16px;line-height:1.55;color:var(--body)}
  .tips li{margin:4px 0}
  .nav{display:flex;gap:14px;margin-top:22px;font-weight:600;color:var(--accent);font-size:17px;flex-wrap:wrap;justify-content:center}
  @media (max-width:560px){
    .big{height:380px}
    .formula{font-size:32px;gap:8px} .tok{padding:2px 12px}
    .arrow{display:none}
    header .grip{display:none}
  }
</style>
</head>
<body>
<header>
  <a class="settings-btn" href="#settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></a>
  <div class="right">
    <span class="grip">Grip: yellow on top, green facing you</span>
    <button class="theme" id="theme" type="button"></button>
  </div>
</header>
<main id="app"></main>

<script>
/* Language. English is built in; I18N holds, for every other language, each English text and its
   translation, and tr() picks the one for the chosen language. The choice is remembered in this browser. */
const I18N = /*I18N-START*/{"et":{"Cube Algorithms":"Kuubiku algoritmid","Settings":"Seaded","Grip: yellow on top, green facing you":"Haare: kollane üleval, roheline sinu poole","Light":"Hele","Dark":"Tume","Switch to light mode":"Lülita heledale","Switch to dark mode":"Lülita tumedale","Top layer at the start":"Pealmine kiht alguses","Algorithms":"Algoritmid","Turn the cube back":"Keera kuubik tagasi","All {name} steps":"Kõik sammud: {name}","Step back":"Samm tagasi","Play":"Esita","Step":"Samm","Reset":"Algusesse","Reset view":"Vaade tagasi","Play {n}× (back to start!)":"Esita {n}× (tagasi algusesse!)","Speed":"Kiirus","Drag or swipe the cube to turn it around.":"Lohista või libista kuubikut, et seda igast küljest vaadata.","Start":"Algus","solved":"lahendatud","before":"enne","End":"Lõpp","Step {n}":"Samm {n}","after {label}":"pärast {label}","Round {r} of {n}: {mv}":"Ring {r}/{n}: {mv}","{n} rounds later... back exactly where we started!":"{n} ringi hiljem... täpselt seal, kust alustasime!","Undo {mv}":"Tagasi {mv}","Press Play, or Step through one turn at a time.":"Vajuta Esita või mine nupuga Samm läbi üks pööre korraga.","Done! Try Play 6x: the cube comes back to the start.":"Valmis! Proovi Esita 6×: kuubik tuleb tagasi algusesse.","Done! That is what this step fixes.":"Valmis! Just seda see samm parandab.","{i} of {n} turns done. Next: {mv}.":"{i}/{n} pööret tehtud. Järgmine: {mv}.","Languages":"Keeled","Estonian":"Eesti","<b>r<\/b> right two layers":"<b>r<\/b> parempoolsed kaks kihti","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> keskmine kiht, keeratakse nagu L","<b>d<\/b> bottom two layers":"<b>d<\/b> alumised kaks kihti","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = tee sulgudes olev 3 korda","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> parempoolsed kaks kihti koos","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> pealmised kaks kihti koos","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> ainult teine kiht paremalt / vasakult / ülevalt (keskkihi pööre)","<b>M<\/b> middle slice, like L":"<b>M<\/b> keskmine kiht, nagu L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> kalluta / veereta tervet kuubikut","<b>y<\/b> turn the whole cube":"<b>y<\/b> pööra tervet kuubikut","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> alumised / pealmised kaks kihti","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> kaks kihti korraga","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> keskmine kiht eest taha, nagu F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> kalluta tervet kuubikut, nagu R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = tee sulgudes olev kaks korda","<b>U<\/b> top corner":"<b>U<\/b> ülemine nurk","<b>L<\/b> front-left corner":"<b>L<\/b> vasak eesmine nurk","<b>R<\/b> front-right corner":"<b>R<\/b> parem eesmine nurk","<b>B<\/b> back corner":"<b>B<\/b> tagumine nurk","capital = the corner with its whole layer":"suur täht = nurk koos terve kihiga","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = ainult tipp","<b>'<\/b> = the other way":"<b>'<\/b> = teistpidi","plain letter = clockwise as you look at that corner":"lihtne täht = päripäeva, kui vaatad seda nurka","<b>R<\/b> right":"<b>R<\/b> parem","<b>L<\/b> left":"<b>L<\/b> vasak","<b>U<\/b> top":"<b>U<\/b> pealmine","<b>D<\/b> bottom":"<b>D<\/b> alumine","<b>F<\/b> front":"<b>F<\/b> esikülg","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> pööra tervet kuubikut, parem külg ette","<b>2<\/b> = twice":"<b>2<\/b> = kaks korda","<b>3<\/b> = three times":"<b>3<\/b> = kolm korda","plain letter = clockwise as you look at that face":"lihtne täht = päripäeva, kui vaatad seda külge","Step 0 · the basic move":"Samm 0 · põhipööre","The Righty Move":"Righty-pööre","Learn this first. Steps 2 and 3 are built from it.":"Õpi see kõigepealt selgeks. Sammud 2 ja 3 on sellest ehitatud.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Hoia kuubikut, kuidas tahad. Tee seda <b>6 korda<\/b> ja kuubik on jälle algasendis.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Ütle keerates valjusti: \"parem üles, pealmine vasakule, parem alla, pealmine paremale\".","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"Sinu parem käsi teeb kõik neli pööret. Pöial on esiküljel, nimetissõrm nipsab pealmist kihti.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Kuus kordust tühistavad iseennast. Lahe trikk sõpradele, ja see näitab, et valemid pole võlukunst.","Step 0 · the mirror move":"Samm 0 · peegelpööre","The Lefty Move":"Lefty-pööre","Righty in a mirror, for the left hand. Same job on the left side.":"Righty peeglis, vasaku käe jaoks. Sama töö vasakul küljel.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Hoia kuubikut, kuidas tahad. Vasak käsi teeb kõik neli pööret. Kuus korda ja kuubik on jälle algasendis.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Iga täht on peegeldatud: R asemel on L ja iga pööre läheb teistpidi.","Use it in step 2 when the white corner sits above the front-left slot.":"Kasuta seda sammus 2, kui valge nurk on eest vasakul oleva pesa kohal.","Kids often find this one easier: the left index finger flicks the top toward you.":"Lastele on see sageli lihtsam: vasak nimetissõrm nipsab pealmist kihti sinu poole.","Step 1a · white cross":"Samm 1a · valge rist","Edge on top, white facing up":"Serv üleval, valge vaatab üles","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"Kõige lihtsam ristijuhtum. Keera pealmist kihti, kuni serv on oma pesa kohal, siis keera seda külge kaks korda.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Valge all<\/b>. Valge serv on pealmises kihis ja valge kleebis <b>vaatab üles<\/b>. Keera pealmist kihti, kuni serva teine värv on sama värvi keskosa kohal, siin roheline rohelise kohal, siis keera seda külge kaks korda.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Vaata serva külje värvi, mitte valget. See ütleb, millist külge keerata.","Grey pieces do not matter yet. Corners come in step 2.":"Hallid tükid pole veel tähtsad. Nurgad tulevad sammus 2.","Do this for all four edges. Most of the cross is just this move.":"Tee nii kõigi nelja servaga. Suurem osa ristist ongi ainult see pööre.","Step 1b · white cross":"Samm 1b · valge rist","Edge on top, white facing sideways":"Serv üleval, valge vaatab külje poole","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Valge serv on pealmises kihis ja valge vaatab sinu poole. See paneb serva alla õiget pidi.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Valge all. Serv on <b>üleval ees<\/b> ja valge kleebis on <b>sinu poole<\/b>. Serva teine värv (üleval) on <b>sama värvi kui esikülje keskosa<\/b>, siin roheline. Kui ei ole, keera pealmist kihti, kuni on.","The other cross edges are not disturbed.":"Teised risti servad jäävad paigale.","Same ending as 1c: the last three turns tuck the edge in from the left.":"Sama lõpp nagu 1c: viimased kolm pööret panevad serva vasakult sisse.","Step 1c · white cross":"Samm 1c · valge rist","Edge in the bottom, flipped":"Serv all, ümberpööratud","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Valge serv on juba all, aga valet pidi. See pöörab serva paigal ümber.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Valge all<\/b>, kollane üleval. Valet pidi serv on <b>all ees<\/b> ja valge kleebis on sinu poole. Teised risti servad jäävad oma kohale.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"Sammu 1 eesmärk: all on valge pluss ja iga serva külje värv sobib kõrval oleva keskosaga.","Grey pieces do not matter yet. Only look at the white ones.":"Hallid tükid pole veel tähtsad. Vaata ainult valgeid.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"Serv on pealmises kihis? Keera pealmist kihti, kuni see on oma pesa kohal, siis keera seda külge kaks korda.","Step 2a · white corners":"Samm 2a · valged nurgad","Corner above its slot, white facing right":"Nurk on oma pesa kohal, valge vaatab paremale","The quick case. Three turns and the corner drops in.":"Kiire juhtum. Kolm pööret ja nurk kukub sisse.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Valge all. Valge nurk on <b>pealmises kihis, otse oma pesa kohal<\/b>, pesa on <b>eest paremal<\/b> ja valge kleebis <b>vaatab paremale<\/b>. Nurga teised kaks värvi sobivad esikülje ja parema külje keskosaga.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"See on Righty ilma viimase pöördeta. Ka üks Righty sobib, lisapööre üleval ei muuda siin midagi.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"Pole veel pesa kohal? Keera pealmist kihti, kuni on. Nurk kuulub sinna, kus tema kaks külje värvi kohtuvad samade värvide keskosadega.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"Nurk on juba pesas, aga keeratud? Tee üks Righty, et see välja tuua, ja alusta uuesti.","Step 2b · white corners":"Samm 2b · valged nurgad","Corner above its slot, white facing you":"Nurk on oma pesa kohal, valge sinu poole","Same corner, white pointing at you. Use the front face instead of the right.":"Sama nurk, aga valge vaatab sinu poole. Kasuta parema külje asemel esikülge.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Valge all. Valge nurk on <b>pealmises kihis oma pesa kohal<\/b>, pesa on <b>eest paremal<\/b> ja valge kleebis on <b>sinu poole<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Mõtle peegli moodi: valge paremal, kasuta R. Valge ees, kasuta F.","Righty five times also does it, but this is three turns instead of twenty.":"Viis korda Righty teeb ka sama, aga nii on kolm pööret kahekümne asemel.","Step 2c · white corners":"Samm 2c · valged nurgad","Corner above its slot, white facing up":"Nurk on oma pesa kohal, valge vaatab üles","The slow case: white points at the ceiling. Righty three times.":"Aeglane juhtum: valge vaatab lakke. Tee Righty kolm korda.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Valge all. Valge nurk on <b>pealmises kihis oma pesa kohal<\/b>, pesa on <b>eest paremal<\/b> ja valge kleebis <b>vaatab üles<\/b>. Tee Righty't, kuni valge vaatab alla. Siin kulub selleks kolm korda.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Vaata nurka pärast iga Righty't: pärast esimest on see pesas, aga keeratud, pärast teist on see jälle üleval ja valge vaatab paremale, pärast kolmandat on see paigas.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Iga nurgajuhtumi saab lahendada ainult Rightyga: 1, 3 või 5 korda. Kaardid 2a ja 2b on lihtsalt otseteed.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"Nurga kaks külje värvi peavad sobima kõrval olevate keskosadega. Kui ei sobi, keera enne pealmist kihti.","Step 3a · middle layer":"Samm 3a · keskmine kiht","Edge goes right":"Serv läheb paremale","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Paneb serva pealmisest kihist eest paremal olevasse pessa. U R U R' U', keera tervet kuubikut nii, et parem külg on sinu poole, siis L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Valge on valmis ja all. Leia pealmisest kihist serv, <b>millel pole kollast<\/b>. Keera pealmist kihti, kuni serva esivärv sobib esikülje keskosaga. Kui serva pealmine värv sobib <b>parema<\/b> külje keskosaga, kasuta seda.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Kaks osa: \"U R U R' U'\", siis keera tervet kuubikut (y), et parem külg oleks sinu poole, siis \"L' U' L\".","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Keera kuubikut õiget pidi: endine parem külg peab jääma sinu poole. Teistpidi keerates läheb valge kiht katki.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Nüüd vaatad uut esikülge. See on okei, leia sealt järgmine serv.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"Pesas on vale serv? Pane selle valemiga mõni teine serv sisse, siis tuleb vale serv välja.","Grey pieces are the yellow ones. They do not matter until step 4.":"Hallid tükid on kollased tükid. Need pole tähtsad enne sammu 4.","Step 3b · middle layer":"Samm 3b · keskmine kiht","Edge goes left":"Serv läheb vasakule","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"3a peegelpilt: paneb serva eest vasakul olevasse pessa. U' L' U' L U, keera tervet kuubikut nii, et vasak külg on sinu poole, siis R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Sama nagu 3a, aga serva pealmine värv sobib <b>vasaku<\/b> külje keskosaga.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Kaks osa: \"U' L' U' L U\", siis keera tervet kuubikut (y'), et vasak külg oleks sinu poole, siis \"R U R'\".","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"See on 3a peeglis: R asemel on L, iga pööre läheb teistpidi ja tervet kuubikut keerad vasakule, mitte paremale.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Keera kuubikut õiget pidi: endine vasak külg peab jääma sinu poole. Teistpidi keerates läheb valge kiht katki.","Once all four middle edges are in, the bottom two layers are done.":"Kui kõik neli keskmise kihi serva on paigas, on kaks alumist kihti valmis.","Step 4a · yellow cross":"Samm 4a · kollane rist","Yellow cross from a line":"Kollane rist joonest","Turns a yellow line on top into a yellow plus.":"Teeb pealmisest kollasest joonest kollase plussi.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"Kaks alumist kihti on valmis. Üleval on kollane joon, mis on <b>vasakult paremale<\/b>. Ainult kollane täpp? Tee seda üks kord, saad tähe L kuju, siis kasuta 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"See on Righty, mille ümber on F ja F'. Keskmist osa sa juba oskad.","Ignore the yellow corners for now. Only the plus matters.":"Kollaseid nurki ära praegu vaata. Tähtis on ainult pluss.","Step 4b · yellow cross":"Samm 4b · kollane rist","Yellow cross from an L":"Kollane rist tähe L kujust","Turns a yellow L shape on top into a yellow plus.":"Teeb pealmisest kollasest tähe L kujust kollase plussi.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"Kollane L on üleval ja selle kaks haru näitavad <b>taha ja vasakule<\/b> (nagu 9 ja 12 kellal).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Peaaegu sama nagu 4a, ainult keskel on \"U R U' R'\", mitte \"R U R' U'\".","If the L points the wrong way, turn only the top layer until it fits.":"Kui L näitab valele poole, keera ainult pealmist kihti, kuni see sobib.","Step 5 · yellow edges":"Samm 5 · kollased servad","Yellow edges into place (Sune)":"Kollased servad paika (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Hoia kaks sobivat serva <b>taga ja paremal<\/b>, tee Sune, siis üks U pööre. Nüüd sobivad kõik neli kollast serva oma keskosadega.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Keera pealmist kihti, kuni <b>kaks serva<\/b> sobivad oma keskosadega. Kaks kõrvuti: hoia neid <b>taga ja paremal<\/b>, tee Sune, siis <b>U<\/b> üks kord. Kaks vastamisi: hoia neid <b>ees ja taga<\/b> ja tee Sune üks kord. Nüüd sobivad kaks kõrvuti olevat serva, nii et tee esimest juhtumit.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"Viimane pööre on U (kollane pealmine kiht), mitte D. Alumise kihi keeramine lõhuks valged kihid.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Vastamisi juhtum: pärast ühte Sune't on sobiv paar ees ja paremal. Keera tervet kuubikut nii, et need oleksid taga ja paremal, siis tee Sune ja U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Kollased nurgad keerduvad segamini. See on okei, sammud 6 ja 7 parandavad need.","Step 6 · yellow corners":"Samm 6 · kollased nurgad","Yellow corners into place (Niklas)":"Kollased nurgad paika (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Niklas. Liigutab kolm nurka ringiga nii, et iga nurk on oma värvide vahel. Kas nurk on keeratud, pole veel tähtis.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Leia nurk, mis on juba <b>õigete värvide vahel<\/b> (keeratud on okei), ja hoia seda <b>ees vasakul<\/b>. Ükski pole õige? Tee seda üks kord ükskõik kust, siis vaata uuesti.","The front-left corner stays put, the other three cycle around.":"Eest vasakul olev nurk jääb paigale, teised kolm liiguvad ringiga.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"Ära unusta viimast U pööret. Ilma selleta on pealmine kiht ühe pöörde võrra nihkes ja sammu 5 kollased servad ei sobi enam.","Might need two rounds. Keep the same corner at front left.":"Võib vaja minna kaks korda. Hoia sama nurka ees vasakul.","Step 7 · finish":"Samm 7 · lõpp","Twist the yellow corners":"Keera kollased nurgad õigeks","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Ainult Righty-pööre. Kollane all, keeratud nurk all ees paremal. Kollane vaatab külje poole: Righty 2 korda. Kollane vaatab sinu poole: Righty 4 korda. Siis keera alumist kihti (D) järgmise nurgani.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Pööra kuubik ümber: kollane all<\/b>, roheline ikka sinu poole. Pane keeratud nurk <b>alla ette paremale<\/b> ja vaata, kuhu selle kollane kleebis näitab:<ul class=\"rule\"><li>Kollane vaatab <b>külje poole<\/b> (paremale) &rarr; Righty <b>2 korda<\/b><\/li><li>Kollane vaatab <b>sinu poole<\/b> &rarr; Righty <b>4 korda<\/b><\/li><li>Kollane vaatab <b>alla<\/b> &rarr; see nurk on valmis<\/li><\/ul>Siis keera <b>ainult alumist kihti (D)<\/b>, et tuua järgmine keeratud nurk alla ette paremale. Ära kunagi keera tervet kuubikut.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"Selles näites keeratakse kaks nurka: esimesel vaatab kollane külje poole (Righty 2 korda), teisel vaatab kollane sinu poole (Righty 4 korda).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"Pole kindel? Tee lihtsalt Righty't edasi ja vaata nurka iga 2 korra järel. Rohkem kui 4 korda pole kunagi vaja.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"Kaks pealmist kihti näevad vahepeal segamini välja. Ära paanitse ja ära paranda neid. Need tulevad tagasi, kui viimane nurk on valmis.","Finish with a bottom turn to line up the yellow layer. Solved!":"Lõpuks keera alumist kihti, et kollane kiht oleks joonel. Lahendatud!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · lihtne sissepanek 1","Corner white right, edge at the back":"Nurk valgega paremale, serv taga","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"Nurk ja serv lähevad pessa koos ühe korraga, mitte enne nurk ja hiljem serv.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Nurk on <b>eest paremal oleva<\/b> pesa kohal, valge <b>paremale<\/b>. Selle serv on <b>üleval taga<\/b>, roheline üleval.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = esimesed kaks kihti. Ehitad valge nurga ja selle keskmise kihi serva kokku ning paned need paarina sisse.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"Kõigepealt pane need ise paari: keera pealmist kihti, kuni nurk ja serv on nagu pildil.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Alusta valgest ristist nagu enne, siis kasuta algaja sammude 2 ja 3 asemel F2L-i.","F2L · basic insert 2":"F2L · lihtne sissepanek 2","Corner white facing you, edge on the left":"Nurk valgega sinu poole, serv vasakul","Mirror of insert 1, using the front face.":"Sissepaneku 1 peegelpilt, kasutab esikülge.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Nurk on <b>eest paremal oleva<\/b> pesa kohal, valge <b>sinu poole<\/b>. Selle serv on <b>üleval vasakul<\/b>, oranž üleval.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Sama mis sissepanek 1, aga peegelpildis: valge on sinu poole, mitte paremale, seega kasuta R asemel F pööret.","F2L · basic insert 3":"F2L · lihtne sissepanek 3","Corner and edge side by side (right)":"Nurk ja serv kõrvuti (paremal)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"Nurk ja serv on pealmises kihis kõrvuti. U seab need ritta, siis lähevad nad koos sisse.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Nurk on <b>eest paremal oleva<\/b> pesa kohal, valge <b>sinu poole<\/b> ja roheline üleval. Selle serv on <b>üleval paremal<\/b>, roheline üleval.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"Esimene U ühendab nurga ja serva plokiks. R U' R' paneb siis ploki sisse.","F2L · basic insert 4":"F2L · lihtne sissepanek 4","Corner and edge side by side (front)":"Nurk ja serv kõrvuti (ees)","Mirror of insert 3, using the front face.":"Sissepaneku 3 peegelpilt, kasutab esikülge.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Nurk on <b>eest paremal oleva<\/b> pesa kohal, valge <b>paremale<\/b> ja roheline sinu poole. Selle serv on <b>üleval ees<\/b>, roheline sinu poole.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"Sissepaneku 3 peegelpilt: R asemel on F', R' asemel F ja iga U keerab teistpidi.","F2L · make a block":"F2L · tee plokk","Join corner and edge into a block":"Ühenda nurk ja serv plokiks","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Kui valge on üles, ei saa nurka otse sisse panna. Kõigepealt ühenda nurk ja selle serv üheks plokiks, siis pane plokk sisse.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Nurk on <b>eest paremal oleva<\/b> pesa kohal, valge <b>üles<\/b>. Selle serv on <b>üleval taga<\/b>, roheline üleval. <b>U R U2 R'<\/b> ühendab need plokiks, <b>U R U' R'<\/b> paneb ploki sisse.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Vaata allolevat riba: pärast esimest poolt on nurk ja serv kõrvuti ning värvid sobivad. See ongi plokk.","The second half is basic insert 3. You already know it.":"Teine pool on lihtne sissepanek 3. Seda sa juba oskad.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"See on F2L-i peamine mõte: tee pealmises kihis plokk, siis pane see sisse. Enamik F2L-i juhtumeid käib nii.","Block made":"Plokk valmis","Block in":"Plokk sees","OLL 1 · yellow cross":"OLL 1 · kollane rist","Dot: make a line or an L":"Täpp: tee joon või L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Kollane on ainult keskosa ja kaks tagumist nurka. Kollaseid servi pole. Tee joone valem või L-valem ja tekib kas L või joon.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Kollane üleval: kollased on ainult <b>keskosa<\/b>, <b>vasak tagumine<\/b> ja <b>parem tagumine<\/b> nurk, servi pole.<ul class=\"rule\"><li>Joone valem <b>F R U R' U' F'<\/b> &rarr; tekib <b>L<\/b><\/li><li>L-valem <b>F U R U' R' F'<\/b> &rarr; tekib <b>joon<\/b><\/li><\/ul>Siis lõpeta rist allpool oleva kaardiga <b>Joon<\/b> või <b>Kuju L<\/b>.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"Valmis! Tekkis L, nüüd keera pealmist kihti nii, et selle harud näitavad taha ja vasakule. Siis tee L-valem.","The animation does the line formula. The L appears with its arms at the front and right.":"Animatsioon teeb joone valemit. L tekib, harud ees ja paremal.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Et L sobiks L-valemiga, peavad harud näitama taha ja vasakule, seega keera enne pealmist kihti kaks korda (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"Tekkis hoopis joon? Hoia seda vasakult paremale ja tee joone valemit veel kord.","Corners do not matter yet. They get fixed in OLL 2.":"Nurgad pole veel tähtsad. Need saavad korda OLL 2 juures.","Line":"Joon","Yellow line on top becomes a yellow cross.":"Kollane joon üleval muutub kollaseks ristiks.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Kollane joon üleval, hoia seda <b>vasakult paremale<\/b>. Joon läheb eest taha? Keera enne pealmist kihti üks kord (U).","L shape":"Kuju L","Yellow L on top becomes a yellow cross.":"Kollane L üleval muutub kollaseks ristiks.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"Kollane L üleval, harud näitavad <b>taha ja vasakule<\/b> (nagu kell 9 ja 12). Näitavad mujale? Keera ainult pealmist kihti, kuni sobib.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Peaaegu sama mis joone valem, ainult keskel on \"U R U' R'\", mitte \"R U R' U'\".","OLL 2 · yellow corners":"OLL 2 · kollased nurgad","Sune":"Sune","One yellow corner up. Looks like a fish.":"Üks nurk kollasega üles. Näeb välja nagu kala.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Kollane rist on valmis. Ainus kollasega üles nurk on <b>ees vasakul<\/b>. Eest parema nurga kollane on <b>sinu poole<\/b>.","You already know this one from beginner step 5.":"Seda sa juba tead algaja sammust 5.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Üks nurk kollasega üles, kala teistpidi. Sune tagurpidi.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Ainus kollasega üles nurk on <b>taga paremal<\/b>. Eest vasaku nurga kollane on <b>sinu poole<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"See on Sune tagurpidi: loe Sune lõpust alguseni ja keera iga pööre teistpidi.","H (double headlights)":"H (topelt esituled)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Ükski nurk pole kollasega üles. Kaks paari kollaseid vaatavad välja vastaskülgedel.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Kollased paarid on <b>vasakul<\/b> ja <b>paremal<\/b> küljel.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Algab nagu Sune, keskel on lisaks \"R U' R' U\".","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Ükski nurk pole kollasega üles. Ühel küljel on kollane paar, teised kaks nurka vaatavad teineteisest eemale.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"Kollane paar (esituled) on <b>vasakul<\/b>. Paremal vaatab üks kollane sinu poole ja üks taha.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = keera paremat külge kaks korda. Hoia rütmi: R2 U' R2 U' R2.","Headlights":"Esituled","Two yellow corners up next to each other, the other two look at you like headlights.":"Kaks nurka kollasega üles kõrvuti, teised kaks vaatavad sulle otsa nagu esituled.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Kaks kollasega üles nurka on <b>taga<\/b>. Esituled on <b>sinu poole<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"D pööre liigutab hetkeks valget kihti. D' paneb selle tagasi.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Kaks nurka kollasega üles kõrvuti, teised kaks vaatavad teineteisest eemale.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Kaks kollasega üles nurka on <b>paremal<\/b>. Vasakul vaatab üks kollane sinu poole ja üks taha.","Small r = turn the right face together with the middle slice.":"Väike r = keera paremat külge koos keskmise kihiga.","Bowtie":"Kikilips","Two yellow corners up, diagonal from each other.":"Kaks nurka kollasega üles, teineteise suhtes diagonaalis.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Kollasega üles nurgad on <b>ees vasakul<\/b> ja <b>taga paremal<\/b>. Eest parema nurga kollane on <b>sinu poole<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"Keskmine osa \"r U R' U' r'\" on sama mis T-s.","PLL 1 · corners":"PLL 1 · nurgad","Headlights: T-perm":"Esituled: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Vahetab kaks kõrvuti nurka. Kasuta seda, kui ühel küljel on juba sama värvi nurgad (esituled).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Keera pealmist kihti, kuni ühel küljel on <b>esituled<\/b> (mõlemad nurgad sama värvi). Hoia seda külge <b>vasakul<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"2-sammuline PLL: kõigepealt pane nurgad õigesti (2 juhtumit), siis servad (4 juhtumit).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"See vahetab ka vasaku ja parema serva. Pole hullu, servade samm parandab selle.","Headlights on every side? Corners are done, go to the edges.":"Esituled igal küljel? Nurgad on valmis, mine servade juurde.","No headlights: Y-perm":"Esitulesid pole: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Vahetab kaks nurka diagonaalis. Kasuta seda, kui ühelgi küljel pole esitulesid.","No headlights on any side. Hold it any way round.":"Ühelgi küljel pole esitulesid. Hoia kuubikut kuidas tahes.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"See on kaks OLL-i moodi osa järjest. Õpi seda poolte kaupa: \"F R U' R' U' R U R' F'\" ja \"R U R' U' R' F R F'\".","PLL 2 · edges":"PLL 2 · servad","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Lahendatud plokk on sinu ees. <b>Vasak<\/b> serv peab minema <b>paremale<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Nurgad on valmis. Lahendatud külg (terve plokk) on <b>sinu ees<\/b>. <b>Vasak<\/b> serv kuulub <b>paremale<\/b>: see läheb paremale, parem serv läheb taha, tagumine serv läheb vasakule.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"Pärast valemit on terve pealmine kiht pool pööret nihkes. Viimane U2 seab selle keskosadega ritta.","The front block never changes. Only the left, right and back edges go round.":"Eesmine plokk ei muutu kunagi. Ringi käivad ainult vasak, parem ja tagumine serv.","Right edge needs to go left instead? That is the Ub-perm.":"Parem serv peab hoopis minema vasakule? See on Ub-perm.","Lined up":"Ritta seatud","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Lahendatud plokk on sinu ees. <b>Parem<\/b> serv peab minema <b>vasakule<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Nurgad on valmis. Lahendatud plokk on <b>sinu ees<\/b>. <b>Parem<\/b> serv kuulub <b>vasakule<\/b>: see läheb vasakule, vasak serv läheb taha, tagumine serv läheb paremale.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = keera paremat külge kolm korda. Tulemus on sama mis R', aga kolm kiiret pööret hoiavad sinu rütmi.","The front block never moves. Only the left, right and back edges go round.":"Eesmine plokk ei liigu kunagi. Ringi käivad ainult vasak, parem ja tagumine serv.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Vahetab vastasservad: eesmise tagumisega, vasaku paremaga.","Corners done, every edge is opposite its centre. Any way round.":"Nurgad on valmis, iga serv on oma keskosa vastas. Hoia kuidas tahes.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = keskmine kiht L ja R vahel, keeratakse nagu L. M2 = kaks korda.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Vahetab kõrvuti servad: eesmise paremaga, tagumise vasakuga.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Nurgad on valmis. Vahetatud paarid on <b>ees paremal<\/b> ja <b>taga vasakul<\/b>.","The last U lines the top back up with the centres.":"Viimane U seab pealmise kihi jälle keskosadega ritta.","F2L 1":"F2L 1","Case 1":"Juhtum 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Nurk on pesas, valge alla. Serv on pesas, ümberpööratud.","F2L 2":"F2L 2","Case 2":"Juhtum 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"Nurk on pesas, valge alla. Serv on üleval ees, roheline väljapoole.","F2L 3":"F2L 3","Case 3":"Juhtum 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"Nurk on pesas, valge alla. Serv on üleval paremal, roheline üleval.","F2L 4":"F2L 4","Case 4":"Juhtum 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"Nurk on pesas, valge sinu poole. Serv on pesas, õiget pidi.","F2L 5":"F2L 5","Case 5":"Juhtum 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"Nurk on pesas, valge sinu poole. Serv on pesas, ümberpööratud.","F2L 6":"F2L 6","Case 6":"Juhtum 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"Nurk on pesas, valge sinu poole. Serv on üleval ees, roheline väljapoole.","F2L 7":"F2L 7","Case 7":"Juhtum 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"Nurk on pesas, valge sinu poole. Serv on üleval paremal, roheline üleval.","F2L 8":"F2L 8","Case 8":"Juhtum 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"Nurk on pesas, valge paremale. Serv on pesas, õiget pidi.","F2L 9":"F2L 9","Case 9":"Juhtum 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"Nurk on pesas, valge paremale. Serv on pesas, ümberpööratud.","F2L 10":"F2L 10","Case 10":"Juhtum 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"Nurk on pesas, valge paremale. Serv on üleval ees, roheline väljapoole.","F2L 11":"F2L 11","Case 11":"Juhtum 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"Nurk on pesas, valge paremale. Serv on üleval paremal, roheline üleval.","F2L 12":"F2L 12","Case 12":"Juhtum 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"Nurk on üleval pesa kohal, valge üles. Serv on pesas, õiget pidi.","F2L 13":"F2L 13","Case 13":"Juhtum 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"Nurk on üleval pesa kohal, valge üles. Serv on pesas, ümberpööratud.","F2L 14":"F2L 14","Case 14":"Juhtum 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"Nurk on üleval pesa kohal, valge üles. Serv on üleval ees, roheline väljapoole.","F2L 15":"F2L 15","Case 15":"Juhtum 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"Nurk on üleval pesa kohal, valge üles. Serv on üleval vasakul, roheline väljapoole.","F2L 16":"F2L 16","Case 16":"Juhtum 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"Nurk on üleval pesa kohal, valge üles. Serv on üleval taga, roheline väljapoole.","F2L 17":"F2L 17","Case 17":"Juhtum 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"Nurk on üleval pesa kohal, valge üles. Serv on üleval paremal, roheline väljapoole.","F2L 18":"F2L 18","Case 18":"Juhtum 18","Corner on top above the slot, white facing up. The edge on top at the front, green on top.":"Nurk üleval pesa kohal, valge üles. Serv üleval ees, roheline üleval.","F2L 19":"F2L 19","Case 19":"Juhtum 19","Corner on top above the slot, white facing up. The edge on top at the left, green on top.":"Nurk üleval pesa kohal, valge üles. Serv üleval vasakul, roheline üleval.","F2L 20":"F2L 20","Case 20":"Juhtum 20","Corner on top above the slot, white facing up. The edge on top at the back, green on top.":"Nurk üleval pesa kohal, valge üles. Serv üleval taga, roheline üleval.","F2L 21":"F2L 21","Case 21":"Juhtum 21","Corner on top above the slot, white facing up. The edge on top at the right, green on top.":"Nurk üleval pesa kohal, valge üles. Serv üleval paremal, roheline üleval.","F2L 22":"F2L 22","Case 22":"Juhtum 22","Corner on top above the slot, white facing you. The edge in the slot, the right way round.":"Nurk üleval pesa kohal, valge sinu poole. Serv on pesas, õiget pidi.","F2L 23":"F2L 23","Case 23":"Juhtum 23","Corner on top above oheline üleval.","OLL 1":"OLL 1","No yellow edges and no yellow corners on top.":"Üleval pole ühtegi kollast serva ega kollast nurka.","OLL 2":"OLL 2","OLL 3":"OLL 3","No yellow edges and 1 yellow corner on top.":"Üleval pole kollast serva, aga on 1 kollane nurk.","OLL 4":"OLL 4","OLL 5":"OLL 5","2 yellow edges and 1 yellow corner on top.":"Üleval on 2 kollast serva ja 1 kollane nurk.","OLL 6":"OLL 6","OLL 7":"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"Üleval pole kollast serva, aga on 2 kollast nurka.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"Üleval pole kollast serva, aga on 4 kollast nurka.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"Üleval on 4 kollast serva ja pole ühtegi kollast nurka.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"Üleval on 4 kollast serva ja 2 kollast nurka.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"Üleval on 4 kollast serva ja 1 kollane nurk.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"Üleval on 2 kollast serva ja 4 kollast nurka.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"Üleval on 2 kollast serva ja 2 kollast nurka.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Juhtum 42","OLL 43":"OLL 43","Case 43":"Juhtum 43","OLL 44":"OLL 44","Case 44":"Juhtum 44","OLL 45":"OLL 45","Case 45":"Juhtum 45","OLL 46":"OLL 46","Case 46":"Juhtum 46","OLL 47":"OLL 47","Case 47":"Juhtum 47","2 yellow edges and no yellow corners on top.":"Üleval on 2 kollast serva ja pole ühtegi kollast nurka.","OLL 48":"OLL 48","Case 48":"Juhtum 48","OLL 49":"OLL 49","Case 49":"Juhtum 49","OLL 50":"OLL 50","Case 50":"Juhtum 50","OLL 51":"OLL 51","Case 51":"Juhtum 51","OLL 52":"OLL 52","Case 52":"Juhtum 52","OLL 53":"OLL 53","Case 53":"Juhtum 53","OLL 54":"OLL 54","Case 54":"Juhtum 54","OLL 55":"OLL 55","Case 55":"Juhtum 55","OLL 56":"OLL 56","Case 56":"Juhtum 56","OLL 57":"OLL 57","Case 57":"Juhtum 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Samm 1a · valge kiht","Corner above its spot, white facing right":"Nurk oma koha kohal, valge paremale","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Sama mis 3x3 samm 2a. Kolm pööret ja valge nurk kukub oma kohale.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Valge all<\/b>. 2x2 kuubikul pole keskosasid: <b>esimene<\/b> valge nurk võib minna ükskõik kuhu. Iga järgmine nurk läheb sinna, kus selle külgede värvid <b>sobivad kõrvalolevate valgete nurkadega<\/b>. Siin: nurk on <b>oma koha kohal<\/b> eest paremal, valge <b>paremale<\/b>.","Not above its spot yet? Turn the top until it is.":"Pole veel oma koha kohal? Keera pealmist kihti, kuni on.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"Nurk on juba all, aga vales kohas või keeratud? Hoia seda eest paremal ja tee üks Righty, et see välja tõsta.","Righty once works here too.":"Ka üks Righty sobib siin.","2x2 · Step 1b · white layer":"2x2 · Samm 1b · valge kiht","Corner above its spot, white facing you":"Nurk oma koha kohal, valge sinu poole","Same as 3x3 step 2b: white facing you, so use the front face.":"Sama mis 3x3 samm 2b: valge on sinu poole, nii et kasuta esikülge.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Valge all. Valge nurk on <b>oma koha kohal<\/b> eest paremal, valge <b>sinu poole<\/b>.","Righty five times also does it.":"Ka viis korda Righty teeb selle ära.","2x2 · Step 1c · white layer":"2x2 · Samm 1c · valge kiht","Corner above its spot, white facing up":"Nurk oma koha kohal, valge üles","Same as 3x3 step 2c: Righty three times.":"Sama mis 3x3 samm 2c: Righty kolm korda.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Valge all. Valge nurk on <b>oma koha kohal<\/b> eest paremal, valge <b>üles<\/b>. Tee Righty, kuni valge vaatab alla.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Iga valge nurk läheb paika ainult Rightyga: 1, 3 või 5 korda.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Tee seda kõigi nelja valge nurgaga. Valge kiht on valmis, kui iga valge nurga külgede värvid sobivad kõrvalolevatega.","2x2 · Step 2 · yellow corners":"2x2 · Samm 2 · kollased nurgad","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Sama mis 3x3 samm 6. Liigutab kolme pealmist nurka ringi, nii et iga nurk on oma sobiva valge nurga kohal. See, kuidas nurk on keeratud, pole veel tähtis.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Valge kiht on valmis ja all. Pealmine nurk on <b>õigel kohal<\/b>, kui selle külgede värvid sobivad all olevate valgete nurkadega (keeratud võib olla). Keera pealmist kihti, kuni <b>täpselt üks<\/b> nurk on õigel kohal, ja hoia seda <b>ees vasakul<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"Eest vasakul olev nurk jääb paigale, ülejäänud kolm liiguvad ringi. Võib-olla pead seda tegema kaks korda.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"Ükski pealmise kihi pööre ei too täpselt üht nurka õigele kohale? Tee seda üks kord ükskõik kust, siis vaata uuesti. 2x2 kuubikul võib see juhtuda, 3x3 kuubikul mitte kunagi.","All four in place? Go to step 3.":"Kõik neli õigel kohal? Mine sammu 3 juurde.","2x2 · Step 3 · finish":"2x2 · Samm 3 · lõpp","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Sama mis 3x3 samm 7. Kollane all, keeratud nurk all eest paremal. Kollane küljele: Righty 2 korda. Kollane sinu poole: Righty 4 korda. Siis keera alumist kihti (D) järgmise nurgani.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Pööra kuubik ümber: kollane all.<\/b> Pane keeratud nurk <b>alla eest paremale<\/b> ja vaata, kuhu selle kollane kleebis näitab:<ul class=\"rule\"><li>Kollane on <b>küljele<\/b> (paremale) &rarr; Righty <b>2 korda<\/b><\/li><li>Kollane on <b>sinu poole<\/b> &rarr; Righty <b>4 korda<\/b><\/li><li>Kollane on <b>alla<\/b> &rarr; see nurk on valmis<\/li><\/ul>Siis keera <b>ainult alumist kihti (D)<\/b>, et järgmine keeratud nurk sinna tuua. Ära kunagi keera tervet kuubikut.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"Vahepeal näeb valge kiht segamini välja. Jätka, see tuleb tagasi, kui viimane nurk on valmis.","At the end, turn one layer until the two layers line up. Solved!":"Lõpus keera üht kihti, kuni kaks kihti on kohakuti. Lahendatud!","2x2 · Orientation 1 of 3":"2x2 · Orientatsioon 1/3","Sune: one yellow corner up":"Sune: üks kollane nurk üleval","One yellow corner up. Makes the top yellow, or another case you then fix.":"Üks kollane nurk üleval. Teeb pealmise külje kollaseks või annab uue juhtumi, mille siis parandad.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Valge kiht on valmis ja all. Hoia nurka, mille kollane on üleval, <b>ees vasakul<\/b>. Eest paremal olev nurk näitab kollast <b>sinu poole<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"Kaks kollast nurka üleval? Hoia kuubikut nii, et eest vasakul olev nurk näitab kollast sinu poole, tee Sune, siis vaata uuesti.","It never takes more than three orientation algorithms in a row.":"Rohkem kui kolme orientatsiooni algoritmi järjest pole kunagi vaja.","2x2 · Orientation 2 of 3":"2x2 · Orientatsioon 2/3","Antisune: one yellow corner up, other way":"Antisune: üks kollane nurk üleval, teistpidi","One yellow corner up, the other way round from the Sune.":"Üks kollane nurk üleval, aga teistpidi kui Sune puhul.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Hoia nurka, mille kollane on üleval, <b>taga paremal<\/b>. Eest vasakul olev nurk näitab kollast <b>sinu poole<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Kui ei Sune ega Antisune pilt sobi, keera pealmist kihti ja vaata uuesti.","2x2 · Orientation 3 of 3":"2x2 · Orientatsioon 3/3","Pi: no yellow corner up":"Pi: ükski kollane nurk pole üleval","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Ükski kollane nurk pole üleval. Pärast seda on kogu kollane üleval või saad Sune või Antisune juhtumi.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Üleval pole kollast. Hoia kuubikut nii, et mõlemad <b>vasakpoolsed<\/b> nurgad näitavad kollast <b>vasakule<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"Kollased paarid vasakul ja paremal? Hoia ükskõik kumba paari vasakul.","R2 = turn the right side twice.":"R2 = keera paremat külge kaks korda.","2x2 · Permutation 1 of 2":"2x2 · Permutatsioon 1/2","T-perm: headlights on one side":"T-perm: esituled ühel küljel","All yellow is up. Swaps two corners next to each other.":"Kogu kollane on üleval. Vahetab kaks kõrvuti asuvat nurka.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Otsi <b>esitulesid<\/b>: külg, kus mõlemad pealmised kleebised on sama värvi. Hoia seda külge <b>vasakul<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"Esituled igal küljel? Midagi pole vaja vahetada: keera lihtsalt pealmist kihti, et see kohakuti saada.","After the T-perm, turn the top until the cube is solved.":"Pärast T-permi keera pealmist kihti, kuni kuubik on lahendatud.","2x2 · Permutation 2 of 2":"2x2 · Permutatsioon 2/2","Y-perm: no headlights":"Y-perm: esitulesid pole","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Kogu kollane on üleval, aga ühelgi küljel pole esitulesid. Vahetab kaks nurka diagonaalis.","No headlights anywhere. Hold it any way round.":"Esitulesid pole kuskil. Hoia kuubikut ükskõik kuidas.","After the Y-perm, turn the top until the cube is solved.":"Pärast Y-permi keera pealmist kihti, kuni kuubik on lahendatud.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Õpi seda kahes osas: \"F R U' R' U' R U R' F'\" ja \"R U R' U' R' F R F'\".","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"Keerab kogu kollase üles. Valge külg jääb alla.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Üks kollane nurk üleval <b>ees vasakul<\/b>. Eest paremal olev nurk näitab kollast <b>sinu poole<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"Kõigepealt valge külg alla: ainult valge peab all olema, küljed võivad segamini olla.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Üks kollane nurk üleval <b>taga paremal<\/b>. Eest vasakul olev nurk näitab kollast <b>sinu poole<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Ükski kollane nurk pole üleval. Kollased paarid on <b>vasakul<\/b> ja <b>paremal<\/b> küljel.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Ükski kollane nurk pole üleval. Kollane paar on <b>vasakul<\/b>; paremal näitab üks kollane sinu poole ja teine taha.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Kaks kollast nurka üleval <b>taga<\/b>. Ülejäänud kaks näitavad kollast <b>sinu poole<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Kaks kollast nurka üleval <b>paremal<\/b>. Vasakul näitab üks kollane sinu poole ja teine taha.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Kollased nurgad on üleval <b>ees vasakul<\/b> ja <b>taga paremal<\/b>. Eest paremal oleva nurga kollane on <b>sinu poole<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"Üleval: esituled, all: valmis","All yellow up, all white down. Fixes both layers at once.":"Kõik kollased üles, kõik valged alla. Parandab mõlemad kihid korraga.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Pealmine kiht: esituled <b>vasakul<\/b>. Alumine kiht: juba õige.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Esituled<\/b> = külg, kus selle kihi mõlemad kleebised on sama värvi.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"Pealmine on õige, aga alumine vale? Keera terve kuubik ümber, nii et vale kiht on üleval, ja kasuta siis kaarti 1 või 2.","After the algorithm, turn the top and bottom until the cube is solved.":"Pärast algoritmi keera pealmist ja alumist kihti, kuni kuubik on lahendatud.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"Üleval: esitulesid pole, all: valmis","Top layer: no headlights. Bottom layer: already right.":"Pealmine kiht: esitulesid pole. Alumine kiht: juba õige.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"Mõlemad kihid: esituled","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Esituled on <b>mõlemas<\/b> kihis. Keera pealmist ja alumist kihti, nii et mõlemad esituled on <b>ees<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"Mõlemad kihid: esitulesid pole","No headlights in either layer. Hold it any way round.":"Kummaski kihis pole esitulesid. Hoia kuubikut ükskõik kuidas.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"Üleval: esituled, all: pole","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Pealmine kiht: esituled <b>ees<\/b>. Alumine kiht: esitulesid pole.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"Üleval: pole, all: esituled","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Pealmine kiht: esitulesid pole. Alumine kiht: esituled <b>taga<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Samm 1 · tipud","Turn the tips":"Keera tipud","The easiest step: each tip turns on its own.":"Kõige lihtsam samm: iga tippu saab keerata eraldi.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Keera iga tippu (<b>u l r b<\/b>), kuni selle kolm värvi sobivad kokku kõrval olevate <b>kolme keskosaga<\/b>.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"Tipul on kolm värvi. Iga värv peab sobima samal küljel otse selle all oleva keskmise kolmnurgaga.","Turning a tip never moves anything else, so you can always fix the tips first.":"Tipu keeramine ei liiguta midagi muud, nii et tipud võid alati kõigepealt korda teha.","Pyraminx · Step 2 · centres":"Pyraminx · Samm 2 · keskosad","Match the centres":"Sobita keskosad","Turn whole corners until every face has three centres of the same colour.":"Keera terveid nurki, kuni igal küljel on kolm sama värvi keskosa.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Keera terveid nurki (<b>U L R B<\/b>), kuni igal küljel on <b>kolm keskosa<\/b> sama värvi. Siis hoia Pyraminxi nii, et <b>kollane külg on all<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Iga nurk viib oma tipu ja kolm keskosa endaga kaasa, nii et samm 1 jääb valmis.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"Servad lähevad selle ajal segi. See pole hullu, sammud 3 ja 4 parandavad need.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Samm 3a · alumised servad","Edge on the right, yellow facing you":"Serv paremal, kollane sinu poole","Puts the green-yellow edge into the front bottom.":"Paneb rohelise-kollase serva alla ette.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Kollane külg on all. Serv, mille koht on <b>all ees<\/b>, asub <b>parem-eesmisel<\/b> serval, kollane <b>sinu poole<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Keera tervet Pyraminxi (kollane jääb alla), nii et koht, mida tahad täita, on all ees.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"Serv on juba all, aga vales kohas või ümber pööratud? Hoia seda kohta all ees ja tee seda üks kord, et serv üles tuua.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Samm 3b · alumised servad","Edge on the right, yellow facing right":"Serv paremal, kollane paremale","Same edge, the other way round.":"Sama serv, teistpidi.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"Serv asub <b>parem-eesmisel<\/b> serval, kollane vaatab <b>paremale<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Samm 3c · alumised servad","Edge on the left, yellow facing you":"Serv vasakul, kollane sinu poole","The edge is on the left side.":"Serv on vasakul pool.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"Serv asub <b>vasak-eesmisel<\/b> serval, kollane <b>sinu poole<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Samm 3d · alumised servad","Edge on the left, yellow facing left":"Serv vasakul, kollane vasakule","Mirror of 3b.":"3b peegelpilt.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"Serv asub <b>vasak-eesmisel<\/b> serval, kollane vaatab <b>vasakule<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Samm 3e · alumised servad","Edge at the back, yellow facing right":"Serv taga, kollane paremale","The edge is on the back edge.":"Serv on tagumisel serval.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"Serv asub <b>tagumisel<\/b> serval, kollane vaatab <b>paremale<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Samm 3f · alumised servad","Edge at the back, yellow facing left":"Serv taga, kollane vasakule","Mirror of 3e.":"3e peegelpilt.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"Serv asub <b>tagumisel<\/b> serval, kollane vaatab <b>vasakule<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Tee nii kõigi kolme alumise servaga. Kollane külg on valmis, kui iga alumine serv sobib mõlemal pool keskosadega.","Pyraminx · Step 4a · last edges":"Pyraminx · Samm 4a · viimased servad","Edges go round (one way)":"Servad liiguvad ringi (ühtpidi)","Moves the three top edges round.":"Liigutab kolme pealmist serva ringiratast.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Kollane külg on valmis ja all. <b>Ükski<\/b> pealmine serv pole oma kohal. <b>Vasak-eesmise<\/b> serva koht on <b>ees paremal<\/b>.","After it, two edges may be flipped. Then do 4c.":"Pärast seda võivad kaks serva olla ümber pööratud. Siis tee 4c.","You never need more than two algorithms for the last edges.":"Viimaste servade jaoks pole sul kunagi vaja rohkem kui kahte algoritmi.","Pyraminx · Step 4b · last edges":"Pyraminx · Samm 4b · viimased servad","Edges go round (other way)":"Servad liiguvad ringi (teistpidi)","Moves the three top edges round the other way.":"Liigutab kolme pealmist serva teistpidi ringiratast.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Ükski<\/b> pealmine serv pole oma kohal. <b>Vasak-eesmise<\/b> serva koht on <b>taga<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Samm 4c · viimased servad","Two edges flipped":"Kaks serva ümber pööratud","All three top edges are in their place, but two are flipped.":"Kõik kolm pealmist serva on oma kohal, aga kaks on ümber pööratud.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Kõik pealmised servad on oma kohal, kaks neist on ümber pööratud. Hoia Pyraminxi nii, et <b>õige serv on taga<\/b>.","Solved!":"Lahendatud!","4x4 · 1 · edge pairing":"4x4 · 1 · servade paaritamine","Join two halves opposite each other":"Ühenda kaks teineteise vastas olevat poolt","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"4x4 servas on kaks poolt. Kui need kaks poolt on teineteise vastas, ühendab see algoritm need üheks servaks.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Keskosad on valmis. Ühe serva kaks poolt (siin <b>sinine-oranž<\/b>) on <b>teineteise vastas<\/b>: üks <b>vasak-eesmise serva ülaosas<\/b>, teine <b>parem-eesmise serva ülaosas<\/b>, mõlemal <b>oranž sinu poole<\/b>. Värvilised on ainult sinise-oranži serva tükid, et saaksid neid jälgida.","Joined! The blue-orange edge is now one piece, at the front right.":"Ühendatud! Sinine-oranž serv on nüüd üks tükk, ees paremal.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the e
