ner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>सफ़ेद नीचे<\/b>। 2x2 में सेंटर नहीं होते: <b>पहला<\/b> सफ़ेद कॉर्नर कहीं भी जा सकता है। हर अगला कॉर्नर वहाँ जाता है जहाँ उसके साइड वाले रंग <b>बगल के सफ़ेद कॉर्नर से मिलते हैं<\/b>। यहाँ: कॉर्नर सामने दाईं तरफ़ <b>अपनी जगह के ऊपर<\/b> है, सफ़ेद <b>दाईं तरफ़<\/b>।","Not above its spot yet? Turn the top until it is.":"अभी अपनी जगह के ऊपर नहीं है? ऊपर की लेयर तब तक घुमाओ जब तक न आ जाए।","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"कॉर्नर पहले से नीचे है पर गलत जगह पर या मुड़ा हुआ? उसे सामने दाईं तरफ़ रखो और बाहर निकालने के लिए एक Righty करो।","Righty once works here too.":"यहाँ एक बार Righty करना भी चलेगा।","2x2 · Step 1b · white layer":"2x2 · स्टेप 1b · सफ़ेद लेयर","Corner above its spot, white facing you":"कॉर्नर अपनी जगह के ऊपर, सफ़ेद तुम्हारी तरफ़","Same as 3x3 step 2b: white facing you, so use the front face.":"3x3 के स्टेप 2b जैसा ही: सफ़ेद तुम्हारी तरफ़ है, इसलिए सामने वाली साइड इस्तेमाल करो।","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"सफ़ेद नीचे। सफ़ेद कॉर्नर सामने दाईं तरफ़ <b>अपनी जगह के ऊपर<\/b> है, सफ़ेद <b>तुम्हारी तरफ़<\/b>।","Righty five times also does it.":"पाँच बार Righty से भी हो जाता है।","2x2 · Step 1c · white layer":"2x2 · स्टेप 1c · सफ़ेद लेयर","Corner above its spot, white facing up":"कॉर्नर अपनी जगह के ऊपर, सफ़ेद ऊपर की तरफ़","Same as 3x3 step 2c: Righty three times.":"3x3 के स्टेप 2c जैसा ही: तीन बार Righty।","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"सफ़ेद नीचे। सफ़ेद कॉर्नर सामने दाईं तरफ़ <b>अपनी जगह के ऊपर<\/b> है, सफ़ेद <b>ऊपर की तरफ़<\/b>। तब तक Righty करो जब तक सफ़ेद नीचे की तरफ़ न हो जाए।","Any white corner works with Righty alone: 1, 3 or 5 times.":"हर सफ़ेद कॉर्नर सिर्फ़ Righty से हो जाता है: 1, 3 या 5 बार।","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"चारों सफ़ेद कॉर्नर के लिए यही करो। सफ़ेद लेयर तब पूरी होती है जब हर सफ़ेद कॉर्नर के साइड वाले रंग बगल वाले कॉर्नर से मिलते हैं।","2x2 · Step 2 · yellow corners":"2x2 · स्टेप 2 · पीले कॉर्नर","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"3x3 के स्टेप 6 जैसा ही। ऊपर के तीन कॉर्नर की जगह बदलता है ताकि हर कॉर्नर अपने से मिलते सफ़ेद कॉर्नर के ऊपर आ जाए। अभी मुड़ा होना मायने नहीं रखता।","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"सफ़ेद लेयर पूरी, नीचे है। ऊपर का कॉर्नर <b>अपनी जगह पर<\/b> तब है जब उसके साइड वाले रंग नीचे के सफ़ेद कॉर्नर से मिलते हैं (मुड़ा हुआ चलेगा)। ऊपर की लेयर तब तक घुमाओ जब तक <b>ठीक एक<\/b> कॉर्नर अपनी जगह पर न हो, और उसे <b>सामने बाईं तरफ़<\/b> रखो।","The front-left corner stays put, the other three move round. You may need it twice.":"सामने-बायाँ कॉर्नर अपनी जगह रहता है, बाकी तीन घूमते हैं। शायद दो बार करना पड़े।","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"ऊपर की लेयर कैसे भी घुमाओ, ठीक एक कॉर्नर अपनी जगह पर नहीं आता? कहीं से भी एक बार करो, फिर दोबारा देखो। ऐसा 2x2 पर हो सकता है, 3x3 पर कभी नहीं होता।","All four in place? Go to step 3.":"चारों अपनी जगह पर? स्टेप 3 पर जाओ।","2x2 · Step 3 · finish":"2x2 · स्टेप 3 · फ़िनिश","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"3x3 के स्टेप 7 जैसा ही। पीला नीचे, मुड़ा हुआ कॉर्नर नीचे सामने दाईं तरफ़। पीला बगल की तरफ़: 2 बार Righty। पीला तुम्हारी तरफ़: 4 बार Righty। फिर नीचे की लेयर (D) घुमाकर अगला कॉर्नर लाओ।","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>क्यूब को पलटो: पीला नीचे।<\/b> एक मुड़े हुए कॉर्नर को <b>नीचे सामने दाईं तरफ़<\/b> रखो और देखो उसका पीला स्टिकर किधर है:<ul class=\"rule\"><li>पीला <b>बगल की तरफ़<\/b> (दाईं) &rarr; <b>2 बार<\/b> Righty<\/li><li>पीला <b>तुम्हारी तरफ़<\/b> &rarr; <b>4 बार<\/b> Righty<\/li><li>पीला <b>नीचे की तरफ़<\/b> &rarr; यह कॉर्नर हो गया<\/li><\/ul>फिर <b>सिर्फ़ नीचे की लेयर (D)<\/b> घुमाकर अगला मुड़ा हुआ कॉर्नर वहाँ लाओ। पूरे क्यूब को कभी मत घुमाना।","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"बीच में सफ़ेद लेयर बिखरी हुई दिखेगी। करते रहो, आखिरी कॉर्नर होते ही वह वापस ठीक हो जाती है।","At the end, turn one layer until the two layers line up. Solved!":"आखिर में एक लेयर तब तक घुमाओ जब तक दोनों लेयर सीध में न आ जाएँ। सॉल्व्ड!","2x2 · Orientation 1 of 3":"2x2 · ओरिएंटेशन 1/3","Sune: one yellow corner up":"Sune: एक पीला कॉर्नर ऊपर","One yellow corner up. Makes the top yellow, or another case you then fix.":"एक पीला कॉर्नर ऊपर। इससे ऊपर पूरा पीला हो जाता है, या कोई और केस बनता है जिसे तुम फिर ठीक करते हो।","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"सफ़ेद लेयर पूरी, नीचे है। पीला-ऊपर वाला कॉर्नर <b>सामने बाईं तरफ़<\/b> रखो। सामने-दाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"दो पीले कॉर्नर ऊपर? क्यूब को ऐसे पकड़ो कि सामने-बाएँ कॉर्नर का पीला तुम्हारी तरफ़ हो, Sune करो, फिर दोबारा देखो।","It never takes more than three orientation algorithms in a row.":"लगातार तीन से ज़्यादा ओरिएंटेशन एल्गोरिदम कभी नहीं लगते।","2x2 · Orientation 2 of 3":"2x2 · ओरिएंटेशन 2/3","Antisune: one yellow corner up, other way":"Antisune: एक पीला कॉर्नर ऊपर, दूसरी तरफ़","One yellow corner up, the other way round from the Sune.":"एक पीला कॉर्नर ऊपर, Sune से उल्टी तरफ़।","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"पीला-ऊपर वाला कॉर्नर <b>पीछे दाईं तरफ़<\/b> रखो। सामने-बाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"अगर न Sune वाली तस्वीर मिलती है न Antisune वाली, तो ऊपर की लेयर घुमाओ और दोबारा देखो।","2x2 · Orientation 3 of 3":"2x2 · ओरिएंटेशन 3/3","Pi: no yellow corner up":"Pi: कोई पीला कॉर्नर ऊपर नहीं","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"कोई पीला कॉर्नर ऊपर नहीं। इसके बाद या तो पूरा पीला ऊपर होगा, या Sune या Antisune वाला केस मिलेगा।","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"ऊपर कोई पीला नहीं। क्यूब को ऐसे पकड़ो कि दोनों <b>बाएँ<\/b> कॉर्नर का पीला <b>बाईं साइड पर<\/b> दिखे।","Yellow pairs on the left and on the right? Hold either pair on the left.":"बाईं और दाईं दोनों तरफ़ पीली जोड़ियाँ? किसी भी एक जोड़ी को बाईं तरफ़ रखो।","R2 = turn the right side twice.":"R2 = दाईं साइड को दो बार घुमाओ।","2x2 · Permutation 1 of 2":"2x2 · परम्यूटेशन 1/2","T-perm: headlights on one side":"T-perm: एक साइड पर हेडलाइट्स","All yellow is up. Swaps two corners next to each other.":"पूरा पीला ऊपर है। बगल-बगल के दो कॉर्नर आपस में बदलता है।","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"<b>हेडलाइट्स<\/b> ढूँढो: ऐसी साइड जहाँ ऊपर के दोनों स्टिकर एक ही रंग के हों। उस साइड को <b>बाईं तरफ़<\/b> रखो।","Headlights on every side? Nothing to swap: just turn the top to line it up.":"हर साइड पर हेडलाइट्स? कुछ बदलना नहीं है: बस ऊपर की लेयर घुमाकर सीध में लाओ।","After the T-perm, turn the top until the cube is solved.":"T-perm के बाद ऊपर की लेयर तब तक घुमाओ जब तक क्यूब सॉल्व न हो जाए।","2x2 · Permutation 2 of 2":"2x2 · परम्यूटेशन 2/2","Y-perm: no headlights":"Y-perm: कोई हेडलाइट्स नहीं","All yellow is up but no side has headlights. Swaps two corners diagonally.":"पूरा पीला ऊपर है पर किसी साइड पर हेडलाइट्स नहीं। दो तिरछे कॉर्नर को आपस में बदलता है।","No headlights anywhere. Hold it any way round.":"कहीं भी हेडलाइट्स नहीं। किसी भी तरह पकड़ो।","After the Y-perm, turn the top until the cube is solved.":"Y-perm के बाद ऊपर की लेयर तब तक घुमाओ जब तक क्यूब सॉल्व न हो जाए।","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"इसे दो हिस्सों में सीखो: \"F R U' R' U' R U R' F'\" और \"R U R' U' R' F R F'\"।","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"पूरा पीला ऊपर कर देता है। सफ़ेद साइड नीचे ही रहती है।","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"एक पीला कॉर्नर ऊपर, <b>सामने बाईं तरफ़<\/b>। सामने-दाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","White face on the bottom first: only white needs to be down, the sides can be mixed.":"पहले सफ़ेद साइड नीचे बनाओ: सिर्फ़ सफ़ेद नीचे होना चाहिए, साइड के रंग मिले-जुले हो सकते हैं।","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"एक पीला कॉर्नर ऊपर, <b>पीछे दाईं तरफ़<\/b>। सामने-बाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"कोई पीला कॉर्नर ऊपर नहीं। पीली जोड़ियाँ <b>बाईं<\/b> और <b>दाईं<\/b> साइड पर।","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"कोई पीला कॉर्नर ऊपर नहीं। एक पीली जोड़ी <b>बाईं तरफ़<\/b>; दाईं तरफ़ एक पीला तुम्हारी तरफ़ और एक पीछे की तरफ़।","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"दो पीले कॉर्नर ऊपर, <b>पीछे<\/b>। बाकी दो का पीला <b>तुम्हारी तरफ़<\/b> है।","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"दो पीले कॉर्नर ऊपर, <b>दाईं तरफ़<\/b>। बाईं तरफ़ एक पीला तुम्हारी तरफ़ और एक पीछे की तरफ़।","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"पीले कॉर्नर ऊपर <b>सामने बाईं तरफ़<\/b> और <b>पीछे दाईं तरफ़<\/b>। सामने-दाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"ऊपर: हेडलाइट्स, नीचे: पूरा","All yellow up, all white down. Fixes both layers at once.":"पूरा पीला ऊपर, पूरा सफ़ेद नीचे। दोनों लेयर एक साथ ठीक करता है।","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"ऊपर की लेयर: हेडलाइट्स <b>बाईं तरफ़<\/b>। नीचे की लेयर: पहले से सही।","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>हेडलाइट्स<\/b> = ऐसी साइड जहाँ उस लेयर के दोनों स्टिकर एक ही रंग के हों।","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"ऊपर सही पर नीचे गलत? पूरे क्यूब को पलटो ताकि गलत लेयर ऊपर आ जाए, फिर कार्ड 1 या 2 इस्तेमाल करो।","After the algorithm, turn the top and bottom until the cube is solved.":"एल्गोरिदम के बाद ऊपर और नीचे की लेयर तब तक घुमाओ जब तक क्यूब सॉल्व न हो जाए।","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"ऊपर: हेडलाइट्स नहीं, नीचे: पूरा","Top layer: no headlights. Bottom layer: already right.":"ऊपर की लेयर: हेडलाइट्स नहीं। नीचे की लेयर: पहले से सही।","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"दोनों लेयर: हेडलाइट्स","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"<b>दोनों<\/b> लेयर में हेडलाइट्स। ऊपर और नीचे की लेयर घुमाओ ताकि दोनों <b>सामने<\/b> हों।","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"दोनों लेयर: हेडलाइट्स नहीं","No headlights in either layer. Hold it any way round.":"किसी भी लेयर में हेडलाइट्स नहीं। किसी भी तरह पकड़ो।","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"ऊपर: हेडलाइट्स, नीचे: नहीं","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"ऊपर की लेयर: हेडलाइट्स <b>सामने<\/b>। नीचे की लेयर: हेडलाइट्स नहीं।","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"ऊपर: नहीं, नीचे: हेडलाइट्स","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"ऊपर की लेयर: हेडलाइट्स नहीं। नीचे की लेयर: हेडलाइट्स <b>पीछे<\/b>।","Pyraminx · Step 1 · tips":"Pyraminx · स्टेप 1 · टिप","Turn the tips":"टिप घुमाओ","The easiest step: each tip turns on its own.":"सबसे आसान स्टेप: हर टिप अकेले घूमता है।","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"हर टिप (<b>u l r b<\/b>) को तब तक घुमाओ जब तक उसके तीनों रंग ठीक बगल वाले <b>तीन सेंटर<\/b> से न मिल जाएँ।","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"टिप में तीन रंग होते हैं। हर रंग उसी साइड पर ठीक नीचे वाले सेंटर त्रिकोण से मिलना चाहिए।","Turning a tip never moves anything else, so you can always fix the tips first.":"टिप घुमाने से और कुछ नहीं हिलता, इसलिए तुम टिप हमेशा पहले ठीक कर सकते हो।","Pyraminx · Step 2 · centres":"Pyraminx · स्टेप 2 · सेंटर","Match the centres":"सेंटर मिलाओ","Turn whole corners until every face has three centres of the same colour.":"पूरे कॉर्नर तब तक घुमाओ जब तक हर साइड पर तीनों सेंटर एक ही रंग के न हो जाएँ।","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"पूरे कॉर्नर (<b>U L R B<\/b>) तब तक घुमाओ जब तक हर साइड पर <b>तीनों सेंटर<\/b> एक ही रंग के न हो जाएँ। फिर पज़ल को <b>पीली साइड नीचे<\/b> करके पकड़ो।","Each corner carries its tip and its three centres with it, so step 1 stays done.":"हर कॉर्नर अपने टिप और तीनों सेंटर को साथ लेकर घूमता है, इसलिए स्टेप 1 नहीं बिगड़ता।","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"ऐसा करते समय एज बिखर जाते हैं। कोई बात नहीं, स्टेप 3 और 4 उन्हें ठीक करते हैं।","Pyraminx · Step 3a · bottom edges":"Pyraminx · स्टेप 3a · नीचे के एज","Edge on the right, yellow facing you":"एज दाईं तरफ़, पीला तुम्हारी तरफ़","Puts the green-yellow edge into the front bottom.":"हरे-पीले एज को सामने नीचे डालता है।","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"पीली साइड नीचे। जिस एज की जगह <b>सामने नीचे<\/b> है, वह <b>सामने-दाएँ<\/b> किनारे पर है, पीला <b>तुम्हारी तरफ़<\/b>।","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"पूरी पज़ल घुमाओ (पीला नीचे ही रहे) ताकि जो जगह भरनी है वह सामने नीचे आ जाए।","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"एज पहले से नीचे है पर गलत जगह पर या उल्टा? उस जगह को सामने नीचे रखो और एज को ऊपर लाने के लिए इसे एक बार करो।","Pyraminx · Step 3b · bottom edges":"Pyraminx · स्टेप 3b · नीचे के एज","Edge on the right, yellow facing right":"एज दाईं तरफ़, पीला दाईं तरफ़","Same edge, the other way round.":"वही एज, उल्टी तरफ़ से।","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"एज <b>सामने-दाएँ<\/b> किनारे पर है, पीला <b>दाईं तरफ़<\/b>।","Pyraminx · Step 3c · bottom edges":"Pyraminx · स्टेप 3c · नीचे के एज","Edge on the left, yellow facing you":"एज बाईं तरफ़, पीला तुम्हारी तरफ़","The edge is on the left side.":"एज बाईं तरफ़ है।","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"एज <b>सामने-बाएँ<\/b> किनारे पर है, पीला <b>तुम्हारी तरफ़<\/b>।","Pyraminx · Step 3d · bottom edges":"Pyraminx · स्टेप 3d · नीचे के एज","Edge on the left, yellow facing left":"एज बाईं तरफ़, पीला बाईं तरफ़","Mirror of 3b.":"3b का मिरर।","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"एज <b>सामने-बाएँ<\/b> किनारे पर है, पीला <b>बाईं तरफ़<\/b>।","Pyraminx · Step 3e · bottom edges":"Pyraminx · स्टेप 3e · नीचे के एज","Edge at the back, yellow facing right":"एज पीछे, पीला दाईं तरफ़","The edge is on the back edge.":"एज पीछे वाले किनारे पर है।","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"एज <b>पीछे वाले<\/b> किनारे पर है, पीला <b>दाईं तरफ़<\/b>।","Pyraminx · Step 3f · bottom edges":"Pyraminx · स्टेप 3f · नीचे के एज","Edge at the back, yellow facing left":"एज पीछे, पीला बाईं तरफ़","Mirror of 3e.":"3e का मिरर।","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"एज <b>पीछे वाले<\/b> किनारे पर है, पीला <b>बाईं तरफ़<\/b>।","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"नीचे के तीनों एज के लिए यही करो। पीली साइड तब पूरी होती है जब नीचे का हर एज दोनों तरफ़ के सेंटर से मिलता है।","Pyraminx · Step 4a · last edges":"Pyraminx · स्टेप 4a · आखिरी एज","Edges go round (one way)":"एज घूमते हैं (एक दिशा में)","Moves the three top edges round.":"ऊपर के तीनों एज को घुमाकर उनकी जगह बदलता है।","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"पीली साइड पूरी, नीचे है। ऊपर का <b>कोई भी<\/b> एज अपनी जगह पर नहीं है। <b>सामने-बाएँ<\/b> एज की जगह <b>सामने दाईं तरफ़<\/b> है।","After it, two edges may be flipped. Then do 4c.":"इसके बाद दो एज उल्टे हो सकते हैं। तब 4c करो।","You never need more than two algorithms for the last edges.":"आखिरी एज के लिए कभी दो से ज़्यादा एल्गोरिदम नहीं लगते।","Pyraminx · Step 4b · last edges":"Pyraminx · स्टेप 4b · आखिरी एज","Edges go round (other way)":"एज घूमते हैं (दूसरी दिशा में)","Moves the three top edges round the other way.":"ऊपर के तीनों एज को दूसरी दिशा में घुमाकर उनकी जगह बदलता है।","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"ऊपर का <b>कोई भी<\/b> एज अपनी जगह पर नहीं है। <b>सामने-बाएँ<\/b> एज की जगह <b>पीछे<\/b> है।","Pyraminx · Step 4c · last edges":"Pyraminx · स्टेप 4c · आखिरी एज","Two edges flipped":"दो एज उल्टे","All three top edges are in their place, but two are flipped.":"ऊपर के तीनों एज अपनी जगह पर हैं, पर दो उल्टे हैं।","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"ऊपर के सभी एज अपनी जगह पर, उनमें से दो उल्टे। पज़ल को ऐसे पकड़ो कि <b>सही वाला एज पीछे<\/b> हो।","Solved!":"सॉल्व्ड!","4x4 · 1 · edge pairing":"4x4 · 1 · एज पेयरिंग","Join two halves opposite each other":"आमने-सामने के दो आधे हिस्से जोड़ो","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"4x4 के एज के दो आधे हिस्से होते हैं। जब दोनों आधे आमने-सामने हों, तो यह उन्हें जोड़कर एक एज बना देता है।","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"सेंटर हो गए। एक एज के दोनों आधे (यहाँ <b>नीला-नारंगी<\/b>) <b>आमने-सामने<\/b> हैं: एक <b>सामने-बाएँ किनारे के ऊपर<\/b>, एक <b>सामने-दाएँ किनारे के ऊपर<\/b>, दोनों में <b>नारंगी तुम्हारी तरफ़<\/b>। सिर्फ़ नीले-नारंगी पीस रंगीन हैं, ताकि तुम उन्हें देख सको।","Joined! The blue-orange edge is now one piece, at the front right.":"जुड़ गया! नीला-नारंगी एज अब एक पीस है, सामने दाईं तरफ़।","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = ऊपर की दो लेयर एक साथ। Uw' बाएँ आधे को दाईं तरफ़ ले आता है, आखिर का Uw सेंटर वापस ठीक कर देता है।","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"बीच वाला हिस्सा \"R U R' F R' F' R\" एक बना हुआ एज बीच में लाता है, ताकि दोनों आधे मिल सकें। बाकी क्यूब बिखर जाता है: कोई बात नहीं, बाद में तुम उसे 3x3 की तरह सॉल्व करते हो।","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"इसी तरह सभी 12 एज जोड़ो, फिर 4x4 को 3x3 की तरह सॉल्व करो।","Edge joined":"एज जुड़ गया","4x4 · 1b · edge pairing":"4x4 · 1b · एज पेयरिंग","Combine with the centre layer, then swap it out":"सेंटर लेयर से जोड़ो, फिर उसे बाहर निकालो","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"दोनों आधे जोड़ने के लिए सिर्फ़ सेंटर लेयर घुमाओ, जुड़े हुए एज को किसी ऐसे एज से बदलो जो अभी जुड़ा नहीं है, फिर सेंटर लेयर वापस घुमाओ।","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"सेंटर हो गए। एक एज के दोनों आधे (यहाँ <b>नीला-नारंगी<\/b>) <b>तिरछे<\/b> हैं: एक <b>सामने-बाएँ किनारे पर ऊपर<\/b>, <b>नारंगी तुम्हारी तरफ़<\/b>; दूसरा <b>सामने-दाएँ किनारे पर नीचे<\/b>, <b>नीला तुम्हारी तरफ़<\/b>। सिर्फ़ नीले-नारंगी पीस रंगीन हैं, ताकि तुम उन्हें देख सको।","Joined! The blue-orange edge is now one piece, at the top front.":"जुड़ गया! नीला-नारंगी एज अब एक पीस है, ऊपर सामने।","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"इस मूव का एक नाम है: <b>स्लाइस मूव<\/b>। छोटे u का मतलब: <b>सिर्फ़ ऊपर वाली सेंटर लेयर<\/b> घुमाओ (ऊपर से दूसरी लेयर)। सबसे ऊपर की लेयर नहीं हिलती।","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = वह सेंटर लेयर दाईं तरफ़ घूमती है (U' की तरह)। ऊपर वाला आधा दाईं तरफ़ जाकर नीचे वाले आधे के ऊपर बैठ जाता है: एज जुड़ गया।","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' जुड़े हुए एज को ऊपर ले जाता है और उसकी जगह ऐसा एज रख देता है जो अभी जुड़ा नहीं है।","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = सेंटर लेयर वापस घुमाओ, ताकि सेंटर फिर से सॉल्व हो जाएँ। जुड़ा हुआ एज ऊपर जुड़ा ही रहता है।","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"अगर नीचे वाला आधा बाईं तरफ़ और ऊपर वाला दाईं तरफ़ है, तो सेंटर लेयर दूसरी दिशा में घुमाओ: u L' U' L u'।","Halves combined":"आधे जुड़ गए","Swapped out":"बाहर निकाला","4x4 · 2 · OLL parity":"4x4 · 2 · OLL पैरिटी","No 3x3 OLL fits":"कोई 3x3 OLL फ़िट नहीं होता","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"जब तुम्हारी ऊपर की लेयर के लिए <b>कोई 3x3 एल्गोरिदम<\/b> न हो, तो यह करो। यह सिर्फ़ 4x4 पर होता है: ऊपर के 1 या 3 एज उल्टे होते हैं, जैसे तस्वीर में। यह सामने वाले एज को पलट देता है, ताकि नॉर्मल 3x3 OLL फिर से काम करे।","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"पीला ऊपर। तस्वीर की तरह: <b>3 एज उल्टे हैं<\/b> (सामने, दाएँ और पीछे वाले एज का दूसरा रंग ऊपर दिखता है), सिर्फ़ <b>बाएँ<\/b> एज का पीला ऊपर है। तस्वीर में ऊपर की लेयर ऊपर से दिख रही है, सामने वाला हिस्सा नीचे की तरफ़। एक <b>उल्टा एज सामने<\/b> रखो।","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"अब 2 एज उल्टे हैं (पीछे और बाएँ), और सामने के दो कॉर्नर मुड़ गए हैं: फिर से नॉर्मल 3x3 केस। अपने 3x3 OLL और PLL से पूरा करो।","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"पहचानने का तरीका: ऊपर के वे एज गिनो जिनका पीला ऊपर नहीं है। 1 या 3 = कोई 3x3 एल्गोरिदम फ़िट नहीं होगा, पहले यह करो।","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>दाईं दो लेयर एक साथ<\/b> (वाइड मूव), Lw = बाईं दो लेयर एक साथ। कई शीट पर इसे छोटे r और l से लिखा जाता है।","U2 and F2 turn only the outer top and front layer, twice.":"U2 और F2 सिर्फ़ बाहर वाली ऊपर और सामने की लेयर को दो बार घुमाते हैं।","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"सामने वाला एज पलट जाता है। ऊपर के कुछ और पीस भी हिलते हैं: कोई बात नहीं, तुम्हारे नॉर्मल 3x3 OLL और PLL उन्हें ठीक कर देते हैं।","4x4 · 3 · PLL parity":"4x4 · 3 · PLL पैरिटी","Two edges swapped":"दो एज आपस में बदले हुए","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"यह भी सिर्फ़ 4x4 पर: बिल्कुल आखिर में ऊपर के दो आमने-सामने वाले एज आपस में बदले हुए होते हैं। यह उन्हें वापस बदल देता है।","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"सब कुछ सॉल्व है, सिवाय ऊपर के <b>सामने<\/b> और <b>पीछे<\/b> वाले एज के, जो <b>आपस में बदले हुए<\/b> हैं।","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = ऊपर की दो लेयर दो बार। Rw2 = दाईं दो लेयर दो बार। r2 = सिर्फ़ दाएँ से दूसरी लेयर, दो बार।","Only these two edges change. Everything else stays where it is.":"सिर्फ़ ये दो एज बदलते हैं। बाकी सब अपनी जगह रहता है।","Mirror cube · last layer":"Mirror cube · आखिरी लेयर","Three corners (A-perm)":"तीन कॉर्नर (A-perm)","Moves three top corners around. Everything else stays where it is.":"ऊपर के तीन कॉर्नर की जगह बदलता है। बाकी सब अपनी जगह रहता है।","Beginner 3x3":"बिगिनर 3x3","Beginner":"बिगिनर","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"क्लासिक बिगिनर तरीका। क्यूब को <b>पीला ऊपर<\/b> और <b>हरा तुम्हारी तरफ़<\/b> करके पकड़ो:\n       सफ़ेद पहले नीचे सॉल्व होता है, पीला आखिर में ऊपर। किसी स्टेप पर क्लिक करो और उसे चलते हुए देखो।","Intermediate 3x3":"इंटरमीडिएट 3x3","Intermediate":"इंटरमीडिएट","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"अगला लेवल: सफ़ेद क्रॉस पहले की तरह, फिर <b>F2L<\/b> (कॉर्नर और एज एक साथ),\n       <b>2-look OLL<\/b> (पूरा पीला ऊपर) और <b>2-look PLL<\/b> (सब कुछ अपनी जगह पर)। पकड़ वही: पीला ऊपर, हरा तुम्हारी तरफ़।","Advanced F2L (3x3)":"एडवांस्ड F2L (3x3)","Advanced F2L":"एडवांस्ड F2L","Advanced OLL (3x3)":"एडवांस्ड OLL (3x3)","Advanced OLL":"एडवांस्ड OLL","Advanced PLL (3x3)":"एडवांस्ड PLL (3x3)","Advanced PLL":"एडवांस्ड PLL","2x2 Beginner":"2x2 बिगिनर","2x2 Intermediate":"2x2 इंटरमीडिएट","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"सफ़ेद लेयर बिगिनर की तरह। फिर <b>3 एल्गोरिदम<\/b> पूरा ऊपर पीला करते हैं और <b>2 एल्गोरिदम<\/b> कॉर्नर को अपनी जगह पर लाते हैं।","2x2 Advanced":"2x2 एडवांस्ड","Advanced":"एडवांस्ड","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"<b>Ortega<\/b> तरीका। पहले नीचे <b>सफ़ेद साइड<\/b> बनाओ (साइड के रंग अभी मिलने ज़रूरी नहीं)। फिर <b>7 एल्गोरिदम<\/b> में से एक पूरा पीला ऊपर करता है, और <b>6 एल्गोरिदम<\/b> में से एक दोनों लेयर एक साथ ठीक करता है।","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"ट्विस्टी पज़ल और बड़े क्यूब","push it up, away from you":"इसे ऊपर की तरफ़, अपने से दूर धकेलो","pull it down, toward you":"इसे नीचे की तरफ़, अपनी ओर खींचो","swing it to the left":"इसे बाईं तरफ़ घुमाओ","swing it to the right":"इसे दाईं तरफ़ घुमाओ","turn it clockwise, like a clock":"इसे घड़ी की दिशा में घुमाओ, घड़ी की सुई की तरह","turn it anticlockwise":"इसे घड़ी की उल्टी दिशा में घुमाओ","push them up, away from you":"इन्हें ऊपर की तरफ़, अपने से दूर धकेलो","pull them down, toward you":"इन्हें नीचे की तरफ़, अपनी ओर खींचो","turn them clockwise, like a clock":"इन्हें घड़ी की दिशा में घुमाओ, घड़ी की सुई की तरह","turn them anticlockwise":"इन्हें घड़ी की उल्टी दिशा में घुमाओ","swing them to the right":"इन्हें दाईं तरफ़ घुमाओ","swing them to the left":"इन्हें बाईं तरफ़ घुमाओ","clockwise as seen from behind":"पीछे से देखने पर घड़ी की दिशा में","anticlockwise as seen from behind":"पीछे से देखने पर घड़ी की उल्टी दिशा में","swing it to the right (like D)":"इसे दाईं तरफ़ घुमाओ (D की तरह)","turn it clockwise, like F":"इसे घड़ी की दिशा में घुमाओ, F की तरह","tip it so the front comes to the top":"इसे ऐसे पलटो कि सामने वाली साइड ऊपर आ जाए","tip it so the top comes to the front":"इसे ऐसे पलटो कि ऊपर वाली साइड सामने आ जाए","roll it to the right, like F":"इसे दाईं तरफ़ लुढ़काओ, F की तरह","roll it to the left":"इसे बाईं तरफ़ लुढ़काओ","pull it down, toward you (like L)":"इसे नीचे की तरफ़, अपनी ओर खींचो (L की तरह)","turn it so the right side faces you":"इसे ऐसे घुमाओ कि दाईं साइड तुम्हारी तरफ़ आ जाए","turn it so the left side faces you":"इसे ऐसे घुमाओ कि बाईं साइड तुम्हारी तरफ़ आ जाए","Right face":"दाईं साइड","Left face":"बाईं साइड","Top face":"ऊपर की साइड","Bottom face":"नीचे की साइड","Front face":"सामने की साइड","Back face":"पीछे की साइड","Whole cube":"पूरा क्यूब","Right two layers":"दाईं दो लेयर","Left two layers":"बाईं दो लेयर","Front two layers":"सामने की दो लेयर","Bottom two layers":"नीचे की दो लेयर","Top two layers":"ऊपर की दो लेयर","Back two layers":"पीछे की दो लेयर","Middle slice":"बीच की स्लाइस","Middle layer":"बीच की लेयर","Front-back middle slice":"सामने और पीछे के बीच की स्लाइस","Only the centre layer next to the right (slice move, the right layer stays still)":"सिर्फ़ दाईं लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, दाईं लेयर नहीं हिलती)","Only the centre layer next to the left (slice move, the left layer stays still)":"सिर्फ़ बाईं लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, बाईं लेयर नहीं हिलती)","Only the centre layer next to the top (slice move, the top layer stays still)":"सिर्फ़ ऊपर की लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, ऊपर की लेयर नहीं हिलती)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"सिर्फ़ नीचे की लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, नीचे की लेयर नहीं हिलती)","Only the centre layer next to the front (slice move, the front layer stays still)":"सिर्फ़ सामने की लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, सामने की लेयर नहीं हिलती)","Only the centre layer next to the back (slice move, the back layer stays still)":"सिर्फ़ पीछे की लेयर के बगल वाली सेंटर लेयर (स्लाइस मूव, पीछे की लेयर नहीं हिलती)","Top corner with its layer":"ऊपर वाला कॉर्नर अपनी लेयर के साथ","Top tip only":"सिर्फ़ ऊपर वाला टिप","Left corner with its layer":"बायाँ कॉर्नर अपनी लेयर के साथ","Left tip only":"सिर्फ़ बायाँ टिप","Right corner with its layer":"दायाँ कॉर्नर अपनी लेयर के साथ","Right tip only":"सिर्फ़ दायाँ टिप","Back corner with its layer":"पीछे वाला कॉर्नर अपनी लेयर के साथ","Back tip only":"सिर्फ़ पीछे वाला टिप","turn it clockwise, as you look at that corner":"उस कॉर्नर की तरफ़ से देखते हुए इसे घड़ी की दिशा में घुमाओ","turn it anticlockwise, as you look at that corner":"उस कॉर्नर की तरफ़ से देखते हुए इसे घड़ी की उल्टी दिशा में घुमाओ","{what}: half a turn (turn it twice)":"{what}: आधा चक्कर (दो बार घुमाओ)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: तीन बार घुमाओ, नतीजा {mv} जैसा ही ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"अंग्रेज़ी (UK)","English (US)":"अंग्रेज़ी (US)","Arabic":"अरबी","Chinese":"चीनी","French":"फ़्रेंच","German":"जर्मन","Hindi":"हिन्दी","Korean":"कोरियाई","Portuguese":"पुर्तगाली","Russian":"रूसी","Spanish":"स्पेनिश"},"ko":{"Cube Algorithms":"큐브 공식","Settings":"설정","Grip: yellow on top, green facing you":"잡는 법: 노란색이 위, 초록색이 나를 향하게","Light":"라이트","Dark":"다크","Switch to light mode":"라이트 모드로 바꾸기","Switch to dark mode":"다크 모드로 바꾸기","Top layer at the start":"처음 위층 모습","Algorithms":"공식","Turn the cube back":"큐브 원래대로 돌리기","All {name} steps":"{name} 전체 단계","Step back":"한 단계 뒤로","Play":"재생","Step":"한 단계","Reset":"초기화","Reset view":"시점 초기화","Play {n}× (back to start!)":"{n}번 재생 (처음으로 돌아와요!)","Speed":"속도","Drag or swipe the cube to turn it around.":"큐브를 드래그하거나 밀어서 이리저리 돌려 보세요.","Start":"시작","solved":"완성","before":"이전","End":"끝","Step {n}":"{n}단계","after {label}":"{label} 후","Round {r} of {n}: {mv}":"{n}번 중 {r}번째: {mv}","{n} rounds later... back exactly where we started!":"{n}번 반복했더니... 정확히 처음 모습으로 돌아왔어요!","Undo {mv}":"{mv} 되돌리기","Press Play, or Step through one turn at a time.":"재생을 누르거나, 한 단계 버튼으로 한 번씩 돌려 보세요.","Done! Try Play 6x: the cube comes back to the start.":"끝! 6번 재생해 보세요. 큐브가 처음 모습으로 돌아와요.","Done! That is what this step fixes.":"끝! 이게 바로 이 단계에서 맞추는 부분이에요.","{i} of {n} turns done. Next: {mv}.":"{n}번 중 {i}번 돌렸어요. 다음: {mv}.","Languages":"언어","Estonian":"에스토니아어","<b>r<\/b> right two layers":"<b>r<\/b> 오른쪽 두 층","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> 가운데 세로 층, L 방향으로 돌려요","<b>d<\/b> bottom two layers":"<b>d<\/b> 아래쪽 두 층","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = 괄호 안을 3번 해요","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> 오른쪽 두 층을 함께","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> 위쪽 두 층을 함께","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> 오른쪽 / 왼쪽 / 위에서 두 번째 층만 (안쪽 층만 도는 슬라이스 회전)","<b>M<\/b> middle slice, like L":"<b>M<\/b> 가운데 세로 층, L처럼","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> 큐브 전체를 앞뒤로 / 옆으로 굴려요","<b>y<\/b> turn the whole cube":"<b>y<\/b> 큐브 전체를 돌려요","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> 아래쪽 / 위쪽 두 층","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> 두 층을 한꺼번에","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> 앞과 뒤 사이의 가운데 층, F처럼","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> 큐브 전체를 R처럼 굴려요","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = 괄호 안을 2번 해요","<b>U<\/b> top corner":"<b>U<\/b> 위쪽 코너","<b>L<\/b> front-left corner":"<b>L<\/b> 앞 왼쪽 코너","<b>R<\/b> front-right corner":"<b>R<\/b> 앞 오른쪽 코너","<b>B<\/b> back corner":"<b>B<\/b> 뒤쪽 코너","capital = the corner with its whole layer":"대문자 = 코너와 그 층 전체","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = 팁만","<b>'<\/b> = the other way":"<b>'<\/b> = 반대 방향","plain letter = clockwise as you look at that corner":"글자만 있으면 = 그 코너를 바라볼 때 시계 방향","<b>R<\/b> right":"<b>R<\/b> 오른쪽 면","<b>L<\/b> left":"<b>L<\/b> 왼쪽 면","<b>U<\/b> top":"<b>U<\/b> 윗면","<b>D<\/b> bottom":"<b>D<\/b> 아랫면","<b>F<\/b> front":"<b>F<\/b> 앞면","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> 큐브 전체를 돌려 오른쪽 면을 앞으로","<b>2<\/b> = twice":"<b>2<\/b> = 두 번","<b>3<\/b> = three times":"<b>3<\/b> = 세 번","plain letter = clockwise as you look at that face":"글자만 있으면 = 그 면을 바라볼 때 시계 방향","Step 0 · the basic move":"0단계 · 기본 동작","The Righty Move":"Righty 무브","Learn this first. Steps 2 and 3 are built from it.":"이것부터 배워요. 2단계와 3단계가 이걸로 만들어져요.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"큐브를 아무렇게나 잡아도 돼요. <b>6번<\/b> 하면 큐브가 처음 모습으로 돌아와요.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"돌리면서 소리 내어 말해 봐요: \"오른쪽 위로, 윗면 왼쪽으로, 오른쪽 아래로, 윗면 오른쪽으로\".","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"오른손으로 네 번을 모두 돌려요. 엄지는 앞면에 두고, 검지로 윗면을 튕겨요.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"여섯 번 반복하면 저절로 원래대로 돌아와요. 친구들 앞에서 보여 주기 좋은 묘기이고, 공식이 마법이 아니라는 증거예요.","Step 0 · the mirror move":"0단계 · 거울 동작","The Lefty Move":"Lefty 무브","Righty in a mirror, for the left hand. Same job on the left side.":"거울에 비친 Righty로, 왼손용이에요. 왼쪽에서 같은 일을 해요.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"큐브를 아무렇게나 잡아도 돼요. 왼손으로 네 번을 모두 돌려요. 여섯 번 하면 처음 모습으로 돌아와요.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"모든 글자가 거울처럼 바뀌어요: R은 L이 되고, 회전마다 반대 방향으로 돌려요.","Use it in step 2 when the white corner sits above the front-left slot.":"2단계에서 흰색 코너가 앞 왼쪽 슬롯 위에 있을 때 써요.","Kids often find this one easier: the left index finger flicks the top toward you.":"이게 더 쉽다는 어린이도 많아요: 왼손 검지로 윗면을 내 쪽으로 튕겨요.","Step 1a · white cross":"1a단계 · 흰색 십자","Edge on top, white facing up":"엣지가 위층에 있고 흰색이 위를 향할 때","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"가장 쉬운 십자 케이스예요. 엣지가 자기 슬롯 위에 올 때까지 윗면을 돌리고, 그 면을 두 번 돌려요.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>흰색을 아래로<\/b> 해요. 흰색 엣지가 위층에 있고 흰색 스티커가 <b>위를 향해<\/b> 있어요. 엣지의 다른 색이 같은 색 센터 위에 올 때까지 윗면을 돌려요(여기서는 초록색 위에 초록색). 그다음 그 면을 두 번 돌려요.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"흰색 말고 엣지의 옆면 색을 보세요. 그 색이 어느 면을 돌릴지 알려 줘요.","Grey pieces do not matter yet. Corners come in step 2.":"회색 조각은 아직 신경 쓰지 않아도 돼요. 코너는 2단계에서 해요.","Do this for all four edges. Most of the cross is just this move.":"엣지 네 개 모두 이렇게 해요. 십자는 대부분 이 동작이면 돼요.","Step 1b · white cross":"1b단계 · 흰색 십자","Edge on top, white facing sideways":"엣지가 위층에 있고 흰색이 옆을 향할 때","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"위층에 있는 흰색 엣지의 흰색이 나를 향해 있어요. 방향을 바르게 해서 아래로 내려 줘요.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"흰색을 아래로 해요. 엣지가 <b>위 앞<\/b>에 있고 흰색 스티커가 <b>나를 향해<\/b> 있어요. 엣지의 다른 색(위쪽)은 <b>앞면 센터와 같은 색<\/b>이에요. 여기서는 초록색이에요. 아니라면 같아질 때까지 윗면을 돌려요.","The other cross edges are not disturbed.":"다른 십자 엣지는 흐트러지지 않아요.","Same ending as 1c: the last three turns tuck the edge in from the left.":"1c와 끝이 같아요: 마지막 세 번의 회전으로 엣지를 왼쪽에서 밀어 넣어요.","Step 1c · white cross":"1c단계 · 흰색 십자","Edge in the bottom, flipped":"엣지가 아래층에서 뒤집혀 있을 때","A white edge already in the bottom, but the wrong way round. Flips it in place.":"흰색 엣지가 이미 아래층에 있지만 방향이 반대예요. 그 자리에서 뒤집어 줘요.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>흰색을 아래로<\/b>, 노란색을 위로 해요. 방향이 틀린 엣지가 <b>앞 아래<\/b>에 있고, 흰색 스티커가 나를 향해 있어요. 다른 십자 엣지는 제자리에 그대로 있어요.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"1단계 목표: 아랫면에 흰색 십자를 만들고, 각 엣지의 옆면 색을 바로 옆 센터와 맞춰요.","Grey pieces do not matter yet. Only look at the white ones.":"회색 조각은 아직 신경 쓰지 않아도 돼요. 흰색 조각만 보세요.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"엣지가 위층에 있나요? 자기 슬롯 위에 올 때까지 윗면을 돌리고, 그 면을 두 번 돌려요.","Step 2a · white corners":"2a단계 · 흰색 코너","Corner above its slot, white facing right":"코너가 슬롯 위에 있고 흰색이 오른쪽을 향할 때","The quick case. Three turns and the corner drops in.":"빠른 케이스예요. 세 번만 돌리면 코너가 쏙 들어가요.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"흰색을 아래로 해요. 흰색 코너가 <b>앞 오른쪽<\/b> 슬롯 <b>바로 위, 위층<\/b>에 있고, 흰색 스티커가 <b>오른쪽을 향해<\/b> 있어요. 나머지 두 색은 앞면 센터, 오른쪽 면 센터와 같아요.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"마지막 회전을 뺀 Righty예요. Righty를 한 번 다 해도 돼요. 윗면을 한 번 더 돌리는 건 여기서 아무 상관 없어요.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"아직 슬롯 위에 없나요? 그럴 때까지 위층을 돌려요. 코너의 자리는 옆면 두 색이 같은 색 센터와 만나는 곳이에요.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"코너가 이미 슬롯에 있는데 비틀려 있나요? Righty를 한 번 해서 빼낸 다음 다시 시작해요.","Step 2b · white corners":"2b단계 · 흰색 코너","Corner above its slot, white facing you":"코너가 슬롯 위에 있고 흰색이 나를 향할 때","Same corner, white pointing at you. Use the front face instead of the right.":"같은 코너인데 흰색이 나를 향해 있어요. 오른쪽 면 대신 앞면을 써요.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"흰색을 아래로 해요. 흰색 코너가 <b>앞 오른쪽<\/b> 슬롯 <b>위, 위층<\/b>에 있고, 흰색 스티커가 <b>나를 향해<\/b> 있어요.","Mirror thinking: white on the right, use R. White on the front, use F.":"거울처럼 생각해요: 흰색이 오른쪽이면 R, 흰색이 앞이면 F를 써요.","Righty five times also does it, but this is three turns instead of twenty.":"Righty를 다섯 번 해도 되지만, 이건 스무 번이 아니라 세 번이면 돼요.","Step 2c · white corners":"2c단계 · 흰색 코너","Corner above its slot, white facing up":"코너가 슬롯 위에 있고 흰색이 위를 향할 때","The slow case: white points at the ceiling. Righty three times.":"느린 케이스예요: 흰색이 천장을 보고 있어요. Righty를 세 번 해요.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"흰색을 아래로 해요. 흰색 코너가 <b>앞 오른쪽<\/b> 슬롯 <b>위, 위층<\/b>에 있고, 흰색 스티커가 <b>위를 향해<\/b> 있어요. 흰색이 아래를 향할 때까지 Righty를 해요. 여기서는 세 번 걸려요.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Righty를 할 때마다 코너를 보세요: 한 번 하면 슬롯에 들어가지만 비틀려 있고, 두 번 하면 흰색이 오른쪽을 향한 채 다시 위로 올라오고, 세 번 하면 제자리에 들어가요.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"어떤 코너 케이스든 Righty만으로 풀 수 있어요: 1번, 3번 또는 5번. 2a와 2b 카드는 지름길일 뿐이에요.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"코너의 옆면 두 색이 바로 옆 센터와 맞아야 해요. 안 맞으면 먼저 위층을 돌려요.","Step 3a · middle layer":"3a단계 · 가운데 층","Edge goes right":"엣지가 오른쪽으로 갈 때","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"위층의 엣지를 앞 오른쪽 슬롯에 넣어요. U R U R' U' 한 다음, 오른쪽 면이 나를 향하도록 큐브 전체를 돌리고, L' U' L 해요.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"흰색은 다 맞췄고 아래에 있어요. 위층에서 <b>노란색이 없는<\/b> 엣지를 찾아요. 엣지의 앞 색이 앞면 센터와 맞도록 윗면을 돌려요. 엣지의 위 색이 <b>오른쪽<\/b> 센터와 맞으면 이걸 써요.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"두 덩어리예요: \"U R U R' U'\" 한 다음, 오른쪽 면이 나를 향하도록 큐브 전체를 돌리고(y), \"L' U' L\" 해요.","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"큐브를 올바른 방향으로 돌려요: 원래 오른쪽 면이 나를 향해야 해요. 반대로 돌리면 흰색 층이 망가져요.","You end up looking at a new front side. That is fine, just find the next edge from there.":"새로운 앞면을 보게 돼요. 괜찮아요, 거기서 다음 엣지를 찾으면 돼요.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"슬롯에 엉뚱한 엣지가 들어가 있나요? 이 공식으로 아무 엣지나 넣으면 빠져나와요.","Grey pieces are the yellow ones. They do not matter until step 4.":"회색 조각은 노란색 조각이에요. 4단계 전까지는 신경 쓰지 않아도 돼요.","Step 3b · middle layer":"3b단계 · 가운데 층","Edge goes left":"엣지가 왼쪽으로 갈 때","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"3a의 거울 버전이에요: 엣지를 앞 왼쪽 슬롯에 넣어요. U' L' U' L U 한 다음, 왼쪽 면이 나를 향하도록 큐브 전체를 돌리고, R U R' 해요.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"3a와 같지만, 엣지의 위 색이 <b>왼쪽<\/b> 센터와 맞아요.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"두 덩어리예요: \"U' L' U' L U\" 한 다음, 왼쪽 면이 나를 향하도록 큐브 전체를 돌리고(y'), \"R U R'\" 해요.","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"거울에 비친 3a예요: R은 L이 되고, 모든 회전이 반대 방향이 되고, 큐브도 오른쪽 대신 왼쪽으로 돌려요.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"큐브를 올바른 방향으로 돌려요: 원래 왼쪽 면이 나를 향해야 해요. 반대로 돌리면 흰색 층이 망가져요.","Once all four middle edges are in, the bottom two layers are done.":"가운데 엣지 네 개가 모두 들어가면 아래 두 층이 완성돼요.","Step 4a · yellow cross":"4a단계 · 노란색 십자","Yellow cross from a line":"일자에서 노란색 십자 만들기","Turns a yellow line on top into a yellow plus.":"윗면의 노란색 일자를 노란색 십자로 바꿔요.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"아래 두 층은 완성했어요. 윗면의 노란색 일자를 <b>가로(왼쪽에서 오른쪽)<\/b>로 놓아요. 노란색 점만 있나요? 이걸 한 번 하면 L자가 생겨요. 그다음 4b를 써요.","This is Righty wrapped in F and F'. You already know the middle part.":"Righty를 F와 F'로 감싼 거예요. 가운데 부분은 이미 알고 있죠.","Ignore the yellow corners for now. Only the plus matters.":"노란색 코너는 지금은 무시해요. 십자만 신경 쓰면 돼요.","Step 4b · yellow cross":"4b단계 · 노란색 십자","Yellow cross from an L":"L자에서 노란색 십자 만들기","Turns a yellow L shape on top into a yellow plus.":"윗면의 노란색 L자를 노란색 십자로 바꿔요.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"윗면의 노란색 L자는 두 팔이 <b>뒤쪽과 왼쪽<\/b>을 가리키게 해요(시계의 9시와 12시처럼).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"4a와 거의 같아요. 가운데만 \"R U R' U'\" 대신 \"U R U' R'\"예요.","If the L points the wrong way, turn only the top layer until it fits.":"L자 방향이 틀렸으면 맞을 때까지 위층만 돌려요.","Step 5 · yellow edges":"5단계 · 노란색 엣지","Yellow edges into place (Sune)":"노란색 엣지 제자리에 넣기 (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"맞는 엣지 두 개를 <b>뒤쪽과 오른쪽<\/b>에 두고 Sune을 한 다음, U를 한 번 돌려요. 이제 노란색 엣지 네 개가 모두 센터와 맞아요.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"<b>엣지 두 개<\/b>가 센터와 맞을 때까지 윗면을 돌려요. 두 개가 나란히 붙어 있으면: <b>뒤쪽과 오른쪽<\/b>에 두고 Sune을 한 다음 <b>U<\/b>를 한 번 해요. 두 개가 서로 마주 보고 있으면: <b>앞쪽과 뒤쪽<\/b>에 두고 Sune을 한 번 해요. 그러면 나란히 붙은 두 개가 맞으니, 첫 번째 케이스를 해요.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"마지막 회전은 D가 아니라 U(노란색 윗면)예요. 아랫면을 돌리면 흰색 층이 망가져요.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"마주 보는 케이스: Sune을 한 번 하면 맞는 두 엣지가 앞쪽과 오른쪽에 있어요. 큐브 전체를 돌려 뒤쪽과 오른쪽에 오게 한 다음, Sune과 U를 해요.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"노란색 코너가 이리저리 비틀려요. 괜찮아요, 6단계와 7단계에서 맞춰요.","Step 6 · yellow corners":"6단계 · 노란색 코너","Yellow corners into place (Niklas)":"노란색 코너 제자리에 넣기 (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Niklas 공식이에요. 코너 세 개를 돌려서 모든 코너가 자기 색 사이에 오게 해요. 비틀림은 아직 상관없어요.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"이미 <b>맞는 색 사이<\/b>에 있는 코너를 찾아(비틀려 있어도 괜찮아요) <b>앞 왼쪽<\/b>에 두어요. 맞는 게 없나요? 아무 데서나 한 번 한 다음 다시 보세요.","The front-left corner stays put, the other three cycle around.":"앞 왼쪽 코너는 그대로 있고, 나머지 세 개가 돌아가며 자리를 바꿔요.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"마지막 U를 잊지 마세요. 안 하면 윗면이 한 칸 어긋나서 5단계에서 맞춘 노란색 엣지가 더 이상 맞지 않아요.","Might need two rounds. Keep the same corner at front left.":"두 번 해야 할 수도 있어요. 같은 코너를 계속 앞 왼쪽에 둬요.","Step 7 · finish":"7단계 · 마무리","Twist the yellow corners":"노란색 코너 돌리기","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Righty 무브만 쓰면 돼요. 노란색을 아래로 하고, 비틀린 코너를 아래 앞 오른쪽에 둬요. 노란색이 옆을 향하면: Righty 2번. 노란색이 나를 향하면: Righty 4번. 그다음 아랫면(D)을 돌려 다음 코너로 가요.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>큐브를 뒤집어서 노란색을 아래로<\/b> 하고, 초록색은 계속 나를 향하게 해요. 비틀린 코너를 <b>아래 앞 오른쪽<\/b>에 두고 노란색 스티커가 어디를 향하는지 보세요:<ul class=\"rule\"><li>노란색이 <b>옆<\/b>(오른쪽)을 향하면 &rarr; Righty <b>2번<\/b><\/li><li>노란색이 <b>나<\/b>를 향하면 &rarr; Righty <b>4번<\/b><\/li><li>노란색이 <b>아래<\/b>를 향하면 &rarr; 이 코너는 끝났어요<\/li><\/ul>그다음 <b>아래층(D)만<\/b> 돌려서 다음 비틀린 코너를 아래 앞 오른쪽으로 가져와요. 큐브 전체는 절대 돌리지 마세요.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"이 예시에서는 코너 두 개를 돌려요: 첫 번째는 노란색이 옆을 향하고(Righty 2번), 두 번째는 노란색이 나를 향해요(Righty 4번).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"잘 모르겠나요? 그냥 Righty를 계속하면서 2번마다 코너를 확인해요. 4번보다 더 걸리는 일은 없어요.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"중간에 위쪽 두 층이 엉망으로 섞여 보여요. 당황하지 말고, 고치려고 하지도 마세요. 마지막 코너까지 끝나면 다시 돌아와요.","Finish with a bottom turn to line up the yellow layer. Solved!":"마지막으로 아랫면을 돌려 노란색 층을 맞춰요. 완성!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · 기본 넣기 1","Corner white right, edge at the back":"코너는 흰색이 오른쪽, 엣지는 뒤쪽","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"코너를 먼저, 엣지를 나중에 넣는 대신 코너와 엣지를 한 번에 함께 슬롯에 넣어요.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"코너가 <b>앞 오른쪽<\/b> 슬롯 위에 있고 흰색이 <b>오른쪽을 향해<\/b> 있어요. 짝이 되는 엣지는 <b>위 뒤쪽<\/b>에 있고 초록색이 위에 있어요.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = 처음 두 층(First 2 Layers). 흰색 코너와 그 짝인 가운데 층 엣지를 함께 만들어서 페어로 한 번에 넣어요.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"먼저 직접 짝을 맞춰 봐요: 코너와 엣지가 그림처럼 놓일 때까지 윗면을 돌려요.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"흰색 십자는 전처럼 만들고, 초급 2단계와 3단계 대신 F2L을 써요.","F2L · basic insert 2":"F2L · 기본 넣기 2","Corner white facing you, edge on the left":"코너는 흰색이 나를 향하고, 엣지는 왼쪽","Mirror of insert 1, using the front face.":"넣기 1의 거울 버전이에요. 앞면을 써요.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"코너가 <b>앞 오른쪽<\/b> 슬롯 위에 있고 흰색이 <b>나를 향해<\/b> 있어요. 짝이 되는 엣지는 <b>위 왼쪽<\/b>에 있고 주황색이 위에 있어요.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"거울에 비친 넣기 1과 같아요: 흰색이 오른쪽 대신 나를 향하니까 R 대신 F를 써요.","F2L · basic insert 3":"F2L · 기본 넣기 3","Corner and edge side by side (right)":"코너와 엣지가 나란히 (오른쪽)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"코너와 엣지가 위층에서 나란히 붙어 있어요. U로 줄을 맞추면 함께 쏙 들어가요.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"코너가 <b>앞 오른쪽<\/b> 슬롯 위에 있고 흰색이 <b>나를 향하고<\/b> 초록색이 위에 있어요. 짝이 되는 엣지는 <b>위 오른쪽<\/b>에 있고 초록색이 위에 있어요.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"처음 U로 코너와 엣지를 붙여 블록을 만들어요. 그다음 R U' R'로 블록을 넣어요.","F2L · basic insert 4":"F2L · 기본 넣기 4","Corner and edge side by side (front)":"코너와 엣지가 나란히 (앞쪽)","Mirror of insert 3, using the front face.":"넣기 3의 거울 버전이에요. 앞면을 써요.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"코너가 <b>앞 오른쪽<\/b> 슬롯 위에 있고 흰색이 <b>오른쪽을 향하고<\/b> 초록색이 나를 향해 있어요. 짝이 되는 엣지는 <b>위 앞쪽<\/b>에 있고 초록색이 나를 향해 있어요.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"넣기 3의 거울 버전: R은 F'가 되고, R'은 F가 되고, 모든 U는 반대 방향으로 돌려요.","F2L · make a block":"F2L · 블록 만들기","Join corner and edge into a block":"코너와 엣지를 붙여 블록 만들기","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"흰색이 위를 향하면 바로 넣을 수 없어요. 먼저 코너와 그 짝인 엣지를 붙여 블록 하나로 만든 다음, 블록을 넣어요.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"코너가 <b>앞 오른쪽<\/b> 슬롯 위에 있고 흰색이 <b>위를 향해<\/b> 있어요. 짝이 되는 엣지는 <b>위 뒤쪽<\/b>에 있고 초록색이 위에 있어요. <b>U R U2 R'<\/b>로 둘을 붙여 블록을 만들고, <b>U R U' R'<\/b>로 블록을 넣어요.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"아래 그림 줄을 보세요: 앞의 절반을 하고 나면 코너와 엣지가 같은 색끼리 나란히 붙어 있어요. 그게 블록이에요.","The second half is basic insert 3. You already know it.":"뒤의 절반은 기본 넣기 3이에요. 이미 알고 있죠.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"이게 F2L의 핵심 아이디어예요: 위층에서 블록을 만든 다음 넣어요. 대부분의 F2L 케이스가 이렇게 풀려요.","Block made":"블록 완성","Block in":"블록 넣기","OLL 1 · yellow cross":"OLL 1 · 노란색 십자","Dot: make a line or an L":"점: 일자나 L자 만들기","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"노란색 센터와 뒤쪽 코너 두 개만 노란색이에요. 노란색 엣지는 없어요. 일자 공식이나 L자 공식을 하면 일자나 L자가 생겨요.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"노란색을 위로 해요: <b>센터<\/b>와 <b>위 왼쪽<\/b>, <b>위 오른쪽<\/b> 코너만 노란색이고, 엣지는 없어요.<ul class=\"rule\"><li>일자 공식 <b>F R U R' U' F'<\/b> &rarr; <b>L<\/b>자가 생겨요<\/li><li>L자 공식 <b>F U R U' R' F'<\/b> &rarr; <b>일자<\/b>가 생겨요<\/li><\/ul>그다음 아래의 <b>일자<\/b> 카드나 <b>L자<\/b> 카드로 십자를 완성해요.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"끝! L자가 생겼어요. 두 팔이 뒤쪽과 왼쪽을 가리키도록 윗면을 돌린 다음 L자 공식을 해요.","The animation does the line formula. The L appears with its arms at the front and right.":"애니메이션은 일자 공식을 보여 줘요. L자는 두 팔이 앞쪽과 오른쪽에 있는 모양으로 생겨요.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"L자 공식을 하려면 두 팔이 뒤쪽과 왼쪽을 가리켜야 하니까, 먼저 윗면을 두 번(U2) 돌려요.","Got a line instead? Hold it left to right and do the line formula once more.":"대신 일자가 생겼나요? 가로(왼쪽에서 오른쪽)로 놓고 일자 공식을 한 번 더 해요.","Corners do not matter yet. They get fixed in OLL 2.":"코너는 아직 상관없어요. OLL 2에서 맞춰요.","Line":"일자","Yellow line on top becomes a yellow cross.":"윗면의 노란색 일자가 노란색 십자가 돼요.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"윗면의 노란색 일자를 <b>가로(왼쪽에서 오른쪽)<\/b>로 놓아요. 일자가 앞뒤로 놓여 있나요? 먼저 윗면을 한 번(U) 돌려요.","L shape":"L자","Yellow L on top becomes a yellow cross.":"윗면의 노란색 L자가 노란색 십자가 돼요.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"윗면의 노란색 L자는 두 팔이 <b>뒤쪽과 왼쪽<\/b>을 가리키게 해요(시계의 9시와 12시처럼). 다른 쪽을 가리키나요? 맞을 때까지 위층만 돌려요.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"일자 공식과 거의 같아요. 가운데만 \"R U R' U'\" 대신 \"U R U' R'\"예요.","OLL 2 · yellow corners":"OLL 2 · 노란색 코너","Sune":"Sune","One yellow corner up. Looks like a fish.":"노란색이 위를 향한 코너가 하나예요. 물고기처럼 보여요.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"노란색 십자는 완성했어요. 노란색이 위를 향한 코너 하나를 <b>앞 왼쪽<\/b>에 둬요. 앞 오른쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","You already know this one from beginner step 5.":"초급 5단계에서 이미 배운 공식이에요.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"노란색이 위를 향한 코너가 하나이고, 물고기가 반대 방향이에요. Sune을 거꾸로 한 거예요.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너 하나를 <b>뒤 오른쪽<\/b>에 둬요. 앞 왼쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"Sune을 거꾸로 한 거예요: Sune을 끝에서부터 읽고, 모든 회전을 반대 방향으로 해요.","H (double headlights)":"H (양쪽 헤드라이트)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"노란색이 위를 향한 코너가 없어요. 노란색 두 쌍이 서로 반대쪽에서 바깥을 향해 있어요.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"노란색 쌍을 <b>왼쪽<\/b>과 <b>오른쪽<\/b>에 둬요.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Sune처럼 시작하고, 가운데에 \"R U' R' U\"가 더 들어가요.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"노란색이 위를 향한 코너가 없어요. 한쪽 면에 노란색 한 쌍이 있고, 나머지 두 코너는 노란색이 서로 반대쪽을 향해 있어요.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"노란색 쌍(헤드라이트)을 <b>왼쪽<\/b>에 둬요. 오른쪽에는 노란색 하나가 나를 향하고, 하나는 뒤를 향해 있어요.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = 오른쪽 면을 두 번 돌려요. 리듬을 지켜요: R2 U' R2 U' R2.","Headlights":"헤드라이트","Two yellow corners up next to each other, the other two look at you like headlights.":"노란색이 위를 향한 코너 두 개가 나란히 있고, 나머지 두 개는 헤드라이트처럼 나를 보고 있어요.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"노란색이 위를 향한 코너 두 개를 <b>뒤쪽<\/b>에 둬요. 헤드라이트는 <b>나를 향해<\/b> 있어요.","The D turn moves the white layer for a moment. D' puts it back.":"D 회전으로 흰색 층이 잠깐 움직여요. D'로 다시 돌려놓아요.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"노란색이 위를 향한 코너 두 개가 나란히 있고, 나머지 두 개는 노란색이 서로 반대쪽을 향해 있어요.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"노란색이 위를 향한 코너 두 개를 <b>오른쪽<\/b>에 둬요. 왼쪽에는 노란색 하나가 나를 향하고, 하나는 뒤를 향해 있어요.","Small r = turn the right face together with the middle slice.":"소문자 r = 오른쪽 면을 가운데 층과 함께 돌려요.","Bowtie":"나비넥타이","Two yellow corners up, diagonal from each other.":"노란색이 위를 향한 코너 두 개가 대각선으로 있어요.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너를 <b>앞 왼쪽<\/b>과 <b>뒤 오른쪽<\/b>에 둬요. 앞 오른쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","The middle part \"r U R' U' r'\" is the same as in the T.":"가운데 부분 \"r U R' U' r'\"은 T와 같아요.","PLL 1 · corners":"PLL 1 · 코너","Headlights: T-perm":"헤드라이트: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"나란히 있는 코너 두 개를 맞바꿔요. 한쪽 면에 이미 코너 색이 같은 쌍(헤드라이트)이 있을 때 써요.","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"한쪽 면에 <b>헤드라이트<\/b>(두 코너가 같은 색)가 생길 때까지 윗면을 돌려요. 그 면을 <b>왼쪽<\/b>에 둬요.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"2-look PLL: 먼저 코너를 맞추고(2가지 케이스), 그다음 엣지를 맞춰요(4가지 케이스).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"왼쪽과 오른쪽 엣지도 맞바뀌어요. 괜찮아요, 엣지 단계에서 맞춰요.","Headlights on every side? Corners are done, go to the edges.":"모든 면에 헤드라이트가 있나요? 코너는 끝났으니 엣지로 넘어가요.","No headlights: Y-perm":"헤드라이트 없음: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"코너 두 개를 대각선으로 맞바꿔요. 어느 면에도 헤드라이트가 없을 때 써요.","No headlights on any side. Hold it any way round.":"어느 면에도 헤드라이트가 없어요. 아무 방향으로 잡아도 돼요.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"OLL 같은 덩어리 두 개를 이어서 하는 거예요. 반씩 나눠서 외워요: \"F R U' R' U' R U R' F'\"와 \"R U R' U' R' F R F'\".","PLL 2 · edges":"PLL 2 · 엣지","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"맞춰진 블록이 앞에 있어요. <b>왼쪽<\/b> 엣지가 <b>오른쪽<\/b>으로 가야 해요.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"코너는 끝났어요. 맞춰진 면(완성된 블록)을 <b>앞<\/b>에 둬요. <b>왼쪽<\/b> 엣지의 자리는 <b>오른쪽<\/b>이에요: 왼쪽 엣지는 오른쪽으로, 오른쪽 엣지는 뒤로, 뒤쪽 엣지는 왼쪽으로 가요.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"공식을 하고 나면 윗면 전체가 반 바퀴 어긋나 있어요. 마지막 U2로 센터와 맞춰요.","The front block never changes. Only the left, right and back edges go round.":"앞쪽 블록은 절대 바뀌지 않아요. 왼쪽, 오른쪽, 뒤쪽 엣지만 돌아가요.","Right edge needs to go left instead? That is the Ub-perm.":"오른쪽 엣지가 왼쪽으로 가야 하나요? 그건 Ub-perm이에요.","Lined up":"줄 맞춤","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"맞춰진 블록이 앞에 있어요. <b>오른쪽<\/b> 엣지가 <b>왼쪽<\/b>으로 가야 해요.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"코너는 끝났어요. 맞춰진 블록을 <b>앞<\/b>에 둬요. <b>오른쪽<\/b> 엣지의 자리는 <b>왼쪽<\/b>이에요: 오른쪽 엣지는 왼쪽으로, 왼쪽 엣지는 뒤로, 뒤쪽 엣지는 오른쪽으로 가요.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = 오른쪽 면을 세 번 돌려요. 결과는 R'과 같지만, 빠르게 세 번 돌리면 리듬이 유지돼요.","The front block never moves. Only the left, right and back edges go round.":"앞쪽 블록은 절대 움직이지 않아요. 왼쪽, 오른쪽, 뒤쪽 엣지만 돌아가요.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"마주 보는 엣지를 맞바꿔요: 앞과 뒤, 왼쪽과 오른쪽.","Corners done, every edge is opposite its centre. Any way round.":"코너는 끝났고, 모든 엣지가 자기 센터의 반대편에 있어요. 아무 방향으로 잡아도 돼요.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = L과 R 사이의 가운데 층이고, L처럼 돌려요. M2 = 두 번.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"나란히 있는 엣지를 맞바꿔요: 앞과 오른쪽, 뒤와 왼쪽.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"코너는 끝났어요. 맞바꿀 쌍을 <b>앞 오른쪽<\/b>과 <b>뒤 왼쪽<\/b>에 둬요.","The last U lines the top back up with the centres.":"마지막 U로 윗면을 다시 센터와 맞춰요.","F2L 1":"F2L 1","Case 1":"케이스 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"코너는 슬롯 안, 흰색이 아래를 향해요. 엣지는 슬롯 안에 뒤집혀 있어요.","F2L 2":"F2L 2","Case 2":"케이스 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"코너는 슬롯 안, 흰색이 아래를 향해요. 엣지는 위층 앞쪽에 있고, 초록색이 바깥을 향해요.","F2L 3":"F2L 3","Case 3":"케이스 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"코너는 슬롯 안, 흰색이 아래를 향해요. 엣지는 위층 오른쪽에 있고, 초록색이 위에 있어요.","F2L 4":"F2L 4","Case 4":"케이스 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"코너는 슬롯 안, 흰색이 나를 향해요. 엣지는 슬롯 안에 방향이 맞게 있어요.","F2L 5":"F2L 5","Case 5":"케이스 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"코너는 슬롯 안, 흰색이 나를 향해요. 엣지는 슬롯 안에 뒤집혀 있어요.","F2L 6":"F2L 6","Case 6":"케이스 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"코너는 슬롯 안, 흰색이 나를 향해요. 엣지는 위층 앞쪽에 있고, 초록색이 바깥을 향해요.","F2L 7":"F2L 7","Case 7":"케이스 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"코너는 슬롯 안, 흰색이 나를 향해요. 엣지는 위층 오른쪽에 있고, 초록색이 위에 있어요.","F2L 8":"F2L 8","Case 8":"케이스 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"코너는 슬롯 안, 흰색이 오른쪽을 향해요. 엣지는 슬롯 안에 방향이 맞게 있어요.","F2L 9":"F2L 9","Case 9":"케이스 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"코너는 슬롯 안, 흰색이 오른쪽을 향해요. 엣지는 슬롯 안에 뒤집혀 있어요.","F2L 10":"F2L 10","Case 10":"케이스 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"코너는 슬롯 안, 흰색이 오른쪽을 향해요. 엣지는 위층 앞쪽에 있고, 초록색이 바깥을 향해요.","F2L 11":"F2L 11","Case 11":"케이스 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"코너는 슬롯 안, 흰색이 오른쪽을 향해요. 엣지는 위층 오른쪽에 있고, 초록색이 위에 있어요.","F2L 12":"F2L 12","Case 12":"케이스 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 슬롯 안에 방향이 맞게 있어요.","F2L 13":"F2L 13","Case 13":"케이스 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 슬롯 안에 뒤집혀 있어요.","F2L 14":"F2L 14","Case 14":"케이스 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 위층 앞쪽에 있고, 초록색이 바깥을 향해요.","F2L 15":"F2L 15","Case 15":"케이스 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 위층 왼쪽에 있고, 초록색이 바깥을 향해요.","F2L 16":"F2L 16","Case 16":"케이스 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 위층 뒤쪽에 있고, 초록색이 바깥을 향해요.","F2L 17":"F2L 17","Case 17":"케이스 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"코너는 슬롯 바로 위층에 있고, 흰색이 위를 향해요. 엣지는 위층 오른쪽에 있고, 초록색이 바깥을 향해요.","
