ion à la suite.","2x2 · Orientation 2 of 3":"2x2 · Orientation 2 sur 3","Antisune: one yellow corner up, other way":"Antisune : un coin jaune vers le haut, dans l'autre sens","One yellow corner up, the other way round from the Sune.":"Un coin jaune vers le haut, dans l'autre sens que pour le Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Tiens le coin avec le jaune vers le haut <b>à l'arrière à droite<\/b>. Le coin avant gauche montre son jaune <b>vers toi<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Si ni l'image du Sune ni celle de l'Antisune ne correspond, tourne le haut et regarde à nouveau.","2x2 · Orientation 3 of 3":"2x2 · Orientation 3 sur 3","Pi: no yellow corner up":"Pi : aucun coin jaune vers le haut","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Aucun coin jaune vers le haut. Après, tout le jaune est en haut, ou tu obtiens un cas Sune ou Antisune.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Pas de jaune en haut. Tiens le cube pour que les deux coins de <b>gauche<\/b> montrent leur jaune <b>vers la gauche<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"Des paires jaunes à gauche et à droite ? Tiens l'une des deux paires à gauche.","R2 = turn the right side twice.":"R2 = tourne la face droite deux fois.","2x2 · Permutation 1 of 2":"2x2 · Permutation 1 sur 2","T-perm: headlights on one side":"T-perm : des phares sur un côté","All yellow is up. Swaps two corners next to each other.":"Tout le jaune est en haut. Échange deux coins voisins.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Cherche des <b>phares<\/b> : un côté où les deux autocollants du haut sont de la même couleur. Tiens ce côté <b>à gauche<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"Des phares sur chaque côté ? Rien à échanger : tourne juste le haut pour l'aligner.","After the T-perm, turn the top until the cube is solved.":"Après le T-perm, tourne le haut jusqu'à ce que le cube soit résolu.","2x2 · Permutation 2 of 2":"2x2 · Permutation 2 sur 2","Y-perm: no headlights":"Y-perm : pas de phares","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Tout le jaune est en haut, mais aucun côté n'a de phares. Échange deux coins en diagonale.","No headlights anywhere. Hold it any way round.":"Pas de phares du tout. Tiens le cube dans n'importe quel sens.","After the Y-perm, turn the top until the cube is solved.":"Après le Y-perm, tourne le haut jusqu'à ce que le cube soit résolu.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Apprends-le en deux moitiés : « F R U' R' U' R U R' F' » et « R U R' U' R' F R F' ».","2x2 · OLL 1 of 7":"2x2 · OLL 1 sur 7","Turns all yellow up. The white face stays on the bottom.":"Met tout le jaune en haut. La face blanche reste en bas.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Un coin jaune vers le haut <b>à l'avant à gauche<\/b>. Le coin avant droit montre son jaune <b>vers toi<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"D'abord la face blanche en bas : seul le blanc doit être en bas, les côtés peuvent être mélangés.","2x2 · OLL 2 of 7":"2x2 · OLL 2 sur 7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Un coin jaune vers le haut <b>à l'arrière à droite<\/b>. Le coin avant gauche montre son jaune <b>vers toi<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3 sur 7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Aucun coin jaune vers le haut. Paires jaunes sur les côtés <b>gauche<\/b> et <b>droit<\/b>.","2x2 · OLL 4 of 7":"2x2 · OLL 4 sur 7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Aucun coin jaune vers le haut. Une paire jaune <b>à gauche<\/b> ; à droite, un jaune est vers toi et un vers l'arrière.","2x2 · OLL 5 of 7":"2x2 · OLL 5 sur 7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Deux coins jaunes vers le haut <b>à l'arrière<\/b>. Les deux autres montrent leur jaune <b>vers toi<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6 sur 7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Deux coins jaunes vers le haut <b>à droite<\/b>. À gauche, un jaune est vers toi et un vers l'arrière.","2x2 · OLL 7 of 7":"2x2 · OLL 7 sur 7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Coins jaunes vers le haut <b>à l'avant à gauche<\/b> et <b>à l'arrière à droite<\/b>. Le coin avant droit montre son jaune <b>vers toi<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1 sur 6","Top: headlights, bottom: done":"Haut : phares, bas : fini","All yellow up, all white down. Fixes both layers at once.":"Tout le jaune en haut, tout le blanc en bas. Règle les deux couronnes à la fois.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Couronne du haut : phares <b>à gauche<\/b>. Couronne du bas : déjà bonne.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Phares<\/b> = un côté où les deux autocollants de cette couronne sont de la même couleur.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"Le haut est bon mais pas le bas ? Retourne tout le cube pour que la mauvaise couronne soit en haut, puis utilise la carte 1 ou 2.","After the algorithm, turn the top and bottom until the cube is solved.":"Après l'algorithme, tourne le haut et le bas jusqu'à ce que le cube soit résolu.","2x2 · PBL 2 of 6":"2x2 · PBL 2 sur 6","Top: no headlights, bottom: done":"Haut : pas de phares, bas : fini","Top layer: no headlights. Bottom layer: already right.":"Couronne du haut : pas de phares. Couronne du bas : déjà bonne.","2x2 · PBL 3 of 6":"2x2 · PBL 3 sur 6","Both layers: headlights":"Les deux couronnes : phares","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Des phares dans les <b>deux<\/b> couronnes. Tourne le haut et le bas pour qu'ils soient tous les deux <b>à l'avant<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4 sur 6","Both layers: no headlights":"Les deux couronnes : pas de phares","No headlights in either layer. Hold it any way round.":"Aucune des deux couronnes n'a de phares. Tiens le cube dans n'importe quel sens.","2x2 · PBL 5 of 6":"2x2 · PBL 5 sur 6","Top: headlights, bottom: none":"Haut : phares, bas : aucun","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Couronne du haut : phares <b>à l'avant<\/b>. Couronne du bas : pas de phares.","2x2 · PBL 6 of 6":"2x2 · PBL 6 sur 6","Top: none, bottom: headlights":"Haut : aucun, bas : phares","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Couronne du haut : pas de phares. Couronne du bas : phares <b>à l'arrière<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Étape 1 · pointes","Turn the tips":"Tourner les pointes","The easiest step: each tip turns on its own.":"L'étape la plus facile : chaque pointe tourne toute seule.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Tourne chaque pointe (<b>u l r b<\/b>) jusqu'à ce que ses trois couleurs correspondent aux <b>trois centres<\/b> juste à côté.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"Une pointe a trois couleurs. Chacune doit correspondre au triangle central juste en dessous, sur la même face.","Turning a tip never moves anything else, so you can always fix the tips first.":"Tourner une pointe ne bouge jamais rien d'autre, alors tu peux toujours régler les pointes en premier.","Pyraminx · Step 2 · centres":"Pyraminx · Étape 2 · centres","Match the centres":"Assortir les centres","Turn whole corners until every face has three centres of the same colour.":"Tourne des coins entiers jusqu'à ce que chaque face ait trois centres de la même couleur.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Tourne des coins entiers (<b>U L R B<\/b>) jusqu'à ce que, sur chaque face, les <b>trois centres<\/b> aient la même couleur. Puis tiens le puzzle avec la <b>face jaune en bas<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Chaque coin emporte sa pointe et ses trois centres avec lui, donc l'étape 1 reste faite.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"Les arêtes se mélangent pendant ce temps. C'est normal, les étapes 3 et 4 les réparent.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Étape 3a · arêtes du bas","Edge on the right, yellow facing you":"Arête à droite, jaune vers toi","Puts the green-yellow edge into the front bottom.":"Place l'arête vert-jaune en bas à l'avant.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Face jaune en bas. L'arête qui doit aller <b>en bas à l'avant<\/b> est sur le bord <b>avant droit<\/b>, jaune <b>vers toi<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Tourne tout le puzzle (le jaune reste en bas) pour que la place à remplir soit en bas à l'avant.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"Arête déjà en bas mais à la mauvaise place ou retournée ? Tiens cette place en bas à l'avant et fais ceci une fois pour faire remonter l'arête.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Étape 3b · arêtes du bas","Edge on the right, yellow facing right":"Arête à droite, jaune vers la droite","Same edge, the other way round.":"Même arête, dans l'autre sens.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"L'arête est sur le bord <b>avant droit<\/b>, jaune vers la <b>droite<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Étape 3c · arêtes du bas","Edge on the left, yellow facing you":"Arête à gauche, jaune vers toi","The edge is on the left side.":"L'arête est du côté gauche.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"L'arête est sur le bord <b>avant gauche<\/b>, jaune <b>vers toi<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Étape 3d · arêtes du bas","Edge on the left, yellow facing left":"Arête à gauche, jaune vers la gauche","Mirror of 3b.":"Miroir de 3b.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"L'arête est sur le bord <b>avant gauche<\/b>, jaune vers la <b>gauche<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Étape 3e · arêtes du bas","Edge at the back, yellow facing right":"Arête à l'arrière, jaune vers la droite","The edge is on the back edge.":"L'arête est sur le bord arrière.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"L'arête est sur le bord <b>arrière<\/b>, jaune vers la <b>droite<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Étape 3f · arêtes du bas","Edge at the back, yellow facing left":"Arête à l'arrière, jaune vers la gauche","Mirror of 3e.":"Miroir de 3e.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"L'arête est sur le bord <b>arrière<\/b>, jaune vers la <b>gauche<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Fais-le pour les trois arêtes du bas. La face jaune est finie quand chaque arête du bas correspond aux centres des deux côtés.","Pyraminx · Step 4a · last edges":"Pyraminx · Étape 4a · dernières arêtes","Edges go round (one way)":"Les arêtes tournent (dans un sens)","Moves the three top edges round.":"Fait tourner les trois arêtes du haut.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Face jaune finie, en bas. <b>Aucune<\/b> arête du haut n'est à sa place. L'arête <b>avant gauche<\/b> doit aller <b>à l'avant à droite<\/b>.","After it, two edges may be flipped. Then do 4c.":"Après, deux arêtes peuvent être retournées. Fais alors 4c.","You never need more than two algorithms for the last edges.":"Il ne faut jamais plus de deux algorithmes pour les dernières arêtes.","Pyraminx · Step 4b · last edges":"Pyraminx · Étape 4b · dernières arêtes","Edges go round (other way)":"Les arêtes tournent (dans l'autre sens)","Moves the three top edges round the other way.":"Fait tourner les trois arêtes du haut dans l'autre sens.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Aucune<\/b> arête du haut n'est à sa place. L'arête <b>avant gauche<\/b> doit aller <b>à l'arrière<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Étape 4c · dernières arêtes","Two edges flipped":"Deux arêtes retournées","All three top edges are in their place, but two are flipped.":"Les trois arêtes du haut sont à leur place, mais deux sont retournées.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Toutes les arêtes du haut sont à leur place, dont deux retournées. Tiens le puzzle pour que la <b>bonne arête soit à l'arrière<\/b>.","Solved!":"Résolu !","4x4 · 1 · edge pairing":"4x4 · 1 · appariement des arêtes","Join two halves opposite each other":"Réunir deux moitiés face à face","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"Une arête du 4x4 a deux moitiés. Quand les deux moitiés sont face à face, ceci les réunit en une seule arête.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Centres finis. Les deux moitiés d'une arête (ici <b>bleu-orange<\/b>) sont <b>face à face<\/b> : l'une <b>en haut du bord avant gauche<\/b>, l'autre <b>en haut du bord avant droit<\/b>, avec l'<b>orange vers toi<\/b> pour les deux. Seules les pièces bleu-orange sont en couleur, pour que tu puisses les suivre.","Joined! The blue-orange edge is now one piece, at the front right.":"Réunie ! L'arête bleu-orange est maintenant une seule pièce, à l'avant à droite.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = les deux couronnes du haut ensemble. Uw' amène la moitié de gauche vers la droite, Uw à la fin remet les centres en place.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"La partie du milieu « R U R' F R' F' R » amène une arête déjà finie à la place, pour que les deux moitiés puissent se rejoindre. Le reste du cube se mélange : c'est normal, tu le résous ensuite comme un 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Réunis les 12 arêtes de cette façon, puis résous le 4x4 comme un 3x3.","Edge joined":"Arête réunie","4x4 · 1b · edge pairing":"4x4 · 1b · appariement des arêtes","Combine with the centre layer, then swap it out":"Réunir avec la couronne centrale, puis échanger","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Tourne seulement la couronne centrale pour réunir les deux moitiés, échange l'arête réunie contre une qui ne l'est pas encore, puis remets la couronne centrale en place.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Centres finis. Les deux moitiés d'une arête (ici <b>bleu-orange<\/b>) sont <b>en diagonale<\/b> : l'une <b>en haut sur le bord avant gauche<\/b> avec l'<b>orange vers toi<\/b>, l'autre <b>en bas sur le bord avant droit<\/b> avec le <b>bleu vers toi<\/b>. Seules les pièces bleu-orange sont en couleur, pour que tu puisses les suivre.","Joined! The blue-orange edge is now one piece, at the top front.":"Réunie ! L'arête bleu-orange est maintenant une seule pièce, en haut à l'avant.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"Ce mouvement a un nom : un <b>mouvement de tranche<\/b>. Un petit u veut dire : tourne <b>seulement la couronne centrale du haut<\/b> (la deuxième couronne en partant du haut). La couronne du haut ne bouge pas.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = cette couronne centrale tourne vers la droite (comme U'). La moitié du haut va à droite et se pose au-dessus de la moitié du bas : l'arête est réunie.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' monte l'arête réunie en haut et met à sa place une arête qui n'est pas encore réunie.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = remets la couronne centrale en place, pour que les centres soient de nouveau résolus. L'arête réunie reste entière en haut.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Si la moitié du bas est à gauche et la moitié du haut à droite, tourne la couronne centrale dans l'autre sens : u L' U' L u'.","Halves combined":"Moitiés réunies","Swapped out":"Échangée","4x4 · 2 · OLL parity":"4x4 · 2 · parité OLL","No 3x3 OLL fits":"Aucune OLL du 3x3 ne correspond","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Quand il n'y a <b>aucun algorithme du 3x3<\/b> pour ton haut, fais ceci. Ça n'arrive que sur un 4x4 : un nombre impair d'arêtes du haut est retourné (1 ou 3), comme sur l'image. Ceci retourne l'arête avant, et une OLL normale du 3x3 marche à nouveau.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Jaune en haut. Comme sur l'image : <b>3 arêtes sont retournées<\/b> (avant, droite et arrière montrent leur couleur en haut), seule l'arête de <b>gauche<\/b> a le jaune en haut. L'image montre le haut vu de dessus, l'avant en bas. Tiens une <b>arête retournée à l'avant<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Maintenant, un nombre pair d'arêtes est retourné (arrière et gauche), et les deux coins avant ont tourné : c'est de nouveau un cas normal du 3x3. Termine avec ton OLL et ta PLL du 3x3.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"Comment la repérer : compte les arêtes du haut qui n'ont pas le jaune en haut. 1 ou 3 = aucun algorithme du 3x3 ne correspond, fais d'abord celui-ci.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = les <b>deux couronnes de droite ensemble<\/b> (mouvement large), Lw = les deux couronnes de gauche ensemble. Sur beaucoup de fiches, on l'écrit avec un petit r et l.","U2 and F2 turn only the outer top and front layer, twice.":"U2 et F2 tournent seulement la couronne extérieure du haut et de l'avant, deux fois.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"L'arête avant se retourne. D'autres pièces du haut bougent aussi : c'est normal, ton OLL et ta PLL habituelles du 3x3 les réparent.","4x4 · 3 · PLL parity":"4x4 · 3 · parité PLL","Two edges swapped":"Deux arêtes échangées","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"Seulement sur un 4x4 aussi : tout à la fin, deux arêtes opposées du haut sont échangées. Ceci les remet en place.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Tout est résolu sauf les arêtes du haut <b>avant<\/b> et <b>arrière<\/b>, qui sont <b>échangées<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = les deux couronnes du haut, deux fois. Rw2 = les deux couronnes de droite, deux fois. r2 = seulement la deuxième couronne en partant de la droite, deux fois.","Only these two edges change. Everything else stays where it is.":"Seules ces deux arêtes changent. Tout le reste ne bouge pas.","Mirror cube · last layer":"Mirror cube · dernière couronne","Three corners (A-perm)":"Trois coins (A-perm)","Moves three top corners around. Everything else stays where it is.":"Fait tourner trois coins du haut. Tout le reste ne bouge pas.","Beginner 3x3":"3x3 débutant","Beginner":"Débutant","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"La méthode débutant classique. Tiens le cube avec le <b>jaune en haut<\/b> et le <b>vert vers toi<\/b> :\n       le blanc est résolu en premier, en bas, et le jaune en dernier, en haut. Clique sur une étape pour la voir bouger.","Intermediate 3x3":"3x3 intermédiaire","Intermediate":"Intermédiaire","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"Le niveau suivant : la croix blanche comme avant, puis le <b>F2L<\/b> (coin et arête ensemble),\n       l'<b>OLL 2-look<\/b> (tout le jaune en haut) et la <b>PLL 2-look<\/b> (tout à sa place). Même prise : jaune en haut, vert vers toi.","Advanced F2L (3x3)":"F2L avancé (3x3)","Advanced F2L":"F2L avancé","Advanced OLL (3x3)":"OLL avancée (3x3)","Advanced OLL":"OLL avancée","Advanced PLL (3x3)":"PLL avancée (3x3)","Advanced PLL":"PLL avancée","2x2 Beginner":"2x2 débutant","2x2 Intermediate":"2x2 intermédiaire","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"Couronne blanche comme en Débutant. Puis <b>3 algorithmes<\/b> rendent tout le haut jaune et <b>2 algorithmes<\/b> mettent les coins à leur place.","2x2 Advanced":"2x2 avancé","Advanced":"Avancé","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"La méthode <b>Ortega<\/b>. Fais d'abord la <b>face blanche<\/b> en bas (les côtés n'ont pas encore besoin de correspondre). Puis un des <b>7 algorithmes<\/b> met tout le jaune en haut, et un des <b>6 algorithmes<\/b> règle les deux couronnes à la fois.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Autres puzzles et grands cubes","push it up, away from you":"pousse vers le haut, loin de toi","pull it down, toward you":"tire vers le bas, vers toi","swing it to the left":"fais pivoter vers la gauche","swing it to the right":"fais pivoter vers la droite","turn it clockwise, like a clock":"tourne dans le sens horaire, comme une horloge","turn it anticlockwise":"tourne dans le sens antihoraire","push them up, away from you":"pousse-les vers le haut, loin de toi","pull them down, toward you":"tire-les vers le bas, vers toi","turn them clockwise, like a clock":"tourne-les dans le sens horaire, comme une horloge","turn them anticlockwise":"tourne-les dans le sens antihoraire","swing them to the right":"fais-les pivoter vers la droite","swing them to the left":"fais-les pivoter vers la gauche","clockwise as seen from behind":"sens horaire vu de derrière","anticlockwise as seen from behind":"sens antihoraire vu de derrière","swing it to the right (like D)":"fais pivoter vers la droite (comme D)","turn it clockwise, like F":"tourne dans le sens horaire, comme F","tip it so the front comes to the top":"bascule pour que l'avant vienne en haut","tip it so the top comes to the front":"bascule pour que le haut vienne devant","roll it to the right, like F":"fais rouler vers la droite, comme F","roll it to the left":"fais rouler vers la gauche","pull it down, toward you (like L)":"tire vers le bas, vers toi (comme L)","turn it so the right side faces you":"tourne pour que la face droite soit vers toi","turn it so the left side faces you":"tourne pour que la face gauche soit vers toi","Right face":"Face droite","Left face":"Face gauche","Top face":"Face du haut","Bottom face":"Face du bas","Front face":"Face avant","Back face":"Face arrière","Whole cube":"Tout le cube","Right two layers":"Les deux couronnes de droite","Left two layers":"Les deux couronnes de gauche","Front two layers":"Les deux couronnes de l'avant","Bottom two layers":"Les deux couronnes du bas","Top two layers":"Les deux couronnes du haut","Back two layers":"Les deux couronnes de l'arrière","Middle slice":"Tranche du milieu","Middle layer":"Couronne du milieu","Front-back middle slice":"Tranche du milieu avant-arrière","Only the centre layer next to the right (slice move, the right layer stays still)":"Seulement la couronne centrale voisine de la face droite (mouvement de tranche, la couronne de droite ne bouge pas)","Only the centre layer next to the left (slice move, the left layer stays still)":"Seulement la couronne centrale voisine de la face gauche (mouvement de tranche, la couronne de gauche ne bouge pas)","Only the centre layer next to the top (slice move, the top layer stays still)":"Seulement la couronne centrale voisine de la face du haut (mouvement de tranche, la couronne du haut ne bouge pas)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Seulement la couronne centrale voisine de la face du bas (mouvement de tranche, la couronne du bas ne bouge pas)","Only the centre layer next to the front (slice move, the front layer stays still)":"Seulement la couronne centrale voisine de la face avant (mouvement de tranche, la couronne avant ne bouge pas)","Only the centre layer next to the back (slice move, the back layer stays still)":"Seulement la couronne centrale voisine de la face arrière (mouvement de tranche, la couronne arrière ne bouge pas)","Top corner with its layer":"Coin du haut avec sa couronne","Top tip only":"Seulement la pointe du haut","Left corner with its layer":"Coin de gauche avec sa couronne","Left tip only":"Seulement la pointe de gauche","Right corner with its layer":"Coin de droite avec sa couronne","Right tip only":"Seulement la pointe de droite","Back corner with its layer":"Coin arrière avec sa couronne","Back tip only":"Seulement la pointe arrière","turn it clockwise, as you look at that corner":"tourne dans le sens horaire, en regardant ce coin","turn it anticlockwise, as you look at that corner":"tourne dans le sens antihoraire, en regardant ce coin","{what}: half a turn (turn it twice)":"{what} : un demi-tour (tourne deux fois)","{what}: three turns, ends the same as {mv} ({hint})":"{what} : trois mouvements, même résultat que {mv} ({hint})","{what}: {hint}":"{what} : {hint}","English (UK)":"Anglais (Royaume-Uni)","English (US)":"Anglais (États-Unis)","Arabic":"Arabe","Chinese":"Chinois","French":"Français","German":"Allemand","Hindi":"Hindi","Korean":"Coréen","Portuguese":"Portugais","Russian":"Russe","Spanish":"Espagnol"},"de":{"Cube Algorithms":"Würfel-Algorithmen","Settings":"Einstellungen","Grip: yellow on top, green facing you":"Griff: Gelb oben, Grün zu dir","Light":"Hell","Dark":"Dunkel","Switch to light mode":"Zum hellen Modus wechseln","Switch to dark mode":"Zum dunklen Modus wechseln","Top layer at the start":"Obere Ebene am Anfang","Algorithms":"Algorithmen","Turn the cube back":"Würfel zurückdrehen","All {name} steps":"Alle {name}-Schritte","Step back":"Schritt zurück","Play":"Abspielen","Step":"Schritt","Reset":"Zurücksetzen","Reset view":"Ansicht zurücksetzen","Play {n}× (back to start!)":"{n}× abspielen (zurück zum Start!)","Speed":"Tempo","Drag or swipe the cube to turn it around.":"Zieh oder wische über den Würfel, um ihn zu drehen.","Start":"Start","solved":"gelöst","before":"vorher","End":"Ende","Step {n}":"Schritt {n}","after {label}":"nach {label}","Round {r} of {n}: {mv}":"Runde {r} von {n}: {mv}","{n} rounds later... back exactly where we started!":"{n} Runden später ... genau wieder am Anfang!","Undo {mv}":"{mv} rückgängig","Press Play, or Step through one turn at a time.":"Drück auf Abspielen oder geh mit Schritt eine Drehung nach der anderen durch.","Done! Try Play 6x: the cube comes back to the start.":"Fertig! Probier 6x Abspielen: Der Würfel kommt zum Start zurück.","Done! That is what this step fixes.":"Fertig! Genau das löst dieser Schritt.","{i} of {n} turns done. Next: {mv}.":"{i} von {n} Drehungen fertig. Als Nächstes: {mv}.","Languages":"Sprachen","Estonian":"Estnisch","<b>r<\/b> right two layers":"<b>r<\/b> die rechten zwei Ebenen","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> Mittelschicht, gedreht wie L","<b>d<\/b> bottom two layers":"<b>d<\/b> die unteren zwei Ebenen","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = Klammer 3-mal ausführen","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> die rechten zwei Ebenen zusammen","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> die oberen zwei Ebenen zusammen","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> nur die zweite Ebene von rechts / links / oben (Slice, die innere Ebene)","<b>M<\/b> middle slice, like L":"<b>M<\/b> Mittelschicht, wie L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> ganzen Würfel kippen / rollen","<b>y<\/b> turn the whole cube":"<b>y<\/b> ganzen Würfel drehen","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> untere / obere zwei Ebenen","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> zwei Ebenen auf einmal","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> Mittelschicht zwischen vorne und hinten, wie F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> ganzen Würfel kippen, wie R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = Klammer zweimal ausführen","<b>U<\/b> top corner":"<b>U<\/b> obere Ecke","<b>L<\/b> front-left corner":"<b>L<\/b> Ecke vorne links","<b>R<\/b> front-right corner":"<b>R<\/b> Ecke vorne rechts","<b>B<\/b> back corner":"<b>B<\/b> hintere Ecke","capital = the corner with its whole layer":"Großbuchstabe = die Ecke mit ihrer ganzen Ebene","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = nur die Spitze","<b>'<\/b> = the other way":"<b>'<\/b> = andersherum","plain letter = clockwise as you look at that corner":"Buchstabe allein = im Uhrzeigersinn, wenn du auf diese Ecke schaust","<b>R<\/b> right":"<b>R<\/b> rechts","<b>L<\/b> left":"<b>L<\/b> links","<b>U<\/b> top":"<b>U<\/b> oben","<b>D<\/b> bottom":"<b>D<\/b> unten","<b>F<\/b> front":"<b>F<\/b> vorne","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> ganzen Würfel drehen, rechte Seite nach vorne","<b>2<\/b> = twice":"<b>2<\/b> = zweimal","<b>3<\/b> = three times":"<b>3<\/b> = dreimal","plain letter = clockwise as you look at that face":"Buchstabe allein = im Uhrzeigersinn, wenn du auf diese Seite schaust","Step 0 · the basic move":"Schritt 0 · der Grundzug","The Righty Move":"Der Righty-Zug","Learn this first. Steps 2 and 3 are built from it.":"Lerne das zuerst. Die Schritte 2 und 3 bauen darauf auf.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Halte den Würfel, wie du willst. Mach ihn <b>6-mal<\/b>, und der Würfel ist wieder wie am Anfang.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Sag beim Drehen laut mit: „rechts hoch, oben links, rechts runter, oben rechts“.","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"Deine rechte Hand macht alle vier Drehungen. Daumen vorne, der Zeigefinger schnippt die obere Ebene.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Sechs Wiederholungen heben sich auf. Toller Partytrick, und er zeigt: Formeln sind keine Zauberei.","Step 0 · the mirror move":"Schritt 0 · der Spiegelzug","The Lefty Move":"Der Lefty-Zug","Righty in a mirror, for the left hand. Same job on the left side.":"Righty gespiegelt, für die linke Hand. Gleiche Aufgabe auf der linken Seite.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Halte den Würfel, wie du willst. Die linke Hand macht alle vier Drehungen. Sechsmal, und er ist wieder wie am Anfang.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Jeder Buchstabe ist gespiegelt: Aus R wird L, und jede Drehung geht andersherum.","Use it in step 2 when the white corner sits above the front-left slot.":"Nutze ihn in Schritt 2, wenn die weiße Ecke über dem Slot vorne links sitzt.","Kids often find this one easier: the left index finger flicks the top toward you.":"Viele Kinder finden diesen leichter: Der linke Zeigefinger schnippt die obere Ebene zu dir.","Step 1a · white cross":"Schritt 1a · weißes Kreuz","Edge on top, white facing up":"Kante oben, Weiß zeigt nach oben","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"Der leichteste Kreuz-Fall. Dreh die obere Ebene, bis die Kante über ihrem Slot ist, dann dreh diese Seite zweimal.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Weiß unten<\/b>. Eine weiße Kante ist in der oberen Ebene, der weiße Aufkleber <b>zeigt nach oben<\/b>. Dreh die obere Ebene, bis ihre andere Farbe über dem passenden Mittelstück ist, hier Grün über Grün, dann dreh diese Seite zweimal.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Schau auf die Seitenfarbe der Kante, nicht auf das Weiß. Sie sagt dir, welche Seite du drehen musst.","Grey pieces do not matter yet. Corners come in step 2.":"Graue Steine sind noch egal. Die Ecken kommen in Schritt 2.","Do this for all four edges. Most of the cross is just this move.":"Mach das für alle vier Kanten. Das meiste vom Kreuz ist nur dieser Zug.","Step 1b · white cross":"Schritt 1b · weißes Kreuz","Edge on top, white facing sideways":"Kante oben, Weiß zeigt zur Seite","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Eine weiße Kante in der oberen Ebene, Weiß zeigt zu dir. Bringt sie richtig herum nach unten.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Weiß unten. Die Kante sitzt <b>oben vorne<\/b>, der weiße Aufkleber <b>zeigt zu dir<\/b>. Ihre andere Farbe (oben) hat <b>dieselbe Farbe wie das vordere Mittelstück<\/b>, hier Grün. Wenn nicht, dreh die obere Ebene, bis es passt.","The other cross edges are not disturbed.":"Die anderen Kreuzkanten bleiben, wo sie sind.","Same ending as 1c: the last three turns tuck the edge in from the left.":"Gleiches Ende wie bei 1c: Die letzten drei Drehungen schieben die Kante von links hinein.","Step 1c · white cross":"Schritt 1c · weißes Kreuz","Edge in the bottom, flipped":"Kante unten, gekippt","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Eine weiße Kante ist schon unten, aber falsch herum. Kippt sie an Ort und Stelle.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Weiß unten<\/b>, Gelb oben. Die falsch herum liegende Kante sitzt <b>unten vorne<\/b>, der weiße Aufkleber zeigt zu dir. Die anderen Kreuzkanten bleiben, wo sie sind.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"Ziel von Schritt 1: ein weißes Plus unten, und die Seitenfarbe jeder Kante passt zum Mittelstück daneben.","Grey pieces do not matter yet. Only look at the white ones.":"Graue Steine sind noch egal. Schau nur auf die weißen.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"Kante in der oberen Ebene? Dreh die obere Ebene, bis sie über ihrem Slot ist, dann dreh diese Seite zweimal.","Step 2a · white corners":"Schritt 2a · weiße Ecken","Corner above its slot, white facing right":"Ecke über ihrem Slot, Weiß zeigt nach rechts","The quick case. Three turns and the corner drops in.":"Der schnelle Fall. Drei Drehungen und die Ecke fällt hinein.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Weiß unten. Die weiße Ecke ist in der <b>oberen Ebene, direkt über<\/b> ihrem Slot <b>vorne rechts<\/b>, der weiße Aufkleber <b>zeigt nach rechts<\/b>. Ihre anderen zwei Farben passen zum vorderen und rechten Mittelstück.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"Das ist Righty ohne die letzte Drehung. Einmal Righty geht auch, die zusätzliche Drehung oben ändert hier nichts.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"Noch nicht über ihrem Slot? Dreh die obere Ebene, bis sie es ist. Eine Ecke gehört dorthin, wo ihre zwei Seitenfarben auf die passenden Mittelstücke treffen.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"Ecke schon im Slot, aber verdreht? Mach einmal Righty, um sie herauszuholen, dann fang neu an.","Step 2b · white corners":"Schritt 2b · weiße Ecken","Corner above its slot, white facing you":"Ecke über ihrem Slot, Weiß zeigt zu dir","Same corner, white pointing at you. Use the front face instead of the right.":"Gleiche Ecke, Weiß zeigt zu dir. Nimm die vordere Seite statt der rechten.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Weiß unten. Die weiße Ecke ist in der <b>oberen Ebene über<\/b> ihrem Slot <b>vorne rechts<\/b>, der weiße Aufkleber <b>zeigt zu dir<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Spiegelbildlich denken: Weiß rechts, nimm R. Weiß vorne, nimm F.","Righty five times also does it, but this is three turns instead of twenty.":"Fünfmal Righty klappt auch, aber das hier sind drei Drehungen statt zwanzig.","Step 2c · white corners":"Schritt 2c · weiße Ecken","Corner above its slot, white facing up":"Ecke über ihrem Slot, Weiß zeigt nach oben","The slow case: white points at the ceiling. Righty three times.":"Der langsame Fall: Weiß zeigt zur Decke. Dreimal Righty.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Weiß unten. Die weiße Ecke ist in der <b>oberen Ebene über<\/b> ihrem Slot <b>vorne rechts<\/b>, der weiße Aufkleber <b>zeigt nach oben<\/b>. Mach Righty, bis Weiß nach unten zeigt. Hier braucht es drei Runden.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Beobachte die Ecke nach jedem Righty: Nach einem sitzt sie verdreht im Slot, nach zwei ist sie wieder oben und Weiß zeigt nach rechts, nach drei ist sie drin.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Jeder Eckenfall klappt nur mit Righty: 1, 3 oder 5 Runden. Die Karten 2a und 2b sind nur Abkürzungen.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"Ihre zwei Seitenfarben müssen zu den Mittelstücken daneben passen. Wenn nicht, dreh zuerst die obere Ebene.","Step 3a · middle layer":"Schritt 3a · mittlere Ebene","Edge goes right":"Kante nach rechts","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Bringt eine Kante aus der oberen Ebene in den Slot vorne rechts. U R U R' U', dreh den ganzen Würfel, sodass die rechte Seite zu dir zeigt, dann L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Weiß fertig, unten. Such eine obere Kante <b>ohne Gelb<\/b>. Dreh die obere Ebene, bis ihre vordere Farbe zum vorderen Mittelstück passt. Passt ihre obere Farbe zum <b>rechten<\/b> Mittelstück, nimm diese Formel.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Zwei Teile: „U R U R' U'“, dann dreh den ganzen Würfel (y), sodass die rechte Seite zu dir zeigt, dann „L' U' L“.","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Dreh den Würfel in die richtige Richtung: Die alte rechte Seite muss danach zu dir zeigen. Andersherum machst du die weiße Ebene kaputt.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Danach schaust du auf eine neue Vorderseite. Das ist okay, such einfach von dort die nächste Kante.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"Sitzt eine falsche Kante im Slot? Setz mit dieser Formel irgendeine andere Kante ein, um sie herauszuholen.","Grey pieces are the yellow ones. They do not matter until step 4.":"Graue Steine sind die gelben. Sie sind bis Schritt 4 egal.","Step 3b · middle layer":"Schritt 3b · mittlere Ebene","Edge goes left":"Kante nach links","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"Spiegelbild von 3a: bringt die Kante in den Slot vorne links. U' L' U' L U, dreh den ganzen Würfel, sodass die linke Seite zu dir zeigt, dann R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Wie 3a, aber die obere Farbe der Kante passt zum <b>linken<\/b> Mittelstück.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Zwei Teile: „U' L' U' L U“, dann dreh den ganzen Würfel (y'), sodass die linke Seite zu dir zeigt, dann „R U R'“.","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"Es ist 3a gespiegelt: Aus R wird L, jede Drehung geht andersherum, und der Würfel dreht sich nach links statt nach rechts.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Dreh den Würfel in die richtige Richtung: Die alte linke Seite muss danach zu dir zeigen. Andersherum machst du die weiße Ebene kaputt.","Once all four middle edges are in, the bottom two layers are done.":"Sobald alle vier mittleren Kanten drin sind, sind die unteren zwei Ebenen fertig.","Step 4a · yellow cross":"Schritt 4a · gelbes Kreuz","Yellow cross from a line":"Gelbes Kreuz aus einer Linie","Turns a yellow line on top into a yellow plus.":"Macht aus einer gelben Linie oben ein gelbes Plus.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"Untere zwei Ebenen fertig. Gelbe Linie oben, <b>von links nach rechts<\/b> gehalten. Nur ein gelber Punkt? Mach das einmal, dann bekommst du ein L, dann nimm 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"Das ist Righty, eingepackt in F und F'. Den Mittelteil kennst du schon.","Ignore the yellow corners for now. Only the plus matters.":"Ignorier die gelben Ecken erst mal. Nur das Plus zählt.","Step 4b · yellow cross":"Schritt 4b · gelbes Kreuz","Yellow cross from an L":"Gelbes Kreuz aus einem L","Turns a yellow L shape on top into a yellow plus.":"Macht aus einer gelben L-Form oben ein gelbes Plus.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"Gelbes L oben, seine zwei Arme zeigen <b>nach hinten und nach links<\/b> (wie 9 und 12 auf der Uhr).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Fast wie 4a, nur ist die Mitte „U R U' R'“ statt „R U R' U'“.","If the L points the wrong way, turn only the top layer until it fits.":"Zeigt das L falsch, dreh nur die obere Ebene, bis es passt.","Step 5 · yellow edges":"Schritt 5 · gelbe Kanten","Yellow edges into place (Sune)":"Gelbe Kanten an ihren Platz (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Halte die zwei passenden Kanten <b>hinten und rechts<\/b>, mach den Sune, dann eine U-Drehung. Jetzt passen alle vier gelben Kanten zu ihren Mittelstücken.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Dreh die obere Ebene, bis <b>zwei Kanten<\/b> zu ihren Mittelstücken passen. Zwei nebeneinander: Halte sie <b>hinten und rechts<\/b>, mach den Sune, dann einmal <b>U<\/b>. Zwei gegenüber: Halte sie <b>vorne und hinten<\/b> und mach einmal den Sune. Jetzt passen zwei nebeneinander, also mach den ersten Fall.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"Die letzte Drehung ist U (die gelbe Oberseite), nicht D. Eine Drehung unten würde die weißen Ebenen kaputt machen.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Fall gegenüber: Nach einem Sune sitzt das passende Paar vorne und rechts. Dreh den ganzen Würfel, sodass es hinten und rechts ist, dann Sune und U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Die gelben Ecken verdrehen sich dabei. Das ist okay, die Schritte 6 und 7 bringen das in Ordnung.","Step 6 · yellow corners":"Schritt 6 · gelbe Ecken","Yellow corners into place (Niklas)":"Gelbe Ecken an ihren Platz (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Der Niklas. Tauscht drei Ecken im Kreis, sodass jede Ecke zwischen ihren eigenen Farben sitzt. Verdreht ist noch egal.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Such eine Ecke, die schon <b>zwischen den richtigen Farben<\/b> sitzt (verdreht ist okay), und halte sie <b>vorne links<\/b>. Keine passt? Mach ihn einmal von irgendwo aus, dann schau noch mal.","The front-left corner stays put, the other three cycle around.":"Die Ecke vorne links bleibt, die anderen drei wandern im Kreis.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"Vergiss das letzte U nicht. Ohne es ist die obere Ebene um eine Drehung verschoben und die gelben Kanten aus Schritt 5 passen nicht mehr.","Might need two rounds. Keep the same corner at front left.":"Vielleicht brauchst du zwei Runden. Lass dieselbe Ecke vorne links.","Step 7 · finish":"Schritt 7 · Abschluss","Twist the yellow corners":"Gelbe Ecken drehen","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Nur der Righty-Zug. Gelb unten, verdrehte Ecke unten vorne rechts. Gelb zeigt zur Seite: 2-mal Righty. Gelb zeigt zu dir: 4-mal Righty. Dann dreh die untere Ebene (D) zur nächsten Ecke.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Dreh den Würfel um: Gelb unten<\/b>, Grün zeigt weiter zu dir. Bring eine verdrehte Ecke nach <b>unten vorne rechts<\/b> und schau, wohin ihr gelber Aufkleber zeigt:<ul class=\"rule\"><li>Gelb zeigt <b>zur Seite<\/b> (rechts) &rarr; <b>2-mal<\/b> Righty<\/li><li>Gelb zeigt <b>zu dir<\/b> &rarr; <b>4-mal<\/b> Righty<\/li><li>Gelb zeigt <b>nach unten<\/b> &rarr; diese Ecke ist fertig<\/li><\/ul>Dann dreh <b>nur die untere Ebene (D)<\/b>, um die nächste verdrehte Ecke nach unten vorne rechts zu bringen. Dreh nie den ganzen Würfel.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"Dieses Beispiel dreht zwei Ecken: Bei der ersten zeigt Gelb zur Seite (2-mal Righty), bei der zweiten zeigt Gelb zu dir (4-mal Righty).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"Unsicher? Mach einfach weiter Righty und prüf die Ecke nach je 2. Es sind nie mehr als 4.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"Die oberen zwei Ebenen sehen zwischendurch verdreht aus. Keine Panik und nichts reparieren. Sie kommen zurück, wenn die letzte Ecke fertig ist.","Finish with a bottom turn to line up the yellow layer. Solved!":"Zum Schluss eine Drehung unten, damit die gelbe Ebene passt. Gelöst!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · einfaches Einsetzen 1","Corner white right, edge at the back":"Ecke Weiß rechts, Kante hinten","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"Ecke und Kante gehen zusammen in einem Rutsch in den Slot, statt erst die Ecke und später die Kante.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Ecke über dem Slot <b>vorne rechts<\/b>, Weiß <b>zeigt nach rechts<\/b>. Ihre Kante ist <b>oben hinten<\/b>, Grün oben.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = die ersten zwei Ebenen (first two layers). Du baust eine weiße Ecke und ihre mittlere Kante zusammen und setzt sie dann als Paar ein.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"Bring sie erst selbst zusammen: Dreh die obere Ebene, bis Ecke und Kante wie im Bild sitzen.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Mach das weiße Kreuz wie vorher, dann nimm F2L statt der Anfänger-Schritte 2 und 3.","F2L · basic insert 2":"F2L · einfaches Einsetzen 2","Corner white facing you, edge on the left":"Ecke Weiß zu dir, Kante links","Mirror of insert 1, using the front face.":"Spiegelbild von Einsetzen 1, mit der vorderen Seite.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Ecke über dem Slot <b>vorne rechts<\/b>, Weiß <b>zeigt zu dir<\/b>. Ihre Kante ist <b>oben links<\/b>, Orange oben.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Wie Einsetzen 1 gespiegelt: Weiß zeigt zu dir statt nach rechts, also nimm F statt R.","F2L · basic insert 3":"F2L · einfaches Einsetzen 3","Corner and edge side by side (right)":"Ecke und Kante nebeneinander (rechts)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"Ecke und Kante liegen nebeneinander in der oberen Ebene. U bringt sie zusammen, dann gehen sie gemeinsam rein.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Ecke über dem Slot <b>vorne rechts<\/b>, Weiß <b>zeigt zu dir<\/b>, Grün oben. Ihre Kante ist <b>oben rechts<\/b>, Grün oben.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"Das erste U verbindet Ecke und Kante zu einem Block. R U' R' setzt den Block dann ein.","F2L · basic insert 4":"F2L · einfaches Einsetzen 4","Corner and edge side by side (front)":"Ecke und Kante nebeneinander (vorne)","Mirror of insert 3, using the front face.":"Spiegelbild von Einsetzen 3, mit der vorderen Seite.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Ecke über dem Slot <b>vorne rechts<\/b>, Weiß <b>zeigt nach rechts<\/b>, Grün zeigt zu dir. Ihre Kante ist <b>oben vorne<\/b>, Grün zeigt zu dir.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"Spiegelbild von Einsetzen 3: Aus R wird F', aus R' wird F, und jedes U geht andersherum.","F2L · make a block":"F2L · Block bauen","Join corner and edge into a block":"Ecke und Kante zu einem Block verbinden","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Wenn Weiß nach oben zeigt, geht es nicht direkt rein. Verbinde erst die Ecke und ihre Kante zu einem Block, dann setz den Block ein.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Ecke über dem Slot <b>vorne rechts<\/b>, Weiß <b>zeigt nach oben<\/b>. Ihre Kante ist <b>oben hinten<\/b>, Grün oben. <b>U R U2 R'<\/b> verbindet sie zu einem Block, <b>U R U' R'<\/b> setzt den Block ein.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Schau auf den Streifen unten: Nach der ersten Hälfte sitzen Ecke und Kante mit passenden Farben nebeneinander. Das ist der Block.","The second half is basic insert 3. You already know it.":"Die zweite Hälfte ist einfaches Einsetzen 3. Das kennst du schon.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"Das ist die Grundidee von F2L: Bau einen Block in der oberen Ebene und setz ihn dann ein. Die meisten F2L-Fälle gehen so.","Block made":"Block fertig","Block in":"Block drin","OLL 1 · yellow cross":"OLL 1 · gelbes Kreuz","Dot: make a line or an L":"Punkt: mach eine Linie oder ein L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Nur das gelbe Mittelstück und die zwei hinteren Ecken sind gelb. Keine gelben Kanten. Mach die Linien- oder die L-Formel, dann erscheint eine Linie oder ein L.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Gelb oben: Nur das <b>Mittelstück<\/b>, die Ecke <b>oben links<\/b> und die Ecke <b>oben rechts<\/b> sind gelb, keine Kanten.<ul class=\"rule\"><li>Linien-Formel <b>F R U R' U' F'<\/b> &rarr; ein <b>L<\/b> erscheint<\/li><li>L-Formel <b>F U R U' R' F'<\/b> &rarr; eine <b>Linie<\/b> erscheint<\/li><\/ul>Dann mach das Kreuz mit der Karte <b>Linie<\/b> oder <b>L-Form<\/b> unten fertig.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"Fertig! Ein L ist erschienen. Dreh die obere Ebene, bis seine Arme nach hinten und links zeigen, dann mach die L-Formel.","The animation does the line formula. The L appears with its arms at the front and right.":"Die Animation zeigt die Linien-Formel. Das L erscheint mit den Armen vorne und rechts.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Für die L-Formel müssen die Arme nach hinten und links zeigen, also dreh die obere Ebene erst zweimal (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"Stattdessen eine Linie? Halte sie von links nach rechts und mach die Linien-Formel noch einmal.","Corners do not matter yet. They get fixed in OLL 2.":"Die Ecken sind noch egal. Sie kommen in OLL 2 dran.","Line":"Linie","Yellow line on top becomes a yellow cross.":"Aus der gelben Linie oben wird ein gelbes Kreuz.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Gelbe Linie oben, <b>von links nach rechts<\/b> gehalten. Geht die Linie von vorne nach hinten? Dreh die obere Ebene erst einmal (U).","L shape":"L-Form","Yellow L on top becomes a yellow cross.":"Aus dem gelben L oben wird ein gelbes Kreuz.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"Gelbes L oben, seine Arme zeigen <b>nach hinten und links<\/b> (wie 9 und 12 auf der Uhr). Zeigt es woandershin? Dreh nur die obere Ebene, bis es passt.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Fast wie die Linien-Formel, nur ist die Mitte „U R U' R'“ statt „R U R' U'“.","OLL 2 · yellow corners":"OLL 2 · gelbe Ecken","Sune":"Sune","One yellow corner up. Looks like a fish.":"Eine Ecke mit Gelb oben. Sieht aus wie ein Fisch.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Gelbes Kreuz fertig. Die eine Ecke mit Gelb oben <b>vorne links<\/b>. Die Ecke vorne rechts zeigt Gelb <b>zu dir<\/b>.","You already know this one from beginner step 5.":"Den kennst du schon aus Anfänger-Schritt 5.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Eine Ecke mit Gelb oben, der Fisch andersherum. Der Sune rückwärts gespielt.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Die eine Ecke mit Gelb oben <b>hinten rechts<\/b>. Die Ecke vorne links zeigt Gelb <b>zu dir<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"Es ist der Sune rückwärts: Lies den Sune vom Ende her, jede Drehung andersherum.","H (double headlights)":"H (doppelte Scheinwerfer)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Keine Ecke mit Gelb oben. Zwei gelbe Paare zeigen nach außen, auf gegenüberliegenden Seiten.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Gelbe Paare auf der <b>linken<\/b> und <b>rechten<\/b> Seite.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Beginnt wie der Sune, mit einem zusätzlichen „R U' R' U“ in der Mitte.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Keine Ecke mit Gelb oben. Ein gelbes Paar auf einer Seite, die anderen zwei Ecken zeigen voneinander weg.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"Das gelbe Paar (Scheinwerfer) <b>links<\/b>. Rechts zeigt ein Gelb zu dir und eins nach hinten.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = die rechte Seite zweimal drehen. Halte den Rhythmus: R2 U' R2 U' R2.","Headlights":"Scheinwerfer","Two yellow corners up next to each other, the other two look at you like headlights.":"Zwei Ecken mit Gelb oben nebeneinander, die anderen zwei schauen dich an wie Scheinwerfer.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Die zwei Ecken mit Gelb oben <b>hinten<\/b>. Die Scheinwerfer <b>zeigen zu dir<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"Die D-Drehung bewegt kurz die weiße Ebene. D' bringt sie zurück.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Zwei Ecken mit Gelb oben nebeneinander, die anderen zwei zeigen voneinander weg.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Die zwei Ecken mit Gelb oben <b>rechts<\/b>. Links zeigt ein Gelb zu dir und eins nach hinten.","Small r = turn the right face together with the middle slice.":"Kleines r = die rechte Seite zusammen mit der Mittelschicht drehen.","Bowtie":"Fliege","Two yellow corners up, diagonal from each other.":"Zwei Ecken mit Gelb oben, diagonal zueinander.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Ecken mit Gelb oben <b>vorne links<\/b> und <b>hinten rechts<\/b>. Die Ecke vorne rechts zeigt Gelb <b>zu dir<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"Der Mittelteil „r U R' U' r'“ ist derselbe wie beim T.","PLL 1 · corners":"PLL 1 · Ecken","Headlights: T-perm":"Scheinwerfer: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Tauscht zwei benachbarte Ecken. Nimm ihn, wenn eine Seite schon gleiche Eckfarben hat (Scheinwerfer).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Dreh die obere Ebene, bis eine Seite <b>Scheinwerfer<\/b> hat (beide Ecken gleiche Farbe). Halte diese Seite <b>links<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"2-look PLL: erst die Ecken richtig stellen (2 Fälle), dann die Kanten (4 Fälle).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"Er tauscht auch die linke und rechte Kante. Das ist okay, der Kanten-Schritt bringt das in Ordnung.","Headlights on every side? Corners are done, go to the edges.":"Scheinwerfer auf jeder Seite? Die Ecken sind fertig, weiter zu den Kanten.","No headlights: Y-perm":"Keine Scheinwerfer: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Tauscht zwei Ecken diagonal. Nimm ihn, wenn keine Seite Scheinwerfer hat.","No headlights on any side. Hold it any way round.":"Auf keiner Seite Scheinwerfer. Halte den Würfel, wie du willst.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Das sind zwei OLL-artige Teile hintereinander. Lern ihn in Hälften: „F R U' R' U' R U R' F'“ und „R U R' U' R' F R F'“.","PLL 2 · edges":"PLL 2 · Kanten","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Gelöster Block vor dir. Die <b>linke<\/b> Kante muss nach <b>rechts<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Ecken fertig. Die gelöste Seite (ein voller Block) <b>vor dir<\/b>. Die <b>linke<\/b> Kante gehört nach <b>rechts<\/b>: Sie geht nach rechts, die rechte Kante nach hinten, die hintere Kante nach links.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"Nach der Formel ist die ganze obere Ebene um eine halbe Drehung verschoben. Das letzte U2 richtet sie an den Mittelstücken aus.","The front block never changes. Only the left, right and back edges go round.":"Der vordere Block ändert sich nie. Nur die linke, rechte und hintere Kante wandern im Kreis.","Right edge needs to go left instead? That is the Ub-perm.":"Muss stattdessen die rechte Kante nach links? Das ist der Ub-perm.","Lined up":"Ausgerichtet","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Gelöster Block vor dir. Die <b>rechte<\/b> Kante muss nach <b>links<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Ecken fertig. Der gelöste Block <b>vor dir<\/b>. Die <b>rechte<\/b> Kante gehört nach <b>links<\/b>: Sie geht nach links, die linke Kante nach hinten, die hintere Kante nach rechts.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = die rechte Seite dreimal drehen. Das Ergebnis ist wie bei R', aber die drei schnellen Drehungen halten deinen Rhythmus.","The front block never moves. Only the left, right and back edges go round.":"Der vordere Block bewegt sich nie. Nur die linke, rechte und hintere Kante wandern im Kreis.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Tauscht gegenüberliegende Kanten: vorne mit hinten, links mit rechts.","Corners done, every edge is opposite its centre. Any way round.":"Ecken fertig, jede Kante liegt gegenüber ihrem Mittelstück. Halte den Würfel, wie du willst.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = die Mittelschicht zwischen L und R, gedreht wie L. M2 = zweimal.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Tauscht benachbarte Kanten: vorne mit rechts, hinten mit links.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Ecken fertig. Die getauschten Paare <b>vorne rechts<\/b> und <b>hinten links<\/b>.","The last U lines the top back up with the centres.":"Das letzte U richtet die obere Ebene wieder an den Mittelstücken aus.","F2L 1":"F2L 1","Case 1":"Fall 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Ecke im Slot, Weiß zeigt nach unten. Die Kante im Slot, gekippt.","F2L 2":"F2L 2","Case 2":"Fall 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"Ecke im Slot, Weiß zeigt nach unten. Die Kante oben vorne, Grün zeigt nach außen.","F2L 3":"F2L 3","Case 3":"Fall 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"Ecke im Slot, Weiß zeigt nach unten. Die Kante oben rechts, Grün oben.","F2L 4":"F2L 4","Case 4":"Fall 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"Ecke im Slot, Weiß zeigt zu dir. Die Kante im Slot, richtig herum.","F2L 5":"F2L 5","Case 5":"Fall 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"Ecke im Slot, Weiß zeigt zu dir. Die Kante im Slot, gekippt.","F2L 6":"F2L 6","Case 6":"Fall 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"Ecke im Slot, Weiß zeigt zu dir. Die Kante oben vorne, Grün zeigt nach außen.","F2L 7":"F2L 7","Case 7":"Fall 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"Ecke im Slot, Weiß zeigt zu dir. Die Kante oben rechts, Grün oben.","F2L 8":"F2L 8","Case 8":"Fall 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"Ecke im Slot, Weiß zeigt nach rechts. Die Kante im Slot, richtig herum.","F2L 9":"F2L 9","Case 9":"Fall 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"Ecke im Slot, Weiß zeigt nach rechts. Die Kante im Slot, gekippt.","F2L 10":"F2L 10","Case 10":"Fall 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"Ecke im Slot, Weiß zeigt nach rechts. Die Kante oben vorne, Grün zeigt nach außen.","F2L 11":"F2L 11","Case 11":"Fall 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"Ecke im Slot, Weiß zeigt nach rechts. Die Kante oben rechts, Grün oben.","F2L 12":"F2L 12","Case 12":"Fall 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante im Slot, richtig herum.","F2L 13":"F2L 13","Case 13":"Fall 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante im Slot, gekippt.","F2L 14":"F2L 14","Case 14":"Fall 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben vorne, Grün zeigt nach außen.","F2L 15":"F2L 15","Case 15":"Fall 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben links, Grün zeigt nach außen.","F2L 16":"F2L 16","Case 16":"Fall 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben hinten, Grün zeigt nach außen.","F2L 17":"F2L 17","Case 17":"Fall 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben rechts, Grün zeigt nach außen.","F2L 18":"F2L 18","Case 18":"Fall 18","Corner on top above the slot, white facing up. The edge on top at the front, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben vorne, Grün oben.","F2L 19":"F2L 19","Case 19":"Fall 19","Corner on top above the slot, white facing up. The edge on top at the left, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben links, Grün oben.","F2L 20":"F2L 20","Case 20":"Fall 20","Corner on top above the slot, white facing up. The edge on top at the back, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben hinten, Grün oben.","F2L 21":"F2L 21","Case 21":"Fall 21","Corner on top above the slot, white facing up. The edge on top at the right, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach oben. Die Kante oben rechts, Grün oben.","F2L 22":"F2L 22","Case 22":"Fall 22","Corner on top above the slot, white facing you. The edge in the slot, the right way round.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante im Slot, richtig herum.","F2L 23":"F2L 23","Case 23":"Fall 23","Corner on top above the slot, white facing you. The edge in the slot, flipped.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante im Slot, gekippt.","F2L 24":"F2L 24","Case 24":"Fall 24","Corner on top above the slot, white facing you. The edge on top at the front, green facing out.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben vorne, Grün zeigt nach außen.","F2L 25":"F2L 25","Case 25":"Fall 25","Corner on top above the slot, white facing you. The edge on top at the left, green facing out.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben links, Grün zeigt nach außen.","F2L 26":"F2L 26","Case 26":"Fall 26","Corner on top above the slot, white facing you. The edge on top at the back, green facing out.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben hinten, Grün zeigt nach außen.","F2L 27":"F2L 27","Case 27":"Fall 27","Corner on top above the slot, white facing you. The edge on top at the right, green facing out.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben rechts, Grün zeigt nach außen.","F2L 28":"F2L 28","Case 28":"Fall 28","Corner on top above the slot, white facing you. The edge on top at the front, green on top.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben vorne, Grün oben.","F2L 29":"F2L 29","Case 29":"Fall 29","Corner on top above the slot, white facing you. The edge on top at the left, green on top.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben links, Grün oben.","F2L 30":"F2L 30","Case 30":"Fall 30","Corner on top above the slot, white facing you. The edge on top at the back, green on top.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben hinten, Grün oben.","F2L 31":"F2L 31","Case 31":"Fall 31","Corner on top above the slot, white facing you. The edge on top at the right, green on top.":"Ecke oben über dem Slot, Weiß zeigt zu dir. Die Kante oben rechts, Grün oben.","F2L 32":"F2L 32","Case 32":"Fall 32","Corner on top above the slot, white facing right. The edge in the slot, the right way round.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante im Slot, richtig herum.","F2L 33":"F2L 33","Case 33":"Fall 33","Corner on top above the slot, white facing right. The edge in the slot, flipped.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante im Slot, gekippt.","F2L 34":"F2L 34","Case 34":"Fall 34","Corner on top above the slot, white facing right. The edge on top at the front, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben vorne, Grün zeigt nach außen.","F2L 35":"F2L 35","Case 35":"Fall 35","Corner on top above the slot, white facing right. The edge on top at the left, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben links, Grün zeigt nach außen.","F2L 36":"F2L 36","Case 36":"Fall 36","Corner on top above the slot, white facing right. The edge on top at the back, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben hinten, Grün zeigt nach außen.","F2L 37":"F2L 37","Case 37":"Fall 37","Corner on top above the slot, white facing right. The edge on top at the right, green facing out.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben rechts, Grün zeigt nach außen.","F2L 38":"F2L 38","Case 38":"Fall 38","Corner on top above the slot, white facing right. The edge on top at the front, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben vorne, Grün oben.","F2L 39":"F2L 39","Case 39":"Fall 39","Corner on top above the slot, white facing right. The edge on top at the left, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben links, Grün oben.","F2L 40":"F2L 40","Case 40":"Fall 40","Corner on top above the slot, white facing right. The edge on top at the back, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben hinten, Grün oben.","F2L 41":"F2L 41","Case 41":"Fall 41","Corner on top above the slot, white facing right. The edge on top at the right, green on top.":"Ecke oben über dem Slot, Weiß zeigt nach rechts. Die Kante oben rechts, Grün oben.","OLL 1":"OLL 1","No yellow edges and no yellow corners on top.":"Keine gelben Kanten und keine gelben Ecken oben.","OLL 2":"OLL 2","OLL 3":"OLL 3","No yellow edges and 1 yellow corner on top.":"Keine gelben Kanten und 1 gelbe Ecke oben.","OLL 4":"OLL 4","OLL 5":"OLL 5","2 yellow edges and 1 yellow corner on top.":"2 gelbe Kanten und 1 gelbe Ecke oben.","OLL 6":"OLL 6","OLL 7":"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"Keine gelben Kanten und 2 gelbe Ecken oben.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"Keine gelben Kanten und 4 gelbe Ecken oben.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"4 gelbe Kanten und keine gelben Ecken oben.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"4 gelbe Kanten und 2 gelbe Ecken oben.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"4 gelbe Kanten und 1 gelbe Ecke oben.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"2 gelbe Kanten und 4 gelbe Ecken oben.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"2 gelbe Kanten und 2 gelbe Ecken oben.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Fall 42","OLL 43":"OLL 43","Case 43":"Fall 43","OLL 44":"OLL 44","Case 44":"Fall 44","OLL 45":"OLL 45","Case 45":"Fall 45","OLL 46":"OLL 46","Case 46":"Fall 46","OLL 47":"OLL 47","Case 47":"Fall 47","2 yellow edges and no yellow corners on top.":"2 gelbe Kanten und keine gelben Ecken oben.","OLL 48":"OLL 48","Case 48":"Fall 48","OLL 49":"OLL 49","Case 49":"Fall 49","OLL 50":"OLL 50","Case 50":"Fall 50","OLL 51":"OLL 51","Case 51":"Fall 51","OLL 52":"OLL 52","Case 52":"Fall 52","OLL 53":"OLL 53","Case 53":"Fall 53","OLL 54":"OLL 54","Case 54":"Fall 54","OLL 55":"OLL 55","Case 55":"Fall 55","OLL 56":"OLL 56","Case 56":"Fall 56","OLL 57":"OLL 57","Case 57":"Fall 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Schritt 1a · weiße Ebene","Corner above its spot, white facing right":"Ecke über ihrem Platz, Weiß zeigt nach rechts","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Wie 3x3 Schritt 2a. Drei Drehungen und die weiße Ecke fällt hinein.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Weiß unten<\/b>. Ein 2x2 hat keine Mittelstücke: Die <b>erste<\/b> weiße Ecke kann überallhin. Jede weitere Ecke kommt dorthin, wo ihre Seitenfarben <b>zu den weißen Ecken daneben passen<\/b>. Hier: Die Ecke ist <b>über ihrem Platz<\/b> vorne rechts, Weiß <b>zeigt nach rechts<\/b>.","Not above its spot yet? Turn the top until it is.":"Noch nicht über ihrem Platz? Dreh die obere Ebene, bis sie es ist.","Corner already in the bottom but
