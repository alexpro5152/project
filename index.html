nd puts the centres back.":"Uw = kaks pealmist kihti korraga. Uw' toob vasaku poole üle paremale, Uw lõpus paneb keskosad tagasi.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"Keskmine osa \"R U R' F R' F' R\" vahetab sisse valmis serva, et kaks poolt saaksid kokku tulla. Ülejäänud kuubik läheb segi: see pole hullu, pärast lahendad selle nagu 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Paarita nii kõik 12 serva, siis lahenda 4x4 nagu 3x3.","Edge joined":"Serv ühendatud","4x4 · 1b · edge pairing":"4x4 · 1b · servade paaritamine","Combine with the centre layer, then swap it out":"Ühenda keskkihiga, siis vaheta välja","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Keera ainult keskkihti, et kaks poolt ühendada, vaheta ühendatud serv välja serva vastu, mis pole veel ühendatud, ja keera siis keskkiht tagasi.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Keskosad on valmis. Ühe serva kaks poolt (siin <b>sinine-oranž<\/b>) on <b>diagonaalis<\/b>: üks <b>kõrgel vasak-eesmisel serval<\/b>, <b>oranž sinu poole<\/b>, teine <b>madalal parem-eesmisel serval<\/b>, <b>sinine sinu poole<\/b>. Värvilised on ainult sinise-oranži serva tükid, et saaksid neid jälgida.","Joined! The blue-orange edge is now one piece, at the top front.":"Ühendatud! Sinine-oranž serv on nüüd üks tükk, üleval ees.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"Sellel pöördel on nimi: <b>keskkihi pööre<\/b>. Väike u tähendab: keera <b>ainult ülemist keskkihti<\/b> (teist kihti ülevalt). Pealmine kiht ei liigu.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = see keskkiht keerab paremale (nagu U'). Kõrge pool läheb paremale ja jääb madala poole peale: serv on ühendatud.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' viib ühendatud serva üles ja paneb selle asemele serva, mis pole veel ühendatud.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = keera keskkiht tagasi, nii et keskosad on jälle lahendatud. Ühendatud serv jääb üleval koos.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Kui madal pool on vasakul ja kõrge pool paremal, keera keskkihti teistpidi: u L' U' L u'.","Halves combined":"Pooled ühendatud","Swapped out":"Välja vahetatud","4x4 · 2 · OLL parity":"4x4 · 2 · OLL paarsus","No 3x3 OLL fits":"Ükski 3x3 OLL ei sobi","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Kui sinu pealmise kihi jaoks <b>pole ühtegi 3x3 algoritmi<\/b>, tee seda. See juhtub ainult 4x4 puhul: paaritu arv pealmisi servi on ümber pööratud (1 või 3), nagu pildil. See pöörab eesmise serva ümber, nii et tavaline 3x3 OLL töötab jälle.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Kollane üleval. Nagu pildil: <b>3 serva on ümber pööratud<\/b> (eesmise, parema ja tagumise serva peal on üleval nende oma värv), ainult <b>vasakul<\/b> serval on kollane üleval. Pilt näitab pealmist külge ülevalt, esikülg on all. Hoia <b>ümberpööratud serva ees<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Nüüd on ümber pööratud paarisarv servi (taga ja vasakul) ja kaks eesmist nurka on keeratud: jälle tavaline 3x3 juhtum. Lõpeta oma 3x3 OLL-i ja PLL-iga.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"Kuidas seda ära tunda: loe kokku pealmised servad, mille peal pole kollane üleval. 1 või 3 = ükski 3x3 algoritm ei sobi, tee kõigepealt see.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>kaks parempoolset kihti korraga<\/b> (lai pööre), Lw = kaks vasakpoolset kihti korraga. Paljudel lehtedel kirjutatakse seda väikese tähega r ja l.","U2 and F2 turn only the outer top and front layer, twice.":"U2 ja F2 keeravad ainult välimist pealmist ja eesmist kihti, kaks korda.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"Eesmine serv pöördub ümber. Mõni muu pealmine tükk liigub ka: see pole hullu, sinu tavaline 3x3 OLL ja PLL parandavad need.","4x4 · 3 · PLL parity":"4x4 · 3 · PLL paarsus","Two edges swapped":"Kaks serva vahetuses","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"Ka see juhtub ainult 4x4 puhul: päris lõpus on kaks vastasolevat pealmist serva kohad vahetanud. See vahetab need tagasi.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Kõik on lahendatud peale <b>eesmise<\/b> ja <b>tagumise<\/b> pealmise serva, mis on <b>kohad vahetanud<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = kaks pealmist kihti kaks korda. Rw2 = kaks parempoolset kihti kaks korda. r2 = ainult teine kiht paremalt, kaks korda.","Only these two edges change. Everything else stays where it is.":"Muutuvad ainult need kaks serva. Kõik muu jääb oma kohale.","Mirror cube · last layer":"Mirror cube · viimane kiht","Three corners (A-perm)":"Kolm nurka (A-perm)","Moves three top corners around. Everything else stays where it is.":"Liigutab kolme pealmist nurka ringiratast. Kõik muu jääb oma kohale.","Beginner 3x3":"Algaja 3x3","Beginner":"Algaja","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"Klassikaline algaja meetod. Hoia kuubikut nii, et <b>kollane on üleval<\/b> ja <b>roheline sinu poole<\/b>:\n       kõigepealt lahendad all valge, viimasena üleval kollase. Klõpsa sammul, et näha, kuidas see liigub.","Intermediate 3x3":"Keskmine 3x3","Intermediate":"Keskmine","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"Järgmine tase: valge rist nagu enne, siis <b>F2L<\/b> (nurk ja serv koos),\n       <b>2-look OLL<\/b> (kogu pealmine külg kollaseks) ja <b>2-look PLL<\/b> (kõik oma kohale). Sama haare: kollane üleval, roheline sinu poole.","Advanced F2L (3x3)":"Edasijõudnu F2L (3x3)","Advanced F2L":"Edasijõudnu F2L","Advanced OLL (3x3)":"Edasijõudnu OLL (3x3)","Advanced OLL":"Edasijõudnu OLL","Advanced PLL (3x3)":"Edasijõudnu PLL (3x3)","Advanced PLL":"Edasijõudnu PLL","2x2 Beginner":"2x2 algaja","2x2 Intermediate":"2x2 keskmine","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"Valge kiht nagu algaja meetodis. Siis teevad <b>3 algoritmi<\/b> kogu pealmise külje kollaseks ja <b>2 algoritmi<\/b> panevad nurgad oma kohale.","2x2 Advanced":"2x2 edasijõudnu","Advanced":"Edasijõudnu","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"<b>Ortega<\/b> meetod. Kõigepealt tee <b>valge külg<\/b> alla (küljed ei pea veel sobima). Siis keerab üks <b>7 algoritmist<\/b> kõik kollased üles ja üks <b>6 algoritmist<\/b> parandab mõlemad kihid korraga.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Keerdpusled ja suured kuubikud","push it up, away from you":"lükka see üles, endast eemale","pull it down, toward you":"tõmba see alla, enda poole","swing it to the left":"keera see vasakule","swing it to the right":"keera see paremale","turn it clockwise, like a clock":"keera see päripäeva, nagu kella osuti","turn it anticlockwise":"keera see vastupäeva","push them up, away from you":"lükka need üles, endast eemale","pull them down, toward you":"tõmba need alla, enda poole","turn them clockwise, like a clock":"keera need päripäeva, nagu kella osuti","turn them anticlockwise":"keera need vastupäeva","swing them to the right":"keera need paremale","swing them to the left":"keera need vasakule","clockwise as seen from behind":"päripäeva, kui vaatad tagant","anticlockwise as seen from behind":"vastupäeva, kui vaatad tagant","swing it to the right (like D)":"keera see paremale (nagu D)","turn it clockwise, like F":"keera see päripäeva, nagu F","tip it so the front comes to the top":"kalluta nii, et esikülg tuleb üles","tip it so the top comes to the front":"kalluta nii, et pealmine külg tuleb ette","roll it to the right, like F":"veereta paremale, nagu F","roll it to the left":"veereta vasakule","pull it down, toward you (like L)":"tõmba see alla, enda poole (nagu L)","turn it so the right side faces you":"pööra nii, et parem külg on sinu poole","turn it so the left side faces you":"pööra nii, et vasak külg on sinu poole","Right face":"Parem külg","Left face":"Vasak külg","Top face":"Pealmine külg","Bottom face":"Alumine külg","Front face":"Esikülg","Back face":"Tagakülg","Whole cube":"Terve kuubik","Right two layers":"Parempoolsed kaks kihti","Left two layers":"Vasakpoolsed kaks kihti","Front two layers":"Eesmised kaks kihti","Bottom two layers":"Alumised kaks kihti","Top two layers":"Pealmised kaks kihti","Back two layers":"Tagumised kaks kihti","Middle slice":"Keskmine püstine kiht","Middle layer":"Keskmine rõhtne kiht","Front-back middle slice":"Keskmine kiht eest taha","Only the centre layer next to the right (slice move, the right layer stays still)":"Ainult keskmine kiht parema külje kõrval (keskkihi pööre, parem kiht ei liigu)","Only the centre layer next to the left (slice move, the left layer stays still)":"Ainult keskmine kiht vasaku külje kõrval (keskkihi pööre, vasak kiht ei liigu)","Only the centre layer next to the top (slice move, the top layer stays still)":"Ainult keskmine kiht pealmise külje kõrval (keskkihi pööre, pealmine kiht ei liigu)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Ainult keskmine kiht alumise külje kõrval (keskkihi pööre, alumine kiht ei liigu)","Only the centre layer next to the front (slice move, the front layer stays still)":"Ainult keskmine kiht esikülje kõrval (keskkihi pööre, eesmine kiht ei liigu)","Only the centre layer next to the back (slice move, the back layer stays still)":"Ainult keskmine kiht tagakülje kõrval (keskkihi pööre, tagumine kiht ei liigu)","Top corner with its layer":"Ülemine nurk koos oma kihiga","Top tip only":"Ainult ülemine tipp","Left corner with its layer":"Vasak nurk koos oma kihiga","Left tip only":"Ainult vasak tipp","Right corner with its layer":"Parem nurk koos oma kihiga","Right tip only":"Ainult parem tipp","Back corner with its layer":"Tagumine nurk koos oma kihiga","Back tip only":"Ainult tagumine tipp","turn it clockwise, as you look at that corner":"keera päripäeva, kui vaatad seda nurka","turn it anticlockwise, as you look at that corner":"keera vastupäeva, kui vaatad seda nurka","{what}: half a turn (turn it twice)":"{what}: pool pööret (keera kaks korda)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: kolm pööret, lõpp on sama mis {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"Inglise (UK)","English (US)":"Inglise (USA)","Arabic":"Araabia","Chinese":"Hiina","French":"Prantsuse","German":"Saksa","Hindi":"Hindi","Korean":"Korea","Portuguese":"Portugali","Russian":"Vene","Spanish":"Hispaania"},"es":{"Cube Algorithms":"Algoritmos del cubo","Settings":"Ajustes","Grip: yellow on top, green facing you":"Agarre: amarillo arriba, verde hacia ti","Light":"Claro","Dark":"Oscuro","Switch to light mode":"Cambiar a modo claro","Switch to dark mode":"Cambiar a modo oscuro","Top layer at the start":"Capa de arriba al principio","Algorithms":"Algoritmos","Turn the cube back":"Gira el cubo de vuelta","All {name} steps":"Todos los pasos de {name}","Step back":"Atrás","Play":"Reproducir","Step":"Paso","Reset":"Reiniciar","Reset view":"Reiniciar vista","Play {n}× (back to start!)":"Reproducir {n}× (¡vuelve al inicio!)","Speed":"Velocidad","Drag or swipe the cube to turn it around.":"Arrastra o desliza el cubo para girarlo y verlo por todos lados.","Start":"Inicio","solved":"resuelto","before":"antes","End":"Fin","Step {n}":"Paso {n}","after {label}":"después de {label}","Round {r} of {n}: {mv}":"Ronda {r} de {n}: {mv}","{n} rounds later... back exactly where we started!":"{n} rondas después... ¡justo donde empezamos!","Undo {mv}":"Deshacer {mv}","Press Play, or Step through one turn at a time.":"Pulsa Reproducir, o usa Paso para ir giro a giro.","Done! Try Play 6x: the cube comes back to the start.":"¡Hecho! Prueba Reproducir 6x: el cubo vuelve al inicio.","Done! That is what this step fixes.":"¡Hecho! Esto es lo que arregla este paso.","{i} of {n} turns done. Next: {mv}.":"{i} de {n} giros hechos. Siguiente: {mv}.","Languages":"Idiomas","Estonian":"Estonio","<b>r<\/b> right two layers":"<b>r<\/b> las dos capas de la derecha","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> capa del medio, se gira como L","<b>d<\/b> bottom two layers":"<b>d<\/b> las dos capas de abajo","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = haz el paréntesis 3 veces","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> las dos capas de la derecha juntas","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> las dos capas de arriba juntas","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> solo la segunda capa desde la derecha / izquierda / arriba (capa interior, la del centro)","<b>M<\/b> middle slice, like L":"<b>M<\/b> capa del medio, como L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> vuelca / rueda el cubo entero","<b>y<\/b> turn the whole cube":"<b>y<\/b> gira el cubo entero","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> las dos capas de abajo / arriba","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> dos capas a la vez","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> capa del medio entre delante y detrás, como F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> vuelca el cubo entero, como R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = haz el paréntesis dos veces","<b>U<\/b> top corner":"<b>U<\/b> esquina de arriba","<b>L<\/b> front-left corner":"<b>L<\/b> esquina delantera izquierda","<b>R<\/b> front-right corner":"<b>R<\/b> esquina delantera derecha","<b>B<\/b> back corner":"<b>B<\/b> esquina de atrás","capital = the corner with its whole layer":"mayúscula = la esquina con toda su capa","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = solo la punta","<b>'<\/b> = the other way":"<b>'<\/b> = en el otro sentido","plain letter = clockwise as you look at that corner":"letra sola = sentido horario mirando a esa esquina","<b>R<\/b> right":"<b>R<\/b> derecha","<b>L<\/b> left":"<b>L<\/b> izquierda","<b>U<\/b> top":"<b>U<\/b> arriba","<b>D<\/b> bottom":"<b>D<\/b> abajo","<b>F<\/b> front":"<b>F<\/b> delante","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> gira el cubo entero, la cara derecha pasa al frente","<b>2<\/b> = twice":"<b>2<\/b> = dos veces","<b>3<\/b> = three times":"<b>3<\/b> = tres veces","plain letter = clockwise as you look at that face":"letra sola = sentido horario mirando a esa cara","Step 0 · the basic move":"Paso 0 · el movimiento básico","The Righty Move":"El movimiento Righty","Learn this first. Steps 2 and 3 are built from it.":"Apréndelo primero. Los pasos 2 y 3 se basan en él.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Sujeta el cubo como quieras. Hazlo <b>6 veces<\/b> y el cubo vuelve al inicio.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Dilo en voz alta mientras giras: «derecha arriba, arriba izquierda, derecha abajo, arriba derecha».","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"Tu mano derecha hace los cuatro giros. El pulgar delante, el índice empuja la cara de arriba.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Seis repeticiones se deshacen solas. Es un buen truco para enseñar, y demuestra que las fórmulas no son magia.","Step 0 · the mirror move":"Paso 0 · el movimiento espejo","The Lefty Move":"El movimiento Lefty","Righty in a mirror, for the left hand. Same job on the left side.":"Righty en un espejo, para la mano izquierda. Hace lo mismo en el lado izquierdo.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Sujeta el cubo como quieras. La mano izquierda hace los cuatro giros. Seis veces y vuelve al inicio.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Cada letra está en espejo: R pasa a ser L, y cada giro va en el otro sentido.","Use it in step 2 when the white corner sits above the front-left slot.":"Úsalo en el paso 2 cuando la esquina blanca esté encima del hueco delantero izquierdo.","Kids often find this one easier: the left index finger flicks the top toward you.":"A muchos niños este les resulta más fácil: el índice izquierdo empuja la cara de arriba hacia ti.","Step 1a · white cross":"Paso 1a · cruz blanca","Edge on top, white facing up":"Arista arriba, blanco hacia arriba","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"El caso más fácil de la cruz. Gira la cara de arriba hasta que la arista quede encima de su sitio y luego gira esa cara dos veces.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Blanco abajo<\/b>. Una arista blanca está en la capa de arriba con la pegatina blanca <b>hacia arriba<\/b>. Gira la cara de arriba hasta que su otro color quede sobre el centro del mismo color, aquí verde sobre verde, y luego gira esa cara dos veces.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Fíjate en el color lateral de la arista, no en el blanco. Te dice qué cara girar.","Grey pieces do not matter yet. Corners come in step 2.":"Las piezas grises aún no importan. Las esquinas llegan en el paso 2.","Do this for all four edges. Most of the cross is just this move.":"Haz esto con las cuatro aristas. Casi toda la cruz es solo este movimiento.","Step 1b · white cross":"Paso 1b · cruz blanca","Edge on top, white facing sideways":"Arista arriba, blanco hacia un lado","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Una arista blanca en la capa de arriba con el blanco hacia ti. La baja a la capa de abajo bien orientada.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Blanco abajo. La arista está <b>arriba delante<\/b> con la pegatina blanca <b>hacia ti<\/b>. Su otro color (arriba) es <b>del mismo color que el centro de delante<\/b>, aquí verde. Si no, gira la cara de arriba hasta que lo sea.","The other cross edges are not disturbed.":"Las demás aristas de la cruz no se mueven.","Same ending as 1c: the last three turns tuck the edge in from the left.":"Termina igual que el 1c: los tres últimos giros meten la arista desde la izquierda.","Step 1c · white cross":"Paso 1c · cruz blanca","Edge in the bottom, flipped":"Arista abajo, volteada","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Una arista blanca que ya está abajo, pero al revés. La voltea sin sacarla de su sitio.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Blanco abajo<\/b>, amarillo arriba. La arista al revés está <b>abajo delante<\/b>, con la pegatina blanca hacia ti. Las demás aristas de la cruz se quedan donde están.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"Objetivo del paso 1: una cruz blanca abajo, y el color lateral de cada arista coincide con el centro de al lado.","Grey pieces do not matter yet. Only look at the white ones.":"Las piezas grises aún no importan. Fíjate solo en las blancas.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"¿Arista en la capa de arriba? Gira la cara de arriba hasta que quede encima de su sitio y luego gira esa cara dos veces.","Step 2a · white corners":"Paso 2a · esquinas blancas","Corner above its slot, white facing right":"Esquina encima de su hueco, blanco hacia la derecha","The quick case. Three turns and the corner drops in.":"El caso rápido. Tres giros y la esquina entra.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Blanco abajo. La esquina blanca está en la <b>capa de arriba, justo encima<\/b> de su hueco <b>delante a la derecha<\/b>, con la pegatina blanca <b>hacia la derecha<\/b>. Sus otros dos colores coinciden con los centros de delante y de la derecha.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"Es Righty sin el último giro. Un Righty entero también sirve, el giro de arriba de más no cambia nada aquí.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"¿Todavía no está encima de su hueco? Gira la capa de arriba hasta que lo esté. Una esquina va donde sus dos colores laterales coinciden con los centros.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"¿La esquina ya está en el hueco pero girada? Haz un Righty para sacarla y empieza otra vez.","Step 2b · white corners":"Paso 2b · esquinas blancas","Corner above its slot, white facing you":"Esquina encima de su hueco, blanco hacia ti","Same corner, white pointing at you. Use the front face instead of the right.":"La misma esquina, con el blanco hacia ti. Usa la cara de delante en vez de la derecha.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Blanco abajo. La esquina blanca está en la <b>capa de arriba, encima<\/b> de su hueco <b>delante a la derecha<\/b>, con la pegatina blanca <b>hacia ti<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Piensa en espejo: blanco a la derecha, usa R. Blanco delante, usa F.","Righty five times also does it, but this is three turns instead of twenty.":"Cinco Righty también sirven, pero así son tres giros en vez de veinte.","Step 2c · white corners":"Paso 2c · esquinas blancas","Corner above its slot, white facing up":"Esquina encima de su hueco, blanco hacia arriba","The slow case: white points at the ceiling. Righty three times.":"El caso lento: el blanco apunta al techo. Tres veces Righty.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Blanco abajo. La esquina blanca está en la <b>capa de arriba, encima<\/b> de su hueco <b>delante a la derecha<\/b>, con la pegatina blanca <b>hacia arriba<\/b>. Haz Righty hasta que el blanco mire hacia abajo. Aquí hacen falta tres rondas.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Mira la esquina después de cada Righty: tras uno está en el hueco pero girada, tras dos vuelve arriba con el blanco hacia la derecha, tras tres ya está dentro.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Cualquier caso de esquina sale solo con Righty: 1, 3 o 5 rondas. Las tarjetas 2a y 2b son solo atajos.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"Sus dos colores laterales tienen que coincidir con los centros de al lado. Si no, gira primero la capa de arriba.","Step 3a · middle layer":"Paso 3a · capa del medio","Edge goes right":"La arista va a la derecha","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Baja una arista de la capa de arriba al hueco delantero derecho. U R U R' U', gira el cubo entero para que la cara derecha quede hacia ti, y luego L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Blanco hecho, abajo. Busca una arista de arriba <b>sin amarillo<\/b>. Gira la cara de arriba para que su color de delante coincida con el centro de delante. Si su color de arriba coincide con el centro de la <b>derecha<\/b>, usa esto.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Dos trozos: «U R U R' U'», luego gira el cubo entero (y) para que la cara derecha quede hacia ti, y luego «L' U' L».","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Gira el cubo en el sentido correcto: la antigua cara derecha tiene que acabar hacia ti. Al revés rompes la capa blanca.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Ahora miras una cara de delante nueva. No pasa nada, busca la siguiente arista desde ahí.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"¿Hay una arista equivocada en el hueco? Mete cualquier otra arista con esta fórmula para sacarla.","Grey pieces are the yellow ones. They do not matter until step 4.":"Las piezas grises son las amarillas. No importan hasta el paso 4.","Step 3b · middle layer":"Paso 3b · capa del medio","Edge goes left":"La arista va a la izquierda","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"El espejo del 3a: baja la arista al hueco delantero izquierdo. U' L' U' L U, gira el cubo entero para que la cara izquierda quede hacia ti, y luego R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Igual que el 3a, pero el color de arriba de la arista coincide con el centro de la <b>izquierda<\/b>.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Dos trozos: «U' L' U' L U», luego gira el cubo entero (y') para que la cara izquierda quede hacia ti, y luego «R U R'».","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"Es el 3a en un espejo: R pasa a ser L, cada giro va en el otro sentido, y el cubo gira hacia la izquierda en vez de hacia la derecha.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Gira el cubo en el sentido correcto: la antigua cara izquierda tiene que acabar hacia ti. Al revés rompes la capa blanca.","Once all four middle edges are in, the bottom two layers are done.":"Cuando las cuatro aristas del medio estén colocadas, las dos capas de abajo están hechas.","Step 4a · yellow cross":"Paso 4a · cruz amarilla","Yellow cross from a line":"Cruz amarilla desde una línea","Turns a yellow line on top into a yellow plus.":"Convierte una línea amarilla de arriba en una cruz amarilla.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"Las dos capas de abajo hechas. Línea amarilla arriba, colocada <b>de izquierda a derecha<\/b>. ¿Solo un punto amarillo? Haz esto una vez, te sale una L, y luego usa el 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"Es Righty envuelto entre F y F'. La parte del medio ya la conoces.","Ignore the yellow corners for now. Only the plus matters.":"De momento olvídate de las esquinas amarillas. Solo importa la cruz.","Step 4b · yellow cross":"Paso 4b · cruz amarilla","Yellow cross from an L":"Cruz amarilla desde una L","Turns a yellow L shape on top into a yellow plus.":"Convierte una L amarilla de arriba en una cruz amarilla.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"L amarilla arriba, con sus dos brazos apuntando <b>atrás y a la izquierda<\/b> (como las 9 y las 12 en un reloj).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Casi igual que el 4a, solo que el medio es «U R U' R'» en vez de «R U R' U'».","If the L points the wrong way, turn only the top layer until it fits.":"Si la L apunta mal, gira solo la capa de arriba hasta que encaje.","Step 5 · yellow edges":"Paso 5 · aristas amarillas","Yellow edges into place (Sune)":"Aristas amarillas a su sitio (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Pon las dos aristas que coinciden <b>atrás y a la derecha<\/b>, haz el Sune y luego un giro U. Las cuatro aristas amarillas coinciden ya con sus centros.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Gira la cara de arriba hasta que <b>dos aristas<\/b> coincidan con sus centros. Si están juntas: ponlas <b>atrás y a la derecha<\/b>, haz el Sune y luego <b>U<\/b> una vez. Si están enfrente una de otra: ponlas <b>delante y atrás<\/b> y haz el Sune una vez. Ahora coinciden dos juntas, así que haz el primer caso.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"El giro final es U (la cara amarilla de arriba), no D. Girar la de abajo rompería las capas blancas.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Caso enfrentadas: tras un Sune, la pareja que coincide queda delante y a la derecha. Gira el cubo entero para que quede atrás y a la derecha, y luego Sune y U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Las esquinas amarillas se van a girar. No pasa nada, los pasos 6 y 7 lo arreglan.","Step 6 · yellow corners":"Paso 6 · esquinas amarillas","Yellow corners into place (Niklas)":"Esquinas amarillas a su sitio (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"El Niklas. Mueve tres esquinas en círculo para que cada esquina quede entre sus propios colores. Que estén giradas aún no importa.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Busca una esquina que ya esté <b>entre sus colores<\/b> (girada no importa) y ponla <b>delante a la izquierda<\/b>. ¿Ninguna está bien? Hazlo una vez desde cualquier posición y vuelve a mirar.","The front-left corner stays put, the other three cycle around.":"La esquina delantera izquierda no se mueve, las otras tres dan la vuelta.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"No olvides la última U. Sin ella, la cara de arriba queda un giro desplazada y las aristas amarillas del paso 5 ya no coinciden.","Might need two rounds. Keep the same corner at front left.":"Puede que hagan falta dos rondas. Deja la misma esquina delante a la izquierda.","Step 7 · finish":"Paso 7 · final","Twist the yellow corners":"Gira las esquinas amarillas","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Solo el movimiento Righty. Amarillo abajo, esquina girada abajo delante a la derecha. Amarillo hacia un lado: Righty 2 veces. Amarillo hacia ti: Righty 4 veces. Luego gira la capa de abajo (D) hasta la siguiente esquina.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Da la vuelta al cubo: amarillo abajo<\/b>, el verde sigue hacia ti. Pon una esquina girada <b>abajo delante a la derecha<\/b> y mira hacia dónde apunta su pegatina amarilla:<ul class=\"rule\"><li>Amarillo hacia <b>un lado<\/b> (derecha) &rarr; Righty <b>2 veces<\/b><\/li><li>Amarillo hacia <b>ti<\/b> &rarr; Righty <b>4 veces<\/b><\/li><li>Amarillo hacia <b>abajo<\/b> &rarr; esta esquina está hecha<\/li><\/ul>Luego gira <b>solo la capa de abajo (D)<\/b> para llevar la siguiente esquina girada abajo delante a la derecha. Nunca gires el cubo entero.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"Este ejemplo gira dos esquinas: la primera tiene el amarillo hacia un lado (Righty 2 veces), la segunda tiene el amarillo hacia ti (Righty 4 veces).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"¿No lo tienes claro? Sigue haciendo Righty y mira la esquina cada 2. Nunca son más de 4.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"A mitad de camino, las dos capas de arriba parecen desordenadas. No te asustes y no las arregles. Vuelven a su sitio cuando terminas la última esquina.","Finish with a bottom turn to line up the yellow layer. Solved!":"Termina con un giro de la capa de abajo para alinear la capa amarilla. ¡Resuelto!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · inserción básica 1","Corner white right, edge at the back":"Esquina con blanco a la derecha, arista atrás","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"La esquina y la arista entran juntas en el hueco de una vez, en lugar de primero la esquina y luego la arista.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Esquina encima del hueco <b>delantero derecho<\/b> con el blanco <b>hacia la derecha<\/b>. Su arista está <b>arriba atrás<\/b> con el verde arriba.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = las dos primeras capas (First 2 Layers). Formas una esquina blanca y su arista del medio juntas, y luego las metes como un par.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"Primero emparéjalas tú: gira la cara de arriba hasta que la esquina y la arista queden como en el dibujo.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Empieza con la cruz blanca como antes y luego usa F2L en vez de los pasos 2 y 3 de principiante.","F2L · basic insert 2":"F2L · inserción básica 2","Corner white facing you, edge on the left":"Esquina con blanco hacia ti, arista a la izquierda","Mirror of insert 1, using the front face.":"El espejo de la inserción 1, con la cara de delante.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Esquina encima del hueco <b>delantero derecho<\/b> con el blanco <b>hacia ti<\/b>. Su arista está <b>arriba a la izquierda<\/b> con el naranja arriba.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Igual que la inserción 1 en un espejo: el blanco mira hacia ti en vez de a la derecha, así que usa F en vez de R.","F2L · basic insert 3":"F2L · inserción básica 3","Corner and edge side by side (right)":"Esquina y arista juntas (derecha)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"La esquina y la arista están una al lado de la otra en la capa de arriba. U las alinea y luego entran juntas.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Esquina encima del hueco <b>delantero derecho<\/b> con el blanco <b>hacia ti<\/b> y el verde arriba. Su arista está <b>arriba a la derecha<\/b> con el verde arriba.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"La primera U une la esquina y la arista en un bloque. Luego R U' R' mete el bloque.","F2L · basic insert 4":"F2L · inserción básica 4","Corner and edge side by side (front)":"Esquina y arista juntas (delante)","Mirror of insert 3, using the front face.":"El espejo de la inserción 3, con la cara de delante.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Esquina encima del hueco <b>delantero derecho<\/b> con el blanco <b>hacia la derecha<\/b> y el verde hacia ti. Su arista está <b>arriba delante<\/b> con el verde hacia ti.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"El espejo de la inserción 3: R pasa a ser F', R' pasa a ser F, y cada U gira en el otro sentido.","F2L · make a block":"F2L · formar un bloque","Join corner and edge into a block":"Une la esquina y la arista en un bloque","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Con el blanco hacia arriba no puede entrar directamente. Primero une la esquina y su arista en un bloque y luego mete el bloque.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Esquina encima del hueco <b>delantero derecho<\/b> con el blanco <b>hacia arriba<\/b>. Su arista está <b>arriba atrás<\/b> con el verde arriba. <b>U R U2 R'<\/b> las une en un bloque, <b>U R U' R'<\/b> mete el bloque.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Mira la tira de abajo: tras la primera mitad, la esquina y la arista quedan juntas con los colores a juego. Eso es el bloque.","The second half is basic insert 3. You already know it.":"La segunda mitad es la inserción básica 3. Ya la conoces.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"Esta es la idea principal del F2L: forma un bloque en la capa de arriba y luego mételo. Casi todos los casos de F2L funcionan así.","Block made":"Bloque formado","Block in":"Bloque dentro","OLL 1 · yellow cross":"OLL 1 · cruz amarilla","Dot: make a line or an L":"Punto: haz una línea o una L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Solo el centro amarillo y las dos esquinas de atrás son amarillos. Ninguna arista amarilla. Haz la fórmula de la línea o de la L, y aparece una línea o una L.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Amarillo arriba: solo el <b>centro<\/b>, la esquina de <b>arriba a la izquierda<\/b> y la de <b>arriba a la derecha<\/b> son amarillos, ninguna arista.<ul class=\"rule\"><li>Fórmula de la línea <b>F R U R' U' F'<\/b> &rarr; aparece una <b>L<\/b><\/li><li>Fórmula de la L <b>F U R U' R' F'<\/b> &rarr; aparece una <b>línea<\/b><\/li><\/ul>Luego termina la cruz con la tarjeta de <b>Línea<\/b> o de <b>Forma de L<\/b> de abajo.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"¡Hecho! Ha aparecido una L. Gira la cara de arriba para que sus brazos apunten atrás y a la izquierda, y luego haz la fórmula de la L.","The animation does the line formula. The L appears with its arms at the front and right.":"La animación hace la fórmula de la línea. La L aparece con los brazos delante y a la derecha.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Para la fórmula de la L, los brazos tienen que apuntar atrás y a la izquierda, así que primero gira la cara de arriba dos veces (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"¿Te ha salido una línea? Ponla de izquierda a derecha y haz la fórmula de la línea otra vez.","Corners do not matter yet. They get fixed in OLL 2.":"Las esquinas aún no importan. Se arreglan en el OLL 2.","Line":"Línea","Yellow line on top becomes a yellow cross.":"La línea amarilla de arriba se convierte en una cruz amarilla.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Línea amarilla arriba, colocada <b>de izquierda a derecha<\/b>. ¿La línea va de delante a atrás? Gira primero la cara de arriba una vez (U).","L shape":"Forma de L","Yellow L on top becomes a yellow cross.":"La L amarilla de arriba se convierte en una cruz amarilla.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"L amarilla arriba, con sus brazos apuntando <b>atrás y a la izquierda<\/b> (como las 9 y las 12 en un reloj). ¿Apunta a otro sitio? Gira solo la cara de arriba hasta que encaje.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Casi igual que la fórmula de la línea, solo que el medio es «U R U' R'» en vez de «R U R' U'».","OLL 2 · yellow corners":"OLL 2 · esquinas amarillas","Sune":"Sune","One yellow corner up. Looks like a fish.":"Una esquina amarilla hacia arriba. Parece un pez.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Cruz amarilla hecha. La única esquina con amarillo arriba está <b>delante a la izquierda<\/b>. La esquina delantera derecha muestra el amarillo <b>hacia ti<\/b>.","You already know this one from beginner step 5.":"Este ya lo conoces del paso 5 de principiante.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Una esquina amarilla hacia arriba, el pez al revés. Es el Sune hacia atrás.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"La única esquina con amarillo arriba está <b>atrás a la derecha<\/b>. La esquina delantera izquierda muestra el amarillo <b>hacia ti<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"Es el Sune hacia atrás: lee el Sune desde el final, cada giro en el otro sentido.","H (double headlights)":"H (dobles faros)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Ninguna esquina con amarillo arriba. Dos parejas de amarillo mirando hacia fuera en lados opuestos.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Parejas amarillas en las caras <b>izquierda<\/b> y <b>derecha<\/b>.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Empieza como el Sune, con un «R U' R' U» de más en el medio.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Ninguna esquina con amarillo arriba. Una pareja amarilla en un lado, las otras dos esquinas miran en direcciones opuestas.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"La pareja amarilla (faros) a la <b>izquierda<\/b>. A la derecha, un amarillo mira hacia ti y otro hacia atrás.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = gira la cara derecha dos veces. Mantén el ritmo: R2 U' R2 U' R2.","Headlights":"Faros","Two yellow corners up next to each other, the other two look at you like headlights.":"Dos esquinas con amarillo arriba una al lado de la otra; las otras dos te miran como unos faros.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Las dos esquinas con amarillo arriba están <b>atrás<\/b>. Los faros <b>hacia ti<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"El giro D mueve la capa blanca un momento. D' la devuelve a su sitio.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Dos esquinas con amarillo arriba una al lado de la otra; las otras dos miran en direcciones opuestas.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Las dos esquinas con amarillo arriba están a la <b>derecha<\/b>. A la izquierda, un amarillo mira hacia ti y otro hacia atrás.","Small r = turn the right face together with the middle slice.":"r minúscula = gira la cara derecha junto con la capa del medio.","Bowtie":"Pajarita","Two yellow corners up, diagonal from each other.":"Dos esquinas con amarillo arriba, en diagonal.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Esquinas con amarillo arriba <b>delante a la izquierda<\/b> y <b>atrás a la derecha<\/b>. La esquina delantera derecha muestra el amarillo <b>hacia ti<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"La parte del medio «r U R' U' r'» es la misma que en la T.","PLL 1 · corners":"PLL 1 · esquinas","Headlights: T-perm":"Faros: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Intercambia dos esquinas que están juntas. Úsalo cuando un lado ya tiene las dos esquinas del mismo color (faros).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Gira la cara de arriba hasta que un lado tenga <b>faros<\/b> (las dos esquinas del mismo color). Pon ese lado a la <b>izquierda<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"PLL en 2 pasos (2-look): primero coloca las esquinas (2 casos), luego las aristas (4 casos).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"También intercambia las aristas de la izquierda y la derecha. No pasa nada, el paso de aristas lo arregla.","Headlights on every side? Corners are done, go to the edges.":"¿Faros en todos los lados? Las esquinas están hechas, pasa a las aristas.","No headlights: Y-perm":"Sin faros: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Intercambia dos esquinas en diagonal. Úsalo cuando ningún lado tiene faros.","No headlights on any side. Hold it any way round.":"Ningún lado tiene faros. Sujétalo en cualquier posición.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Son dos trozos tipo OLL seguidos. Apréndelo por mitades: «F R U' R' U' R U R' F'» y «R U R' U' R' F R F'».","PLL 2 · edges":"PLL 2 · aristas","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Bloque resuelto delante de ti. La arista de la <b>izquierda<\/b> tiene que ir a la <b>derecha<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Esquinas hechas. El lado resuelto (un bloque completo) <b>delante de ti<\/b>. La arista de la <b>izquierda<\/b> va a la <b>derecha<\/b>: va a la derecha, la de la derecha va atrás y la de atrás va a la izquierda.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"Después de la fórmula, toda la cara de arriba queda medio giro desplazada. La última U2 la alinea con los centros.","The front block never changes. Only the left, right and back edges go round.":"El bloque de delante nunca cambia. Solo dan la vuelta las aristas de la izquierda, la derecha y atrás.","Right edge needs to go left instead? That is the Ub-perm.":"¿La arista de la derecha tiene que ir a la izquierda? Eso es el Ub-perm.","Lined up":"Alineado","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Bloque resuelto delante de ti. La arista de la <b>derecha<\/b> tiene que ir a la <b>izquierda<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Esquinas hechas. El bloque resuelto <b>delante de ti<\/b>. La arista de la <b>derecha<\/b> va a la <b>izquierda<\/b>: va a la izquierda, la de la izquierda va atrás y la de atrás va a la derecha.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = gira la cara derecha tres veces. Acaba igual que R', pero los tres giros rápidos mantienen tu ritmo.","The front block never moves. Only the left, right and back edges go round.":"El bloque de delante nunca se mueve. Solo dan la vuelta las aristas de la izquierda, la derecha y atrás.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Intercambia aristas opuestas: delante con atrás, izquierda con derecha.","Corners done, every edge is opposite its centre. Any way round.":"Esquinas hechas, cada arista está enfrente de su centro. En cualquier posición.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = la capa del medio entre L y R, se gira como L. M2 = dos veces.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Intercambia aristas que están juntas: delante con derecha, atrás con izquierda.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Esquinas hechas. Las parejas intercambiadas <b>delante a la derecha<\/b> y <b>atrás a la izquierda<\/b>.","The last U lines the top back up with the centres.":"La última U vuelve a alinear la cara de arriba con los centros.","F2L 1":"F2L 1","Case 1":"Caso 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Esquina en el hueco, blanco hacia abajo. La arista en el hueco, volteada.","F2L 2":"F2L 2","Case 2":"Caso 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"Esquina en el hueco, blanco hacia abajo. La arista arriba delante, verde hacia fuera.","F2L 3":"F2L 3","Case 3":"Caso 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"Esquina en el hueco, blanco hacia abajo. La arista arriba a la derecha, verde arriba.","F2L 4":"F2L 4","Case 4":"Caso 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"Esquina en el hueco, blanco hacia ti. La arista en el hueco, bien orientada.","F2L 5":"F2L 5","Case 5":"Caso 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"Esquina en el hueco, blanco hacia ti. La arista en el hueco, volteada.","F2L 6":"F2L 6","Case 6":"Caso 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"Esquina en el hueco, blanco hacia ti. La arista arriba delante, verde hacia fuera.","F2L 7":"F2L 7","Case 7":"Caso 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"Esquina en el hueco, blanco hacia ti. La arista arriba a la derecha, verde arriba.","F2L 8":"F2L 8","Case 8":"Caso 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"Esquina en el hueco, blanco hacia la derecha. La arista en el hueco, bien orientada.","F2L 9":"F2L 9","Case 9":"Caso 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"Esquina en el hueco, blanco hacia la derecha. La arista en el hueco, volteada.","F2L 10":"F2L 10","Case 10":"Caso 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"Esquina en el hueco, blanco hacia la derecha. La arista arriba delante, verde hacia fuera.","F2L 11":"F2L 11","Case 11":"Caso 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"Esquina en el hueco, blanco hacia la derecha. La arista arriba a la derecha, verde arriba.","F2L 12":"F2L 12","Case 12":"Caso 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista en el hueco, bien orientada.","F2L 13":"F2L 13","Case 13":"Caso 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista en el hueco, volteada.","F2L 14":"F2L 14","Case 14":"Caso 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba delante, verde hacia fuera.","F2L 15":"F2L 15","Case 15":"Caso 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba a la izquierda, verde hacia fuera.","F2L 16":"F2L 16","Case 16":"Caso 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba atrás, verde hacia fuera.","F2L 17":"F2L 17","Case 17":"Caso 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba a la derecha, verde hacia fuera.","F2L 18":"F2L 18","Case 18":"Caso 18","Corner on top above the slot, white facing up. The edge on top at the front, green on top.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba delante, verde arriba.","F2L 19":"F2L 19","Case 19":"Caso 19","Corner on top above the slot, white facing up. The edge on top at the left, green on top.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba a la izquierda, verde arriba.","F2L 20":"F2L 20","Case 20":"Caso 20","Corner on top above the slot, white facing up. The edge on top at the back, green on top.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba atrás, verde arriba.","F2L 21":"F2L 21","Case 21":"Caso 21","Corner on top above the slot, white facing up. The edge on top at the right, green on top.":"Esquina arriba, encima del hueco, blanco hacia arriba. La arista arriba a la derecha, verde arriba.","F2L 22":"F2L 22","Case 22":"Caso 22","Corner on top above the slot, white facing you. The edge in the slot, the right way round.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista en el hueco, bien orientada.","F2L 23":"F2L 23","Case 23":"Caso 23","Corner on top above the slot, white facing you. The edge in the slot, flipped.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista en el hueco, volteada.","F2L 24":"F2L 24","Case 24":"Caso 24","Corner on top above the slot, white facing you. The edge on top at the front, green facing out.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba delante, verde hacia fuera.","F2L 25":"F2L 25","Case 25":"Caso 25","Corner on top above the slot, white facing you. The edge on top at the left, green facing out.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba a la izquierda, verde hacia fuera.","F2L 26":"F2L 26","Case 26":"Caso 26","Corner on top above the slot, white facing you. The edge on top at the back, green facing out.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba atrás, verde hacia fuera.","F2L 27":"F2L 27","Case 27":"Caso 27","Corner on top above the slot, white facing you. The edge on top at the right, green facing out.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba a la derecha, verde hacia fuera.","F2L 28":"F2L 28","Case 28":"Caso 28","Corner on top above the slot, white facing you. The edge on top at the front, green on top.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba delante, verde arriba.","F2L 29":"F2L 29","Case 29":"Caso 29","Corner on top above the slot, white facing you. The edge on top at the left, green on top.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba a la izquierda, verde arriba.","F2L 30":"F2L 30","Case 30":"Caso 30","Corner on top above the slot, white facing you. The edge on top at the back, green on top.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba atrás, verde arriba.","F2L 31":"F2L 31","Case 31":"Caso 31","Corner on top above the slot, white facing you. The edge on top at the right, green on top.":"Esquina arriba, encima del hueco, blanco hacia ti. La arista arriba a la derecha, verde arriba.","F2L 32":"F2L 32","Case 32":"Caso 32","Corner on top above the slot, white facing right. The edge in the slot, the right way round.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista en el hueco, bien orientada.","F2L 33":"F2L 33","Case 33":"Caso 33","Corner on top above the slot, white facing right. The edge in the slot, flipped.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista en el hueco, volteada.","F2L 34":"F2L 34","Case 34":"Caso 34","Corner on top above the slot, white facing right. The edge on top at the front, green facing out.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba delante, verde hacia fuera.","F2L 35":"F2L 35","Case 35":"Caso 35","Corner on top above the slot, white facing right. The edge on top at the left, green facing out.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba a la izquierda, verde hacia fuera.","F2L 36":"F2L 36","Case 36":"Caso 36","Corner on top above the slot, white facing right. The edge on top at the back, green facing out.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba atrás, verde hacia fuera.","F2L 37":"F2L 37","Case 37":"Caso 37","Corner on top above the slot, white facing right. The edge on top at the right, green facing out.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba a la derecha, verde hacia fuera.","F2L 38":"F2L 38","Case 38":"Caso 38","Corner on top above the slot, white facing right. The edge on top at the front, green on top.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba delante, verde arriba.","F2L 39":"F2L 39","Case 39":"Caso 39","Corner on top above the slot, white facing right. The edge on top at the left, green on top.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba a la izquierda, verde arriba.","F2L 40":"F2L 40","Case 40":"Caso 40","Corner on top above the slot, white facing right. The edge on top at the back, green on top.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba atrás, verde arriba.","F2L 41":"F2L 41","Case 41":"Caso 41","Corner on top above the slot, white facing right. The edge on top at the right, green on top.":"Esquina arriba, encima del hueco, blanco hacia la derecha. La arista arriba a la derecha, verde arriba.","OLL 1":"OLL 1","No yellow edges and no yellow corners on top.":"Ninguna arista amarilla y ninguna esquina amarilla arriba.","OLL 2":"OLL 2","OLL 3":"OLL 3","No yellow edges and 1 yellow corner on top.":"Ninguna arista amarilla y 1 esquina amarilla arriba.","OLL 4":"OLL 4","OLL 5":"OLL 5","2 yellow edges and 1 yellow corner on top.":"2 aristas amarillas y 1 esquina amarilla arriba.","OLL 6":"OLL 6","OLL 7":"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"Ninguna arista amarilla y 2 esquinas amarillas arriba.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"Ninguna arista amarilla y 4 esquinas amarillas arriba.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"4 aristas amarillas y ninguna esquina amarilla arriba.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"4 aristas amarillas y 2 esquinas amarillas arriba.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"4 aristas amarillas y 1 esquina amarilla arriba.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"2 aristas amarillas y 4 esquinas amarillas arriba.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"2 aristas amarillas y 2 esquinas amarillas arriba.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Caso 42","OLL 43":"OLL 43","Case 43":"Caso 43","OLL 44":"OLL 44","Case 44":"Caso 44","OLL 45":"OLL 45","Case 45":"Caso 45","OLL 46":"OLL 46","Case 46":"Caso 46","OLL 47":"OLL 47","Case 47":"Caso 47","2 yellow edges and no yellow corners on top.":"2 aristas amarillas y ninguna esquina amarilla arriba.","OLL 48":"OLL 48","Case 48":"Caso 48","OLL 49":"OLL 49","Case 49":"Caso 49","OLL 50":"OLL 50","Case 50":"Caso 50","OLL 51":"OLL 51","Case 51":"Caso 51","OLL 52":"OLL 52","Case 52":"Caso 52","OLL 53":"OLL 53","Case 53":"Caso 53","OLL 54":"OLL 54","Case 54":"Caso 54","OLL 55":"OLL 55","Case 55":"Caso 55","OLL 56":"OLL 56","Case 56":"Caso 56","OLL 57":"OLL 57","Case 57":"Caso 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Paso 1a · capa blanca","Corner above its spot, white facing right":"Esquina encima de su sitio, blanco hacia la derecha","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Igual que el paso 2a del 3x3. Tres giros y la esquina blanca entra.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Blanco abajo<\/b>. Un 2x2 no tiene centros: la <b>primera<\/b> esquina blanca puede ir en cualquier sitio. Cada esquina siguiente va donde sus colores laterales <b>coinciden con las esquinas blancas de al lado<\/b>. Aquí: la esquina está <b>encima de su sitio<\/b> delante a la derecha, con el blanco <b>hacia la derecha<\/b>.","Not above its spot yet? Turn the top until it is.":"¿Todavía no está encima de su sitio? Gira la cara de arriba hasta que lo esté.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"¿La esquina ya está abajo pero en el sitio equivocado o girada? Ponla delante a la derecha y haz un Righty para sacarla.","Righty once works here too.":"Un Righty entero también sirve aquí.","2x2 · Step 1b · white layer":"2x2 · Paso 1b · capa blanca","Corner above its spot, white facing you":"Esquina encima de su sitio, blanco hacia ti","Same as 3x3 step 2b: white facing you, so use the front face.":"Igual que el paso 2b del 3x3: el blanco mira hacia ti, así que usa la cara de delante.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Blanco abajo. La esquina blanca está <b>encima de su sitio<\/b> delante a la derecha, con el blanco <b>hacia ti<\/b>.","Righty five times also does it.":"Cinco Righty también sirven.","2x2 · Step 1c · white layer":"2x2 · Paso 1c · capa blanca","Corner above its spot, white facing up":"Esquina encima de su sitio, blanco hacia arriba","Same as 3x3 step 2c: Righty three times.":"Igual que el paso 2c del 3x3: tres veces Righty.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Blanco abajo. La esquina blanca está <b>encima de su sitio<\/b> delante a la derecha, con el blanco <b>hacia arriba<\/b>. Haz Righty hasta que el blanco mire hacia abajo.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Cualquier esquina blanca sale solo con Righty: 1, 3 o 5 veces.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Haz esto con las cuatro esquinas blancas. La capa blanca está hecha cuando los colores laterales de cada esquina blanca coinciden con los de al lado.","2x2 · Step 2 · yellow corners":"2x2 · Paso 2 · esquinas amarillas","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Igual que el paso 6 del 3x3. Mueve tres esquinas de arriba en círculo para que cada esquina quede encima de su esquina blanca. Que estén giradas aún no importa.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Capa blanca hecha, abajo. Una esquina de arriba está <b>en su sitio<\/b> cuando sus colores laterales coinciden con las esquinas blancas de debajo (girada no importa). Gira la cara de arriba hasta que <b>exactamente una<\/b> esquina esté en su sitio y ponla <b>delante a la izquierda<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"La esquina delantera izquierda no se mueve, las otras tres dan la vuelta. Puede que tengas que hacerlo dos veces.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"¿Ningún giro de la cara de arriba deja exactamente una esquina en su sitio? Hazlo una vez desde cualquier posición y vuelve a mirar. En un 2x2 puede pasar, en un 3x3 nunca.","All four in place? Go to step 3.":"¿Las cuatro en su sitio? Pasa al paso 3.","2x2 · Step 3 · finish":"2x2 · Paso 3 · final","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Igual que el paso 7 del 3x3. Amarillo abajo, esquina girada abajo delante a la derecha. Amarillo hacia un lado: Righty 2 veces. Amarillo hacia ti: Righty 4 veces. Luego gira la capa de abajo (D) hasta la siguiente esquina.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Da la vuelta al cubo: amarillo abajo.<\/b> Pon una esquina girada <b>abajo delante a la derecha<\/b> y mira hacia dónde apunta su pegatina amarilla:<ul class=\"rule\"><li>Amarillo hacia <b>un lado<\/b> (derecha) &rarr; Righty <b>2 veces<\/b><\/li><li>Amarillo hacia <b>ti<\/b> &rarr; Righty <b>4 veces<\/b><\/li><li>Amarillo hacia <b>abajo<\/b> &rarr; esta esquina está hecha<\/li><\/ul>Luego gira <b>solo la capa de abajo (D)<\/b> para llevar ahí la siguiente esquina girada. Nunca gires el cubo entero.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"A mitad de camino, la capa blanca parece desordenada. Sigue, vuelve a su sitio cuando terminas la última esquina.","At the end, turn one layer until the two layers line up. Solved!":"Al final, gira una capa hasta que las dos capas queden alineadas. ¡Resuelto!","2x2 · Orientation 1 of 3":"2x2 · Orientación 1/3","Sune: one yellow corner up":"Sune: una esquina amarilla hacia arriba","One yellow corner up. Makes the top yellow, or another case you then fix.":"Una esquina amarilla hacia arriba. Deja la cara de arriba amarilla, o te da otro caso que luego resuelves.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Capa blanca hecha, abajo. Pon la esquina con amarillo arriba <b>delante a la izquierda<\/b>. La esquina delantera derecha muestra el amarillo <b>hacia ti<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"¿Dos esquinas amarillas hacia arriba? Sujeta el cubo de forma que la esquina delantera izquierda muestre el amarillo hacia ti, haz el Sune y vuelve a mirar.","It never takes more than three orientation algorithms in a row.":"Nunca hacen falta más de tres algoritmos de orientación seguidos.","2x2 · Orientation 2 of 3":"2x2 · Orientación 2/3","Antisune: one yellow corner up, other way":"Antisune: una esquina amarilla hacia arriba, al revés","One yellow corner up, the other way round from the Sune.":"Una esquina amarilla hacia arriba, al revés que en el Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Pon la esquina con amarillo arriba <b>atrás a la derecha<\/b>. La esquina delantera izquierda muestra el amarillo <b>hacia ti<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Si no encaja ni el dibujo del Sune ni el del Antisune, gira la cara de arriba y vuelve a mirar.","2x2 · Orientation 3 of 3":"2x2 · Orientación 3/3","Pi: no yellow corner up":"Pi: ninguna esquina amarilla hacia arriba","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Ninguna esquina amarilla hacia arriba. Después, todo el amarillo queda arriba o te sale un caso de Sune o Antisune.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Nada de amarillo arriba. Sujeta el cubo de forma que las dos esquinas de la <b>izquierda<\/b> muestren el amarillo <b>a la izquierda<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"¿Parejas amarillas a la izquierda y a la derecha? Pon cualquiera de las dos a la izquierda.","R2 = turn the right side twice.":"R2 = gira la cara derecha dos veces.","2x2 · Permutation 1 of 2":"2x2 · Permutación 1/2","T-perm: headlights on one side":"T-perm: faros en un lado","All yellow is up. Swaps two corners next to each other.":"Todo el amarillo está arriba. Intercambia dos esquinas que están juntas.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Busca <b>faros<\/b>: un lado donde las dos pegatinas de arriba son del mismo color. Pon ese lado a la <b>izquierda<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"¿Faros en todos los lados? No hay nada que intercambiar: solo gira la cara de arriba para alinearla.","After the T-perm, turn the top until the cube is solved.":"Después del T-perm, gira la cara de arriba hasta que el cubo esté resuelto.","2x2 · Permutation 2 of 2":"2x2 · Permutación 2/2","Y-perm: no headlights":"Y-perm: sin faros","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Todo el amarillo está arriba, pero ningún lado tiene faros. Intercambia dos esquinas en diagonal.","No headlights anywhere. Hold it any way round.":"No hay faros en ningún lado. Sujétalo en cualquier posición.","After the Y-perm, turn the top until the cube is solved.":"Después del Y-perm, gira la cara de arriba hasta que el cubo esté resuelto.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Apréndelo en dos mitades: «F R U' R' U' R U R' F'» y «R U R' U' R' F R F'».","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"Pone todo el amarillo arriba. La cara blanca se queda abajo.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Una esquina amarilla hacia arriba <b>delante a la izquierda<\/b>. La esquina delantera derecha muestra el amarillo <b>hacia ti<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"Primero la cara blanca abajo: solo hace falta que el blanco esté abajo, los lados pueden estar mezclados.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Una esquina amarilla hacia arriba <b>atrás a la derecha<\/b>. La esquina delantera izquierda muestra el amarillo <b>hacia ti<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Ninguna esquina amarilla hacia arriba. Parejas amarillas en las caras <b>izquierda<\/b> y <b>derecha<\/b>.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Ninguna esquina amarilla hacia arriba. Una pareja amarilla a la <b>izquierda<\/b>; a la derecha, un amarillo mira hacia ti y otro hacia atrás.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Dos esquinas amarillas hacia arriba <b>atrás<\/b>. Las otras dos muestran el amarillo <b>hacia ti<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Dos esquinas amarillas hacia arriba a la <b>derecha<\/b>. A la izquierda, un amarillo mira hacia ti y otro hacia atrás.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Esquinas amarillas hacia arriba <b>delante a la izquierda<\/b> y <b>atrás a la derecha<\/b>. La esquina delantera derecha muestra el amarillo <b>hacia ti<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"Arriba: faros, abajo: hecha","All yellow up, all white down. Fixes both layers at once.":"Todo el amarillo arriba, todo el blanco abajo. Arregla las dos capas a la vez.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Capa de arriba: faros a la <b>izquierda<\/b>. Capa de abajo: ya está bien.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Faros<\/b> = un lado donde las dos pegatinas de esa capa son del mismo color.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"¿Arriba bien pero abajo mal? Da la vuelta al cubo entero para que la capa mala quede arriba y usa la tarjeta 1 o 2.","After the algorithm, turn the top and bottom until the cube is solved.":"Después del algoritmo, gira la capa de arriba y la de abajo hasta que el cubo esté resuelto.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"Arriba: sin faros, abajo: hecha","Top layer: no headlights. Bottom layer: already right.":"Capa de arriba: sin faros. Capa de abajo: ya está bien.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"Las dos capas: faros","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Faros en <b>las dos<\/b> capas. Gira la capa de arriba y la de abajo para que los dos queden <b>delante<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"Las dos capas: sin faros","No headlights in either layer. Hold it any way round.":"No hay faros en ninguna capa. Sujétalo en cualquier posición.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"Arriba: faros, abajo: sin faros","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Capa de arriba: faros <b>delante<\/b>. Capa de abajo: sin faros.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"Arriba: sin faros, abajo: faros","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Capa de arriba: sin faros. Capa de abajo: faros <b>atrás<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Paso 1 · puntas","Turn the tips":"Gira las puntas","The easiest step: each tip turns on its own.":"El paso más fácil: cada punta gira por su cuenta.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Gira cada punta (<b>u l r b<\/b>) hasta que sus tres colores coincidan con los <b>tres centros<\/b> que tiene justo al lado.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"Una punta tiene tres colores. Cada uno tiene que coincidir con el triángulo central que hay justo debajo, en la misma cara.","Turning a tip never moves anything else, so you can always fix the tips
