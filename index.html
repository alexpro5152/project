 one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"Nenhuma posição da face de cima deixa exatamente um canto no lugar? Faz uma vez a partir de qualquer posição e volta a olhar. Isto pode acontecer num 2x2, mas nunca acontece num 3x3.","All four in place? Go to step 3.":"Os quatro no lugar? Passa ao passo 3.","2x2 · Step 3 · finish":"2x2 · Passo 3 · terminar","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Igual ao passo 7 do 3x3. Amarelo para baixo, canto torcido em baixo à frente à direita. Amarelo virado para o lado: Righty 2 vezes. Amarelo virado para ti: Righty 4 vezes. Depois roda a face de baixo (D) até ao canto seguinte.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Vira o cubo ao contrário: amarelo em baixo.<\/b> Põe um canto torcido <b>em baixo à frente à direita<\/b> e vê para onde aponta o seu autocolante amarelo:<ul class=\"rule\"><li>Amarelo virado <b>para o lado<\/b> (direita) &rarr; Righty <b>2 vezes<\/b><\/li><li>Amarelo virado <b>para ti<\/b> &rarr; Righty <b>4 vezes<\/b><\/li><li>Amarelo virado <b>para baixo<\/b> &rarr; este canto está feito<\/li><\/ul>Depois roda <b>só a camada de baixo (D)<\/b> para trazer para lá o canto torcido seguinte. Nunca rodes o cubo inteiro.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"A camada branca fica baralhada a meio. Continua, ela volta ao sítio quando o último canto estiver feito.","At the end, turn one layer until the two layers line up. Solved!":"No fim, roda uma camada até as duas camadas ficarem alinhadas. Resolvido!","2x2 · Orientation 1 of 3":"2x2 · Orientação 1/3","Sune: one yellow corner up":"Sune: um canto amarelo para cima","One yellow corner up. Makes the top yellow, or another case you then fix.":"Um canto amarelo para cima. Põe a face de cima toda amarela, ou dá outro caso que depois resolves.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Camada branca feita, em baixo. Segura o canto com amarelo para cima <b>à frente à esquerda<\/b>. O canto da frente à direita mostra o amarelo <b>virado para ti<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"Dois cantos amarelos para cima? Segura o cubo de forma que o canto da frente à esquerda mostre o amarelo virado para ti, faz o Sune e volta a olhar.","It never takes more than three orientation algorithms in a row.":"Nunca são precisos mais de três algoritmos de orientação seguidos.","2x2 · Orientation 2 of 3":"2x2 · Orientação 2/3","Antisune: one yellow corner up, other way":"Antisune: um canto amarelo para cima, ao contrário","One yellow corner up, the other way round from the Sune.":"Um canto amarelo para cima, ao contrário do Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Segura o canto com amarelo para cima <b>atrás à direita<\/b>. O canto da frente à esquerda mostra o amarelo <b>virado para ti<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Se nem a imagem do Sune nem a do Antisune coincidem, roda a face de cima e volta a olhar.","2x2 · Orientation 3 of 3":"2x2 · Orientação 3/3","Pi: no yellow corner up":"Pi: nenhum canto amarelo para cima","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Nenhum canto amarelo para cima. Depois dele, fica todo o amarelo para cima ou aparece um caso de Sune ou Antisune.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Nenhum amarelo em cima. Segura o cubo de forma que os dois cantos da <b>esquerda<\/b> mostrem o amarelo <b>à esquerda<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"Pares amarelos à esquerda e à direita? Segura qualquer um dos pares à esquerda.","R2 = turn the right side twice.":"R2 = roda a face direita duas vezes.","2x2 · Permutation 1 of 2":"2x2 · Permutação 1/2","T-perm: headlights on one side":"T-perm: faróis numa face","All yellow is up. Swaps two corners next to each other.":"Todo o amarelo está para cima. Troca dois cantos lado a lado.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Procura <b>faróis<\/b>: uma face onde os dois autocolantes de cima têm a mesma cor. Segura essa face <b>à esquerda<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"Faróis em todas as faces? Não há nada para trocar: roda só a face de cima para alinhar.","After the T-perm, turn the top until the cube is solved.":"Depois da T-perm, roda a face de cima até o cubo ficar resolvido.","2x2 · Permutation 2 of 2":"2x2 · Permutação 2/2","Y-perm: no headlights":"Y-perm: sem faróis","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Todo o amarelo está para cima, mas nenhuma face tem faróis. Troca dois cantos na diagonal.","No headlights anywhere. Hold it any way round.":"Não há faróis em lado nenhum. Segura o cubo em qualquer posição.","After the Y-perm, turn the top until the cube is solved.":"Depois da Y-perm, roda a face de cima até o cubo ficar resolvido.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Aprende-a em duas metades: \"F R U' R' U' R U R' F'\" e \"R U R' U' R' F R F'\".","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"Põe todo o amarelo para cima. A face branca fica em baixo.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Um canto amarelo para cima <b>à frente à esquerda<\/b>. O canto da frente à direita mostra o amarelo <b>virado para ti<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"Primeiro a face branca em baixo: só o branco tem de estar para baixo, as cores laterais podem estar misturadas.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Um canto amarelo para cima <b>atrás à direita<\/b>. O canto da frente à esquerda mostra o amarelo <b>virado para ti<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Nenhum canto amarelo para cima. Pares amarelos nas faces <b>esquerda<\/b> e <b>direita<\/b>.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Nenhum canto amarelo para cima. Um par amarelo à <b>esquerda<\/b>; à direita, um amarelo está virado para ti e o outro para trás.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Dois cantos amarelos para cima <b>atrás<\/b>. Os outros dois mostram o amarelo <b>virado para ti<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Dois cantos amarelos para cima <b>à direita<\/b>. À esquerda, um amarelo está virado para ti e o outro para trás.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Cantos amarelos para cima <b>à frente à esquerda<\/b> e <b>atrás à direita<\/b>. O canto da frente à direita mostra o amarelo <b>virado para ti<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"Cima: faróis, baixo: feito","All yellow up, all white down. Fixes both layers at once.":"Todo o amarelo para cima, todo o branco para baixo. Resolve as duas camadas de uma vez.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Camada de cima: faróis à <b>esquerda<\/b>. Camada de baixo: já está certa.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Faróis<\/b> = uma face onde os dois autocolantes dessa camada têm a mesma cor.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"Cima certa, mas baixo errada? Vira o cubo inteiro ao contrário para a camada errada ficar em cima, depois usa o cartão 1 ou 2.","After the algorithm, turn the top and bottom until the cube is solved.":"Depois do algoritmo, roda a face de cima e a de baixo até o cubo ficar resolvido.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"Cima: sem faróis, baixo: feito","Top layer: no headlights. Bottom layer: already right.":"Camada de cima: sem faróis. Camada de baixo: já está certa.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"As duas camadas: faróis","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Faróis nas <b>duas<\/b> camadas. Roda a face de cima e a de baixo para ficarem ambos <b>à frente<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"As duas camadas: sem faróis","No headlights in either layer. Hold it any way round.":"Não há faróis em nenhuma das camadas. Segura o cubo em qualquer posição.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"Cima: faróis, baixo: nenhuns","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Camada de cima: faróis <b>à frente<\/b>. Camada de baixo: sem faróis.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"Cima: nenhuns, baixo: faróis","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Camada de cima: sem faróis. Camada de baixo: faróis <b>atrás<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Passo 1 · pontas","Turn the tips":"Roda as pontas","The easiest step: each tip turns on its own.":"O passo mais fácil: cada ponta roda sozinha.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Roda cada ponta (<b>u l r b<\/b>) até as suas três cores coincidirem com os <b>três centros<\/b> mesmo ao lado.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"Uma ponta tem três cores. Cada uma tem de coincidir com o triângulo do centro logo abaixo, na mesma face.","Turning a tip never moves anything else, so you can always fix the tips first.":"Rodar uma ponta nunca mexe em mais nada, por isso podes sempre resolver as pontas primeiro.","Pyraminx · Step 2 · centres":"Pyraminx · Passo 2 · centros","Match the centres":"Junta os centros","Turn whole corners until every face has three centres of the same colour.":"Roda cantos inteiros até cada face ter três centros da mesma cor.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Roda cantos inteiros (<b>U L R B<\/b>) até, em cada face, os <b>três centros<\/b> mostrarem a mesma cor. Depois segura o puzzle com a <b>face amarela em baixo<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Cada canto leva consigo a sua ponta e os seus três centros, por isso o passo 1 continua feito.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"As arestas ficam misturadas enquanto fazes isto. Não faz mal, os passos 3 e 4 tratam delas.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Passo 3a · arestas de baixo","Edge on the right, yellow facing you":"Aresta à direita, amarelo virado para ti","Puts the green-yellow edge into the front bottom.":"Põe a aresta verde-amarela em baixo à frente.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Face amarela em baixo. A aresta que pertence <b>em baixo à frente<\/b> está na posição <b>da frente à direita<\/b>, com o amarelo <b>virado para ti<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Roda o puzzle inteiro (o amarelo fica em baixo) até o lugar que queres preencher ficar em baixo à frente.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"A aresta já está em baixo, mas no lugar errado ou invertida? Põe esse lugar em baixo à frente e faz isto uma vez para levar a aresta para cima.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Passo 3b · arestas de baixo","Edge on the right, yellow facing right":"Aresta à direita, amarelo virado para a direita","Same edge, the other way round.":"A mesma aresta, ao contrário.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"A aresta está na posição <b>da frente à direita<\/b>, com o amarelo virado para a <b>direita<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Passo 3c · arestas de baixo","Edge on the left, yellow facing you":"Aresta à esquerda, amarelo virado para ti","The edge is on the left side.":"A aresta está do lado esquerdo.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"A aresta está na posição <b>da frente à esquerda<\/b>, com o amarelo <b>virado para ti<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Passo 3d · arestas de baixo","Edge on the left, yellow facing left":"Aresta à esquerda, amarelo virado para a esquerda","Mirror of 3b.":"O espelho do 3b.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"A aresta está na posição <b>da frente à esquerda<\/b>, com o amarelo virado para a <b>esquerda<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Passo 3e · arestas de baixo","Edge at the back, yellow facing right":"Aresta atrás, amarelo virado para a direita","The edge is on the back edge.":"A aresta está na posição de trás.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"A aresta está na posição <b>de trás<\/b>, com o amarelo virado para a <b>direita<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Passo 3f · arestas de baixo","Edge at the back, yellow facing left":"Aresta atrás, amarelo virado para a esquerda","Mirror of 3e.":"O espelho do 3e.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"A aresta está na posição <b>de trás<\/b>, com o amarelo virado para a <b>esquerda<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Faz isto para as três arestas de baixo. A face amarela está feita quando cada aresta de baixo coincide com os centros dos dois lados.","Pyraminx · Step 4a · last edges":"Pyraminx · Passo 4a · últimas arestas","Edges go round (one way)":"As arestas dão a volta (num sentido)","Moves the three top edges round.":"Troca as três arestas de cima entre si.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Face amarela feita, em baixo. <b>Nenhuma<\/b> aresta de cima está no seu lugar. A aresta <b>da frente à esquerda<\/b> pertence <b>à frente à direita<\/b>.","After it, two edges may be flipped. Then do 4c.":"Depois disto, duas arestas podem ficar invertidas. Nesse caso faz o 4c.","You never need more than two algorithms for the last edges.":"Nunca precisas de mais de dois algoritmos para as últimas arestas.","Pyraminx · Step 4b · last edges":"Pyraminx · Passo 4b · últimas arestas","Edges go round (other way)":"As arestas dão a volta (no outro sentido)","Moves the three top edges round the other way.":"Troca as três arestas de cima entre si, no outro sentido.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Nenhuma<\/b> aresta de cima está no seu lugar. A aresta <b>da frente à esquerda<\/b> pertence <b>atrás<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Passo 4c · últimas arestas","Two edges flipped":"Duas arestas invertidas","All three top edges are in their place, but two are flipped.":"As três arestas de cima estão no seu lugar, mas duas estão invertidas.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Todas as arestas de cima no seu lugar, duas delas invertidas. Segura o puzzle com a <b>aresta boa atrás<\/b>.","Solved!":"Resolvido!","4x4 · 1 · edge pairing":"4x4 · 1 · emparelhar arestas","Join two halves opposite each other":"Junta duas metades opostas","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"Uma aresta do 4x4 tem duas metades. Quando as duas metades estão uma em frente da outra, isto junta-as numa só aresta.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Centros feitos. As duas metades de uma aresta (aqui <b>azul-laranja<\/b>) estão <b>uma em frente da outra<\/b>: uma <b>em cima, na aresta da frente à esquerda<\/b>, a outra <b>em cima, na aresta da frente à direita<\/b>, com o <b>laranja virado para ti<\/b> nas duas. Só as peças azul-laranja estão coloridas, para as poderes seguir.","Joined! The blue-orange edge is now one piece, at the front right.":"Juntas! A aresta azul-laranja é agora uma só peça, à frente à direita.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = as duas camadas de cima juntas. Uw' traz a metade da esquerda para a direita, Uw no fim volta a pôr os centros no sítio.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"A parte do meio \"R U R' F R' F' R\" troca uma aresta já feita para o lugar dela, para as duas metades se poderem juntar. O resto do cubo fica misturado: não faz mal, depois resolves como um 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Emparelha assim as 12 arestas e depois resolve o 4x4 como um 3x3.","Edge joined":"Aresta junta","4x4 · 1b · edge pairing":"4x4 · 1b · emparelhar arestas","Combine with the centre layer, then swap it out":"Junta com a camada interior e depois troca-a","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Roda só a camada interior para juntar as duas metades, troca a aresta junta por uma que ainda não está junta e depois roda a camada interior de volta.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Centros feitos. As duas metades de uma aresta (aqui <b>azul-laranja<\/b>) estão <b>na diagonal<\/b>: uma <b>em cima, na aresta da frente à esquerda<\/b>, com o <b>laranja virado para ti<\/b>, a outra <b>em baixo, na aresta da frente à direita<\/b>, com o <b>azul virado para ti<\/b>. Só as peças azul-laranja estão coloridas, para as poderes seguir.","Joined! The blue-orange edge is now one piece, at the top front.":"Juntas! A aresta azul-laranja é agora uma só peça, em cima à frente.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"Este movimento tem um nome: <b>movimento de camada interior<\/b> (slice). Um u minúsculo quer dizer: roda <b>só a camada interior de cima<\/b> (a segunda camada a contar de cima). A camada de cima não se mexe.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = essa camada interior roda para a direita (como U'). A metade de cima vai para a direita e fica por cima da metade de baixo: a aresta está junta.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' leva a aresta junta para cima e põe no lugar dela uma aresta que ainda não está junta.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = roda a camada interior de volta, para os centros ficarem outra vez resolvidos. A aresta junta continua inteira em cima.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Se a metade de baixo estiver à esquerda e a metade de cima à direita, roda a camada interior no outro sentido: u L' U' L u'.","Halves combined":"Metades juntas","Swapped out":"Trocada","4x4 · 2 · OLL parity":"4x4 · 2 · paridade de OLL","No 3x3 OLL fits":"Nenhuma OLL de 3x3 serve","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Quando <b>não há nenhum algoritmo de 3x3<\/b> para a tua face de cima, faz isto. Só acontece no 4x4: há um número ímpar de arestas de cima invertidas (1 ou 3), como na imagem. Isto inverte a aresta da frente, e uma OLL normal de 3x3 volta a funcionar.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Amarelo em cima. Como na imagem: <b>3 arestas estão invertidas<\/b> (a da frente, a da direita e a de trás mostram a sua cor em cima), só a aresta da <b>esquerda<\/b> tem amarelo em cima. A imagem mostra a face de cima vista de cima, com a frente em baixo. Segura uma <b>aresta invertida à frente<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Agora há um número par de arestas invertidas (a de trás e a da esquerda) e os dois cantos da frente estão rodados: volta a ser um caso normal de 3x3. Acaba com a tua OLL e PLL de 3x3.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"Como a reconhecer: conta as arestas de cima que não têm amarelo em cima. 1 ou 3 = nenhum algoritmo de 3x3 serve, faz primeiro este.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = as <b>duas camadas da direita juntas<\/b> (movimento largo), Lw = as duas camadas da esquerda juntas. Em muitas folhas isto aparece escrito como r e l minúsculos.","U2 and F2 turn only the outer top and front layer, twice.":"U2 e F2 rodam só a camada exterior de cima e da frente, duas vezes.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"A aresta da frente fica invertida. Algumas outras peças de cima também se mexem: não faz mal, a tua OLL e PLL normais de 3x3 resolvem-nas.","4x4 · 3 · PLL parity":"4x4 · 3 · paridade de PLL","Two edges swapped":"Duas arestas trocadas","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"Também só no 4x4: mesmo no fim, duas arestas de cima opostas estão trocadas. Isto volta a trocá-las.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Está tudo resolvido exceto as arestas de cima <b>da frente<\/b> e <b>de trás<\/b>, que estão <b>trocadas<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = as duas camadas de cima, duas vezes. Rw2 = as duas camadas da direita, duas vezes. r2 = só a segunda camada a contar da direita, duas vezes.","Only these two edges change. Everything else stays where it is.":"Só estas duas arestas mudam. Tudo o resto fica onde está.","Mirror cube · last layer":"Mirror cube · última camada","Three corners (A-perm)":"Três cantos (A-perm)","Moves three top corners around. Everything else stays where it is.":"Troca três cantos de cima entre si. Tudo o resto fica onde está.","Beginner 3x3":"3x3 para iniciantes","Beginner":"Iniciante","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"O método clássico para iniciantes. Segura o cubo com o <b>amarelo em cima<\/b> e o <b>verde virado para ti<\/b>:\n       o branco resolve-se primeiro, em baixo, e o amarelo no fim, em cima. Clica num passo para o ver a mexer.","Intermediate 3x3":"3x3 intermédio","Intermediate":"Intermédio","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"O nível seguinte: cruz branca como antes, depois <b>F2L<\/b> (canto e aresta juntos),\n       <b>OLL em 2 fases (2-look)<\/b> (todo o amarelo em cima) e <b>PLL em 2 fases (2-look)<\/b> (tudo no sítio). A mesma posição: amarelo em cima, verde virado para ti.","Advanced F2L (3x3)":"F2L avançado (3x3)","Advanced F2L":"F2L avançado","Advanced OLL (3x3)":"OLL avançada (3x3)","Advanced OLL":"OLL avançada","Advanced PLL (3x3)":"PLL avançada (3x3)","Advanced PLL":"PLL avançada","2x2 Beginner":"2x2 para iniciantes","2x2 Intermediate":"2x2 intermédio","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"Camada branca como no método para iniciantes. Depois, <b>3 algoritmos<\/b> põem a face de cima toda amarela e <b>2 algoritmos<\/b> põem os cantos no lugar.","2x2 Advanced":"2x2 avançado","Advanced":"Avançado","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"O método <b>Ortega<\/b>. Primeiro faz a <b>face branca<\/b> em baixo (as cores laterais ainda não precisam de coincidir). Depois, um de <b>7 algoritmos<\/b> põe todo o amarelo para cima e um de <b>6 algoritmos<\/b> resolve as duas camadas de uma vez.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Outros puzzles e cubos grandes","push it up, away from you":"empurra para cima, para longe de ti","pull it down, toward you":"puxa para baixo, na tua direção","swing it to the left":"gira para a esquerda","swing it to the right":"gira para a direita","turn it clockwise, like a clock":"roda no sentido horário, como um relógio","turn it anticlockwise":"roda no sentido anti-horário","push them up, away from you":"empurra-as para cima, para longe de ti","pull them down, toward you":"puxa-as para baixo, na tua direção","turn them clockwise, like a clock":"roda-as no sentido horário, como um relógio","turn them anticlockwise":"roda-as no sentido anti-horário","swing them to the right":"gira-as para a direita","swing them to the left":"gira-as para a esquerda","clockwise as seen from behind":"sentido horário visto de trás","anticlockwise as seen from behind":"sentido anti-horário visto de trás","swing it to the right (like D)":"gira para a direita (como D)","turn it clockwise, like F":"roda no sentido horário, como F","tip it so the front comes to the top":"inclina para a frente vir para cima","tip it so the top comes to the front":"inclina para a face de cima vir para a frente","roll it to the right, like F":"tomba para a direita, como F","roll it to the left":"tomba para a esquerda","pull it down, toward you (like L)":"puxa para baixo, na tua direção (como L)","turn it so the right side faces you":"roda para a face direita ficar virada para ti","turn it so the left side faces you":"roda para a face esquerda ficar virada para ti","Right face":"Face direita","Left face":"Face esquerda","Top face":"Face de cima","Bottom face":"Face de baixo","Front face":"Face da frente","Back face":"Face de trás","Whole cube":"Cubo inteiro","Right two layers":"Duas camadas da direita","Left two layers":"Duas camadas da esquerda","Front two layers":"Duas camadas da frente","Bottom two layers":"Duas camadas de baixo","Top two layers":"Duas camadas de cima","Back two layers":"Duas camadas de trás","Middle slice":"Camada do meio","Middle layer":"Camada do meio","Front-back middle slice":"Camada do meio entre a frente e a traseira","Only the centre layer next to the right (slice move, the right layer stays still)":"Só a camada interior junto à direita (movimento de camada interior, a camada da direita fica parada)","Only the centre layer next to the left (slice move, the left layer stays still)":"Só a camada interior junto à esquerda (movimento de camada interior, a camada da esquerda fica parada)","Only the centre layer next to the top (slice move, the top layer stays still)":"Só a camada interior junto à de cima (movimento de camada interior, a camada de cima fica parada)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Só a camada interior junto à de baixo (movimento de camada interior, a camada de baixo fica parada)","Only the centre layer next to the front (slice move, the front layer stays still)":"Só a camada interior junto à da frente (movimento de camada interior, a camada da frente fica parada)","Only the centre layer next to the back (slice move, the back layer stays still)":"Só a camada interior junto à de trás (movimento de camada interior, a camada de trás fica parada)","Top corner with its layer":"Canto de cima com a sua camada","Top tip only":"Só a ponta de cima","Left corner with its layer":"Canto da esquerda com a sua camada","Left tip only":"Só a ponta da esquerda","Right corner with its layer":"Canto da direita com a sua camada","Right tip only":"Só a ponta da direita","Back corner with its layer":"Canto de trás com a sua camada","Back tip only":"Só a ponta de trás","turn it clockwise, as you look at that corner":"roda no sentido horário, olhando para esse canto","turn it anticlockwise, as you look at that corner":"roda no sentido anti-horário, olhando para esse canto","{what}: half a turn (turn it twice)":"{what}: meia volta (roda duas vezes)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: três movimentos, acaba igual a {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"Inglês (Reino Unido)","English (US)":"Inglês (EUA)","Arabic":"Árabe","Chinese":"Chinês","French":"Francês","German":"Alemão","Hindi":"Hindi","Korean":"Coreano","Portuguese":"Português","Russian":"Russo","Spanish":"Espanhol"},"ru":{"Cube Algorithms":"Алгоритмы кубика","Settings":"Настройки","Grip: yellow on top, green facing you":"Хват: жёлтый сверху, зелёный к тебе","Light":"Светлая","Dark":"Тёмная","Switch to light mode":"Включить светлую тему","Switch to dark mode":"Включить тёмную тему","Top layer at the start":"Верхний слой в начале","Algorithms":"Алгоритмы","Turn the cube back":"Повернуть кубик обратно","All {name} steps":"Все шаги: {name}","Step back":"Шаг назад","Play":"Пуск","Step":"Шаг","Reset":"Сброс","Reset view":"Сбросить вид","Play {n}× (back to start!)":"Пуск {n}× (обратно к началу!)","Speed":"Скорость","Drag or swipe the cube to turn it around.":"Тяни или смахивай кубик, чтобы повернуть его.","Start":"Начало","solved":"собран","before":"до","End":"Конец","Step {n}":"Шаг {n}","after {label}":"после {label}","Round {r} of {n}: {mv}":"Круг {r} из {n}: {mv}","{n} rounds later... back exactly where we started!":"{n} кругов спустя... ровно там, откуда начали!","Undo {mv}":"Отменить {mv}","Press Play, or Step through one turn at a time.":"Нажми «Пуск» или «Шаг», чтобы идти по одному повороту.","Done! Try Play 6x: the cube comes back to the start.":"Готово! Попробуй «Пуск» 6 раз: кубик вернётся к началу.","Done! That is what this step fixes.":"Готово! Вот что исправляет этот шаг.","{i} of {n} turns done. Next: {mv}.":"Сделано поворотов: {i} из {n}. Дальше: {mv}.","Languages":"Языки","Estonian":"Эстонский","<b>r<\/b> right two layers":"<b>r<\/b> два правых слоя","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> средний слой, крутится как L","<b>d<\/b> bottom two layers":"<b>d<\/b> два нижних слоя","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = сделай скобку 3 раза","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> два правых слоя вместе","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> два верхних слоя вместе","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> только второй слой справа / слева / сверху (внутренний слой)","<b>M<\/b> middle slice, like L":"<b>M<\/b> средний слой, как L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> наклони / перекати весь кубик","<b>y<\/b> turn the whole cube":"<b>y<\/b> поверни весь кубик","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> два нижних / верхних слоя","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> два слоя сразу","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> средний слой между передней и задней гранью, как F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> наклони весь кубик, как R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = сделай скобку дважды","<b>U<\/b> top corner":"<b>U<\/b> верхний угол","<b>L<\/b> front-left corner":"<b>L<\/b> передний левый угол","<b>R<\/b> front-right corner":"<b>R<\/b> передний правый угол","<b>B<\/b> back corner":"<b>B<\/b> задний угол","capital = the corner with its whole layer":"заглавная буква = угол вместе со всем его слоем","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = только вершинка","<b>'<\/b> = the other way":"<b>'<\/b> = в другую сторону","plain letter = clockwise as you look at that corner":"просто буква = по часовой стрелке, если смотреть на этот угол","<b>R<\/b> right":"<b>R<\/b> правая","<b>L<\/b> left":"<b>L<\/b> левая","<b>U<\/b> top":"<b>U<\/b> верхняя","<b>D<\/b> bottom":"<b>D<\/b> нижняя","<b>F<\/b> front":"<b>F<\/b> передняя","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> поверни весь кубик правой гранью вперёд","<b>2<\/b> = twice":"<b>2<\/b> = дважды","<b>3<\/b> = three times":"<b>3<\/b> = три раза","plain letter = clockwise as you look at that face":"просто буква = по часовой стрелке, если смотреть на эту грань","Step 0 · the basic move":"Шаг 0 · базовый приём","The Righty Move":"Приём Righty","Learn this first. Steps 2 and 3 are built from it.":"Выучи его первым. Из него строятся шаги 2 и 3.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Держи кубик как угодно. Сделай его <b>6 раз<\/b>, и кубик вернётся к началу.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Проговаривай вслух, пока крутишь: «правую вверх, верх влево, правую вниз, верх вправо».","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"Все четыре поворота делает правая рука. Большой палец спереди, указательный толкает верх.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Шесть повторов отменяют сами себя. Отличный фокус для друзей, и он доказывает, что формулы — не магия.","Step 0 · the mirror move":"Шаг 0 · зеркальный приём","The Lefty Move":"Приём Lefty","Righty in a mirror, for the left hand. Same job on the left side.":"Righty в зеркале, для левой руки. Та же работа, только слева.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Держи кубик как угодно. Все четыре поворота делает левая рука. Шесть раз, и кубик снова в начале.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Каждая буква отражена: R становится L, и каждый поворот идёт в другую сторону.","Use it in step 2 when the white corner sits above the front-left slot.":"Используй его в шаге 2, когда белый угол стоит над передним левым слотом.","Kids often find this one easier: the left index finger flicks the top toward you.":"Детям часто проще этот: левый указательный палец толкает верх к тебе.","Step 1a · white cross":"Шаг 1a · белый крест","Edge on top, white facing up":"Ребро сверху, белым вверх","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"Самый простой случай креста. Крути верх, пока ребро не окажется над своим местом, затем поверни эту грань дважды.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Белый снизу<\/b>. Белое ребро в верхнем слое, белая наклейка <b>смотрит вверх<\/b>. Крути верх, пока его второй цвет не встанет над таким же центром, здесь зелёный над зелёным, затем поверни эту грань дважды.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Смотри на боковой цвет ребра, а не на белый. Он подскажет, какую грань крутить.","Grey pieces do not matter yet. Corners come in step 2.":"Серые элементы пока не важны. Углы будут в шаге 2.","Do this for all four edges. Most of the cross is just this move.":"Сделай так со всеми четырьмя рёбрами. Почти весь крест — это просто этот приём.","Step 1b · white cross":"Шаг 1b · белый крест","Edge on top, white facing sideways":"Ребро сверху, белым вбок","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Белое ребро в верхнем слое, белым к тебе. Опускает его вниз правильной стороной.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Белый снизу. Ребро стоит <b>сверху спереди<\/b>, белая наклейка <b>смотрит на тебя<\/b>. Его второй цвет (сверху) <b>такой же, как передний центр<\/b>, здесь зелёный. Если нет, крути верх, пока не совпадёт.","The other cross edges are not disturbed.":"Другие рёбра креста не сбиваются.","Same ending as 1c: the last three turns tuck the edge in from the left.":"Конец как в 1c: последние три поворота вставляют ребро слева.","Step 1c · white cross":"Шаг 1c · белый крест","Edge in the bottom, flipped":"Ребро снизу, перевёрнуто","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Белое ребро уже внизу, но стоит наоборот. Переворачивает его на месте.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Белый снизу<\/b>, жёлтый сверху. Неправильное ребро стоит <b>спереди снизу<\/b>, белая наклейка смотрит на тебя. Другие рёбра креста остаются на месте.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"Цель шага 1: белый плюс снизу, и боковой цвет каждого ребра совпадает с центром рядом.","Grey pieces do not matter yet. Only look at the white ones.":"Серые элементы пока не важны. Смотри только на белые.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"Ребро в верхнем слое? Крути верх, пока оно не окажется над своим местом, затем поверни эту грань дважды.","Step 2a · white corners":"Шаг 2a · белые углы","Corner above its slot, white facing right":"Угол над своим слотом, белым вправо","The quick case. Three turns and the corner drops in.":"Быстрый случай. Три поворота, и угол встаёт на место.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Белый снизу. Белый угол в <b>верхнем слое, прямо над<\/b> своим слотом <b>спереди справа<\/b>, белая наклейка <b>смотрит вправо<\/b>. Два других его цвета совпадают с передним и правым центрами.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"Это Righty без последнего поворота. Один Righty тоже подойдёт, лишний поворот верха здесь ничего не меняет.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"Ещё не над своим слотом? Крути верхний слой, пока не окажется. Угол стоит там, где два его боковых цвета встречают такие же центры.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"Угол уже в слоте, но повёрнут? Сделай один Righty, чтобы вытащить его, и начни снова.","Step 2b · white corners":"Шаг 2b · белые углы","Corner above its slot, white facing you":"Угол над своим слотом, белым к тебе","Same corner, white pointing at you. Use the front face instead of the right.":"Тот же угол, белым к тебе. Используй переднюю грань вместо правой.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Белый снизу. Белый угол в <b>верхнем слое над<\/b> своим слотом <b>спереди справа<\/b>, белая наклейка <b>смотрит на тебя<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Думай зеркально: белый справа — используй R. Белый спереди — используй F.","Righty five times also does it, but this is three turns instead of twenty.":"Righty пять раз тоже сработает, но тут три поворота вместо двадцати.","Step 2c · white corners":"Шаг 2c · белые углы","Corner above its slot, white facing up":"Угол над своим слотом, белым вверх","The slow case: white points at the ceiling. Righty three times.":"Медленный случай: белый смотрит в потолок. Righty три раза.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Белый снизу. Белый угол в <b>верхнем слое над<\/b> своим слотом <b>спереди справа<\/b>, белая наклейка <b>смотрит вверх<\/b>. Делай Righty, пока белый не посмотрит вниз. Здесь нужно три круга.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Следи за углом после каждого Righty: после первого он в слоте, но повёрнут, после второго снова сверху белым вправо, после третьего он на месте.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Любой случай угла решается одним Righty: 1, 3 или 5 кругов. Карточки 2a и 2b — просто короткие пути.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"Два его боковых цвета должны совпасть с центрами рядом. Если нет, сначала покрути верхний слой.","Step 3a · middle layer":"Шаг 3a · средний слой","Edge goes right":"Ребро идёт вправо","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Опускает ребро из верхнего слоя в передний правый слот. U R U R' U', поверни весь кубик правой гранью к себе, затем L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Белое готово, внизу. Найди верхнее ребро <b>без жёлтого<\/b>. Крути верх, пока его передний цвет не совпадёт с передним центром. Если его верхний цвет совпадает с <b>правым<\/b> центром, используй это.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Две части: «U R U R' U'», затем поверни весь кубик (y) правой гранью к себе, затем «L' U' L».","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Поворачивай кубик в правильную сторону: бывшая правая грань должна оказаться перед тобой. Если в другую сторону, сломается белый слой.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Теперь перед тобой новая передняя грань. Это нормально, просто ищи следующее ребро оттуда.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"В слоте стоит не то ребро? Вставь туда любое другое ребро этой формулой, и оно выскочит.","Grey pieces are the yellow ones. They do not matter until step 4.":"Серые элементы — это жёлтые. Они не важны до шага 4.","Step 3b · middle layer":"Шаг 3b · средний слой","Edge goes left":"Ребро идёт влево","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"Зеркало 3a: опускает ребро в передний левый слот. U' L' U' L U, поверни весь кубик левой гранью к себе, затем R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Как 3a, но верхний цвет ребра совпадает с <b>левым<\/b> центром.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Две части: «U' L' U' L U», затем поверни весь кубик (y') левой гранью к себе, затем «R U R'».","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"Это 3a в зеркале: R становится L, каждый поворот идёт в другую сторону, а кубик поворачивается влево, а не вправо.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Поворачивай кубик в правильную сторону: бывшая левая грань должна оказаться перед тобой. Если в другую сторону, сломается белый слой.","Once all four middle edges are in, the bottom two layers are done.":"Когда все четыре средних ребра на месте, два нижних слоя готовы.","Step 4a · yellow cross":"Шаг 4a · жёлтый крест","Yellow cross from a line":"Жёлтый крест из линии","Turns a yellow line on top into a yellow plus.":"Превращает жёлтую линию сверху в жёлтый плюс.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"Два нижних слоя готовы. Жёлтая линия сверху, держи её <b>слева направо<\/b>. Только жёлтая точка? Сделай это один раз, получится L, затем используй 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"Это Righty, обёрнутый в F и F'. Середину ты уже знаешь.","Ignore the yellow corners for now. Only the plus matters.":"Жёлтые углы пока не трогай. Важен только плюс.","Step 4b · yellow cross":"Шаг 4b · жёлтый крест","Yellow cross from an L":"Жёлтый крест из буквы L","Turns a yellow L shape on top into a yellow plus.":"Превращает жёлтую букву L сверху в жёлтый плюс.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"Жёлтая L сверху, две её палочки смотрят <b>назад и влево<\/b> (как 9 и 12 на часах).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Почти как 4a, только в середине «U R U' R'» вместо «R U R' U'».","If the L points the wrong way, turn only the top layer until it fits.":"Если L смотрит не туда, крути только верхний слой, пока не совпадёт.","Step 5 · yellow edges":"Шаг 5 · жёлтые рёбра","Yellow edges into place (Sune)":"Жёлтые рёбра на место (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Держи два совпавших ребра <b>сзади и справа<\/b>, сделай Sune, затем один поворот U. Теперь все четыре жёлтых ребра совпадают со своими центрами.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Крути верх, пока <b>два ребра<\/b> не совпадут со своими центрами. Два рядом: держи их <b>сзади и справа<\/b>, сделай Sune, затем <b>U<\/b> один раз. Два напротив: держи их <b>спереди и сзади<\/b> и сделай Sune один раз. Теперь совпадают два рядом, так что делай первый случай.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"Последний поворот — U (жёлтый верх), а не D. Поворот низа сломает белые слои.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Случай «напротив»: после одного Sune совпавшая пара стоит спереди и справа. Поверни весь кубик, чтобы она оказалась сзади и справа, затем Sune и U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Жёлтые углы будут крутиться. Это нормально, шаги 6 и 7 их исправят.","Step 6 · yellow corners":"Шаг 6 · жёлтые углы","Yellow corners into place (Niklas)":"Жёлтые углы на место (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Niklas. Переставляет три угла по кругу, чтобы каждый угол встал между своими цветами. Как он повёрнут, пока не важно.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Найди угол, который уже стоит <b>между своими цветами<\/b> (повёрнутый — тоже годится), и держи его <b>спереди слева<\/b>. Ни одного такого? Сделай формулу один раз с любого места, затем посмотри снова.","The front-left corner stays put, the other three cycle around.":"Передний левый угол остаётся на месте, остальные три ходят по кругу.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"Не забудь последний U. Без него верх сбит на один поворот, и жёлтые рёбра из шага 5 больше не совпадают.","Might need two rounds. Keep the same corner at front left.":"Может понадобиться два круга. Держи тот же угол спереди слева.","Step 7 · finish":"Шаг 7 · финиш","Twist the yellow corners":"Поверни жёлтые углы","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Просто приём Righty. Жёлтый вниз, повёрнутый угол снизу спереди справа. Жёлтый смотрит вбок: Righty 2 раза. Жёлтый смотрит на тебя: Righty 4 раза. Затем поверни низ (D) к следующему углу.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Переверни кубик: жёлтый снизу<\/b>, зелёный всё ещё к тебе. Поставь повёрнутый угол <b>снизу спереди справа<\/b> и посмотри, куда смотрит его жёлтая наклейка:<ul class=\"rule\"><li>Жёлтый смотрит <b>вбок<\/b> (вправо) &rarr; Righty <b>2 раза<\/b><\/li><li>Жёлтый смотрит <b>на тебя<\/b> &rarr; Righty <b>4 раза<\/b><\/li><li>Жёлтый смотрит <b>вниз<\/b> &rarr; этот угол готов<\/li><\/ul>Затем поворачивай <b>только нижний слой (D)<\/b>, чтобы привести следующий повёрнутый угол вниз спереди справа. Никогда не поворачивай весь кубик.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"В этом примере повёрнуты два угла: у первого жёлтый смотрит вбок (Righty 2 раза), у второго жёлтый смотрит на тебя (Righty 4 раза).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"Не уверен? Просто продолжай делать Righty и проверяй угол каждые 2 раза. Больше 4 никогда не нужно.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"По ходу два верхних слоя выглядят перемешанными. Не паникуй и не исправляй их. Они вернутся, когда последний угол будет готов.","Finish with a bottom turn to line up the yellow layer. Solved!":"В конце поверни низ, чтобы выровнять жёлтый слой. Собрано!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · простая вставка 1","Corner white right, edge at the back":"Угол белым вправо, ребро сзади","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"Угол и ребро встают в слот вместе за один раз, а не сначала угол, потом ребро.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Угол над <b>передним правым<\/b> слотом, белым <b>вправо<\/b>. Его ребро <b>сверху сзади<\/b>, зелёным вверх.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = первые два слоя. Собираешь белый угол и его среднее ребро вместе, а потом вставляешь их парой.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"Сначала составь пару сам: крути верх, пока угол и ребро не встанут как на картинке.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Собери белый крест как раньше, а потом вместо шагов 2 и 3 для новичков используй F2L.","F2L · basic insert 2":"F2L · простая вставка 2","Corner white facing you, edge on the left":"Угол белым к тебе, ребро слева","Mirror of insert 1, using the front face.":"Зеркало вставки 1, через переднюю грань.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Угол над <b>передним правым<\/b> слотом, белым <b>к тебе<\/b>. Его ребро <b>сверху слева<\/b>, оранжевым вверх.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Как вставка 1 в зеркале: белый смотрит на тебя, а не вправо, поэтому используй F вместо R.","F2L · basic insert 3":"F2L · простая вставка 3","Corner and edge side by side (right)":"Угол и ребро рядом (справа)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"Угол и ребро стоят рядом в верхнем слое. U выравнивает их, и они вместе встают на место.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Угол над <b>передним правым<\/b> слотом, белым <b>к тебе<\/b>, зелёным вверх. Его ребро <b>сверху справа<\/b>, зелёным вверх.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"Первый U соединяет угол и ребро в блок. Затем R U' R' вставляет блок.","F2L · basic insert 4":"F2L · простая вставка 4","Corner and edge side by side (front)":"Угол и ребро рядом (спереди)","Mirror of insert 3, using the front face.":"Зеркало вставки 3, через переднюю грань.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Угол над <b>передним правым<\/b> слотом, белым <b>вправо<\/b>, зелёным к тебе. Его ребро <b>сверху спереди<\/b>, зелёным к тебе.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"Зеркало вставки 3: R становится F', R' становится F, а каждый U идёт в другую сторону.","F2L · make a block":"F2L · собери блок","Join corner and edge into a block":"Соедини угол и ребро в блок","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Угол белым вверх нельзя вставить сразу. Сначала соедини угол и его ребро в один блок, потом вставь блок.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Угол над <b>передним правым<\/b> слотом, белым <b>вверх<\/b>. Его ребро <b>сверху сзади<\/b>, зелёным вверх. <b>U R U2 R'<\/b> соединяет их в блок, <b>U R U' R'<\/b> вставляет блок.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Смотри на полоску внизу: после первой половины угол и ребро стоят рядом, цвета совпадают. Это и есть блок.","The second half is basic insert 3. You already know it.":"Вторая половина — это простая вставка 3. Ты её уже знаешь.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"Это главная идея F2L: собери блок в верхнем слое, затем вставь его. Так решается большинство случаев F2L.","Block made":"Блок собран","Block in":"Блок вставлен","OLL 1 · yellow cross":"OLL 1 · жёлтый крест","Dot: make a line or an L":"Точка: сделай линию или L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Жёлтые только центр и два задних угла. Жёлтых рёбер нет. Сделай формулу линии или L, и появится линия или L.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Жёлтый сверху: жёлтые только <b>центр<\/b>, <b>верхний левый<\/b> и <b>верхний правый<\/b> угол, рёбер нет.<ul class=\"rule\"><li>Формула линии <b>F R U R' U' F'<\/b> &rarr; появится <b>L<\/b><\/li><li>Формула L <b>F U R U' R' F'<\/b> &rarr; появится <b>линия<\/b><\/li><\/ul>Затем закончи крест карточкой <b>Линия<\/b> или <b>Буква L<\/b> ниже.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"Готово! Появилась L. Поверни верх так, чтобы её палочки смотрели назад и влево, затем сделай формулу L.","The animation does the line formula. The L appears with its arms at the front and right.":"В анимации показана формула линии. L появляется с палочками спереди и справа.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Для формулы L палочки должны смотреть назад и влево, поэтому сначала поверни верх дважды (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"Получилась линия? Держи её слева направо и сделай формулу линии ещё раз.","Corners do not matter yet. They get fixed in OLL 2.":"Углы пока не важны. Они исправятся в OLL 2.","Line":"Линия","Yellow line on top becomes a yellow cross.":"Жёлтая линия сверху становится жёлтым крестом.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Жёлтая линия сверху, держи её <b>слева направо<\/b>. Линия идёт спереди назад? Сначала поверни верх один раз (U).","L shape":"Буква L","Yellow L on top becomes a yellow cross.":"Жёлтая L сверху становится жёлтым крестом.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"Жёлтая L сверху, её палочки смотрят <b>назад и влево<\/b> (как 9 и 12 на часах). Смотрят в другую сторону? Крути только верх, пока не совпадёт.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Почти как формула линии, только в середине «U R U' R'» вместо «R U R' U'».","OLL 2 · yellow corners":"OLL 2 · жёлтые углы","Sune":"Sune","One yellow corner up. Looks like a fish.":"Один жёлтый угол вверх. Похоже на рыбку.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Жёлтый крест готов. Единственный угол жёлтым вверх — <b>спереди слева<\/b>. У переднего правого угла жёлтый <b>смотрит на тебя<\/b>.","You already know this one from beginner step 5.":"Ты уже знаешь его из шага 5 для новичков.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Один жёлтый угол вверх, рыбка в другую сторону. Sune задом наперёд.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Единственный угол жёлтым вверх — <b>сзади справа<\/b>. У переднего левого угла жёлтый <b>смотрит на тебя<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"Это Sune задом наперёд: читай Sune с конца, каждый поворот в другую сторону.","H (double headlights)":"H (двойные фары)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Ни одного жёлтого угла вверх. Две пары жёлтых смотрят наружу с противоположных сторон.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Жёлтые пары на <b>левой<\/b> и <b>правой<\/b> гранях.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Начинается как Sune, с лишним «R U' R' U» в середине.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Ни одного жёлтого угла вверх. Одна жёлтая пара на одной грани, два других угла смотрят в разные стороны.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"Жёлтая пара (фары) <b>слева<\/b>. Справа один жёлтый смотрит на тебя, а другой назад.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = поверни правую грань дважды. Держи ритм: R2 U' R2 U' R2.","Headlights":"Фары","Two yellow corners up next to each other, the other two look at you like headlights.":"Два жёлтых угла вверх рядом, два других смотрят на тебя, как фары.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Два угла жёлтым вверх <b>сзади<\/b>. Фары <b>смотрят на тебя<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"Поворот D ненадолго сдвигает белый слой. D' возвращает его.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Два жёлтых угла вверх рядом, два других смотрят в разные стороны.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Два угла жёлтым вверх <b>справа<\/b>. Слева один жёлтый смотрит на тебя, а другой назад.","Small r = turn the right face together with the middle slice.":"Маленькая r = поверни правую грань вместе со средним слоем.","Bowtie":"Бабочка","Two yellow corners up, diagonal from each other.":"Два жёлтых угла вверх, по диагонали друг от друга.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Углы жёлтым вверх <b>спереди слева<\/b> и <b>сзади справа<\/b>. У переднего правого угла жёлтый <b>смотрит на тебя<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"Средняя часть «r U R' U' r'» такая же, как в T.","PLL 1 · corners":"PLL 1 · углы","Headlights: T-perm":"Фары: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Меняет местами два соседних угла. Используй, когда на одной грани углы уже одного цвета (фары).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Крути верх, пока на одной грани не появятся <b>фары<\/b> (оба угла одного цвета). Держи эту грань <b>слева<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"PLL в 2 этапа (2-look): сначала поставь на место углы (2 случая), потом рёбра (4 случая).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"Он также меняет местами левое и правое рёбра. Это нормально, шаг с рёбрами это исправит.","Headlights on every side? Corners are done, go to the edges.":"Фары на каждой грани? Углы готовы, переходи к рёбрам.","No headlights: Y-perm":"Нет фар: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Меняет местами два угла по диагонали. Используй, когда фар нет ни на одной грани.","No headlights on any side. Hold it any way round.":"Фар нет ни на одной грани. Держи кубик как угодно.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Это две части в стиле OLL подряд. Учи по половинкам: «F R U' R' U' R U R' F'» и «R U R' U' R' F R F'».","PLL 2 · edges":"PLL 2 · рёбра","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Собранный блок перед тобой. <b>Левое<\/b> ребро должно уйти <b>вправо<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Углы готовы. Собранная грань (целый блок) <b>перед тобой<\/b>. <b>Левое<\/b> ребро должно быть <b>справа<\/b>: оно уходит вправо, правое ребро — назад, заднее ребро — влево.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"После формулы весь верх сбит на пол-оборота. Последний U2 выравнивает его с центрами.","The front block never changes. Only the left, right and back edges go round.":"Передний блок не меняется. По кругу ходят только левое, правое и заднее рёбра.","Right edge needs to go left instead? That is the Ub-perm.":"Правое ребро должно уйти влево? Это Ub-perm.","Lined up":"Выровнено","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Собранный блок перед тобой. <b>Правое<\/b> ребро должно уйти <b>влево<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Углы готовы. Собранный блок <b>перед тобой<\/b>. <b>Правое<\/b> ребро должно быть <b>слева<\/b>: оно уходит влево, левое ребро — назад, заднее ребро — вправо.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = поверни правую грань три раза. Итог тот же, что у R', но три быстрых поворота держат ритм.","The front block never moves. Only the left, right and back edges go round.":"Передний блок не двигается. По кругу ходят только левое, правое и заднее рёбра.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Меняет местами противоположные рёбра: переднее с задним, левое с правым.","Corners done, every edge is opposite its centre. Any way round.":"Углы готовы, каждое ребро стоит напротив своего центра. Держи как угодно.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = средний слой между L и R, крутится как L. M2 = дважды.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Меняет местами соседние рёбра: переднее с правым, заднее с левым.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Углы готовы. Переставленные пары <b>спереди справа<\/b> и <b>сзади слева<\/b>.","The last U lines the top back up with the centres.":"Последний U снова выравнивает верх с центрами.","F2L 1":"F2L 1","Case 1":"Случай 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Угол в слоте, белым вниз. Ребро в слоте, перевёрнуто.","F2L 2":"F2L 2","Case 2":"Случай 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"Угол в слоте, белым вниз. Ребро сверху спереди, зелёным наружу.","F2L 3":"F2L 3","Case 3":"Случай 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"Угол в слоте, белым вниз. Ребро сверху справа, зелёным вверх.","F2L 4":"F2L 4","Case 4":"Случай 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"Угол в слоте, белым к тебе. Ребро в слоте, стоит правильно.","F2L 5":"F2L 5","Case 5":"Случай 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"Угол в слоте, белым к тебе. Ребро в слоте, перевёрнуто.","F2L 6":"F2L 6","Case 6":"Случай 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"Угол в слоте, белым к тебе. Ребро сверху спереди, зелёным наружу.","F2L 7":"F2L 7","Case 7":"Случай 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"Угол в слоте, белым к тебе. Ребро сверху справа, зелёным вверх.","F2L 8":"F2L 8","Case 8":"Случай 8","Corner in the slot, white facing right. The edge in the slot, the right way round.":"Угол в слоте, белым вправо. Ребро в слоте, стоит правильно.","F2L 9":"F2L 9","Case 9":"Случай 9","Corner in the slot, white facing right. The edge in the slot, flipped.":"Угол в слоте, белым вправо. Ребро в слоте, перевёрнуто.","F2L 10":"F2L 10","Case 10":"Случай 10","Corner in the slot, white facing right. The edge on top at the front, green facing out.":"Угол в слоте, белым вправо. Ребро сверху спереди, зелёным наружу.","F2L 11":"F2L 11","Case 11":"Случай 11","Corner in the slot, white facing right. The edge on top at the right, green on top.":"Угол в слоте, белым вправо. Ребро сверху справа, зелёным вверх.","F2L 12":"F2L 12","Case 12":"Случай 12","Corner on top above the slot, white facing up. The edge in the slot, the right way round.":"Угол сверху над слотом, белым вверх. Ребро в слоте, стоит правильно.","F2L 13":"F2L 13","Case 13":"Случай 13","Corner on top above the slot, white facing up. The edge in the slot, flipped.":"Угол сверху над слотом, белым вверх. Ребро в слоте, перевёрнуто.","F2L 14":"F2L 14","Case 14":"Случай 14","Corner on top above the slot, white facing up. The edge on top at the front, green facing out.":"Угол сверху над слотом, белым вверх. Ребро сверху спереди, зелёным наружу.","F2L 15":"F2L 15","Case 15":"Случай 15","Corner on top above the slot, white facing up. The edge on top at the left, green facing out.":"Угол сверху над слотом, белым вверх. Ребро сверху слева, зелёным наружу.","F2L 16":"F2L 16","Case 16":"Случай 16","Corner on top above the slot, white facing up. The edge on top at the back, green facing out.":"Угол сверху над слотом, белым вверх. Ребро сверху сзади, зелёным наружу.","F2L 17":"F2L 17","Case 17":"Случай 17","Corner on top above the slot, white facing up. The edge on top at the right, green facing out.":"Угол сверху над слотом, белым вверх. Ребро сверху справа, зелёным наружу.","F2L 18":"F2L 18","Case 18":"Случай 18","Corner on top above the slot, white facing up. The edge on top at the front, green on top.":"Угол сверху над слотом, белым вверх. Ребро сверху спереди, зелёным вверх.","F2L 19":"F2L 19","Case 19":"Случай 19","Corner on top above the slot, white facing up. The edge on top at the left, green on top.":"Угол сверху над слотом, белым вверх. Ребро сверху слева, зелёным вверх.","F2L 20":"F2L 20","Case 20":"Случай 20","Corner on top above the slot, white facing up. The edge on top at the back, green on top.":"Угол сверху над слотом, белым вверх. Ребро сверху сзади, зелёным вверх.","F2L 21":"F2L 21","Case 21":"Случай 21","Corner on top above the slot, white facing up. The edge on top at the right, green on top.":"Угол сверху над слотом, белым вверх. Ребро сверху справа, зелёным вверх.","F2L 22":"F2L 22","Case 22":"Случай 22","Corner on top above the slot, white facing you. The edge in the slot, the right way round.":"Угол сверху над слотом, белым к тебе. Ребро в слоте, стоит правильно.","F2L 23":"F2L 23","Case 23":"Случай 23","Corner on top above the slot, white facing you. The edge in the slot, flipped.":"Угол сверху над слотом, белым к тебе. Ребро в слоте, перевёрнуто.","F2L 24":"F2L 24","Case 24":"Случай 24","Corner on top above the slot, white facing you. The edge on top at the front, green facing out.":"Угол сверху над слотом, белым к тебе. Ребро сверху спереди, зелёным наружу.","F2L 25":"F2L 25","Case 25":"Случай 25","Corner on top above the slot, white facing you. The edge on top at the left, green facing out.":"Угол сверху над слотом, белым к тебе. Ребро сверху слева, зелёным наружу.","F2L 26":"F2L 26","Case 26":"Случай 26","Corner on top above the slot, white facing you. The edge on top at the back, green facing out.":"Угол сверху над слотом, белым к тебе. Ребро сверху сзади, зелёным наружу.","F2L 27":"F2L 27","Case 27":"Случай 27","Corner on top above the slot, white facing you. The edge on top at the right, green facing out.":"Угол сверху над слотом, белым к тебе. Ребро сверху справа, зелёным наружу.","F2L 28":"F2L 28","Case 28":"Случай 28","Corner on top above the slot, white facing you. The edge on top at the front, green on top.":"Угол сверху над слотом, белым к тебе. Ребро сверху спереди, зелёным вверх.","F2L 29":"F2L 29","Case 29":"Случай 29","Corner on top above the slot, white facing you. The edge on top at the left, green on top.":"Угол сверху над слотом, белым к тебе. Ребро сверху слева, зелёным вверх.","F2L 30":"F2L 30","Case 30":"Случай 30","Corner on top above the slot, white facing you. The edge on top at the back, green on top.":"Угол сверху над слотом, белым к тебе. Ребро сверху сзади, зелёным вверх.","F2L 31":"F2L 31","Case 31":"Случай 31","Corner on top above the slot, white facing you. The edge on top at the right, green on top.":"Угол сверху над слотом, белым к тебе. Ребро сверху справа, зелёным вверх.","F2L 32":"F2L 32","Case 32":"Случай 32","Corner on top above the slot, white facing right. The edge in the slot, the right way round.":"Угол сверху над слотом, белым вправо. Ребро в слоте, стоит правильно.","F2L 33":"F2L 33","Case 33":"Случай 33","Corner on top above the slot, white facing right. The edge in the slot, flipped.":"Угол сверху над слотом, белым вправо. Ребро в слоте, перевёрнуто.","F2L 34":"F2L 34","Case 34":"Случай 34","Corner on top above the slot, white facing right. The edge on top at the front, green facing out.":"Угол сверху над слотом, белым вправо. Ребро сверху спереди, зелёным наружу.","F2L 35":"F2L 35","Case 35":"Случай 35","Corner on top above the slot, white facing right. The edge on top at the left, green facing out.":"Угол сверху над слотом, белым вправо. Ребро сверху слева, зелёным наружу.","F2L 36":"F2L 36","Case 36":"Случай 36","Corner on top above the slot, white facing right. The edge on top at the back, green facing out.":"Угол сверху над слотом, белым вправо. Ребро сверху сзади, зелёным наружу.","F2L 37":"F2L 37","Case 37":"Случай 37","Corner on top above the slot, white facing right. The edge on top at the right, green facing out.":"Угол сверху над слотом, белым вправо. Ребро сверху справа, зелёным наружу.","F2L 38":"F2L 38","Case 38":"Случай 38","Corner on top above the slot, white facing right. The edge on top at the front, green on top.":"Угол сверху над слотом, белым вправо. Ребро сверху спереди, зелёным вверх.","F2L 39":"F2L 39","Case 39":"Случай 39","Corner on top above the slot, white facing right. The edge on top at the left, green on top.":"Угол сверху над слотом, белым вправо. Ребро сверху слева, зелёным вверх.","F2L 40":"F2L 40","Case 40":"Случай 40","Corner on top above the slot, white facing right. The edge on top at the back, green on top.":"Угол сверху над слотом, белым вправо. Ребро сверху сзади, зелёным вверх.","F2L 41":"F2L 41","Case 41":"Случай 41","Corner on top above the slot, white facing right. The edge on top at the right, green on top.":"Угол сверху над слотом, белым вправо. Ребро сверху справа, зелёным вверх.","OLL 1":"OLL 1","No yellow edges and no yellow corners on top.":"Сверху нет ни жёлтых рёбер, ни жёлтых углов.","OLL 2":"OLL 2","OLL 3":"OLL 3","No yellow edges and 1 yellow corner on top.":"Сверху нет жёлтых рёбер и 1 жёлтый угол.","OLL 4":"OLL 4","OLL 5":"OLL 5","2 yellow edges and 1 yellow corner on top.":"Сверху 2 жёлтых ребра и 1 жёлтый угол.","OLL 6":"OLL 6","OLL 7":"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"Сверху нет жёлтых рёбер и 2 жёлтых угла.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"Сверху нет жёлтых рёбер и 4 жёлтых угла.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"Сверху 4 жёлтых ребра и ни одного жёлтого угла.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"Сверху 4 жёлтых ребра и 2 жёлтых угла.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"Сверху 4 жёлтых ребра и 1 жёлтый угол.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"Сверху 2 жёлтых ребра и 4 жёлтых угла.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"Сверху 2 жёлтых ребра и 2 жёлтых угла.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Случай 42","OLL 43":"OLL 43","Case 43":"Случай 43","OLL 44":"OLL 44","Case 44":"Случай 44","OLL 45":"OLL 45","Case 45":"Случай 45","OLL 46":"OLL 46","Case 46":"Случай 46","OLL 47":"OLL 47","Case 47":"Случай 47","2 yellow edges and no yellow corners on top.":"Сверху 2 жёлтых ребра и ни одного жёлтого угла.","OLL 48":"OLL 48","Case 48":"Случай 48","OLL 49":"OLL 49","Case 49":"Случай 49","OLL 50":"OLL 50","Case 50":"Случай 50","OLL 51":"OLL 51","Case 51":"Случай 51","OLL 52":"OLL 52","Case 52":"Случай 52","OLL 53":"OLL 53","Case 53":"Случай 53","OLL 54":"OLL 54","Case 54":"Случай 54","OLL 55":"OLL 55","Case 55":"Случай 55","OLL 56":"OLL 56","Case 56":"Случай 56","OLL 57":"OLL 57","Case 57":"Случай 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Шаг 1a · белый слой","Corner above its spot, white facing right":"Угол над своим местом, белым вправо","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Как шаг 2a на 3x3. Три поворота, и белый угол встаёт на место.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<
