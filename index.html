:"OLL 7","OLL 8":"OLL 8","OLL 9":"OLL 9","OLL 10":"OLL 10","OLL 11":"OLL 11","OLL 12":"OLL 12","OLL 13":"OLL 13","OLL 14":"OLL 14","OLL 15":"OLL 15","OLL 16":"OLL 16","OLL 17":"OLL 17","No yellow edges and 2 yellow corners on top.":"لا حواف صفراء، وزاويتان صفراوان في الأعلى.","OLL 18":"OLL 18","OLL 19":"OLL 19","OLL 20":"OLL 20","No yellow edges and 4 yellow corners on top.":"لا حواف صفراء، و4 زوايا صفراء في الأعلى.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"4 حواف صفراء ولا زوايا صفراء في الأعلى.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"4 حواف صفراء وزاويتان صفراوان في الأعلى.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"4 حواف صفراء وزاوية صفراء واحدة في الأعلى.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"حافتان صفراوان و4 زوايا صفراء في الأعلى.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"حافتان صفراوان وزاويتان صفراوان في الأعلى.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"الحالة 42","OLL 43":"OLL 43","Case 43":"الحالة 43","OLL 44":"OLL 44","Case 44":"الحالة 44","OLL 45":"OLL 45","Case 45":"الحالة 45","OLL 46":"OLL 46","Case 46":"الحالة 46","OLL 47":"OLL 47","Case 47":"الحالة 47","2 yellow edges and no yellow corners on top.":"حافتان صفراوان ولا زوايا صفراء في الأعلى.","OLL 48":"OLL 48","Case 48":"الحالة 48","OLL 49":"OLL 49","Case 49":"الحالة 49","OLL 50":"OLL 50","Case 50":"الحالة 50","OLL 51":"OLL 51","Case 51":"الحالة 51","OLL 52":"OLL 52","Case 52":"الحالة 52","OLL 53":"OLL 53","Case 53":"الحالة 53","OLL 54":"OLL 54","Case 54":"الحالة 54","OLL 55":"OLL 55","Case 55":"الحالة 55","OLL 56":"OLL 56","Case 56":"الحالة 56","OLL 57":"OLL 57","Case 57":"الحالة 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · الخطوة 1a · الطبقة البيضاء","Corner above its spot, white facing right":"الزاوية فوق مكانها، والأبيض لليمين","Same as 3x3 step 2a. Three turns and the white corner drops in.":"مثل الخطوة 2a في 3x3. ثلاث حركات وتنزل الزاوية البيضاء في مكانها.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>الأبيض في الأسفل<\/b>. مكعب 2x2 ليس فيه مراكز: الزاوية البيضاء <b>الأولى<\/b> يمكن وضعها في أي مكان. كل زاوية بعدها توضع حيث <b>تطابق ألوانها الجانبية الزوايا البيضاء المجاورة لها<\/b>. هنا: الزاوية <b>فوق مكانها<\/b> في الأمام يمينًا، والأبيض <b>متجه لليمين<\/b>.","Not above its spot yet? Turn the top until it is.":"ليست فوق مكانها بعد؟ أدِر الوجه العلوي حتى تصبح.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"الزاوية موجودة في الأسفل لكن في مكان خاطئ أو ملتوية؟ ضعها في الأمام يمينًا ونفّذ Righty مرة لإخراجها.","Righty once works here too.":"تنفيذ Righty مرة واحدة ينجح هنا أيضًا.","2x2 · Step 1b · white layer":"2x2 · الخطوة 1b · الطبقة البيضاء","Corner above its spot, white facing you":"الزاوية فوق مكانها، والأبيض باتجاهك","Same as 3x3 step 2b: white facing you, so use the front face.":"مثل الخطوة 2b في 3x3: الأبيض باتجاهك، لذا استخدم الوجه الأمامي.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"الأبيض في الأسفل. الزاوية البيضاء <b>فوق مكانها<\/b> في الأمام يمينًا، والأبيض <b>باتجاهك<\/b>.","Righty five times also does it.":"تنفيذ Righty خمس مرات ينجح أيضًا.","2x2 · Step 1c · white layer":"2x2 · الخطوة 1c · الطبقة البيضاء","Corner above its spot, white facing up":"الزاوية فوق مكانها، والأبيض للأعلى","Same as 3x3 step 2c: Righty three times.":"مثل الخطوة 2c في 3x3: Righty ثلاث مرات.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"الأبيض في الأسفل. الزاوية البيضاء <b>فوق مكانها<\/b> في الأمام يمينًا، والأبيض <b>متجه للأعلى<\/b>. نفّذ Righty حتى يتجه الأبيض للأسفل.","Any white corner works with Righty alone: 1, 3 or 5 times.":"أي زاوية بيضاء تُحل بـ Righty وحدها: 1 أو 3 أو 5 مرات.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"افعل هذا مع الزوايا البيضاء الأربع. تكتمل الطبقة البيضاء عندما تطابق الألوان الجانبية لكل زاوية بيضاء الألوان المجاورة لها.","2x2 · Step 2 · yellow corners":"2x2 · الخطوة 2 · الزوايا الصفراء","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"مثل الخطوة 6 في 3x3. تنقل ثلاث زوايا علوية بحيث تستقر كل زاوية فوق الزاوية البيضاء المطابقة لها. الالتواء لا يهم بعد.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"الطبقة البيضاء جاهزة في الأسفل. تكون الزاوية العلوية <b>في مكانها<\/b> عندما تطابق ألوانها الجانبية الزوايا البيضاء تحتها (لا بأس إن كانت ملتوية). أدِر الوجه العلوي حتى تكون <b>زاوية واحدة بالضبط<\/b> في مكانها، وضعها في <b>الأمام يسارًا<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"الزاوية الأمامية اليسرى تبقى مكانها، والثلاث الأخرى تدور. قد تحتاج إلى تنفيذها مرتين.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"لا توجد إدارة للوجه العلوي تعطي زاوية واحدة بالضبط في مكانها؟ نفّذها مرة من أي وضع، ثم انظر مجددًا. هذا قد يحدث في 2x2، لكنه لا يحدث أبدًا في 3x3.","All four in place? Go to step 3.":"الأربع كلها في أماكنها؟ انتقل إلى الخطوة 3.","2x2 · Step 3 · finish":"2x2 · الخطوة 3 · الإنهاء","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"مثل الخطوة 7 في 3x3. الأصفر للأسفل، والزاوية الملتوية في الأسفل من الأمام يمينًا. الأصفر إلى الجانب: Righty مرتين. الأصفر باتجاهك: Righty 4 مرات. ثم أدِر الوجه السفلي (D) إلى الزاوية التالية.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>اقلب المكعب: الأصفر في الأسفل.<\/b> ضع زاوية ملتوية في <b>الأسفل من الأمام يمينًا<\/b> وانظر أين يشير ملصقها الأصفر:<ul class=\"rule\"><li>الأصفر <b>إلى الجانب<\/b> (اليمين) &rarr; Righty <b>مرتين<\/b><\/li><li>الأصفر <b>باتجاهك<\/b> &rarr; Righty <b>4 مرات<\/b><\/li><li>الأصفر <b>للأسفل<\/b> &rarr; هذه الزاوية جاهزة<\/li><\/ul>ثم أدِر <b>الطبقة السفلى فقط (D)<\/b> لتأتي بالزاوية الملتوية التالية إلى هناك. لا تُدِر المكعب كله أبدًا.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"تبدو الطبقة البيضاء مبعثرة في المنتصف. استمر، ستعود كما كانت عندما تنتهي من آخر زاوية.","At the end, turn one layer until the two layers line up. Solved!":"في النهاية، أدِر طبقة واحدة حتى تصطف الطبقتان. تم الحل!","2x2 · Orientation 1 of 3":"2x2 · التوجيه 1/3","Sune: one yellow corner up":"Sune: زاوية صفراء واحدة للأعلى","One yellow corner up. Makes the top yellow, or another case you then fix.":"زاوية صفراء واحدة للأعلى. تجعل الوجه العلوي أصفر، أو تعطيك حالة أخرى تصلحها بعدها.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"الطبقة البيضاء جاهزة في الأسفل. ضع الزاوية التي أصفرها للأعلى في <b>الأمام يسارًا<\/b>. الزاوية الأمامية اليمنى يظهر أصفرها <b>باتجاهك<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"زاويتان صفراوان للأعلى؟ أمسك المكعب بحيث يظهر أصفر الزاوية الأمامية اليسرى باتجاهك، ونفّذ Sune، ثم انظر مجددًا.","It never takes more than three orientation algorithms in a row.":"لن تحتاج أبدًا إلى أكثر من ثلاث خوارزميات توجيه متتالية.","2x2 · Orientation 2 of 3":"2x2 · التوجيه 2/3","Antisune: one yellow corner up, other way":"Antisune: زاوية صفراء واحدة للأعلى، بالاتجاه الآخر","One yellow corner up, the other way round from the Sune.":"زاوية صفراء واحدة للأعلى، لكن بعكس اتجاه Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"ضع الزاوية التي أصفرها للأعلى في <b>الخلف يمينًا<\/b>. الزاوية الأمامية اليسرى يظهر أصفرها <b>باتجاهك<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"إن لم تطابق صورة Sune ولا صورة Antisune، أدِر الوجه العلوي وانظر مجددًا.","2x2 · Orientation 3 of 3":"2x2 · التوجيه 3/3","Pi: no yellow corner up":"Pi: لا زاوية صفراء للأعلى","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"لا توجد زاوية صفراء للأعلى. بعدها يصبح كل الأصفر للأعلى، أو تحصل على حالة Sune أو Antisune.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"لا أصفر في الأعلى. أمسك المكعب بحيث تُظهر الزاويتان <b>اليسريان<\/b> أصفرهما <b>على اليسار<\/b>.","Yellow pairs on the left and on the right? Hold either pair on the left.":"أزواج صفراء على اليسار وعلى اليمين؟ ضع أيًّا من الزوجين على اليسار.","R2 = turn the right side twice.":"R2 = أدِر الوجه الأيمن مرتين.","2x2 · Permutation 1 of 2":"2x2 · الترتيب 1/2","T-perm: headlights on one side":"T-perm: مصابيح أمامية على جانب واحد","All yellow is up. Swaps two corners next to each other.":"كل الأصفر للأعلى. تبدّل زاويتين متجاورتين.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"ابحث عن <b>مصابيح أمامية<\/b>: جانب يكون فيه الملصقان العلويان باللون نفسه. ضع هذا الجانب على <b>اليسار<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"مصابيح أمامية على كل جانب؟ لا شيء لتبديله: فقط أدِر الوجه العلوي ليصطف.","After the T-perm, turn the top until the cube is solved.":"بعد T-perm، أدِر الوجه العلوي حتى يُحل المكعب.","2x2 · Permutation 2 of 2":"2x2 · الترتيب 2/2","Y-perm: no headlights":"Y-perm: بلا مصابيح أمامية","All yellow is up but no side has headlights. Swaps two corners diagonally.":"كل الأصفر للأعلى، لكن لا يوجد جانب فيه مصابيح أمامية. تبدّل زاويتين قطريًا.","No headlights anywhere. Hold it any way round.":"لا مصابيح أمامية في أي مكان. أمسك المكعب بأي اتجاه.","After the Y-perm, turn the top until the cube is solved.":"بعد Y-perm، أدِر الوجه العلوي حتى يُحل المكعب.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"تعلّمها على نصفين: «F R U' R' U' R U R' F'» و«R U R' U' R' F R F'».","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"تجعل كل الأصفر للأعلى. الوجه الأبيض يبقى في الأسفل.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"زاوية صفراء واحدة للأعلى في <b>الأمام يسارًا<\/b>. الزاوية الأمامية اليمنى يظهر أصفرها <b>باتجاهك<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"الوجه الأبيض في الأسفل أولًا: يكفي أن يكون الأبيض للأسفل، والجوانب يمكن أن تكون مختلطة.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"زاوية صفراء واحدة للأعلى في <b>الخلف يمينًا<\/b>. الزاوية الأمامية اليسرى يظهر أصفرها <b>باتجاهك<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"لا توجد زاوية صفراء للأعلى. أزواج صفراء على الجانبين <b>الأيسر<\/b> و<b>الأيمن<\/b>.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"لا توجد زاوية صفراء للأعلى. زوج أصفر على <b>اليسار<\/b>؛ وعلى اليمين أصفر واحد باتجاهك وآخر للخلف.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"زاويتان صفراوان للأعلى في <b>الخلف<\/b>. الأخريان يظهر أصفرهما <b>باتجاهك<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"زاويتان صفراوان للأعلى على <b>اليمين<\/b>. على اليسار أصفر واحد باتجاهك وآخر للخلف.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"الزاويتان الصفراوان للأعلى في <b>الأمام يسارًا<\/b> و<b>الخلف يمينًا<\/b>. الزاوية الأمامية اليمنى يظهر أصفرها <b>باتجاهك<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"الأعلى: مصابيح أمامية، الأسفل: جاهز","All yellow up, all white down. Fixes both layers at once.":"كل الأصفر للأعلى، وكل الأبيض للأسفل. تصلح الطبقتين معًا.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"الطبقة العليا: مصابيح أمامية على <b>اليسار<\/b>. الطبقة السفلى: صحيحة مسبقًا.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>المصابيح الأمامية<\/b> = جانب يكون فيه ملصقا تلك الطبقة باللون نفسه.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"الأعلى صحيح لكن الأسفل خاطئ؟ اقلب المكعب كله لتصبح الطبقة الخاطئة في الأعلى، ثم استخدم البطاقة 1 أو 2.","After the algorithm, turn the top and bottom until the cube is solved.":"بعد الخوارزمية، أدِر الوجهين العلوي والسفلي حتى يُحل المكعب.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"الأعلى: بلا مصابيح أمامية، الأسفل: جاهز","Top layer: no headlights. Bottom layer: already right.":"الطبقة العليا: بلا مصابيح أمامية. الطبقة السفلى: صحيحة مسبقًا.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"الطبقتان: مصابيح أمامية","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"مصابيح أمامية في <b>الطبقتين<\/b>. أدِر الوجهين العلوي والسفلي حتى تكون كلتاهما في <b>الأمام<\/b>.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"الطبقتان: بلا مصابيح أمامية","No headlights in either layer. Hold it any way round.":"لا مصابيح أمامية في أي من الطبقتين. أمسك المكعب بأي اتجاه.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"الأعلى: مصابيح أمامية، الأسفل: لا يوجد","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"الطبقة العليا: مصابيح أمامية في <b>الأمام<\/b>. الطبقة السفلى: بلا مصابيح أمامية.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"الأعلى: لا يوجد، الأسفل: مصابيح أمامية","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"الطبقة العليا: بلا مصابيح أمامية. الطبقة السفلى: مصابيح أمامية في <b>الخلف<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · الخطوة 1 · الرؤوس","Turn the tips":"أدِر الرؤوس","The easiest step: each tip turns on its own.":"أسهل خطوة: كل رأس يدور وحده.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"أدِر كل رأس (<b>u l r b<\/b>) حتى تطابق ألوانه الثلاثة <b>المراكز الثلاثة<\/b> المجاورة له مباشرة.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"للرأس ثلاثة ألوان. كل لون يجب أن يطابق المثلث المركزي الذي تحته مباشرة على الوجه نفسه.","Turning a tip never moves anything else, so you can always fix the tips first.":"إدارة الرأس لا تحرّك أي شيء آخر أبدًا، لذا يمكنك دائمًا إصلاح الرؤوس أولًا.","Pyraminx · Step 2 · centres":"Pyraminx · الخطوة 2 · المراكز","Match the centres":"طابِق المراكز","Turn whole corners until every face has three centres of the same colour.":"أدِر الزوايا الكاملة حتى يكون في كل وجه ثلاثة مراكز باللون نفسه.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"أدِر الزوايا الكاملة (<b>U L R B<\/b>) حتى تُظهر <b>المراكز الثلاثة<\/b> في كل وجه اللون نفسه. ثم أمسك اللغز و<b>الوجه الأصفر في الأسفل<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"كل زاوية تحمل معها رأسها ومراكزها الثلاثة، لذا تبقى الخطوة 1 مكتملة.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"الحواف تختلط أثناء ذلك. لا بأس، الخطوتان 3 و4 تصلحانها.","Pyraminx · Step 3a · bottom edges":"Pyraminx · الخطوة 3a · الحواف السفلية","Edge on the right, yellow facing you":"الحافة على اليمين، والأصفر باتجاهك","Puts the green-yellow edge into the front bottom.":"تضع الحافة الخضراء الصفراء في الأسفل من الأمام.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"الوجه الأصفر في الأسفل. الحافة التي مكانها في <b>الأسفل من الأمام<\/b> موجودة على الضلع <b>الأمامي الأيمن<\/b>، والأصفر <b>باتجاهك<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"أدِر اللغز كله (يبقى الأصفر في الأسفل) حتى يصبح المكان الذي تريد ملأه في الأسفل من الأمام.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"الحافة موجودة في الأسفل لكن في مكان خاطئ أو مقلوبة؟ ضع ذلك المكان في الأسفل من الأمام ونفّذ هذه الخوارزمية مرة لرفع الحافة.","Pyraminx · Step 3b · bottom edges":"Pyraminx · الخطوة 3b · الحواف السفلية","Edge on the right, yellow facing right":"الحافة على اليمين، والأصفر لليمين","Same edge, the other way round.":"الحافة نفسها، بالاتجاه الآخر.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"الحافة موجودة على الضلع <b>الأمامي الأيمن<\/b>، والأصفر متجه <b>لليمين<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · الخطوة 3c · الحواف السفلية","Edge on the left, yellow facing you":"الحافة على اليسار، والأصفر باتجاهك","The edge is on the left side.":"الحافة على الجهة اليسرى.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"الحافة موجودة على الضلع <b>الأمامي الأيسر<\/b>، والأصفر <b>باتجاهك<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · الخطوة 3d · الحواف السفلية","Edge on the left, yellow facing left":"الحافة على اليسار، والأصفر لليسار","Mirror of 3b.":"صورة 3b في المرآة.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"الحافة موجودة على الضلع <b>الأمامي الأيسر<\/b>، والأصفر متجه <b>لليسار<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · الخطوة 3e · الحواف السفلية","Edge at the back, yellow facing right":"الحافة في الخلف، والأصفر لليمين","The edge is on the back edge.":"الحافة على الضلع الخلفي.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"الحافة موجودة على الضلع <b>الخلفي<\/b>، والأصفر متجه <b>لليمين<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · الخطوة 3f · الحواف السفلية","Edge at the back, yellow facing left":"الحافة في الخلف، والأصفر لليسار","Mirror of 3e.":"صورة 3e في المرآة.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"الحافة موجودة على الضلع <b>الخلفي<\/b>، والأصفر متجه <b>لليسار<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"افعل هذا مع الحواف السفلية الثلاث. يكتمل الوجه الأصفر عندما تطابق كل حافة سفلية المراكز على جانبيها.","Pyraminx · Step 4a · last edges":"Pyraminx · الخطوة 4a · الحواف الأخيرة","Edges go round (one way)":"الحواف تدور (في اتجاه)","Moves the three top edges round.":"تنقل الحواف العلوية الثلاث بشكل دائري.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"الوجه الأصفر جاهز في الأسفل. <b>لا توجد<\/b> حافة علوية في مكانها. الحافة <b>الأمامية اليسرى<\/b> مكانها في <b>الأمام يمينًا<\/b>.","After it, two edges may be flipped. Then do 4c.":"بعدها قد تكون حافتان مقلوبتين. عندها نفّذ 4c.","You never need more than two algorithms for the last edges.":"لن تحتاج أبدًا إلى أكثر من خوارزميتين للحواف الأخيرة.","Pyraminx · Step 4b · last edges":"Pyraminx · الخطوة 4b · الحواف الأخيرة","Edges go round (other way)":"الحواف تدور (في الاتجاه الآخر)","Moves the three top edges round the other way.":"تنقل الحواف العلوية الثلاث بشكل دائري في الاتجاه الآخر.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>لا توجد<\/b> حافة علوية في مكانها. الحافة <b>الأمامية اليسرى<\/b> مكانها في <b>الخلف<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · الخطوة 4c · الحواف الأخيرة","Two edges flipped":"حافتان مقلوبتان","All three top edges are in their place, but two are flipped.":"الحواف العلوية الثلاث كلها في أماكنها، لكن اثنتين منها مقلوبتان.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"كل الحواف العلوية في أماكنها، واثنتان منها مقلوبتان. أمسك اللغز بحيث تكون <b>الحافة السليمة في الخلف<\/b>.","Solved!":"تم الحل!","4x4 · 1 · edge pairing":"4x4 · 1 · تجميع الحواف","Join two halves opposite each other":"اجمع نصفين متقابلين","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"حافة 4x4 لها نصفان. عندما يكون النصفان متقابلين، هذه الخوارزمية تجمعهما في حافة واحدة.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"المراكز جاهزة. نصفا حافة واحدة (هنا <b>الأزرق البرتقالي<\/b>) <b>متقابلان<\/b>: واحد في <b>أعلى الضلع الأمامي الأيسر<\/b>، وواحد في <b>أعلى الضلع الأمامي الأيمن<\/b>، و<b>البرتقالي باتجاهك<\/b> في الاثنين. فقط القطع الزرقاء البرتقالية ملوّنة، لتتمكن من تتبعها.","Joined! The blue-orange edge is now one piece, at the front right.":"تم الجمع! الحافة الزرقاء البرتقالية أصبحت قطعة واحدة، في الأمام يمينًا.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = الطبقتان العلويتان معًا. Uw' تنقل النصف الأيسر إلى اليمين، و Uw في النهاية تعيد المراكز إلى مكانها.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"الجزء الأوسط «R U R' F R' F' R» يُدخل حافة مكتملة مكانها، ليلتقي النصفان. باقي المكعب يختلط: لا بأس، ستحله مثل 3x3 بعد ذلك.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"اجمع الحواف الـ12 كلها بهذه الطريقة، ثم حل 4x4 مثل 3x3.","Edge joined":"تم جمع الحافة","4x4 · 1b · edge pairing":"4x4 · 1b · تجميع الحواف","Combine with the centre layer, then swap it out":"اجمع بالطبقة الداخلية، ثم بدّل الحافة للخارج","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"أدِر الطبقة الداخلية فقط لتجمع النصفين، وبدّل الحافة المجمّعة بحافة لم تُجمع بعد، ثم أعِد الطبقة الداخلية.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"المراكز جاهزة. نصفا حافة واحدة (هنا <b>الأزرق البرتقالي<\/b>) في وضع <b>قطري<\/b>: واحد <b>في الأعلى على الضلع الأمامي الأيسر<\/b> و<b>البرتقالي باتجاهك<\/b>، وواحد <b>في الأسفل على الضلع الأمامي الأيمن<\/b> و<b>الأزرق باتجاهك<\/b>. فقط القطع الزرقاء البرتقالية ملوّنة، لتتمكن من تتبعها.","Joined! The blue-orange edge is now one piece, at the top front.":"تم الجمع! الحافة الزرقاء البرتقالية أصبحت قطعة واحدة، في الأعلى من الأمام.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"لهذه الحركة اسم: <b>حركة الطبقة الداخلية<\/b> (slice move). حرف u الصغير يعني: أدِر <b>الطبقة الداخلية العليا فقط<\/b> (الطبقة الثانية من الأعلى). الطبقة العليا لا تتحرك.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = تلك الطبقة الداخلية تدور إلى اليمين (مثل U'). النصف العالي يذهب إلى اليمين ويستقر فوق النصف المنخفض: الحافة تجمّعت.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' ترفع الحافة المجمّعة إلى الأعلى وتضع مكانها حافة لم تُجمع بعد.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = أعِد الطبقة الداخلية، فتصبح المراكز محلولة من جديد. الحافة المجمّعة تبقى مجتمعة في الأعلى.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"إذا كان النصف المنخفض على اليسار والنصف العالي على اليمين، فأدِر الطبقة الداخلية في الاتجاه الآخر: u L' U' L u'.","Halves combined":"تجمّع النصفان","Swapped out":"تم التبديل","4x4 · 2 · OLL parity":"4x4 · 2 · تكافؤ OLL","No 3x3 OLL fits":"لا تناسبه أي OLL من 3x3","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"عندما <b>لا توجد خوارزمية 3x3<\/b> لوجهك العلوي، نفّذ هذه. يحدث هذا في 4x4 فقط: عدد فردي من الحواف العلوية مقلوب (1 أو 3)، كما في الصورة. هذه الخوارزمية تقلب الحافة الأمامية، فتعمل OLL العادية من 3x3 من جديد.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"الأصفر في الأعلى. كما في الصورة: <b>3 حواف مقلوبة<\/b> (الأمامية واليمنى والخلفية تُظهر لونها في الأعلى)، والحافة <b>اليسرى<\/b> فقط أصفرها في الأعلى. الصورة تُظهر الوجه العلوي من فوق، والأمام في الأسفل. ضع <b>حافة مقلوبة في الأمام<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"الآن عدد الحواف المقلوبة زوجي (الخلفية واليسرى)، والزاويتان الأماميتان ملتويتان: حالة 3x3 عادية من جديد. أنهِ بـ OLL و PLL المعتادتين من 3x3.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"كيف تكتشفها: عُدّ الحواف العلوية التي ليس أصفرها في الأعلى. 1 أو 3 = لا تناسب أي خوارزمية 3x3، فنفّذ هذه أولًا.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>الطبقتان على اليمين معًا<\/b> (حركة عريضة)، و Lw = الطبقتان على اليسار معًا. في كثير من الأوراق تُكتب بحرفي r و l صغيرين.","U2 and F2 turn only the outer top and front layer, twice.":"U2 و F2 تديران الطبقة الخارجية العليا والأمامية فقط، مرتين.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"الحافة الأمامية تنقلب. بعض القطع العلوية الأخرى تتحرك أيضًا: لا بأس، OLL و PLL المعتادتان من 3x3 تصلحانها.","4x4 · 3 · PLL parity":"4x4 · 3 · تكافؤ PLL","Two edges swapped":"حافتان متبادلتان","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"هذا أيضًا في 4x4 فقط: في النهاية تمامًا، تكون حافتان علويتان متقابلتان متبادلتين. هذه الخوارزمية تعيدهما.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"كل شيء محلول ما عدا الحافتين العلويتين <b>الأمامية<\/b> و<b>الخلفية<\/b>، فهما <b>متبادلتان<\/b>.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = الطبقتان العلويتان مرتين. Rw2 = الطبقتان على اليمين مرتين. r2 = الطبقة الثانية من اليمين فقط، مرتين.","Only these two edges change. Everything else stays where it is.":"تتغير هاتان الحافتان فقط. كل شيء آخر يبقى في مكانه.","Mirror cube · last layer":"Mirror cube · الطبقة الأخيرة","Three corners (A-perm)":"ثلاث زوايا (A-perm)","Moves three top corners around. Everything else stays where it is.":"تنقل ثلاث زوايا علوية بشكل دائري. كل شيء آخر يبقى في مكانه.","Beginner 3x3":"3x3 للمبتدئين","Beginner":"مبتدئ","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"طريقة المبتدئين الكلاسيكية. أمسك المكعب و<b>الأصفر في الأعلى<\/b> و<b>الأخضر باتجاهك<\/b>:\n       يُحل الأبيض أولًا في الأسفل، والأصفر أخيرًا في الأعلى. انقر على خطوة لتشاهد حركتها.","Intermediate 3x3":"3x3 للمستوى المتوسط","Intermediate":"متوسط","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"المستوى التالي: الصليب الأبيض كما من قبل، ثم <b>F2L<\/b> (الزاوية والحافة معًا)،\n       و<b>2-look OLL<\/b> (كل الأصفر في الأعلى) و<b>2-look PLL<\/b> (كل شيء في مكانه). طريقة المسك نفسها: الأصفر في الأعلى، والأخضر باتجاهك.","Advanced F2L (3x3)":"F2L متقدم (3x3)","Advanced F2L":"F2L متقدم","Advanced OLL (3x3)":"OLL متقدم (3x3)","Advanced OLL":"OLL متقدم","Advanced PLL (3x3)":"PLL متقدم (3x3)","Advanced PLL":"PLL متقدم","2x2 Beginner":"2x2 للمبتدئين","2x2 Intermediate":"2x2 للمستوى المتوسط","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"الطبقة البيضاء كما في طريقة المبتدئين. ثم <b>3 خوارزميات<\/b> تجعل الوجه العلوي كله أصفر، و<b>خوارزميتان<\/b> تضعان الزوايا في أماكنها.","2x2 Advanced":"2x2 للمستوى المتقدم","Advanced":"متقدم","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"طريقة <b>Ortega<\/b>. أولًا كوّن <b>الوجه الأبيض<\/b> في الأسفل (لا يلزم أن تتطابق الجوانب بعد). ثم إحدى <b>7 خوارزميات<\/b> تجعل كل الأصفر للأعلى، وإحدى <b>6 خوارزميات<\/b> تصلح الطبقتين معًا.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"ألغاز دوّارة ومكعبات كبيرة","push it up, away from you":"ادفعه للأعلى، بعيدًا عنك","pull it down, toward you":"اسحبه للأسفل، نحوك","swing it to the left":"حرّكه إلى اليسار","swing it to the right":"حرّكه إلى اليمين","turn it clockwise, like a clock":"أدِره مع عقارب الساعة","turn it anticlockwise":"أدِره عكس عقارب الساعة","push them up, away from you":"ادفعهما للأعلى، بعيدًا عنك","pull them down, toward you":"اسحبهما للأسفل، نحوك","turn them clockwise, like a clock":"أدِرهما مع عقارب الساعة","turn them anticlockwise":"أدِرهما عكس عقارب الساعة","swing them to the right":"حرّكهما إلى اليمين","swing them to the left":"حرّكهما إلى اليسار","clockwise as seen from behind":"مع عقارب الساعة إذا نظرت من الخلف","anticlockwise as seen from behind":"عكس عقارب الساعة إذا نظرت من الخلف","swing it to the right (like D)":"حرّكها إلى اليمين (مثل D)","turn it clockwise, like F":"أدِرها مع عقارب الساعة، مثل F","tip it so the front comes to the top":"اقلبه بحيث يأتي الوجه الأمامي إلى الأعلى","tip it so the top comes to the front":"اقلبه بحيث يأتي الوجه العلوي إلى الأمام","roll it to the right, like F":"دحرجه إلى اليمين، مثل F","roll it to the left":"دحرجه إلى اليسار","pull it down, toward you (like L)":"اسحبها للأسفل، نحوك (مثل L)","turn it so the right side faces you":"أدِره بحيث يصبح الوجه الأيمن باتجاهك","turn it so the left side faces you":"أدِره بحيث يصبح الوجه الأيسر باتجاهك","Right face":"الوجه الأيمن","Left face":"الوجه الأيسر","Top face":"الوجه العلوي","Bottom face":"الوجه السفلي","Front face":"الوجه الأمامي","Back face":"الوجه الخلفي","Whole cube":"المكعب كله","Right two layers":"الطبقتان على اليمين","Left two layers":"الطبقتان على اليسار","Front two layers":"الطبقتان الأماميتان","Bottom two layers":"الطبقتان السفليتان","Top two layers":"الطبقتان العلويتان","Back two layers":"الطبقتان الخلفيتان","Middle slice":"الطبقة الوسطى","Middle layer":"الطبقة الوسطى الأفقية","Front-back middle slice":"الطبقة الوسطى بين الأمام والخلف","Only the centre layer next to the right (slice move, the right layer stays still)":"الطبقة الداخلية المجاورة لليمين فقط (حركة طبقة داخلية، والطبقة اليمنى لا تتحرك)","Only the centre layer next to the left (slice move, the left layer stays still)":"الطبقة الداخلية المجاورة لليسار فقط (حركة طبقة داخلية، والطبقة اليسرى لا تتحرك)","Only the centre layer next to the top (slice move, the top layer stays still)":"الطبقة الداخلية المجاورة للأعلى فقط (حركة طبقة داخلية، والطبقة العليا لا تتحرك)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"الطبقة الداخلية المجاورة للأسفل فقط (حركة طبقة داخلية، والطبقة السفلى لا تتحرك)","Only the centre layer next to the front (slice move, the front layer stays still)":"الطبقة الداخلية المجاورة للأمام فقط (حركة طبقة داخلية، والطبقة الأمامية لا تتحرك)","Only the centre layer next to the back (slice move, the back layer stays still)":"الطبقة الداخلية المجاورة للخلف فقط (حركة طبقة داخلية، والطبقة الخلفية لا تتحرك)","Top corner with its layer":"الزاوية العليا مع طبقتها","Top tip only":"الرأس العلوي فقط","Left corner with its layer":"الزاوية اليسرى مع طبقتها","Left tip only":"الرأس الأيسر فقط","Right corner with its layer":"الزاوية اليمنى مع طبقتها","Right tip only":"الرأس الأيمن فقط","Back corner with its layer":"الزاوية الخلفية مع طبقتها","Back tip only":"الرأس الخلفي فقط","turn it clockwise, as you look at that corner":"أدِرها مع عقارب الساعة، وأنت تنظر إلى تلك الزاوية","turn it anticlockwise, as you look at that corner":"أدِرها عكس عقارب الساعة، وأنت تنظر إلى تلك الزاوية","{what}: half a turn (turn it twice)":"{what}: نصف دورة (أدِره مرتين)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: ثلاث حركات، والنتيجة مثل {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"الإنجليزية (المملكة المتحدة)","English (US)":"الإنجليزية (الولايات المتحدة)","Arabic":"العربية","Chinese":"الصينية","French":"الفرنسية","German":"الألمانية","Hindi":"الهندية","Korean":"الكورية","Portuguese":"البرتغالية","Russian":"الروسية","Spanish":"الإسبانية"}}/*I18N-END*/;

/* Light / dark switch. The choice is remembered in this browser; with no choice the system setting is used. */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{ saved=localStorage.getItem('theme'); }catch(e){}
  if(saved==='dark'||saved==='light') root.dataset.theme=saved;
  const isDark=()=>root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label=()=>{ btn.textContent=isDark() ? '\u2600\uFE0F '+tr('Light') : '\uD83C\uDF19 '+tr('Dark'); btn.setAttribute('aria-label', tr(isDark() ? 'Switch to light mode' : 'Switch to dark mode')); };
  refreshTheme=label;
  btn.onclick=()=>{ const next=isDark()?'light':'dark'; root.dataset.theme=next; try{ localStorage.setItem('theme',next); }catch(e){} label(); };
  label();
})();

/* ============================================================
   Cube engine (CSS frame: x right, y down, z toward viewer)
   Grip for the beginner method: yellow up, white down, green front,
   which puts orange on the right and red on the left.
   ============================================================ */

  reset(){ for(const c of this.cubies) c.M=c.M0; this.render(); }
  layer(m){ const i={x:0,y:1,z:2}[m.axis]; return this.cubies.filter(c=>m.layers.includes(Math.round(c.M[i][3]/this.h))); }
  apply(tok){ const m=parse4(tok), R=rot(m.axis,m.angle); for(const c of this.layer(m)) c.M=snapInt(mul(R,c.M)); this.render(); }
  applyAll(seq){ for(const t of seq) this.apply(t); }
  isSolved(){ return this.cubies.every(c=>JSON.stringify(c.M)===JSON.stringify(c.M0)); }
  animate(tok, dur){
    return new Promise(res=>{
      const m=parse4(tok), L=this.layer(m), t0=performance.now();
      const frame=now=>{
        if(this.dead) return res();
        const t=Math.min(1,(now-t0)/dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, R=rot(m.axis,m.angle*e);
        for(const c of L) c.el.style.transform=css(mul(R,c.M));
        if(t<1) requestAnimationFrame(frame); else { this.apply(tok); res(); }
      };
      requestAnimationFrame(frame);
    });
  }
}
function describe4(tok){
  const f=tok[0], w=tok.includes('w'), suf=tok.replace(/^[A-Za-z]w?/,''), F=f.toUpperCase();
  if('xyz'.includes(f)) return describe(tok);
  const what = tr(f!==F ? `Only the centre layer next to the ${FACE_NAME[F].toLowerCase()} (slice move, the ${FACE_NAME[F].toLowerCase()} layer stays still)` : w ? `${FACE_NAME[F]} two layers` : `${FACE_NAME[F]} face`);
  return suf==='2' ? fmt('{what}: half a turn (turn it twice)',{what}) : fmt('{what}: {hint}',{what, hint:tr(HINT[F+suf])});
}

function makeCube(scene, opts){
  const cube=document.createElement('div'); cube.className='cube'; scene.appendChild(cube);
  const S=Math.max(8, Math.floor(Math.min(scene.clientWidth, scene.clientHeight)/6.2));
  return opts.pyra ? new Pyra(cube, S, opts) : opts.four ? new Cube4(cube, S, opts) : new Cube(cube, S, opts);
}

  /* ---------------- 2x2 beginner: the corner steps of the 3x3 beginner method ---------------- */
  { id:'2x2-white-right', level:'2x2', step:'2x2 · Step 1a · white layer', title:'Corner above its spot, white facing right', moves:"R U R'", focus:'white', view:'below',
    purpose:'Same as 3x3 step 2a. Three turns and the white corner drops in.',
    hold:'<b>White on the bottom</b>. A 2x2 has no centres: the <b>first</b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it</b>. Here: the corner is <b>above its spot</b> at the front right, white <b>facing right</b>.',
    tips:['Not above its spot yet? Turn the top until it is.',
          'Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.',
          'Righty once works here too.'] },
  { id:'2x2-white-front', level:'2x2', step:'2x2 · Step 1b · white layer', title:'Corner above its spot, white facing you', moves:"F' U' F", focus:'white', view:'below',
    purpose:'Same as 3x3 step 2b: white facing you, so use the front face.',
    hold:'White on the bottom. The white corner is <b>above its spot</b> at the front right, white <b>facing you</b>.',
    tips:['Righty five times also does it.'] },
  { id:'2x2-white-up', level:'2x2', step:'2x2 · Step 1c · white layer', title:'Corner above its spot, white facing up', moves:"R U R' U' R U R' U' R U R' U'",
    groups:[["R U R' U'",4],["R U R' U'",4],["R U R' U'",4]], focus:'white', view:'below',
    purpose:'Same as 3x3 step 2c: Righty three times.',
    hold:'White on the bottom. The white corner is <b>above its spot</b> at the front right, white <b>facing up</b>. Do Righty until white faces down.',
    tips:['Any white corner works with Righty alone: 1, 3 or 5 times.',
          'Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.'] },
  { id:'2x2-niklas', level:'2x2', step:'2x2 · Step 2 · yellow corners', title:'Yellow corners into place (Niklas)', moves:"R U' L' U R' U' L U", focus:'all',
    purpose:'Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.',
    hold:'White layer done, on the bottom. A top corner is <b>in place</b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one</b> corner is in place and hold it at the <b>front left</b>.',
    tips:['The front-left corner stays put, the other three move round. You may need it twice.',
          'No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.',
          'All four in place? Go to step 3.'] },
  { id:'2x2-twist', level:'2x2', step:'2x2 · Step 3 · finish', title:'Twist the yellow corners', moves:"R U R' U' R U R' U' D R U R' U' R U R' U' R U R' U' R U R' U' D'",
    groups:[["R U R' U'",4],["R U R' U'",4],["D",1],["R U R' U'",4],["R U R' U'",4],["R U R' U'",4],["R U R' U'",4],["D'",1]],
    short:"R U R' U'", focus:'all', view:'below', flip:true,
    purpose:'Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.',
    hold:'<b>Flip the cube over: yellow on the bottom.</b> Put a twisted corner at the <b>bottom front right</b> and look where its yellow sticker points:'+
         '<ul class="rule"><li>Yellow facing <b>sideways</b> (right) &rarr; Righty <b>2 times</b></li>'+
         '<li>Yellow facing <b>you</b> &rarr; Righty <b>4 times</b></li>'+
         '<li>Yellow facing <b>down</b> &rarr; this corner is done</li></ul>'+
         'Then turn <b>only the bottom layer (D)</b> to bring the next twisted corner there. Never turn the whole cube.',
    tips:['The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.',
          'At the end, turn one layer until the two layers line up. Solved!'] },


  /* ---------------- 2x2 intermediate: 3 orientation + 2 permutation algorithms ---------------- */
  { id:'2x2-co-sune', level:'2x2-int', step:'2x2 · Orientation 1 of 3', title:'Sune: one yellow corner up', moves:"R U R' U R U2 R'", focus:'all', view:'top',
    purpose:'One yellow corner up. Makes the top yellow, or another case you then fix.',
    hold:'White layer done, on the bottom. Hold the yellow-up corner at the <b>front left</b>. The front-right corner shows yellow <b>facing you</b>.',
    tips:['Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.',
          'It never takes more than three orientation algorithms in a row.'] },
  { id:'2x2-co-antisune', level:'2x2-int', step:'2x2 · Orientation 2 of 3', title:'Antisune: one yellow corner up, other way', moves:"R U2 R' U' R U' R'", focus:'all', view:'top',
    purpose:'One yellow corner up, the other way round from the Sune.',
    hold:'Hold the yellow-up corner at the <b>back right</b>. The front-left corner shows yellow <b>facing you</b>.',
    tips:['If neither the Sune nor the Antisune picture fits, turn the top and look again.'] },
  { id:'2x2-co-pi', level:'2x2-int', step:'2x2 · Orientation 3 of 3', title:'Pi: no yellow corner up', moves:"R U2 R2 U' R2 U' R2 U2 R", focus:'all', view:'top',
    purpose:'No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.',
    hold:'No yellow on top. Hold the cube so both <b>left</b> corners show yellow <b>on the left</b>.',
    tips:['Yellow pairs on the left and on the right? Hold either pair on the left.',
          'R2 = turn the right side twice.'] },
  { id:'2x2-cp-t', level:'2x2-int', step:'2x2 · Permutation 1 of 2', title:'T-perm: headlights on one side', moves:"R U R' U' R' F R2 U' R' U' R U R' F'", focus:'all',
    purpose:'All yellow is up. Swaps two corners next to each other.',
    hold:'Look for <b>headlights</b>: a side where both top stickers are the same colour. Hold that side on the <b>left</b>.',
    tips:['Headlights on every side? Nothing to swap: just turn the top to line it up.',
          'After the T-perm, turn the top until the cube is solved.'] },
  { id:'2x2-cp-y', level:'2x2-int', step:'2x2 · Permutation 2 of 2', title:'Y-perm: no headlights', moves:"F R U' R' U' R U R' F' R U R' U' R' F R F'", focus:'all',
    purpose:'All yellow is up but no side has headlights. Swaps two corners diagonally.',
    hold:'No headlights anywhere. Hold it any way round.',
    tips:['After the Y-perm, turn the top until the cube is solved.',
          'Learn it in two halves: "F R U\' R\' U\' R U R\' F\'" and "R U R\' U\' R\' F R F\'".'] },

  /* ---------------- 2x2 advanced: Ortega (7 OLL + 6 PBL) ---------------- */
  { id:'2x2-oll-sune', level:'2x2-adv', step:'2x2 · OLL 1 of 7', title:'Sune', moves:"R U R' U R U2 R'", focus:'all', view:'top',

  { id:'2x2-oll-U', level:'2x2-adv', step:'2x2 · OLL 5 of 7', title:'Headlights', moves:"R2 D R' U2 R D' R' U2 R'", focus:'all', view:'top',
    purpose:'Turns all yellow up. The white face stays on the bottom.', hold:'Two yellow corners up at the <b>back</b>. The other two show yellow <b>facing you</b>.', tips:[] },
  { id:'2x2-oll-T', level:'2x2-adv', step:'2x2 · OLL 6 of 7', title:'T', moves:"R U R' U' R' F R F'", focus:'all', view:'top',

  { id:'2x2-oll-L', level:'2x2-adv', step:'2x2 · OLL 7 of 7', title:'Bowtie', moves:"F' R U R' U' R' F R", focus:'all', view:'top',

  { id:'2x2-pbl-t', level:'2x2-adv', step:'2x2 · PBL 1 of 6', title:'Top: headlights, bottom: done', moves:"R U R' U' R' F R2 U' R' U' R U R' F'", focus:'all',

/* ============================================================
   Rendering
   ============================================================ */
const app = document.getElementById('app');
let dur = 700, player = null;
const pause = ms => new Promise(r=>setTimeout(r,ms));

function groupsOf(alg){
  const moves = alg.moves.split(/\s+/);
  const out=[]; let i=0;
  if (alg.groups){ for(const [label,n,name] of alg.groups){ out.push({label, name, from:i, to:i+n}); i+=n; } }
  else for(const m of moves){ out.push({label:m, from:i, to:i+1}); i++; }
  return {moves, groups:out};
}
// Rewrite wide moves, slices and whole-cube turns as plain face turns in the starting grip,
// so the start position is built with green still facing you and yellow on top.
const DECOMP = {r:['L','x'], l:['R',"x'"], f:['B','z'], b:['F',"z'"], u:['D','y'], d:['U',"y'"],
                M:['R',"L'","x'"], E:['U',"D'","y'"], S:["F'",'B','z']};
const TURN = {x:{U:'F',F:'D',D:'B',B:'U'}, y:{F:'R',R:'B',B:'L',L:'F'}, z:{R:'U',D:'R',L:'D',U:'L'}};
const quarters = t => t.endsWith("'") ? 3 : t.endsWith('2') ? 2 : t.endsWith('3') ? 3 : 1;
function flatten(seq){
  let map={U:'U',D:'D',F:'F',B:'B',R:'R',L:'L'}; const out=[];
  const rotate=(axis,n)=>{ for(let i=0;i<n;i++){ const m={...map}; for(const [k,v] of Object.entries(TURN[axis])) m[k]=map[v]; map=m; } };
  const turn=(face,n)=>{ n%=4; if(n) out.push(map[face]+(n===1?'':n===2?'2':"'")); };
  for(const t of seq){
    const c=t[0], k=quarters(t);
    if(TURN[c]) rotate(c,k);
    else if(DECOMP[c]) for(const part of DECOMP[c]){ const n=quarters(part)*k; if(TURN[part[0]]) rotate(part[0],n%4); else turn(part[0],n); }
    else out.push(map[c]+t.slice(1));
  }
  return out;
}
const startSeq = alg => alg.setup ? alg.setup.split(/\s+/) : alg.start==='solved' ? [] : (alg.level==='pyraminx'||alg.level==='4x4') ? inverseSeq(alg.moves.split(/\s+/)) : inverseSeq(flatten(alg.moves.split(/\s+/)));
const formulaText = alg => alg.short ? alg.short : alg.groups ? alg.groups.map(([l,n])=> n>1 && l.includes(' ') ? `(${l})` : l).join('  ') : alg.moves;

const LEVELS = {
  beginner:{ name:'Beginner 3x3', short:'Beginner', intro:`The classic beginner method. Hold the cube with <b>yellow on top</b> and <b>green facing you</b>:
       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.` },
  intermediate:{ name:'Intermediate 3x3', short:'Intermediate', intro:`The next step up: white cross as before, then <b>F2L</b> (corner and edge together),
       <b>2-look OLL</b> (all yellow on top) and <b>2-look PLL</b> (everything in place). Same grip: yellow on top, green facing you.` },
  'advanced-f2l':{ name:'Advanced F2L (3x3)', short:'Advanced F2L' },
  'advanced-oll':{ name:'Advanced OLL (3x3)', short:'Advanced OLL' },
  'advanced-pll':{ name:'Advanced PLL (3x3)', short:'Advanced PLL' },
};
// Puzzle buttons. Only the 3x3 has content: its button opens the level options.
const ICON_3X3 = (()=>{ const c=['--R','--W','--G','--Y','--B','--O','--G','--R','--Y']; let r='';
  c.forEach((v,i)=>{ r+=`<rect x="${(i%3)*7+1}" y="${Math.floor(i/3)*7+1}" width="6" height="6" rx="1.5" style="fill:var(${v})"/>`; });
  return `<svg class="pz-icon" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="3.5" style="fill:#111"/>${r}</svg>`; })();
// Two main buttons: 3x3 opens the 3x3 levels, Twisty and big cubes opens the other puzzles.
// The 2x2 page has its own three levels.
const TWO_LEVELS = {
  '2x2':     { name:'2x2 Beginner', short:'Beginner' },
  '2x2-int': { name:'2x2 Intermediate', short:'Intermediate', intro:`White layer as in Beginner. Then <b>3 algorithms</b> make the whole top yellow and <b>2 algorithms</b> put the corners in place.` },
  '2x2-adv': { name:'2x2 Advanced', short:'Advanced', intro:`The <b>Ortega</b> method. First make the <b>white face</b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms</b> turns all yellow up, and one of <b>6 algorithms</b> fixes both layers at once.` },
};
const TWISTY = { pyraminx:{ name:'Pyraminx' }, mirror:{ name:'Mirror cube' }, megaminx:{ name:'Megaminx' }, '2x2':{ name:'2x2' }, '4x4':{ name:'4x4' } };
const PUZZLES = { '3x3':{ name:'3x3', icon:ICON_3X3 }, twisty:{ name:'Twisty and big cubes' }, ...TWISTY };
const levelOf = alg => alg.level || 'beginner';

// Flat picture of the top layer at the start of a card: the 3x3 top face with
// the side stickers of the top layer drawn as thin strips on all four sides.
function netSVG(alg){
  const four=levelOf(alg)==='4x4';                // a 4x4 top is drawn 4 by 4, a 3x3 top 3 by 3
  const cube=four ? new Cube4(document.createElement('div'),16,{}) : new Cube(document.createElement('div'),10,{}); cube.applyAll(startSeq(alg));
  const S=four?cube.h:cube.S, POS=four?[-3,-1,1,3]:[-1,0,1], TOP=POS[0], N=POS.length;
  const faceOf=n=>n[0]===1?'R':n[0]===-1?'L':n[1]===-1?'U':n[1]===1?'D':n[2]===1?'F':'B';
  const colour=(x,z,d)=>{                       // sticker of the top-layer piece at (x,z) facing direction d
    const q=cube.cubies.find(c=>Math.round(c.M[0][3]/S)===x&&Math.round(c.M[1][3]/S)===TOP&&Math.round(c.M[2][3]/S)===z);
    const n=[0,1,2].map(k=>Math.round(q.M[0][k]*d[0]+q.M[1][k]*d[1]+q.M[2][k]*d[2]));
    return COLORS[faceOf(n)];
  };
  const C=four?23:30, G=3, T=12, P=4, F=T+P, W=N*C+(N-1)*G, total=F*2+W, rects=[], first=POS[0], last=POS[N-1];
  const rect=(x,y,w,h,fill)=>rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" style="fill:${fill}"/>`);
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) rect(F+j*(C+G),F+i*(C+G),C,C,colour(POS[j],POS[i],[0,-1,0]));
  for(let j=0;j<N;j++){ rect(F+j*(C+G),0,C,T,colour(POS[j],first,[0,0,-1])); rect(F+j*(C+G),F+W+P,C,T,colour(POS[j],last,[0,0,1])); }
  for(let i=0;i<N;i++){ rect(0,F+i*(C+G),T,C,colour(first,POS[i],[-1,0,0])); rect(F+W+P,F+i*(C+G),T,C,colour(last,POS[i],[1,0,0])); }
  return `<svg class="netsvg" viewBox="-2 -2 ${total+4} ${total+4}" role="img" aria-label="${tr('Top layer at the start')}">${rects.join('')}</svg>`;
}

function renderOverview(level, puzzle='3x3'){
  const group = puzzle==='3x3' ? '3x3' : 'twisty';
  const puzzles = `<div class="levels puzzles">${['3x3','twisty'].map(k=>
      `<a class="lvl pz${k===group?' on':''}" href="#${k}" aria-expanded="${k===group}">${PUZZLES[k].icon||''}${tr(PUZZLES[k].name)}<span class="caret">&#9662;</span></a>`).join('')}</div>`;
  const options = group==='3x3' ? Object.entries(LEVELS).map(([k,v])=>[k,tr(v.short),k===level]) : Object.entries(TWISTY).map(([k,v])=>[k,tr(v.name),k===puzzle]);
  const sub = `<div class="levels sublevels">${options.map(([k,name,on])=>`<a class="lvl${on?' on':''}" href="#${k}">${name}</a>`).join('')}</div>`;
  let third='';
  if(puzzle==='2x2'){ level = TWO_LEVELS[level] ? level : '2x2';
    third=`<div class="levels sublevels third">${Object.entries(TWO_LEVELS).map(([k,v])=>`<a class="lvl${k===level?' on':''}" href="#${k}">${tr(v.short)}</a>`).join('')}</div>`; }
  else if(group==='twisty' && ALGS.some(a=>levelOf(a)===puzzle)){ level=puzzle; }
  else if(group==='twisty' || !level){ app.innerHTML = `<h1>${tr('Algorithms')}</h1>${puzzles}${sub}`; return; }
  const extra = level==='intermediate' ? `<span><b>r</b> right two layers</span><span><b>M</b> middle slice, turned like L</span>`
              : level==='advanced-f2l' ? `<span><b>r</b> right two layers</span><span><b>d</b> bottom two layers</span><span><b>(…)3</b> = do the bracket 3 times</span>`
              : level==='4x4' ? `<span><b>Rw</b> right two layers together</span><span><b>Uw</b> top two layers together</span><span><b>r l u</b> only the second layer from the right / left / top (inner slice, the centre layer)</span>`
              : level==='advanced-pll' ? `<span><b>M</b> middle slice, like L</span><span><b>x z</b> tip / roll the whole cube</span><span><b>y</b> turn the whole cube</span><span><b>d u</b> bottom / top two layers</span>`
              : level==='advanced-oll' ? `<span><b>r l f</b> two layers at once</span><span><b>M</b> middle slice, like L</span><span><b>S</b> front-back middle slice, like F</span><span><b>x</b> tip the whole cube, like R</span><span><b>d</b> bottom two layers</span><span><b>(…)2</b> = do the bracket twice</span>` : '';
  app.innerHTML = `
    <h1>${tr('Algorithms')}</h1>
    ${puzzles}
    ${sub}${third}
    ${(LEVELS[level]||TWO_LEVELS[level])?.intro ? `<p class="sub">${tr((LEVELS[level]||TWO_LEVELS[level]).intro)}</p>` : ''}
    ${trSpans(level==='pyraminx' ? `<div class="legend">
      <span><b>U</b> top corner</span><span><b>L</b> front-left corner</span><span><b>R</b> front-right corner</span><span><b>B</b> back corner</span>
      <span>capital = the corner with its whole layer</span><span><b>u l r b</b> = just the tip</span><span><b>'</b> = the other way</span><span>plain letter = clockwise as you look at that corner</span>
    </div>` : `<div class="legend">
      <span><b>R</b> right</span><span><b>L</b> left</span><span><b>U</b> top</span><span><b>D</b> bottom</span><span><b>F</b> front</span><span><b>y</b> turn the whole cube, right side to the front</span>${extra}
      <span><b>'</b> = the other way</span><span><b>2</b> = twice</span><span><b>3</b> = three times</span><span>plain letter = clockwise as you look at that face</span>
    </div>`)}
    <div class="grid"></div>`;
  const algs = ALGS.filter(a=>levelOf(a)===level);
  // a turned card cube goes back to its start once it has been scrolled off the screen
  const offScreen = 'IntersectionObserver' in window ? new IntersectionObserver(entries=>{
    for(const e of entries) if(!e.isIntersecting && e.target._turned) e.target._resetNow();
  }) : null;
  if(!algs.length){ app.querySelector('.legend').remove(); app.querySelector('.grid').remove(); return; }
  const grid = app.querySelector('.grid');
  for(const alg of algs){
    const a=document.createElement('a'); a.className='card'; a.href='#'+alg.id;
    const pic = alg.diagram==='net' ? `<div class="net">${netSVG(alg)}</div>`
      : `<div class="scene-wrap"><div class="scene"></div><button class="card-reset" type="button" hidden aria-label="${tr('Turn the cube back')}" title="${tr('Turn the cube back')}">&#10227;</button></div>`;
    a.innerHTML=`<div class="step">${tr(alg.step)}</div>${pic}<h3>${tr(alg.title)}</h3><div class="f">${formulaText(alg)}</div>${alg.purpose?`<p>${tr(alg.purpose)}</p>`:''}`;
    grid.appendChild(a);
    if(alg.diagram==='net') continue;
    const sc=a.querySelector('.scene'), back=a.querySelector('.card-reset');
    const c=makeCube(sc, {view:viewOf(alg), focus:alg.focus, flip:alg.flip, ...puzzleOpts(alg)});
    c.applyAll(startSeq(alg));
    // drag the small cube to turn it; a plain click still opens the step
    const reset=enableOrbit(sc, c.el, viewOf(alg), {onTurn:t=>{ back.hidden=!t; sc._turned=t; }, speed:0.8});
    sc._resetNow=()=>{ reset(); c.el.classList.remove('settle'); };   // no slide: it happens out of sight
    if(offScreen) offScreen.observe(sc);
    a.draggable=false;
    a.addEventListener('click',e=>{ if(reset.moved()){ e.preventDefault(); } },true);
    back.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); reset(); });
  }
}

class Player {
  constructor(alg){
    this.alg=alg; this.dead=false; this.step=0; this.busy=false;
    const {moves,groups}=groupsOf(alg); this.moves=moves; this.groups=groups;
    const level=levelOf(alg), list=ALGS.filter(a=>levelOf(a)===level), idx=list.indexOf(alg), prev=list[idx-1], next=list[idx+1];
    app.innerHTML=`
      <a class="back" href="#${level}">&larr; ${fmt('All {name} steps',{name:tr((LEVELS[level]||TWO_LEVELS[level]||PUZZLES[level]).name)})}</a>
      <div class="step">${tr(alg.step)}</div>
      <h2>${tr(alg.title)}</h2>
      ${alg.purpose?`<p class="sub">${tr(alg.purpose)}</p>`:''}
      ${alg.diagram==='net'?`<div class="net big-net">${netSVG(alg)}</div>`:''}
      ${alg.hold?`<div class="hold">${tr(alg.hold)}</div>`:''}
      <div class="formula ${moves.length>10?'long':''}"></div>
      <div class="desc"></div>
      <div class="scene big"></div>
      <div class="controls">
        <button data-b="back">&#9664; ${tr('Step back')}</button>
        <button data-b="play" class="primary">&#9654; ${tr('Play')}</button>
        <button data-b="step">${tr('Step')} &#9654;</button>
        <button data-b="reset">&#8635; ${tr('Reset')}</button>
        <button data-b="view">&#10227; ${tr('Reset view')}</button>
        ${alg.repeat?`<button data-b="rep">${fmt('Play {n}× (back to start!)',{n:alg.repeat})}</button>`:''}
        <label class="speed">${tr('Speed')} <input type="range" min="1" max="10" value="${Math.round((1400-dur)/130)+1}"></label>
      </div>
      <div class="strip"></div>
      ${alg.tips&&alg.tips.length?`<ul class="tips">${alg.tips.map(t=>`<li>${tr(t)}</li>`).join('')}</ul>`:''}
      <div class="nav">${prev?`<a href="#${prev.id}">&larr; ${tr(prev.title)}</a>`:''}${next?`<a href="#${next.id}">${tr(next.title)} &rarr;</a>`:''}</div>`;

    const fEl=app.querySelector('.formula');
    this.tokens=groups.map(g=>{const s=document.createElement('span');s.className='tok';s.textContent=g.label;fEl.appendChild(s);return s;});
    this.desc=app.querySelector('.desc');

    this.big=makeCube(app.querySelector('.big'), {view:viewOf(alg), focus:alg.focus, flip:alg.flip, ...puzzleOpts(alg)});
    this.badge=document.createElement('div'); this.badge.className='turn-badge'; this.badge.setAttribute('aria-hidden','true'); app.querySelector('.big').appendChild(this.badge);
    this.resetView=enableOrbit(app.querySelector('.big'), this.big.el, viewOf(alg));
    app.querySelector('.big').insertAdjacentHTML('afterend',`<p class="drag-hint">${tr('Drag or swipe the cube to turn it around.')}</p>`);
    this.start=startSeq(alg); this.big.applyAll(this.start);

    // snapshot strip: start, then one after each group
    const strip=app.querySelector('.strip'); this.snaps=[]; this.bounds=[];
    const addSnap=(label,small,seq,bound)=>{
      if(this.snaps.length){const ar=document.createElement('div');ar.className='arrow';ar.textContent='→';strip.appendChild(ar);}
      const w=document.createElement('div'); w.className='snap';
      const sc=document.createElement('div'); sc.className='scene'; w.appendChild(sc);
      const l=document.createElement('div'); l.className='lbl'; l.innerHTML=`${label}<small>${small}</small>`; w.appendChild(l);
      strip.appendChild(w);
      const c=makeCube(sc,{view:viewOf(alg),focus:alg.focus,flip:alg.flip,...puzzleOpts(alg)}); c.applyAll(seq);
      this.snaps.push(w); this.bounds.push(bound);
    };
    addSnap(tr('Start'), tr(alg.start==='solved'?'solved':'before'), this.start, 0);
    groups.forEach((g,i)=>addSnap(g.name ? tr(g.name) : i===groups.length-1 ? tr('End') : fmt('Step {n}',{n:i+1}), fmt('after {label}',{label:g.label}), [...this.start,...moves.slice(0,g.to)], g.to));

    const B=n=>app.querySelector(`[data-b="${n}"]`); this.B=B;
    const restart=()=>{ this.big.reset(); this.big.applyAll(this.start); this.step=0; };
    B('step').onclick=()=>this.run(async()=>{ if(this.step<moves.length) await this.forward(); });
    B('back').onclick=()=>this.run(async()=>{ if(this.step>0) await this.backward(); });
    B('reset').onclick=()=>this.run(async()=>restart());
    B('view').onclick=()=>this.resetView();
    B('play').onclick=()=>this.run(async()=>{
      if(this.step===moves.length){ restart(); this.ui(); await pause(400); }
      while(this.step<moves.length && !this.dead){ await this.forward(); await pause(250); }
    });
    if(alg.repeat) B('rep').onclick=()=>this.run(async()=>{
      restart(); this.ui(); await pause(400);
      for(let r=1;r<=alg.repeat && !this.dead;r++){
        while(this.step<moves.length && !this.dead){
          const mv=moves[this.step]; this.ui(this.step,fmt('Round {r} of {n}: {mv}',{r,n:alg.repeat,mv}));
          await this.turn(mv,Math.max(180,dur*0.6)); this.step++;
        }
        await pause(250); this.step=0;
      }
      this.ui(-1,fmt('{n} rounds later... back exactly where we started!',{n:alg.repeat}));
    });
    app.querySelector('.speed input').oninput=e=>{ dur=1400-(e.target.value-1)*130; };
    this.ui();
    // keep the text line as tall as its longest text, so the cube below never jumps
    this.onResize=()=>this.fitDesc(); window.addEventListener('resize',this.onResize);
    this.fitDesc(); if(document.fonts) document.fonts.ready.then(()=>{ if(!this.dead) this.fitDesc(); });
  }
  fitDesc(){
    const d=this.desc, keep=d.textContent, step=this.step, n=this.moves.length, R=this.alg.repeat, texts=[];
    for(let i=0;i<=n;i++){ this.step=i; texts.push(this.idleText()); }
    this.step=step;
    for(const mv of this.moves){
      texts.push(`${mv}:  ${this.hint(mv)}`, `${fmt('Undo {mv}',{mv})}:  ${this.hint(inverseTok(mv))}`);
      if(R) texts.push(fmt('Round {r} of {n}: {mv}',{r:R,n:R,mv}));
    }
    if(R) texts.push(fmt('{n} rounds later... back exactly where we started!',{n:R}));
    d.style.minHeight='';
    let h=0; for(const t of texts){ d.textContent=t; h=Math.max(h,d.getBoundingClientRect().height); }
    d.textContent=keep; d.style.minHeight=Math.ceil(h)+'px';
  }
  groupOf(i){ return this.groups.findIndex(g=>i>=g.from&&i<g.to); }
  idleText(){
    const n=this.moves.length;
    if(this.step===0) return tr('Press Play, or Step through one turn at a time.');
    if(this.step===n) return tr(this.alg.done ? this.alg.done : this.alg.repeat ? 'Done! Try Play 6x: the cube comes back to the start.' : 'Done! That is what this step fixes.');
    return fmt('{i} of {n} turns done. Next: {mv}.',{i:this.step,n,mv:this.moves[this.step]});
  }
  ui(active=-1,text){
    const ag=active>=0?this.groupOf(active):-1;
    this.tokens.forEach((t,i)=>{const g=this.groups[i];t.classList.toggle('done',this.step>=g.to);t.classList.toggle('active',i===ag);});
    this.snaps.forEach((s,i)=>s.classList.toggle('active',active===-1&&this.bounds[i]===this.step));
    this.desc.textContent=text??this.idleText();
    const n=this.moves.length;
    this.B('back').disabled=this.busy||this.step===0; this.B('step').disabled=this.busy||this.step===n;
    this.B('play').disabled=this.busy; this.B('reset').disabled=this.busy; if(this.alg.repeat) this.B('rep').disabled=this.busy;
  }
  hint(t){ return this.alg.level==='pyraminx' ? describePyra(t) : this.alg.level==='4x4' ? describe4(t) : describe(t); }
  // show the turn's name on the cube, wait a moment, then turn it
  async turn(mv,d,label=mv){
    this.badge.textContent=label; this.badge.classList.add('on');
    await pause(Math.min(350,d*0.4));
    if(!this.dead) await this.big.animate(mv,d);
    this.badge.classList.remove('on');
  }
  async forward(){ const mv=this.moves[this.step]; this.ui(this.step,`${mv}:  ${this.hint(mv)}`); await this.turn(mv,dur); if(this.dead)return; this.step++; this.ui(); }
  async backward(){ const mv=this.moves[this.step-1]; this.ui(this.step-1,`${fmt('Undo {mv}',{mv})}:  ${this.hint(inverseTok(mv))}`); await this.turn(inverseTok(mv),dur,fmt('Undo {mv}',{mv})); if(this.dead)return; this.step--; this.ui(); }
  async run(fn){ if(this.busy)return; this.busy=true; this.ui(); await fn(); if(this.dead)return; this.busy=false; this.ui(); }
  destroy(){ this.dead=true; this.big.dead=true; window.removeEventListener('resize',this.onResize); }
}

// the languages in alphabetical order (in the language shown); tap one to switch the whole app
function renderLanguages(){
  const list=LANGUAGES.map(([code,name,own,flag])=>({code,name:tr(name),own,flag})).sort((a,b)=>a.name.localeCompare(b.name,LANG));
  app.innerHTML=`<a class="back" href="#settings">&larr; ${tr('Settings')}</a><h1>${tr('Languages')}</h1>
    <div class="settings-list">${list.map(l=>`<button type="button" class="lang-row${l.code===LANG?' on':''}" data-lang="${l.code}" aria-pressed="${l.code===LANG}">${l.flag}<span class="lang-name">${l.name}${l.own!==l.name?`<small dir="auto">${l.own}</small>`:''}</span>${l.code===LANG?'<span class="check" aria-hidden="true">&#10003;</span>':''}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
    LANG=b.dataset.lang; try{ localStorage.setItem('lang',LANG); }catch(e){}
    setDocLang(); applyHeader(); renderLanguages();
  });
}

function route(){
  if(player){ player.destroy(); player=null; }
  const id=location.hash.slice(1), alg=ALGS.find(a=>a.id===id);
  if(alg) player=new Player(alg);
  else if(id==='settings') app.innerHTML=`<a class="back" href="#">&larr; ${tr('Algorithms')}</a><h1>${tr('Settings')}</h1>
      <div class="settings-list"><a class="set-row" href="#languages">${tr('Languages')}<span class="chev">&rsaquo;</span></a></div>`;
  else if(id==='languages') renderLanguages();
  else if(TWO_LEVELS[id]) renderOverview(id, '2x2');
  else if(PUZZLES[id]) renderOverview(null, id);
  else renderOverview(LEVELS[id] ? id : 'beginner');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
applyHeader();
route();
