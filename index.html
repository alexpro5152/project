 in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"Ecke schon unten, aber am falschen Platz oder verdreht? Halte sie vorne rechts und mach einmal Righty, um sie herauszuholen.","Righty once works here too.":"Einmal Righty geht hier auch.","2x2 · Step 1b · white layer":"2x2 · Schritt 1b · weiße Ebene","Corner above its spot, white facing you":"Ecke über ihrem Platz, Weiß zeigt zu dir","Same as 3x3 step 2b: white facing you, so use the front face.":"Wie 3x3 Schritt 2b: Weiß zeigt zu dir, also nimm die vordere Seite.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Weiß unten. Die weiße Ecke ist <b>über ihrem Platz<\/b> vorne rechts, Weiß <b>zeigt zu dir<\/b>.","Righty five times also does it.":"Fünfmal Righty klappt auch.","2x2 · Step 1c · white layer":"2x2 · Schritt 1c · weiße Ebene","Corner above its spot, white facing up":"Ecke über ihrem Platz, Weiß zeigt nach oben","Same as 3x3 step 2c: Righty three times.":"Wie 3x3 Schritt 2c: dreimal Righty.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Weiß unten. Die weiße Ecke ist <b>über ihrem Platz<\/b> vorne rechts, Weiß <b>zeigt nach oben<\/b>. Mach Righty, bis Weiß nach unten zeigt.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Jede weiße Ecke klappt nur mit Righty: 1-, 3- oder 5-mal.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Mach das für alle vier weißen Ecken. Die weiße Ebene ist fertig, wenn die Seitenfarben jeder weißen Ecke zu denen daneben passen.","2x2 · Step 2 · yellow corners":"2x2 · Schritt 2 · gelbe Ecken","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Wie 3x3 Schritt 6. Tauscht drei obere Ecken im Kreis, sodass jede Ecke über ihrer passenden weißen Ecke sitzt. Verdreht ist noch egal.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Weiße Ebene fertig, unten. Eine obere Ecke ist <b>am richtigen Platz<\/b>, wenn ihre Seitenfarben zu den weißen Ecken darunter passen (verdreht ist okay). Dreh die obere Ebene, bis <b>genau eine<\/b> Ecke am richtigen Platz ist, und halte sie <b>vorne links<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"Die Ecke vorne links bleibt, die anderen drei wandern im Kreis. Vielleicht brauchst du ihn zweimal.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"Keine Drehung oben ergibt genau eine Ecke am richtigen Platz? Mach ihn einmal von irgendwo aus, dann schau noch mal. Das kann beim 2x2 passieren, beim 3x3 nie.","All four in place? Go to step 3.":"Alle vier am richtigen Platz? Weiter zu Schritt 3.","2x2 · Step 3 · finish":"2x2 · Schritt 3 · Abschluss","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Wie 3x3 Schritt 7. Gelb unten, verdrehte Ecke unten vorne rechts. Gelb zeigt zur Seite: 2-mal Righty. Gelb zeigt zu dir: 4-mal Righty. Dann dreh die untere Ebene (D) zur nächsten Ecke.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>Dreh den Würfel um: Gelb unten.<\/b> Bring eine verdrehte Ecke nach <b>unten vorne rechts<\/b> und schau, wohin ihr gelber Aufkleber zeigt:<ul class=\"rule\"><li>Gelb zeigt <b>zur Seite<\/b> (rechts) &rarr; <b>2-mal<\/b> Righty<\/li><li>Gelb zeigt <b>zu dir<\/b> &rarr; <b>4-mal<\/b> Righty<\/li><li>Gelb zeigt <b>nach unten<\/b> &rarr; diese Ecke ist fertig<\/li><\/ul>Dann dreh <b>nur die untere Ebene (D)<\/b>, um die nächste verdrehte Ecke dorthin zu bringen. Dreh nie den ganzen Würfel.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"Die weiße Ebene sieht zwischendurch verdreht aus. Mach weiter, sie kommt zurück, wenn die letzte Ecke fertig ist.","At the end, turn one layer until the two layers line up. Solved!":"Dreh am Ende eine Ebene, bis die zwei Ebenen zueinander passen. Gelöst!","2x2 · Orientation 1 of 3":"2x2 · Orientierung 1 von 3","Sune: one yellow corner up":"Sune: eine Ecke mit Gelb oben","One yellow corner up. Makes the top yellow, or another case you then fix.":"Eine Ecke mit Gelb oben. Macht die Oberseite gelb oder einen anderen Fall, den du dann löst.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Weiße Ebene fertig, unten. Halte die Ecke mit Gelb oben <b>vorne links<\/b>. Die Ecke vorne rechts zeigt Gelb <b>zu dir<\/b>.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"Zwei Ecken mit Gelb oben? Halte den Würfel so, dass die Ecke vorne links Gelb zu dir zeigt, mach den Sune, dann schau noch mal.","It never takes more than three orientation algorithms in a row.":"Du brauchst nie mehr als drei Orientierungs-Algorithmen hintereinander.","2x2 · Orientation 2 of 3":"2x2 · Orientierung 2 von 3","Antisune: one yellow corner up, other way":"Antisune: eine Ecke mit Gelb oben, andersherum","One yellow corner up, the other way round from the Sune.":"Eine Ecke mit Gelb oben, andersherum als beim Sune.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Halte die Ecke mit Gelb oben <b>hinten rechts<\/b>. Die Ecke vorne links zeigt Gelb <b>zu dir<\/b>.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Passt weder das Sune- noch das Antisune-Bild, dreh die obere Ebene und schau noch mal.","2x2 · Orientation 3 of 3":"2x2 · Orientierung 3 von 3","Pi: no yellow corner up":"Pi: keine Ecke mit Gelb oben","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"Keine Ecke mit Gelb oben. Danach ist alles Gelb oben oder du bekommst einen Sune- oder Antisune-Fall.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"Kein Gelb oben. Halte den Würfel so, dass beide <b>linken<\/b> Ecken Gelb <b>nach links<\/b> zeigen.","Yellow pairs on the left and on the right? Hold either pair on the left.":"Gelbe Paare links und rechts? Halte eines der Paare links.","R2 = turn the right side twice.":"R2 = die rechte Seite zweimal drehen.","2x2 · Permutation 1 of 2":"2x2 · Permutation 1 von 2","T-perm: headlights on one side":"T-perm: Scheinwerfer auf einer Seite","All yellow is up. Swaps two corners next to each other.":"Alles Gelb ist oben. Tauscht zwei benachbarte Ecken.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"Such <b>Scheinwerfer<\/b>: eine Seite, auf der beide oberen Aufkleber die gleiche Farbe haben. Halte diese Seite <b>links<\/b>.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"Scheinwerfer auf jeder Seite? Nichts zu tauschen: Dreh einfach die obere Ebene, bis sie passt.","After the T-perm, turn the top until the cube is solved.":"Dreh nach dem T-perm die obere Ebene, bis der Würfel gelöst ist.","2x2 · Permutation 2 of 2":"2x2 · Permutation 2 von 2","Y-perm: no headlights":"Y-perm: keine Scheinwerfer","All yellow is up but no side has headlights. Swaps two corners diagonally.":"Alles Gelb ist oben, aber keine Seite hat Scheinwerfer. Tauscht zwei Ecken diagonal.","No headlights anywhere. Hold it any way round.":"Nirgends Scheinwerfer. Halte den Würfel, wie du willst.","After the Y-perm, turn the top until the cube is solved.":"Dreh nach dem Y-perm die obere Ebene, bis der Würfel gelöst ist.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"Lern ihn in zwei Hälften: „F R U' R' U' R U R' F'“ und „R U R' U' R' F R F'“.","2x2 · OLL 1 of 7":"2x2 · OLL 1 von 7","Turns all yellow up. The white face stays on the bottom.":"Dreht alles Gelb nach oben. Die weiße Seite bleibt unten.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Eine Ecke mit Gelb oben, <b>vorne links<\/b>. Die Ecke vorne rechts zeigt Gelb <b>zu dir<\/b>.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"Zuerst die weiße Seite unten: Nur Weiß muss unten sein, die Seiten dürfen gemischt sein.","2x2 · OLL 2 of 7":"2x2 · OLL 2 von 7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"Eine Ecke mit Gelb oben, <b>hinten rechts<\/b>. Die Ecke vorne links zeigt Gelb <b>zu dir<\/b>.","2x2 · OLL 3 of 7":"2x2 · OLL 3 von 7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Keine Ecke mit Gelb oben. Gelbe Paare auf der <b>linken<\/b> und <b>rechten<\/b> Seite.","2x2 · OLL 4 of 7":"2x2 · OLL 4 von 7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"Keine Ecke mit Gelb oben. Ein gelbes Paar <b>links<\/b>; rechts zeigt ein Gelb zu dir und eins nach hinten.","2x2 · OLL 5 of 7":"2x2 · OLL 5 von 7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"Zwei Ecken mit Gelb oben <b>hinten<\/b>. Die anderen zwei zeigen Gelb <b>zu dir<\/b>.","2x2 · OLL 6 of 7":"2x2 · OLL 6 von 7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"Zwei Ecken mit Gelb oben <b>rechts<\/b>. Links zeigt ein Gelb zu dir und eins nach hinten.","2x2 · OLL 7 of 7":"2x2 · OLL 7 von 7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Ecken mit Gelb oben <b>vorne links<\/b> und <b>hinten rechts<\/b>. Die Ecke vorne rechts zeigt Gelb <b>zu dir<\/b>.","2x2 · PBL 1 of 6":"2x2 · PBL 1 von 6","Top: headlights, bottom: done":"Oben: Scheinwerfer, unten: fertig","All yellow up, all white down. Fixes both layers at once.":"Alles Gelb oben, alles Weiß unten. Löst beide Ebenen auf einmal.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"Obere Ebene: Scheinwerfer <b>links<\/b>. Untere Ebene: schon richtig.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>Scheinwerfer<\/b> = eine Seite, auf der beide Aufkleber dieser Ebene die gleiche Farbe haben.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"Oben richtig, aber unten falsch? Dreh den ganzen Würfel um, sodass die falsche Ebene oben ist, dann nimm Karte 1 oder 2.","After the algorithm, turn the top and bottom until the cube is solved.":"Dreh nach dem Algorithmus die obere und untere Ebene, bis der Würfel gelöst ist.","2x2 · PBL 2 of 6":"2x2 · PBL 2 von 6","Top: no headlights, bottom: done":"Oben: keine Scheinwerfer, unten: fertig","Top layer: no headlights. Bottom layer: already right.":"Obere Ebene: keine Scheinwerfer. Untere Ebene: schon richtig.","2x2 · PBL 3 of 6":"2x2 · PBL 3 von 6","Both layers: headlights":"Beide Ebenen: Scheinwerfer","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"Scheinwerfer in <b>beiden<\/b> Ebenen. Dreh die obere und die untere Ebene, sodass beide <b>vorne<\/b> sind.","2x2 · PBL 4 of 6":"2x2 · PBL 4 von 6","Both layers: no headlights":"Beide Ebenen: keine Scheinwerfer","No headlights in either layer. Hold it any way round.":"In keiner Ebene Scheinwerfer. Halte den Würfel, wie du willst.","2x2 · PBL 5 of 6":"2x2 · PBL 5 von 6","Top: headlights, bottom: none":"Oben: Scheinwerfer, unten: keine","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"Obere Ebene: Scheinwerfer <b>vorne<\/b>. Untere Ebene: keine Scheinwerfer.","2x2 · PBL 6 of 6":"2x2 · PBL 6 von 6","Top: none, bottom: headlights":"Oben: keine, unten: Scheinwerfer","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"Obere Ebene: keine Scheinwerfer. Untere Ebene: Scheinwerfer <b>hinten<\/b>.","Pyraminx · Step 1 · tips":"Pyraminx · Schritt 1 · Spitzen","Turn the tips":"Spitzen drehen","The easiest step: each tip turns on its own.":"Der leichteste Schritt: Jede Spitze dreht sich für sich allein.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"Dreh jede Spitze (<b>u l r b<\/b>), bis ihre drei Farben zu den <b>drei Mittelstücken<\/b> direkt daneben passen.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"Eine Spitze hat drei Farben. Jede muss zum Mitteldreieck direkt darunter auf derselben Seite passen.","Turning a tip never moves anything else, so you can always fix the tips first.":"Wenn du eine Spitze drehst, bewegt sich nie etwas anderes. Du kannst die Spitzen also immer zuerst lösen.","Pyraminx · Step 2 · centres":"Pyraminx · Schritt 2 · Mittelstücke","Match the centres":"Mittelstücke angleichen","Turn whole corners until every face has three centres of the same colour.":"Dreh ganze Ecken, bis jede Seite drei Mittelstücke in derselben Farbe hat.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"Dreh ganze Ecken (<b>U L R B<\/b>), bis auf jeder Seite die <b>drei Mittelstücke<\/b> dieselbe Farbe zeigen. Dann halte das Puzzle mit der <b>gelben Seite unten<\/b>.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"Jede Ecke nimmt ihre Spitze und ihre drei Mittelstücke mit, also bleibt Schritt 1 fertig.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"Die Kanten werden dabei durcheinandergebracht. Das ist okay, die Schritte 3 und 4 bringen sie in Ordnung.","Pyraminx · Step 3a · bottom edges":"Pyraminx · Schritt 3a · untere Kanten","Edge on the right, yellow facing you":"Kante rechts, Gelb zeigt zu dir","Puts the green-yellow edge into the front bottom.":"Bringt die grün-gelbe Kante nach unten vorne.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"Gelbe Seite unten. Die Kante, die nach <b>unten vorne<\/b> gehört, sitzt an der Kante <b>vorne rechts<\/b>, Gelb <b>zeigt zu dir<\/b>.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"Dreh das ganze Puzzle (Gelb bleibt unten), sodass der Platz, den du füllen willst, unten vorne ist.","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"Kante schon unten, aber am falschen Platz oder gekippt? Halte diesen Platz unten vorne und mach das einmal, um die Kante nach oben zu holen.","Pyraminx · Step 3b · bottom edges":"Pyraminx · Schritt 3b · untere Kanten","Edge on the right, yellow facing right":"Kante rechts, Gelb zeigt nach rechts","Same edge, the other way round.":"Gleiche Kante, andersherum.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"Die Kante sitzt an der Kante <b>vorne rechts<\/b>, Gelb zeigt nach <b>rechts<\/b>.","Pyraminx · Step 3c · bottom edges":"Pyraminx · Schritt 3c · untere Kanten","Edge on the left, yellow facing you":"Kante links, Gelb zeigt zu dir","The edge is on the left side.":"Die Kante ist auf der linken Seite.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"Die Kante sitzt an der Kante <b>vorne links<\/b>, Gelb <b>zeigt zu dir<\/b>.","Pyraminx · Step 3d · bottom edges":"Pyraminx · Schritt 3d · untere Kanten","Edge on the left, yellow facing left":"Kante links, Gelb zeigt nach links","Mirror of 3b.":"Spiegelbild von 3b.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"Die Kante sitzt an der Kante <b>vorne links<\/b>, Gelb zeigt nach <b>links<\/b>.","Pyraminx · Step 3e · bottom edges":"Pyraminx · Schritt 3e · untere Kanten","Edge at the back, yellow facing right":"Kante hinten, Gelb zeigt nach rechts","The edge is on the back edge.":"Die Kante sitzt an der hinteren Kante.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"Die Kante sitzt an der <b>hinteren<\/b> Kante, Gelb zeigt nach <b>rechts<\/b>.","Pyraminx · Step 3f · bottom edges":"Pyraminx · Schritt 3f · untere Kanten","Edge at the back, yellow facing left":"Kante hinten, Gelb zeigt nach links","Mirror of 3e.":"Spiegelbild von 3e.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"Die Kante sitzt an der <b>hinteren<\/b> Kante, Gelb zeigt nach <b>links<\/b>.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"Mach das für alle drei unteren Kanten. Die gelbe Seite ist fertig, wenn jede untere Kante zu den Mittelstücken auf beiden Seiten passt.","Pyraminx · Step 4a · last edges":"Pyraminx · Schritt 4a · letzte Kanten","Edges go round (one way)":"Kanten im Kreis (eine Richtung)","Moves the three top edges round.":"Bewegt die drei oberen Kanten im Kreis.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"Gelbe Seite fertig, unten. <b>Keine<\/b> obere Kante ist an ihrem Platz. Die Kante <b>vorne links<\/b> gehört nach <b>vorne rechts<\/b>.","After it, two edges may be flipped. Then do 4c.":"Danach können zwei Kanten gekippt sein. Dann mach 4c.","You never need more than two algorithms for the last edges.":"Für die letzten Kanten brauchst du nie mehr als zwei Algorithmen.","Pyraminx · Step 4b · last edges":"Pyraminx · Schritt 4b · letzte Kanten","Edges go round (other way)":"Kanten im Kreis (andere Richtung)","Moves the three top edges round the other way.":"Bewegt die drei oberen Kanten andersherum im Kreis.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"<b>Keine<\/b> obere Kante ist an ihrem Platz. Die Kante <b>vorne links<\/b> gehört nach <b>hinten<\/b>.","Pyraminx · Step 4c · last edges":"Pyraminx · Schritt 4c · letzte Kanten","Two edges flipped":"Zwei Kanten gekippt","All three top edges are in their place, but two are flipped.":"Alle drei oberen Kanten sind an ihrem Platz, aber zwei sind gekippt.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"Alle oberen Kanten an ihrem Platz, zwei davon gekippt. Halte das Puzzle so, dass die <b>richtige Kante hinten ist<\/b>.","Solved!":"Gelöst!","4x4 · 1 · edge pairing":"4x4 · 1 · Kanten paaren","Join two halves opposite each other":"Zwei gegenüberliegende Hälften verbinden","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"Eine 4x4-Kante hat zwei Hälften. Wenn die zwei Hälften einander gegenüber sitzen, verbindet das hier sie zu einer Kante.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"Mittelstücke fertig. Die zwei Hälften einer Kante (hier <b>blau-orange<\/b>) sitzen <b>einander gegenüber<\/b>: eine <b>oben an der Kante vorne links<\/b>, eine <b>oben an der Kante vorne rechts<\/b>, bei beiden <b>zeigt Orange zu dir<\/b>. Nur die blau-orangen Steine sind farbig, damit du sie verfolgen kannst.","Joined! The blue-orange edge is now one piece, at the front right.":"Verbunden! Die blau-orange Kante ist jetzt ein Stein, vorne rechts.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = die oberen zwei Ebenen zusammen. Uw' bringt die linke Hälfte nach rechts, Uw am Ende stellt die Mittelstücke zurück.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"Der Mittelteil „R U R' F R' F' R“ tauscht eine fertige Kante hinein, damit sich die zwei Hälften treffen können. Der Rest des Würfels wird gemischt: Das ist okay, danach löst du ihn wie einen 3x3.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"Paare so alle 12 Kanten, dann löse den 4x4 wie einen 3x3.","Edge joined":"Kante verbunden","4x4 · 1b · edge pairing":"4x4 · 1b · Kanten paaren","Combine with the centre layer, then swap it out":"Mit der inneren Ebene verbinden, dann austauschen","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"Dreh nur die innere Ebene, um die zwei Hälften zu verbinden, tausch die verbundene Kante gegen eine noch nicht verbundene aus, dann dreh die innere Ebene zurück.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"Mittelstücke fertig. Die zwei Hälften einer Kante (hier <b>blau-orange<\/b>) sitzen <b>diagonal<\/b>: eine <b>oben an der Kante vorne links<\/b>, <b>Orange zeigt zu dir<\/b>, eine <b>unten an der Kante vorne rechts<\/b>, <b>Blau zeigt zu dir<\/b>. Nur die blau-orangen Steine sind farbig, damit du sie verfolgen kannst.","Joined! The blue-orange edge is now one piece, at the top front.":"Verbunden! Die blau-orange Kante ist jetzt ein Stein, oben vorne.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"Diese Drehung hat einen Namen: <b>Slice-Drehung<\/b>. Ein kleines u heißt: Dreh <b>nur die obere innere Ebene<\/b> (die zweite Ebene von oben). Die oberste Ebene bewegt sich nicht.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = diese innere Ebene dreht sich nach rechts (wie U'). Die obere Hälfte geht nach rechts und sitzt über der unteren Hälfte: Die Kante ist verbunden.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' bringt die verbundene Kante nach oben und setzt eine noch nicht verbundene Kante an ihre Stelle.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = die innere Ebene zurückdrehen, damit die Mittelstücke wieder gelöst sind. Die verbundene Kante bleibt oben zusammen.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"Ist die untere Hälfte links und die obere rechts, dreh die innere Ebene andersherum: u L' U' L u'.","Halves combined":"Hälften verbunden","Swapped out":"Ausgetauscht","4x4 · 2 · OLL parity":"4x4 · 2 · OLL-Parität","No 3x3 OLL fits":"Kein 3x3-OLL passt","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"Wenn es <b>keinen 3x3-Algorithmus<\/b> für deine Oberseite gibt, mach das hier. Das passiert nur beim 4x4: Eine ungerade Zahl oberer Kanten ist gekippt (1 oder 3), wie im Bild. Das kippt die vordere Kante, sodass ein normaler 3x3-OLL wieder funktioniert.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"Gelb oben. Wie im Bild: <b>3 Kanten sind gekippt<\/b> (vorne, rechts und hinten zeigen ihre Farbe oben), nur die <b>linke<\/b> Kante hat Gelb oben. Das Bild zeigt die Oberseite von oben, vorne ist unten. Halte eine <b>gekippte Kante vorne<\/b>.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"Jetzt ist eine gerade Zahl Kanten gekippt (hinten und links), und die zwei vorderen Ecken sind verdreht: wieder ein normaler 3x3-Fall. Mach mit deinem 3x3-OLL und -PLL fertig.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"So erkennst du es: Zähl die oberen Kanten, die oben kein Gelb haben. 1 oder 3 = kein 3x3-Algorithmus passt, mach zuerst diesen.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = die <b>rechten zwei Ebenen zusammen<\/b> (breite Drehung), Lw = die linken zwei Ebenen zusammen. Auf vielen Blättern steht dafür ein kleines r und l.","U2 and F2 turn only the outer top and front layer, twice.":"U2 und F2 drehen nur die äußere obere und vordere Ebene, zweimal.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"Die vordere Kante kippt. Ein paar andere obere Steine bewegen sich auch: Das ist okay, dein normaler 3x3-OLL und -PLL bringen sie in Ordnung.","4x4 · 3 · PLL parity":"4x4 · 3 · PLL-Parität","Two edges swapped":"Zwei Kanten vertauscht","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"Auch nur beim 4x4: Ganz am Ende sind zwei gegenüberliegende obere Kanten vertauscht. Das tauscht sie zurück.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"Alles ist gelöst außer der <b>vorderen<\/b> und <b>hinteren<\/b> oberen Kante, die <b>vertauscht<\/b> sind.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = die oberen zwei Ebenen zweimal. Rw2 = die rechten zwei Ebenen zweimal. r2 = nur die zweite Ebene von rechts, zweimal.","Only these two edges change. Everything else stays where it is.":"Nur diese zwei Kanten ändern sich. Alles andere bleibt, wo es ist.","Mirror cube · last layer":"Mirror cube · letzte Ebene","Three corners (A-perm)":"Drei Ecken (A-perm)","Moves three top corners around. Everything else stays where it is.":"Tauscht drei obere Ecken im Kreis. Alles andere bleibt, wo es ist.","Beginner 3x3":"3x3 für Anfänger","Beginner":"Anfänger","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"Die klassische Anfängermethode. Halte den Würfel mit <b>Gelb oben<\/b> und <b>Grün zu dir<\/b>: Weiß wird zuerst unten gelöst, Gelb zuletzt oben. Klick auf einen Schritt, um ihn in Bewegung zu sehen.","Intermediate 3x3":"3x3 für Fortgeschrittene","Intermediate":"Fortgeschritten","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"Die nächste Stufe: weißes Kreuz wie vorher, dann <b>F2L<\/b> (Ecke und Kante zusammen), <b>2-look OLL<\/b> (alles Gelb oben) und <b>2-look PLL<\/b> (alles am richtigen Platz). Gleicher Griff: Gelb oben, Grün zu dir.","Advanced F2L (3x3)":"Profi-F2L (3x3)","Advanced F2L":"Profi-F2L","Advanced OLL (3x3)":"Profi-OLL (3x3)","Advanced OLL":"Profi-OLL","Advanced PLL (3x3)":"Profi-PLL (3x3)","Advanced PLL":"Profi-PLL","2x2 Beginner":"2x2 Anfänger","2x2 Intermediate":"2x2 Fortgeschritten","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"Weiße Ebene wie bei Anfänger. Dann machen <b>3 Algorithmen<\/b> die ganze Oberseite gelb und <b>2 Algorithmen<\/b> bringen die Ecken an ihren Platz.","2x2 Advanced":"2x2 Profi","Advanced":"Profi","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"Die <b>Ortega<\/b>-Methode. Mach zuerst die <b>weiße Seite<\/b> unten (die Seiten müssen noch nicht passen). Dann dreht einer von <b>7 Algorithmen<\/b> alles Gelb nach oben, und einer von <b>6 Algorithmen<\/b> löst beide Ebenen auf einmal.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"Twisty-Puzzles und große Würfel","push it up, away from you":"nach oben schieben, von dir weg","pull it down, toward you":"nach unten ziehen, zu dir hin","swing it to the left":"nach links schwenken","swing it to the right":"nach rechts schwenken","turn it clockwise, like a clock":"im Uhrzeigersinn drehen, wie eine Uhr","turn it anticlockwise":"gegen den Uhrzeigersinn drehen","push them up, away from you":"beide nach oben schieben, von dir weg","pull them down, toward you":"beide nach unten ziehen, zu dir hin","turn them clockwise, like a clock":"beide im Uhrzeigersinn drehen, wie eine Uhr","turn them anticlockwise":"beide gegen den Uhrzeigersinn drehen","swing them to the right":"beide nach rechts schwenken","swing them to the left":"beide nach links schwenken","clockwise as seen from behind":"im Uhrzeigersinn, von hinten gesehen","anticlockwise as seen from behind":"gegen den Uhrzeigersinn, von hinten gesehen","swing it to the right (like D)":"nach rechts schwenken (wie D)","turn it clockwise, like F":"im Uhrzeigersinn drehen, wie F","tip it so the front comes to the top":"kippen, sodass vorne nach oben kommt","tip it so the top comes to the front":"kippen, sodass oben nach vorne kommt","roll it to the right, like F":"nach rechts rollen, wie F","roll it to the left":"nach links rollen","pull it down, toward you (like L)":"nach unten ziehen, zu dir hin (wie L)","turn it so the right side faces you":"so drehen, dass die rechte Seite zu dir zeigt","turn it so the left side faces you":"so drehen, dass die linke Seite zu dir zeigt","Right face":"Rechte Seite","Left face":"Linke Seite","Top face":"Obere Seite","Bottom face":"Untere Seite","Front face":"Vordere Seite","Back face":"Hintere Seite","Whole cube":"Ganzer Würfel","Right two layers":"Rechte zwei Ebenen","Left two layers":"Linke zwei Ebenen","Front two layers":"Vordere zwei Ebenen","Bottom two layers":"Untere zwei Ebenen","Top two layers":"Obere zwei Ebenen","Back two layers":"Hintere zwei Ebenen","Middle slice":"Mittelschicht","Middle layer":"Mittlere Ebene","Front-back middle slice":"Mittelschicht zwischen vorne und hinten","Only the centre layer next to the right (slice move, the right layer stays still)":"Nur die innere Ebene neben der rechten Seite (Slice-Drehung, die rechte Ebene bleibt stehen)","Only the centre layer next to the left (slice move, the left layer stays still)":"Nur die innere Ebene neben der linken Seite (Slice-Drehung, die linke Ebene bleibt stehen)","Only the centre layer next to the top (slice move, the top layer stays still)":"Nur die innere Ebene neben der oberen Seite (Slice-Drehung, die obere Ebene bleibt stehen)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"Nur die innere Ebene neben der unteren Seite (Slice-Drehung, die untere Ebene bleibt stehen)","Only the centre layer next to the front (slice move, the front layer stays still)":"Nur die innere Ebene neben der vorderen Seite (Slice-Drehung, die vordere Ebene bleibt stehen)","Only the centre layer next to the back (slice move, the back layer stays still)":"Nur die innere Ebene neben der hinteren Seite (Slice-Drehung, die hintere Ebene bleibt stehen)","Top corner with its layer":"Obere Ecke mit ihrer Ebene","Top tip only":"Nur die obere Spitze","Left corner with its layer":"Linke Ecke mit ihrer Ebene","Left tip only":"Nur die linke Spitze","Right corner with its layer":"Rechte Ecke mit ihrer Ebene","Right tip only":"Nur die rechte Spitze","Back corner with its layer":"Hintere Ecke mit ihrer Ebene","Back tip only":"Nur die hintere Spitze","turn it clockwise, as you look at that corner":"im Uhrzeigersinn drehen, wenn du auf diese Ecke schaust","turn it anticlockwise, as you look at that corner":"gegen den Uhrzeigersinn drehen, wenn du auf diese Ecke schaust","{what}: half a turn (turn it twice)":"{what}: halbe Drehung (zweimal drehen)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: drei Drehungen, gleiches Ergebnis wie {mv} ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"Englisch (UK)","English (US)":"Englisch (US)","Arabic":"Arabisch","Chinese":"Chinesisch","French":"Französisch","German":"Deutsch","Hindi":"Hindi","Korean":"Koreanisch","Portuguese":"Portugiesisch","Russian":"Russisch","Spanish":"Spanisch"},"pt":{"Cube Algorithms":"Algoritmos do cubo","Settings":"Definições","Grip: yellow on top, green facing you":"Posição: amarelo em cima, verde virado para ti","Light":"Claro","Dark":"Escuro","Switch to light mode":"Mudar para o modo claro","Switch to dark mode":"Mudar para o modo escuro","Top layer at the start":"Camada de cima no início","Algorithms":"Algoritmos","Turn the cube back":"Rodar o cubo de volta","All {name} steps":"Todos os passos de {name}","Step back":"Recuar","Play":"Reproduzir","Step":"Passo","Reset":"Repor","Reset view":"Repor vista","Play {n}× (back to start!)":"Reproduzir {n}× (volta ao início!)","Speed":"Velocidade","Drag or swipe the cube to turn it around.":"Arrasta ou desliza o cubo para o rodar.","Start":"Início","solved":"resolvido","before":"antes","End":"Fim","Step {n}":"Passo {n}","after {label}":"depois de {label}","Round {r} of {n}: {mv}":"Ronda {r} de {n}: {mv}","{n} rounds later... back exactly where we started!":"{n} rondas depois... de volta exatamente ao início!","Undo {mv}":"Desfazer {mv}","Press Play, or Step through one turn at a time.":"Carrega em Reproduzir, ou em Passo para ver um movimento de cada vez.","Done! Try Play 6x: the cube comes back to the start.":"Feito! Experimenta Reproduzir 6x: o cubo volta ao início.","Done! That is what this step fixes.":"Feito! É isto que este passo resolve.","{i} of {n} turns done. Next: {mv}.":"{i} de {n} movimentos feitos. A seguir: {mv}.","Languages":"Idiomas","Estonian":"Estónio","<b>r<\/b> right two layers":"<b>r<\/b> as duas camadas da direita","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> camada do meio, rodada como L","<b>d<\/b> bottom two layers":"<b>d<\/b> as duas camadas de baixo","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = faz o parêntese 3 vezes","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> as duas camadas da direita juntas","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> as duas camadas de cima juntas","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> só a segunda camada a contar da direita / esquerda / de cima (camada interior, a camada do centro)","<b>M<\/b> middle slice, like L":"<b>M<\/b> camada do meio, como L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> inclinar / tombar o cubo inteiro","<b>y<\/b> turn the whole cube":"<b>y<\/b> rodar o cubo inteiro","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> as duas camadas de baixo / de cima","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> duas camadas de uma vez","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> camada do meio entre a frente e a traseira, como F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> inclinar o cubo inteiro, como R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = faz o parêntese duas vezes","<b>U<\/b> top corner":"<b>U<\/b> canto de cima","<b>L<\/b> front-left corner":"<b>L<\/b> canto da frente à esquerda","<b>R<\/b> front-right corner":"<b>R<\/b> canto da frente à direita","<b>B<\/b> back corner":"<b>B<\/b> canto de trás","capital = the corner with its whole layer":"maiúscula = o canto com toda a sua camada","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = só a ponta","<b>'<\/b> = the other way":"<b>'<\/b> = no outro sentido","plain letter = clockwise as you look at that corner":"letra simples = sentido horário, olhando para esse canto","<b>R<\/b> right":"<b>R<\/b> direita","<b>L<\/b> left":"<b>L<\/b> esquerda","<b>U<\/b> top":"<b>U<\/b> cima","<b>D<\/b> bottom":"<b>D<\/b> baixo","<b>F<\/b> front":"<b>F<\/b> frente","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> rodar o cubo inteiro, a face direita vem para a frente","<b>2<\/b> = twice":"<b>2<\/b> = duas vezes","<b>3<\/b> = three times":"<b>3<\/b> = três vezes","plain letter = clockwise as you look at that face":"letra simples = sentido horário, olhando para essa face","Step 0 · the basic move":"Passo 0 · o movimento básico","The Righty Move":"O movimento Righty","Learn this first. Steps 2 and 3 are built from it.":"Aprende este primeiro. Os passos 2 e 3 são feitos a partir dele.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"Segura o cubo como quiseres. Faz isto <b>6 vezes<\/b> e o cubo volta ao início.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"Diz em voz alta enquanto rodas: \"direita sobe, cima para a esquerda, direita desce, cima para a direita\".","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"A tua mão direita faz os quatro movimentos. Polegar à frente, o indicador empurra a face de cima.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"Seis repetições desfazem-se a si próprias. Ótimo truque para mostrar aos amigos, e prova que as fórmulas não são magia.","Step 0 · the mirror move":"Passo 0 · o movimento espelhado","The Lefty Move":"O movimento Lefty","Righty in a mirror, for the left hand. Same job on the left side.":"O Righty ao espelho, para a mão esquerda. Faz o mesmo trabalho do lado esquerdo.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"Segura o cubo como quiseres. A mão esquerda faz os quatro movimentos. Seis vezes e volta ao início.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"Cada letra fica espelhada: R passa a L, e cada movimento vai no sentido contrário.","Use it in step 2 when the white corner sits above the front-left slot.":"Usa-o no passo 2 quando o canto branco está por cima do espaço da frente à esquerda.","Kids often find this one easier: the left index finger flicks the top toward you.":"Muitas crianças acham este mais fácil: o indicador esquerdo empurra a face de cima na tua direção.","Step 1a · white cross":"Passo 1a · cruz branca","Edge on top, white facing up":"Aresta em cima, branco virado para cima","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"O caso mais fácil da cruz. Roda a face de cima até a aresta ficar por cima do seu espaço, depois roda essa face duas vezes.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>Branco em baixo<\/b>. Uma aresta branca está na camada de cima com o autocolante branco <b>virado para cima<\/b>. Roda a face de cima até a outra cor ficar sobre o centro da mesma cor, aqui verde sobre verde, depois roda essa face duas vezes.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"Olha para a cor lateral da aresta, não para o branco. É ela que te diz que face rodar.","Grey pieces do not matter yet. Corners come in step 2.":"As peças cinzentas ainda não importam. Os cantos vêm no passo 2.","Do this for all four edges. Most of the cross is just this move.":"Faz isto para as quatro arestas. A maior parte da cruz é só este movimento.","Step 1b · white cross":"Passo 1b · cruz branca","Edge on top, white facing sideways":"Aresta em cima, branco virado para o lado","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"Uma aresta branca na camada de cima com o branco virado para ti. Leva-a para baixo na posição certa.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"Branco em baixo. A aresta está <b>em cima à frente<\/b> com o autocolante branco <b>virado para ti<\/b>. A sua outra cor (em cima) é <b>a mesma cor do centro da frente<\/b>, aqui verde. Se não for, roda a face de cima até ser.","The other cross edges are not disturbed.":"As outras arestas da cruz não saem do sítio.","Same ending as 1c: the last three turns tuck the edge in from the left.":"O mesmo final que o 1c: os últimos três movimentos encaixam a aresta pela esquerda.","Step 1c · white cross":"Passo 1c · cruz branca","Edge in the bottom, flipped":"Aresta em baixo, invertida","A white edge already in the bottom, but the wrong way round. Flips it in place.":"Uma aresta branca já em baixo, mas ao contrário. Inverte-a no mesmo sítio.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>Branco em baixo<\/b>, amarelo em cima. A aresta ao contrário está <b>em baixo à frente<\/b>, com o autocolante branco virado para ti. As outras arestas da cruz ficam onde estão.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"Objetivo do passo 1: um sinal de mais branco em baixo, e a cor lateral de cada aresta coincide com o centro ao lado.","Grey pieces do not matter yet. Only look at the white ones.":"As peças cinzentas ainda não importam. Olha só para as brancas.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"Aresta na camada de cima? Roda a face de cima até ficar por cima do seu espaço, depois roda essa face duas vezes.","Step 2a · white corners":"Passo 2a · cantos brancos","Corner above its slot, white facing right":"Canto por cima do seu espaço, branco virado para a direita","The quick case. Three turns and the corner drops in.":"O caso rápido. Três movimentos e o canto encaixa.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"Branco em baixo. O canto branco está na <b>camada de cima, mesmo por cima<\/b> do seu espaço <b>à frente à direita<\/b>, com o autocolante branco <b>virado para a direita<\/b>. As suas outras duas cores coincidem com os centros da frente e da direita.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"É o Righty sem o último movimento. Um Righty também funciona, o movimento extra de cima aqui não muda nada.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"Ainda não está por cima do seu espaço? Roda a camada de cima até estar. Um canto pertence ao sítio onde as suas duas cores laterais encontram os centros da mesma cor.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"O canto já está no espaço mas torcido? Faz um Righty para o tirar, depois começa de novo.","Step 2b · white corners":"Passo 2b · cantos brancos","Corner above its slot, white facing you":"Canto por cima do seu espaço, branco virado para ti","Same corner, white pointing at you. Use the front face instead of the right.":"O mesmo canto, com o branco virado para ti. Usa a face da frente em vez da direita.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"Branco em baixo. O canto branco está na <b>camada de cima, por cima<\/b> do seu espaço <b>à frente à direita<\/b>, com o autocolante branco <b>virado para ti<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"Pensa ao espelho: branco à direita, usa R. Branco à frente, usa F.","Righty five times also does it, but this is three turns instead of twenty.":"Cinco Righty também resolvem, mas assim são três movimentos em vez de vinte.","Step 2c · white corners":"Passo 2c · cantos brancos","Corner above its slot, white facing up":"Canto por cima do seu espaço, branco virado para cima","The slow case: white points at the ceiling. Righty three times.":"O caso lento: o branco aponta para o teto. Righty três vezes.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"Branco em baixo. O canto branco está na <b>camada de cima, por cima<\/b> do seu espaço <b>à frente à direita<\/b>, com o autocolante branco <b>virado para cima<\/b>. Faz Righty até o branco ficar virado para baixo. Aqui são precisas três rondas.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"Observa o canto depois de cada Righty: depois de um, está no espaço mas torcido; depois de dois, volta para cima com o branco virado para a direita; depois de três, está encaixado.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"Qualquer caso de canto resolve-se só com Righty: 1, 3 ou 5 rondas. Os cartões 2a e 2b são só atalhos.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"As suas duas cores laterais têm de coincidir com os centros ao lado. Se não, roda primeiro a camada de cima.","Step 3a · middle layer":"Passo 3a · camada do meio","Edge goes right":"A aresta vai para a direita","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"Leva uma aresta da camada de cima para o espaço da frente à direita. U R U R' U', roda o cubo inteiro para a face direita ficar virada para ti, depois L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"Branco feito, em baixo. Procura uma aresta de cima <b>sem amarelo<\/b>. Roda a face de cima até a sua cor da frente coincidir com o centro da frente. Se a sua cor de cima coincidir com o centro da <b>direita<\/b>, usa este.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"Duas partes: \"U R U R' U'\", depois roda o cubo inteiro (y) para a face direita ficar virada para ti, depois \"L' U' L\".","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"Roda o cubo para o lado certo: a antiga face direita tem de ficar virada para ti. Para o outro lado estraga a camada branca.","You end up looking at a new front side. That is fine, just find the next edge from there.":"Acabas a olhar para uma nova face da frente. Não faz mal, procura a aresta seguinte a partir daí.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"Há uma aresta errada no espaço? Encaixa lá outra aresta qualquer com esta fórmula para a tirar.","Grey pieces are the yellow ones. They do not matter until step 4.":"As peças cinzentas são as amarelas. Só importam a partir do passo 4.","Step 3b · middle layer":"Passo 3b · camada do meio","Edge goes left":"A aresta vai para a esquerda","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"O espelho do 3a: leva a aresta para o espaço da frente à esquerda. U' L' U' L U, roda o cubo inteiro para a face esquerda ficar virada para ti, depois R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"Igual ao 3a, mas a cor de cima da aresta coincide com o centro da <b>esquerda<\/b>.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"Duas partes: \"U' L' U' L U\", depois roda o cubo inteiro (y') para a face esquerda ficar virada para ti, depois \"R U R'\".","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"É o 3a ao espelho: R passa a L, cada movimento vai no sentido contrário, e o cubo roda para a esquerda em vez de para a direita.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"Roda o cubo para o lado certo: a antiga face esquerda tem de ficar virada para ti. Para o outro lado estraga a camada branca.","Once all four middle edges are in, the bottom two layers are done.":"Quando as quatro arestas do meio estiverem no sítio, as duas camadas de baixo estão feitas.","Step 4a · yellow cross":"Passo 4a · cruz amarela","Yellow cross from a line":"Cruz amarela a partir de uma linha","Turns a yellow line on top into a yellow plus.":"Transforma uma linha amarela em cima num sinal de mais amarelo.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"As duas camadas de baixo feitas. Linha amarela em cima, <b>da esquerda para a direita<\/b>. Só um ponto amarelo? Faz isto uma vez, ficas com um L, depois usa o 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"É o Righty entre F e F'. Já conheces a parte do meio.","Ignore the yellow corners for now. Only the plus matters.":"Por agora ignora os cantos amarelos. Só o sinal de mais importa.","Step 4b · yellow cross":"Passo 4b · cruz amarela","Yellow cross from an L":"Cruz amarela a partir de um L","Turns a yellow L shape on top into a yellow plus.":"Transforma uma forma de L amarela em cima num sinal de mais amarelo.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"L amarelo em cima, com os dois braços a apontar <b>para trás e para a esquerda<\/b> (como o 9 e o 12 num relógio).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Quase igual ao 4a, só que o meio é \"U R U' R'\" em vez de \"R U R' U'\".","If the L points the wrong way, turn only the top layer until it fits.":"Se o L estiver virado para o lado errado, roda só a camada de cima até encaixar.","Step 5 · yellow edges":"Passo 5 · arestas amarelas","Yellow edges into place (Sune)":"Arestas amarelas no sítio (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"Segura as duas arestas certas <b>atrás e à direita<\/b>, faz o Sune e depois um movimento U. As quatro arestas amarelas coincidem agora com os seus centros.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"Roda a face de cima até <b>duas arestas<\/b> coincidirem com os seus centros. Duas lado a lado: segura-as <b>atrás e à direita<\/b>, faz o Sune e depois <b>U<\/b> uma vez. Duas opostas: segura-as <b>à frente e atrás<\/b> e faz o Sune uma vez. Agora coincidem duas lado a lado, por isso faz o primeiro caso.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"O movimento final é U (a face amarela de cima), não D. Rodar a face de baixo estragava as camadas brancas.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"Caso oposto: depois de um Sune, o par certo fica à frente e à direita. Roda o cubo inteiro para ficarem atrás e à direita, depois Sune e U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"Os cantos amarelos vão ficar torcidos. Não faz mal, os passos 6 e 7 tratam deles.","Step 6 · yellow corners":"Passo 6 · cantos amarelos","Yellow corners into place (Niklas)":"Cantos amarelos no sítio (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"O Niklas. Troca três cantos de lugar para cada canto ficar entre as suas cores. Ainda não importa se estão torcidos.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"Procura um canto que já esteja <b>entre as cores certas<\/b> (torcido não faz mal) e segura-o <b>à frente à esquerda<\/b>. Nenhum está certo? Faz uma vez a partir de qualquer posição e volta a olhar.","The front-left corner stays put, the other three cycle around.":"O canto da frente à esquerda fica parado, os outros três trocam entre si.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"Não te esqueças do último U. Sem ele, a face de cima fica desalinhada por um movimento e as arestas amarelas do passo 5 deixam de coincidir.","Might need two rounds. Keep the same corner at front left.":"Podes precisar de duas rondas. Mantém o mesmo canto à frente à esquerda.","Step 7 · finish":"Passo 7 · terminar","Twist the yellow corners":"Orientar os cantos amarelos","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"Só o movimento Righty. Amarelo para baixo, canto torcido em baixo à frente à direita. Amarelo virado para o lado: Righty 2 vezes. Amarelo virado para ti: Righty 4 vezes. Depois roda a face de baixo (D) até ao canto seguinte.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>Vira o cubo ao contrário: amarelo em baixo<\/b>, verde ainda virado para ti. Põe um canto torcido <b>em baixo à frente à direita<\/b> e vê para onde aponta o seu autocolante amarelo:<ul class=\"rule\"><li>Amarelo virado <b>para o lado<\/b> (direita) &rarr; Righty <b>2 vezes<\/b><\/li><li>Amarelo virado <b>para ti<\/b> &rarr; Righty <b>4 vezes<\/b><\/li><li>Amarelo virado <b>para baixo<\/b> &rarr; este canto está feito<\/li><\/ul>Depois roda <b>só a camada de baixo (D)<\/b> para trazer o canto torcido seguinte para baixo à frente à direita. Nunca rodes o cubo inteiro.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"Este exemplo orienta dois cantos: o primeiro tem o amarelo virado para o lado (Righty 2 vezes), o segundo tem o amarelo virado para ti (Righty 4 vezes).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"Não tens a certeza? Continua a fazer Righty e olha para o canto a cada 2. Nunca são mais de 4.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"As duas camadas de cima ficam baralhadas a meio. Não entres em pânico e não as tentes arranjar. Voltam ao sítio quando o último canto estiver feito.","Finish with a bottom turn to line up the yellow layer. Solved!":"Acaba com um movimento da face de baixo para alinhar a camada amarela. Resolvido!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · inserção básica 1","Corner white right, edge at the back":"Canto com branco à direita, aresta atrás","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"O canto e a aresta entram no espaço juntos de uma só vez, em vez de primeiro o canto e depois a aresta.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"Canto por cima do espaço <b>da frente à direita<\/b> com o branco <b>virado para a direita<\/b>. A sua aresta está <b>em cima atrás<\/b> com o verde em cima.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = primeiras duas camadas (first two layers). Juntas um canto branco e a sua aresta do meio e depois encaixa-los como um par.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"Primeiro forma tu o par: roda a face de cima até o canto e a aresta ficarem como na imagem.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"Começa a cruz branca como antes e depois usa o F2L em vez dos passos 2 e 3 do método para iniciantes.","F2L · basic insert 2":"F2L · inserção básica 2","Corner white facing you, edge on the left":"Canto com branco virado para ti, aresta à esquerda","Mirror of insert 1, using the front face.":"O espelho da inserção 1, usando a face da frente.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"Canto por cima do espaço <b>da frente à direita<\/b> com o branco <b>virado para ti<\/b>. A sua aresta está <b>em cima à esquerda<\/b> com o laranja em cima.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"Igual à inserção 1 ao espelho: o branco está virado para ti em vez de para a direita, por isso usa F em vez de R.","F2L · basic insert 3":"F2L · inserção básica 3","Corner and edge side by side (right)":"Canto e aresta lado a lado (direita)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"O canto e a aresta estão lado a lado na camada de cima. O U alinha-os e depois entram juntos.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"Canto por cima do espaço <b>da frente à direita<\/b> com o branco <b>virado para ti<\/b> e o verde em cima. A sua aresta está <b>em cima à direita<\/b> com o verde em cima.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"O primeiro U junta o canto e a aresta num bloco. Depois R U' R' põe o bloco no sítio.","F2L · basic insert 4":"F2L · inserção básica 4","Corner and edge side by side (front)":"Canto e aresta lado a lado (frente)","Mirror of insert 3, using the front face.":"O espelho da inserção 3, usando a face da frente.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"Canto por cima do espaço <b>da frente à direita<\/b> com o branco <b>virado para a direita<\/b> e o verde virado para ti. A sua aresta está <b>em cima à frente<\/b> com o verde virado para ti.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"O espelho da inserção 3: R passa a F', R' passa a F, e cada U roda no sentido contrário.","F2L · make a block":"F2L · fazer um bloco","Join corner and edge into a block":"Junta o canto e a aresta num bloco","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"Com o branco virado para cima, não pode entrar diretamente. Primeiro junta o canto e a sua aresta num bloco, depois põe o bloco no sítio.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"Canto por cima do espaço <b>da frente à direita<\/b> com o branco <b>virado para cima<\/b>. A sua aresta está <b>em cima atrás<\/b> com o verde em cima. <b>U R U2 R'<\/b> junta-os num bloco, <b>U R U' R'<\/b> põe o bloco no sítio.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"Olha para a tira em baixo: depois da primeira metade, o canto e a aresta ficam lado a lado com as cores a coincidir. Isso é o bloco.","The second half is basic insert 3. You already know it.":"A segunda metade é a inserção básica 3. Já a conheces.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"Esta é a ideia principal do F2L: faz um bloco na camada de cima e depois encaixa-o. A maioria dos casos de F2L funciona assim.","Block made":"Bloco feito","Block in":"Bloco encaixado","OLL 1 · yellow cross":"OLL 1 · cruz amarela","Dot: make a line or an L":"Ponto: faz uma linha ou um L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"Só o centro amarelo e os dois cantos de trás são amarelos. Nenhuma aresta amarela. Faz a fórmula da linha ou a do L, e aparece uma linha ou um L.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"Amarelo em cima: só o <b>centro<\/b>, o canto <b>de cima à esquerda<\/b> e o <b>de cima à direita<\/b> são amarelos, nenhuma aresta.<ul class=\"rule\"><li>Fórmula da linha <b>F R U R' U' F'<\/b> &rarr; aparece um <b>L<\/b><\/li><li>Fórmula do L <b>F U R U' R' F'<\/b> &rarr; aparece uma <b>linha<\/b><\/li><\/ul>Depois acaba a cruz com o cartão <b>Linha<\/b> ou <b>Forma de L<\/b> abaixo.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"Feito! Apareceu um L. Roda a face de cima até os braços apontarem para trás e para a esquerda, depois faz a fórmula do L.","The animation does the line formula. The L appears with its arms at the front and right.":"A animação faz a fórmula da linha. O L aparece com os braços à frente e à direita.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"Para a fórmula do L, os braços têm de apontar para trás e para a esquerda, por isso roda primeiro a face de cima duas vezes (U2).","Got a line instead? Hold it left to right and do the line formula once more.":"Ficaste com uma linha? Segura-a da esquerda para a direita e faz a fórmula da linha mais uma vez.","Corners do not matter yet. They get fixed in OLL 2.":"Os cantos ainda não importam. São resolvidos na OLL 2.","Line":"Linha","Yellow line on top becomes a yellow cross.":"A linha amarela em cima transforma-se numa cruz amarela.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"Linha amarela em cima, <b>da esquerda para a direita<\/b>. A linha vai da frente para trás? Roda primeiro a face de cima uma vez (U).","L shape":"Forma de L","Yellow L on top becomes a yellow cross.":"O L amarelo em cima transforma-se numa cruz amarela.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"L amarelo em cima, com os braços a apontar <b>para trás e para a esquerda<\/b> (como o 9 e o 12 num relógio). Aponta para outro lado? Roda só a face de cima até encaixar.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"Quase igual à fórmula da linha, só que o meio é \"U R U' R'\" em vez de \"R U R' U'\".","OLL 2 · yellow corners":"OLL 2 · cantos amarelos","Sune":"Sune","One yellow corner up. Looks like a fish.":"Um canto amarelo para cima. Parece um peixe.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Cruz amarela feita. O único canto com amarelo para cima fica <b>à frente à esquerda<\/b>. O canto da frente à direita mostra o amarelo <b>virado para ti<\/b>.","You already know this one from beginner step 5.":"Este já conheces do passo 5 do método para iniciantes.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"Um canto amarelo para cima, o peixe virado ao contrário. É o Sune feito ao contrário.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"O único canto com amarelo para cima fica <b>atrás à direita<\/b>. O canto da frente à esquerda mostra o amarelo <b>virado para ti<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"É o Sune ao contrário: lê o Sune do fim para o início, com cada movimento no sentido contrário.","H (double headlights)":"H (faróis duplos)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"Nenhum canto amarelo para cima. Dois pares de amarelo virados para fora, em lados opostos.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"Pares amarelos nas faces <b>esquerda<\/b> e <b>direita<\/b>.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Começa como o Sune, com um \"R U' R' U\" extra no meio.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"Nenhum canto amarelo para cima. Um par amarelo numa face, os outros dois cantos estão virados para lados opostos.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"O par amarelo (faróis) à <b>esquerda<\/b>. À direita, um amarelo está virado para ti e o outro para trás.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = roda a face direita duas vezes. Mantém o ritmo: R2 U' R2 U' R2.","Headlights":"Faróis","Two yellow corners up next to each other, the other two look at you like headlights.":"Dois cantos amarelos para cima, lado a lado; os outros dois olham para ti como faróis.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"Os dois cantos com amarelo para cima ficam <b>atrás<\/b>. Os faróis <b>virados para ti<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"O movimento D tira a camada branca do sítio por um momento. O D' volta a pô-la no lugar.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"Dois cantos amarelos para cima, lado a lado; os outros dois estão virados para lados opostos.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"Os dois cantos com amarelo para cima ficam <b>à direita<\/b>. À esquerda, um amarelo está virado para ti e o outro para trás.","Small r = turn the right face together with the middle slice.":"r minúsculo = roda a face direita juntamente com a camada do meio.","Bowtie":"Laço","Two yellow corners up, diagonal from each other.":"Dois cantos amarelos para cima, na diagonal um do outro.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"Cantos com amarelo para cima <b>à frente à esquerda<\/b> e <b>atrás à direita<\/b>. O canto da frente à direita mostra o amarelo <b>virado para ti<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"A parte do meio \"r U R' U' r'\" é igual à do T.","PLL 1 · corners":"PLL 1 · cantos","Headlights: T-perm":"Faróis: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"Troca dois cantos lado a lado. Usa-a quando uma face já tem as cores dos cantos iguais (faróis).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"Roda a face de cima até uma face ter <b>faróis<\/b> (os dois cantos da mesma cor). Segura essa face <b>à esquerda<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"PLL em 2 fases (2-look): primeiro põe os cantos certos (2 casos), depois as arestas (4 casos).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"Também troca as arestas da esquerda e da direita. Não faz mal, o passo das arestas resolve isso.","Headlights on every side? Corners are done, go to the edges.":"Faróis em todas as faces? Os cantos estão feitos, passa às arestas.","No headlights: Y-perm":"Sem faróis: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"Troca dois cantos na diagonal. Usa-a quando nenhuma face tem faróis.","No headlights on any side. Hold it any way round.":"Nenhuma face tem faróis. Segura o cubo em qualquer posição.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"São duas partes ao estilo OLL seguidas. Aprende-a em metades: \"F R U' R' U' R U R' F'\" e \"R U R' U' R' F R F'\".","PLL 2 · edges":"PLL 2 · arestas","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"Bloco resolvido à tua frente. A aresta da <b>esquerda<\/b> tem de ir para a <b>direita<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"Cantos feitos. A face resolvida (um bloco completo) <b>à tua frente<\/b>. A aresta da <b>esquerda<\/b> pertence à <b>direita<\/b>: vai para a direita, a aresta da direita vai para trás, a aresta de trás vai para a esquerda.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"Depois da fórmula, a face de cima inteira fica meia volta desalinhada. O último U2 alinha-a com os centros.","The front block never changes. Only the left, right and back edges go round.":"O bloco da frente nunca muda. Só as arestas da esquerda, da direita e de trás dão a volta.","Right edge needs to go left instead? That is the Ub-perm.":"A aresta da direita tem de ir para a esquerda? Então é a Ub-perm.","Lined up":"Alinhado","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"Bloco resolvido à tua frente. A aresta da <b>direita<\/b> tem de ir para a <b>esquerda<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"Cantos feitos. O bloco resolvido <b>à tua frente<\/b>. A aresta da <b>direita<\/b> pertence à <b>esquerda<\/b>: vai para a esquerda, a aresta da esquerda vai para trás, a aresta de trás vai para a direita.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = roda a face direita três vezes. Acaba igual a R', mas os três movimentos rápidos mantêm o teu ritmo.","The front block never moves. Only the left, right and back edges go round.":"O bloco da frente nunca se mexe. Só as arestas da esquerda, da direita e de trás dão a volta.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"Troca arestas opostas: a da frente com a de trás, a da esquerda com a da direita.","Corners done, every edge is opposite its centre. Any way round.":"Cantos feitos, cada aresta está em frente ao centro oposto. Em qualquer posição.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = a camada do meio entre L e R, rodada como L. M2 = duas vezes.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"Troca arestas lado a lado: a da frente com a da direita, a de trás com a da esquerda.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"Cantos feitos. Os pares trocados ficam <b>à frente à direita<\/b> e <b>atrás à esquerda<\/b>.","The last U lines the top back up with the centres.":"O último U volta a alinhar a face de cima com os centros.","F2L 1":"F2L 1","Case 1":"Caso 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"Canto no espaço, branco virado para baixo. A aresta no espaço, invertida.","F2L 2":"F2L 2","Case nhuma aresta amarela e 4 cantos amarelos em cima.","OLL 21":"OLL 21","4 yellow edges and no yellow corners on top.":"4 arestas amarelas e nenhum canto amarelo em cima.","OLL 22":"OLL 22","OLL 23":"OLL 23","4 yellow edges and 2 yellow corners on top.":"4 arestas amarelas e 2 cantos amarelos em cima.","OLL 24":"OLL 24","OLL 25":"OLL 25","OLL 26":"OLL 26","4 yellow edges and 1 yellow corner on top.":"4 arestas amarelas e 1 canto amarelo em cima.","OLL 27":"OLL 27","OLL 28":"OLL 28","2 yellow edges and 4 yellow corners on top.":"2 arestas amarelas e 4 cantos amarelos em cima.","OLL 29":"OLL 29","2 yellow edges and 2 yellow corners on top.":"2 arestas amarelas e 2 cantos amarelos em cima.","OLL 30":"OLL 30","OLL 31":"OLL 31","OLL 32":"OLL 32","OLL 33":"OLL 33","OLL 34":"OLL 34","OLL 35":"OLL 35","OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"Caso 42","OLL 43":"OLL 43","Case 43":"Caso 43","OLL 44":"OLL 44","Case 44":"Caso 44","OLL 45":"OLL 45","Case 45":"Caso 45","OLL 46":"OLL 46","Case 46":"Caso 46","OLL 47":"OLL 47","Case 47":"Caso 47","2 yellow edges and no yellow corners on top.":"2 arestas amarelas e nenhum canto amarelo em cima.","OLL 48":"OLL 48","Case 48":"Caso 48","OLL 49":"OLL 49","Case 49":"Caso 49","OLL 50":"OLL 50","Case 50":"Caso 50","OLL 51":"OLL 51","Case 51":"Caso 51","OLL 52":"OLL 52","Case 52":"Caso 52","OLL 53":"OLL 53","Case 53":"Caso 53","OLL 54":"OLL 54","Case 54":"Caso 54","OLL 55":"OLL 55","Case 55":"Caso 55","OLL 56":"OLL 56","Case 56":"Caso 56","OLL 57":"OLL 57","Case 57":"Caso 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · Passo 1a · camada branca","Corner above its spot, white facing right":"Canto por cima do seu lugar, branco virado para a direita","Same as 3x3 step 2a. Three turns and the white corner drops in.":"Igual ao passo 2a do 3x3. Três movimentos e o canto branco encaixa.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>Branco em baixo<\/b>. Um 2x2 não tem centros: o <b>primeiro<\/b> canto branco pode ir para qualquer lado. Cada canto seguinte vai para onde as suas cores laterais <b>coincidem com os cantos brancos ao lado<\/b>. Aqui: o canto está <b>por cima do seu lugar<\/b> à frente à direita, branco <b>virado para a direita<\/b>.","Not above its spot yet? Turn the top until it is.":"Ainda não está por cima do seu lugar? Roda a face de cima até estar.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"O canto já está em baixo, mas no lugar errado ou torcido? Segura-o à frente à direita e faz um Righty para o tirar.","Righty once works here too.":"Um Righty também funciona aqui.","2x2 · Step 1b · white layer":"2x2 · Passo 1b · camada branca","Corner above its spot, white facing you":"Canto por cima do seu lugar, branco virado para ti","Same as 3x3 step 2b: white facing you, so use the front face.":"Igual ao passo 2b do 3x3: o branco está virado para ti, por isso usa a face da frente.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"Branco em baixo. O canto branco está <b>por cima do seu lugar<\/b> à frente à direita, branco <b>virado para ti<\/b>.","Righty five times also does it.":"Cinco Righty também resolvem.","2x2 · Step 1c · white layer":"2x2 · Passo 1c · camada branca","Corner above its spot, white facing up":"Canto por cima do seu lugar, branco virado para cima","Same as 3x3 step 2c: Righty three times.":"Igual ao passo 2c do 3x3: Righty três vezes.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"Branco em baixo. O canto branco está <b>por cima do seu lugar<\/b> à frente à direita, branco <b>virado para cima<\/b>. Faz Righty até o branco ficar virado para baixo.","Any white corner works with Righty alone: 1, 3 or 5 times.":"Qualquer canto branco se resolve só com Righty: 1, 3 ou 5 vezes.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"Faz isto para os quatro cantos brancos. A camada branca está feita quando as cores laterais de cada canto branco coincidem com as dos cantos ao lado.","2x2 · Step 2 · yellow corners":"2x2 · Passo 2 · cantos amarelos","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"Igual ao passo 6 do 3x3. Troca três cantos de cima de lugar para cada canto ficar por cima do canto branco certo. Ainda não importa se estão torcidos.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"Camada branca feita, em baixo. Um canto de cima está <b>no lugar<\/b> quando as suas cores laterais coincidem com os cantos brancos por baixo (torcido não faz mal). Roda a face de cima até <b>exatamente um<\/b> canto estar no lugar e segura-o <b>à frente à esquerda<\/b>.","The front-left corner stays put, the other three move round. You may need it twice.":"O canto da frente à esquerda fica parado, os outros três trocam entre si. Podes precisar de fazer duas vezes.","No turn of the top gives exactly
