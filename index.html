不能正好有一个角块归位？随便从哪里做一次，然后再看。这在 2x2 上会发生，在 3x3 上从来不会。","All four in place? Go to step 3.":"四个都归位了？去第 3 步。","2x2 · Step 3 · finish":"2x2 · 第 3 步 · 完成","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"和 3x3 第 7 步一样。黄色朝下，扭转的角块放在底层右前。黄色朝侧面：Righty 2 次。黄色朝向你：Righty 4 次。然后转动底层（D）换到下一个角块。","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>把魔方翻过来：黄色在底面。<\/b>把一个扭转的角块放在<b>底层右前<\/b>，看它的黄色色片朝哪里：<ul class=\"rule\"><li>黄色朝<b>侧面<\/b>（右）&rarr; Righty <b>2 次<\/b><\/li><li>黄色<b>朝向你<\/b> &rarr; Righty <b>4 次<\/b><\/li><li>黄色<b>朝下<\/b> &rarr; 这个角块已经好了<\/li><\/ul>然后<b>只转底层（D）<\/b>，把下一个扭转的角块转到那里。千万不要转整个魔方。","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"做到一半时，白色层看起来是乱的。继续做，最后一个角块完成时它会恢复。","At the end, turn one layer until the two layers line up. Solved!":"最后转动一层，直到两层对齐。还原了！","2x2 · Orientation 1 of 3":"2x2 · 定向 1/3","Sune: one yellow corner up":"Sune：一个黄色角块朝上","One yellow corner up. Makes the top yellow, or another case you then fix.":"一个黄色角块朝上。做完后顶面全黄，或者变成另一种情况，再接着处理。","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"白色层已完成，在底面。把黄色朝上的角块放在<b>左前<\/b>。右前角块的黄色<b>朝向你<\/b>。","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"两个黄色角块朝上？拿好魔方，让左前角块的黄色朝向你，做 Sune，然后再看。","It never takes more than three orientation algorithms in a row.":"最多连续做三个定向公式就够了。","2x2 · Orientation 2 of 3":"2x2 · 定向 2/3","Antisune: one yellow corner up, other way":"Antisune：一个黄色角块朝上，方向相反","One yellow corner up, the other way round from the Sune.":"一个黄色角块朝上，方向和 Sune 相反。","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"把黄色朝上的角块放在<b>右后<\/b>。左前角块的黄色<b>朝向你<\/b>。","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"如果 Sune 和 Antisune 的图都对不上，转动顶层再看。","2x2 · Orientation 3 of 3":"2x2 · 定向 3/3","Pi: no yellow corner up":"Pi：没有黄色角块朝上","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"没有黄色角块朝上。做完后要么黄色全部朝上，要么得到 Sune 或 Antisune 的情况。","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"顶面没有黄色。拿好魔方，让<b>左边<\/b>两个角块的黄色都<b>朝左<\/b>。","Yellow pairs on the left and on the right? Hold either pair on the left.":"左边和右边都有一对黄色？把任意一对放在左边。","R2 = turn the right side twice.":"R2 = 右面转两次。","2x2 · Permutation 1 of 2":"2x2 · 排列 1/2","T-perm: headlights on one side":"T-perm：一侧有车灯","All yellow is up. Swaps two corners next to each other.":"黄色全部朝上。交换两个相邻的角块。","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"找<b>车灯<\/b>：某一侧顶层的两个色片颜色相同。把这一侧放在<b>左边<\/b>。","Headlights on every side? Nothing to swap: just turn the top to line it up.":"每一侧都有车灯？不用交换：只要转动顶层对齐。","After the T-perm, turn the top until the cube is solved.":"做完 T-perm 后，转动顶层直到魔方还原。","2x2 · Permutation 2 of 2":"2x2 · 排列 2/2","Y-perm: no headlights":"Y-perm：没有车灯","All yellow is up but no side has headlights. Swaps two corners diagonally.":"黄色全部朝上，但没有一侧有车灯。沿对角线交换两个角块。","No headlights anywhere. Hold it any way round.":"哪里都没有车灯。怎么拿都行。","After the Y-perm, turn the top until the cube is solved.":"做完 Y-perm 后，转动顶层直到魔方还原。","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"分两半学：“F R U' R' U' R U R' F'”和“R U R' U' R' F R F'”。","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"让黄色全部朝上。白色面保持在底面。","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"一个黄色角块朝上，在<b>左前<\/b>。右前角块的黄色<b>朝向你<\/b>。","White face on the bottom first: only white needs to be down, the sides can be mixed.":"先把白色面做在底面：只要白色朝下就行，侧面可以是乱的。","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"一个黄色角块朝上，在<b>右后<\/b>。左前角块的黄色<b>朝向你<\/b>。","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"没有黄色角块朝上。两对黄色在<b>左面<\/b>和<b>右面<\/b>。","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"没有黄色角块朝上。一对黄色在<b>左面<\/b>；右边一个黄色朝向你，一个朝后。","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"两个黄色角块朝上，在<b>后面<\/b>。另外两个的黄色<b>朝向你<\/b>。","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"两个黄色角块朝上，在<b>右边<\/b>。左边一个黄色朝向你，一个朝后。","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"黄色朝上的角块在<b>左前<\/b>和<b>右后<\/b>。右前角块的黄色<b>朝向你<\/b>。","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"顶层：车灯，底层：已完成","All yellow up, all white down. Fixes both layers at once.":"黄色全部朝上，白色全部朝下。同时还原两层。","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"顶层：车灯在<b>左边<\/b>。底层：已经正确。","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>车灯<\/b> = 某一侧这一层的两个色片颜色相同。","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"顶层对了但底层错了？把整个魔方翻过来，让错的那层在上面，然后用卡片 1 或 2。","After the algorithm, turn the top and bottom until the cube is solved.":"做完公式后，转动顶层和底层，直到魔方还原。","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"顶层：没有车灯，底层：已完成","Top layer: no headlights. Bottom layer: already right.":"顶层：没有车灯。底层：已经正确。","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"两层都有车灯","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"<b>两层<\/b>都有车灯。转动顶层和底层，让车灯都在<b>前面<\/b>。","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"两层都没有车灯","No headlights in either layer. Hold it any way round.":"两层都没有车灯。怎么拿都行。","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"顶层：车灯，底层：没有","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"顶层：车灯在<b>前面<\/b>。底层：没有车灯。","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"顶层：没有，底层：车灯","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"顶层：没有车灯。底层：车灯在<b>后面<\/b>。","Pyraminx · Step 1 · tips":"Pyraminx · 第 1 步 · 小角","Turn the tips":"转动小角","The easiest step: each tip turns on its own.":"最简单的一步：每个小角都单独转。","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"转动每个小角（<b>u l r b<\/b>），直到它的三种颜色和紧挨着的<b>三个中心块<\/b>一致。","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"小角有三种颜色。每种颜色都要和同一面上、紧挨在它下方的中心三角块一致。","Turning a tip never moves anything else, so you can always fix the tips first.":"转动小角不会移动其他任何块，所以你随时可以先把小角对好。","Pyraminx · Step 2 · centres":"Pyraminx · 第 2 步 · 中心块","Match the centres":"对齐中心块","Turn whole corners until every face has three centres of the same colour.":"转动整个角，直到每个面的三个中心块颜色相同。","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"转动整个角（<b>U L R B<\/b>），直到每个面上的<b>三个中心块<\/b>颜色都相同。然后拿好魔方，让<b>黄色面在底面<\/b>。","Each corner carries its tip and its three centres with it, so step 1 stays done.":"每个角都会带着它的小角和三个中心块一起转，所以第 1 步的成果不会被破坏。","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"这样做时棱块会被打乱。没关系，第 3 步和第 4 步会处理。","Pyraminx · Step 3a · bottom edges":"Pyraminx · 第 3a 步 · 底部棱块","Edge on the right, yellow facing you":"棱块在右边，黄色朝向你","Puts the green-yellow edge into the front bottom.":"把绿黄棱块放到前面底部。","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"黄色面在底面。属于<b>前面底部<\/b>的棱块位于<b>右前<\/b>棱上，黄色<b>朝向你<\/b>。","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"转动整个魔方（黄色保持朝下），让你要填的位置在前面底部。","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"棱块已经在底部，但位置不对或翻转了？把那个位置放在前面底部，做一次这个公式，把棱块弄上来。","Pyraminx · Step 3b · bottom edges":"Pyraminx · 第 3b 步 · 底部棱块","Edge on the right, yellow facing right":"棱块在右边，黄色朝右","Same edge, the other way round.":"同一个棱块，方向相反。","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"棱块位于<b>右前<\/b>棱上，黄色朝<b>右<\/b>。","Pyraminx · Step 3c · bottom edges":"Pyraminx · 第 3c 步 · 底部棱块","Edge on the left, yellow facing you":"棱块在左边，黄色朝向你","The edge is on the left side.":"棱块在左侧。","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"棱块位于<b>左前<\/b>棱上，黄色<b>朝向你<\/b>。","Pyraminx · Step 3d · bottom edges":"Pyraminx · 第 3d 步 · 底部棱块","Edge on the left, yellow facing left":"棱块在左边，黄色朝左","Mirror of 3b.":"3b 的镜像。","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"棱块位于<b>左前<\/b>棱上，黄色朝<b>左<\/b>。","Pyraminx · Step 3e · bottom edges":"Pyraminx · 第 3e 步 · 底部棱块","Edge at the back, yellow facing right":"棱块在后面，黄色朝右","The edge is on the back edge.":"棱块在后面的棱上。","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"棱块位于<b>后面<\/b>的棱上，黄色朝<b>右<\/b>。","Pyraminx · Step 3f · bottom edges":"Pyraminx · 第 3f 步 · 底部棱块","Edge at the back, yellow facing left":"棱块在后面，黄色朝左","Mirror of 3e.":"3e 的镜像。","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"棱块位于<b>后面<\/b>的棱上，黄色朝<b>左<\/b>。","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"三个底部棱块都这样做。当每个底部棱块都和两边的中心块一致时，黄色面就完成了。","Pyraminx · Step 4a · last edges":"Pyraminx · 第 4a 步 · 最后的棱块","Edges go round (one way)":"棱块轮换（一个方向）","Moves the three top edges round.":"让顶部三个棱块轮换。","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"黄色面已完成，在底面。顶部<b>没有<\/b>一个棱块在正确位置。<b>左前<\/b>的棱块属于<b>右前<\/b>。","After it, two edges may be flipped. Then do 4c.":"做完后，可能有两个棱块翻转了。那就做 4c。","You never need more than two algorithms for the last edges.":"最后的棱块最多只需要两个公式。","Pyraminx · Step 4b · last edges":"Pyraminx · 第 4b 步 · 最后的棱块","Edges go round (other way)":"棱块轮换（另一个方向）","Moves the three top edges round the other way.":"让顶部三个棱块往另一个方向轮换。","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"顶部<b>没有<\/b>一个棱块在正确位置。<b>左前<\/b>的棱块属于<b>后面<\/b>。","Pyraminx · Step 4c · last edges":"Pyraminx · 第 4c 步 · 最后的棱块","Two edges flipped":"两个棱块翻转","All three top edges are in their place, but two are flipped.":"顶部三个棱块都在正确位置，但有两个翻转了。","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"顶部棱块都在正确位置，其中两个翻转了。拿好魔方，让<b>好的棱块在后面<\/b>。","Solved!":"还原了！","4x4 · 1 · edge pairing":"4x4 · 1 · 对棱","Join two halves opposite each other":"把相对的两半合起来","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"4x4 的棱块由两半组成。当两半彼此相对时，这个公式把它们合成一个棱块。","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"中心块已完成。同一个棱块的两半（这里是<b>蓝橙<\/b>棱）<b>彼此相对<\/b>：一个在<b>左前棱的上半<\/b>，一个在<b>右前棱的上半<\/b>，两个都<b>橙色朝向你<\/b>。只有蓝橙块是彩色的，方便你跟踪。","Joined! The blue-orange edge is now one piece, at the front right.":"合好了！蓝橙棱块现在是一整块，在右前。","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = 顶部两层一起转。Uw' 把左边那半带到右边，最后的 Uw 把中心块放回去。","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"中间部分“R U R' F R' F' R”把一个已完成的棱块换进来，让两半能够相遇。魔方其他部分会被打乱：没关系，之后像 3x3 一样还原。","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"用这个方法配好全部 12 个棱块，然后像 3x3 一样还原 4x4。","Edge joined":"棱块已合并","4x4 · 1b · edge pairing":"4x4 · 1b · 对棱","Combine with the centre layer, then swap it out":"用内层合并，再换出去","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"只转内层把两半合起来，把合好的棱块和一个还没合的换位置，然后把内层转回来。","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"中心块已完成。同一个棱块的两半（这里是<b>蓝橙<\/b>棱）在<b>对角<\/b>位置：一个在<b>左前棱的上半<\/b>，<b>橙色朝向你<\/b>；一个在<b>右前棱的下半<\/b>，<b>蓝色朝向你<\/b>。只有蓝橙块是彩色的，方便你跟踪。","Joined! The blue-orange edge is now one piece, at the top front.":"合好了！蓝橙棱块现在是一整块，在顶层前面。","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"这种转动有个名字：<b>内层转动<\/b>（slice move）。小写 u 的意思是：<b>只转上面的内层<\/b>（从上数第二层）。顶层不动。","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = 内层向右转（同 U'）。上面那半移到右边，正好叠在下面那半上方：棱块就合好了。","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R' 把合好的棱块送到顶层，并把一个还没合的棱块放到它原来的位置。","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = 把内层转回来，让中心块重新还原。合好的棱块留在顶层，不会散开。","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"如果下面那半在左边、上面那半在右边，就把内层往另一个方向转：u L' U' L u'。","Halves combined":"两半已合并","Swapped out":"已换出","4x4 · 2 · OLL parity":"4x4 · 2 · OLL 奇偶","No 3x3 OLL fits":"没有合适的 3x3 OLL","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"当你的顶面<b>没有对应的 3x3 公式<\/b>时，就做这个。这只在 4x4 上出现：翻转的顶层棱块是奇数个（1 或 3 个），像图里那样。它会翻转前面的棱块，这样普通的 3x3 OLL 又能用了。","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"黄色在顶面。像图里一样：<b>3 个棱块翻转了<\/b>（前、右、后棱块在顶面显示的是侧面颜色），只有<b>左边<\/b>的棱块黄色朝上。图是从上往下看顶面，前面在下方。把一个<b>翻转的棱块放在前面<\/b>。","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"现在翻转的棱块是偶数个（后和左），前面两个角块也转动了：又变回普通的 3x3 情况。用你的 3x3 OLL 和 PLL 完成。","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"怎么识别：数一数顶面不是黄色朝上的棱块。1 或 3 个 = 没有 3x3 公式能用，先做这个。","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>右边两层一起转<\/b>（双层转动），Lw = 左边两层一起转。很多公式表上写成小写的 r 和 l。","U2 and F2 turn only the outer top and front layer, twice.":"U2 和 F2 只转最外面的顶层和前层，各转两次。","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"前面的棱块翻过来了。顶层其他一些块也会移动：没关系，你平常的 3x3 OLL 和 PLL 会处理。","4x4 · 3 · PLL parity":"4x4 · 3 · PLL 奇偶","Two edges swapped":"两个棱块互换","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"也只在 4x4 上出现：到最后，顶层两个相对的棱块互换了。这个公式把它们换回来。","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"除了顶层<b>前面<\/b>和<b>后面<\/b>的棱块被<b>互换<\/b>以外，其他都已还原。","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = 顶部两层转两次。Rw2 = 右边两层转两次。r2 = 只转从右数第二层，转两次。","Only these two edges change. Everything else stays where it is.":"只有这两个棱块改变。其他都保持不动。","Mirror cube · last layer":"Mirror cube · 最后一层","Three corners (A-perm)":"三个角块（A-perm）","Moves three top corners around. Everything else stays where it is.":"让三个顶层角块轮换位置。其他都保持不动。","Beginner 3x3":"3x3 入门","Beginner":"入门","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"经典的入门方法。拿好魔方，<b>黄色朝上<\/b>，<b>绿色朝向你<\/b>：先在底面还原白色，最后在顶面还原黄色。点击一个步骤，看它怎么转。","Intermediate 3x3":"3x3 进阶","Intermediate":"进阶","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"更进一步：照常先做白色十字，然后是 <b>F2L<\/b>（角块和棱块一起放），<b>2-look OLL<\/b>（两步 OLL，顶面全黄）和 <b>2-look PLL<\/b>（两步 PLL，全部归位）。握法相同：黄色朝上，绿色朝向你。","Advanced F2L (3x3)":"高级 F2L（3x3）","Advanced F2L":"高级 F2L","Advanced OLL (3x3)":"高级 OLL（3x3）","Advanced OLL":"高级 OLL","Advanced PLL (3x3)":"高级 PLL（3x3）","Advanced PLL":"高级 PLL","2x2 Beginner":"2x2 入门","2x2 Intermediate":"2x2 进阶","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"白色层和入门法一样。然后用 <b>3 个公式<\/b>让整个顶面变黄，再用 <b>2 个公式<\/b>让角块归位。","2x2 Advanced":"2x2 高级","Advanced":"高级","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"<b>Ortega<\/b> 方法。先在底面做出<b>白色面<\/b>（侧面颜色暂时不用对齐）。然后用 <b>7 个公式<\/b>中的一个让黄色全部朝上，再用 <b>6 个公式<\/b>中的一个同时还原两层。","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"异形和高阶魔方","push it up, away from you":"往上推，远离你","pull it down, toward you":"往下拉，朝向你","swing it to the left":"往左拨","swing it to the right":"往右拨","turn it clockwise, like a clock":"顺时针转，像时钟一样","turn it anticlockwise":"逆时针转","push them up, away from you":"把它们往上推，远离你","pull them down, toward you":"把它们往下拉，朝向你","turn them clockwise, like a clock":"把它们顺时针转，像时钟一样","turn them anticlockwise":"把它们逆时针转","swing them to the right":"把它们往右拨","swing them to the left":"把它们往左拨","clockwise as seen from behind":"从后面看是顺时针","anticlockwise as seen from behind":"从后面看是逆时针","swing it to the right (like D)":"往右拨（同 D）","turn it clockwise, like F":"顺时针转，同 F","tip it so the front comes to the top":"翻转魔方，让前面转到顶面","tip it so the top comes to the front":"翻转魔方，让顶面转到前面","roll it to the right, like F":"向右侧滚，同 F","roll it to the left":"向左侧滚","pull it down, toward you (like L)":"往下拉，朝向你（同 L）","turn it so the right side faces you":"转动魔方，让右面朝向你","turn it so the left side faces you":"转动魔方，让左面朝向你","Right face":"右面","Left face":"左面","Top face":"顶面","Bottom face":"底面","Front face":"前面","Back face":"后面","Whole cube":"整个魔方","Right two layers":"右边两层","Left two layers":"左边两层","Front two layers":"前面两层","Bottom two layers":"底部两层","Top two layers":"顶部两层","Back two layers":"后面两层","Middle slice":"中间层","Middle layer":"中层","Front-back middle slice":"前后之间的中间层","Only the centre layer next to the right (slice move, the right layer stays still)":"只转靠右边的内层（内层转动，右层不动）","Only the centre layer next to the left (slice move, the left layer stays still)":"只转靠左边的内层（内层转动，左层不动）","Only the centre layer next to the top (slice move, the top layer stays still)":"只转靠顶部的内层（内层转动，顶层不动）","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"只转靠底部的内层（内层转动，底层不动）","Only the centre layer next to the front (slice move, the front layer stays still)":"只转靠前面的内层（内层转动，前层不动）","Only the centre layer next to the back (slice move, the back layer stays still)":"只转靠后面的内层（内层转动，后层不动）","Top corner with its layer":"顶角连同它的层","Top tip only":"只转顶部小角","Left corner with its layer":"左角连同它的层","Left tip only":"只转左边小角","Right corner with its layer":"右角连同它的层","Right tip only":"只转右边小角","Back corner with its layer":"后角连同它的层","Back tip only":"只转后面小角","turn it clockwise, as you look at that corner":"看着那个角，顺时针转","turn it anticlockwise, as you look at that corner":"看着那个角，逆时针转","{what}: half a turn (turn it twice)":"{what}：半圈（转两次）","{what}: three turns, ends the same as {mv} ({hint})":"{what}：转三次，结果和 {mv} 一样（{hint}）","{what}: {hint}":"{what}：{hint}","English (UK)":"英语（英国）","English (US)":"英语（美国）","Arabic":"阿拉伯语","Chinese":"中文","French":"法语","German":"德语","Hindi":"印地语","Korean":"韩语","Portuguese":"葡萄牙语","Russian":"俄语","Spanish":"西班牙语"},"hi":{"Cube Algorithms":"क्यूब एल्गोरिदम","Settings":"सेटिंग्स","Grip: yellow on top, green facing you":"पकड़: पीला ऊपर, हरा तुम्हारी तरफ़","Light":"लाइट","Dark":"डार्क","Switch to light mode":"लाइट मोड पर जाओ","Switch to dark mode":"डार्क मोड पर जाओ","Top layer at the start":"शुरुआत में ऊपर की लेयर","Algorithms":"एल्गोरिदम","Turn the cube back":"क्यूब को वापस घुमाओ","All {name} steps":"{name} के सभी स्टेप","Step back":"एक स्टेप पीछे","Play":"चलाओ","Step":"स्टेप","Reset":"रीसेट","Reset view":"व्यू रीसेट","Play {n}× (back to start!)":"{n}× चलाओ (वापस शुरुआत पर!)","Speed":"स्पीड","Drag or swipe the cube to turn it around.":"क्यूब को चारों तरफ़ से देखने के लिए उसे खींचो या स्वाइप करो।","Start":"शुरू","solved":"सॉल्व्ड","before":"पहले","End":"अंत","Step {n}":"स्टेप {n}","after {label}":"{label} के बाद","Round {r} of {n}: {mv}":"राउंड {r}/{n}: {mv}","{n} rounds later... back exactly where we started!":"{n} राउंड बाद... ठीक वहीं वापस जहाँ से शुरू किया था!","Undo {mv}":"{mv} वापस करो","Press Play, or Step through one turn at a time.":"“चलाओ” दबाओ, या “स्टेप” से एक-एक मूव करके देखो।","Done! Try Play 6x: the cube comes back to the start.":"हो गया! अब “6× चलाओ” आज़माओ: क्यूब वापस शुरुआत पर आ जाता है।","Done! That is what this step fixes.":"हो गया! यह स्टेप यही ठीक करता है।","{i} of {n} turns done. Next: {mv}.":"{n} में से {i} मूव हो गए। अगला: {mv}।","Languages":"भाषाएँ","Estonian":"एस्टोनियाई","<b>r<\/b> right two layers":"<b>r<\/b> दाईं दो लेयर","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> बीच की स्लाइस, L की तरह घुमाओ","<b>d<\/b> bottom two layers":"<b>d<\/b> नीचे की दो लेयर","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = ब्रैकेट वाला हिस्सा 3 बार करो","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> दाईं दो लेयर एक साथ","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> ऊपर की दो लेयर एक साथ","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> सिर्फ़ दाएँ / बाएँ / ऊपर से दूसरी लेयर (अंदर की स्लाइस, सेंटर वाली लेयर)","<b>M<\/b> middle slice, like L":"<b>M<\/b> बीच की स्लाइस, L की तरह","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> पूरे क्यूब को आगे पलटो / बगल में लुढ़काओ","<b>y<\/b> turn the whole cube":"<b>y<\/b> पूरे क्यूब को घुमाओ","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> नीचे / ऊपर की दो लेयर","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> दो लेयर एक साथ","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> सामने और पीछे के बीच की स्लाइस, F की तरह","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> पूरे क्यूब को पलटो, R की तरह","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = ब्रैकेट वाला हिस्सा 2 बार करो","<b>U<\/b> top corner":"<b>U<\/b> ऊपर वाला कॉर्नर","<b>L<\/b> front-left corner":"<b>L<\/b> सामने-बायाँ कॉर्नर","<b>R<\/b> front-right corner":"<b>R<\/b> सामने-दायाँ कॉर्नर","<b>B<\/b> back corner":"<b>B<\/b> पीछे वाला कॉर्नर","capital = the corner with its whole layer":"बड़ा अक्षर = कॉर्नर अपनी पूरी लेयर के साथ","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = सिर्फ़ टिप","<b>'<\/b> = the other way":"<b>'<\/b> = उल्टी दिशा में","plain letter = clockwise as you look at that corner":"सिर्फ़ अक्षर = उस कॉर्नर की तरफ़ से देखने पर घड़ी की दिशा में","<b>R<\/b> right":"<b>R<\/b> दायाँ","<b>L<\/b> left":"<b>L<\/b> बायाँ","<b>U<\/b> top":"<b>U<\/b> ऊपर","<b>D<\/b> bottom":"<b>D<\/b> नीचे","<b>F<\/b> front":"<b>F<\/b> सामने","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> पूरे क्यूब को घुमाओ, दाईं साइड सामने आ जाए","<b>2<\/b> = twice":"<b>2<\/b> = दो बार","<b>3<\/b> = three times":"<b>3<\/b> = तीन बार","plain letter = clockwise as you look at that face":"सिर्फ़ अक्षर = उस साइड की तरफ़ से देखने पर घड़ी की दिशा में","Step 0 · the basic move":"स्टेप 0 · बेसिक मूव","The Righty Move":"Righty मूव","Learn this first. Steps 2 and 3 are built from it.":"इसे सबसे पहले सीखो। स्टेप 2 और 3 इसी से बने हैं।","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"क्यूब को जैसे चाहो वैसे पकड़ो। इसे <b>6 बार<\/b> करो और क्यूब वापस शुरुआत पर आ जाता है।","Say it out loud while you turn: \"right up, top left, right down, top right\".":"घुमाते समय ज़ोर से बोलो: \"दायाँ ऊपर, ऊपर बाएँ, दायाँ नीचे, ऊपर दाएँ\"।","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"चारों मूव तुम्हारा दायाँ हाथ करता है। अंगूठा सामने, और इंडेक्स उंगली ऊपर की लेयर को झटके से घुमाती है।","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"छह बार करने पर सब अपने आप वापस हो जाता है। दोस्तों को दिखाने के लिए बढ़िया ट्रिक, और इससे पता चलता है कि एल्गोरिदम कोई जादू नहीं हैं।","Step 0 · the mirror move":"स्टेप 0 · मिरर मूव","The Lefty Move":"Lefty मूव","Righty in a mirror, for the left hand. Same job on the left side.":"शीशे में दिखने वाला Righty, बाएँ हाथ के लिए। बाईं साइड पर वही काम करता है।","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"क्यूब को जैसे चाहो वैसे पकड़ो। चारों मूव बायाँ हाथ करता है। छह बार करो और क्यूब वापस शुरुआत पर।","Every letter is mirrored: R becomes L, and each turn goes the other way.":"हर अक्षर मिरर हो जाता है: R बन जाता है L, और हर मूव उल्टी दिशा में जाता है।","Use it in step 2 when the white corner sits above the front-left slot.":"स्टेप 2 में इसे तब इस्तेमाल करो जब सफ़ेद कॉर्नर सामने-बाएँ स्लॉट के ऊपर हो।","Kids often find this one easier: the left index finger flicks the top toward you.":"बच्चों को अक्सर यह आसान लगता है: बाएँ हाथ की इंडेक्स उंगली ऊपर की लेयर को अपनी तरफ़ घुमाती है।","Step 1a · white cross":"स्टेप 1a · सफ़ेद क्रॉस","Edge on top, white facing up":"एज ऊपर, सफ़ेद ऊपर की तरफ़","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"क्रॉस का सबसे आसान केस। ऊपर की लेयर तब तक घुमाओ जब तक एज अपने स्लॉट के ऊपर न आ जाए, फिर उस साइड को दो बार घुमाओ।","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>सफ़ेद नीचे<\/b>। एक सफ़ेद एज ऊपर की लेयर में है और उसका सफ़ेद स्टिकर <b>ऊपर की तरफ़<\/b> है। ऊपर की लेयर तब तक घुमाओ जब तक उसका दूसरा रंग उसी रंग के सेंटर के ऊपर न आ जाए, यहाँ हरा हरे के ऊपर, फिर उस साइड को दो बार घुमाओ।","Look at the side colour of the edge, not the white. It tells you which face to turn.":"एज का साइड वाला रंग देखो, सफ़ेद नहीं। वही बताता है कि कौन-सी साइड घुमानी है।","Grey pieces do not matter yet. Corners come in step 2.":"ग्रे पीस अभी मायने नहीं रखते। कॉर्नर स्टेप 2 में आएँगे।","Do this for all four edges. Most of the cross is just this move.":"चारों एज के लिए यही करो। ज़्यादातर क्रॉस बस इसी मूव से बनता है।","Step 1b · white cross":"स्टेप 1b · सफ़ेद क्रॉस","Edge on top, white facing sideways":"एज ऊपर, सफ़ेद बगल की तरफ़","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"ऊपर की लेयर में एक सफ़ेद एज, जिसका सफ़ेद तुम्हारी तरफ़ है। यह उसे सही तरफ़ से नीचे बिठा देता है।","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"सफ़ेद नीचे। एज <b>ऊपर सामने<\/b> है और सफ़ेद स्टिकर <b>तुम्हारी तरफ़<\/b> है। उसका दूसरा रंग (ऊपर वाला) <b>सामने के सेंटर जैसा ही रंग<\/b> है, यहाँ हरा। अगर नहीं है, तो ऊपर की लेयर तब तक घुमाओ जब तक न हो जाए।","The other cross edges are not disturbed.":"क्रॉस के बाकी एज नहीं हिलते।","Same ending as 1c: the last three turns tuck the edge in from the left.":"आखिर का हिस्सा 1c जैसा ही है: आखिरी तीन मूव एज को बाईं तरफ़ से अंदर बिठा देते हैं।","Step 1c · white cross":"स्टेप 1c · सफ़ेद क्रॉस","Edge in the bottom, flipped":"एज नीचे, उल्टा","A white edge already in the bottom, but the wrong way round. Flips it in place.":"सफ़ेद एज पहले से नीचे है, पर उल्टा। यह उसे वहीं पलट देता है।","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>सफ़ेद नीचे<\/b>, पीला ऊपर। उल्टा एज <b>सामने नीचे<\/b> है, सफ़ेद स्टिकर तुम्हारी तरफ़। क्रॉस के बाकी एज अपनी जगह पर रहते हैं।","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"स्टेप 1 का लक्ष्य: नीचे सफ़ेद प्लस, और हर एज का साइड वाला रंग उसके बगल वाले सेंटर से मिले।","Grey pieces do not matter yet. Only look at the white ones.":"ग्रे पीस अभी मायने नहीं रखते। सिर्फ़ सफ़ेद वाले देखो।","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"एज ऊपर की लेयर में है? ऊपर की लेयर तब तक घुमाओ जब तक वह अपने स्लॉट के ऊपर न आ जाए, फिर उस साइड को दो बार घुमाओ।","Step 2a · white corners":"स्टेप 2a · सफ़ेद कॉर्नर","Corner above its slot, white facing right":"कॉर्नर अपने स्लॉट के ऊपर, सफ़ेद दाईं तरफ़","The quick case. Three turns and the corner drops in.":"जल्दी वाला केस। तीन मूव और कॉर्नर अंदर।","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"सफ़ेद नीचे। सफ़ेद कॉर्नर <b>ऊपर की लेयर में<\/b>, अपने <b>सामने-दाएँ<\/b> स्लॉट के <b>ठीक ऊपर<\/b> है, सफ़ेद स्टिकर दाईं तरफ़। उसके बाकी दो रंग सामने और दाएँ सेंटर से मिलते हैं।","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"यह आखिरी मूव के बिना Righty है। एक बार पूरा Righty करना भी चलेगा, ऊपर का एक्स्ट्रा मूव यहाँ कुछ नहीं बिगाड़ता।","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"अभी अपने स्लॉट के ऊपर नहीं है? ऊपर की लेयर तब तक घुमाओ जब तक न आ जाए। कॉर्नर की जगह वहाँ है जहाँ उसके दोनों साइड वाले रंग अपने जैसे सेंटर से मिलते हैं।","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"कॉर्नर स्लॉट में तो है पर मुड़ा हुआ है? उसे बाहर निकालने के लिए एक Righty करो, फिर दोबारा शुरू करो।","Step 2b · white corners":"स्टेप 2b · सफ़ेद कॉर्नर","Corner above its slot, white facing you":"कॉर्नर अपने स्लॉट के ऊपर, सफ़ेद तुम्हारी तरफ़","Same corner, white pointing at you. Use the front face instead of the right.":"वही कॉर्नर, सफ़ेद तुम्हारी तरफ़। दाईं की जगह सामने वाली साइड इस्तेमाल करो।","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"सफ़ेद नीचे। सफ़ेद कॉर्नर <b>ऊपर की लेयर में<\/b> अपने <b>सामने-दाएँ<\/b> स्लॉट के ऊपर है, सफ़ेद स्टिकर <b>तुम्हारी तरफ़<\/b>।","Mirror thinking: white on the right, use R. White on the front, use F.":"मिरर की तरह सोचो: सफ़ेद दाईं तरफ़ है तो R लगाओ। सफ़ेद सामने है तो F लगाओ।","Righty five times also does it, but this is three turns instead of twenty.":"पाँच बार Righty से भी हो जाता है, पर यह बीस की जगह सिर्फ़ तीन मूव है।","Step 2c · white corners":"स्टेप 2c · सफ़ेद कॉर्नर","Corner above its slot, white facing up":"कॉर्नर अपने स्लॉट के ऊपर, सफ़ेद ऊपर की तरफ़","The slow case: white points at the ceiling. Righty three times.":"धीमा केस: सफ़ेद छत की तरफ़ है। तीन बार Righty।","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"सफ़ेद नीचे। सफ़ेद कॉर्नर <b>ऊपर की लेयर में<\/b> अपने <b>सामने-दाएँ<\/b> स्लॉट के ऊपर है, सफ़ेद स्टिकर <b>ऊपर की तरफ़<\/b>। तब तक Righty करो जब तक सफ़ेद नीचे की तरफ़ न हो जाए। यहाँ इसमें तीन राउंड लगते हैं।","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"हर Righty के बाद कॉर्नर को देखो: एक के बाद वह स्लॉट में है पर मुड़ा हुआ, दो के बाद वापस ऊपर है और सफ़ेद दाईं तरफ़, तीन के बाद अंदर।","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"कॉर्नर का हर केस सिर्फ़ Righty से हो जाता है: 1, 3 या 5 राउंड। कार्ड 2a और 2b बस शॉर्टकट हैं।","Its two side colours must match the centres next to it. If not, turn the top layer first.":"उसके दोनों साइड वाले रंग बगल के सेंटर से मिलने चाहिए। अगर नहीं, तो पहले ऊपर की लेयर घुमाओ।","Step 3a · middle layer":"स्टेप 3a · बीच की लेयर","Edge goes right":"एज दाईं तरफ़ जाता है","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"ऊपर की लेयर से एक एज को सामने-दाएँ स्लॉट में डालता है। U R U R' U', पूरे क्यूब को घुमाओ ताकि दाईं साइड तुम्हारी तरफ़ आ जाए, फिर L' U' L।","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"सफ़ेद हो गया, नीचे है। ऊपर का ऐसा एज ढूँढो <b>जिसमें पीला न हो<\/b>। ऊपर की लेयर घुमाओ ताकि उसका सामने वाला रंग सामने के सेंटर से मिल जाए। अगर उसका ऊपर वाला रंग <b>दाएँ<\/b> सेंटर से मिलता है, तो यह इस्तेमाल करो।","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"दो हिस्से: \"U R U R' U'\", फिर पूरे क्यूब को घुमाओ (y) ताकि दाईं साइड तुम्हारी तरफ़ आ जाए, फिर \"L' U' L\"।","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"क्यूब को सही दिशा में घुमाओ: पुरानी दाईं साइड तुम्हारी तरफ़ आनी चाहिए। उल्टी दिशा में घुमाने से सफ़ेद लेयर बिगड़ जाती है।","You end up looking at a new front side. That is fine, just find the next edge from there.":"अब तुम्हारे सामने नई साइड होगी। कोई बात नहीं, वहीं से अगला एज ढूँढो।","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"स्लॉट में गलत एज बैठा है? उसे बाहर निकालने के लिए इसी एल्गोरिदम से कोई और एज अंदर डाल दो।","Grey pieces are the yellow ones. They do not matter until step 4.":"ग्रे पीस पीले वाले हैं। स्टेप 4 तक वे मायने नहीं रखते।","Step 3b · middle layer":"स्टेप 3b · बीच की लेयर","Edge goes left":"एज बाईं तरफ़ जाता है","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"3a का मिरर: एज को सामने-बाएँ स्लॉट में डालता है। U' L' U' L U, पूरे क्यूब को घुमाओ ताकि बाईं साइड तुम्हारी तरफ़ आ जाए, फिर R U R'।","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"3a जैसा ही, पर एज का ऊपर वाला रंग <b>बाएँ<\/b> सेंटर से मिलता है।","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"दो हिस्से: \"U' L' U' L U\", फिर पूरे क्यूब को घुमाओ (y') ताकि बाईं साइड तुम्हारी तरफ़ आ जाए, फिर \"R U R'\"।","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"यह शीशे में दिखने वाला 3a है: R बन जाता है L, हर मूव उल्टी दिशा में जाता है, और क्यूब दाईं की जगह बाईं तरफ़ घूमता है।","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"क्यूब को सही दिशा में घुमाओ: पुरानी बाईं साइड तुम्हारी तरफ़ आनी चाहिए। उल्टी दिशा में घुमाने से सफ़ेद लेयर बिगड़ जाती है।","Once all four middle edges are in, the bottom two layers are done.":"जब बीच के चारों एज अंदर हो जाएँ, तो नीचे की दो लेयर पूरी हो जाती हैं।","Step 4a · yellow cross":"स्टेप 4a · पीला क्रॉस","Yellow cross from a line":"लाइन से पीला क्रॉस","Turns a yellow line on top into a yellow plus.":"ऊपर की पीली लाइन को पीले प्लस में बदलता है।","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"नीचे की दो लेयर पूरी। ऊपर पीली लाइन, <b>बाएँ से दाएँ<\/b> पकड़ी हुई। सिर्फ़ पीला डॉट है? इसे एक बार करो, L बन जाएगा, फिर 4b इस्तेमाल करो।","This is Righty wrapped in F and F'. You already know the middle part.":"यह F और F' के बीच में रखा Righty है। बीच वाला हिस्सा तुम पहले से जानते हो।","Ignore the yellow corners for now. Only the plus matters.":"अभी पीले कॉर्नर पर ध्यान मत दो। सिर्फ़ प्लस मायने रखता है।","Step 4b · yellow cross":"स्टेप 4b · पीला क्रॉस","Yellow cross from an L":"L से पीला क्रॉस","Turns a yellow L shape on top into a yellow plus.":"ऊपर के पीले L शेप को पीले प्लस में बदलता है।","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"ऊपर पीला L, उसकी दोनों भुजाएँ <b>पीछे और बाईं तरफ़<\/b> (जैसे घड़ी में 9 और 12)।","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"लगभग 4a जैसा ही, बस बीच में \"R U R' U'\" की जगह \"U R U' R'\" है।","If the L points the wrong way, turn only the top layer until it fits.":"अगर L गलत दिशा में है, तो सिर्फ़ ऊपर की लेयर घुमाओ जब तक सही न हो जाए।","Step 5 · yellow edges":"स्टेप 5 · पीले एज","Yellow edges into place (Sune)":"पीले एज अपनी जगह पर (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"मिलते हुए दो एज को <b>पीछे और दाईं तरफ़<\/b> रखो, Sune करो, फिर एक U मूव। अब चारों पीले एज अपने सेंटर से मिल जाते हैं।","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"ऊपर की लेयर तब तक घुमाओ जब तक <b>दो एज<\/b> अपने सेंटर से न मिल जाएँ। दोनों बगल-बगल में हैं: उन्हें <b>पीछे और दाईं तरफ़<\/b> रखो, Sune करो, फिर एक बार <b>U<\/b>। दोनों आमने-सामने हैं: उन्हें <b>सामने और पीछे<\/b> रखो और एक बार Sune करो। अब बगल-बगल वाले दो मिल जाएँगे, तो पहला केस करो।","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"आखिरी मूव U है (पीला ऊपर वाला), D नहीं। नीचे की लेयर घुमाने से सफ़ेद लेयर बिगड़ जाएँगी।","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"आमने-सामने वाला केस: एक Sune के बाद मिलती हुई जोड़ी सामने और दाईं तरफ़ होती है। पूरे क्यूब को घुमाओ ताकि वे पीछे और दाईं तरफ़ आ जाएँ, फिर Sune और U।","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"पीले कॉर्नर इधर-उधर मुड़ जाएँगे। कोई बात नहीं, स्टेप 6 और 7 उन्हें ठीक करते हैं।","Step 6 · yellow corners":"स्टेप 6 · पीले कॉर्नर","Yellow corners into place (Niklas)":"पीले कॉर्नर अपनी जगह पर (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"Niklas। तीन कॉर्नर की जगह बदलता है ताकि हर कॉर्नर अपने रंगों के बीच आ जाए। अभी मुड़ा होना मायने नहीं रखता।","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"ऐसा कॉर्नर ढूँढो जो पहले से <b>सही रंगों के बीच<\/b> हो (मुड़ा हुआ चलेगा) और उसे <b>सामने बाईं तरफ़<\/b> रखो। कोई भी सही नहीं? कहीं से भी एक बार करो, फिर दोबारा देखो।","The front-left corner stays put, the other three cycle around.":"सामने-बायाँ कॉर्नर अपनी जगह रहता है, बाकी तीन घूमकर जगह बदलते हैं।","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"आखिरी U मत भूलना। उसके बिना ऊपर की लेयर एक मूव पीछे रह जाती है और स्टेप 5 वाले पीले एज फिर नहीं मिलते।","Might need two rounds. Keep the same corner at front left.":"दो राउंड लग सकते हैं। वही कॉर्नर सामने बाईं तरफ़ रखो।","Step 7 · finish":"स्टेप 7 · फ़िनिश","Twist the yellow corners":"पीले कॉर्नर मोड़ो","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"बस Righty मूव। पीला नीचे, मुड़ा हुआ कॉर्नर नीचे सामने दाईं तरफ़। पीला बगल की तरफ़: 2 बार Righty। पीला तुम्हारी तरफ़: 4 बार Righty। फिर नीचे की लेयर (D) घुमाकर अगला कॉर्नर लाओ।","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>क्यूब को पलटो: पीला नीचे<\/b>, हरा अब भी तुम्हारी तरफ़। एक मुड़े हुए कॉर्नर को <b>नीचे सामने दाईं तरफ़<\/b> रखो और देखो उसका पीला स्टिकर किधर है:<ul class=\"rule\"><li>पीला <b>बगल की तरफ़<\/b> (दाईं) &rarr; <b>2 बार<\/b> Righty<\/li><li>पीला <b>तुम्हारी तरफ़<\/b> &rarr; <b>4 बार<\/b> Righty<\/li><li>पीला <b>नीचे की तरफ़<\/b> &rarr; यह कॉर्नर हो गया<\/li><\/ul>फिर <b>सिर्फ़ नीचे की लेयर (D)<\/b> घुमाकर अगला मुड़ा हुआ कॉर्नर नीचे सामने दाईं तरफ़ लाओ। पूरे क्यूब को कभी मत घुमाना।","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"इस उदाहरण में दो कॉर्नर मोड़े जाते हैं: पहले में पीला बगल की तरफ़ है (2 बार Righty), दूसरे में पीला तुम्हारी तरफ़ है (4 बार Righty)।","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"पक्का नहीं पता? बस Righty करते रहो और हर 2 के बाद कॉर्नर देखो। कभी 4 से ज़्यादा नहीं लगते।","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"बीच में ऊपर की दो लेयर बिखरी हुई दिखेंगी। घबराओ मत और उन्हें ठीक मत करो। आखिरी कॉर्नर होते ही वे अपने आप वापस ठीक हो जाती हैं।","Finish with a bottom turn to line up the yellow layer. Solved!":"आखिर में नीचे की लेयर घुमाकर पीली लेयर को सीध में लाओ। सॉल्व्ड!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · बेसिक इंसर्ट 1","Corner white right, edge at the back":"कॉर्नर का सफ़ेद दाईं तरफ़, एज पीछे","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"कॉर्नर और एज एक ही बार में साथ-साथ स्लॉट में जाते हैं, पहले कॉर्नर और बाद में एज नहीं।","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"कॉर्नर <b>सामने-दाएँ<\/b> स्लॉट के ऊपर, सफ़ेद <b>दाईं तरफ़<\/b>। उसका एज <b>ऊपर पीछे<\/b> है, हरा ऊपर।","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = first two layers (पहली दो लेयर)। तुम एक सफ़ेद कॉर्नर और उसका बीच वाला एज साथ में जोड़ते हो, फिर उन्हें जोड़ी बनाकर अंदर डालते हो।","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"पहले खुद उनकी जोड़ी बनाओ: ऊपर की लेयर तब तक घुमाओ जब तक कॉर्नर और एज तस्वीर जैसे न बैठ जाएँ।","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"सफ़ेद क्रॉस पहले की तरह बनाओ, फिर बिगिनर स्टेप 2 और 3 की जगह F2L इस्तेमाल करो।","F2L · basic insert 2":"F2L · बेसिक इंसर्ट 2","Corner white facing you, edge on the left":"कॉर्नर का सफ़ेद तुम्हारी तरफ़, एज बाईं तरफ़","Mirror of insert 1, using the front face.":"इंसर्ट 1 का मिरर, सामने वाली साइड से।","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"कॉर्नर <b>सामने-दाएँ<\/b> स्लॉट के ऊपर, सफ़ेद <b>तुम्हारी तरफ़<\/b>। उसका एज <b>ऊपर बाईं तरफ़<\/b> है, नारंगी ऊपर।","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"मिरर में इंसर्ट 1 जैसा ही: सफ़ेद दाईं की जगह तुम्हारी तरफ़ है, इसलिए R की जगह F लगाओ।","F2L · basic insert 3":"F2L · बेसिक इंसर्ट 3","Corner and edge side by side (right)":"कॉर्नर और एज बगल-बगल (दाईं तरफ़)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"कॉर्नर और एज ऊपर की लेयर में बगल-बगल हैं। U उन्हें सीध में लाता है, फिर वे साथ में अंदर चले जाते हैं।","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"कॉर्नर <b>सामने-दाएँ<\/b> स्लॉट के ऊपर, सफ़ेद <b>तुम्हारी तरफ़<\/b> और हरा ऊपर। उसका एज <b>ऊपर दाईं तरफ़<\/b> है, हरा ऊपर।","The first U joins corner and edge into a block. R U' R' then puts the block in.":"पहला U कॉर्नर और एज को जोड़कर ब्लॉक बनाता है। फिर R U' R' ब्लॉक को अंदर डालता है।","F2L · basic insert 4":"F2L · बेसिक इंसर्ट 4","Corner and edge side by side (front)":"कॉर्नर और एज बगल-बगल (सामने)","Mirror of insert 3, using the front face.":"इंसर्ट 3 का मिरर, सामने वाली साइड से।","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"कॉर्नर <b>सामने-दाएँ<\/b> स्लॉट के ऊपर, सफ़ेद <b>दाईं तरफ़<\/b> और हरा तुम्हारी तरफ़। उसका एज <b>ऊपर सामने<\/b> है, हरा तुम्हारी तरफ़।","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"इंसर्ट 3 का मिरर: R बन जाता है F', R' बन जाता है F, और हर U उल्टी दिशा में घूमता है।","F2L · make a block":"F2L · ब्लॉक बनाओ","Join corner and edge into a block":"कॉर्नर और एज को जोड़कर ब्लॉक बनाओ","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"सफ़ेद ऊपर की तरफ़ हो तो कॉर्नर सीधा अंदर नहीं जा सकता। पहले कॉर्नर और उसके एज को जोड़कर एक ब्लॉक बनाओ, फिर ब्लॉक को अंदर डालो।","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"कॉर्नर <b>सामने-दाएँ<\/b> स्लॉट के ऊपर, सफ़ेद <b>ऊपर की तरफ़<\/b>। उसका एज <b>ऊपर पीछे<\/b> है, हरा ऊपर। <b>U R U2 R'<\/b> उन्हें जोड़कर ब्लॉक बनाता है, <b>U R U' R'<\/b> ब्लॉक को अंदर डालता है।","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"नीचे वाली पट्टी देखो: पहले आधे हिस्से के बाद कॉर्नर और एज मिलते रंगों के साथ बगल-बगल बैठते हैं। यही ब्लॉक है।","The second half is basic insert 3. You already know it.":"दूसरा आधा हिस्सा बेसिक इंसर्ट 3 है। उसे तुम पहले से जानते हो।","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"F2L का मुख्य आइडिया यही है: ऊपर की लेयर में ब्लॉक बनाओ, फिर उसे अंदर डालो। ज़्यादातर F2L केस ऐसे ही होते हैं।","Block made":"ब्लॉक बना","Block in":"ब्लॉक अंदर","OLL 1 · yellow cross":"OLL 1 · पीला क्रॉस","Dot: make a line or an L":"डॉट: लाइन या L बनाओ","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"सिर्फ़ पीला सेंटर और पीछे के दो कॉर्नर पीले हैं। कोई पीला एज नहीं। लाइन वाला या L वाला एल्गोरिदम करो, और लाइन या L बन जाएगा।","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"पीला ऊपर: सिर्फ़ <b>सेंटर<\/b>, <b>ऊपर-बायाँ<\/b> और <b>ऊपर-दायाँ<\/b> कॉर्नर पीले हैं, कोई एज नहीं।<ul class=\"rule\"><li>लाइन वाला एल्गोरिदम <b>F R U R' U' F'<\/b> &rarr; <b>L<\/b> बनता है<\/li><li>L वाला एल्गोरिदम <b>F U R U' R' F'<\/b> &rarr; <b>लाइन<\/b> बनती है<\/li><\/ul>फिर नीचे वाले <b>लाइन<\/b> या <b>L शेप<\/b> कार्ड से क्रॉस पूरा करो।","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"हो गया! L बन गया। ऊपर की लेयर घुमाओ ताकि उसकी भुजाएँ पीछे और बाईं तरफ़ हों, फिर L वाला एल्गोरिदम करो।","The animation does the line formula. The L appears with its arms at the front and right.":"एनिमेशन लाइन वाला एल्गोरिदम करता है। L बनता है, उसकी भुजाएँ सामने और दाईं तरफ़।","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"L वाले एल्गोरिदम के लिए भुजाएँ पीछे और बाईं तरफ़ होनी चाहिए, इसलिए पहले ऊपर की लेयर दो बार घुमाओ (U2)।","Got a line instead? Hold it left to right and do the line formula once more.":"इसकी जगह लाइन बन गई? उसे बाएँ से दाएँ पकड़ो और लाइन वाला एल्गोरिदम एक बार और करो।","Corners do not matter yet. They get fixed in OLL 2.":"कॉर्नर अभी मायने नहीं रखते। वे OLL 2 में ठीक होंगे।","Line":"लाइन","Yellow line on top becomes a yellow cross.":"ऊपर की पीली लाइन पीला क्रॉस बन जाती है।","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"ऊपर पीली लाइन, <b>बाएँ से दाएँ<\/b> पकड़ी हुई। लाइन आगे से पीछे जा रही है? पहले ऊपर की लेयर एक बार घुमाओ (U)।","L shape":"L शेप","Yellow L on top becomes a yellow cross.":"ऊपर का पीला L पीला क्रॉस बन जाता है।","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"ऊपर पीला L, उसकी भुजाएँ <b>पीछे और बाईं तरफ़<\/b> (जैसे घड़ी में 9 और 12)। कहीं और हैं? सिर्फ़ ऊपर की लेयर घुमाओ जब तक सही न हो जाए।","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"लगभग लाइन वाले एल्गोरिदम जैसा ही, बस बीच में \"R U R' U'\" की जगह \"U R U' R'\" है।","OLL 2 · yellow corners":"OLL 2 · पीले कॉर्नर","Sune":"Sune","One yellow corner up. Looks like a fish.":"एक पीला कॉर्नर ऊपर। मछली जैसा दिखता है।","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"पीला क्रॉस हो गया। पीला-ऊपर वाला अकेला कॉर्नर <b>सामने बाईं तरफ़<\/b>। सामने-दाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","You already know this one from beginner step 5.":"इसे तुम बिगिनर स्टेप 5 से पहले से जानते हो।","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"एक पीला कॉर्नर ऊपर, मछली दूसरी तरफ़। उल्टा चलाया हुआ Sune।","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"पीला-ऊपर वाला अकेला कॉर्नर <b>पीछे दाईं तरफ़<\/b>। सामने-बाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","It is the Sune backwards: read the Sune from the end, every turn the other way.":"यह उल्टा Sune है: Sune को आखिर से पढ़ो, हर मूव उल्टी दिशा में।","H (double headlights)":"H (डबल हेडलाइट्स)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"कोई पीला कॉर्नर ऊपर नहीं। आमने-सामने की साइड पर पीले की दो जोड़ियाँ बाहर की तरफ़।","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"पीली जोड़ियाँ <b>बाईं<\/b> और <b>दाईं<\/b> साइड पर।","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"Sune की तरह शुरू होता है, बीच में एक एक्स्ट्रा \"R U' R' U\" के साथ।","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"कोई पीला कॉर्नर ऊपर नहीं। एक साइड पर पीली जोड़ी, बाकी दो कॉर्नर एक-दूसरे से उल्टी तरफ़ देखते हैं।","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"पीली जोड़ी (हेडलाइट्स) <b>बाईं तरफ़<\/b>। दाईं तरफ़ एक पीला तुम्हारी तरफ़ और एक पीछे की तरफ़।","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = दाईं साइड को दो बार घुमाओ। लय बनाए रखो: R2 U' R2 U' R2।","Headlights":"हेडलाइट्स","Two yellow corners up next to each other, the other two look at you like headlights.":"दो पीले कॉर्नर ऊपर बगल-बगल, बाकी दो हेडलाइट्स की तरह तुम्हें देखते हैं।","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"पीला-ऊपर वाले दोनों कॉर्नर <b>पीछे<\/b>। हेडलाइट्स <b>तुम्हारी तरफ़<\/b>।","The D turn moves the white layer for a moment. D' puts it back.":"D मूव थोड़ी देर के लिए सफ़ेद लेयर को हिलाता है। D' उसे वापस ले आता है।","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"दो पीले कॉर्नर ऊपर बगल-बगल, बाकी दो एक-दूसरे से उल्टी तरफ़ देखते हैं।","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"पीला-ऊपर वाले दोनों कॉर्नर <b>दाईं तरफ़<\/b>। बाईं तरफ़ एक पीला तुम्हारी तरफ़ और एक पीछे की तरफ़।","Small r = turn the right face together with the middle slice.":"छोटा r = दाईं साइड को बीच की स्लाइस के साथ घुमाओ।","Bowtie":"बो-टाई","Two yellow corners up, diagonal from each other.":"दो पीले कॉर्नर ऊपर, एक-दूसरे से तिरछे।","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"पीला-ऊपर वाले कॉर्नर <b>सामने बाईं तरफ़<\/b> और <b>पीछे दाईं तरफ़<\/b>। सामने-दाएँ कॉर्नर का पीला <b>तुम्हारी तरफ़<\/b> है।","The middle part \"r U R' U' r'\" is the same as in the T.":"बीच वाला हिस्सा \"r U R' U' r'\" T जैसा ही है।","PLL 1 · corners":"PLL 1 · कॉर्नर","Headlights: T-perm":"हेडलाइट्स: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"बगल-बगल के दो कॉर्नर आपस में बदलता है। इसे तब इस्तेमाल करो जब किसी एक साइड पर कॉर्नर के रंग पहले से मिलते हों (हेडलाइट्स)।","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"ऊपर की लेयर तब तक घुमाओ जब तक किसी साइड पर <b>हेडलाइट्स<\/b> न आ जाएँ (दोनों कॉर्नर एक ही रंग के)। उस साइड को <b>बाईं तरफ़<\/b> रखो।","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"2-look PLL: पहले कॉर्नर सही करो (2 केस), फिर एज (4 केस)।","It also swaps the left and right edges. That is fine, the edge step fixes it.":"यह बाएँ और दाएँ एज को भी आपस में बदल देता है। कोई बात नहीं, एज वाला स्टेप उसे ठीक कर देता है।","Headlights on every side? Corners are done, go to the edges.":"हर साइड पर हेडलाइट्स? कॉर्नर हो गए, अब एज पर जाओ।","No headlights: Y-perm":"हेडलाइट्स नहीं: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"दो तिरछे कॉर्नर को आपस में बदलता है। इसे तब इस्तेमाल करो जब किसी भी साइड पर हेडलाइट्स न हों।","No headlights on any side. Hold it any way round.":"किसी भी साइड पर हेडलाइट्स नहीं। किसी भी तरह पकड़ो।","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"यह लगातार OLL जैसे दो हिस्से हैं। इसे आधा-आधा करके सीखो: \"F R U' R' U' R U R' F'\" और \"R U R' U' R' F R F'\"।","PLL 2 · edges":"PLL 2 · एज","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"सॉल्व्ड ब्लॉक तुम्हारे सामने। <b>बाएँ<\/b> एज को <b>दाईं तरफ़<\/b> जाना है।","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"कॉर्नर हो गए। सॉल्व्ड साइड (पूरा ब्लॉक) <b>तुम्हारे सामने<\/b>। <b>बाएँ<\/b> एज की जगह <b>दाईं तरफ़<\/b> है: वह दाईं तरफ़ जाता है, दायाँ एज पीछे जाता है, पीछे वाला एज बाईं तरफ़ जाता है।","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"एल्गोरिदम के बाद पूरी ऊपर की लेयर आधा चक्कर घूमी हुई रहती है। आखिरी U2 उसे सेंटर के साथ सीध में लाता है।","The front block never changes. Only the left, right and back edges go round.":"सामने वाला ब्लॉक कभी नहीं बदलता। सिर्फ़ बाएँ, दाएँ और पीछे वाले एज घूमते हैं।","Right edge needs to go left instead? That is the Ub-perm.":"इसकी जगह दाएँ एज को बाईं तरफ़ जाना है? वह Ub-perm है।","Lined up":"सीध में","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"सॉल्व्ड ब्लॉक तुम्हारे सामने। <b>दाएँ<\/b> एज को <b>बाईं तरफ़<\/b> जाना है।","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"कॉर्नर हो गए। सॉल्व्ड ब्लॉक <b>तुम्हारे सामने<\/b>। <b>दाएँ<\/b> एज की जगह <b>बाईं तरफ़<\/b> है: वह बाईं तरफ़ जाता है, बायाँ एज पीछे जाता है, पीछे वाला एज दाईं तरफ़ जाता है।","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = दाईं साइड को तीन बार घुमाओ। नतीजा R' जैसा ही है, पर तीन तेज़ मूव से तुम्हारी लय बनी रहती है।","The front block never moves. Only the left, right and back edges go round.":"सामने वाला ब्लॉक कभी नहीं हिलता। सिर्फ़ बाएँ, दाएँ और पीछे वाले एज घूमते हैं।","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"आमने-सामने के एज आपस में बदलता है: सामने वाला पीछे वाले से, बायाँ दाएँ से।","Corners done, every edge is opposite its centre. Any way round.":"कॉर्नर हो गए, हर एज अपने सेंटर की ठीक उल्टी साइड पर है। किसी भी तरह पकड़ो।","M = the middle slice between L and R, turned like L. M2 = twice.":"M = L और R के बीच की स्लाइस, L की तरह घुमाओ। M2 = दो बार।","Z-perm":"Z-perm","Swaps edges next to each other: front with r
