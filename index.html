"OLL 36":"OLL 36","OLL 37":"OLL 37","OLL 38":"OLL 38","OLL 39":"OLL 39","OLL 40":"OLL 40","OLL 41":"OLL 41","OLL 42":"OLL 42","Case 42":"케이스 42","OLL 43":"OLL 43","Case 43":"케이스 43","OLL 44":"OLL 44","Case 44":"케이스 44","OLL 45":"OLL 45","Case 45":"케이스 45","OLL 46":"OLL 46","Case 46":"케이스 46","OLL 47":"OLL 47","Case 47":"케이스 47","2 yellow edges and no yellow corners on top.":"윗면에 노란색 엣지는 2개 있고, 노란색 코너는 없어요.","OLL 48":"OLL 48","Case 48":"케이스 48","OLL 49":"OLL 49","Case 49":"케이스 49","OLL 50":"OLL 50","Case 50":"케이스 50","OLL 51":"OLL 51","Case 51":"케이스 51","OLL 52":"OLL 52","Case 52":"케이스 52","OLL 53":"OLL 53","Case 53":"케이스 53","OLL 54":"OLL 54","Case 54":"케이스 54","OLL 55":"OLL 55","Case 55":"케이스 55","OLL 56":"OLL 56","Case 56":"케이스 56","OLL 57":"OLL 57","Case 57":"케이스 57","PLL 1":"PLL 1","PLL 2":"PLL 2","PLL 3":"PLL 3","PLL 4":"PLL 4","PLL 5":"PLL 5","PLL 6":"PLL 6","PLL 7":"PLL 7","PLL 8":"PLL 8","PLL 9":"PLL 9","PLL 10":"PLL 10","PLL 11":"PLL 11","PLL 12":"PLL 12","PLL 13":"PLL 13","PLL 14":"PLL 14","PLL 15":"PLL 15","PLL 16":"PLL 16","PLL 17":"PLL 17","PLL 18":"PLL 18","PLL 19":"PLL 19","PLL 20":"PLL 20","PLL 21":"PLL 21","2x2 · Step 1a · white layer":"2x2 · 1a단계 · 흰색 층","Corner above its spot, white facing right":"코너가 자리 위에 있고 흰색이 오른쪽을 향할 때","Same as 3x3 step 2a. Three turns and the white corner drops in.":"3x3의 2a단계와 같아요. 세 번만 돌리면 흰색 코너가 쏙 들어가요.","<b>White on the bottom<\/b>. A 2x2 has no centres: the <b>first<\/b> white corner can go anywhere. Every next corner goes where its side colours <b>match the white corners next to it<\/b>. Here: the corner is <b>above its spot<\/b> at the front right, white <b>facing right<\/b>.":"<b>흰색을 아래로<\/b> 해요. 2x2에는 센터가 없어요: <b>첫 번째<\/b> 흰색 코너는 어디에 넣어도 돼요. 그다음 코너는 옆면 색이 <b>바로 옆 흰색 코너와 맞는<\/b> 자리에 넣어요. 여기서는 코너가 앞 오른쪽 <b>자리 위<\/b>에 있고, 흰색이 <b>오른쪽을 향해<\/b> 있어요.","Not above its spot yet? Turn the top until it is.":"아직 자리 위에 없나요? 그럴 때까지 윗면을 돌려요.","Corner already in the bottom but in the wrong spot or twisted? Hold it at the front right and do one Righty to pop it out.":"코너가 이미 아래층에 있는데 자리가 틀렸거나 비틀려 있나요? 앞 오른쪽에 두고 Righty를 한 번 해서 빼내요.","Righty once works here too.":"여기서도 Righty를 한 번 해도 돼요.","2x2 · Step 1b · white layer":"2x2 · 1b단계 · 흰색 층","Corner above its spot, white facing you":"코너가 자리 위에 있고 흰색이 나를 향할 때","Same as 3x3 step 2b: white facing you, so use the front face.":"3x3의 2b단계와 같아요: 흰색이 나를 향하니까 앞면을 써요.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing you<\/b>.":"흰색을 아래로 해요. 흰색 코너가 앞 오른쪽 <b>자리 위<\/b>에 있고, 흰색이 <b>나를 향해<\/b> 있어요.","Righty five times also does it.":"Righty를 다섯 번 해도 돼요.","2x2 · Step 1c · white layer":"2x2 · 1c단계 · 흰색 층","Corner above its spot, white facing up":"코너가 자리 위에 있고 흰색이 위를 향할 때","Same as 3x3 step 2c: Righty three times.":"3x3의 2c단계와 같아요: Righty를 세 번 해요.","White on the bottom. The white corner is <b>above its spot<\/b> at the front right, white <b>facing up<\/b>. Do Righty until white faces down.":"흰색을 아래로 해요. 흰색 코너가 앞 오른쪽 <b>자리 위<\/b>에 있고, 흰색이 <b>위를 향해<\/b> 있어요. 흰색이 아래를 향할 때까지 Righty를 해요.","Any white corner works with Righty alone: 1, 3 or 5 times.":"어떤 흰색 코너든 Righty만으로 돼요: 1번, 3번 또는 5번.","Do this for all four white corners. The white layer is done when the side colours of each white corner match the ones next to it.":"흰색 코너 네 개 모두 이렇게 해요. 흰색 코너마다 옆면 색이 바로 옆 코너와 맞으면 흰색 층이 완성이에요.","2x2 · Step 2 · yellow corners":"2x2 · 2단계 · 노란색 코너","Same as 3x3 step 6. Moves three top corners around so every corner sits above its matching white corner. Twist does not matter yet.":"3x3의 6단계와 같아요. 위층 코너 세 개를 돌려서 모든 코너가 짝이 맞는 흰색 코너 위에 오게 해요. 비틀림은 아직 상관없어요.","White layer done, on the bottom. A top corner is <b>in place<\/b> when its side colours match the white corners below it (twisted is fine). Turn the top until <b>exactly one<\/b> corner is in place and hold it at the <b>front left<\/b>.":"흰색 층은 완성했고 아래에 있어요. 위층 코너는 옆면 색이 아래 흰색 코너와 맞으면 <b>제자리<\/b>에 있는 거예요(비틀려 있어도 괜찮아요). <b>딱 하나<\/b>의 코너가 제자리에 올 때까지 윗면을 돌리고, 그 코너를 <b>앞 왼쪽<\/b>에 둬요.","The front-left corner stays put, the other three move round. You may need it twice.":"앞 왼쪽 코너는 그대로 있고, 나머지 세 개가 돌아가요. 두 번 해야 할 수도 있어요.","No turn of the top gives exactly one corner in place? Do it once from anywhere, then look again. This can happen on a 2x2, it never happens on a 3x3.":"윗면을 어떻게 돌려도 딱 하나만 제자리에 오지 않나요? 아무 데서나 한 번 한 다음 다시 보세요. 2x2에서는 이런 일이 생길 수 있지만, 3x3에서는 절대 없어요.","All four in place? Go to step 3.":"네 개 모두 제자리에 있나요? 3단계로 가요.","2x2 · Step 3 · finish":"2x2 · 3단계 · 마무리","Same as 3x3 step 7. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"3x3의 7단계와 같아요. 노란색을 아래로 하고, 비틀린 코너를 아래 앞 오른쪽에 둬요. 노란색이 옆을 향하면: Righty 2번. 노란색이 나를 향하면: Righty 4번. 그다음 아랫면(D)을 돌려 다음 코너로 가요.","<b>Flip the cube over: yellow on the bottom.<\/b> Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner there. Never turn the whole cube.":"<b>큐브를 뒤집어서 노란색을 아래로 해요.<\/b> 비틀린 코너를 <b>아래 앞 오른쪽<\/b>에 두고 노란색 스티커가 어디를 향하는지 보세요:<ul class=\"rule\"><li>노란색이 <b>옆<\/b>(오른쪽)을 향하면 &rarr; Righty <b>2번<\/b><\/li><li>노란색이 <b>나<\/b>를 향하면 &rarr; Righty <b>4번<\/b><\/li><li>노란색이 <b>아래<\/b>를 향하면 &rarr; 이 코너는 끝났어요<\/li><\/ul>그다음 <b>아래층(D)만<\/b> 돌려서 다음 비틀린 코너를 그 자리로 가져와요. 큐브 전체는 절대 돌리지 마세요.","The white layer looks scrambled halfway. Keep going, it comes back when the last corner is done.":"중간에 흰색 층이 엉망으로 섞여 보여요. 계속하세요, 마지막 코너까지 끝나면 다시 돌아와요.","At the end, turn one layer until the two layers line up. Solved!":"마지막에 두 층이 맞을 때까지 한 층을 돌려요. 완성!","2x2 · Orientation 1 of 3":"2x2 · 방향 맞추기 1/3","Sune: one yellow corner up":"Sune: 노란색이 위를 향한 코너 하나","One yellow corner up. Makes the top yellow, or another case you then fix.":"노란색이 위를 향한 코너가 하나예요. 윗면이 노란색이 되거나, 다음에 풀 다른 케이스가 돼요.","White layer done, on the bottom. Hold the yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"흰색 층은 완성했고 아래에 있어요. 노란색이 위를 향한 코너를 <b>앞 왼쪽<\/b>에 둬요. 앞 오른쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","Two yellow corners up? Hold the cube so the front-left corner shows yellow facing you, do the Sune, then look again.":"노란색이 위를 향한 코너가 두 개인가요? 앞 왼쪽 코너의 노란색이 나를 향하도록 잡고 Sune을 한 다음 다시 보세요.","It never takes more than three orientation algorithms in a row.":"방향 맞추기 공식은 세 번 넘게 연달아 할 일이 없어요.","2x2 · Orientation 2 of 3":"2x2 · 방향 맞추기 2/3","Antisune: one yellow corner up, other way":"Antisune: 노란색이 위를 향한 코너 하나, 반대 방향","One yellow corner up, the other way round from the Sune.":"노란색이 위를 향한 코너가 하나인데, Sune과 반대 방향이에요.","Hold the yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너를 <b>뒤 오른쪽<\/b>에 둬요. 앞 왼쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","If neither the Sune nor the Antisune picture fits, turn the top and look again.":"Sune 그림도 Antisune 그림도 안 맞으면 윗면을 돌리고 다시 보세요.","2x2 · Orientation 3 of 3":"2x2 · 방향 맞추기 3/3","Pi: no yellow corner up":"Pi: 노란색이 위를 향한 코너 없음","No yellow corner up. After it, all yellow is up or you get a Sune or Antisune case.":"노란색이 위를 향한 코너가 없어요. 이걸 하고 나면 노란색이 모두 위를 향하거나, Sune 또는 Antisune 케이스가 돼요.","No yellow on top. Hold the cube so both <b>left<\/b> corners show yellow <b>on the left<\/b>.":"윗면에 노란색이 없어요. <b>왼쪽<\/b> 코너 두 개의 노란색이 모두 <b>왼쪽 면<\/b>을 향하도록 잡아요.","Yellow pairs on the left and on the right? Hold either pair on the left.":"왼쪽과 오른쪽에 노란색 쌍이 있나요? 아무 쌍이나 왼쪽에 둬요.","R2 = turn the right side twice.":"R2 = 오른쪽 면을 두 번 돌려요.","2x2 · Permutation 1 of 2":"2x2 · 위치 맞추기 1/2","T-perm: headlights on one side":"T-perm: 한쪽 면에 헤드라이트","All yellow is up. Swaps two corners next to each other.":"노란색이 모두 위를 향해 있어요. 나란히 있는 코너 두 개를 맞바꿔요.","Look for <b>headlights<\/b>: a side where both top stickers are the same colour. Hold that side on the <b>left<\/b>.":"<b>헤드라이트<\/b>를 찾아요: 위쪽 스티커 두 개가 같은 색인 면이에요. 그 면을 <b>왼쪽<\/b>에 둬요.","Headlights on every side? Nothing to swap: just turn the top to line it up.":"모든 면에 헤드라이트가 있나요? 맞바꿀 게 없어요: 윗면만 돌려서 맞추면 돼요.","After the T-perm, turn the top until the cube is solved.":"T-perm을 한 다음, 큐브가 완성될 때까지 윗면을 돌려요.","2x2 · Permutation 2 of 2":"2x2 · 위치 맞추기 2/2","Y-perm: no headlights":"Y-perm: 헤드라이트 없음","All yellow is up but no side has headlights. Swaps two corners diagonally.":"노란색이 모두 위를 향해 있지만 헤드라이트가 있는 면이 없어요. 코너 두 개를 대각선으로 맞바꿔요.","No headlights anywhere. Hold it any way round.":"헤드라이트가 어디에도 없어요. 아무 방향으로 잡아도 돼요.","After the Y-perm, turn the top until the cube is solved.":"Y-perm을 한 다음, 큐브가 완성될 때까지 윗면을 돌려요.","Learn it in two halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"반씩 나눠서 외워요: \"F R U' R' U' R U R' F'\"와 \"R U R' U' R' F R F'\".","2x2 · OLL 1 of 7":"2x2 · OLL 1/7","Turns all yellow up. The white face stays on the bottom.":"노란색을 모두 위로 향하게 해요. 흰색 면은 아래에 그대로 있어요.","One yellow corner up at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너 하나가 <b>앞 왼쪽<\/b>에 있어요. 앞 오른쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","White face on the bottom first: only white needs to be down, the sides can be mixed.":"먼저 흰색 면을 아래에 맞춰요: 흰색만 아래로 가면 되고, 옆면은 섞여 있어도 괜찮아요.","2x2 · OLL 2 of 7":"2x2 · OLL 2/7","One yellow corner up at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너 하나가 <b>뒤 오른쪽<\/b>에 있어요. 앞 왼쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","2x2 · OLL 3 of 7":"2x2 · OLL 3/7","H":"H","No yellow corner up. Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"노란색이 위를 향한 코너가 없어요. 노란색 쌍이 <b>왼쪽<\/b>과 <b>오른쪽<\/b>에 있어요.","2x2 · OLL 4 of 7":"2x2 · OLL 4/7","No yellow corner up. A yellow pair on the <b>left<\/b>; on the right one yellow faces you and one faces the back.":"노란색이 위를 향한 코너가 없어요. 노란색 쌍이 <b>왼쪽<\/b>에 있고, 오른쪽에는 노란색 하나가 나를 향하고 하나는 뒤를 향해 있어요.","2x2 · OLL 5 of 7":"2x2 · OLL 5/7","Two yellow corners up at the <b>back<\/b>. The other two show yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너 두 개가 <b>뒤쪽<\/b>에 있어요. 나머지 두 개는 노란색이 <b>나를 향해<\/b> 있어요.","2x2 · OLL 6 of 7":"2x2 · OLL 6/7","Two yellow corners up on the <b>right<\/b>. On the left one yellow faces you and one faces the back.":"노란색이 위를 향한 코너 두 개가 <b>오른쪽<\/b>에 있어요. 왼쪽에는 노란색 하나가 나를 향하고 하나는 뒤를 향해 있어요.","2x2 · OLL 7 of 7":"2x2 · OLL 7/7","Yellow corners up at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"노란색이 위를 향한 코너가 <b>앞 왼쪽<\/b>과 <b>뒤 오른쪽<\/b>에 있어요. 앞 오른쪽 코너는 노란색이 <b>나를 향해<\/b> 있어요.","2x2 · PBL 1 of 6":"2x2 · PBL 1/6","Top: headlights, bottom: done":"위: 헤드라이트, 아래: 완성","All yellow up, all white down. Fixes both layers at once.":"노란색은 모두 위, 흰색은 모두 아래에 있어요. 두 층을 한 번에 맞춰요.","Top layer: headlights on the <b>left<\/b>. Bottom layer: already right.":"위층: <b>왼쪽<\/b>에 헤드라이트. 아래층: 이미 맞아요.","<b>Headlights<\/b> = a side where both stickers of that layer are the same colour.":"<b>헤드라이트<\/b> = 그 층의 스티커 두 개가 같은 색인 면.","Top right but bottom wrong? Turn the whole cube over so the bad layer is on top, then use card 1 or 2.":"위층은 맞는데 아래층이 틀렸나요? 큐브 전체를 뒤집어서 틀린 층을 위로 올린 다음, 1번이나 2번 카드를 써요.","After the algorithm, turn the top and bottom until the cube is solved.":"공식을 한 다음, 큐브가 완성될 때까지 위층과 아래층을 돌려요.","2x2 · PBL 2 of 6":"2x2 · PBL 2/6","Top: no headlights, bottom: done":"위: 헤드라이트 없음, 아래: 완성","Top layer: no headlights. Bottom layer: already right.":"위층: 헤드라이트 없음. 아래층: 이미 맞아요.","2x2 · PBL 3 of 6":"2x2 · PBL 3/6","Both layers: headlights":"두 층 모두: 헤드라이트","Headlights in <b>both<\/b> layers. Turn the top and the bottom so both are at the <b>front<\/b>.":"<b>두 층 모두<\/b> 헤드라이트가 있어요. 위층과 아래층을 돌려서 둘 다 <b>앞쪽<\/b>에 오게 해요.","2x2 · PBL 4 of 6":"2x2 · PBL 4/6","Both layers: no headlights":"두 층 모두: 헤드라이트 없음","No headlights in either layer. Hold it any way round.":"어느 층에도 헤드라이트가 없어요. 아무 방향으로 잡아도 돼요.","2x2 · PBL 5 of 6":"2x2 · PBL 5/6","Top: headlights, bottom: none":"위: 헤드라이트, 아래: 없음","Top layer: headlights at the <b>front<\/b>. Bottom layer: no headlights.":"위층: <b>앞쪽<\/b>에 헤드라이트. 아래층: 헤드라이트 없음.","2x2 · PBL 6 of 6":"2x2 · PBL 6/6","Top: none, bottom: headlights":"위: 없음, 아래: 헤드라이트","Top layer: no headlights. Bottom layer: headlights at the <b>back<\/b>.":"위층: 헤드라이트 없음. 아래층: <b>뒤쪽<\/b>에 헤드라이트.","Pyraminx · Step 1 · tips":"Pyraminx · 1단계 · 팁","Turn the tips":"팁 돌리기","The easiest step: each tip turns on its own.":"가장 쉬운 단계예요: 팁은 하나씩 따로 돌아가요.","Turn each tip (<b>u l r b<\/b>) until its three colours match the <b>three centres<\/b> right next to it.":"각 팁(<b>u l r b<\/b>)을 돌려서 팁의 세 가지 색이 바로 옆 <b>센터 세 개<\/b>와 맞게 해요.","A tip has three colours. Each one must match the centre triangle just below it on the same face.":"팁에는 세 가지 색이 있어요. 각 색은 같은 면에서 바로 아래에 있는 센터 삼각형과 맞아야 해요.","Turning a tip never moves anything else, so you can always fix the tips first.":"팁을 돌려도 다른 건 절대 움직이지 않아요. 그래서 팁은 언제든 먼저 맞춰도 돼요.","Pyraminx · Step 2 · centres":"Pyraminx · 2단계 · 센터","Match the centres":"센터 맞추기","Turn whole corners until every face has three centres of the same colour.":"모든 면의 센터 세 개가 같은 색이 될 때까지 코너 전체를 돌려요.","Turn whole corners (<b>U L R B<\/b>) until on every face the <b>three centres<\/b> show the same colour. Then hold the puzzle with the <b>yellow face on the bottom<\/b>.":"모든 면에서 <b>센터 세 개<\/b>가 같은 색이 될 때까지 코너 전체(<b>U L R B<\/b>)를 돌려요. 그다음 <b>노란색 면을 아래로<\/b> 해서 퍼즐을 잡아요.","Each corner carries its tip and its three centres with it, so step 1 stays done.":"코너를 돌리면 팁과 센터 세 개가 함께 움직여서 1단계는 그대로 유지돼요.","The edges get mixed up while you do this. That is fine, steps 3 and 4 fix them.":"이걸 하는 동안 엣지는 섞여요. 괜찮아요, 3단계와 4단계에서 맞춰요.","Pyraminx · Step 3a · bottom edges":"Pyraminx · 3a단계 · 아래 엣지","Edge on the right, yellow facing you":"엣지가 오른쪽에, 노란색이 나를 향할 때","Puts the green-yellow edge into the front bottom.":"초록색-노란색 엣지를 앞 아래에 넣어요.","Yellow face on the bottom. The edge that belongs at the <b>front bottom<\/b> sits on the <b>front-right<\/b> edge, yellow <b>facing you<\/b>.":"노란색 면을 아래로 해요. <b>앞 아래<\/b>에 들어갈 엣지가 <b>앞 오른쪽<\/b> 모서리에 있고, 노란색이 <b>나를 향해<\/b> 있어요.","Turn the whole puzzle (yellow stays down) so the spot you want to fill is at the front bottom.":"채우고 싶은 자리가 앞 아래에 오도록 퍼즐 전체를 돌려요(노란색은 계속 아래).","Edge already in the bottom but in the wrong spot or flipped? Hold that spot at the front bottom and do this once to bring the edge up.":"엣지가 이미 아래에 있는데 자리가 틀렸거나 뒤집혀 있나요? 그 자리를 앞 아래에 두고 이걸 한 번 해서 엣지를 위로 올려요.","Pyraminx · Step 3b · bottom edges":"Pyraminx · 3b단계 · 아래 엣지","Edge on the right, yellow facing right":"엣지가 오른쪽에, 노란색이 오른쪽을 향할 때","Same edge, the other way round.":"같은 엣지인데 방향이 반대예요.","The edge sits on the <b>front-right<\/b> edge, yellow facing <b>right<\/b>.":"엣지가 <b>앞 오른쪽<\/b> 모서리에 있고, 노란색이 <b>오른쪽<\/b>을 향해 있어요.","Pyraminx · Step 3c · bottom edges":"Pyraminx · 3c단계 · 아래 엣지","Edge on the left, yellow facing you":"엣지가 왼쪽에, 노란색이 나를 향할 때","The edge is on the left side.":"엣지가 왼쪽에 있어요.","The edge sits on the <b>front-left<\/b> edge, yellow <b>facing you<\/b>.":"엣지가 <b>앞 왼쪽<\/b> 모서리에 있고, 노란색이 <b>나를 향해<\/b> 있어요.","Pyraminx · Step 3d · bottom edges":"Pyraminx · 3d단계 · 아래 엣지","Edge on the left, yellow facing left":"엣지가 왼쪽에, 노란색이 왼쪽을 향할 때","Mirror of 3b.":"3b의 거울 버전이에요.","The edge sits on the <b>front-left<\/b> edge, yellow facing <b>left<\/b>.":"엣지가 <b>앞 왼쪽<\/b> 모서리에 있고, 노란색이 <b>왼쪽<\/b>을 향해 있어요.","Pyraminx · Step 3e · bottom edges":"Pyraminx · 3e단계 · 아래 엣지","Edge at the back, yellow facing right":"엣지가 뒤쪽에, 노란색이 오른쪽을 향할 때","The edge is on the back edge.":"엣지가 뒤쪽 모서리에 있어요.","The edge sits on the <b>back<\/b> edge, yellow facing <b>right<\/b>.":"엣지가 <b>뒤쪽<\/b> 모서리에 있고, 노란색이 <b>오른쪽<\/b>을 향해 있어요.","Pyraminx · Step 3f · bottom edges":"Pyraminx · 3f단계 · 아래 엣지","Edge at the back, yellow facing left":"엣지가 뒤쪽에, 노란색이 왼쪽을 향할 때","Mirror of 3e.":"3e의 거울 버전이에요.","The edge sits on the <b>back<\/b> edge, yellow facing <b>left<\/b>.":"엣지가 <b>뒤쪽<\/b> 모서리에 있고, 노란색이 <b>왼쪽<\/b>을 향해 있어요.","Do this for all three bottom edges. The yellow face is done when each bottom edge matches the centres on both sides.":"아래 엣지 세 개 모두 이렇게 해요. 아래 엣지마다 양쪽 센터와 맞으면 노란색 면이 완성이에요.","Pyraminx · Step 4a · last edges":"Pyraminx · 4a단계 · 마지막 엣지","Edges go round (one way)":"엣지 돌리기 (한쪽 방향)","Moves the three top edges round.":"위쪽 엣지 세 개를 돌려서 자리를 바꿔요.","Yellow face done, on the bottom. <b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>front right<\/b>.":"노란색 면은 완성했고 아래에 있어요. 제자리에 있는 위쪽 엣지가 <b>하나도 없어요<\/b>. <b>앞 왼쪽<\/b> 엣지의 자리는 <b>앞 오른쪽<\/b>이에요.","After it, two edges may be flipped. Then do 4c.":"이걸 하고 나면 엣지 두 개가 뒤집혀 있을 수 있어요. 그러면 4c를 해요.","You never need more than two algorithms for the last edges.":"마지막 엣지는 공식 두 개면 충분해요.","Pyraminx · Step 4b · last edges":"Pyraminx · 4b단계 · 마지막 엣지","Edges go round (other way)":"엣지 돌리기 (반대 방향)","Moves the three top edges round the other way.":"위쪽 엣지 세 개를 반대 방향으로 돌려서 자리를 바꿔요.","<b>No<\/b> top edge is in its place. The <b>front-left<\/b> edge belongs at the <b>back<\/b>.":"제자리에 있는 위쪽 엣지가 <b>하나도 없어요<\/b>. <b>앞 왼쪽<\/b> 엣지의 자리는 <b>뒤쪽<\/b>이에요.","Pyraminx · Step 4c · last edges":"Pyraminx · 4c단계 · 마지막 엣지","Two edges flipped":"엣지 두 개가 뒤집혔을 때","All three top edges are in their place, but two are flipped.":"위쪽 엣지 세 개가 모두 제자리에 있지만, 두 개가 뒤집혀 있어요.","All top edges in their place, two of them flipped. Hold the puzzle so the <b>good edge is at the back<\/b>.":"위쪽 엣지가 모두 제자리에 있고, 그중 두 개가 뒤집혀 있어요. <b>맞는 엣지가 뒤쪽<\/b>에 오도록 퍼즐을 잡아요.","Solved!":"완성!","4x4 · 1 · edge pairing":"4x4 · 1 · 엣지 페어링","Join two halves opposite each other":"마주 보는 두 반쪽 합치기","A 4x4 edge has two halves. When the two halves sit opposite each other, this joins them into one edge.":"4x4 엣지는 두 반쪽으로 되어 있어요. 두 반쪽이 서로 마주 보고 있을 때 이 공식으로 엣지 하나로 합쳐요.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>opposite each other<\/b>: one at the <b>top of the front-left<\/b> edge, one at the <b>top of the front-right<\/b> edge, <b>orange facing you<\/b> on both. Only the blue-orange pieces are coloured, so you can follow them.":"센터는 완성했어요. 엣지 하나의 두 반쪽(여기서는 <b>파란색-주황색<\/b>)이 <b>서로 마주 보고<\/b> 있어요: 하나는 <b>앞 왼쪽 모서리 위쪽<\/b>에, 하나는 <b>앞 오른쪽 모서리 위쪽<\/b>에 있고, 둘 다 <b>주황색이 나를 향해<\/b> 있어요. 파란색-주황색 조각만 색이 칠해져 있어서 쉽게 따라갈 수 있어요.","Joined! The blue-orange edge is now one piece, at the front right.":"합쳐졌어요! 파란색-주황색 엣지가 이제 한 조각이 되어 앞 오른쪽에 있어요.","Uw = the top two layers together. Uw' brings the left half over to the right, Uw at the end puts the centres back.":"Uw = 위쪽 두 층을 함께. Uw'로 왼쪽 반쪽을 오른쪽으로 가져오고, 마지막 Uw로 센터를 되돌려 놓아요.","The middle part \"R U R' F R' F' R\" swaps a finished edge in, so the two halves can meet. The rest of the cube gets mixed: that is fine, you solve it like a 3x3 afterwards.":"가운데 부분 \"R U R' F R' F' R\"은 완성된 엣지를 끼워 넣어서 두 반쪽이 만날 수 있게 해요. 큐브의 나머지 부분은 섞이지만 괜찮아요. 나중에 3x3처럼 풀면 돼요.","Pair all 12 edges this way, then solve the 4x4 like a 3x3.":"이렇게 엣지 12개를 모두 짝지은 다음, 4x4를 3x3처럼 풀어요.","Edge joined":"엣지 합침","4x4 · 1b · edge pairing":"4x4 · 1b · 엣지 페어링","Combine with the centre layer, then swap it out":"안쪽 층으로 합친 다음 바꿔 빼내기","Turn only the centre layer to combine the two halves, swap the combined edge out for one that is not combined yet, then turn the centre layer back.":"안쪽 층만 돌려서 두 반쪽을 합치고, 합쳐진 엣지를 아직 안 합쳐진 엣지와 바꿔 빼낸 다음, 안쪽 층을 다시 돌려놓아요.","Centres done. The two halves of one edge (here <b>blue-orange<\/b>) sit <b>diagonal<\/b>: one <b>high on the front-left<\/b> edge with <b>orange facing you<\/b>, one <b>low on the front-right<\/b> edge with <b>blue facing you<\/b>. Only the blue-orange pieces are coloured, so you can follow them.":"센터는 완성했어요. 엣지 하나의 두 반쪽(여기서는 <b>파란색-주황색<\/b>)이 <b>대각선<\/b>으로 있어요: 하나는 <b>앞 왼쪽 모서리 높은 쪽<\/b>에 <b>주황색이 나를 향해<\/b> 있고, 하나는 <b>앞 오른쪽 모서리 낮은 쪽<\/b>에 <b>파란색이 나를 향해<\/b> 있어요. 파란색-주황색 조각만 색이 칠해져 있어서 쉽게 따라갈 수 있어요.","Joined! The blue-orange edge is now one piece, at the top front.":"합쳐졌어요! 파란색-주황색 엣지가 이제 한 조각이 되어 위 앞쪽에 있어요.","This turn has a name: a <b>slice move<\/b>. A small u means: turn <b>only the upper centre layer<\/b> (the second layer from the top). The top layer does not move.":"이 회전에는 이름이 있어요: <b>슬라이스 회전<\/b>. 소문자 u는 <b>위쪽 안쪽 층만<\/b>(위에서 두 번째 층) 돌린다는 뜻이에요. 맨 위층은 움직이지 않아요.","u' = that centre layer turns to the right (like U'). The high half goes to the right and sits on top of the low half: the edge is combined.":"u' = 그 안쪽 층이 오른쪽으로 돌아가요(U'처럼). 높은 반쪽이 오른쪽으로 가서 낮은 반쪽 위에 놓여요: 엣지가 합쳐졌어요.","R U R' takes the combined edge up to the top and puts an edge that is not combined yet in its place.":"R U R'로 합쳐진 엣지를 위로 올리고, 아직 안 합쳐진 엣지를 그 자리에 넣어요.","u = turn the centre layer back, so the centres are solved again. The combined edge stays together on top.":"u = 안쪽 층을 다시 돌려서 센터를 다시 맞춰요. 합쳐진 엣지는 위에 그대로 붙어 있어요.","If the low half is on the left and the high half on the right, turn the centre layer the other way: u L' U' L u'.":"낮은 반쪽이 왼쪽에, 높은 반쪽이 오른쪽에 있으면 안쪽 층을 반대로 돌려요: u L' U' L u'.","Halves combined":"반쪽 합침","Swapped out":"바꿔 빼냄","4x4 · 2 · OLL parity":"4x4 · 2 · OLL 패리티","No 3x3 OLL fits":"맞는 3x3 OLL이 없을 때","When there is <b>no 3x3 algorithm<\/b> for your top, do this. It happens only on a 4x4: an odd number of top edges is flipped (1 or 3), like in the picture. This flips the front edge, so a normal 3x3 OLL works again.":"윗면에 맞는 <b>3x3 공식이 없을<\/b> 때 이걸 해요. 4x4에서만 생기는 일이에요: 그림처럼 위층 엣지가 홀수 개(1개나 3개) 뒤집혀 있어요. 이 공식은 앞쪽 엣지를 뒤집어서 보통 3x3 OLL을 다시 쓸 수 있게 해 줘요.","Yellow on top. Like the picture: <b>3 edges are flipped<\/b> (front, right and back show their colour on top), only the <b>left<\/b> edge has yellow on top. The picture shows the top from above, the front at the bottom. Hold a <b>flipped edge at the front<\/b>.":"노란색을 위로 해요. 그림처럼 <b>엣지 3개가 뒤집혀<\/b> 있어요(앞, 오른쪽, 뒤 엣지는 위에 자기 색이 보여요). <b>왼쪽<\/b> 엣지만 위에 노란색이 있어요. 그림은 윗면을 위에서 본 모습이고, 앞쪽이 아래에 있어요. <b>뒤집힌 엣지를 앞쪽<\/b>에 둬요.","Now an even number of edges is flipped (back and left), and the two front corners are turned: a normal 3x3 case again. Finish with your 3x3 OLL and PLL.":"이제 뒤집힌 엣지가 짝수 개(뒤쪽과 왼쪽)가 되고, 앞쪽 코너 두 개가 돌아가 있어요: 다시 보통 3x3 케이스예요. 3x3 OLL과 PLL로 마무리해요.","How to spot it: count the top edges that do not have yellow on top. 1 or 3 = no 3x3 algorithm fits, do this one first.":"알아보는 법: 위에 노란색이 없는 위층 엣지를 세어 봐요. 1개나 3개면 맞는 3x3 공식이 없으니, 이걸 먼저 해요.","Rw = the <b>right two layers together<\/b> (wide turn), Lw = the left two layers together. On many sheets this is written as a small r and l.":"Rw = <b>오른쪽 두 층을 함께<\/b> (와이드 회전), Lw = 왼쪽 두 층을 함께. 많은 공식표에서는 소문자 r과 l로 써요.","U2 and F2 turn only the outer top and front layer, twice.":"U2와 F2는 바깥쪽 위층과 앞층만 두 번 돌려요.","The front edge flips. Some other top pieces move too: that is fine, your normal 3x3 OLL and PLL fix them.":"앞쪽 엣지가 뒤집혀요. 다른 위층 조각도 몇 개 움직이지만 괜찮아요. 보통 3x3 OLL과 PLL로 맞추면 돼요.","4x4 · 3 · PLL parity":"4x4 · 3 · PLL 패리티","Two edges swapped":"엣지 두 개가 맞바뀜","Also only on a 4x4: at the very end, two opposite top edges are swapped. This swaps them back.":"이것도 4x4에서만 생겨요: 맨 마지막에 마주 보는 위층 엣지 두 개가 맞바뀌어 있어요. 이 공식으로 다시 바꿔요.","Everything is solved except the <b>front<\/b> and <b>back<\/b> top edges, which are <b>swapped<\/b>.":"<b>앞쪽<\/b>과 <b>뒤쪽<\/b> 위층 엣지가 <b>맞바뀐<\/b> 것 말고는 모두 맞춰져 있어요.","Uw2 = the top two layers twice. Rw2 = the right two layers twice. r2 = only the second layer from the right, twice.":"Uw2 = 위쪽 두 층을 두 번. Rw2 = 오른쪽 두 층을 두 번. r2 = 오른쪽에서 두 번째 층만 두 번.","Only these two edges change. Everything else stays where it is.":"이 두 엣지만 바뀌어요. 나머지는 모두 제자리에 있어요.","Mirror cube · last layer":"Mirror cube · 마지막 층","Three corners (A-perm)":"코너 세 개 (A-perm)","Moves three top corners around. Everything else stays where it is.":"위층 코너 세 개를 돌려서 자리를 바꿔요. 나머지는 모두 제자리에 있어요.","Beginner 3x3":"3x3 초급","Beginner":"초급","The classic beginner method. Hold the cube with <b>yellow on top<\/b> and <b>green facing you<\/b>:\n       white gets solved first at the bottom, yellow last on top. Click a step to watch it move.":"가장 기본적인 초급 방법이에요. <b>노란색을 위<\/b>, <b>초록색을 나를 향하게<\/b> 잡아요: 흰색을 먼저 아래에서 맞추고, 노란색은 마지막에 위에서 맞춰요. 단계를 클릭하면 움직이는 모습을 볼 수 있어요.","Intermediate 3x3":"3x3 중급","Intermediate":"중급","The next step up: white cross as before, then <b>F2L<\/b> (corner and edge together),\n       <b>2-look OLL<\/b> (all yellow on top) and <b>2-look PLL<\/b> (everything in place). Same grip: yellow on top, green facing you.":"한 단계 더 나아가 볼까요: 흰색 십자는 전처럼 만들고, 그다음 <b>F2L<\/b>(코너와 엣지를 함께), <b>2-look OLL<\/b>(윗면을 모두 노란색으로), <b>2-look PLL<\/b>(모든 조각을 제자리로)을 해요. 잡는 법은 같아요: 노란색이 위, 초록색이 나를 향하게.","Advanced F2L (3x3)":"고급 F2L (3x3)","Advanced F2L":"고급 F2L","Advanced OLL (3x3)":"고급 OLL (3x3)","Advanced OLL":"고급 OLL","Advanced PLL (3x3)":"고급 PLL (3x3)","Advanced PLL":"고급 PLL","2x2 Beginner":"2x2 초급","2x2 Intermediate":"2x2 중급","White layer as in Beginner. Then <b>3 algorithms<\/b> make the whole top yellow and <b>2 algorithms<\/b> put the corners in place.":"흰색 층은 초급과 같아요. 그다음 <b>공식 3개<\/b>로 윗면 전체를 노란색으로 만들고, <b>공식 2개<\/b>로 코너를 제자리에 넣어요.","2x2 Advanced":"2x2 고급","Advanced":"고급","The <b>Ortega<\/b> method. First make the <b>white face<\/b> on the bottom (the sides do not need to match yet). Then one of <b>7 algorithms<\/b> turns all yellow up, and one of <b>6 algorithms<\/b> fixes both layers at once.":"<b>Ortega<\/b> 방법이에요. 먼저 아래에 <b>흰색 면<\/b>을 만들어요(옆면은 아직 안 맞아도 돼요). 그다음 <b>공식 7개<\/b> 중 하나로 노란색을 모두 위로 향하게 하고, <b>공식 6개<\/b> 중 하나로 두 층을 한 번에 맞춰요.","2x2":"2x2","4x4":"4x4","3x3":"3x3","Twisty and big cubes":"다른 퍼즐과 큰 큐브","push it up, away from you":"위로 밀어 올려요 (내 몸 반대쪽으로)","pull it down, toward you":"아래로 당겨 내려요 (내 쪽으로)","swing it to the left":"왼쪽으로 돌려요","swing it to the right":"오른쪽으로 돌려요","turn it clockwise, like a clock":"시곗바늘처럼 시계 방향으로 돌려요","turn it anticlockwise":"반시계 방향으로 돌려요","push them up, away from you":"함께 위로 밀어 올려요 (내 몸 반대쪽으로)","pull them down, toward you":"함께 아래로 당겨 내려요 (내 쪽으로)","turn them clockwise, like a clock":"함께 시곗바늘처럼 시계 방향으로 돌려요","turn them anticlockwise":"함께 반시계 방향으로 돌려요","swing them to the right":"함께 오른쪽으로 돌려요","swing them to the left":"함께 왼쪽으로 돌려요","clockwise as seen from behind":"뒤에서 볼 때 시계 방향","anticlockwise as seen from behind":"뒤에서 볼 때 반시계 방향","swing it to the right (like D)":"오른쪽으로 돌려요 (D처럼)","turn it clockwise, like F":"F처럼 시계 방향으로 돌려요","tip it so the front comes to the top":"앞면이 위로 오도록 굴려요","tip it so the top comes to the front":"윗면이 앞으로 오도록 굴려요","roll it to the right, like F":"F처럼 오른쪽으로 굴려요","roll it to the left":"왼쪽으로 굴려요","pull it down, toward you (like L)":"아래로 당겨 내려요, 내 쪽으로 (L처럼)","turn it so the right side faces you":"오른쪽 면이 나를 향하도록 돌려요","turn it so the left side faces you":"왼쪽 면이 나를 향하도록 돌려요","Right face":"오른쪽 면","Left face":"왼쪽 면","Top face":"윗면","Bottom face":"아랫면","Front face":"앞면","Back face":"뒷면","Whole cube":"큐브 전체","Right two layers":"오른쪽 두 층","Left two layers":"왼쪽 두 층","Front two layers":"앞쪽 두 층","Bottom two layers":"아래쪽 두 층","Top two layers":"위쪽 두 층","Back two layers":"뒤쪽 두 층","Middle slice":"가운데 세로 층","Middle layer":"가운데 층","Front-back middle slice":"앞과 뒤 사이의 가운데 층","Only the centre layer next to the right (slice move, the right layer stays still)":"오른쪽 바로 옆 안쪽 층만 (슬라이스 회전, 오른쪽 층은 그대로)","Only the centre layer next to the left (slice move, the left layer stays still)":"왼쪽 바로 옆 안쪽 층만 (슬라이스 회전, 왼쪽 층은 그대로)","Only the centre layer next to the top (slice move, the top layer stays still)":"위쪽 바로 옆 안쪽 층만 (슬라이스 회전, 위쪽 층은 그대로)","Only the centre layer next to the bottom (slice move, the bottom layer stays still)":"아래쪽 바로 옆 안쪽 층만 (슬라이스 회전, 아래쪽 층은 그대로)","Only the centre layer next to the front (slice move, the front layer stays still)":"앞쪽 바로 옆 안쪽 층만 (슬라이스 회전, 앞쪽 층은 그대로)","Only the centre layer next to the back (slice move, the back layer stays still)":"뒤쪽 바로 옆 안쪽 층만 (슬라이스 회전, 뒤쪽 층은 그대로)","Top corner with its layer":"위쪽 코너와 그 층","Top tip only":"위쪽 팁만","Left corner with its layer":"왼쪽 코너와 그 층","Left tip only":"왼쪽 팁만","Right corner with its layer":"오른쪽 코너와 그 층","Right tip only":"오른쪽 팁만","Back corner with its layer":"뒤쪽 코너와 그 층","Back tip only":"뒤쪽 팁만","turn it clockwise, as you look at that corner":"그 코너를 바라볼 때 시계 방향으로 돌려요","turn it anticlockwise, as you look at that corner":"그 코너를 바라볼 때 반시계 방향으로 돌려요","{what}: half a turn (turn it twice)":"{what}: 반 바퀴 (두 번 돌려요)","{what}: three turns, ends the same as {mv} ({hint})":"{what}: 세 번 돌려요, 결과는 {mv}와 같아요 ({hint})","{what}: {hint}":"{what}: {hint}","English (UK)":"영어 (영국)","English (US)":"영어 (미국)","Arabic":"아랍어","Chinese":"중국어","French":"프랑스어","German":"독일어","Hindi":"힌디어","Korean":"한국어","Portuguese":"포르투갈어","Russian":"러시아어","Spanish":"스페인어"},"ar":{"Cube Algorithms":"خوارزميات المكعب","Settings":"الإعدادات","Grip: yellow on top, green facing you":"طريقة المسك: الأصفر في الأعلى، والأخضر باتجاهك","Light":"فاتح","Dark":"داكن","Switch to light mode":"التبديل إلى الوضع الفاتح","Switch to dark mode":"التبديل إلى الوضع الداكن","Top layer at the start":"الطبقة العليا في البداية","Algorithms":"الخوارزميات","Turn the cube back":"أعِد المكعب إلى وضعه","All {name} steps":"كل خطوات {name}","Step back":"خطوة للخلف","Play":"تشغيل","Step":"خطوة","Reset":"إعادة","Reset view":"إعادة العرض","Play {n}× (back to start!)":"تشغيل {n}× (عودة إلى البداية!)","Speed":"السرعة","Drag or swipe the cube to turn it around.":"اسحب المكعب بالفأرة أو بإصبعك لتديره وتراه من كل الجهات.","Start":"البداية","solved":"محلول","before":"قبل","End":"النهاية","Step {n}":"الخطوة {n}","after {label}":"بعد {label}","Round {r} of {n}: {mv}":"الجولة {r} من {n}: {mv}","{n} rounds later... back exactly where we started!":"بعد {n} جولات... عدنا تمامًا إلى حيث بدأنا!","Undo {mv}":"تراجع عن {mv}","Press Play, or Step through one turn at a time.":"اضغط «تشغيل»، أو «خطوة» لتنفيذ حركة واحدة في كل مرة.","Done! Try Play 6x: the cube comes back to the start.":"تم! جرّب «تشغيل» 6×: يعود المكعب إلى البداية.","Done! That is what this step fixes.":"تم! هذا ما تصلحه هذه الخطوة.","{i} of {n} turns done. Next: {mv}.":"تمت {i} من {n} حركات. التالية: {mv}.","Languages":"اللغات","Estonian":"الإستونية","<b>r<\/b> right two layers":"<b>r<\/b> الطبقتان على اليمين","<b>M<\/b> middle slice, turned like L":"<b>M<\/b> الطبقة الوسطى، تُدار مثل L","<b>d<\/b> bottom two layers":"<b>d<\/b> الطبقتان السفليتان","<b>(…)3<\/b> = do the bracket 3 times":"<b>(…)3<\/b> = نفّذ ما بين القوسين 3 مرات","<b>Rw<\/b> right two layers together":"<b>Rw<\/b> الطبقتان على اليمين معًا","<b>Uw<\/b> top two layers together":"<b>Uw<\/b> الطبقتان العلويتان معًا","<b>r l u<\/b> only the second layer from the right / left / top (inner slice, the centre layer)":"<b>r l u<\/b> الطبقة الثانية فقط من اليمين / اليسار / الأعلى (طبقة داخلية فقط)","<b>M<\/b> middle slice, like L":"<b>M<\/b> الطبقة الوسطى، مثل L","<b>x z<\/b> tip / roll the whole cube":"<b>x z<\/b> اقلب / دحرج المكعب كله","<b>y<\/b> turn the whole cube":"<b>y<\/b> أدِر المكعب كله","<b>d u<\/b> bottom / top two layers":"<b>d u<\/b> الطبقتان السفليتان / العلويتان","<b>r l f<\/b> two layers at once":"<b>r l f<\/b> طبقتان معًا","<b>S<\/b> front-back middle slice, like F":"<b>S<\/b> الطبقة الوسطى بين الأمام والخلف، مثل F","<b>x<\/b> tip the whole cube, like R":"<b>x<\/b> اقلب المكعب كله، مثل R","<b>(…)2<\/b> = do the bracket twice":"<b>(…)2<\/b> = نفّذ ما بين القوسين مرتين","<b>U<\/b> top corner":"<b>U<\/b> الزاوية العليا","<b>L<\/b> front-left corner":"<b>L<\/b> الزاوية الأمامية اليسرى","<b>R<\/b> front-right corner":"<b>R<\/b> الزاوية الأمامية اليمنى","<b>B<\/b> back corner":"<b>B<\/b> الزاوية الخلفية","capital = the corner with its whole layer":"الحرف الكبير = الزاوية مع طبقتها كلها","<b>u l r b<\/b> = just the tip":"<b>u l r b<\/b> = الرأس الصغير فقط","<b>'<\/b> = the other way":"<b>'<\/b> = في الاتجاه الآخر","plain letter = clockwise as you look at that corner":"الحرف وحده = مع عقارب الساعة وأنت تنظر إلى تلك الزاوية","<b>R<\/b> right":"<b>R<\/b> اليمين","<b>L<\/b> left":"<b>L<\/b> اليسار","<b>U<\/b> top":"<b>U<\/b> الأعلى","<b>D<\/b> bottom":"<b>D<\/b> الأسفل","<b>F<\/b> front":"<b>F<\/b> الأمام","<b>y<\/b> turn the whole cube, right side to the front":"<b>y<\/b> أدِر المكعب كله، فيأتي الوجه الأيمن إلى الأمام","<b>2<\/b> = twice":"<b>2<\/b> = مرتين","<b>3<\/b> = three times":"<b>3<\/b> = ثلاث مرات","plain letter = clockwise as you look at that face":"الحرف وحده = مع عقارب الساعة وأنت تنظر إلى ذلك الوجه","Step 0 · the basic move":"الخطوة 0 · الحركة الأساسية","The Righty Move":"حركة Righty","Learn this first. Steps 2 and 3 are built from it.":"تعلّم هذه أولًا. الخطوتان 2 و3 مبنيّتان عليها.","Hold the cube any way you like. Do it <b>6 times<\/b> and the cube comes back to the start.":"أمسك المكعب كما تحب. نفّذها <b>6 مرات<\/b> وسيعود المكعب إلى البداية.","Say it out loud while you turn: \"right up, top left, right down, top right\".":"قلها بصوت عالٍ وأنت تدير: «يمين لفوق، أعلى لليسار، يمين لتحت، أعلى لليمين».","Your right hand does all four turns. Thumb on the front, index finger flicks the top.":"يدك اليمنى تقوم بالحركات الأربع كلها. الإبهام على الوجه الأمامي، والسبابة تدفع الوجه العلوي.","Six repeats undo themselves. Great party trick, and it proves formulas are not magic.":"ست تكرارات تُلغي نفسها. حيلة رائعة تبهر بها أصدقاءك، وتثبت أن الخوارزميات ليست سحرًا.","Step 0 · the mirror move":"الخطوة 0 · الحركة المعكوسة","The Lefty Move":"حركة Lefty","Righty in a mirror, for the left hand. Same job on the left side.":"Righty في المرآة، لليد اليسرى. تقوم بالعمل نفسه على الجهة اليسرى.","Hold the cube any way you like. Left hand does all four turns. Six times and it is back to the start.":"أمسك المكعب كما تحب. يدك اليسرى تقوم بالحركات الأربع كلها. ست مرات ويعود إلى البداية.","Every letter is mirrored: R becomes L, and each turn goes the other way.":"كل حرف معكوس: R يصبح L، وكل حركة تذهب في الاتجاه الآخر.","Use it in step 2 when the white corner sits above the front-left slot.":"استخدمها في الخطوة 2 عندما تكون الزاوية البيضاء فوق الخانة الأمامية اليسرى.","Kids often find this one easier: the left index finger flicks the top toward you.":"كثير من الأطفال يجدونها أسهل: سبابة اليد اليسرى تدفع الوجه العلوي نحوك.","Step 1a · white cross":"الخطوة 1a · الصليب الأبيض","Edge on top, white facing up":"الحافة في الأعلى، والأبيض للأعلى","The easiest cross case. Turn the top until the edge is above its slot, then turn that face twice.":"أسهل حالة في الصليب. أدِر الوجه العلوي حتى تصبح الحافة فوق خانتها، ثم أدِر ذلك الوجه مرتين.","<b>White on the bottom<\/b>. A white edge is in the top layer with the white sticker <b>facing up<\/b>. Turn the top until its other colour sits over the matching centre, here green over green, then turn that face twice.":"<b>الأبيض في الأسفل<\/b>. حافة بيضاء في الطبقة العليا والملصق الأبيض <b>متجه للأعلى<\/b>. أدِر الوجه العلوي حتى يصبح لونها الآخر فوق المركز المطابق، هنا الأخضر فوق الأخضر، ثم أدِر ذلك الوجه مرتين.","Look at the side colour of the edge, not the white. It tells you which face to turn.":"انظر إلى اللون الجانبي للحافة، لا إلى الأبيض. هو يخبرك أي وجه تدير.","Grey pieces do not matter yet. Corners come in step 2.":"القطع الرمادية لا تهم بعد. الزوايا تأتي في الخطوة 2.","Do this for all four edges. Most of the cross is just this move.":"افعل هذا مع الحواف الأربع. معظم الصليب هو هذه الحركة فقط.","Step 1b · white cross":"الخطوة 1b · الصليب الأبيض","Edge on top, white facing sideways":"الحافة في الأعلى، والأبيض إلى الجانب","A white edge in the top layer with white pointing at you. Drops it into the bottom the right way up.":"حافة بيضاء في الطبقة العليا والأبيض باتجاهك. هذه الخوارزمية تُنزلها إلى الأسفل في الوضع الصحيح.","White on the bottom. The edge sits at the <b>top front<\/b> with the white sticker <b>facing you<\/b>. Its other colour (on top) is the <b>same colour as the front centre<\/b>, here green. If not, turn the top until it is.":"الأبيض في الأسفل. الحافة في <b>الأعلى من الأمام<\/b> والملصق الأبيض <b>باتجاهك<\/b>. لونها الآخر (في الأعلى) هو <b>نفس لون المركز الأمامي<\/b>، هنا الأخضر. إن لم يكن كذلك، أدِر الوجه العلوي حتى يصبح.","The other cross edges are not disturbed.":"حواف الصليب الأخرى لا تتأثر.","Same ending as 1c: the last three turns tuck the edge in from the left.":"النهاية نفسها كما في 1c: آخر ثلاث حركات تُدخل الحافة من اليسار.","Step 1c · white cross":"الخطوة 1c · الصليب الأبيض","Edge in the bottom, flipped":"الحافة في الأسفل، مقلوبة","A white edge already in the bottom, but the wrong way round. Flips it in place.":"حافة بيضاء موجودة في الأسفل، لكن بالاتجاه الخاطئ. هذه الخوارزمية تقلبها في مكانها.","<b>White on the bottom<\/b>, yellow on top. The wrong-way edge sits at the <b>front bottom<\/b>, white sticker facing you. The other cross edges stay where they are.":"<b>الأبيض في الأسفل<\/b>، والأصفر في الأعلى. الحافة المقلوبة في <b>الأسفل من الأمام<\/b>، والملصق الأبيض باتجاهك. حواف الصليب الأخرى تبقى في أماكنها.","Goal of step 1: a white plus on the bottom, and each edge's side colour matches the centre next to it.":"هدف الخطوة 1: علامة زائد بيضاء في الأسفل، ولون كل حافة الجانبي يطابق المركز المجاور لها.","Grey pieces do not matter yet. Only look at the white ones.":"القطع الرمادية لا تهم بعد. انظر إلى القطع البيضاء فقط.","Edge in the top layer? Turn the top until it is above its slot, then turn that side twice.":"الحافة في الطبقة العليا؟ أدِر الوجه العلوي حتى تصبح فوق خانتها، ثم أدِر ذلك الوجه مرتين.","Step 2a · white corners":"الخطوة 2a · الزوايا البيضاء","Corner above its slot, white facing right":"الزاوية فوق خانتها، والأبيض إلى اليمين","The quick case. Three turns and the corner drops in.":"الحالة السريعة. ثلاث حركات وتنزل الزاوية في مكانها.","White on the bottom. The white corner is in the <b>top layer, directly above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing right<\/b>. Its other two colours match the front and right centres.":"الأبيض في الأسفل. الزاوية البيضاء في <b>الطبقة العليا، فوق<\/b> خانتها مباشرة في <b>الأمام يمينًا<\/b>، والملصق الأبيض <b>متجه لليمين<\/b>. لوناها الآخران يطابقان المركزين الأمامي والأيمن.","This is Righty without the last turn. Righty once works too, the extra top turn changes nothing here.":"هذه هي Righty بدون الحركة الأخيرة. تنفيذ Righty مرة واحدة ينجح أيضًا، فحركة الوجه العلوي الزائدة لا تغيّر شيئًا هنا.","Not above its slot yet? Turn the top layer until it is. A corner belongs where its two side colours meet the matching centres.":"ليست فوق خانتها بعد؟ أدِر الطبقة العليا حتى تصبح. مكان الزاوية حيث يلتقي لوناها الجانبيان بالمركزين المطابقين.","Corner already in the slot but twisted? Do one Righty to pop it out, then start again.":"الزاوية في الخانة لكنها ملتوية؟ نفّذ Righty مرة لإخراجها، ثم ابدأ من جديد.","Step 2b · white corners":"الخطوة 2b · الزوايا البيضاء","Corner above its slot, white facing you":"الزاوية فوق خانتها، والأبيض باتجاهك","Same corner, white pointing at you. Use the front face instead of the right.":"الزاوية نفسها، لكن الأبيض باتجاهك. استخدم الوجه الأمامي بدل الأيمن.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing you<\/b>.":"الأبيض في الأسفل. الزاوية البيضاء في <b>الطبقة العليا فوق<\/b> خانتها في <b>الأمام يمينًا<\/b>، والملصق الأبيض <b>باتجاهك<\/b>.","Mirror thinking: white on the right, use R. White on the front, use F.":"فكّر كالمرآة: الأبيض على اليمين، استخدم R. الأبيض في الأمام، استخدم F.","Righty five times also does it, but this is three turns instead of twenty.":"تنفيذ Righty خمس مرات ينجح أيضًا، لكن هذه ثلاث حركات بدل عشرين.","Step 2c · white corners":"الخطوة 2c · الزوايا البيضاء","Corner above its slot, white facing up":"الزاوية فوق خانتها، والأبيض للأعلى","The slow case: white points at the ceiling. Righty three times.":"الحالة البطيئة: الأبيض يشير إلى السقف. Righty ثلاث مرات.","White on the bottom. The white corner is in the <b>top layer above<\/b> its slot at the <b>front right<\/b>, white sticker <b>facing up<\/b>. Do Righty until white faces down. Here that takes three rounds.":"الأبيض في الأسفل. الزاوية البيضاء في <b>الطبقة العليا فوق<\/b> خانتها في <b>الأمام يمينًا<\/b>، والملصق الأبيض <b>متجه للأعلى<\/b>. نفّذ Righty حتى يتجه الأبيض للأسفل. هنا يحتاج ذلك ثلاث جولات.","Watch the corner after each Righty: after one it sits in the slot but twisted, after two it is back on top with white facing right, after three it is in.":"راقب الزاوية بعد كل Righty: بعد الأولى تكون في الخانة لكنها ملتوية، وبعد الثانية تعود إلى الأعلى والأبيض لليمين، وبعد الثالثة تدخل مكانها.","Any corner case works with Righty alone: 1, 3 or 5 rounds. Cards 2a and 2b are just the short cuts.":"أي حالة زاوية تُحل بـ Righty وحدها: 1 أو 3 أو 5 جولات. البطاقتان 2a و2b مجرد اختصارات.","Its two side colours must match the centres next to it. If not, turn the top layer first.":"لوناها الجانبيان يجب أن يطابقا المركزين المجاورين لها. إن لم يكن كذلك، أدِر الطبقة العليا أولًا.","Step 3a · middle layer":"الخطوة 3a · الطبقة الوسطى","Edge goes right":"الحافة تذهب يمينًا","Drops an edge from the top layer into the front-right slot. U R U R' U', turn the whole cube so the right side faces you, then L' U' L.":"تُنزل حافة من الطبقة العليا إلى الخانة الأمامية اليمنى. U R U R' U'، ثم أدِر المكعب كله ليصبح الوجه الأيمن باتجاهك، ثم L' U' L.","White done, on the bottom. Find a top edge <b>with no yellow<\/b>. Turn the top so its front colour matches the front centre. If its top colour matches the <b>right<\/b> centre, use this.":"الأبيض جاهز في الأسفل. ابحث عن حافة في الأعلى <b>بلا أصفر<\/b>. أدِر الوجه العلوي حتى يطابق لونها الأمامي المركز الأمامي. إن طابق لونها العلوي المركز <b>الأيمن<\/b>، فاستخدم هذه.","Two chunks: \"U R U R' U'\", then turn the whole cube (y) so the right side faces you, then \"L' U' L\".":"جزءان: «U R U R' U'»، ثم أدِر المكعب كله (y) ليصبح الوجه الأيمن باتجاهك، ثم «L' U' L».","Turn the cube the right way: the old right side must end up facing you. The other way breaks the white layer.":"أدِر المكعب في الاتجاه الصحيح: يجب أن يصبح الوجه الأيمن القديم باتجاهك. الاتجاه الآخر يخرّب الطبقة البيضاء.","You end up looking at a new front side. That is fine, just find the next edge from there.":"ستجد نفسك تنظر إلى وجه أمامي جديد. لا بأس، ابحث عن الحافة التالية من هناك.","A wrong edge sitting in the slot? Drop any other edge in with this formula to pop it out.":"حافة خاطئة في الخانة؟ أنزل أي حافة أخرى بهذه الخوارزمية لإخراجها.","Grey pieces are the yellow ones. They do not matter until step 4.":"القطع الرمادية هي القطع الصفراء. لا تهم حتى الخطوة 4.","Step 3b · middle layer":"الخطوة 3b · الطبقة الوسطى","Edge goes left":"الحافة تذهب يسارًا","Mirror image of 3a: drops the edge into the front-left slot. U' L' U' L U, turn the whole cube so the left side faces you, then R U R'.":"صورة 3a في المرآة: تُنزل الحافة إلى الخانة الأمامية اليسرى. U' L' U' L U، ثم أدِر المكعب كله ليصبح الوجه الأيسر باتجاهك، ثم R U R'.","Same as 3a, but the edge's top colour matches the <b>left<\/b> centre.":"مثل 3a، لكن اللون العلوي للحافة يطابق المركز <b>الأيسر<\/b>.","Two chunks: \"U' L' U' L U\", then turn the whole cube (y') so the left side faces you, then \"R U R'\".":"جزءان: «U' L' U' L U»، ثم أدِر المكعب كله (y') ليصبح الوجه الأيسر باتجاهك، ثم «R U R'».","It is 3a in a mirror: R becomes L, every turn goes the other way, and the cube turns to the left instead of the right.":"إنها 3a في المرآة: R يصبح L، وكل حركة تذهب في الاتجاه الآخر، ويدور المكعب إلى اليسار بدل اليمين.","Turn the cube the right way: the old left side must end up facing you. The other way breaks the white layer.":"أدِر المكعب في الاتجاه الصحيح: يجب أن يصبح الوجه الأيسر القديم باتجاهك. الاتجاه الآخر يخرّب الطبقة البيضاء.","Once all four middle edges are in, the bottom two layers are done.":"عندما تدخل حواف الوسط الأربع كلها، تكون الطبقتان السفليتان جاهزتين.","Step 4a · yellow cross":"الخطوة 4a · الصليب الأصفر","Yellow cross from a line":"الصليب الأصفر من خط","Turns a yellow line on top into a yellow plus.":"تحوّل خطًا أصفر في الأعلى إلى علامة زائد صفراء.","Bottom two layers done. Yellow line on top, held <b>left to right<\/b>. Only a yellow dot? Do this once, you get an L, then use 4b.":"الطبقتان السفليتان جاهزتان. خط أصفر في الأعلى، ممسوك <b>من اليسار إلى اليمين<\/b>. نقطة صفراء فقط؟ نفّذها مرة لتحصل على شكل L، ثم استخدم 4b.","This is Righty wrapped in F and F'. You already know the middle part.":"هذه Righty محاطة بـ F و F'. أنت تعرف الجزء الأوسط مسبقًا.","Ignore the yellow corners for now. Only the plus matters.":"تجاهل الزوايا الصفراء الآن. المهم علامة الزائد فقط.","Step 4b · yellow cross":"الخطوة 4b · الصليب الأصفر","Yellow cross from an L":"الصليب الأصفر من شكل L","Turns a yellow L shape on top into a yellow plus.":"تحوّل شكل L أصفر في الأعلى إلى علامة زائد صفراء.","Yellow L on top, its two arms pointing <b>back and left<\/b> (like 9 and 12 on a clock).":"شكل L أصفر في الأعلى، ذراعاه تشيران <b>للخلف ولليسار<\/b> (مثل 9 و12 على الساعة).","Nearly the same as 4a, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"تقريبًا مثل 4a، فقط الوسط هو «U R U' R'» بدل «R U R' U'».","If the L points the wrong way, turn only the top layer until it fits.":"إن كان شكل L في الاتجاه الخطأ، أدِر الطبقة العليا فقط حتى يناسب.","Step 5 · yellow edges":"الخطوة 5 · الحواف الصفراء","Yellow edges into place (Sune)":"الحواف الصفراء إلى أماكنها (Sune)","Hold the two matching edges at the <b>back and right<\/b>, do the Sune, then one U turn. All four yellow edges now match their centres.":"ضع الحافتين المتطابقتين في <b>الخلف واليمين<\/b>، نفّذ Sune، ثم حركة U واحدة. الآن تطابق الحواف الصفراء الأربع مراكزها.","Turn the top until <b>two edges<\/b> match their centres. Two next to each other: hold them at the <b>back and right<\/b>, do the Sune, then <b>U<\/b> once. Two opposite each other: hold them at the <b>front and back<\/b> and do the Sune once. Now two next to each other match, so do the first case.":"أدِر الوجه العلوي حتى تطابق <b>حافتان<\/b> مركزيهما. حافتان متجاورتان: ضعهما في <b>الخلف واليمين<\/b>، نفّذ Sune، ثم <b>U<\/b> مرة واحدة. حافتان متقابلتان: ضعهما في <b>الأمام والخلف<\/b> ونفّذ Sune مرة. الآن تتطابق حافتان متجاورتان، فنفّذ الحالة الأولى.","The finishing turn is U (the yellow top), not D. Turning the bottom would break the white layers.":"الحركة الأخيرة هي U (الوجه الأصفر العلوي)، وليست D. إدارة الوجه السفلي ستخرّب الطبقات البيضاء.","Opposite case: after one Sune the matching pair sits at the front and right. Turn the whole cube so they are at the back and right, then Sune and U.":"حالة التقابل: بعد Sune واحدة يصبح الزوج المتطابق في الأمام واليمين. أدِر المكعب كله ليصبحا في الخلف واليمين، ثم Sune و U.","The yellow corners will twist about. That is fine, steps 6 and 7 fix them.":"الزوايا الصفراء ستلتوي وتتحرك. لا بأس، الخطوتان 6 و7 تصلحانها.","Step 6 · yellow corners":"الخطوة 6 · الزوايا الصفراء","Yellow corners into place (Niklas)":"الزوايا الصفراء إلى أماكنها (Niklas)","The Niklas. Moves three corners around so every corner sits between its own colours. Twist does not matter yet.":"خوارزمية Niklas. تنقل ثلاث زوايا بحيث تستقر كل زاوية بين ألوانها. الالتواء لا يهم بعد.","Find a corner that is already <b>between the right colours<\/b> (twisted is fine) and hold it at the <b>front left<\/b>. None correct? Do it once from anywhere, then look again.":"ابحث عن زاوية موجودة <b>بين الألوان الصحيحة<\/b> (لا بأس إن كانت ملتوية) وضعها في <b>الأمام يسارًا<\/b>. لا توجد زاوية صحيحة؟ نفّذها مرة من أي وضع، ثم انظر مجددًا.","The front-left corner stays put, the other three cycle around.":"الزاوية الأمامية اليسرى تبقى مكانها، والثلاث الأخرى تدور.","Do not forget the last U. Without it the top is one turn off and the yellow edges from step 5 no longer match.":"لا تنسَ U الأخيرة. بدونها يبقى الوجه العلوي متأخرًا بحركة، ولن تطابق الحواف الصفراء من الخطوة 5 مراكزها.","Might need two rounds. Keep the same corner at front left.":"قد تحتاج إلى جولتين. أبقِ الزاوية نفسها في الأمام يسارًا.","Step 7 · finish":"الخطوة 7 · الإنهاء","Twist the yellow corners":"صحّح التواء الزوايا الصفراء","Just the Righty move. Yellow down, twisted corner at the bottom front right. Yellow facing sideways: Righty 2 times. Yellow facing you: Righty 4 times. Then turn the bottom (D) to the next corner.":"فقط حركة Righty. الأصفر للأسفل، والزاوية الملتوية في الأسفل من الأمام يمينًا. الأصفر إلى الجانب: Righty مرتين. الأصفر باتجاهك: Righty 4 مرات. ثم أدِر الوجه السفلي (D) إلى الزاوية التالية.","<b>Flip the cube over: yellow on the bottom<\/b>, green still facing you. Put a twisted corner at the <b>bottom front right<\/b> and look where its yellow sticker points:<ul class=\"rule\"><li>Yellow facing <b>sideways<\/b> (right) &rarr; Righty <b>2 times<\/b><\/li><li>Yellow facing <b>you<\/b> &rarr; Righty <b>4 times<\/b><\/li><li>Yellow facing <b>down<\/b> &rarr; this corner is done<\/li><\/ul>Then turn <b>only the bottom layer (D)<\/b> to bring the next twisted corner to the bottom front right. Never turn the whole cube.":"<b>اقلب المكعب: الأصفر في الأسفل<\/b>، والأخضر لا يزال باتجاهك. ضع زاوية ملتوية في <b>الأسفل من الأمام يمينًا<\/b> وانظر أين يشير ملصقها الأصفر:<ul class=\"rule\"><li>الأصفر <b>إلى الجانب<\/b> (اليمين) &rarr; Righty <b>مرتين<\/b><\/li><li>الأصفر <b>باتجاهك<\/b> &rarr; Righty <b>4 مرات<\/b><\/li><li>الأصفر <b>للأسفل<\/b> &rarr; هذه الزاوية جاهزة<\/li><\/ul>ثم أدِر <b>الطبقة السفلى فقط (D)<\/b> لتأتي بالزاوية الملتوية التالية إلى الأسفل من الأمام يمينًا. لا تُدِر المكعب كله أبدًا.","This example twists two corners: the first has yellow facing sideways (Righty 2 times), the second has yellow facing you (Righty 4 times).":"هذا المثال يصحّح التواء زاويتين: الأولى أصفرها إلى الجانب (Righty مرتين)، والثانية أصفرها باتجاهك (Righty 4 مرات).","Not sure? Just keep doing Righty and check the corner after every 2. It is never more than 4.":"لست متأكدًا؟ استمر في تنفيذ Righty وافحص الزاوية بعد كل مرتين. لن تحتاج أبدًا إلى أكثر من 4.","The top two layers look scrambled halfway. Do not panic and do not fix them. They come back when the last corner is done.":"تبدو الطبقتان العلويتان مبعثرتين في المنتصف. لا تقلق ولا تحاول إصلاحهما. ستعودان كما كانتا عندما تنتهي من آخر زاوية.","Finish with a bottom turn to line up the yellow layer. Solved!":"أنهِ بحركة للوجه السفلي لتصطف الطبقة الصفراء. تم الحل!","R U R' U'":"R U R' U'","F2L · basic insert 1":"F2L · إدخال أساسي 1","Corner white right, edge at the back":"الزاوية أبيضها لليمين، والحافة في الخلف","Corner and edge go into the slot together in one go, instead of corner first and edge later.":"الزاوية والحافة تدخلان الخانة معًا دفعة واحدة، بدل الزاوية أولًا ثم الحافة لاحقًا.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b>. Its edge is at the <b>top back<\/b> with green on top.":"الزاوية فوق الخانة <b>الأمامية اليمنى<\/b> والأبيض <b>متجه لليمين<\/b>. حافتها في <b>الأعلى من الخلف<\/b> والأخضر في الأعلى.","F2L = first two layers. You build a white corner and its middle edge together, then drop them in as a pair.":"F2L = أول طبقتين. تبني زاوية بيضاء وحافتها الوسطى معًا، ثم تُنزلهما كزوج.","Pair them yourself first: turn the top until the corner and edge sit like in the picture.":"كوّن الزوج بنفسك أولًا: أدِر الوجه العلوي حتى تصبح الزاوية والحافة كما في الصورة.","Start the white cross as before, then use F2L instead of beginner steps 2 and 3.":"ابدأ بالصليب الأبيض كما من قبل، ثم استخدم F2L بدل الخطوتين 2 و3 من طريقة المبتدئين.","F2L · basic insert 2":"F2L · إدخال أساسي 2","Corner white facing you, edge on the left":"الزاوية أبيضها باتجاهك، والحافة على اليسار","Mirror of insert 1, using the front face.":"صورة الإدخال 1 في المرآة، باستخدام الوجه الأمامي.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b>. Its edge is at the <b>top left<\/b> with orange on top.":"الزاوية فوق الخانة <b>الأمامية اليمنى<\/b> والأبيض <b>باتجاهك<\/b>. حافتها في <b>الأعلى من اليسار<\/b> والبرتقالي في الأعلى.","Same as insert 1 in a mirror: white faces you instead of right, so use F instead of R.":"مثل الإدخال 1 في المرآة: الأبيض باتجاهك بدل اليمين، لذا استخدم F بدل R.","F2L · basic insert 3":"F2L · إدخال أساسي 3","Corner and edge side by side (right)":"الزاوية والحافة متجاورتان (يمين)","Corner and edge are next to each other in the top layer. U lines them up, then they drop in together.":"الزاوية والحافة بجانب بعضهما في الطبقة العليا. حركة U تصفّهما، ثم تدخلان معًا.","Corner above the <b>front-right<\/b> slot with white <b>facing you<\/b> and green on top. Its edge is at the <b>top right<\/b> with green on top.":"الزاوية فوق الخانة <b>الأمامية اليمنى<\/b> والأبيض <b>باتجاهك<\/b> والأخضر في الأعلى. حافتها في <b>الأعلى من اليمين<\/b> والأخضر في الأعلى.","The first U joins corner and edge into a block. R U' R' then puts the block in.":"أول U تجمع الزاوية والحافة في كتلة. ثم R U' R' تُدخل الكتلة.","F2L · basic insert 4":"F2L · إدخال أساسي 4","Corner and edge side by side (front)":"الزاوية والحافة متجاورتان (أمام)","Mirror of insert 3, using the front face.":"صورة الإدخال 3 في المرآة، باستخدام الوجه الأمامي.","Corner above the <b>front-right<\/b> slot with white <b>facing right<\/b> and green facing you. Its edge is at the <b>top front<\/b> with green facing you.":"الزاوية فوق الخانة <b>الأمامية اليمنى<\/b> والأبيض <b>متجه لليمين<\/b> والأخضر باتجاهك. حافتها في <b>الأعلى من الأمام<\/b> والأخضر باتجاهك.","Mirror of insert 3: R becomes F', R' becomes F, and every U turns the other way.":"صورة الإدخال 3 في المرآة: R تصبح F'، و R' تصبح F، وكل U تدور في الاتجاه الآخر.","F2L · make a block":"F2L · كوّن كتلة","Join corner and edge into a block":"اجمع الزاوية والحافة في كتلة","White facing up cannot go straight in. First join the corner and its edge into one block, then put the block in.":"عندما يكون الأبيض للأعلى لا يمكن إدخال الزاوية مباشرة. اجمع الزاوية وحافتها أولًا في كتلة واحدة، ثم أدخل الكتلة.","Corner above the <b>front-right<\/b> slot with white <b>facing up<\/b>. Its edge is at the <b>top back<\/b> with green on top. <b>U R U2 R'<\/b> joins them into a block, <b>U R U' R'<\/b> puts the block in.":"الزاوية فوق الخانة <b>الأمامية اليمنى<\/b> والأبيض <b>متجه للأعلى<\/b>. حافتها في <b>الأعلى من الخلف<\/b> والأخضر في الأعلى. <b>U R U2 R'<\/b> تجمعهما في كتلة، و<b>U R U' R'<\/b> تُدخل الكتلة.","Watch the strip below: after the first half, corner and edge sit side by side with matching colours. That is the block.":"راقب الشريط في الأسفل: بعد النصف الأول تصبح الزاوية والحافة متجاورتين بألوان متطابقة. هذه هي الكتلة.","The second half is basic insert 3. You already know it.":"النصف الثاني هو الإدخال الأساسي 3. أنت تعرفه مسبقًا.","This is the main F2L idea: make a block in the top layer, then drop it in. Most F2L cases work this way.":"هذه هي الفكرة الأساسية في F2L: كوّن كتلة في الطبقة العليا، ثم أدخلها. معظم حالات F2L تعمل بهذه الطريقة.","Block made":"تكوّنت الكتلة","Block in":"دخلت الكتلة","OLL 1 · yellow cross":"OLL 1 · الصليب الأصفر","Dot: make a line or an L":"نقطة: كوّن خطًا أو شكل L","Only the yellow centre and the two back corners are yellow. No yellow edges. Do the line or the L formula, and a line or an L appears.":"فقط المركز الأصفر والزاويتان الخلفيتان صفراء. لا حواف صفراء. نفّذ خوارزمية الخط أو خوارزمية L، فيظهر خط أو شكل L.","Yellow on top: only the <b>centre<\/b>, the <b>top-left<\/b> and the <b>top-right<\/b> corner are yellow, no edges.<ul class=\"rule\"><li>Line formula <b>F R U R' U' F'<\/b> &rarr; an <b>L<\/b> appears<\/li><li>L formula <b>F U R U' R' F'<\/b> &rarr; a <b>line<\/b> appears<\/li><\/ul>Then finish the cross with the <b>Line<\/b> or <b>L shape<\/b> card below.":"الأصفر في الأعلى: فقط <b>المركز<\/b> والزاويتان <b>العليا اليسرى<\/b> و<b>العليا اليمنى<\/b> صفراء، ولا حواف.<ul class=\"rule\"><li>خوارزمية الخط <b>F R U R' U' F'<\/b> &rarr; يظهر <b>شكل L<\/b><\/li><li>خوارزمية L <b>F U R U' R' F'<\/b> &rarr; يظهر <b>خط<\/b><\/li><\/ul>ثم أكمل الصليب ببطاقة <b>الخط<\/b> أو <b>شكل L<\/b> أدناه.","Done! An L appeared. Turn the top so its arms point back and left, then do the L formula.":"تم! ظهر شكل L. أدِر الوجه العلوي حتى يشير ذراعاه للخلف ولليسار، ثم نفّذ خوارزمية L.","The animation does the line formula. The L appears with its arms at the front and right.":"الرسم المتحرك ينفّذ خوارزمية الخط. يظهر شكل L وذراعاه في الأمام واليمين.","For the L formula the arms must point back and left, so turn the top twice (U2) first.":"في خوارزمية L يجب أن يشير الذراعان للخلف ولليسار، لذا أدِر الوجه العلوي مرتين (U2) أولًا.","Got a line instead? Hold it left to right and do the line formula once more.":"ظهر خط بدلًا منه؟ أمسكه من اليسار إلى اليمين ونفّذ خوارزمية الخط مرة أخرى.","Corners do not matter yet. They get fixed in OLL 2.":"الزوايا لا تهم بعد. ستُصلح في OLL 2.","Line":"خط","Yellow line on top becomes a yellow cross.":"الخط الأصفر في الأعلى يصبح صليبًا أصفر.","Yellow line on top, held <b>left to right<\/b>. Line going front to back? Turn the top once (U) first.":"خط أصفر في الأعلى، ممسوك <b>من اليسار إلى اليمين<\/b>. الخط من الأمام إلى الخلف؟ أدِر الوجه العلوي مرة (U) أولًا.","L shape":"شكل L","Yellow L on top becomes a yellow cross.":"شكل L الأصفر في الأعلى يصبح صليبًا أصفر.","Yellow L on top, its arms pointing <b>back and left<\/b> (like 9 and 12 on a clock). Pointing somewhere else? Turn only the top until it fits.":"شكل L أصفر في الأعلى، ذراعاه تشيران <b>للخلف ولليسار<\/b> (مثل 9 و12 على الساعة). يشير إلى مكان آخر؟ أدِر الطبقة العليا فقط حتى يناسب.","Nearly the same as the line formula, only the middle is \"U R U' R'\" instead of \"R U R' U'\".":"تقريبًا مثل خوارزمية الخط، فقط الوسط هو «U R U' R'» بدل «R U R' U'».","OLL 2 · yellow corners":"OLL 2 · الزوايا الصفراء","Sune":"Sune","One yellow corner up. Looks like a fish.":"زاوية صفراء واحدة للأعلى. تشبه سمكة.","Yellow cross done. The one yellow-up corner at the <b>front left<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"الصليب الأصفر جاهز. الزاوية الوحيدة التي أصفرها للأعلى في <b>الأمام يسارًا<\/b>. الزاوية الأمامية اليمنى يظهر أصفرها <b>باتجاهك<\/b>.","You already know this one from beginner step 5.":"أنت تعرف هذه مسبقًا من الخطوة 5 في طريقة المبتدئين.","Antisune":"Antisune","One yellow corner up, the fish the other way. Sune played backwards.":"زاوية صفراء واحدة للأعلى، والسمكة في الاتجاه الآخر. هي Sune بالعكس.","The one yellow-up corner at the <b>back right<\/b>. The front-left corner shows yellow <b>facing you<\/b>.":"الزاوية الوحيدة التي أصفرها للأعلى في <b>الخلف يمينًا<\/b>. الزاوية الأمامية اليسرى يظهر أصفرها <b>باتجاهك<\/b>.","It is the Sune backwards: read the Sune from the end, every turn the other way.":"إنها Sune بالعكس: اقرأ Sune من النهاية، وكل حركة في الاتجاه الآخر.","H (double headlights)":"H (مصابيح أمامية مزدوجة)","No yellow corner up. Two pairs of yellow facing out on opposite sides.":"لا توجد زاوية صفراء للأعلى. زوجان من الأصفر يتجهان للخارج على جانبين متقابلين.","Yellow pairs on the <b>left<\/b> and <b>right<\/b> sides.":"الزوجان الأصفران على الجانبين <b>الأيسر<\/b> و<b>الأيمن<\/b>.","Starts like the Sune, with an extra \"R U' R' U\" in the middle.":"تبدأ مثل Sune، مع «R U' R' U» إضافية في الوسط.","Pi":"Pi","No yellow corner up. One yellow pair on a side, the other two corners face away from each other.":"لا توجد زاوية صفراء للأعلى. زوج أصفر واحد على جانب، والزاويتان الأخريان تتجهان بعيدًا عن بعضهما.","The yellow pair (headlights) on the <b>left<\/b>. On the right, one yellow faces you and one faces the back.":"الزوج الأصفر (المصابيح الأمامية) على <b>اليسار<\/b>. على اليمين، أصفر واحد باتجاهك وآخر للخلف.","R2 = turn the right face twice. Keep the rhythm: R2 U' R2 U' R2.":"R2 = أدِر الوجه الأيمن مرتين. حافظ على الإيقاع: R2 U' R2 U' R2.","Headlights":"المصابيح الأمامية","Two yellow corners up next to each other, the other two look at you like headlights.":"زاويتان صفراوان للأعلى متجاورتان، والأخريان تنظران إليك كالمصابيح الأمامية للسيارة.","The two yellow-up corners at the <b>back<\/b>. The headlights <b>facing you<\/b>.":"الزاويتان اللتان أصفرهما للأعلى في <b>الخلف<\/b>. المصابيح الأمامية <b>باتجاهك<\/b>.","The D turn moves the white layer for a moment. D' puts it back.":"حركة D تحرّك الطبقة البيضاء للحظة. ثم D' تعيدها.","T":"T","Two yellow corners up next to each other, the other two face away from each other.":"زاويتان صفراوان للأعلى متجاورتان، والأخريان تتجهان بعيدًا عن بعضهما.","The two yellow-up corners on the <b>right<\/b>. On the left, one yellow faces you and one faces the back.":"الزاويتان اللتان أصفرهما للأعلى على <b>اليمين<\/b>. على اليسار، أصفر واحد باتجاهك وآخر للخلف.","Small r = turn the right face together with the middle slice.":"r الصغيرة = أدِر الوجه الأيمن مع الطبقة الوسطى معًا.","Bowtie":"ربطة الفراشة","Two yellow corners up, diagonal from each other.":"زاويتان صفراوان للأعلى، متقابلتان قطريًا.","Yellow-up corners at the <b>front left<\/b> and <b>back right<\/b>. The front-right corner shows yellow <b>facing you<\/b>.":"الزاويتان اللتان أصفرهما للأعلى في <b>الأمام يسارًا<\/b> و<b>الخلف يمينًا<\/b>. الزاوية الأمامية اليمنى يظهر أصفرها <b>باتجاهك<\/b>.","The middle part \"r U R' U' r'\" is the same as in the T.":"الجزء الأوسط «r U R' U' r'» هو نفسه كما في T.","PLL 1 · corners":"PLL 1 · الزوايا","Headlights: T-perm":"مصابيح أمامية: T-perm","Swaps two corners next to each other. Use it when one side already has matching corner colours (headlights).":"تبدّل زاويتين متجاورتين. استخدمها عندما يكون لأحد الجوانب زاويتان بلون متطابق (مصابيح أمامية).","Turn the top until one side has <b>headlights<\/b> (both corners the same colour). Hold that side on the <b>left<\/b>.":"أدِر الوجه العلوي حتى يظهر على أحد الجوانب <b>مصابيح أمامية<\/b> (الزاويتان باللون نفسه). ضع هذا الجانب على <b>اليسار<\/b>.","2-look PLL: first put the corners right (2 cases), then the edges (4 cases).":"PLL بخطوتين (2-look PLL): أولًا ضع الزوايا في أماكنها (حالتان)، ثم الحواف (4 حالات).","It also swaps the left and right edges. That is fine, the edge step fixes it.":"هي تبدّل أيضًا الحافتين اليسرى واليمنى. لا بأس، خطوة الحواف تصلح ذلك.","Headlights on every side? Corners are done, go to the edges.":"مصابيح أمامية على كل جانب؟ الزوايا جاهزة، انتقل إلى الحواف.","No headlights: Y-perm":"بلا مصابيح أمامية: Y-perm","Swaps two corners diagonally. Use it when no side has headlights.":"تبدّل زاويتين قطريًا. استخدمها عندما لا يكون لأي جانب مصابيح أمامية.","No headlights on any side. Hold it any way round.":"لا مصابيح أمامية على أي جانب. أمسك المكعب بأي اتجاه.","It is two OLL-style chunks in a row. Learn it in halves: \"F R U' R' U' R U R' F'\" and \"R U R' U' R' F R F'\".":"إنها جزءان على طريقة OLL متتاليان. تعلّمها على نصفين: «F R U' R' U' R U R' F'» و«R U R' U' R' F R F'».","PLL 2 · edges":"PLL 2 · الحواف","Ua-perm":"Ua-perm","Solved block in front of you. The <b>left<\/b> edge needs to go <b>right<\/b>.":"الكتلة المحلولة أمامك. الحافة <b>اليسرى<\/b> يجب أن تذهب إلى <b>اليمين<\/b>.","Corners done. The solved side (a full block) <b>in front of you<\/b>. The <b>left<\/b> edge belongs on the <b>right<\/b>: it goes right, the right edge goes to the back, the back edge goes left.":"الزوايا جاهزة. الجانب المحلول (كتلة كاملة) <b>أمامك<\/b>. الحافة <b>اليسرى<\/b> مكانها على <b>اليمين<\/b>: تذهب لليمين، والحافة اليمنى تذهب للخلف، والحافة الخلفية تذهب لليسار.","After the formula the whole top is half a turn off. The last U2 lines it up with the centres.":"بعد الخوارزمية يكون الوجه العلوي كله منحرفًا بنصف دورة. U2 الأخيرة تصفّه مع المراكز.","The front block never changes. Only the left, right and back edges go round.":"الكتلة الأمامية لا تتغير أبدًا. فقط الحواف اليسرى واليمنى والخلفية تدور.","Right edge needs to go left instead? That is the Ub-perm.":"الحافة اليمنى يجب أن تذهب لليسار بدلًا من ذلك؟ هذه هي Ub-perm.","Lined up":"مصطفّ","Ub-perm":"Ub-perm","Solved block in front of you. The <b>right<\/b> edge needs to go <b>left<\/b>.":"الكتلة المحلولة أمامك. الحافة <b>اليمنى<\/b> يجب أن تذهب إلى <b>اليسار<\/b>.","Corners done. The solved block <b>in front of you<\/b>. The <b>right<\/b> edge belongs on the <b>left<\/b>: it goes left, the left edge goes to the back, the back edge goes right.":"الزوايا جاهزة. الكتلة المحلولة <b>أمامك<\/b>. الحافة <b>اليمنى<\/b> مكانها على <b>اليسار<\/b>: تذهب لليسار، والحافة اليسرى تذهب للخلف، والحافة الخلفية تذهب لليمين.","R3 = turn the right face three times. It ends the same as R', but the three quick turns keep your rhythm.":"R3 = أدِر الوجه الأيمن ثلاث مرات. النتيجة مثل R'، لكن الحركات الثلاث السريعة تحافظ على إيقاعك.","The front block never moves. Only the left, right and back edges go round.":"الكتلة الأمامية لا تتحرك أبدًا. فقط الحواف اليسرى واليمنى والخلفية تدور.","H-perm":"H-perm","Swaps opposite edges: front with back, left with right.":"تبدّل الحواف المتقابلة: الأمامية مع الخلفية، واليسرى مع اليمنى.","Corners done, every edge is opposite its centre. Any way round.":"الزوايا جاهزة، وكل حافة مقابل مركزها. أمسك المكعب بأي اتجاه.","M = the middle slice between L and R, turned like L. M2 = twice.":"M = الطبقة الوسطى بين L و R، تُدار مثل L. M2 = مرتين.","Z-perm":"Z-perm","Swaps edges next to each other: front with right, back with left.":"تبدّل الحواف المتجاورة: الأمامية مع اليمنى، والخلفية مع اليسرى.","Corners done. The swapped pairs at <b>front-right<\/b> and <b>back-left<\/b>.":"الزوايا جاهزة. الأزواج المتبادلة في <b>الأمام يمينًا<\/b> و<b>الخلف يسارًا<\/b>.","The last U lines the top back up with the centres.":"U الأخيرة تعيد صفّ الوجه العلوي مع المراكز.","F2L 1":"F2L 1","Case 1":"الحالة 1","Corner in the slot, white facing down. The edge in the slot, flipped.":"الزاوية في الخانة، والأبيض للأسفل. الحافة في الخانة، مقلوبة.","F2L 2":"F2L 2","Case 2":"الحالة 2","Corner in the slot, white facing down. The edge on top at the front, green facing out.":"الزاوية في الخانة، والأبيض للأسفل. الحافة في الأعلى من الأمام، والأخضر للخارج.","F2L 3":"F2L 3","Case 3":"الحالة 3","Corner in the slot, white facing down. The edge on top at the right, green on top.":"الزاوية في الخانة، والأبيض للأسفل. الحافة في الأعلى من اليمين، والأخضر في الأعلى.","F2L 4":"F2L 4","Case 4":"الحالة 4","Corner in the slot, white facing you. The edge in the slot, the right way round.":"الزاوية في الخانة، والأبيض باتجاهك. الحافة في الخانة، في الاتجاه الصحيح.","F2L 5":"F2L 5","Case 5":"الحالة 5","Corner in the slot, white facing you. The edge in the slot, flipped.":"الزاوية في الخانة، والأبيض باتجاهك. الحافة في الخانة، مقلوبة.","F2L 6":"F2L 6","Case 6":"الحالة 6","Corner in the slot, white facing you. The edge on top at the front, green facing out.":"الزاوية في الخانة، والأبيض باتجاهك. الحافة في الأعلى من الأمام، والأخضر للخارج.","F2L 7":"F2L 7","Case 7":"الحالة 7","Corner in the slot, white facing you. The edge on top at the right, green on top.":"
