<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Log</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1c2233; --muted:#6b7280; --body:#3b4254;
    --accent:#2563eb; --on-accent:#ffffff; --line:#e3e7f0; --edge:#d7dbe6; --faint:#9aa3b5;
    --good:#16a34a; --warn:#ea580c; --water:#0ea5e9; --danger:#dc2626;
    color-scheme:light;
  }
  /* dark theme: picked with the header button, or the system setting when nothing is picked */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --body:#c9cfdc;
      --accent:#4f8cff; --line:#2a3346; --edge:#364055; --faint:#6c768c;
      --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --body:#c9cfdc;
    --accent:#4f8cff; --line:#2a3346; --edge:#364055; --faint:#6c768c;
    --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:7px 14px;font-weight:600}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  input,select{background:var(--bg);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800;font-size:18px}
  .theme{font-size:15px;padding:6px 12px}
  nav.tabs{display:flex;gap:8px;justify-content:center;padding:14px 16px 0;flex-wrap:wrap}
  nav.tabs a{font-weight:700;padding:8px 16px;border-radius:10px;border:2px solid var(--edge);background:var(--panel)}
  nav.tabs a:hover{border-color:var(--accent)}
  nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  main{max-width:760px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:16px}
  h2{font-size:20px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .seg{display:inline-flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .seg button{border:0;border-radius:0;padding:7px 16px}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  /* --- logged entries --- */
  ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.log li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  ul.log .what{flex:1;min-width:0}
  ul.log .what b{display:block}
  ul.log .what span{font-size:14px;color:var(--muted)}
  .x{border:0;background:none;color:var(--faint);font-size:20px;padding:2px 8px}
  .x:hover{color:var(--danger)}

  /* --- stats --- */
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px}
  .stat span{font-size:13px;color:var(--muted)}

  /* --- rest timer --- */
  .timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 12px}
  .timer.done{color:var(--good)}
  .presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  /* --- health --- */
  .water{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .glasses{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .glass{width:26px;height:34px;border:2px solid var(--water);border-radius:4px 4px 8px 8px}
  .glass.full{background:var(--water)}
  .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--good)}
  svg.spark{width:100%;height:auto;display:block;margin-top:12px}

  /* --- history --- */
  .day{border-top:1px solid var(--line);padding:12px 0}
  .day:first-child{border-top:0;padding-top:0}
  .day h3{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px}
  .day h3 small{font-weight:500;color:var(--muted)}
  .day p{margin:2px 0;font-size:15px;color:var(--body)}
  .empty{color:var(--muted);text-align:center;padding:10px 0}
  @media (max-width:560px){ .timer{font-size:44px} }
</style>
</head>
<body>
<header>
  <a class="brand" href="#workout">&#128170; Fitness Log</a>
  <button class="theme" id="theme" type="button"></button>
</header>
<nav class="tabs" id="tabs">
  <a href="#workout">Workout</a>
  <a href="#health">Health</a>
  <a href="#history">History</a>
</nav>
<main id="app"></main>

<script>
/* Light / dark switch. The choice is remembered in this browser; with no choice the system setting is used. */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{ saved=localStorage.getItem('theme'); }catch(e){}
  if(saved==='dark'||saved==='light') root.dataset.theme=saved;
  const isDark=()=>root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label=()=>{ btn.textContent=isDark() ? '☀️ Light' : '🌙 Dark'; btn.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode'); };
  btn.onclick=()=>{ const next=isDark()?'light':'dark'; root.dataset.theme=next; try{ localStorage.setItem('theme',next); }catch(e){} label(); };
  label();
})();

/* ============================================================
   Data: one record per calendar day, kept in this browser.
   days['2026-10-09'] = { workouts:[...], water, weight, sleep, steps }
   ============================================================ */
const KEY='fitness-data';
const WATER_GOAL=8, STEP_GOAL=10000;
const EXERCISES=['Push-ups','Pull-ups','Squats','Lunges','Plank','Bench press','Deadlift','Overhead press','Barbell row','Bicep curls','Running','Cycling','Walking','Swimming','Rowing','Jump rope','Yoga'];

let data={days:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) data=JSON.parse(raw); }catch(e){}
if(!data.days) data={days:{}};
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} };

const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());   // local date, not UTC
const today=()=>dayKey(new Date());
const day=k=>data.days[k] || (data.days[k]={workouts:[], water:0, weight:null, sleep:null, steps:null});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ const n=parseFloat(v); return isFinite(n) && n>=0 ? n : null; };
const niceDate=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});

function describe(w){
  if(w.kind==='cardio') return [w.min && w.min+' min', w.km && w.km+' km'].filter(Boolean).join(' · ') || 'Cardio';
  let s=(w.sets||1)+' × '+(w.reps||0)+' reps';
  if(w.weight) s+=' @ '+w.weight+' kg';
  return s;
}
const volume=w=>w.kind==='strength' ? (w.sets||1)*(w.reps||0)*(w.weight||0) : 0;

/* Consecutive days with a workout, ending today (or yesterday, so the streak survives until today is over). */
function streak(){
  const d=new Date(), has=k=>(data.days[k]?.workouts||[]).length>0;
  if(!has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0;
  while(has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function workoutDaysThisWeek(){
  const d=new Date(), back=(d.getDay()+6)%7;   // weeks start on Monday
  let n=0;
  for(let i=0;i<=back;i++){ const k=dayKey(d); if((data.days[k]?.workouts||[]).length) n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ============================================================
   Rest timer (keeps running when you switch tabs)
   ============================================================ */
const timer={left:0, end:0, id:null};
function startTimer(sec){
  clearInterval(timer.id);
  timer.end=Date.now()+sec*1000; timer.left=sec;
  timer.id=setInterval(tick,250); paintTimer();
}
function stopTimer(){ clearInterval(timer.id); timer.id=null; timer.left=0; paintTimer(); }
function tick(){
  timer.left=Math.max(0, Math.ceil((timer.end-Date.now())/1000));
  if(timer.left===0){ clearInterval(timer.id); timer.id=null; beep(); }
  paintTimer();
}
function paintTimer(){
  const el=document.getElementById('clock'); if(!el) return;
  el.textContent=Math.floor(timer.left/60)+':'+pad(timer.left%60);
  el.classList.toggle('done', !timer.id && timer.end>0 && timer.left===0);
}
function beep(){
  try{ navigator.vibrate?.([200,100,200]); }catch(e){}
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.25, ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+t+0.2);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.2);
    });
  }catch(e){}
}

/* ============================================================
   Pages
   ============================================================ */
let kind='strength';

function workoutPage(){
  const t=day(today());
  const used=new Set(EXERCISES);
  Object.values(data.days).forEach(d=>d.workouts.forEach(w=>used.add(w.name)));
  const vol=t.workouts.reduce((a,w)=>a+volume(w),0), mins=t.workouts.reduce((a,w)=>a+(w.min||0),0);
  return `
  <section class="card">
    <h2>Log exercise</h2>
    <div class="seg">
      <button type="button" data-kind="strength" class="${kind==='strength'?'on':''}">Strength</button>
      <button type="button" data-kind="cardio" class="${kind==='cardio'?'on':''}">Cardio</button>
    </div>
    <form id="add" class="row">
      <label style="flex:2 1 180px">Exercise
        <input name="name" list="ex" required placeholder="e.g. Squats" autocomplete="off">
        <datalist id="ex">${[...used].sort().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      </label>
      ${kind==='strength' ? `
        <label style="flex:1 1 70px">Sets<input name="sets" type="number" min="1" value="3" inputmode="numeric"></label>
        <label style="flex:1 1 70px">Reps<input name="reps" type="number" min="0" value="10" inputmode="numeric"></label>
        <label style="flex:1 1 80px">Weight (kg)<input name="weight" type="number" min="0" step="0.5" placeholder="—" inputmode="decimal"></label>
      ` : `
        <label style="flex:1 1 80px">Minutes<input name="min" type="number" min="0" value="30" inputmode="numeric"></label>
        <label style="flex:1 1 80px">Distance (km)<input name="km" type="number" min="0" step="0.1" placeholder="—" inputmode="decimal"></label>
      `}
      <button class="primary" type="submit">Add</button>
    </form>
  </section>

  <section class="card">
    <h2>Today <span class="muted" style="font-weight:500;font-size:15px">${niceDate(today())}</span></h2>
    ${t.workouts.length ? `
      <ul class="log">${t.workouts.map((w,i)=>`
        <li><div class="what"><b>${esc(w.name)}</b><span>${esc(describe(w))}</span></div>
        <button class="x" type="button" data-del="${i}" aria-label="Remove ${esc(w.name)}">&times;</button></li>`).join('')}
      </ul>
      <p class="muted" style="margin:12px 0 0">${t.workouts.length} exercise${t.workouts.length>1?'s':''}${vol?` · ${Math.round(vol).toLocaleString()} kg lifted`:''}${mins?` · ${mins} min cardio`:''}</p>
    ` : `<p class="empty">Nothing logged yet today. Add your first exercise above.</p>`}
  </section>

  <section class="card">
    <h2>Rest timer</h2>
    <div class="timer" id="clock">0:00</div>
    <div class="presets">
      ${[30,60,90,120,180].map(s=>`<button type="button" data-rest="${s}">${s<60?s+'s':s/60+' min'}</button>`).join('')}
      <button type="button" data-rest="0">Stop</button>
    </div>
  </section>`;
}

function healthPage(){
  const t=day(today());
  const weights=Object.keys(data.days).sort().filter(k=>data.days[k].weight!=null).slice(-30).map(k=>[k,data.days[k].weight]);
  return `
  <section class="card">
    <h2>Water</h2>
    <div class="water">
      <button type="button" data-water="-1" aria-label="One glass less">&minus;</button>
      <div class="glasses">${Array.from({length:Math.max(WATER_GOAL,t.water)},(_,i)=>`<div class="glass ${i<t.water?'full':''}"></div>`).join('')}</div>
      <button type="button" class="primary" data-water="1" aria-label="One glass more">+ Glass</button>
    </div>
    <p class="muted" style="margin:10px 0 0">${t.water} of ${WATER_GOAL} glasses today${t.water>=WATER_GOAL?' — goal reached &#127881;':''}</p>
  </section>

  <section class="card">
    <h2>Today's check-in</h2>
    <form id="checkin" class="row">
      <label style="flex:1 1 120px">Body weight (kg)<input name="weight" type="number" min="0" step="0.1" inputmode="decimal" value="${t.weight??''}"></label>
      <label style="flex:1 1 120px">Sleep (hours)<input name="sleep" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="${t.sleep??''}"></label>
      <label style="flex:1 1 120px">Steps<input name="steps" type="number" min="0" step="1" inputmode="numeric" value="${t.steps??''}"></label>
      <button class="primary" type="submit">Save</button>
    </form>
    ${t.steps!=null ? `<div class="bar" title="${t.steps} of ${STEP_GOAL} steps"><i style="width:${Math.min(100,t.steps/STEP_GOAL*100)}%"></i></div>
      <p class="muted" style="margin:6px 0 0;font-size:14px">${t.steps.toLocaleString()} / ${STEP_GOAL.toLocaleString()} steps</p>` : ''}
  </section>

  <section class="card">
    <h2>Body weight trend</h2>
    ${weights.length>=2 ? spark(weights) : `<p class="empty">Save your weight on two or more days to see a trend.</p>`}
  </section>`;
}

/* Small line chart of [date, value] pairs. */
function spark(pts){
  const W=600, H=120, P=14, vals=pts.map(p=>p[1]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<1){ lo-=0.5; hi+=0.5; }
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const first=vals[0], last=vals[vals.length-1], diff=last-first;
  return `
    <p style="margin:0">Now <b>${last} kg</b> · <span style="color:${diff<=0?'var(--good)':'var(--warn)'}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>
      <span class="muted">since ${niceDate(pts[0][0])}</span></p>
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight from ${first} to ${last} kg">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="7" fill="var(--accent)"><title>${niceDate(p[0])}: ${p[1]} kg</title></circle>`).join('')}
    </svg>`;
}

function historyPage(){
  const keys=Object.keys(data.days).filter(k=>{ const d=data.days[k]; return d.workouts.length||d.water||d.weight!=null||d.sleep!=null||d.steps!=null; }).sort().reverse();
  const total=keys.reduce((a,k)=>a+data.days[k].workouts.length,0);
  return `
  <section class="card">
    <div class="grid">
      <div class="stat"><b>${streak()}</b><span>day streak &#128293;</span></div>
      <div class="stat"><b>${workoutDaysThisWeek()}</b><span>workout days this week</span></div>
      <div class="stat"><b>${total}</b><span>exercises logged</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Past days</h2>
    ${keys.length ? keys.map(k=>{
      const d=data.days[k], extra=[d.water&&d.water+' glasses water', d.weight!=null&&d.weight+' kg', d.sleep!=null&&d.sleep+' h sleep', d.steps!=null&&d.steps.toLocaleString()+' steps'].filter(Boolean);
      return `<div class="day">
        <h3>${niceDate(k)}${k===today()?' <small>today</small>':''}</h3>
        ${d.workouts.map(w=>`<p><b>${esc(w.name)}</b> — ${esc(describe(w))}</p>`).join('')}
        ${extra.length?`<p class="muted">${extra.join(' · ')}</p>`:''}
      </div>`;
    }).join('') : `<p class="empty">Your history will show up here once you log something.</p>`}
  </section>

  <section class="card">
    <h2>Backup</h2>
    <p class="muted" style="margin:0 0 12px">Your log is saved only in this browser. Download a backup to keep it safe or move it to another device.</p>
    <div class="row">
      <button type="button" id="export">Download backup</button>
      <button type="button" id="import">Restore from backup</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
  </section>`;
}

/* ============================================================
   Router + event handling
   ============================================================ */
const PAGES={workout:workoutPage, health:healthPage, history:historyPage};
const app=document.getElementById('app');

function render(){
  const page=PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'workout';
  app.innerHTML=PAGES[page]();
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on', a.hash==='#'+page));
  paintTimer();
}
window.addEventListener('hashchange', render);

app.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.kind){ kind=b.dataset.kind; render(); document.querySelector('#add [name=name]').focus(); }
  else if(b.dataset.del!=null){ day(today()).workouts.splice(+b.dataset.del,1); save(); render(); }
  else if(b.dataset.rest!=null){ +b.dataset.rest ? startTimer(+b.dataset.rest) : stopTimer(); }
  else if(b.dataset.water){ const t=day(today()); t.water=Math.max(0, t.water+ +b.dataset.water); save(); render(); }
  else if(b.id==='export'){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download='fitness-backup-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href);
  }
  else if(b.id==='import') document.getElementById('file').click();
});

app.addEventListener('change', e=>{
  if(e.target.id!=='file' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt=>{
    const d=JSON.parse(txt);
    if(!d || typeof d.days!=='object') throw new Error('not a backup');
    if(!confirm('Replace everything in this browser with the backup?')) return;
    data=d; save(); render();
  }).catch(()=>alert('That file is not a Fitness Log backup.'));
});

app.addEventListener('submit', e=>{
  e.preventDefault();
  const f=new FormData(e.target), t=day(today());
  if(e.target.id==='add'){
    const name=String(f.get('name')).trim(); if(!name) return;
    const w = kind==='strength'
      ? {name, kind, sets:num(f.get('sets'))||1, reps:num(f.get('reps'))||0, weight:num(f.get('weight'))}
      : {name, kind, min:num(f.get('min')), km:num(f.get('km'))};
    t.workouts.push(w); save(); render();
    document.querySelector('#add [name=name]').focus();
  } else if(e.target.id==='checkin'){
    t.weight=num(f.get('weight')); t.sleep=num(f.get('sleep')); t.steps=num(f.get('steps'));
    save(); render();
  }
});

render();
</script>
</body>
</html>
