<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Log</title>
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1c2233; --muted:#6b7280; --body:#3b4254;
    --accent:#2563eb; --on-accent:#ffffff; --line:#e3e7f0; --edge:#d7dbe6; --faint:#9aa3b5;
    --good:#16a34a; --warn:#ea580c; --water:#0ea5e9; --danger:#dc2626;
    color-scheme:light;
  }
  /* dark theme: picked with the header button, or the system setting when nothing is picked */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --body:#c9cfdc;
      --accent:#4f8cff; --line:#2a3346; --edge:#364055; --faint:#6c768c;
      --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --panel:#1a2130; --ink:#e7eaf3; --muted:#a3abbd; --body:#c9cfdc;
    --accent:#4f8cff; --line:#2a3346; --edge:#364055; --faint:#6c768c;
    --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:7px 14px;font-weight:600}
  button:hover{border-color:var(--accent)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.danger{border-color:var(--danger);color:var(--danger)}
  input,select{background:var(--bg);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  header .brand{font-weight:800;font-size:18px}
  header .right{display:flex;align-items:center;gap:12px}
  .sync{font-size:13px;color:var(--muted)}
  .sync.ok{color:var(--good)} .sync.bad{color:var(--warn)}
  .theme{font-size:15px;padding:6px 12px}
  /* bottom bar with the four main buttons */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px))}
  .bottombar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
  .bottombar a:hover{color:var(--ink)}
  .bottombar a.on{color:var(--accent)}
  .bottombar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  main{max-width:760px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:16px}
  h1{font-size:26px;margin:0;text-wrap:balance}
  h2{font-size:20px;margin:0 0 12px}
  .hello p{margin:4px 0 0;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .seg{display:inline-flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .seg button{border:0;border-radius:0;padding:7px 16px}
  .seg button.on{background:var(--accent);color:var(--on-accent)}

  /* --- logged entries --- */
  ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.log li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  ul.log .what{flex:1;min-width:0;overflow-wrap:anywhere}
  ul.log .what b{display:block}
  ul.log .what span{font-size:14px;color:var(--muted)}
  .x{border:0;background:none;color:var(--faint);font-size:20px;padding:2px 8px}
  .x:hover{color:var(--danger)}
  .saveas{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

  /* --- search --- */
  .search{position:relative}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
  .search input{background:var(--panel);padding:12px 14px 12px 44px;font-size:17px;border-radius:14px}
  .results{display:flex;flex-direction:column;gap:14px}
  .results h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
  .results .hits{display:flex;flex-direction:column;gap:6px}
  .results .hits button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;overflow-wrap:anywhere}
  .results .hits small{font-weight:500;color:var(--muted);font-size:13px;flex:none}

  /* --- weekly goal --- */
  .goal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pencil{border:0;background:none;padding:4px;line-height:0}
  .pencil svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .goal-card{padding:10px 14px}
  .goal-card .goal-head{font-size:16px;margin-bottom:6px}
  .goal-count{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .goal-count b{color:var(--ink)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;width:100%;border:0;background:none;padding:0;font-weight:400}
  .week > span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}

  /* --- month calendar pop-up --- */
  .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgb(0 0 0 / .45)}
  .month{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px}
  .month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .month-head h2{margin:0}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
  .month-grid .wd{font-size:13px;color:var(--muted);padding-bottom:4px}
  .month-grid .d{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:16px;font-variant-numeric:tabular-nums}
  .month-grid .d.done{background:var(--accent);color:var(--on-accent);font-weight:700}
  .month-grid .d.today{outline:2px solid var(--accent);outline-offset:2px}
  .legend{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:14px;color:var(--muted)}
  .legend i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .week b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .week .today b{border:2px solid var(--accent);color:var(--accent)}

  /* --- body focus --- */
  .focus-title{font-size:21px;font-weight:800;letter-spacing:.04em;color:var(--ink);margin:0 0 10px}
  /* one row; swipe sideways for the buttons that don't fit */
  .chips.focus-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .focus-row::-webkit-scrollbar{display:none}
  .focus-row button{flex:none;white-space:nowrap}

  .plan-card{display:flex;flex-direction:column;gap:4px;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .plan-card b{font-size:17px}
  .plan-card .muted{font-size:14px}
  .plan-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .bolts{display:flex;gap:2px}
  .bolts svg{width:18px;height:18px;fill:var(--edge);stroke:none}
  .bolts .lit svg{fill:var(--accent)}

  /* --- ready-made workouts --- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chips button{padding:6px 14px;border-radius:999px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  /* --- routines --- */
  .routines{display:flex;flex-wrap:wrap;gap:8px}
  .routines button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;max-width:100%;overflow-wrap:anywhere}
  .routines button small{font-weight:500;color:var(--muted);font-size:13px}
  .routine{border-top:1px solid var(--line);padding:14px 0}
  .routine:first-of-type{border-top:0;padding-top:0}
  .routine h3{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow-wrap:anywhere}

  /* --- stats --- */
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--muted)}

  /* --- rest timer --- */
  .timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 12px}
  .timer.done{color:var(--good)}
  .presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  /* --- health --- */
  .water{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .glasses{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .glass{width:26px;height:34px;border:2px solid var(--water);border-radius:4px 4px 8px 8px}
  .glass.full{background:var(--water)}
  .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--good)}
  svg.spark{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}

  /* --- history --- */
  .day{border-top:1px solid var(--line);padding:12px 0}
  .day:first-child{border-top:0;padding-top:0}
  .day h3{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px}
  .day h3 small{font-weight:500;color:var(--muted)}
  .day p{margin:2px 0;font-size:15px;color:var(--body);overflow-wrap:anywhere}
  .empty{color:var(--muted);text-align:center;padding:10px 0;margin:0}
  .note{margin:0 0 12px;color:var(--muted);line-height:1.45}

  .toast{position:fixed;z-index:6;left:50%;bottom:calc(88px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
  @media (max-width:560px){ .timer{font-size:44px} header{padding:12px 16px} }
</style>
</head>
<body>
<header>
  <a class="brand" href="#home">&#128170; Fitness Log</a>
  <div class="right">
    <span class="sync" id="sync"></span>
    <button class="theme" id="theme" type="button"></button>
  </div>
</header>
<main id="app"></main>
<nav class="bottombar" id="tabs">
  <a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>Home</a>
  <a href="#workout"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-45 12 12) translate(12 12) scale(.85) translate(-12 -12)"><ellipse cx="2.5" cy="12" rx="1.8" ry="5.5"/><path d="M2.5 6.5H6a1.8 5.5 0 0 1 0 11H2.5"/><ellipse cx="16.2" cy="12" rx="1.8" ry="5.5"/><path d="M16.2 6.5h3.5a1.8 5.5 0 0 1 0 11h-3.5"/><path d="M7.8 12h6.6"/></g></svg>Workout</a>
  <a href="#coach"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-4.3 16.9L3 21l1.2-4.5A9 9 0 0 1 12 3z"/></svg>Coach</a>
  <a href="#profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</a>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* Light / dark switch. The choice is remembered in this browser; with no choice the system setting is used. */
(function(){
  const root=document.documentElement, btn=document.getElementById('theme');
  let saved=null; try{ saved=localStorage.getItem('theme'); }catch(e){}
  if(saved==='dark'||saved==='light') root.dataset.theme=saved;
  const isDark=()=>root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label=()=>{ btn.textContent=isDark() ? '☀️ Light' : '🌙 Dark'; btn.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode'); };
  btn.onclick=()=>{ const next=isDark()?'light':'dark'; root.dataset.theme=next; try{ localStorage.setItem('theme',next); }catch(e){} label(); };
  label();
})();

/* ============================================================
   Data: one record per calendar day, plus your profile (name, goals, routines).
   days['2026-10-09'] = { workouts:[...], water, weight, sleep, steps }
   Always kept in this browser; when the page is opened in Claude it also
   syncs to your account, so phone and computer share one log.
   ============================================================ */
const KEY='fitness-data';
const DEFAULT_GOALS={water:8, steps:10000, sleep:8, weight:null, days:3};
const EXERCISES=['Push-ups','Pull-ups','Squats','Lunges','Plank','Bench press','Deadlift','Overhead press','Barbell row','Bicep curls','Running','Cycling','Walking','Swimming','Rowing','Jump rope','Yoga'];

/* Ready-made workouts on the Workout page. Each line is one exercise:
   [name, sets, reps] or [name, sets, seconds, 's'] for holds, or [name, minutes, 'min'] for cardio. */
const WORKOUTS=[
  {id:'abs', name:'Abs', items:[['Crunches',3,15], ['Plank',3,30,'s'], ['Leg raises',3,12], ['Russian twists',3,20], ['Bicycle crunches',3,20], ['Mountain climbers',3,30,'s']]},
  {id:'chest', name:'Chest', items:[['Push-ups',3,12], ['Wide push-ups',3,10], ['Incline push-ups',3,12], ['Bench press',3,10], ['Chest dips',3,8]]},
  {id:'legs', name:'Legs', items:[['Squats',3,15], ['Lunges',3,12], ['Glute bridges',3,15], ['Calf raises',3,20], ['Wall sit',3,45,'s']]},
  {id:'arms', name:'Arms', items:[['Bicep curls',3,12], ['Tricep dips',3,10], ['Diamond push-ups',3,8], ['Hammer curls',3,12], ['Overhead tricep extension',3,12]]},
  {id:'back', name:'Back', items:[['Pull-ups',3,6], ['Bent-over row',3,10], ['Superman hold',3,20,'s'], ['Bird dog',3,12]]},
  {id:'cardio', name:'Cardio', items:[['Jumping jacks',3,40,'s'], ['Jump rope',10,'min'], ['Running',20,'min']]},
  {id:'full', name:'Full body', items:[['Burpees',3,10], ['Squats',3,15], ['Push-ups',3,12], ['Mountain climbers',3,30,'s'], ['Plank',3,45,'s']]},
];
const toExercise=([name,a,b,unit])=> b==='min' ? {name, kind:'cardio', min:a, km:null}
  : unit==='s' ? {name, kind:'strength', sets:a, reps:0, sec:b, weight:null}
  : {name, kind:'strength', sets:a, reps:b, weight:null};

const clone=o=>JSON.parse(JSON.stringify(o));
function normProfile(p){
  p=p && typeof p==='object' ? p : {};
  return {name:typeof p.name==='string' ? p.name : '', goals:{...DEFAULT_GOALS, ...(p.goals||{})}, routines:Array.isArray(p.routines) ? p.routines : [],
          lastDone:p.lastDone && typeof p.lastDone==='object' ? p.lastDone : {}};   // ready-made workout id -> day you last logged it
}
function normalize(d){
  d=d && typeof d==='object' ? d : {};
  const days={};
  for(const [k,x] of Object.entries(d.days||{})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !x) continue;
    days[k]={workouts:Array.isArray(x.workouts) ? x.workouts : [], water:+x.water||0, weight:x.weight??null, sleep:x.sleep??null, steps:x.steps??null};
  }
  return {days, profile:normProfile(d.profile)};
}

let data=normalize(null);
try{ const raw=localStorage.getItem(KEY); if(raw) data=normalize(JSON.parse(raw)); }catch(e){}
const saveLocal=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} };
const saveDay=k=>{ saveLocal(); queueMonth(k.slice(0,7)); };
const saveProfile=()=>{ saveLocal(); queue('profile', ()=>clone(data.profile)); };

const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());   // local date, not UTC
const today=()=>dayKey(new Date());
const day=k=>data.days[k] || (data.days[k]={workouts:[], water:0, weight:null, sleep:null, steps:null});
const hasContent=d=>d && (d.workouts.length || d.water || d.weight!=null || d.sleep!=null || d.steps!=null);
const goals=()=>data.profile.goals;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ const n=parseFloat(v); return isFinite(n) && n>=0 ? n : null; };
const niceDate=k=>new Date(k+'T12:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});

function describe(w){
  if(w.kind==='cardio') return [w.min && w.min+' min', w.km && w.km+' km'].filter(Boolean).join(' · ') || 'Cardio';
  let s=(w.sets||1)+' × '+(w.sec ? w.sec+' s' : (w.reps||0)+' reps');
  if(w.weight) s+=' @ '+w.weight+' kg';
  return s;
}
const volume=w=>w.kind==='strength' ? (w.sets||1)*(w.reps||0)*(w.weight||0) : 0;
const copyExercise=w=>w.kind==='cardio' ? {name:w.name, kind:'cardio', min:w.min??null, km:w.km??null} : {name:w.name, kind:'strength', sets:w.sets||1, reps:w.reps||0, ...(w.sec ? {sec:w.sec} : {}), weight:w.weight??null};

/* Consecutive days with a workout, ending today (or yesterday, so the streak survives until today is over). */
function streak(){
  const d=new Date(), has=k=>(data.days[k]?.workouts||[]).length>0;
  if(!has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0;
  while(has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function workoutDaysThisWeek(){
  const d=new Date(), back=(d.getDay()+6)%7;   // weeks start on Monday
  let n=0;
  for(let i=0;i<=back;i++){ const k=dayKey(d); if((data.days[k]?.workouts||[]).length) n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ============================================================
   Sync to your Claude account (only when opened inside Claude).
   Your private space holds one document per month ('m-2026-10': {days})
   plus 'profile'. Writes to one document go one at a time, and a burst
   of edits is folded into the next write.
   ============================================================ */
const cloud={col:null, live:false, ids:new Set(), pending:new Map(), busy:new Set(), error:'', viewerName:'', downloads:null};
const monthBody=m=>{ const days={}; for(const k in data.days) if(k.startsWith(m) && hasContent(data.days[k])) days[k]=data.days[k]; return {days}; };
const queueMonth=m=>queue('m-'+m, ()=>monthBody(m));

function queue(id, build){
  if(!cloud.col) return;
  cloud.pending.set(id, build); flush(id); paintSync();
}
async function flush(id){
  if(cloud.busy.has(id) || !cloud.pending.has(id)) return;
  const build=cloud.pending.get(id); cloud.pending.delete(id); cloud.busy.add(id);
  const ref=cloud.col.doc(id), write=()=>build ? ref.set(build()) : ref.delete();
  try{
    await write().catch(e=>{ if(e?.code!=='unavailable') throw e; return new Promise(r=>setTimeout(r,800+Math.random()*1200)).then(write); });
    cloud.error='';
  }catch(e){
    cloud.error = e?.code==='quota_exceeded' ? 'Cloud space full' : 'Not synced';
  }finally{
    cloud.busy.delete(id); paintSync(); flush(id);
  }
}

function paintSync(){
  const el=document.getElementById('sync');
  if(cloud.error){ el.textContent='⚠️ '+cloud.error; el.className='sync bad'; el.title='Your changes are still saved on this device.'; }
  else if(cloud.live){ const saving=cloud.pending.size||cloud.busy.size; el.textContent=saving ? 'Saving…' : '☁️ Synced'; el.className='sync ok'; el.title='Your log syncs between your devices.'; }
  else { el.textContent=''; el.title=''; }
}

async function connect(){
  if(!window.claude?.use) return;   // opened as a plain file: this browser only
  const [db, user, downloads]=await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  cloud.downloads=downloads;
  if(user){ cloud.viewerName=((await user.name())||'').split(' ')[0]; if(!data.profile.name && cloud.viewerName) refresh(); }
  const id=user && await user.id();
  if(!db || !id) return;
  const col=db.collection('data/users/'+id);
  let merged=false;
  col.limit(1000).onSnapshot(snap=>{
    if(!merged && snap.metadata.fromCache) return;   // wait for the real answer before merging
    const days={}, ids=new Set(); let profile=null;
    snap.docs.forEach(d=>{
      ids.add(d.id); const b=clone(d.data()||{});
      if(d.id==='profile') profile=b;
      else if(d.id.startsWith('m-')) Object.assign(days, normalize({days:b.days}).days);
    });
    cloud.ids=ids;
    // documents with a write still on its way keep this device's version
    const held=new Set([...cloud.pending.keys(), ...cloud.busy]);
    for(const k in data.days) if(held.has('m-'+k.slice(0,7))) days[k]=data.days[k];
    for(const k in days) if(held.has('m-'+k.slice(0,7)) && !data.days[k]) delete days[k];
    const before=JSON.stringify(data), upload=new Set();
    if(!merged){
      // first connection: anything logged on this device but not in your account is added to it
      for(const k in data.days) if(!days[k] && hasContent(data.days[k])){ days[k]=data.days[k]; upload.add(k.slice(0,7)); }
      merged=true; cloud.col=col; cloud.live=true;
      if(!profile && JSON.stringify(data.profile)!==JSON.stringify(normProfile(null))) cloud.pending.set('profile', ()=>clone(data.profile));
    }
    data.days=days;
    if(profile && !held.has('profile')) data.profile=normProfile(profile);
    saveLocal();
    upload.forEach(queueMonth);
    if(cloud.pending.has('profile')) flush('profile');
    paintSync();
    if(JSON.stringify(data)!==before) refresh();
  }, ()=>{ cloud.col=null; cloud.live=false; cloud.error='Not synced'; paintSync(); });
}

/* ============================================================
   Rest timer (keeps running when you switch tabs)
   ============================================================ */
const timer={left:0, end:0, id:null, ac:null};
function startTimer(sec){
  clearInterval(timer.id);
  // sound needs a tap to start, so the audio is set up here rather than when the timer ends
  try{ timer.ac=timer.ac||new (window.AudioContext||window.webkitAudioContext)(); timer.ac.resume(); }catch(e){}
  timer.end=Date.now()+sec*1000; timer.left=sec;
  timer.id=setInterval(tick,250); paintTimer();
}
function stopTimer(){ clearInterval(timer.id); timer.id=null; timer.left=0; timer.end=0; paintTimer(); }
function tick(){
  timer.left=Math.max(0, Math.ceil((timer.end-Date.now())/1000));
  if(timer.left===0){ clearInterval(timer.id); timer.id=null; beep(); }
  paintTimer();
}
function paintTimer(){
  const el=document.getElementById('clock'); if(!el) return;
  el.textContent=Math.floor(timer.left/60)+':'+pad(timer.left%60);
  el.classList.toggle('done', !timer.id && timer.end>0 && timer.left===0);
}
function beep(){
  try{ navigator.vibrate?.([200,100,200]); }catch(e){}
  const ac=timer.ac; if(!ac) return;
  try{
    [0,0.25,0.5].forEach(t=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.25, ac.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+t+0.2);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.2);
    });
  }catch(e){}
}

let toastId=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.hidden=false;
  clearTimeout(toastId); toastId=setTimeout(()=>el.hidden=true, 2600);
}

/* The big calendar for this month; days with a workout are filled in. */
function monthCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const lead=(new Date(y,m,1).getDay()+6)%7, count=new Date(y,m+1,0).getDate();
  const names=weekDays().map(d=>d.toLocaleDateString(undefined,{weekday:'short'}));
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<span></span>');
  for(let n=1;n<=count;n++){
    const k=dayKey(new Date(y,m,n)), done=(data.days[k]?.workouts||[]).length>0;
    cells.push(`<span class="d${done?' done':''}${k===today()?' today':''}"${done?' title="Worked out"':''}>${n}</span>`);
  }
  return `
  <div class="overlay" id="overlay">
    <div class="month" role="dialog" aria-modal="true" aria-label="Month calendar">
      <div class="month-head">
        <h2>${now.toLocaleDateString(undefined,{month:'long', year:'numeric'})}</h2>
        <button type="button" class="x" data-close-month aria-label="Close the calendar">&times;</button>
      </div>
      <div class="month-grid">${names.map(n=>`<span class="wd">${n}</span>`).join('')}${cells.join('')}</div>
      <p class="legend"><i></i>Worked out</p>
    </div>
  </div>`;
}

/* Rough length of a ready-made workout: about 3 s a rep, holds as written, 30 s rest between sets and exercises. */
function planMinutes(p){
  let s=0;
  p.items.map(toExercise).forEach(w=>{
    s += w.kind==='cardio' ? (w.min||0)*60 : w.sets*((w.sec || w.reps*3) + 30);
  });
  return Math.round(s/60);
}
/* A workout card: name, minutes • exercises, difficulty (lit bolts out of 3) and when you last logged it. */
function planCard(id, title, level){
  const p=WORKOUTS.find(x=>x.id===id), last=data.profile.lastDone[id];
  const bolt='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
  const when=last ? (d=>`${d.getDate()} ${d.toLocaleDateString(undefined,{month:'short'})}`)(new Date(last+'T12:00')) : 'Not done yet';
  return `
    <div class="plan-card">
      <b>${esc(title)}</b>
      <span class="muted">${planMinutes(p)} min &bull; ${p.items.length} exercises</span>
      <span class="plan-foot">
        <span class="bolts" aria-label="Difficulty ${level} of 3">${[1,2,3].map(i=>`<i class="${i<=level?'lit':''}">${bolt}</i>`).join('')}</span>
        <span class="muted">Last time: ${when}</span>
      </span>
    </div>`;
}

/* This week, Monday to Sunday. */
function weekDays(){
  const d=new Date(); d.setDate(d.getDate()-(d.getDay()+6)%7);
  return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return x; });
}

function greeting(){

/* Every exercise name the app knows: suggestions, ready-made workouts, your routines and everything you've logged. */

/* Search box results: workouts, your plans (routines) and exercises whose name contains what you typed. */
function paintResults(){
  const box=document.getElementById('results'); if(!box) return;

  const plans=data.profile.routines.map((r,i)=>[r,i]).filter(([r])=>has(r.name) || r.items.some(w=>has(w.name)));

    group('Your plans', plans.map(([r,i])=>`<button type="button" data-start="${i}"><span>${esc(r.name)}</span><small>tap to log</small></button>`)),
    group('Exercises', exercises.map(n=>`<button type="button" data-find-ex="${esc(n)}"><span>${esc(n)}</span><small>add &rsaquo;</small></button>`)),

  box.hidden=false;
}

/* Small line chart of [date, value] pairs, with an optional dashed goal line. */
function spark(pts, goal){
  const W=600, H=130, P=14, vals=pts.map(p=>p[1]);
  let lo=Math.min(...vals, goal??Infinity), hi=Math.max(...vals, goal??-Infinity);
  if(hi-lo<1){ lo-=0.5; hi+=0.5; }
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const first=vals[0], last=vals[vals.length-1], diff=last-first;
  const towardGoal = goal==null ? diff<=0 : Math.abs(last-goal)<=Math.abs(first-goal);
  const left = goal==null ? '' : Math.abs(last-goal)<0.05 ? ' · goal reached &#127881;' : ` · ${Math.abs(last-goal).toFixed(1)} kg to your ${goal} kg goal`;
  return `
    <p style="margin:0">Now <b>${last} kg</b> · <span style="color:${towardGoal?'var(--good)':'var(--warn)'}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>
      <span class="muted">since ${niceDate(pts[0][0])}${left}</span></p>
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight from ${first} to ${last} kg">
      ${goal!=null ? `<line x1="${P}" x2="${W-P}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="8 6"/>` : ''}
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="7" fill="var(--accent)"><title>${niceDate(p[0])}: ${p[1]} kg</title></circle>`).join('')}
    </svg>`;
}

      ? 'Your log is saved to your Claude account, so it is the same on your phone and your computer. Only you can see it.'
      : 'Your log is saved in this browser. Open your Fitness Log page in Claude to have it on your phone and computer.'}
      A backup file lets you keep a copy or bring in a log from somewhere else.</p>
    ${restore ? `
      <p style="margin:0 0 10px"><b>Replace everything with the backup from ${esc(restore.name)}?</b> It has ${Object.keys(restore.data.days).length} days of entries.</p>
      <div class="row"><button type="button" class="danger" id="restore-yes">Replace my log</button><button type="button" id="restore-no">Cancel</button></div>
    ` : `
      <div class="row">
        <button type="button" id="export">Download backup</button>
        <button type="button" id="import">Restore from backup</button>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </div>`}
  </section>`;
}

/* ============================================================
   Router + event handling
   ============================================================ */
/* Home is the page we built; Workout, Coach and Profile are empty for now.
   Health, History and Me still open with #health, #history and #me. */
const blank=()=>'';
const PAGES={home:workoutPage, workout:blank, coach:blank, profile:blank, health:healthPage, history:historyPage, me:mePage};
const app=document.getElementById('app');

function render(){
  const page=PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
  app.innerHTML=PAGES[page]();
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on', a.hash==='#'+page));
  paintTimer(); paintResults();
}
window.addEventListener('hashchange', ()=>{ armed=null; restore=null; monthOpen=false; render(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && monthOpen){ monthOpen=false; render(); } });

/* A change from your other device redraws the page, but not while you are typing in a box. */
let waiting=false;
const typing=()=>{ const a=document.activeElement; return a && app.contains(a) && a.matches('input,select'); };
function refresh(){ if(typing()) waiting=true; else render(); }
app.addEventListener('focusout', ()=>{ if(waiting) setTimeout(()=>{ if(!typing()){ waiting=false; render(); } }, 0); });

function download(){
  const name='fitness-backup-'+today()+'.json', json=JSON.stringify(data,null,2);
  if(cloud.downloads){
    cloud.downloads.save({filename:name, data:json}).then(()=>toast('Backup saved')).catch(e=>{ if(e?.code!=='declined') toast('The backup could not be saved here.'); });
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

app.addEventListener('click', e=>{
  if(e.target.id==='overlay'){ monthOpen=false; render(); return; }   // tap outside the calendar closes it
  const b=e.target.closest('button'); if(!b) return;
  const t=day(today()), p=data.profile;
  if(b.dataset.kind){ kind=b.dataset.kind; render(); document.getElementById('ex-name').focus(); }
  else if(b.dataset.openMonth!=null){ monthOpen=true; render(); document.querySelector('[data-close-month]').focus(); }
  else if(b.dataset.closeMonth!=null){ monthOpen=false; render(); }
  else if(b.dataset.editGoal!=null){ editGoal=!editGoal; render(); if(editGoal) document.getElementById('goal-days').focus(); }
  else if(b.dataset.focus){
    const row=document.querySelector('.focus-row'), x=row.scrollLeft;
    focus = focus===b.dataset.focus ? null : b.dataset.focus;   // tap again to hide
    render(); document.querySelector('.focus-row').scrollLeft=x;
  }
  else if(b.dataset.pick){ pick=b.dataset.pick; render(); }
  else if(b.dataset.findWorkout){
    pick=b.dataset.findWorkout; query=''; render();
    document.getElementById('workouts').scrollIntoView({behavior:'smooth', block:'start'});
  }
  else if(b.dataset.findEx){
    const name=b.dataset.findEx; query=''; render();
    const box=document.getElementById('ex-name');
    box.value=name; box.scrollIntoView({behavior:'smooth', block:'center'}); box.focus({preventScroll:true});
  }
  else if(b.dataset.plan!=null){
    const plan=WORKOUTS.find(p=>p.id===pick);
    t.workouts.push(...plan.items.map(toExercise)); p.lastDone[plan.id]=today();
    saveDay(today()); saveProfile(); render();
    toast(`Logged ${plan.name} workout`);
  }
  else if(b.dataset.del!=null){ t.workouts.splice(+b.dataset.del,1); saveDay(today()); render(); }
  else if(b.dataset.start!=null){
    const r=p.routines[+b.dataset.start];
    t.workouts.push(...r.items.map(copyExercise)); saveDay(today()); render();
    toast(`Logged ${r.name}`);
  }
  else if(b.dataset.rest!=null){ +b.dataset.rest ? startTimer(+b.dataset.rest) : stopTimer(); }
  else if(b.dataset.water){ t.water=Math.max(0, t.water+ +b.dataset.water); saveDay(today()); render(); }
  else if(b.dataset.delroutine!=null){
    const i=+b.dataset.delroutine;
    if(armed!=='r'+i){ armed='r'+i; render(); return; }
    const [r]=p.routines.splice(i,1); armed=null; saveProfile(); render(); toast(`Deleted ${r.name}`);
  }
  else if(b.dataset.delitem){
    const [i,j]=b.dataset.delitem.split(':').map(Number);
    p.routines[i].items.splice(j,1); saveProfile(); render();
  }
  else if(b.id==='export') download();
  else if(b.id==='import') document.getElementById('file').click();
  else if(b.id==='restore-no'){ restore=null; render(); }
  else if(b.id==='restore-yes'){
    const old=Object.keys(data.days);
    data=restore.data; restore=null;
    saveLocal();
    if(cloud.col){
      const months=new Set([...old, ...Object.keys(data.days)].map(k=>k.slice(0,7)));
      months.forEach(queueMonth);
      cloud.ids.forEach(id=>{ if(id.startsWith('m-') && !months.has(id.slice(2))) queue(id, null); });
      queue('profile', ()=>clone(data.profile));
    }
    render(); toast('Backup restored');
  }
});

/* Typing in the search box only redraws the results, so the box keeps its place and focus. */
app.addEventListener('input', e=>{ if(e.target.id==='search'){ query=e.target.value; paintResults(); } });
app.addEventListener('keydown', e=>{ if(e.target.id==='search' && e.key==='Escape'){ query=''; e.target.value=''; paintResults(); } });

app.addEventListener('change', e=>{
  if(e.target.id!=='file' || !e.target.files[0]) return;
  const f=e.target.files[0];
  f.text().then(txt=>{
    const d=JSON.parse(txt);
    if(!d || typeof d.days!=='object') throw new Error('not a backup');
    restore={name:f.name, data:normalize(d)}; render();
  }).catch(()=>toast('That file is not a Fitness Log backup.'));
});

app.addEventListener('submit', e=>{
  e.preventDefault();
  const f=new FormData(e.target), t=day(today()), p=data.profile;
  if(e.target.id==='add'){
    const name=String(f.get('name')).trim(); if(!name) return;
    const w = kind==='strength'
      ? {name, kind, sets:num(f.get('sets'))||1, reps:num(f.get('reps'))||0, weight:num(f.get('weight'))}
      : {name, kind, min:num(f.get('min')), km:num(f.get('km'))};
    t.workouts.push(w); saveDay(today()); render();
    document.getElementById('ex-name').focus();
  } else if(e.target.id==='weekgoal'){
    p.goals.days=Math.min(7, Math.max(1, Math.round(num(f.get('days'))||DEFAULT_GOALS.days)));
    editGoal=false; saveProfile(); render();
  } else if(e.target.id==='checkin'){
    t.weight=num(f.get('weight')); t.sleep=num(f.get('sleep')); t.steps=num(f.get('steps'));
    saveDay(today()); render(); toast('Check-in saved');
  } else if(e.target.id==='saveas'){
    const name=String(f.get('name')).trim(); if(!name) return;
    const items=t.workouts.map(copyExercise), old=p.routines.find(r=>r.name.toLowerCase()===name.toLowerCase());
    if(old) old.items=items; else p.routines.push({name, items});
    saveProfile(); render(); toast(old ? `Updated ${old.name}` : `Saved ${name}`);
  } else if(e.target.id==='profile'){
    p.name=String(f.get('name')).trim();
    p.goals={...p.goals, water:num(f.get('water'))||DEFAULT_GOALS.water, steps:num(f.get('steps'))||DEFAULT_GOALS.steps,
             sleep:num(f.get('sleep'))||DEFAULT_GOALS.sleep, weight:num(f.get('weight'))};
    saveProfile(); render(); toast('Saved');
  }
});

render();
connect();
</script>
</body>
</html>
