<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one phone-width column of sections (search, weekly goal, challenge, body focus, filters,
     custom workout, recommended, just for you) above a fixed bottom bar. */
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#15171c; --muted:#7a808c; --body:#3b4254;
    --accent:#2f5cf0; --accent-soft:#eaf0ff; --on-accent:#ffffff; --chip:#eceef2;
    --line:#e6e8ee; --edge:#d5d9e2; --faint:#a3a9b5;
    --good:#16a34a; --warn:#ea580c; --water:#0ea5e9; --danger:#dc2626; --flame:#f0525a;
    --font:"Outfit",system-ui,"Segoe UI",Roboto,sans-serif;
    color-scheme:light;
  }
  /* dark theme follows the phone's setting */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1118; --panel:#181c26; --ink:#eef0f5; --muted:#9aa1ae; --body:#c9cfdc;
      --accent:#5b82ff; --accent-soft:#1c2a4d; --chip:#222836;
      --line:#262d3b; --edge:#343c4d; --faint:#6c768c;
      --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1118; --panel:#181c26; --ink:#eef0f5; --muted:#9aa1ae; --body:#c9cfdc;
    --accent:#5b82ff; --accent-soft:#1c2a4d; --chip:#222836;
    --line:#262d3b; --edge:#343c4d; --faint:#6c768c;
    --good:#34d399; --warn:#fb923c; --water:#38bdf8; --danger:#f87171; color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink)}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:var(--panel);border:2px solid var(--edge);border-radius:8.5px;padding:6px 12px;font-weight:600}
  button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.danger{border-color:var(--danger);color:var(--danger)}
  input,select{background:var(--bg);border:2px solid var(--edge);border-radius:8.5px;padding:7px 8.5px;width:100%;min-width:0}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label{display:flex;flex-direction:column;gap:3.5px;font-size:11px;font-weight:600;color:var(--muted)}
  .plain{border:0;background:none;padding:0;border-radius:0;font-weight:inherit;text-align:left}

  header{display:flex;align-items:center;justify-content:space-between;gap:8.5px;padding:17px 17px 3.5px;max-width:646px;margin:0 auto}
  header .brand{font-weight:800;font-size:24px;letter-spacing:.01em;text-transform:uppercase}
  header .right{display:flex;align-items:center;gap:10px}
  .flame{width:25.5px;height:29px;display:block}
  .sync{font-size:11px;color:var(--muted)}
  .sync.ok{color:var(--good)} .sync.bad{color:var(--warn)}

  /* bottom bar */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:7px 3.5px calc(7px + env(safe-area-inset-bottom, 0px))}
  .bottombar a{display:flex;flex-direction:column;align-items:center;gap:3.5px;padding:3.5px 0;font-size:11px;font-weight:500;color:var(--muted)}
  .bottombar a.on{color:var(--accent)}
  .bottombar svg{width:24px;height:24px}

  main{max-width:646px;margin:0 auto;padding:10px 13.5px calc(93.5px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:22px}
  h2{font-size:17px;margin:0 0 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13.5px 15.5px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8.5px;align-items:flex-end;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(93.5px,1fr));gap:8.5px}
  .x{border:0;background:none;color:var(--faint);font-size:20.5px;padding:2px 7px;line-height:1}
  .x:hover{color:var(--danger)}
  .empty{color:var(--muted);text-align:center;padding:8.5px 0;margin:0}
  .note{margin:0 0 10px;color:var(--muted);line-height:1.45}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8.5px;margin:0 0 12px}
  .sec-head h2{font-size:19.5px;font-weight:700;margin:0}
  .more{border:0;background:none;padding:0;color:var(--accent);font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:2px}
  /* rows that scroll sideways and run to the screen edge */
  .hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -13.5px;padding:0 13.5px;scroll-snap-type:x mandatory;scroll-padding-inline:13.5px}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll > *{flex:none;scroll-snap-align:start}

  /* --- logged entries (history, routines) --- */
  ul.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  ul.log li{display:flex;align-items:center;gap:8.5px;padding:8.5px 10px;border:1px solid var(--line);border-radius:8.5px;background:var(--bg)}
  ul.log .what{flex:1;min-width:0;overflow-wrap:anywhere}
  ul.log .what b{display:block}
  ul.log .what span{font-size:12px;color:var(--muted)}

  /* --- search --- */
  .search{position:relative}
  .search svg{position:absolute;left:15.5px;top:50%;transform:translateY(-50%);width:20.5px;height:20.5px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
  .search input{background:var(--chip);border:1px solid var(--edge);padding:12px 15.5px 12px 46px;font-size:15.5px;border-radius:849px}
  .search input::placeholder{color:var(--muted)}
  .results{display:flex;flex-direction:column;gap:12px;margin-top:-12px}
  .results h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px}
  .results .hits{display:flex;flex-direction:column;gap:5px}
  .results .hits button{display:flex;justify-content:space-between;align-items:center;gap:8.5px;text-align:left;width:100%;overflow-wrap:anywhere;border-width:1px}
  .results .hits small{font-weight:500;color:var(--muted);font-size:11px;flex:none}

  /* --- weekly goal --- */
  .goal-card{background:var(--panel);border-radius:15.5px;padding:15.5px 15.5px 13.5px}
  .goal-head{display:flex;align-items:center;justify-content:space-between;gap:8.5px;font-size:18.5px;font-weight:700;margin:0 0 12px}
  .goal-count{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .goal-count span{font-size:15.5px;font-weight:600}
  .goal-count b{font-size:24px;font-weight:700;color:var(--accent)}
  .pencil{border:0;background:none;padding:3.5px;line-height:0}
  .pencil svg{width:17px;height:17px;fill:var(--faint)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:3.5px;text-align:center;width:100%;border:0;background:none;padding:0;font-weight:400}
  .week b{display:grid;place-items:center;width:37.5px;height:37.5px;margin:0 auto;border-radius:50%;font-size:16px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  .week .later b{color:var(--muted)}
  .week .today b{border:2px solid color-mix(in srgb, var(--accent) 35%, transparent);color:var(--accent)}

  /* --- month calendar pop-up and bottom sheets --- */
  .overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:13.5px;background:rgb(0 0 0 / .45)}
  .overlay.bottom{place-items:end center;padding:0}
  .month{width:min(100%,374px);background:var(--panel);border:1px solid var(--line);border-radius:13.5px;padding:13.5px 15.5px 15.5px}
  .month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .month-head h2{margin:0}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
  .month-grid .wd{font-size:11px;color:var(--muted);padding-bottom:3.5px}
  .month-grid .d{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:13.5px;font-variant-numeric:tabular-nums}
  .month-grid .d.done{background:var(--accent);color:var(--on-accent);font-weight:700}
  .month-grid .d.today{outline:2px solid var(--accent);outline-offset:2px}
  .legend{display:flex;align-items:center;gap:7px;margin:12px 0 0;font-size:12px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .sheet{width:min(100%,476px);max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18.5px 18.5px 0 0;padding:15.5px 15.5px calc(15.5px + env(safe-area-inset-bottom, 0px))}
  .sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:13.5px}
  .sheet-head .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3.5px}
  .sheet-head h2{font-size:18.5px;margin:0}
  .steps{list-style:none;margin:0 0 15.5px;padding:0;display:flex;flex-direction:column}
  .steps li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
  .steps li span{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .bigbtn{width:100%;border:0;border-radius:849px;padding:13.5px;font-size:16px;font-weight:800;letter-spacing:.02em;background:var(--accent);color:var(--on-accent)}

  /* --- challenge cards --- */
  .ch{position:relative;display:flex;flex-direction:column;flex:1;width:74%;max-width:285.5px;min-height:240px;border-radius:15px;padding:17.5px 12.5px 12.5px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#4d86ff,#2450e6);margin-top:8px}
  .ch-photo{position:absolute;right:0;top:0;width:52%;height:78%;background-size:cover;background-position:center top;-webkit-mask-image:linear-gradient(to right,transparent,#000 30%),linear-gradient(to top,transparent,#000 25%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 30%),linear-gradient(to top,transparent,#000 25%);mask-composite:intersect}
  .ch h3 .dot{display:inline-block;width:.6em;height:.6em;vertical-align:.05em}
  .ch .small,.ch h3,.ch p.sub{text-shadow:0 1px 5px rgb(0 0 0 / .35)}
  .ch .deco{position:absolute;right:-20.5px;top:7px;width:129px;height:129px;opacity:.16;fill:#fff;pointer-events:none}
  .ch-wrap .tag{position:absolute;left:11px;top:0;background:#fde3c3;color:#15171c;font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:5px 9.5px;border-radius:8px 8px 8px 0}
  .ch-wrap{position:relative;flex:none;display:flex;flex-direction:column;width:74%;max-width:285.5px;scroll-snap-align:start}
  .ch-wrap .ch{width:100%}
  .ch.pic h3{max-width:62%}
  .ch h3{position:relative;font-size:21.5px;line-height:1.05;font-weight:800;margin:4px 0 12.5px;text-transform:uppercase;text-wrap:balance}
  .ch .small{position:relative;font-size:11.5px;font-weight:500;margin:17.5px 0 0}
  .ch p.sub{position:relative;font-size:11px;line-height:1.3;margin:auto 0 12.5px}
  .facts{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:9.5px 7px;margin-bottom:13.5px}
  .facts div{display:flex;align-items:center;gap:7px;min-width:0}
  .facts i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:rgb(255 255 255 / .85)}
  .facts i svg{width:15px;height:15px;fill:#2f5cf0}
  .facts b{display:block;font-size:11px}
  .facts small{display:block;font-size:9px;opacity:.75}
  .ch .go{position:relative;width:100%;display:flex;align-items:center;justify-content:center;border:0;border-radius:679px;background:#fff;color:#2f5cf0;font-size:13.5px;font-weight:800;padding:9.5px 34px}
  .ch .facts + .go{margin-top:auto}
  .ch .go svg{position:absolute;right:9.5px;width:17.5px;height:17.5px}

  /* --- body focus --- */
  .bf{display:flex;gap:8.5px;overflow-x:auto;scrollbar-width:none;margin:0 -13.5px 5px;padding:0 13.5px}
  .bf::-webkit-scrollbar{display:none}
  .bf button{flex:none;white-space:nowrap;border:1.5px solid transparent;background:var(--chip);color:var(--muted);border-radius:849px;padding:7px 18.5px;font-size:15.5px;font-weight:500}
  .bf button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .wrow{display:flex;align-items:center;gap:13.5px;width:100%;padding:7px 0}
  .wrow .winfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:5px 0}
  .wrow + .wrow .winfo{border-top:1px solid var(--line);padding-top:12px}
  .winfo b{font-size:16px;font-weight:700}
  .winfo .meta{font-size:13.5px;color:var(--muted)}
  .last{background:var(--chip);color:var(--muted);font-size:13px;padding:3px 7px;border-radius:5px}
  .tile{flex:none;display:grid;place-items:center;width:78px;height:78px;border-radius:13.5px;background:linear-gradient(140deg,#7fb0ff,#2f5cf0)}
  .tile.l2{background:linear-gradient(140deg,#4d7cff,#1d3fbf)}
  .tile.l3{background:linear-gradient(140deg,#2a3f8f,#0d1640)}
  .tile svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
  .tile.photo{background-size:cover;background-position:center}
  .tile.sm{width:54.5px;height:54.5px;border-radius:12px}
  .bolts{display:flex;gap:2px}
  .bolts svg{width:17px;height:17px;fill:var(--edge)}
  .bolts .lit svg{fill:var(--accent)}

  /* --- filter chips: two rows that scroll sideways together --- */
  .filters{display:flex;flex-direction:column;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -13.5px;padding:0 13.5px}
  .filters::-webkit-scrollbar{display:none}
  .filters .r{display:flex;gap:10px;width:max-content}
  .filters button{display:flex;align-items:center;gap:10px;border:0;background:var(--chip);border-radius:10px;padding:12px 15.5px;font-size:15.5px;font-weight:400;white-space:nowrap}
  .filters svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* --- custom workout and recommended banners --- */
  .banner{position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:18.5px;padding:25.5px 18.5px;color:#fff;text-align:left;overflow:hidden;background:linear-gradient(120deg,#4e9bff 0%,#3b6ff5 45%,#2450e6 100%)}
  .banner .h{display:block;font-size:30.5px;line-height:1.05;font-weight:800;margin:0 0 17px;text-transform:uppercase}
  .banner .pill{display:inline-block;background:#fff;color:#2450e6;font-size:18.5px;font-weight:800;border-radius:849px;padding:10px 35.5px}
  .pen{position:relative;flex:none;width:85px;height:85px}
  .pen i{position:absolute;inset:0;border-radius:18.5px;background:rgb(255 255 255 / .3);transform:rotate(14deg) translate(12px,-7px)}
  .pen span{position:absolute;inset:0;display:grid;place-items:center;border-radius:18.5px;background:rgb(255 255 255 / .35);border:1px solid rgb(255 255 255 / .5)}
  .pen svg{width:42.5px;height:42.5px;fill:#fff}
  .banner.soft{background:linear-gradient(110deg,#8fb0dc,#b9d1ee 60%,#d7e6f6);padding:22px 18.5px}
  .banner.soft .h{font-size:27px;margin:0 0 7px}
  .banner.soft .p{display:block;font-size:14.5px;margin:0 0 13.5px;max-width:16em;opacity:.95}
  .banner.soft .count{display:inline-block;background:rgb(40 70 120 / .25);font-size:14.5px;font-weight:700;border-radius:849px;padding:7px 13.5px}
  .banner.soft .deco{position:absolute;right:-17px;bottom:-25.5px;width:144.5px;height:144.5px;fill:#fff;opacity:.35;pointer-events:none}

  /* --- just for you --- */
  .jfy{width:132.5px;display:flex;flex-direction:column;gap:5px}
  .jfy .tile{width:132.5px;height:95px}
  .jfy b{font-size:13.5px;font-weight:600}
  .jfy span{font-size:12px;color:var(--muted)}

  /* --- stats, health, history --- */
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .glasses{display:flex;gap:5px;flex-wrap:wrap;flex:1}
  .glass{width:22px;height:29px;border:2px solid var(--water);border-radius:3.5px 3.5px 7px 7px}
  .glass.full{background:var(--water)}
  .bar{height:8.5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--good)}
  svg.spark{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
  .day{border-top:1px solid var(--line);padding:10px 0}
  .day:first-child{border-top:0;padding-top:0}
  .day h3{font-size:13.5px;margin:0 0 5px;display:flex;justify-content:space-between;gap:8.5px}
  .day h3 small{font-weight:500;color:var(--muted)}
  .day p{margin:2px 0;font-size:13px;color:var(--body);overflow-wrap:anywhere}
  .routine{border-top:1px solid var(--line);padding:12px 0}
  .routine:first-of-type{border-top:0;padding-top:0}
  .routine h3{font-size:14.5px;margin:0 0 7px;display:flex;justify-content:space-between;align-items:center;gap:8.5px;overflow-wrap:anywhere}

  .toast{position:fixed;z-index:20;left:50%;bottom:calc(81.5px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8.5px 13.5px;border-radius:8.5px;font-weight:600;max-width:calc(100% - 27px);text-align:center}
  @media (max-width:400px){ header .brand{font-size:20.5px} .ch h3{font-size:19.5px} .banner .h{font-size:25.5px} }
</style>
</head>
<body>
<header>
  <a class="brand" href="#training">Fitness Log</a>
  <div class="right">
    <span class="sync" id="sync"></span>
    <svg class="flame" id="flame" viewBox="0 0 24 28" role="img" aria-label="Streak"><title>Streak</title>
      <path fill="var(--flame)" d="M12 1c1 4.5-1.3 6.6-3.3 8.8C6.5 12.2 4.5 14.8 4.5 18.6 4.5 23.2 7.9 27 12 27s7.5-3.6 7.5-8.4c0-3.4-1.4-5.8-3-7.8.2 2.1-.6 3.7-2 4.6.7-5.3-.8-10.7-2.5-15.4z"/></svg>
  </div>
</header>
<main id="app"></main>
<nav class="bottombar" id="tabs">
  <a href="#training"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9.5" y="1.5" width="5" height="2.4" rx="1.2" fill="currentColor"/><circle cx="12" cy="13.5" r="8.5" fill="currentColor"/><path d="M12 13.5V9.2M12 13.5l-2.6 2.3" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Training</a>
  <a href="#discover"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M16.2 7.8 13.6 13.6 7.8 16.2 10.4 10.4z" fill="var(--panel)"/></svg>Discover</a>
  <a href="#meal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v6.2c0 1.6 1.2 2.8 2.8 2.8M10.6 2.5v6.2c0 1.6-1.2 2.8-2.8 2.8m0 0V21.5M7.8 2.5v5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M15.5 21.5V2.5c2.8 1.3 4 4.6 4 8.6v2.4h-4" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Meal</a>
  <a href="#report"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="5" height="10" rx="1.6" fill="currentColor"/><rect x="9.5" y="3" width="5" height="18" rx="1.6" fill="currentColor"/><rect x="16" y="8" width="5" height="13" rx="1.6" fill="currentColor"/></svg>Report</a>
  <a href="#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.5" fill="currentColor"/><path d="M3.5 21.5c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z" fill="currentColor"/></svg>Settings</a>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* A light or dark choice made earlier is still honoured; otherwise the phone's setting is used. */
(function(){
  let saved=null; try{ saved=localStorage.getItem('theme'); }catch(e){}

const REST=15;   // seconds of rest after each exercise

for(const [part,list] of Object.entries(BODY)) LEVELS.forEach((L,i)=>{
  const [mins,count]=SIZES[part][i], pool=list.slice(0,L.n);
  const work=mins*60/count-REST;   // seconds of work per exercise so the whole workout takes about `mins`
  WORKOUTS.push({id:slug(part)+'-'+(i+1), title:part+' '+L.name, part, level:i+1, mins,
    items:Array.from({length:count},(_,j)=>{ const [name,,unit]=pool[j%pool.length];
      return unit==='s' ? [name, 1, Math.max(10, Math.round(work/5)*5), 's'] : [name, 1, Math.max(4, Math.round(work/3))]; })});
});

const toExercise=([name,a,b,unit])=> b==='min' ? {name, kind:'cardio', min:a, km:null}

const clone=o=>JSON.parse(JSON.stringify(o));
function normProfile(p){
  p=p && typeof p==='object' ? p : {};
  return {name:typeof p.name==='string' ? p.name : '', goals:{...DEFAULT_GOALS, ...(p.goals||{})}, routines:Array.isArray(p.routines) ? p.routines : [],
          lastDone:p.lastDone && typeof p.lastDone==='object' ? p.lastDone : {},       // workout id -> day you last logged it
          challenges:p.challenges && typeof p.challenges==='object' ? p.challenges : {}}; // challenge id -> days done
}
function normalize(d){
  d=d && typeof d==='object' ? d : {};
  const days={};
  for(const [k,x] of Object.entries(d.days||{})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || !x) continue;
    days[k]={workouts:Array.isArray(x.workouts) ? x.workouts : [], water:+x.water||0, weight:x.weight??null, sleep:x.sleep??null, steps:x.steps??null};
  }
  return {days, profile:normProfile(d.profile)};
}

let data=normalize(null);

function describe(w){
  if(w.kind==='cardio') return [w.min && w.min+' min', w.km && w.km+' km'].filter(Boolean).join(' · ') || 'Cardio';
  let s=(w.sets||1)+' × '+(w.sec ? w.sec+' s' : (w.reps||0)+' reps');
  if(w.weight) s+=' @ '+w.weight+' kg';
  return s;
}
const copyExercise=w=>w.kind==='cardio' ? {name:w.name, kind:'cardio', min:w.min??null, km:w.km??null} : {name:w.name, kind:'strength', sets:w.sets||1, reps:w.reps||0, ...(w.sec ? {sec:w.sec} : {}), weight:w.weight??null};

/* Consecutive days with a workout, ending today (or yesterday, so the streak survives until today is over). */
function streak(){
  const d=new Date(), has=k=>(data.days[k]?.workouts||[]).length>0;
  if(!has(dayKey(d))) d.setDate(d.getDate()-1);
  let n=0;
  while(has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function workoutDaysThisWeek(){
  const d=new Date(), back=(d.getDay()+6)%7;   // weeks start on Monday
  let n=0;
  for(let i=0;i<=back;i++){ const k=dayKey(d); if((data.days[k]?.workouts||[]).length) n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ============================================================
   Sync to your Claude account (only when opened inside Claude).
   Your private space holds one document per month ('m-2026-10': {days})
   plus 'profile'. Writes to one document go one at a time, and a burst
   of edits is folded into the next write.
   ============================================================ */
const cloud={col:null, live:false, ids:new Set(), pending:new Map(), busy:new Set(), error:'', viewerName:'', downloads:null};
const monthBody=m=>{ const days={}; for(const k in data.days) if(k.startsWith(m) && hasContent(data.days[k])) days[k]=data.days[k]; return {days}; };
const queueMonth=m=>queue('m-'+m, ()=>monthBody(m));

function queue(id, build){
  if(!cloud.col) return;
  cloud.pending.set(id, build); flush(id); paintSync();
}
async function flush(id){
  if(cloud.busy.has(id) || !cloud.pending.has(id)) return;
  const build=cloud.pending.get(id); cloud.pending.delete(id); cloud.busy.add(id);
  const ref=cloud.col.doc(id), write=()=>build ? ref.set(build()) : ref.delete();
  try{
    await write().catch(e=>{ if(e?.code!=='unavailable') throw e; return new Promise(r=>setTimeout(r,800+Math.random()*1200)).then(write); });
    cloud.error='';
  }catch(e){
    cloud.error = e?.code==='quota_exceeded' ? 'Cloud space full' : 'Not synced';
  }finally{
    cloud.busy.delete(id); paintSync(); flush(id);
  }
}

/* Only problems are shown; a working sync stays quiet. */
function paintSync(){
  const el=document.getElementById('sync');
  if(cloud.error){ el.textContent='⚠️ '+cloud.error; el.className='sync bad'; el.title='Your changes are still saved on this device.'; }
  else { el.textContent=''; el.title=''; }
}

async function connect(){
  if(!window.claude?.use) return;   // opened as a plain file: this browser only
  const [db, user, downloads]=await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  cloud.downloads=downloads;
  if(user) cloud.viewerName=((await user.name())||'').split(' ')[0];
  const id=user && await user.id();
  if(!db || !id) return;
  const col=db.collection('data/users/'+id);
  let merged=false;
  col.limit(1000).onSnapshot(snap=>{
    if(!merged && snap.metadata.fromCache) return;   // wait for the real answer before merging
    const days={}, ids=new Set(); let profile=null;
    snap.docs.forEach(d=>{
      ids.add(d.id); const b=clone(d.data()||{});
      if(d.id==='profile') profile=b;
      else if(d.id.startsWith('m-')) Object.assign(days, normalize({days:b.days}).days);
    });
    cloud.ids=ids;
    // documents with a write still on its way keep this device's version
    const held=new Set([...cloud.pending.keys(), ...cloud.busy]);
    for(const k in data.days) if(held.has('m-'+k.slice(0,7))) days[k]=data.days[k];
    for(const k in days) if(held.has('m-'+k.slice(0,7)) && !data.days[k]) delete days[k];
    const before=JSON.stringify(data), upload=new Set();
    if(!merged){
      // first connection: anything logged on this device but not in your account is added to it
      for(const k in data.days) if(!days[k] && hasContent(data.days[k])){ days[k]=data.days[k]; upload.add(k.slice(0,7)); }
      merged=true; cloud.col=col; cloud.live=true;
      if(!profile && JSON.stringify(data.profile)!==JSON.stringify(normProfile(null))) cloud.pending.set('profile', ()=>clone(data.profile));
    }
    data.days=days;
    if(profile && !held.has('profile')) data.profile=normProfile(profile);
    saveLocal();
    upload.forEach(queueMonth);
    if(cloud.pending.has('profile')) flush('profile');
    paintSync();
    if(JSON.stringify(data)!==before) refresh();
  }, ()=>{ cloud.col=null; cloud.live=false; cloud.error='Not synced'; paintSync(); });
}

/* Length of a workout: the minutes it was built for, or about 3 s a rep and holds as written, with rest after each set. */
function planMinutes(p){
  if(p.mins) return p.mins;
  let s=0;
  p.items.map(toExercise).forEach(w=>{ s += w.kind==='cardio' ? (w.min||0)*60 : w.sets*((w.sec || w.reps*3) + REST); });
  return Math.round(s/60);
}
/* How much of one exercise: x15 or 0:30, with the rounds in front when there is more than one. */
const amount=([,sets,amt,unit])=>(sets>1 ? sets+' × ' : '')+(unit==='s' ? Math.floor(amt/60)+':'+pad(amt%60) : '×'+amt);

/* This week, Monday to Sunday. */
function weekDays(){
  const d=new Date(); d.setDate(d.getDate()-(d.getDay()+6)%7);
  return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return x; });
}

/* The big calendar for this month; days with a workout are filled in. */
function monthCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const lead=(new Date(y,m,1).getDay()+6)%7, count=new Date(y,m+1,0).getDate();
  const names=weekDays().map(d=>d.toLocaleDateString(undefined,{weekday:'short'}));
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<span></span>');
  for(let n=1;n<=count;n++){

/* Small line chart of [date, value] pairs, with an optional dashed goal line. */
function spark(pts, goal){
  const W=600, H=130, P=14, vals=pts.map(p=>p[1]);
  let lo=Math.min(...vals, goal??Infinity), hi=Math.max(...vals, goal??-Infinity);
  if(hi-lo<1){ lo-=0.5; hi+=0.5; }
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const first=vals[0], last=vals[vals.length-1], diff=last-first;
  const towardGoal = goal==null ? diff<=0 : Math.abs(last-goal)<=Math.abs(first-goal);
  const left = goal==null ? '' : Math.abs(last-goal)<0.05 ? ' · goal reached &#127881;' : ` · ${Math.abs(last-goal).toFixed(1)} kg to your ${goal} kg goal`;
  return `
    <p style="margin:0">Now <b>${last} kg</b> · <span style="color:${towardGoal?'var(--good)':'var(--warn)'}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>
      <span class="muted">since ${niceDate(pts[0][0])}${left}</span></p>
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight from ${first} to ${last} kg">
      ${goal!=null ? `<line x1="${P}" x2="${W-P}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="2" stroke-dasharray="8 6"/>` : ''}
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="7" fill="var(--accent)"><title>${niceDate(p[0])}: ${p[1]} kg</title></circle>`).join('')}
    </svg>`;
}

/* A change from your other device redraws the page, but not while you are typing in a box. */
let waiting=false;
const typing=()=>{ const a=document.activeElement; return a && app.contains(a) && a.matches('input,select'); };
function refresh(){ if(typing()) waiting=true; else render(); }
app.addEventListener('focusout', ()=>{ if(waiting) setTimeout(()=>{ if(!typing()){ waiting=false; render(); } }, 0); });

function download(){
  const name='fitness-backup-'+today()+'.json', json=JSON.stringify(data,null,2);
  if(cloud.downloads){
    cloud.downloads.save({filename:name, data:json}).then(()=>toast('Backup saved')).catch(e=>{ if(e?.code!=='declined') toast('The backup could not be saved here.'); });
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* Redraw, keeping the sideways scroll position of rows such as Body Focus. */
function renderKeepScroll(){
  const sel=['.bf','.hscroll','.filters'], keep=sel.map(s=>[...document.querySelectorAll(s)].map(el=>el.scrollLeft));
  const y=window.scrollY; render();
  sel.forEach((s,i)=>document.querySelectorAll(s).forEach((el,j)=>el.scrollLeft=keep[i][j]||0));
  window.scrollTo(0,y);
}

app.addEventListener('click', e=>{
  if(e.target.id==='overlay'){ monthOpen=false; render(); return; }          // tap outside the calendar closes it
  if(e.target.id==='sheet-overlay'){ sheet=null; renderKeepScroll(); return; } // tap outside the sheet closes it
  const b=e.target.closest('button'); if(!b) return;
  const t=day(today()), p=data.profile;
  if(b.dataset.openMonth!=null){ monthOpen=true; render(); document.querySelector('[data-close-month]').focus(); }
  else if(b.dataset.closeMonth!=null){ monthOpen=false; render(); }
  else if(b.dataset.editGoal!=null){ editGoal=!editGoal; render(); if(editGoal) document.getElementById('goal-days').focus(); }
  else if(b.dataset.focus){ focus=b.dataset.focus; renderKeepScroll(); }
  else if(b.dataset.openWorkout){ sheet={type:'workout', id:b.dataset.openWorkout}; renderKeepScroll(); }
  else if(b.dataset.openChallenge){
    const c=CHALLENGES.find(x=>x.id===b.dataset.openChallenge);
    if((p.challenges[c.id]||0)>=c.days){ toast(`You finished ${c.title}!`); return; }
    sheet={type:'challenge', id:c.id}; renderKeepScroll();
  }
  else if(b.dataset.filter){ sheet={type:'filter', key:b.dataset.filter}; renderKeepScroll(); }
  else if(b.dataset.closeSheet!=null){ sheet=null; renderKeepScroll(); }
  else if(b.dataset.soon!=null) toast('Coming soon');
  else if(b.dataset.log!=null){
    let title;
    if(sheet.type==='challenge'){
      const c=CHALLENGES.find(x=>x.id===sheet.id), n=nextDay(c), w=challengeDay(c,n);
      t.workouts.push(...w.items.map(toExercise)); p.challenges[c.id]=n; title=w.title;
    } else {
      const w=workoutById(sheet.id);
      t.workouts.push(...w.items.map(toExercise)); p.lastDone[w.id]=today(); title=w.title;
    }
    sheet=null; saveDay(today()); saveProfile(); renderKeepScroll(); toast(`Logged ${title}`);
  }
  else if(b.dataset.start!=null){
    const r=p.routines[+b.dataset.start];
    t.workouts.push(...r.items.map(copyExercise)); saveDay(today()); render();
    toast(`Logged ${r.name}`);
  }
  else if(b.dataset.water){ t.water=Math.max(0, t.water+ +b.dataset.water); saveDay(today()); render(); }
  else if(b.dataset.delroutine!=null){
    const i=+b.dataset.delroutine;
    if(armed!=='r'+i){ armed='r'+i; render(); return; }
    const [r]=p.routines.splice(i,1); armed=null; saveProfile(); render(); toast(`Deleted ${r.name}`);
  }
  else if(b.dataset.delitem){
    const [i,j]=b.dataset.delitem.split(':').map(Number);
    p.routines[i].items.splice(j,1); saveProfile(); render();
  }
  else if(b.id==='export') download();
  else if(b.id==='import') document.getElementById('file').click();
  else if(b.id==='restore-no'){ restore=null; render(); }
  else if(b.id==='restore-yes'){
    const old=Object.keys(data.days);
    data=restore.data; restore=null;
    saveLocal();
    if(cloud.col){
      const months=new Set([...old, ...Object.keys(data.days)].map(k=>k.slice(0,7)));
      months.forEach(queueMonth);
      cloud.ids.forEach(id=>{ if(id.startsWith('m-') && !months.has(id.slice(2))) queue(id, null); });
      queue('profile', ()=>clone(data.profile));
    }
    render(); toast('Backup restored');
  }
});

/* Typing in the search box only redraws the results, so the box keeps its place and focus. */
app.addEventListener('input', e=>{ if(e.target.id==='search'){ query=e.target.value; paintResults(); } });
app.addEventListener('keydown', e=>{ if(e.target.id==='search' && e.key==='Escape'){ query=''; e.target.value=''; paintResults(); } });

app.addEventListener('change', e=>{
  if(e.target.id!=='file' || !e.target.files[0]) return;
  const f=e.target.files[0];
  f.text().then(txt=>{
    const d=JSON.parse(txt);
    if(!d || typeof d.days!=='object') throw new Error('not a backup');
    restore={name:f.name, data:normalize(d)}; render();
  }).catch(()=>toast('That file is not a Fitness Log backup.'));
});

app.addEventListener('submit', e=>{
  e.preventDefault();
  const f=new FormData(e.target), t=day(today()), p=data.profile;
  if(e.target.id==='weekgoal'){
    p.goals.days=Math.min(7, Math.max(1, Math.round(num(f.get('days'))||DEFAULT_GOALS.days)));
    editGoal=false; saveProfile(); render();
  } else if(e.target.id==='checkin'){
    t.weight=num(f.get('weight')); t.sleep=num(f.get('sleep')); t.steps=num(f.get('steps'));
    saveDay(today()); render(); toast('Check-in saved');
  } else if(e.target.id==='profile'){
    p.name=String(f.get('name')).trim();
    p.goals={...p.goals, water:num(f.get('water'))||DEFAULT_GOALS.water, steps:num(f.get('steps'))||DEFAULT_GOALS.steps,
             sleep:num(f.get('sleep'))||DEFAULT_GOALS.sleep, weight:num(f.get('weight'))};
    saveProfile(); render(); toast('Saved');
  }
});

render();
connect();
</script>
</body>
</html>
